<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>برمجة | Parmaga</title>

  <meta
    name="description"
    content="منصة تعليمية لتعلّم البرمجة بالفهم، خطوة بخطوة، مع الأستاذ عمرو عبد السلام."
  >

  <meta name="theme-color" content="#050505">

  <link
  rel="apple-touch-icon"
  type="image/png"
  sizes="180x180"
  href="/assets/images/fav180.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="/assets/images/fav32.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="32x32"
  href="/assets/images/fav32D.png"
  media="(prefers-color-scheme: dark)"
>

<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="/assets/images/fav16.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="/assets/images/fav16D.png"
  media="(prefers-color-scheme: dark)"
>

  <link rel="canonical" href="https://parmaga.com/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="برمجة | Parmaga">
  <meta
    property="og:description"
    content="نتعلم البرمجة بالفهم، لا بالحفظ."
  >
  <meta property="og:url" content="https://parmaga.com/">
  <meta
    property="og:image"
    content="https://parmaga.com/assets/images/amr-abdelsalam-ad.png"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Tahoma, sans-serif;
    }

    main {
      width: min(100%, 1200px);
      margin: auto;
    }

    .advertisement {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100svh - 32px);
      margin: auto;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 18px 60px rgb(0 0 0 / 45%);
    }

    .fallback {
      padding: 24px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <picture>
      <img
        class="advertisement"
        src="assets/images/amr-abdelsalam-ad.png"
        alt="إعلان الأستاذ عمرو عبد السلام لتعليم البرمجة"
        width="1080"
        height="1350"
        fetchpriority="high"
      >
    </picture>

    <noscript>
      <p class="fallback">
        مرحبًا بك في منصة برمجة لتعلّم البرمجة بالفهم.
      </p>
    </noscript>
  </main>
</body>
</html>
