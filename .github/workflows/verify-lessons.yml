# Gate A. Verification only.
#
# This workflow never publishes, never writes, never commits, and never reaches
# the private custody repository, as required by ADR-0006 sections 2 and 6.
# GitHub Pages keeps serving the main branch directly and does not depend on
# this workflow in any way.
#
# All verification logic lives in tools/verify_lesson.py. This file only calls
# it and reads its exit code. No logic is duplicated here.

name: Verify lessons

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Gate A - Lesson verification
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Run the verification tool test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify published lessons
        run: python3 tools/verify_lesson.py .
