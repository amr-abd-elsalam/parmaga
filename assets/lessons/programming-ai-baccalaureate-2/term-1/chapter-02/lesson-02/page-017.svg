<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">لماذا نحتاج إليها؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Why Do We Need It?</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الموقع مفتوح للعالم،</tspan>
  <tspan x="950" dy="40">وكل <tspan font-weight="bold" fill="#17457f">باب مفتوح</tspan> فرصة للمهاجم.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A website is open to the world, and every</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">open door</tspan> is a chance for attackers.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">خادم <tspan font-weight="bold" fill="#c0392b">مخترَق</tspan> في الداخل = مهاجم «داخل البيت».</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">hacked</tspan> server inside = an attacker</tspan>
  <tspan x="120" dy="40">"inside the house."</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">خادم مخترَق في <tspan font-weight="bold" fill="#c0392b">المنطقة المعزولة</tspan> = مهاجم</tspan>
  <tspan x="950" dy="40">في غرفة مغلقة، أمامه <tspan font-weight="bold" fill="#2e7d32">جدار آخر.</tspan></tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A hacked server in the <tspan font-weight="bold" fill="#c0392b">DMZ</tspan> = an attacker</tspan>
  <tspan x="120" dy="40">in a closed room, facing <tspan font-weight="bold" fill="#2e7d32">another wall.</tspan></tspan>
</text>
</svg>
