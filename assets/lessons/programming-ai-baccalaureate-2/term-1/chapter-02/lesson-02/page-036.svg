</g>

<!-- Item 3 icon: public server with shield -->
<g transform="translate(862 940)">
  <rect x="4" y="4" width="28" height="48" rx="4" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M10 16 H22 M10 28 H22 M10 40 H22" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 22 L54 26 L54 37 Q54 49 42 54 Q30 49 30 37 L30 26 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 38 L41 43 L48 33" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam Traps</text>

<!-- Key sentence strip text -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">أي خيار فيه «وحده» أو «فقط» أو «جميع»</tspan>
  <tspan x="935" dy="40">أو «لا داعي للتحقق»، راجعه مرتين.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Any option with "alone," "only,"</tspan>
  <tspan x="140" dy="40">"all," or "no need to verify" —</tspan>
  <tspan x="140" dy="40">check it twice.</tspan>
</text>

<!-- Warning card: item 1 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">× <tspan font-weight="bold" fill="#17457f">جدار الحماية</tspan> <tspan font-weight="bold" fill="#c0392b">وحده</tspan> كافٍ:</tspan>
  <tspan x="935" dy="40">لا يرى الفيروس في الاتصال المسموح.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">× A <tspan font-weight="bold" fill="#17457f">firewall</tspan> <tspan font-weight="bold" fill="#c0392b">alone</tspan> is enough:</tspan>
  <tspan x="140" dy="40">it misses viruses in allowed traffic.</tspan>
</text>

<!-- Warning card: item 2 -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">× الـ VPN <tspan font-weight="bold" fill="#c0392b">تحذف</tspan> الفيروسات:</tspan>
  <tspan x="935" dy="40">هي تحمي الطريق، والحذف <tspan font-weight="bold" fill="#17457f">لبرنامج المكافحة.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">× A VPN <tspan font-weight="bold" fill="#c0392b">deletes</tspan> viruses: it protects</tspan>
  <tspan x="140" dy="40">the road; <tspan font-weight="bold" fill="#17457f">antivirus</tspan> deletes them.</tspan>
</text>

<!-- Warning card: item 3 -->
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">× الـ DMZ تعرّض <tspan font-weight="bold" fill="#c0392b">جميع</tspan> الخوادم:</tspan>
  <tspan x="935" dy="40">تعرّض <tspan font-weight="bold" fill="#17457f">الخوادم العامة</tspan> فقط، وتعزلها.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">× A DMZ exposes <tspan font-weight="bold" fill="#c0392b">all</tspan> servers:</tspan>
  <tspan x="140" dy="40">it exposes only <tspan font-weight="bold" fill="#17457f">public servers,</tspan></tspan>
  <tspan x="140" dy="40">and isolates them.</tspan>
</text>
</svg>
