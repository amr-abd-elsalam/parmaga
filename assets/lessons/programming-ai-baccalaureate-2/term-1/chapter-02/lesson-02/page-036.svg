  <path d="M28 2 L52 10 L52 28 Q52 46 28 56 Q4 46 4 28 L4 10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M17 29 L25 37 L40 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Star icon in strip -->
<g transform="translate(866 326)">
  <polygon points="28,0 35.05,18.29 54.63,19.35 39.41,31.71 44.46,50.65 28,40 11.54,50.65 16.59,31.71 1.37,19.35 20.95,18.29" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Warning triangle icon in card -->
<g transform="translate(130 452)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Item 1 icon: firewall -->
<g transform="translate(862 540)">
  <path d="M28 16 C16 16 16 6 24 0 C24 6 28 8 30 4 C38 8 40 16 28 16 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="4" y="16" width="48" height="36" rx="4" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M6 28 H50 M6 40 H22 M34 40 H50 M18 18 V28 M38 18 V28 M14 40 V50 M42 40 V50" fill="none" stroke="#f0c48c" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="22" y="32" width="12" height="20" rx="2" fill="#fffdf7" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="43" r="4" fill="#c0392b"/>
</g>

<!-- Item 2 icon: VPN tunnel with lock -->
<g transform="translate(862 740)">
  <path d="M4 54 L4 36 Q28 10 52 36 L52 54 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
