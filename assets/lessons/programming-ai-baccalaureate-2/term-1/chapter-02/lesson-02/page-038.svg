<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">سؤال الست درجات</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The 6-Mark Question</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">سؤال على نمط الامتحان</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM-STYLE QUESTION</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشرح لماذا يحمي <tspan font-weight="bold" fill="#c0392b">الدفاع في العمق</tspan></tspan>
  <tspan x="935" dy="40">المؤسسة بشكل أفضل من الاعتماد على</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">جدار الحماية</tspan> وحده. [6 درجات]</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain why <tspan font-weight="bold" fill="#c0392b">defense in depth</tspan> protects</tspan>
  <tspan x="140" dy="40">an organization better than relying on</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#17457f">firewall</tspan> alone. [6 marks]</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الدرجات الست = ثلاث نقاط × درجتان لكل نقطة.</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Six marks = three points × two marks each.</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">1 حدود <tspan font-weight="bold" fill="#17457f">الإجراء الواحد.</tspan></text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">1 The limits of <tspan font-weight="bold" fill="#17457f">one measure.</tspan></text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">2 ماذا يحدث عند الاختراق مع وجود <tspan font-weight="bold" fill="#17457f">الطبقات.</tspan></text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 What happens in a breach</tspan>
  <tspan x="132" dy="40">when <tspan font-weight="bold" fill="#17457f">layers</tspan> exist.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">3 <tspan font-weight="bold" fill="#2e7d32">النتيجة.</tspan></text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">3 The <tspan font-weight="bold" fill="#2e7d32">result.</tspan></text>
</svg>
