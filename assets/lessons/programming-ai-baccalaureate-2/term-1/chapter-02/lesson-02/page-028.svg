<!-- Icon: lock (paragraph 1) -->
<g transform="translate(884 300)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="10" y="30" width="52" height="36" rx="7" fill="#22303f" opacity=".18"/>
  <path d="M14 26 L14 16 C14 -2, 50 -2, 50 16 L50 26 L42 26 L42 16 C42 6, 22 6, 22 16 L22 26 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="6" y="24" width="52" height="36" rx="7" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="12" y="30" width="8" height="24" rx="4" fill="#8fc9f2" opacity=".6"/>
  <circle cx="32" cy="38" r="5" fill="#ffffff"/>
  <rect x="30" y="40" width="4" height="10" rx="2" fill="#ffffff"/>
</g>

<!-- Icon: check badge (paragraph 2) -->
<g transform="translate(884 551)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="36" cy="38" r="28" fill="#22303f" opacity=".18"/>
  <circle cx="32" cy="32" r="28" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="19" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <path d="M22 33 L29 40 L43 24" fill="none" stroke="#2e7d32" stroke-width="3"/>
</g>

<!-- Paragraph 1 Arabic -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">نهج انعدام الثقة Zero Trust:</tspan> نهج لا يمنح</tspan>
  <tspan x="950" dy="40">الثقة تلقائيًا لأي مستخدم أو جهاز لمجرد وجوده</tspan>
  <tspan x="950" dy="40">داخل الشبكة أو ملكيته للمؤسسة.</tspan>
</text>

<!-- Paragraph 1 English -->
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Zero trust:</tspan> an approach that never trusts</tspan>
  <tspan x="120" dy="40">a user or device automatically just</tspan>
  <tspan x="120" dy="40">because it is inside the network or owned</tspan>
  <tspan x="120" dy="40">by the organization.</tspan>
</text>

<!-- Paragraph 2 Arabic -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يُتحقق من <tspan font-weight="bold" fill="#17457f">الهوية والصلاحيات والسياق</tspan></tspan>
  <tspan x="950" dy="40">(الجهاز، والموقع، والوقت) عند كل طلب وصول.</tspan>
</text>

<!-- Paragraph 2 English -->
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Identity, permissions, and context</tspan></tspan>
  <tspan x="120" dy="40">(device, location, time) are checked</tspan>
  <tspan x="120" dy="40">at every access request.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لا تثق أبدًا، تحقّق دائمًا.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Never trust, always verify.</tspan>
</text>
</svg>
