  <path d="M684 1130 L684 1122 M684 1130 L690 1133" fill="none" stroke="#17457f" stroke-width="3"/>
  <circle cx="684" cy="1130" r="2" fill="#22303f"/>

  <!-- green arrow to the data -->
  <polygon points="530,1124 550,1124 550,1138 564,1138 540,1160 516,1138 530,1138" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>

