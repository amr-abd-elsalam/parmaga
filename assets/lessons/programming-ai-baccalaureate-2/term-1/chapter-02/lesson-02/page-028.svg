  <rect x="806" y="858" width="46" height="62" rx="16" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="829" cy="838" r="18" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <path d="M811 838 C 811 814, 847 814, 847 838 C 839 828, 819 828, 811 838 Z" fill="#2b211c"/>
  <circle cx="823" cy="840" r="2" fill="#22303f"/>
  <circle cx="835" cy="840" r="2" fill="#22303f"/>
  <path d="M824 847 Q 829 851 834 847" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <rect x="842" y="870" width="26" height="12" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="864" y="848" width="20" height="34" rx="4" fill="#22303f"/>
  <rect x="867" y="852" width="14" height="24" rx="2" fill="#4fc3e8"/>
  <circle cx="866" cy="876" r="6" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>

  <!-- shield checkpoint -->
  <path d="M540 990 C 565 1002, 590 1006, 610 1006 L 610 1048 C 610 1082, 580 1102, 540 1118 C 500 1102, 470 1082, 470 1048 L 470 1006 C 490 1006, 515 1002, 540 990 Z" fill="url(#ilShield)" stroke="#22303f" stroke-width="2.5"/>
  <path d="M540 1002 C 520 1012, 500 1016, 482 1016 L 482 1048 C 482 1076, 506 1094, 540 1106 Z" fill="#8fc9f2" opacity=".35"/>
  <polygon points="510,1052 522,1040 536,1056 566,1024 578,1036 536,1080" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>

  <!-- badge: ID card -->
  <circle cx="684" cy="1030" r="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="670" y="1020" width="28" height="20" rx="3" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="678" cy="1028" r="3.5" fill="#2f7fb5"/>
  <rect x="684" y="1025" width="10" height="3" rx="1.5" fill="#2f7fb5"/>
  <rect x="684" y="1032" width="8" height="3" rx="1.5" fill="#7f95ab"/>

  <!-- badge: key -->
  <circle cx="704" cy="1080" r="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M700 1080 L718 1080 M714 1080 L714 1086 M709 1080 L709 1085" fill="none" stroke="#17457f" stroke-width="3"/>
  <circle cx="695" cy="1080" r="7" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
