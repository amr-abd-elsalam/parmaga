  <rect x="242" y="870" width="44" height="48" rx="16" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M256 871 L264 884 L272 871 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
