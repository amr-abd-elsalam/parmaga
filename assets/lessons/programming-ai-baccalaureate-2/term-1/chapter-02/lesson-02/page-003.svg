<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والآن: لو نام <tspan font-weight="bold" fill="#17457f">البواب،</tspan> هل سيُسرق الذهب؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Now: if the <tspan font-weight="bold" fill="#17457f">guard</tspan> falls asleep,</tspan>
  <tspan x="120" dy="40">will the gold be stolen?</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا، فما زال هناك <tspan font-weight="bold" fill="#17457f">الباب الحديد،</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">وأقفال الغرف،</tspan> والخزنة نفسها.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No. There is still the <tspan font-weight="bold" fill="#17457f">steel door,</tspan></tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">room locks,</tspan> and the safe itself.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">هذه الفكرة لها اسم:</tspan>
  <tspan x="935" dy="40"><tspan fill="#c0392b">الدفاع في العمق Defense in Depth.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">This idea has a name:</tspan>
  <tspan x="140" dy="40"><tspan fill="#c0392b">defense in depth.</tspan></tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">واليوم سنبني <tspan font-weight="bold" fill="#17457f">الفيلا</tspan> نفسها، لكن <tspan font-weight="bold" fill="#c0392b">لشبكة مؤسسة.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Today we will build the same <tspan font-weight="bold" fill="#17457f">villa,</tspan></tspan>
  <tspan x="120" dy="40">but for an <tspan font-weight="bold" fill="#c0392b">organization's network.</tspan></tspan>
</text>

<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نام البواب، لكن <tspan font-weight="bold" fill="#2e7d32">الذهب ما زال في أمان.</tspan></tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The guard is asleep,</tspan>
  <tspan x="120" dy="40">but the gold is <tspan font-weight="bold" fill="#2e7d32">still safe.</tspan></tspan>
</text>
</svg>
