<!-- Icon: key -->
<g transform="translate(900 72)">
  <circle cx="16" cy="26" r="13" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="16" cy="26" r="4" fill="#fffdf7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M29 26 L50 26 M42 26 L42 36 M49 26 L49 34" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
