  <path d="M53 90 L53 75 C53 53 87 53 87 75 L87 90" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="45" y="90" width="50" height="42" rx="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
