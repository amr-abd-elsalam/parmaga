  <path d="M71 40 C71 24 99 24 99 40 C93 33 78 33 71 40 Z" fill="#2b211c"/>
  <path d="M-15 110 L185 110 L170 128 L0 128 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: network nodes -->
<g transform="translate(120 72)">
  <line x1="26" y1="10" x2="10" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="10" x2="42" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
