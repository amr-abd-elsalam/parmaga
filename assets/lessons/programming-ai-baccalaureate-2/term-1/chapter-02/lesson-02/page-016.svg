  <path d="M40 112 C12 112 2 84 22 68 C16 38 50 22 72 36 C88 6 136 6 152 36 C180 30 202 56 192 80 C206 94 196 116 170 116 Z" fill="url(#ilCloud)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
