<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المنطقة المعزولة:</tspan>
  <tspan x="540" dy="48">صالون الضيوف</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The DMZ: The Guest Room</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المنطقة المعزولة</tspan> DMZ: جزء منفصل عن الشبكة</tspan>
  <tspan x="950" dy="40">الداخلية، توضع فيه <tspan font-weight="bold" fill="#17457f">الخوادم</tspan> التي يصل إليها</tspan>
  <tspan x="950" dy="40">الجمهور، كخادم الويب والبريد.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">DMZ:</tspan> a part separate from the internal</tspan>
  <tspan x="120" dy="40">network that holds <tspan font-weight="bold" fill="#17457f">servers</tspan> the public</tspan>
  <tspan x="120" dy="40">must reach, like web and mail servers.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يفصلها <tspan font-weight="bold" fill="#17457f">جدار حماية</tspan> عن الإنترنت،</tspan>
  <tspan x="950" dy="40">وآخر عن الداخل.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">One <tspan font-weight="bold" fill="#17457f">firewall</tspan> separates it from the</tspan>
  <tspan x="120" dy="40">Internet, another from the inside.</tspan>
</text>

<text x="230" y="976" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">الإنترنت</text>
<text x="135" y="1010" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Internet</text>
<text x="262" y="1058" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">جدار الحماية</text>
<text x="150" y="1092" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Firewall</text>
<text x="602" y="1058" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">جدار الحماية</text>
<text x="490" y="1092" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Firewall</text>
<text x="565" y="976" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">المنطقة المعزولة</text>
<text x="443" y="1010" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">DMZ</text>
<text x="915" y="976" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">الشبكة الداخلية</text>
<text x="704" y="1010" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Internal network</text>
