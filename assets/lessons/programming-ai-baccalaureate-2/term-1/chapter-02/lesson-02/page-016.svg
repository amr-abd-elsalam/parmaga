<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">إجابة السؤال الرئيسي (تابع)</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Lesson Question — Answered (continued)</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">ومع السحابة والعمل عن بُعد، أصبح موقع المستخدم</tspan>
  <tspan x="950" dy="40">داخل الشبكة دليلًا أقل فاعلية على الثقة؛</tspan>
  <tspan x="950" dy="40">لذلك لا يمنح <tspan font-weight="bold" fill="#c0392b">نهج انعدام الثقة</tspan> ثقة تلقائية،</tspan>
  <tspan x="950" dy="40">بل يطلب التحقق المناسب من الهوية</tspan>
  <tspan x="950" dy="40">والصلاحيات عند الوصول. تعمل هذه الطبقات معًا</tspan>
  <tspan x="950" dy="40">لتقليل الخطر والحد من أثر الاختراق.</tspan>
</text>

<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">With cloud services and remote work,</tspan>
  <tspan x="120" dy="40">a user's location inside the network has</tspan>
  <tspan x="120" dy="40">become a less reliable indicator of trust.</tspan>
  <tspan x="120" dy="40">So <tspan font-weight="bold" fill="#c0392b">zero trust</tspan> grants no automatic trust;</tspan>
  <tspan x="120" dy="40">instead, it requires appropriate</tspan>
  <tspan x="120" dy="40">verification of identity and permissions</tspan>
  <tspan x="120" dy="40">at access. These layers work together</tspan>
  <tspan x="120" dy="40">to reduce risk and limit the impact</tspan>
  <tspan x="120" dy="40">of a breach.</tspan>
</text>
</svg>
