  <rect x="0" y="0" width="170" height="105" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="10" y="10" width="150" height="85" rx="4" fill="url(#ilScreen)"/>
  <path d="M58 90 C58 64 112 64 112 90 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
