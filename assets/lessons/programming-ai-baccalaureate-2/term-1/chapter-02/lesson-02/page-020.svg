<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الأجهزة الطرفية:</tspan>
  <tspan x="540" dy="48">مناعة كل جهاز</tspan>
</text>

<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Endpoints: Every Device's Immunity</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الجهاز الطرفي</tspan> Endpoint: أي جهاز</tspan>
  <tspan x="950" dy="40">في طرف الاتصال، كالحاسوب والهاتف</tspan>
  <tspan x="950" dy="40">والخادم، وحتى <tspan fill="#c96a1b">الطابعة الذكية.</tspan></tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Endpoint:</tspan> any device at the end of</tspan>
  <tspan x="120" dy="40">a connection, like a computer, phone,</tspan>
  <tspan x="120" dy="40">server, or even a <tspan fill="#c96a1b">smart printer.</tspan></tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">حماية الأجهزة الطرفية:</tspan> ضوابط</tspan>
  <tspan x="950" dy="40">تُطبَّق على كل جهاز بعينه.</tspan>
</text>

<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Endpoint protection:</tspan> controls</tspan>
  <tspan x="120" dy="40">applied to each device itself.</tspan>
</text>

