<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">ما لا يفعله جدار الحماية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">What a Firewall Does NOT Do</tspan>
</text>

<text x="930" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا يكتشف <tspan font-weight="bold" fill="#c0392b">فيروسًا</tspan> داخل <tspan font-weight="bold" fill="#17457f">اتصال مسموح</tspan> به.</tspan>
</text>
<text x="150" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">It misses a <tspan font-weight="bold" fill="#c0392b">virus</tspan> inside</tspan>
  <tspan x="150" dy="40">an <tspan font-weight="bold" fill="#17457f">allowed connection</tspan>.</tspan>
</text>

<text x="930" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا يحميك إذا أعطيت <tspan font-weight="bold" fill="#c0392b">كلمة مرورك</tspan> لمحتال.</tspan>
</text>
<text x="150" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">It cannot help if you give</tspan>
  <tspan x="150" dy="40">a scammer your <tspan font-weight="bold" fill="#c0392b">password</tspan>.</tspan>
</text>

<text x="930" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا يرى ما يحدث داخل الشبكة</tspan>
  <tspan x="930" dy="40">إذا كان عند <tspan font-weight="bold" fill="#17457f">البوابة</tspan> فقط.</tspan>
</text>
<text x="150" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">At the <tspan font-weight="bold" fill="#17457f">gate</tspan> only, it cannot</tspan>
  <tspan x="150" dy="40">see what happens inside.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ولهذا بالذات <tspan font-weight="bold" fill="#17457f">لا يكفي وحده</tspan>.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">That is exactly why</tspan>
  <tspan x="140" dy="40">it is <tspan font-weight="bold" fill="#17457f">not enough alone</tspan>.</tspan>
</text>
</svg>
