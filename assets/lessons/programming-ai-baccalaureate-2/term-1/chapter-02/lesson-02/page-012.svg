<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">5. مفهوم نهج انعدام الثقة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">5. The Concept of Zero Trust</text>

<!-- Arabic definition -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">نهج انعدام الثقة Zero Trust:</tspan> نهج أمني</tspan>
  <tspan x="950" dy="40">لا يمنح الثقة تلقائيًا لمستخدم أو جهاز لمجرد</tspan>
  <tspan x="950" dy="40">وجوده داخل الشبكة أو لكونه مملوكًا للمؤسسة.</tspan>
  <tspan x="950" dy="40">تُفحص <tspan font-weight="bold" fill="#17457f">الهوية والصلاحيات والسياق</tspan> عند طلب</tspan>
  <tspan x="950" dy="40">الوصول إلى الموارد وفق سياسة المؤسسة.</tspan>
</text>

<!-- English definition -->
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">Zero trust:</tspan> a security approach that</tspan>
  <tspan x="120" dy="40">does not automatically trust a user or</tspan>
  <tspan x="120" dy="40">device merely because it is inside the</tspan>
  <tspan x="120" dy="40">network or owned by the organization.</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">Identity, permissions, and context</tspan> are</tspan>
  <tspan x="120" dy="40">checked when access to resources is</tspan>
  <tspan x="120" dy="40">requested, according to the organization's</tspan>
  <tspan x="120" dy="40">policy.</tspan>
</text>

<!-- Key-term card text -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">مصطلح أساسي:</tspan> <tspan font-weight="bold" fill="#c0392b">نهج انعدام الثقة</tspan> —</tspan>
  <tspan x="935" dy="40">التحقق من كل عملية وصول.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">KEY TERM:</tspan> <tspan font-weight="bold" fill="#c0392b">Zero trust</tspan> —</tspan>
  <tspan x="140" dy="40">verify every access.</tspan>
</text>
</svg>
