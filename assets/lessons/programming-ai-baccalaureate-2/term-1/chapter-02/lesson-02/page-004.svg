  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Light bulb icon -->
<g transform="translate(880 738)">
  <circle cx="28" cy="22" r="17" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M22 26 Q28 18 34 26" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="19" y="37" width="18" height="13" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="22" y1="43.5" x2="34" y2="43.5" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Shield icon -->
<g transform="translate(486 900)">
  <path d="M24 2 L44 10 L44 24 C44 36 34 44 24 47 C14 44 4 36 4 24 L4 10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="14,24 21,31 34,17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">السؤال الرئيسي وخريطة الدرس</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Guiding Question &amp; Lesson Map</text>

<!-- Guiding question: Arabic -->
<text x="935" y="258" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">السؤال الرئيسي:</tspan> كيف يمكن لمؤسسة أن</tspan>
  <tspan x="935" dy="36">تصمم شبكتها بحيث يظل النظام <tspan font-weight="bold" fill="#2e7d32">محميًا</tspan></tspan>
  <tspan x="935" dy="36">حتى لو اختُرق أحد الدفاعات؟</tspan>
</text>

<!-- Guiding question: English -->
<text x="140" y="366" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Guiding question:</tspan> How can an</tspan>
  <tspan x="140" dy="36">organization design its network</tspan>
  <tspan x="140" dy="36">so that the system stays <tspan font-weight="bold" fill="#2e7d32">protected</tspan></tspan>
  <tspan x="140" dy="36">even if one defense is breached?</tspan>
</text>

<!-- Key fact: Arabic -->
<text x="950" y="546" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الفكرة الأساسية:</tspan> يأتي أمان الشبكات القوي من</tspan>
  <tspan x="950" dy="36"><tspan font-weight="bold" fill="#17457f">تكديس الإجراءات</tspan> — جدار الحماية، والشبكة</tspan>
  <tspan x="950" dy="36">الافتراضية الخاصة، والمنطقة المعزولة، وحماية</tspan>
  <tspan x="950" dy="36">الأجهزة الطرفية — ومن التحقق من كل عملية</tspan>
  <tspan x="950" dy="36">وصول <tspan font-weight="bold" fill="#17457f">(نهج انعدام الثقة)،</tspan> وليس من حاجز واحد.</tspan>
</text>

<!-- Key fact: English -->
<text x="120" y="726" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Key Fact:</tspan> Strong network security comes</tspan>
  <tspan x="120" dy="36">from <tspan font-weight="bold" fill="#17457f">layering measures</tspan> — firewall, VPN,</tspan>
  <tspan x="120" dy="36">DMZ, endpoint protection — and from</tspan>
  <tspan x="120" dy="36">verifying every access <tspan font-weight="bold" fill="#17457f">(zero trust),</tspan></tspan>
  <tspan x="120" dy="36">not from a single barrier.</tspan>
</text>

<!-- Key concepts heading -->
<text x="950" y="942" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">المفاهيم الأساسية |</text>
<text x="120" y="942" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#c0392b">Key Concepts:</text>

<!-- Chip 1 -->
<text x="959" y="1014" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">جدار الحماية</text>
<text x="757" y="1050" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">Firewall</text>

<!-- Chip 2 -->
<text x="708" y="1014" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="708" dy="0">الشبكة</tspan>
  <tspan x="708" dy="36">الافتراضية الخاصة</tspan>
</text>
<text x="439" y="1086" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">VPN</text>

<!-- Chip 3 -->
<text x="390" y="1014" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">المنطقة المعزولة</text>
<text x="121" y="1050" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">DMZ</text>

<!-- Chip 4 -->
<text x="959" y="1158" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">الدفاع في العمق</text>
<text x="707" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">
  <tspan x="707" dy="0">Defense in</tspan>
  <tspan x="707" dy="36">Depth</tspan>
</text>

<!-- Chip 5 -->
<text x="658" y="1158" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">نهج انعدام الثقة</text>
<text x="389" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">Zero Trust</text>

<!-- Chip 6 -->
<text x="340" y="1158" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">المحيط الأمني</text>
<text x="122" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#c0392b">Perimeter</text>
</svg>
