<line x1="104" y1="702" x2="104" y2="878" stroke="#152b42" stroke-width="2" stroke-linecap="round"/>

<!-- Thinking face in card -->
<g transform="translate(165 272)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
