<rect x="373" y="1130" width="301" height="116" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="106" y="1130" width="250" height="116" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>

