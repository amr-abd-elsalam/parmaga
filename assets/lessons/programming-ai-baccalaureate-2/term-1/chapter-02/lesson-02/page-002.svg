<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="368" width="870" height="128" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="648" width="870" height="128" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="928" width="870" height="128" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info cards -->
<rect x="105" y="362" width="870" height="128" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="378" width="6" height="96" rx="3" fill="#2f7fb5"/>
<rect x="105" y="642" width="870" height="128" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="658" width="6" height="96" rx="3" fill="#2f7fb5"/>
<rect x="105" y="922" width="870" height="128" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="938" width="6" height="96" rx="3" fill="#2f7fb5"/>

<!-- Objective bullets -->
<circle cx="966" cy="264" r="6" fill="#c0392b"/>
<circle cx="966" cy="544" r="6" fill="#c0392b"/>
<circle cx="966" cy="824" r="6" fill="#c0392b"/>

<!-- Icons -->
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Open book beside the header -->
  <g transform="translate(150 118)">
    <path d="M 0 -12 Q -12 -20 -26 -18 L -26 16 Q -12 14 0 22 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <path d="M 0 -12 Q 12 -20 26 -18 L 26 16 Q 12 14 0 22 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <line x1="-19" y1="-8" x2="-7" y2="-6" stroke="#2f7fb5" stroke-width="2.5"/>
    <line x1="-19" y1="0" x2="-7" y2="2" stroke="#2f7fb5" stroke-width="2.5"/>
    <line x1="-19" y1="8" x2="-7" y2="10" stroke="#2f7fb5" stroke-width="2.5"/>
    <line x1="7" y1="-6" x2="19" y2="-8" stroke="#c96a1b" stroke-width="2.5"/>
    <line x1="7" y1="2" x2="19" y2="0" stroke="#c96a1b" stroke-width="2.5"/>
    <line x1="7" y1="10" x2="19" y2="8" stroke="#c96a1b" stroke-width="2.5"/>
  </g>
  <!-- Lock in card 1 -->
  <g transform="translate(885 428)">
    <path d="M -11 -4 L -11 -14 A 11 11 0 0 1 11 -14 L 11 -4" fill="none" stroke="#22303f" stroke-width="3"/>
    <rect x="-18" y="-4" width="36" height="30" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="8" r="4" fill="#ffd24a"/>
    <rect x="-2" y="10" width="4" height="8" rx="2" fill="#ffd24a"/>
  </g>
  <!-- Layered shield in card 2 -->
  <g transform="translate(885 704)">
    <path d="M -22 -26 L 22 -26 L 22 0 Q 22 22 0 30 Q -22 22 -22 0 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -12 -16 L 12 -16 L 12 0 Q 12 13 0 18 Q -12 13 -12 0 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -6 0 L -1 5 L 7 -5" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
  <!-- Check badge in card 3 -->
  <g transform="translate(885 986)">
    <circle cx="0" cy="0" r="26" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -11 1 L -3 9 L 12 -8" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</g>

<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أهداف التعلم</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Learning Objectives</text>

<!-- Objective 1 -->
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اشرح أدوار <tspan font-weight="bold" fill="#c0392b">جدار الحماية،</tspan> وVPN، وDMZ،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">وضوابط الأجهزة الطرفية</tspan> في حماية الشبكة.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain the roles of <tspan font-weight="bold" fill="#c0392b">firewalls,</tspan></tspan>
  <tspan x="140" dy="40">VPNs, DMZs, and <tspan font-weight="bold" fill="#17457f">endpoint controls</tspan></tspan>
  <tspan x="140" dy="40">in protecting a network.</tspan>
</text>

<!-- Objective 2 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اشرح لماذا يوفر <tspan font-weight="bold" fill="#c0392b">الدفاع في العمق</tspan> <tspan font-weight="bold" fill="#2e7d32">حماية أقوى</tspan></tspan>
  <tspan x="950" dy="40">من الاعتماد على إجراء أمني واحد.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain why <tspan font-weight="bold" fill="#c0392b">defense in depth</tspan> provides</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">stronger protection</tspan> than relying</tspan>
  <tspan x="140" dy="40">on a single security measure.</tspan>
</text>

<!-- Objective 3 -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قيّم <tspan font-weight="bold" fill="#17457f">تصميمًا أمنيًا</tspan> لشبكة، وبرّر اختيار</tspan>
  <tspan x="950" dy="40">الضوابط المناسبة وفق <tspan font-weight="bold" fill="#c0392b">الأصول والتهديدات.</tspan></tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Evaluate a <tspan font-weight="bold" fill="#17457f">network security design,</tspan></tspan>
  <tspan x="140" dy="40">and justify the choice of suitable</tspan>
  <tspan x="140" dy="40">controls based on <tspan font-weight="bold" fill="#c0392b">assets and threats.</tspan></tspan>
</text>
</svg>
