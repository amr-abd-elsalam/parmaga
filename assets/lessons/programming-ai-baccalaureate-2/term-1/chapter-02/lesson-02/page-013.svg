<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الشبكة الافتراضية الخاصة:</tspan>
  <tspan x="540" dy="48">النفق المشفّر</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">VPN: The Encrypted Tunnel</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">&#x200F;VPN:</tspan> تقنية تبني <tspan font-weight="bold" fill="#17457f">نفقًا</tspan> خاصًا منطقيًا Tunnel</tspan>
  <tspan x="950" dy="40">عبر شبكة عامة كالإنترنت،</tspan>
  <tspan x="950" dy="40">وتستخدم عادةً (لا دائمًا) <tspan font-weight="bold" fill="#17457f">التشفير.</tspan></tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">VPN:</tspan> builds a private logical <tspan font-weight="bold" fill="#17457f">tunnel</tspan></tspan>
  <tspan x="120" dy="40">over a public network like the Internet,</tspan>
  <tspan x="120" dy="40">usually (not always) with <tspan font-weight="bold" fill="#17457f">encryption.</tspan></tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فُكّ الاسم لتحفظه</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Break the Name Down</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">شبكة:</tspan><tspan> توصلك بشبكة.</tspan></text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Network:</tspan><tspan> it connects you to a network.</tspan></text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">افتراضية:</tspan><tspan> بلا كابل خاص، عبر الإنترنت نفسه.</tspan></text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Virtual:</tspan> no private cable;</tspan>
  <tspan x="132" dy="40">it uses the Internet.</tspan>
</text>

<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">خاصة:</tspan><tspan> لا يقرأ ما فيها إلا الطرفان.</tspan></text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Private:</tspan><tspan> only the two ends can read it.</tspan></text>
</svg>
