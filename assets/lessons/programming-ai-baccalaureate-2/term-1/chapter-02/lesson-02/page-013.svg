<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Key term card: shadow, fill, accent -->
<rect x="109" y="928" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="922" width="870" height="288" rx="16" fill="#fdf6d8" stroke="#e0c46a" stroke-width="2"/>
<rect x="961" y="938" width="6" height="256" rx="3" fill="#e0a55e"/>

<!-- Thin navy line on the left edge of the English paragraph -->
<line x1="105" y1="486" x2="105" y2="884" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>

<!-- Icon: cloud (cloud services) -->
<g transform="translate(892 548)">
  <path d="M14 44 H46 A11 11 0 0 0 48 22 A15 15 0 0 0 20 20 A12 12 0 0 0 14 44 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 34 H40" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: connected nodes (network) -->
<g transform="translate(892 700)">
  <line x1="12" y1="46" x2="48" y2="46" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="46" x2="30" y2="14" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="46" x2="30" y2="14" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="30" cy="14" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="12" cy="46" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="48" cy="46" r="9" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: lock (security) in card corner -->
<g transform="translate(125 932)">
  <path d="M16 26 V17 A12 12 0 0 1 40 17 V26" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="26" width="40" height="28" rx="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="38" r="4" fill="#22303f"/>
  <rect x="26" y="40" width="4" height="8" rx="2" fill="#22303f"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">المحيط الأمني التقليدي</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Traditional Perimeter</text>

<!-- Arabic paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">(2) صُمِّم أمان الشبكات التقليدي بشكل أساسي حول</tspan>
  <tspan x="950" dy="40">حماية <tspan font-weight="bold" fill="#c0392b">المحيط الأمني Perimeter</tspan>، بناءً على</tspan>
  <tspan x="950" dy="40">فرضية أن «داخل شبكة المؤسسة آمن، وخارجها خطر».</tspan>
  <tspan x="950" dy="40">لكن مع انتشار الخدمات السحابية والعمل عن بُعد،</tspan>
  <tspan x="950" dy="40">أصبحت الحدود بين «الداخل» و«الخارج» غير واضحة،</tspan>
  <tspan x="950" dy="40">وأصبحت التصاميم التي تحمي</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">المحيط الأمني</tspan> فقط غير كافية.</tspan>
</text>

<!-- English paragraph -->
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">(2) Traditional network security was</tspan>
  <tspan x="120" dy="40">designed mainly around protecting the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">perimeter</tspan>, based on the assumption that</tspan>
  <tspan x="120" dy="40">"inside the organization's network is</tspan>
  <tspan x="120" dy="40">safe, and outside is dangerous." But with</tspan>
  <tspan x="120" dy="40">the spread of cloud services and remote</tspan>
  <tspan x="120" dy="40">work, the boundary between "inside" and</tspan>
  <tspan x="120" dy="40">"outside" has become unclear, and designs</tspan>
  <tspan x="120" dy="40">that protect only the <tspan font-weight="bold" fill="#c0392b">perimeter</tspan> have</tspan>
  <tspan x="120" dy="40">become insufficient.</tspan>
</text>

<!-- Key term card: Arabic -->
<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">مصطلح أساسي:</tspan> <tspan font-weight="bold" fill="#c0392b">المحيط الأمني</tspan> — الحدود</tspan>
  <tspan x="935" dy="40">التقليدية التي تفترض أن «الداخل آمن»، والتي</tspan>
  <tspan x="935" dy="40">طمستها الخدمات السحابية والعمل عن بُعد.</tspan>
</text>

<!-- Key term card: English -->
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">KEY TERM:</tspan> <tspan font-weight="bold" fill="#c0392b">Perimeter</tspan> —</tspan>
  <tspan x="140" dy="40">the traditional boundary that assumes</tspan>
  <tspan x="140" dy="40">"inside is safe," blurred by cloud</tspan>
  <tspan x="140" dy="40">services and remote work.</tspan>
</text>
</svg>
