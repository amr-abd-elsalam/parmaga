<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">"Name the Layer" Answers</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">أ 2 (VPN)، ب 3 (DMZ)،</tspan>
  <tspan x="935" dy="40">جـ 4 (الأجهزة الطرفية)، د 1 (جدار الحماية).</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">A 2 (VPN), B 3 (DMZ),</tspan>
  <tspan x="140" dy="40">C 4 (Endpoints), D 1 (Firewall).</tspan>
</text>

<!-- Main idea texts -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">المهاجم يحتاج أن ينجح في <tspan font-weight="bold" fill="#17457f">كل الطبقات…</tspan></tspan>
  <tspan x="935" dy="40">وأنت تحتاج <tspan font-weight="bold" fill="#2e7d32">طبقة واحدة</tspan> فقط تصمد.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">The attacker must beat <tspan font-weight="bold" fill="#17457f">every layer…</tspan></tspan>
  <tspan x="140" dy="40">you need just <tspan font-weight="bold" fill="#2e7d32">one layer</tspan> to hold.</tspan>
</text>
