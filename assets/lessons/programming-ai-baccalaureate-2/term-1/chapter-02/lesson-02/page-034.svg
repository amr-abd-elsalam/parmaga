<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">لعبة: حدّد الطبقة</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Game: Name the Layer</text>

<!-- Instruction strip text -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">اكتب <tspan font-weight="bold" fill="#17457f">رقم الطبقة</tspan><tspan> (1 – 4) أمام كل موقف.</tspan></text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Write the <tspan font-weight="bold" fill="#17457f">layer number</tspan> (1–4)</tspan>
  <tspan x="140" dy="40">next to each situation.</tspan>
</text>

<!-- Question A -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">أ</tspan><tspan> موظف في مقهى يفتح ملفات الشركة.</tspan></text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">A</tspan> An employee in a café</tspan>
  <tspan x="120" dy="40">opens company files.</tspan>
</text>

<!-- Question B -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">ب</tspan><tspan> الموقع اختُرق، لكن بيانات العملاء سليمة.</tspan></text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">B</tspan> The website was hacked,</tspan>
  <tspan x="120" dy="40">but customer data is safe.</tspan>
</text>

<!-- Question C -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">جـ</tspan><tspan> فلاشة مصابة وُضعت في جهاز.</tspan></text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">C</tspan> An infected USB stick</tspan>
  <tspan x="120" dy="40">was plugged into a device.</tspan>
</text>

<!-- Question D -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">د</tspan> شخص من الخارج حاول الوصول</tspan>
  <tspan x="950" dy="40">إلى قاعدة البيانات مباشرة فرُفض.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">D</tspan> Someone outside tried to reach</tspan>
  <tspan x="120" dy="40">the database directly and was refused.</tspan>
</text>
