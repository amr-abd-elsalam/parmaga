<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تذكّر <tspan font-weight="bold" fill="#c0392b">«المندرة»:</tspan> صالون الضيوف</tspan>
  <tspan x="950" dy="40">في البيوت المصرية القديمة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Remember the <tspan font-weight="bold" fill="#c0392b">"mandara":</tspan> the guest room</tspan>
  <tspan x="120" dy="40">of old Egyptian houses.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الضيف يُكرَّم فيها، ولا يصل إلى <tspan font-weight="bold" fill="#17457f">بقية البيت.</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Guests are welcomed there but never</tspan>
  <tspan x="120" dy="40">reach the <tspan font-weight="bold" fill="#17457f">rest of the house.</tspan></tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ولو كان «مش تمام»،</tspan>
  <tspan x="950" dy="40">فأقصى ما يصل إليه <tspan font-weight="bold" fill="#17457f">المندرة.</tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Even a bad guest gets no further</tspan>
  <tspan x="120" dy="40">than the <tspan font-weight="bold" fill="#17457f">guest room.</tspan></tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">هل تعلم؟</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Did You Know?</tspan>
</text>
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الاسم عسكري: <tspan font-weight="bold" fill="#c0392b">«المنطقة منزوعة السلاح»</tspan></tspan>
  <tspan x="935" dy="40">أرض بين دولتين، لا تتبع أيًّا منهما.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The name is military:</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#c0392b">demilitarized zone</tspan> is land between</tspan>
  <tspan x="140" dy="40">two countries, owned by neither.</tspan>
</text>
</svg>
