<!-- Point 3 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">النقطة 3</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Point 3</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لأن كل <tspan font-weight="bold" fill="#c0392b">طبقة</tspan> تغطي نوعًا مختلفًا من التهديدات،</tspan>
  <tspan x="950" dy="40">يصبح تجاوزها كلها معًا غير مرجح، <tspan font-weight="bold" fill="#2e7d32">فيقل الخطر</tspan></tspan>
  <tspan x="950" dy="40">ويُحد من أثر الاختراق.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Because each <tspan font-weight="bold" fill="#c0392b">layer</tspan> covers a different</tspan>
  <tspan x="120" dy="40">kind of threat, passing all of them is</tspan>
  <tspan x="120" dy="40">unlikely, so <tspan font-weight="bold" fill="#2e7d32">risk drops</tspan> and breach</tspan>
  <tspan x="120" dy="40">impact is limited.</tspan>
</text>

<!-- Success card text -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">نصيحة الدرجة الكاملة</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">Full-Mark Tip</text>
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اذكر <tspan font-weight="bold" fill="#17457f">مثالًا محددًا</tspan> واحدًا على الأقل،</tspan>
  <tspan x="935" dy="40">مثل: «إذا اختُرق خادم الويب…».</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Give at least one <tspan font-weight="bold" fill="#17457f">specific example</tspan>,</tspan>
  <tspan x="140" dy="40">such as:</tspan>
  <tspan x="140" dy="40">"If the web server is hacked…"</tspan>
</text>
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">فالمصحح يبحث عن:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">ماذا يحدث</tspan> إذا اختُرق أحد الإجراءات.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The marker looks for: <tspan font-weight="bold" fill="#17457f">what happens</tspan></tspan>
  <tspan x="140" dy="40">if one measure is breached.</tspan>
</text>
</svg>
