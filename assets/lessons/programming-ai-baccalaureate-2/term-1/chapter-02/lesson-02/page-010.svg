<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">كيف يقرر؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">How Does It Decide?</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يفحص كل <tspan font-weight="bold" fill="#c0392b">حزمة:</tspan> من أين جاءت؟ وإلى أين تذهب؟</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It checks each <tspan font-weight="bold" fill="#c0392b">packet:</tspan> where is it from,</tspan>
  <tspan x="120" dy="40">and where is it going?</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ثم يقارن ذلك <tspan font-weight="bold" fill="#17457f">بقواعده،</tspan> <tspan font-weight="bold" fill="#2e7d32">فيسمح</tspan> أو يمنع.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Then it compares this with its <tspan font-weight="bold" fill="#17457f">rules,</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#2e7d32">allows</tspan> or blocks.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">القاعدة الذهبية: امنع كل شيء،</tspan>
  <tspan x="935" dy="40">إلا ما سمحت به صراحةً.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Golden rule: block everything</tspan>
  <tspan x="140" dy="40">except what you clearly allow.</tspan>
</text>
</svg>
