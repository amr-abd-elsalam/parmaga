  <tspan x="140" dy="0">× Zero trust means inside is safe:</tspan>
  <tspan x="140" dy="40">that is the old perimeter —</tspan>
  <tspan x="140" dy="40">the opposite.</tspan>
</text>

<!-- T5 -->
