  <tspan x="595" dy="40">path</tspan>
</text>
<text x="563" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">الطريق</text>
<text x="365" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">The road</text>
<text x="333" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#2e7d32">VPN</text>
<text x="111" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#2e7d32">VPN</text>

<!-- Row 3 -->
<text x="969" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">3. وضع الخوادم</text>
<text x="595" y="694" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Server placement</text>
<text x="563" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">المكان</text>
<text x="365" y="694" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">The place</text>
<text x="333" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#2e7d32">DMZ</text>
<text x="111" y="694" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#2e7d32">DMZ</text>

<!-- Row 4 -->
<text x="969" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">4. الأجهزة الطرفية</text>
<text x="595" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Endpoints</text>
<text x="563" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">الجهاز</text>
<text x="365" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">The device</text>
<text x="333" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#2e7d32">
  <tspan x="333" dy="0">مكافحة</tspan>
  <tspan x="333" dy="40">الفيروسات</tspan>
  <tspan x="333" dy="40">والتحديثات</tspan>
</text>
<text x="111" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#2e7d32">
  <tspan x="111" dy="0">Antivirus</tspan>
  <tspan x="111" dy="40">and updates</tspan>
</text>

<!-- Success card text -->
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">هذا <tspan font-weight="bold" fill="#17457f">المفهوم</tspan> هو <tspan font-weight="bold" fill="#c0392b">قلب الدرس،</tspan></tspan>
  <tspan x="935" dy="40">وكل ما قبله أدوات تعمل داخله.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">This <tspan font-weight="bold" fill="#17457f">concept</tspan> is the <tspan font-weight="bold" fill="#c0392b">heart</tspan></tspan>
  <tspan x="140" dy="40">of the lesson; everything before it</tspan>
  <tspan x="140" dy="40">is a tool inside it.</tspan>
</text>
