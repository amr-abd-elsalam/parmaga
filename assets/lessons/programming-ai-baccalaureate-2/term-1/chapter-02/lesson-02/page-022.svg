<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أحيانًا لا يأتي الهجوم من البوابة أصلًا:</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">فلاشة مصابة،</tspan> أو <tspan fill="#c96a1b">لابتوب</tspan> أُصيب في البيت.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Sometimes the attack never passes</tspan>
  <tspan x="120" dy="40">the gate: an <tspan fill="#c96a1b">infected USB stick,</tspan></tspan>
  <tspan x="120" dy="40">or a <tspan fill="#c96a1b">laptop</tspan> infected at home.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هنا لا يحمي إلا <tspan font-weight="bold" fill="#17457f">الجهاز نفسه.</tspan></tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Here, only <tspan font-weight="bold" fill="#17457f">the device itself</tspan></tspan>
  <tspan x="120" dy="40">can protect you.</tspan>
</text>

<!-- Info card header -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لماذا التحديثات؟</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Why Updates?</tspan>
</text>

<!-- Info card paragraph 1 -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كل تحديث <tspan font-weight="bold" fill="#2e7d32">يسد ثغرة</tspan> عرفها المهاجمون.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Each update <tspan font-weight="bold" fill="#2e7d32">closes a hole</tspan></tspan>
  <tspan x="140" dy="40">attackers already know.</tspan>
</text>

<!-- Info card paragraph 2 -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">والجهاز <tspan font-weight="bold" fill="#c0392b">غير المحدَّث</tspan> بيت يعرف</tspan>
  <tspan x="935" dy="40">كل اللصوص أن شباكه مكسور.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">An <tspan font-weight="bold" fill="#c0392b">unupdated</tspan> device is a house</tspan>
  <tspan x="140" dy="40">whose broken window every thief knows.</tspan>
</text>
</svg>
