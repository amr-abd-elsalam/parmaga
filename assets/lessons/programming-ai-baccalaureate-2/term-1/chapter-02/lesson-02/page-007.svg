<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الاختراق Breach:</tspan> تجاوز المهاجم وسيلة حماية</tspan>
  <tspan x="950" dy="40">ووصوله إلى ما لا يحق له.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Breach:</tspan> an attacker getting past a</tspan>
  <tspan x="120" dy="40">protection to reach what is not allowed.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الضابط الأمني Security Control:</tspan> أي إجراء</tspan>
  <tspan x="950" dy="40">يقلل الخطر، <tspan fill="#c96a1b">كجدار الحماية.</tspan></tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Security control:</tspan> any measure that</tspan>
  <tspan x="120" dy="40">reduces risk, like <tspan fill="#c96a1b">a firewall.</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المصادقة Authentication:</tspan> التأكد من أنك</tspan>
  <tspan x="950" dy="40">من تدّعيه؛ وسؤالها: <tspan font-weight="bold" fill="#17457f">«أنت مين؟»</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Authentication:</tspan> proving you are who</tspan>
  <tspan x="120" dy="40">you claim to be. It asks: <tspan font-weight="bold" fill="#17457f">"Who are you?"</tspan></tspan>
</text>

<!-- Paragraph 4 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الصلاحيات Authorization:</tspan> ما يُسمح لك بفعله</tspan>
  <tspan x="950" dy="40">بعد معرفة هويتك؛ وسؤالها: <tspan font-weight="bold" fill="#17457f">«مسموح لك بإيه؟»</tspan></tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Authorization:</tspan> what you may do</tspan>
  <tspan x="120" dy="40">once you are known. It asks:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">"What are you allowed to do?"</tspan></tspan>
</text>
</svg>
