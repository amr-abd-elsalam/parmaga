<!-- Text -->
<text x="935" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">ملحوظة مهمة</tspan>
</text>
<text x="740" y="186" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" font-weight="bold" fill="#2e7d32">
  <tspan x="740" dy="0">Point!</tspan>
</text>

<text x="950" y="258" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">1. دور جدران الحماية</tspan>
</text>
<text x="120" y="294" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">1. The Role of Firewalls</tspan>
</text>

<text x="950" y="330" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">جدار الحماية</tspan> <tspan font-weight="bold" fill="#c0392b">Firewall:</tspan> نظام أو برنامج يراقب</tspan>
  <tspan x="950" dy="36">حركة مرور الشبكة ويسمح بها أو يمنعها وفق</tspan>
  <tspan x="950" dy="36"><tspan font-weight="bold" fill="#17457f">قواعد أمنية.</tspan> وقد يوجد عند حدود الشبكة، أو بين</tspan>
  <tspan x="950" dy="36">أجزائها، أو على جهاز مضيف.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="132" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">Firewall:</tspan> a system or program that</tspan>
  <tspan x="132" dy="36">monitors network traffic and allows or</tspan>
  <tspan x="132" dy="36">blocks it according to <tspan font-weight="bold" fill="#17457f">security rules.</tspan></tspan>
  <tspan x="132" dy="36">It may be placed at the network</tspan>
  <tspan x="132" dy="36">boundary, between parts of the network,</tspan>
  <tspan x="132" dy="36">or on a host device.</tspan>
</text>

<text x="950" y="726" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> السماح بالوصول إلى <tspan fill="#c96a1b">خادم الويب،</tspan> مع منع</tspan>
  <tspan x="950" dy="36">الوصول الخارجي المباشر إلى <tspan fill="#c96a1b">قاعدة البيانات.</tspan></tspan>
</text>
<text x="132" y="798" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">e.g.,</tspan> Allow access to the <tspan fill="#c96a1b">web server,</tspan></tspan>
  <tspan x="132" dy="36">while blocking direct external</tspan>
  <tspan x="132" dy="36">access to the <tspan fill="#c96a1b">database.</tspan></tspan>
</text>

<text x="935" y="942" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلح أساسي: <tspan fill="#c0392b">جدار الحماية</tspan> —</tspan>
  <tspan x="935" dy="36">يسمح بالاتصال أو يمنعه وفق</tspan>
  <tspan x="935" dy="36">قواعد محددة مسبقًا.</tspan>
</text>
<text x="455" y="1050" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" font-weight="bold" fill="#17457f">
  <tspan x="455" dy="0">KEY TERM: <tspan fill="#c0392b">Firewall</tspan> —</tspan>
  <tspan x="455" dy="36">allows or blocks</tspan>
  <tspan x="455" dy="36">communication according to</tspan>
  <tspan x="455" dy="36">preset rules.</tspan>
</text>
</svg>
