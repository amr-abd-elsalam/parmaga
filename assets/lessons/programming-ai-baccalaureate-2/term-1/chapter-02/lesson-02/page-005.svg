<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">كلمات الأساس</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Basic Words</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الشبكة الداخلية</tspan> Internal Network:</tspan>
  <tspan x="950" dy="40">جزء المؤسسة الخاص، أي <tspan font-weight="bold" fill="#17457f">«داخل البيت».</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Internal network:</tspan> the organization's</tspan>
  <tspan x="120" dy="40">private part — <tspan font-weight="bold" fill="#17457f">"inside the house."</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الشبكة الخارجية</tspan> External Network:</tspan>
  <tspan x="950" dy="40">كل ما خارج سيطرة المؤسسة،</tspan>
  <tspan x="950" dy="40">مثل الإنترنت، أي <tspan font-weight="bold" fill="#17457f">«الشارع».</tspan></tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">External network:</tspan> everything outside</tspan>
  <tspan x="120" dy="40">the organization's control, like the</tspan>
  <tspan x="120" dy="40">Internet — <tspan font-weight="bold" fill="#17457f">"the street."</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">حركة مرور الشبكة</tspan> Network Traffic:</tspan>
  <tspan x="950" dy="40">بيانات تتنقل بين الأجهزة في وحدات صغيرة</tspan>
  <tspan x="950" dy="40">اسمها <tspan font-weight="bold" fill="#17457f">الحزم</tspan> Packets.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Network traffic:</tspan> data moving between</tspan>
  <tspan x="120" dy="40">devices in small units called <tspan font-weight="bold" fill="#17457f">packets.</tspan></tspan>
</text>
</svg>
