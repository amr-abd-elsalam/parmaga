<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هات أربع شرائح جبن سويسري،</tspan>
  <tspan x="950" dy="40">وفي كل شريحة <tspan font-weight="bold" fill="#c0392b">ثقوب</tspan> هي <tspan font-weight="bold" fill="#17457f">نقاط ضعفها</tspan>.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Take four slices of Swiss cheese; each</tspan>
  <tspan x="120" dy="40">has <tspan font-weight="bold" fill="#c0392b">holes</tspan>, which are its <tspan font-weight="bold" fill="#17457f">weak points</tspan>.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">من شريحة واحدة ترى <tspan font-weight="bold" fill="#17457f">النور</tspan> بسهولة.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Through one slice, you see <tspan font-weight="bold" fill="#17457f">light</tspan> easily.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكن إذا رصصت الأربع،</tspan>
  <tspan x="950" dy="40">فمن <tspan font-weight="bold" fill="#17457f">النادر</tspan> أن تقع <tspan font-weight="bold" fill="#c0392b">الثقوب</tspan> كلها على خط واحد.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But stack all four,</tspan>
  <tspan x="120" dy="40">and the <tspan font-weight="bold" fill="#c0392b">holes</tspan> <tspan font-weight="bold" fill="#17457f">rarely</tspan> line up.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كل طبقة فيها ثغرات، لكن تكديسها</tspan>
  <tspan x="935" dy="40">يجعل مرور الهجوم منها كلها نادرًا.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Every layer has gaps, but stacking</tspan>
  <tspan x="140" dy="40">them makes it rare for an attack to</tspan>
  <tspan x="140" dy="40">pass through all of them.</tspan>
</text>
</svg>
