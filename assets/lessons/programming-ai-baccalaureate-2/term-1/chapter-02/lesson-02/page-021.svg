  <tspan x="950" dy="0">أهم ضوابطها</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Its Main Controls</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">برنامج <tspan font-weight="bold" fill="#17457f">مكافحة الفيروسات</tspan> Antivirus.</tspan>
</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Antivirus</tspan> software.</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تحديث</tspan> النظام والبرامج Updates.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Updating</tspan> the OS and apps.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">جدار حماية</tspan> خاص بالجهاز.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A <tspan font-weight="bold" fill="#17457f">firewall</tspan> on the device.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">قفل الشاشة</tspan> وكلمة مرور قوية.</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A <tspan font-weight="bold" fill="#17457f">screen lock</tspan> and a strong password.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّلها <tspan font-weight="bold" fill="#c0392b">مناعتك الشخصية:</tspan> المدرسة قد تكون</tspan>
  <tspan x="950" dy="40">نظيفة، لكن المناعة الضعيفة تمرض.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Think of it as <tspan font-weight="bold" fill="#c0392b">personal immunity:</tspan></tspan>
  <tspan x="120" dy="40">a clean school won't help</tspan>
  <tspan x="120" dy="40">if your immunity is weak.</tspan>
</text>
