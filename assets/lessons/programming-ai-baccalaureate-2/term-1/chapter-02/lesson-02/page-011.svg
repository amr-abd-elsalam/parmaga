<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: الزوار يصلون إلى <tspan font-weight="bold" fill="#2e7d32">خادم الويب،</tspan></tspan>
  <tspan x="950" dy="40">لا إلى <tspan font-weight="bold" fill="#17457f">قاعدة البيانات</tspan> مباشرة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: visitors reach the <tspan font-weight="bold" fill="#2e7d32">web server,</tspan></tspan>
  <tspan x="120" dy="40">but not the <tspan font-weight="bold" fill="#17457f">database</tspan> directly.</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">هل تعلم؟</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Did You Know?</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الاسم من المباني: <tspan font-weight="bold" fill="#c0392b">«الجدار الناري»</tspan> يمنع</tspan>
  <tspan x="935" dy="40">انتقال الحريق من جزء إلى آخر.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The name comes from buildings:</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#c0392b">"firewall"</tspan> stops fire spreading</tspan>
  <tspan x="140" dy="40">from one part to another.</tspan>
</text>
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وفي الشبكة: يوقف الخطر عند <tspan font-weight="bold" fill="#17457f">نقطة محددة.</tspan></tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In networks, it stops danger</tspan>
  <tspan x="140" dy="40">at a <tspan font-weight="bold" fill="#17457f">fixed point.</tspan></tspan>
</text>
</svg>
