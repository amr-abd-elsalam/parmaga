<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">المبادئ الثلاثة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Three Principles</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">التحقق الصريح:</tspan> يُتحقق من كل طلب، وغالبًا</tspan>
  <tspan x="950" dy="40">بالتحقق متعدد العوامل <tspan font-weight="bold" fill="#17457f">MFA،</tspan> كأن تُطلب كلمة</tspan>
  <tspan x="950" dy="40">مرور ورمز يصل إلى هاتفك.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">Verify explicitly:</tspan> every request is</tspan>
  <tspan x="132" dy="40">checked, often with <tspan font-weight="bold" fill="#17457f">MFA,</tspan> such as a</tspan>
  <tspan x="132" dy="40">password plus a code sent to your phone.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 <tspan font-weight="bold" fill="#c0392b">أقل صلاحية ممكنة</tspan> Least Privilege:</tspan>
  <tspan x="950" dy="40">كل شخص يأخذ ما يحتاجه فقط.</tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 <tspan font-weight="bold" fill="#c0392b">Least privilege:</tspan> each person gets</tspan>
  <tspan x="132" dy="40">only what they need.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 <tspan font-weight="bold" fill="#c0392b">افترض أن الاختراق وارد</tspan> Assume Breach:</tspan>
  <tspan x="950" dy="40">صمّم كأن المهاجم بالداخل فعلًا.</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 <tspan font-weight="bold" fill="#c0392b">Assume breach:</tspan> design as if the</tspan>
  <tspan x="132" dy="40">attacker is already inside.</tspan>
</text>

<text x="871" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="871" dy="0">تحقّق</tspan>
</text>
<text x="792" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="792" dy="0">Verify</tspan>
</text>
<text x="608" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="608" dy="0">أقل صلاحية</tspan>
</text>
<text x="432" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="432" dy="0">Least privilege</tspan>
</text>
<text x="333" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="333" dy="0">افترض الاختراق</tspan>
</text>
<text x="129" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="129" dy="0">Assume breach</tspan>
</text>
</svg>
