<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadow -->
<rect x="109" y="888" width="870" height="248" rx="16" fill="#22303f" opacity=".12"/>

<!-- Key-term card (Main idea variant) -->
<rect x="105" y="882" width="870" height="248" rx="16" fill="#fdf6d8" stroke="#e0c46a" stroke-width="2"/>
<rect x="961" y="898" width="6" height="216" rx="3" fill="#e0a55e"/>

<!-- Thin navy lines on the left edge of English blocks -->
<line x1="108" y1="366" x2="108" y2="524" stroke="#152b42" stroke-width="2" stroke-linecap="round"/>
<line x1="108" y1="686" x2="108" y2="844" stroke="#152b42" stroke-width="2" stroke-linecap="round"/>
<line x1="128" y1="1006" x2="128" y2="1122" stroke="#152b42" stroke-width="2" stroke-linecap="round"/>

<!-- Icon: network nodes -->
<g transform="translate(180 288)">
  <line x1="28" y1="12" x2="10" y2="44" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="12" x2="46" y2="44" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="44" x2="46" y2="44" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="12" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="10" cy="44" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="46" cy="44" r="9" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: shield -->
<g transform="translate(905 742)">
  <path d="M28 3 L50 11 L50 28 C50 42 40 50 28 55 C16 50 6 42 6 28 L6 11 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 29 L25 36 L39 21" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: open book -->
<g transform="translate(150 894)">
  <path d="M28 14 C20 8 10 8 4 10 L4 46 C10 44 20 44 28 50 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 14 C36 8 46 8 52 10 L52 46 C46 44 36 44 28 50 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="11" y1="22" x2="21" y2="22" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <line x1="11" y1="31" x2="21" y2="31" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="22" x2="45" y2="22" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="31" x2="45" y2="31" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">3. المنطقة المعزولة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">3. DMZ (Demilitarized Zone)</text>

<!-- (1) Arabic -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">المنطقة المعزولة DMZ:</tspan> منطقة تُوضع فيها</tspan>
  <tspan x="950" dy="40">الخوادم المعرَّضة للشبكة الخارجية</tspan>
  <tspan x="950" dy="40">(خوادم الويب، وخوادم البريد، وغيرها)</tspan>
  <tspan x="950" dy="40">منفصلةً عن <tspan font-weight="bold" fill="#17457f">الشبكة الداخلية.</tspan></tspan>
</text>

<!-- (1) English -->
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">DMZ:</tspan> an area where servers exposed</tspan>
  <tspan x="120" dy="40">to the external network (web servers,</tspan>
  <tspan x="120" dy="40">mail servers, etc.) are placed separately</tspan>
  <tspan x="120" dy="40">from the <tspan font-weight="bold" fill="#17457f">internal network.</tspan></tspan>
</text>

<!-- (2) Arabic -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">(2) يساعد <tspan font-weight="bold" fill="#17457f">فصل الخوادم العامة</tspan> في <tspan font-weight="bold" fill="#c0392b">منطقة معزولة</tspan></tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#2e7d32">تقليل</tspan> احتمال وصول الهجوم منها إلى</tspan>
  <tspan x="950" dy="40">الشبكة الداخلية إذا تعرّض أحدها للاختراق.</tspan>
</text>

<!-- (2) English -->
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">(2) <tspan font-weight="bold" fill="#17457f">Separating public servers</tspan> in a <tspan font-weight="bold" fill="#c0392b">DMZ</tspan></tspan>
  <tspan x="120" dy="40">helps <tspan font-weight="bold" fill="#2e7d32">reduce</tspan> the likelihood that an</tspan>
  <tspan x="120" dy="40">attack will reach the internal network</tspan>
  <tspan x="120" dy="40">from them if one of them is breached.</tspan>
</text>

<!-- Key-term card: Arabic -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">مصطلح أساسي:</tspan> <tspan font-weight="bold" fill="#c0392b">المنطقة المعزولة</tspan> —</tspan>
  <tspan x="935" dy="40">منطقة للخوادم المواجهة للجمهور،</tspan>
  <tspan x="935" dy="40">منفصلة عن الشبكة الداخلية.</tspan>
</text>

<!-- Key-term card: English -->
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">KEY TERM:</tspan> <tspan font-weight="bold" fill="#c0392b">DMZ</tspan> — a zone for</tspan>
  <tspan x="140" dy="40">public-facing servers, separated from</tspan>
  <tspan x="140" dy="40">the internal network.</tspan>
</text>
</svg>
