  <circle cx="540" cy="400" r="225" fill="#ffffff" stroke="#2f7fb5" stroke-width="3"/>
  <circle cx="540" cy="400" r="170" fill="#dff1f7" stroke="#2f7fb5" stroke-width="3"/>
  <circle cx="540" cy="400" r="115" fill="#ffffff" stroke="#2f7fb5" stroke-width="3"/>
  <circle cx="540" cy="400" r="60" fill="#dff1f7" stroke="#2f7fb5" stroke-width="3"/>

  <!-- Central database -->
  <path d="M 516 384 L 516 428 A 28 10 0 0 0 572 428 L 572 384 Z" fill="#22303f" opacity=".18"/>
  <path d="M 512 378 L 512 422 A 28 10 0 0 0 568 422 L 568 378" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 512 400 A 28 10 0 0 0 568 400" fill="none" stroke="#dff1f7" stroke-width="2"/>
  <ellipse cx="540" cy="378" rx="28" ry="10" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>

