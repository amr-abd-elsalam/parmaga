  <path d="M 297 566 L 297 559 A 8 8 0 0 1 313 559 L 313 566" fill="none" stroke="#22303f" stroke-width="3"/>
  <rect x="292" y="566" width="26" height="20" rx="4" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="305" cy="576" r="3" fill="#ffffff"/>

  <!-- Green checkmarks at tunnel crossings -->
  <g transform="translate(357 531)">
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <path d="M -5 0 L -1.5 4 L 5 -4" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  </g>
  <g transform="translate(402 499)">
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <path d="M -5 0 L -1.5 4 L 5 -4" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  </g>
  <g transform="translate(447 467)">
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <path d="M -5 0 L -1.5 4 L 5 -4" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  </g>
  <g transform="translate(491 435)">
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <path d="M -5 0 L -1.5 4 L 5 -4" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  </g>

  <!-- House with laptop (lower-left) -->
  <rect x="144" y="596" width="120" height="95" fill="#22303f" opacity=".18"/>
  <rect x="140" y="590" width="120" height="95" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="128,592 200,532 272,592" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="165" y="610" width="70" height="46" rx="4" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="152,664 248,664 240,674 160,674" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>

  <!-- Thin red wall line -->
  <line x1="790" y1="320" x2="790" y2="480" stroke="#c0392b" stroke-width="2.4"/>

  <!-- Dashed zone with two servers (right side) -->
  <rect x="815" y="290" width="140" height="220" rx="14" fill="#ffffff" stroke="#7f95ab" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="854" y="318" width="70" height="80" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="850" y="312" width="70" height="80" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="860" y="326" width="36" height="8" rx="3" fill="#17457f"/>
  <rect x="860" y="342" width="36" height="8" rx="3" fill="#17457f"/>
  <rect x="860" y="358" width="36" height="8" rx="3" fill="#17457f"/>
  <circle cx="908" cy="330" r="4" fill="#a9dcbe"/>
  <circle cx="908" cy="346" r="4" fill="#a9dcbe"/>
  <circle cx="908" cy="362" r="4" fill="#a9dcbe"/>
  <rect x="854" y="414" width="70" height="80" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="850" y="408" width="70" height="80" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="860" y="422" width="36" height="8" rx="3" fill="#17457f"/>
  <rect x="860" y="438" width="36" height="8" rx="3" fill="#17457f"/>
  <circle cx="908" cy="426" r="4" fill="#a9dcbe"/>
  <circle cx="908" cy="442" r="4" fill="#a9dcbe"/>
  <rect x="868" y="455" width="34" height="22" rx="2" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <path d="M 868 455 L 885 468 L 902 455" fill="none" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Title panel -->
<rect x="111" y="726" width="870" height="320" rx="28" fill="#22303f" opacity=".18"/>
<rect x="105" y="720" width="870" height="320" rx="28" fill="#17457f"/>

<!-- Icon row -->
<g stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(260 1150)">
    <path d="M -20 -24 L 20 -24 L 20 0 Q 20 20 0 28 Q -20 20 -20 0 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
