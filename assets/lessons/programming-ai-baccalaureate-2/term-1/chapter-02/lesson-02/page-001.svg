  </g>
  <g transform="translate(540 1150)">
    <line x1="-18" y1="14" x2="18" y2="14" stroke="#22303f" stroke-width="2.5"/>
    <line x1="-18" y1="14" x2="0" y2="-16" stroke="#22303f" stroke-width="2.5"/>
    <line x1="18" y1="14" x2="0" y2="-16" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="-16" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="-18" cy="14" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="18" cy="14" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="translate(680 1150)">
