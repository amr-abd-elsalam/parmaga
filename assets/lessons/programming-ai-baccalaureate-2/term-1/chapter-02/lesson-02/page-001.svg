    <circle cx="-12" cy="0" r="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="-12" cy="0" r="4" fill="#ffffff"/>
  </g>
  <g transform="translate(820 1150)">
    <circle cx="0" cy="0" r="26" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -11 1 L -3 9 L 12 -8" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</g>

