  <path d="M 519 156 L 569 156 L 569 186 Q 569 211 544 221 Q 519 211 519 186 Z" fill="#22303f" opacity=".18"/>
  <path d="M 515 150 L 565 150 L 565 180 Q 565 205 540 215 Q 515 205 515 180 Z" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
