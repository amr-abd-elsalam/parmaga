  <line x1="517" y1="174" x2="563" y2="174" stroke="#ffffff" stroke-width="2"/>
  <line x1="518" y1="186" x2="562" y2="186" stroke="#ffffff" stroke-width="2"/>
  <line x1="524" y1="198" x2="556" y2="198" stroke="#ffffff" stroke-width="2"/>
  <line x1="540" y1="152" x2="540" y2="162" stroke="#ffffff" stroke-width="2"/>
  <line x1="527" y1="162" x2="527" y2="174" stroke="#ffffff" stroke-width="2"/>
  <line x1="553" y1="162" x2="553" y2="174" stroke="#ffffff" stroke-width="2"/>
  <line x1="540" y1="174" x2="540" y2="186" stroke="#ffffff" stroke-width="2"/>
  <line x1="530" y1="186" x2="530" y2="198" stroke="#ffffff" stroke-width="2"/>
  <line x1="550" y1="186" x2="550" y2="198" stroke="#ffffff" stroke-width="2"/>

