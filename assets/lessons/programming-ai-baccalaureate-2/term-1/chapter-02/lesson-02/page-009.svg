<!-- Texts -->
<text x="950"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="950" dy="0">تكوين شبكة</tspan>
  <tspan x="950" dy="50">المنطقة المعزولة (DMZ)</tspan>
</text>
<text x="540"
      y="210"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      fill="#152b42">DMZ Network Configuration</text>
<text x="950"
      y="994"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">إذا هوجم <tspan font-weight="bold" fill="#c0392b">خادم عام،</tspan> <tspan font-weight="bold" fill="#2e7d32">يقل احتمال</tspan></tspan>
  <tspan x="950" dy="40">وصول الهجوم إلى <tspan font-weight="bold" fill="#17457f">الشبكة الداخلية.</tspan></tspan>
</text>
<text x="120"
      y="1074"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">If a <tspan font-weight="bold" fill="#c0392b">public server</tspan> is attacked,</tspan>
  <tspan x="120" dy="40">the attack is <tspan font-weight="bold" fill="#2e7d32">less likely</tspan> to reach</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">internal network.</tspan></tspan>
</text>
