<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">جدار الحماية: البوّاب الذكي</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Firewall: The Smart Guard</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جدار الحماية Firewall:</tspan> نظام أو جهاز</tspan>
  <tspan x="950" dy="40">أو برنامج يراقب حركة مرور الشبكة، ويسمح بها</tspan>
  <tspan x="950" dy="40">أو يمنعها وفق <tspan font-weight="bold" fill="#17457f">قواعد أمنية</tspan> محددة مسبقًا.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Firewall:</tspan> a system, device, or software</tspan>
  <tspan x="120" dy="40">that monitors network traffic</tspan>
  <tspan x="120" dy="40">and allows or blocks it based on</tspan>
  <tspan x="120" dy="40">preset <tspan font-weight="bold" fill="#17457f">security rules.</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يوضع غالبًا عند <tspan font-weight="bold" fill="#17457f">نقطة دخول الشبكة</tspan> وخروجها،</tspan>
  <tspan x="950" dy="40">وقد يوضع بين أجزاء الشبكة الداخلية،</tspan>
  <tspan x="950" dy="40">أو على <tspan font-weight="bold" fill="#17457f">الجهاز</tspan> نفسه.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It usually sits at the network's</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">entry/exit point,</tspan> but it can also sit</tspan>
  <tspan x="120" dy="40">between internal parts</tspan>
  <tspan x="120" dy="40">or on the <tspan font-weight="bold" fill="#17457f">device</tspan> itself.</tspan>
</text>

<text x="448" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">عند البوابة</text>
<text x="300" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">At the gate</text>
<text x="695" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">بين أجزاء الشبكة</text>
<text x="416" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Between network parts</text>
<text x="919" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">على الجهاز</text>
<text x="748" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">On the device</text>
</svg>
