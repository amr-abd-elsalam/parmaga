<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">ما لا تفعله الـ VPN</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">What a VPN Does NOT Do</tspan>
</text>

<!-- Bullet 1 -->
<text x="930" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا تحذف الفيروسات؛</tspan>
  <tspan x="930" dy="40">فهذا عمل <tspan font-weight="bold" fill="#17457f">برنامج المكافحة.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It does not delete viruses;</tspan>
  <tspan x="140" dy="40">that is <tspan font-weight="bold" fill="#17457f">antivirus</tspan> work.</tspan>
</text>

<!-- Bullet 2 -->
<text x="930" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا تجعلك <tspan font-weight="bold" fill="#c0392b">مجهول الهوية</tspan> تمامًا؛</tspan>
  <tspan x="930" dy="40">فمزوّد الخدمة نفسه قد يرى اتصالك.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It does not make you fully <tspan font-weight="bold" fill="#c0392b">anonymous;</tspan></tspan>
  <tspan x="140" dy="40">the VPN provider itself</tspan>
  <tspan x="140" dy="40">may see your connection.</tspan>
</text>

<!-- Bullet 3 -->
<text x="930" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">لا تحميك إذا ضغطت على <tspan font-weight="bold" fill="#c0392b">رابط احتيالي.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It does not protect you</tspan>
  <tspan x="140" dy="40">if you click a <tspan font-weight="bold" fill="#c0392b">scam link.</tspan></tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الـ VPN تحمي <tspan fill="#2e7d32">الطريق،</tspan> لا الجهاز ولا قرارك.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">A VPN protects <tspan fill="#2e7d32">the road,</tspan></tspan>
  <tspan x="140" dy="40">not the device or your decision.</tspan>
</text>
</svg>
