<g transform="translate(118 290)">
  <path d="M 28 4 L 50 12 L 50 28 C 50 42 40 50 28 54 C 16 50 6 42 6 28 L 6 12 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 18 29 L 25 36 L 39 21" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: network nodes -->
<g transform="translate(890 556)">
  <line x1="10" y1="44" x2="28" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="12" x2="46" y2="44" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="44" x2="46" y2="44" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="12" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="10" cy="44" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="46" cy="44" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Sketch: two computers connected by a tunnel with a lock through a cloud -->
<g>
  <path d="M 384 866 C 339 866 324 816 364 801 C 354 751 414 726 454 751 C 474 701 564 696 584 741 C 614 711 684 721 684 771 C 729 771 744 826 709 841 C 724 861 709 868 694 866 Z" fill="#22303f" opacity=".18"/>
  <path d="M 380 860 C 335 860 320 810 360 795 C 350 745 410 720 450 745 C 470 695 560 690 580 735 C 610 705 680 715 680 765 C 725 765 740 820 705 835 C 720 855 705 862 690 860 Z" fill="url(#ilCloud)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="262" y="770" width="564" height="52" rx="4" fill="#22303f" opacity=".18"/>
  <rect x="258" y="764" width="564" height="52" rx="4" fill="url(#ilTube)" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="258" cy="790" rx="10" ry="26" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="822" cy="790" rx="10" ry="26" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
