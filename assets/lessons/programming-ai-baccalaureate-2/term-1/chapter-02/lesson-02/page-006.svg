  <path d="M 527 784 L 527 775 A 13 13 0 0 1 553 775 L 553 784" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <rect x="518" y="784" width="44" height="34" rx="6" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="798" r="4" fill="#22303f"/>
  <rect x="538" y="800" width="4" height="10" rx="2" fill="#22303f"/>
</g>

<!-- Smile face -->
<g transform="translate(880 1058)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Texts -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">2. الشبكة الافتراضية</tspan>
  <tspan x="540" dy="50">الخاصة (VPN)</tspan>
</text>

<text x="540"
      y="208"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      fill="#152b42">2. VPN (Virtual Private Network)</text>

<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">الشبكة الافتراضية الخاصة VPN:</tspan> اتصال أو</tspan>
  <tspan x="950" dy="40">شبكة منطقية خاصة عبر شبكة عامة مثل الإنترنت،</tspan>
  <tspan x="950" dy="40">تستخدم عادةً <tspan font-weight="bold" fill="#17457f">التشفير</tspan> وتقنيات النفق Tunneling</tspan>
  <tspan x="950" dy="40">لحماية البيانات بين الطرفين.</tspan>
</text>

<text x="120"
      y="474"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">(1) <tspan font-weight="bold" fill="#c0392b">VPN:</tspan> a private logical connection</tspan>
  <tspan x="120" dy="40">or network over a public network such as</tspan>
  <tspan x="120" dy="40">the Internet. It usually uses <tspan font-weight="bold" fill="#17457f">encryption</tspan></tspan>
  <tspan x="120" dy="40">and tunneling to protect data between</tspan>
  <tspan x="120" dy="40">the two ends.</tspan>
</text>

<text x="950"
      y="954"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">تنقل الشبكة الافتراضية الخاصة <tspan font-weight="bold" fill="#c0392b">(VPN)</tspan> البيانات</tspan>
  <tspan x="950" dy="40">بأمان عبر شبكة غير موثوقة.</tspan>
</text>

<text x="120"
      y="1034"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">VPN</tspan> carries data securely</tspan>
  <tspan x="120" dy="40">across an untrusted network.</tspan>
</text>
</svg>
