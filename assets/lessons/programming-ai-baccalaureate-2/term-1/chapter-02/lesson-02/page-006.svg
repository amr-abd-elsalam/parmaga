<!-- Paragraph 1: Asset -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأصل</tspan> Asset: أي شيء له قيمة</tspan>
  <tspan x="950" dy="40">ويحتاج إلى حماية، مثل <tspan fill="#c96a1b">قاعدة بيانات العملاء.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Asset:</tspan> anything valuable that needs</tspan>
  <tspan x="120" dy="40">protection, like a <tspan fill="#c96a1b">customer database.</tspan></tspan>
</text>

<!-- Paragraph 2: Threat -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التهديد</tspan> Threat: أي شيء قد يضر أصلًا:</tspan>
  <tspan x="950" dy="40">مهاجم، أو فيروس، أو خطأ موظف.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Threat:</tspan> anything that could harm an</tspan>
  <tspan x="120" dy="40">asset: an attacker, a virus,</tspan>
  <tspan x="120" dy="40">or a staff mistake.</tspan>
</text>

<!-- Paragraph 3: Risk -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخطر</tspan> Risk: <tspan font-weight="bold" fill="#17457f">احتمال</tspan> وقوع التهديد فعلًا،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">وحجم ضرره</tspan> لو وقع.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Risk:</tspan> <tspan font-weight="bold" fill="#17457f">how likely</tspan> a threat is to happen,</tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">how much harm</tspan> it causes.</tspan>
</text>

<!-- Warning card text -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه:</tspan> اللص في المدينة <tspan font-weight="bold" fill="#17457f">تهديد،</tspan></tspan>
  <tspan x="935" dy="40">واحتمال دخوله بيتك أنت هو <tspan font-weight="bold" fill="#17457f">الخطر.</tspan></tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Careful:</tspan> a thief in the city is</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#17457f">threat;</tspan> the chance he enters your</tspan>
  <tspan x="140" dy="40">house is the <tspan font-weight="bold" fill="#17457f">risk.</tspan></tspan>
</text>
</svg>
