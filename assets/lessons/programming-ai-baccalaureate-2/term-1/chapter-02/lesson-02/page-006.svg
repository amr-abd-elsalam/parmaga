  <circle cx="440" cy="790" r="5" fill="#ffffff"/>
  <circle cx="475" cy="790" r="5" fill="#ffffff"/>
  <circle cx="605" cy="790" r="5" fill="#ffffff"/>
  <circle cx="640" cy="790" r="5" fill="#ffffff"/>
  <circle cx="675" cy="790" r="5" fill="#ffffff"/>
  <circle cx="710" cy="790" r="5" fill="#ffffff"/>
  <circle cx="745" cy="790" r="5" fill="#ffffff"/>
  <circle cx="780" cy="790" r="5" fill="#ffffff"/>

  <rect x="129" y="736" width="120" height="85" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="125" y="730" width="120" height="85" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="135" y="740" width="100" height="62" rx="4" fill="url(#ilScreen)"/>
  <rect x="148" y="752" width="50" height="6" rx="3" fill="#ffffff"/>
  <rect x="148" y="766" width="74" height="6" rx="3" fill="#ffffff"/>
  <rect x="148" y="780" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="175" y="815" width="20" height="22" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="150" y="837" width="70" height="10" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>

  <rect x="839" y="736" width="120" height="85" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="835" y="730" width="120" height="85" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="845" y="740" width="100" height="62" rx="4" fill="url(#ilScreen)"/>
  <rect x="858" y="752" width="50" height="6" rx="3" fill="#ffffff"/>
  <rect x="858" y="766" width="74" height="6" rx="3" fill="#ffffff"/>
  <rect x="858" y="780" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="885" y="815" width="20" height="22" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
