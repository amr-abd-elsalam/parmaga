<!-- Point 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">النقطة 1</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Point 1</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جدار الحماية</tspan> يطبق <tspan font-weight="bold" fill="#17457f">قواعد محددة مسبقًا؛</tspan></tspan>
  <tspan x="950" dy="40">فإذا تجاوزه المهاجم بثغرة أو باتصال يبدو</tspan>
  <tspan x="950" dy="40">مسموحًا، لم يبقَ ما يحمي الشبكة.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">firewall</tspan> applies <tspan font-weight="bold" fill="#17457f">preset rules;</tspan></tspan>
  <tspan x="120" dy="40">if an attacker passes it through a gap</tspan>
  <tspan x="120" dy="40">or allowed-looking traffic, nothing else</tspan>
  <tspan x="120" dy="40">protects the network.</tspan>
</text>

<!-- Point 2 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">النقطة 2</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Point 2</text>
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مع <tspan font-weight="bold" fill="#c0392b">الطبقات:</tspan> خادم الويب المخترَق <tspan font-weight="bold" fill="#17457f">معزول</tspan></tspan>
  <tspan x="950" dy="40">في الـ DMZ، فلا يصل المهاجم مباشرة</tspan>
  <tspan x="950" dy="40">إلى قاعدة البيانات.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">With <tspan font-weight="bold" fill="#c0392b">layers:</tspan> a hacked web server is</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">isolated</tspan> in the DMZ, so the attacker</tspan>
  <tspan x="120" dy="40">cannot reach the database directly.</tspan>
</text>
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والاتصال البعيد <tspan font-weight="bold" fill="#2e7d32">مشفر</tspan> بالـ VPN، والأجهزة</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">المحدَّثة</tspan> توقف الفيروس الذي تجاوز البوابة.</tspan>
</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Remote traffic is <tspan font-weight="bold" fill="#2e7d32">encrypted</tspan> by the VPN,</tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">updated</tspan> devices stop a virus that</tspan>
  <tspan x="120" dy="40">passed the gate.</tspan>
</text>
</svg>
