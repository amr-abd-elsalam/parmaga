<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">الصياغة الدقيقة</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">Precise Wording</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المنطقة المعزولة</tspan> <tspan font-weight="bold" fill="#17457f">تقلل بشدة</tspan> احتمال وصول</tspan>
  <tspan x="935" dy="40">الهجوم إلى الداخل، لكنها ليست ضمانًا مطلقًا.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A <tspan font-weight="bold" fill="#c0392b">DMZ</tspan> <tspan font-weight="bold" fill="#17457f">greatly reduces</tspan> the chance</tspan>
  <tspan x="140" dy="40">an attack gets inside,</tspan>
  <tspan x="140" dy="40">but it is no absolute guarantee.</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وفي الامتحان، اكتب عبارة الكتاب:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">«يمكن منع الضرر».</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In the exam, use the book's words:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">"damage can be prevented."</tspan></tspan>
</text>
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">المنطقة المعزولة: افتح للضيف بابًا،</tspan>
  <tspan x="935" dy="40">ولا تفتح له البيت.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DMZ: open a door for the guest,</tspan>
  <tspan x="140" dy="40">not the whole house.</tspan>
</text>
</svg>
