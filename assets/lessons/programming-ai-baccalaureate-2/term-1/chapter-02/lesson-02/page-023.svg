<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الدفاع في العمق:</tspan>
  <tspan x="540" dy="48">الجبن السويسري</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Defense in Depth: The Swiss Cheese</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الدفاع في العمق</tspan> Defense in Depth:</tspan>
  <tspan x="950" dy="40">تكديس طبقات متعددة <tspan font-weight="bold" fill="#17457f">ومتنوعة</tspan> من الضوابط،</tspan>
  <tspan x="950" dy="40">فإذا فشلت طبقة، بقيت الأخرى تقلل الخطر.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Defense in depth:</tspan> stacking many <tspan font-weight="bold" fill="#17457f">different</tspan></tspan>
  <tspan x="120" dy="40">layers of controls, so if one fails,</tspan>
  <tspan x="120" dy="40">the others still reduce the risk.</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">الكلمة المفتاحية: <tspan fill="#c0392b">«متنوعة».</tspan></text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">The key word: <tspan fill="#c0392b">"different."</tspan></text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ثلاثة أقفال من <tspan font-weight="bold" fill="#17457f">النوع نفسه</tspan></tspan>
  <tspan x="950" dy="40">ليست دفاعًا في العمق؛</tspan>
  <tspan x="950" dy="40">فالمفتاح الذي يفتح الأول يفتح الثلاثة.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Three <tspan font-weight="bold" fill="#17457f">identical</tspan> locks are not</tspan>
  <tspan x="120" dy="40">defense in depth:</tspan>
  <tspan x="120" dy="40">the key that opens one opens all three.</tspan>
</text>
</svg>
