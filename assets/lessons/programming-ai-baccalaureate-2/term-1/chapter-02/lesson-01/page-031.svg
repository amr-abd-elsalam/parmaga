<!-- Paragraph 1 Arabic -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال تعرفه: ماكينة الصراف الآلي <tspan fill="#c96a1b">ATM</tspan> تطلب</tspan>
  <tspan x="950" dy="40">البطاقة <tspan font-weight="bold" fill="#17457f">(حيازة)</tspan> والرقم السري <tspan font-weight="bold" fill="#17457f">(معرفة).</tspan></tspan>
</text>

<!-- Paragraph 1 English -->
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">An example you know:</tspan>
  <tspan x="120" dy="40">the <tspan fill="#c96a1b">ATM</tspan> asks for the card <tspan font-weight="bold" fill="#17457f">(possession)</tspan></tspan>
  <tspan x="120" dy="40">and the PIN <tspan font-weight="bold" fill="#17457f">(knowledge).</tspan></tspan>
</text>

<!-- Paragraph 2 Arabic -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أما خطوتان من <tspan font-weight="bold" fill="#17457f">العامل نفسه،</tspan> مثل كلمتي مرور،</tspan>
  <tspan x="950" dy="40">فليستا <tspan font-weight="bold" fill="#c0392b">مصادقة متعددة العوامل.</tspan></tspan>
</text>

<!-- Paragraph 2 English -->
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But two steps from the <tspan font-weight="bold" fill="#17457f">same factor,</tspan></tspan>
  <tspan x="120" dy="40">like two passwords, are not</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">multi-factor authentication.</tspan></tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">عِدّ <tspan fill="#c0392b">الفئات…</tspan> مش الخطوات.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Count the <tspan fill="#c0392b">categories…</tspan> not the steps.</tspan>
</text>

<!-- Illustration labels -->
<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">البطاقة: حيازة</tspan>
</text>
<text x="690" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="690" dy="0">Card: possession</tspan>
</text>
<text x="405" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="405" dy="0">الرقم السري: معرفة</tspan>
</text>
<text x="130" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="130" dy="0">PIN: knowledge</tspan>
</text>
</svg>
