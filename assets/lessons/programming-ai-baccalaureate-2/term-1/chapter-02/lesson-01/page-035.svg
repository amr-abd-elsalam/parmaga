<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">القصة كاملة: منى تشتري سماعة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Whole Story: Mona Buys Headphones</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 تكتب منى اسم المتجر فيظهر <tspan font-weight="bold" fill="#17457f">القفل،</tspan></tspan>
  <tspan x="950" dy="40">وتبدأ <tspan font-weight="bold" fill="#c0392b">مصافحة TLS.</tspan></tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 Mona types the shop's name, the <tspan font-weight="bold" fill="#17457f">padlock</tspan></tspan>
  <tspan x="132" dy="40">appears, and the <tspan font-weight="bold" fill="#c0392b">TLS handshake</tspan> begins.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 يقدّم المتجر شهادته، ويسأل المتصفح:</tspan>
  <tspan x="950" dy="40">هل وقّعتها <tspan font-weight="bold" fill="#17457f">جهة</tspan> أثق بها؟ وهل الاسم مطابق</tspan>
  <tspan x="950" dy="40">للعنوان؟ ← <tspan font-weight="bold" fill="#c0392b">الشهادة الرقمية.</tspan></tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 The shop presents its certificate, and</tspan>
  <tspan x="132" dy="40">the browser asks: Did an <tspan font-weight="bold" fill="#17457f">authority</tspan> I</tspan>
  <tspan x="132" dy="40">trust sign it? Does the name match the</tspan>
  <tspan x="132" dy="40">address? → <tspan font-weight="bold" fill="#c0392b">Digital certificate.</tspan></tspan>
</text>

<text x="950" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">منى</text>
<text x="882" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Mona</text>
<text x="500" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">فحص الشهادة</text>
<text x="290" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Certificate check</text>
</svg>
