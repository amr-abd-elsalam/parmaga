<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">انتبه</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">WATCH OUT</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">القفل</tspan> لا يعني أن الموقع أمين؛ فموقع محتال</tspan>
  <tspan x="935" dy="40">قد يملك قفلًا وشهادة صحيحة لاسمه هو.</tspan>
  <tspan x="935" dy="40">راجع <tspan font-weight="bold" fill="#17457f">اسم النطاق</tspan> حرفًا حرفًا.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#c0392b">padlock</tspan> does not mean the site is</tspan>
  <tspan x="140" dy="40">honest; a scam site can have a padlock</tspan>
  <tspan x="140" dy="40">and a valid certificate for its own</tspan>
  <tspan x="140" dy="40">name. Check the <tspan font-weight="bold" fill="#17457f">domain name</tspan></tspan>
  <tspan x="140" dy="40">letter by letter.</tspan>
</text>
<text x="851" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="851" dy="0">الاسم الحقيقي</tspan>
</text>
<text x="678" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="678" dy="0">Real name</tspan>
</text>
<text x="435" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="435" dy="0">اسم يختلف بحرف</tspan>
</text>
<text x="157" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="157" dy="0">Name off by one letter</tspan>
</text>
</svg>
