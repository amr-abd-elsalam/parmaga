  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: pencil -->
<g transform="translate(306 640)">
  <polygon points="6,38 10,26 32,4 40,12 18,34" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="6,38 10,26 18,34" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="32,4 36,0 44,8 40,12" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Thinking face -->
<g transform="translate(860 862)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
