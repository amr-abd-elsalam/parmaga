  <path d="M28 2 L52 11 V28 C52 44 41 53 28 58 C15 53 4 44 4 28 V11 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 12 L42 17 V29 C42 39 36 45 28 48 C20 45 14 39 14 29 V17 Z" fill="#2f7fb5"/>
</g>

<!-- Icon: check badge -->
<g transform="translate(886 1135)">
  <circle cx="28" cy="28" r="26" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 29 L25 38 L41 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">اسم النطاق</tspan> Domain name: الاسم المكتوب في</tspan>
  <tspan x="950" dy="40">شريط العنوان، مثل <tspan fill="#c96a1b">example.com</tspan>.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Domain name:</tspan> the name written in the</tspan>
  <tspan x="120" dy="40">address bar, like <tspan fill="#c96a1b">example.com</tspan>.</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0"><tspan fill="#c0392b">الشهادة</tspan> هي بطاقة الرقم القومي</tspan>
  <tspan x="935" dy="40">بتاعة الموقع، وجهة الإصدار هي</tspan>
  <tspan x="935" dy="40">السجل المدني اللي طلّعها.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The <tspan fill="#c0392b">certificate</tspan> is the site's</tspan>
  <tspan x="140" dy="40">national ID card, and the authority</tspan>
  <tspan x="140" dy="40">is the civil registry that issued it.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك 4</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT 4</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">افتح أي موقع واضغط على <tspan font-weight="bold" fill="#17457f">القفل</tspan> بجوار</tspan>
  <tspan x="935" dy="40">العنوان. ما اسم الجهة التي أصدرت شهادته؟</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Open any site and click the <tspan font-weight="bold" fill="#17457f">padlock</tspan></tspan>
  <tspan x="140" dy="40">next to the address.</tspan>
  <tspan x="140" dy="40">What is the name of the authority that</tspan>
  <tspan x="140" dy="40">issued its certificate?</tspan>
</text>
</svg>
