<!-- Icon: open book -->
<g transform="translate(132 128)">
  <path d="M32 10 C24 4 12 4 4 8 V44 C12 40 24 40 32 46 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 10 C40 4 52 4 60 8 V44 C52 40 40 40 32 46 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
