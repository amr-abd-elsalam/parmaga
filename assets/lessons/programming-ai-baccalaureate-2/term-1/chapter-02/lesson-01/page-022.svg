  <path d="M14 24 V16 A14 14 0 0 1 42 16 V24" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <rect x="6" y="24" width="44" height="32" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="38" r="5" fill="#22303f"/>
  <rect x="26" y="40" width="4" height="10" fill="#22303f"/>
</g>

<!-- Icon: shield -->
