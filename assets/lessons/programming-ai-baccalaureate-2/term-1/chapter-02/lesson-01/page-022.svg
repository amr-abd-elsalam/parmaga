  <polygon points="256,1200 250,1228 260,1222 264,1204" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="276,1200 282,1228 272,1222 268,1204" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="266" cy="1192" r="14" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="266" cy="1192" r="6" fill="#2e7d32"/>
  <rect x="320" y="1144" width="340" height="14" rx="7" fill="#8fc9f2"/>
