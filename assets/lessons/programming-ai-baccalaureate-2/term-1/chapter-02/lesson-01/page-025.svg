<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">مين غيّر الرسالة؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Who Changed the Message?</text>

<!-- Paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البصمة</tspan> (دالة التجزئة) Hash: دالة</tspan>
  <tspan x="950" dy="40">تحوّل أي بيانات، مهما طالت، إلى بصمة</tspan>
  <tspan x="950" dy="40">قصيرة <tspan font-weight="bold" fill="#17457f">ثابتة الطول.</tspan></tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Hash:</tspan> a function that turns any data,</tspan>
  <tspan x="120" dy="40">however long, into a short fingerprint</tspan>
  <tspan x="120" dy="40">of <tspan font-weight="bold" fill="#17457f">fixed length.</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">بيانات بأي طول</text>
<text x="660" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Data of any length</text>
<text x="440" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">بصمة قصيرة ثابتة الطول</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="120" dy="0">Short fixed-length</tspan>
  <tspan x="120" dy="40">fingerprint</tspan>
</text>

<!-- Outlined box texts -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّع 2</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PREDICT 2</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو غيّر سمير الرقم 1 إلى 10 في الطلب،</tspan>
