<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">نموذج الإجابة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Model Answer</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 الأمان: التشفير بالمفتاح العام يسمح</tspan>
  <tspan x="950" dy="40">بمشاركة المفتاح دون سر مشترك مسبق،</tspan>
  <tspan x="950" dy="40">والمفتاح الخاص لا يغادر الخادم،</tspan>
  <tspan x="950" dy="40">فلا يحصل المتنصت على المفتاح المشترك.</tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 Security: public-key cryptography</tspan>
  <tspan x="132" dy="40">lets the key be shared without a prior</tspan>
  <tspan x="132" dy="40">shared secret, and the private key</tspan>
  <tspan x="132" dy="40">never leaves the server, so the</tspan>
  <tspan x="132" dy="40">eavesdropper cannot get the shared key.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 السرعة: التشفير بالمفتاح العام بطيء</tspan>
  <tspan x="950" dy="40">ويحتاج إلى حسابات كثيرة،</tspan>
  <tspan x="950" dy="40">أما التشفير المتماثل فسريع ومناسب</tspan>
  <tspan x="950" dy="40">للكميات الكبيرة من البيانات.</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 Speed: public-key cryptography</tspan>
  <tspan x="132" dy="40">is slow and needs heavy calculation,</tspan>
  <tspan x="132" dy="40">while common-key cryptography is fast</tspan>
  <tspan x="132" dy="40">and suits large amounts of data.</tspan>
</text>
</svg>
