<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">سؤال الدرجات الست</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">THE 6-MARK QUESTION</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشرح لماذا يستخدم <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> التشفير بالمفتاح</tspan>
  <tspan x="935" dy="40">العام لمشاركة المفتاح، لكنه يستخدم التشفير</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">المتماثل</tspan> لتبادل البيانات. [6 درجات]</tspan>
  <tspan x="935" dy="40">استعن بـ: الأمان والسرعة.</tspan>
</text>

<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain why <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> uses public-key</tspan>
  <tspan x="140" dy="40">cryptography to share the key but</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">common-key</tspan> cryptography to exchange</tspan>
  <tspan x="140" dy="40">the data. [6]</tspan>
  <tspan x="140" dy="40">Refer to: security and speed.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الإجابة الكاملة ثلاث نقاط، لكل نقطة درجتان:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الأمان،</tspan> ثم <tspan fill="#c96a1b">السرعة،</tspan> ثم <tspan font-weight="bold" fill="#2e7d32">الربط.</tspan></tspan>
</text>

<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The full answer has three points,</tspan>
  <tspan x="120" dy="40">two marks each: <tspan font-weight="bold" fill="#17457f">security,</tspan> then <tspan fill="#c96a1b">speed,</tspan></tspan>
  <tspan x="120" dy="40">then the <tspan font-weight="bold" fill="#2e7d32">link.</tspan></tspan>
</text>

<text x="845" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الأمان</text>
<text x="750" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Security</text>
<text x="627" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">السرعة</text>
<text x="537" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Speed</text>
<text x="391" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الربط</text>
<text x="329" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Link</text>
</svg>
