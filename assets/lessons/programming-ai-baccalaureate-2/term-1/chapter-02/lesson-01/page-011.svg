<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">التشفير بالمفتاح العام Public-key (Asymmetric):</tspan>
  <tspan x="950" dy="40">يستخدم زوجًا من المفاتيح المرتبطة رياضيًا:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">مفتاحًا عامًا</tspan> يُنشر للجميع، <tspan font-weight="bold" fill="#17457f">ومفتاحًا خاصًا</tspan></tspan>
  <tspan x="950" dy="40">لا يغادر صاحبه أبدًا.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Public-key (asymmetric) cryptography: it</tspan>
  <tspan x="120" dy="40">uses a pair of mathematically linked keys:</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">public key</tspan> shared with everyone, and a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">private key</tspan> that never leaves its owner.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ما يُشفَّر <tspan font-weight="bold" fill="#17457f">بالمفتاح العام</tspan></tspan>
  <tspan x="950" dy="40">لا يفكه إلا <tspan font-weight="bold" fill="#17457f">المفتاح الخاص</tspan> المقابل له.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">What is encrypted with the <tspan font-weight="bold" fill="#17457f">public key</tspan></tspan>
  <tspan x="120" dy="40">can only be decrypted by</tspan>
  <tspan x="120" dy="40">its matching <tspan font-weight="bold" fill="#17457f">private key</tspan>.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#2e7d32">ميزته:</tspan> لا يحتاج إلى سر مشترك مسبقًا.</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">وعيبه:</tspan> أبطأ بكثير من التشفير المتماثل.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#2e7d32">Its strength:</tspan> it needs no shared secret</tspan>
  <tspan x="120" dy="40">in advance. <tspan font-weight="bold" fill="#17457f">Its drawback:</tspan> it is much</tspan>
  <tspan x="120" dy="40">slower than common-key cryptography.</tspan>
</text>

<text x="785" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="785" dy="0"><tspan font-weight="bold" fill="#17457f">المفتاح العام:</tspan> يُنشر للجميع</tspan>
</text>
<text x="500" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="500" dy="0"><tspan font-weight="bold" fill="#17457f">Public key:</tspan></tspan>
  <tspan x="500" dy="40">shared with everyone</tspan>
</text>
<text x="470" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="470" dy="0"><tspan font-weight="bold" fill="#17457f">المفتاح الخاص:</tspan> لا يغادر صاحبه</tspan>
</text>
<text x="140" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Private key:</tspan></tspan>
  <tspan x="140" dy="40">never leaves its owner</tspan>
</text>
</svg>
