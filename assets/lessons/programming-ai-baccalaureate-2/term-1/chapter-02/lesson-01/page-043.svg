<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 الربط: يُستخدم كلٌّ في موضع قوته؛</tspan>
  <tspan x="950" dy="40">العام مرة واحدة لمشاركة المفتاح،</tspan>
  <tspan x="950" dy="40">والمتماثل لبقية الاتصال،</tspan>
  <tspan x="950" dy="40">فيتحقق الأمان والسرعة معًا.</tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 The link: each is used where</tspan>
  <tspan x="132" dy="40">it is strongest; public-key once to</tspan>
  <tspan x="132" dy="40">share the key, and common-key for the</tspan>
  <tspan x="132" dy="40">rest of the connection, so security</tspan>
  <tspan x="132" dy="40">and speed are achieved together.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الربط</tspan> هو الذي يأخذ الدرجة الأخيرة؛</tspan>
  <tspan x="935" dy="40">أغلب الطلاب يشرحون كل نوع وحده</tspan>
  <tspan x="935" dy="40">وينسون أن يقولوا <tspan font-weight="bold" fill="#17457f">لماذا نجمعهما.</tspan></tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The link</tspan> is what earns the last marks;</tspan>
  <tspan x="140" dy="40">most students explain each type alone</tspan>
  <tspan x="140" dy="40">and forget to say <tspan font-weight="bold" fill="#17457f">why we combine them.</tspan></tspan>
</text>
</svg>
