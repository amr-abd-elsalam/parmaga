<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">إنت مين يا موقع؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Who Are You, Website?</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الشهادة الرقمية</tspan> Digital certificate:</tspan>
  <tspan x="950" dy="40">وثيقة إلكترونية تربط <tspan font-weight="bold" fill="#17457f">اسم نطاق</tspan> بمفتاح عام،</tspan>
  <tspan x="950" dy="40">وتوقّعها جهة موثوقة.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Digital certificate:</tspan> an electronic</tspan>
  <tspan x="120" dy="40">document that links a <tspan font-weight="bold" fill="#17457f">domain name</tspan> to a</tspan>
  <tspan x="120" dy="40">public key, signed by a trusted authority.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">جهة إصدار الشهادات CA (Certificate Authority):</tspan>
  <tspan x="950" dy="40">جهة <tspan font-weight="bold" fill="#17457f">يثق بها المتصفح،</tspan> تتحقق من صاحب النطاق</tspan>
  <tspan x="950" dy="40">ثم توقّع شهادته.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Certificate authority (CA): an organization</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">the browser trusts;</tspan> it checks the domain</tspan>
  <tspan x="120" dy="40">owner and then signs their certificate.</tspan>
</text>

<!-- Illustration labels -->
<text x="395" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">جهة إصدار الشهادات</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Certificate authority</text>
<text x="712" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الشهادة: بطاقة هوية الموقع</text>
<text x="330" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Certificate: the site's ID card</text>
<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">اسم النطاق + المفتاح العام</text>
<text x="565" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Domain name + public key</text>
</svg>
