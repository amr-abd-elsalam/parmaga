  <circle cx="825" cy="792" r="3.5" fill="#dff1f7"/>
  <polygon points="880,682 864,702 902,684" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="862" y="628" width="96" height="56" rx="16" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="888" cy="656" r="6" fill="#c96a1b"/>
  <circle cx="910" cy="656" r="6" fill="#c96a1b"/>
  <circle cx="932" cy="656" r="6" fill="#c96a1b"/>
  <!-- middle step: phone with authenticator code -->
  <rect x="505" y="600" width="80" height="132" rx="14" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="513" y="612" width="64" height="102" rx="6" fill="#dff1f7"/>
  <circle cx="545" cy="634" r="10" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <rect x="519" y="656" width="10" height="18" rx="3" fill="#2f7fb5"/>
  <rect x="533" y="656" width="10" height="18" rx="3" fill="#2f7fb5"/>
  <rect x="547" y="656" width="10" height="18" rx="3" fill="#2f7fb5"/>
  <rect x="561" y="656" width="10" height="18" rx="3" fill="#2f7fb5"/>
  <rect x="519" y="688" width="52" height="8" rx="4" fill="#4fc3e8"/>
  <circle cx="545" cy="723" r="3.5" fill="#dff1f7"/>
  <!-- top step: security key with check badge -->
  <rect x="195" y="612" width="110" height="44" rx="12" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="305" y="622" width="34" height="24" rx="3" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="315" y="628" width="6" height="5" fill="#7f95ab"/>
  <rect x="326" y="628" width="6" height="5" fill="#7f95ab"/>
  <circle cx="213" cy="634" r="7" fill="#fffdf7" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="258" cy="634" r="11" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="300" cy="604" r="18" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M291 604 L297 610 L309 597" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- connectors: step to stronger step -->
  <path d="M784 730 Q 700 690 622 690" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="606,690 622,682 622,698" fill="#c0392b"/>
  <path d="M498 662 Q 440 634 374 634" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="358,634 374,626 374,642" fill="#c0392b"/>
  <!-- direction arrow: weaker to stronger -->
  <path d="M940 1030 L166 1030" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="150,1030 168,1020 168,1040" fill="#c0392b"/>
</g>

