<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">BEYOND THE BOOK</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">رمز الرسائل القصيرة SMS <tspan font-weight="bold" fill="#c0392b">عامل حيازة،</tspan></tspan>
  <tspan x="935" dy="40">لكنه من أضعف الخيارات؛ لذلك تصنّفه هيئة</tspan>
  <tspan x="935" dy="40">المعايير الأمريكية NIST <tspan font-weight="bold" fill="#17457f">«مقيّدًا»،</tspan> وتطبيقات</tspan>
  <tspan x="935" dy="40">المصادقة ومفاتيح الأمان <tspan font-weight="bold" fill="#2e7d32">أقوى منه.</tspan></tspan>
</text>

<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">An SMS code is a <tspan font-weight="bold" fill="#c0392b">possession factor,</tspan></tspan>
  <tspan x="140" dy="40">but one of the weakest options; so the</tspan>
  <tspan x="140" dy="40">US standards body NIST classifies it</tspan>
  <tspan x="140" dy="40">as <tspan font-weight="bold" fill="#17457f">"restricted,"</tspan> and authenticator</tspan>
  <tspan x="140" dy="40">apps and security keys are <tspan font-weight="bold" fill="#2e7d32">stronger.</tspan></tspan>
</text>

<text x="895" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">SMS: أضعف</text>

<text x="720" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">SMS: weaker</text>

<text x="635" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تطبيق مصادقة</text>

<text x="409" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Authenticator app</text>

<text x="385" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مفتاح أمان: <tspan font-weight="bold" fill="#2e7d32">أقوى</tspan></text>

<text x="155" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="155" dy="0">Security key:</tspan>
  <tspan x="155" dy="40"><tspan font-weight="bold" fill="#2e7d32">stronger</tspan></tspan>
</text>
</svg>
