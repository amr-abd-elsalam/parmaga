<!-- Illustration: three-step staircase of second factors -->
<g>
  <defs>
    <linearGradient id="ilStepO" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c48c"/>
      <stop offset="1" stop-color="#c96a1b"/>
    </linearGradient>
    <linearGradient id="ilStepB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc9f2"/>
      <stop offset="1" stop-color="#2f7fb5"/>
    </linearGradient>
    <linearGradient id="ilStepG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcbe"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>
  <!-- shadows -->
  <path d="M134 676 L404 676 L404 746 L684 746 L684 816 L972 816 L972 866 L134 866 Z" fill="#22303f" opacity=".18"/>
  <rect x="199" y="618" width="110" height="44" rx="12" fill="#22303f" opacity=".18"/>
  <circle cx="304" cy="610" r="18" fill="#22303f" opacity=".18"/>
  <rect x="509" y="606" width="80" height="132" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="796" y="690" width="66" height="118" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="866" y="634" width="96" height="56" rx="16" fill="#22303f" opacity=".18"/>
  <!-- top step (green, strongest) -->
  <polygon points="400,670 418,652 418,842 400,860" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="130,670 400,670 418,652 148,652" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="130" y="670" width="270" height="190" fill="url(#ilStepG)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- middle step (blue) -->
  <polygon points="680,740 698,722 698,842 680,860" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="400,740 680,740 698,722 418,722" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="400" y="740" width="280" height="120" fill="url(#ilStepB)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- lowest step (orange, weakest) -->
  <polygon points="950,810 968,792 968,842 950,860" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="680,810 950,810 968,792 698,792" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="680" y="810" width="270" height="50" fill="url(#ilStepO)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- strength bars on step fronts -->
  <rect x="785" y="840" width="14" height="12" rx="3" fill="#ffffff" opacity=".85"/>
  <rect x="807" y="830" width="14" height="22" rx="3" fill="#ffffff" opacity=".35"/>
  <rect x="829" y="820" width="14" height="32" rx="3" fill="#ffffff" opacity=".35"/>
  <rect x="510" y="804" width="14" height="12" rx="3" fill="#ffffff" opacity=".85"/>
  <rect x="532" y="794" width="14" height="22" rx="3" fill="#ffffff" opacity=".85"/>
  <rect x="554" y="784" width="14" height="32" rx="3" fill="#ffffff" opacity=".35"/>
  <rect x="235" y="769" width="14" height="12" rx="3" fill="#ffffff" opacity=".85"/>
  <rect x="257" y="759" width="14" height="22" rx="3" fill="#ffffff" opacity=".85"/>
  <rect x="279" y="749" width="14" height="32" rx="3" fill="#ffffff" opacity=".85"/>
  <!-- lowest step: phone with message bubble -->
  <rect x="792" y="684" width="66" height="118" rx="12" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="799" y="696" width="52" height="86" rx="5" fill="#dff1f7"/>
  <rect x="806" y="708" width="38" height="8" rx="4" fill="#f0c48c"/>
