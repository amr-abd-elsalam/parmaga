<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Illustration: open postcard vs sealed envelope -->
<g>
  <defs>
    <linearGradient id="ilRisk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6d8"/>
      <stop offset="1" stop-color="#fdf1e2"/>
    </linearGradient>
    <linearGradient id="ilSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fb"/>
      <stop offset="1" stop-color="#dff1f7"/>
    </linearGradient>
    <linearGradient id="ilFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc9f2"/>
      <stop offset="1" stop-color="#2f7fb5"/>
    </linearGradient>
  </defs>

  <!-- Shadows -->
  <rect x="579" y="712" width="380" height="256" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="129" y="712" width="380" height="256" rx="24" fill="#22303f" opacity=".18"/>

  <!-- Panels -->
  <rect x="575" y="706" width="380" height="256" rx="24" fill="url(#ilRisk)" stroke="#f0c48c" stroke-width="2"/>
  <rect x="125" y="706" width="380" height="256" rx="24" fill="url(#ilSafe)" stroke="#9db9d6" stroke-width="2"/>

  <!-- Right: watching eye -->
  <path d="M735 728 L730 718 M765 721 L765 710 M795 728 L800 718" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M705 752 Q765 710 825 752 Q765 794 705 752 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="765" cy="752" r="17" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="765" cy="752" r="8" fill="#22303f"/>
  <circle cx="771" cy="746" r="3.5" fill="#ffffff"/>
  <path d="M745 784 L732 802 M765 788 L765 806 M785 784 L798 802" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>

  <!-- Right: warning mark -->
  <polygon points="925,724 945,758 905,758" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="922.5" y="735" width="5" height="13" rx="2.5" fill="#22303f"/>
  <circle cx="925" cy="752" r="2.5" fill="#22303f"/>

  <!-- Right: open postcard -->
  <rect x="620" y="814" width="290" height="126" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M770 828 L770 926" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M636 846 q7 -6 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M636 870 q7 -6 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M636 894 q7 -6 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M636 918 q7 -6 14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="830" cy="850" r="14" fill="none" stroke="#7f95ab" stroke-width="2.5" opacity=".6"/>
  <rect x="852" y="826" width="38" height="44" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="859" y="833" width="24" height="30" rx="2" fill="#f0c48c"/>
  <circle cx="876" cy="842" r="5" fill="#ffd24a"/>
  <polygon points="861,861 869,850 875,856 879,852 883,861" fill="#2e7d32"/>
  <path d="M786 890 L896 890 M786 912 L896 912" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Arrow from postcard to envelope -->
  <path d="M604 872 Q542 848 484 872" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="471,877 487,879 481,865" fill="#c0392b"/>

  <!-- Left: blocked eye -->
  <path d="M285 728 L280 718 M315 721 L315 710 M345 728 L350 718" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M255 752 Q315 710 375 752 Q315 794 255 752 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="315" cy="752" r="17" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="315" cy="752" r="8" fill="#22303f"/>
  <circle cx="321" cy="746" r="3.5" fill="#ffffff"/>
  <polygon points="265,712 371,786 365,794 259,720" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left: safety marks -->
  <path d="M165 760 L168 767 L175 770 L168 773 L165 780 L162 773 L155 770 L162 767 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M205 733 L207 738 L212 740 L207 742 L205 747 L203 742 L198 740 L203 738 Z" fill="#ffd24a"/>
  <circle cx="475" cy="742" r="16" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M467 742 L473 748 L483 736" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left: sealed envelope -->
  <rect x="170" y="814" width="290" height="126" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M176 814 L315 884 L454 814 Z" fill="url(#ilFlap)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M305 838 L305 830 A10 10 0 0 1 325 830 L325 838" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="301" y="838" width="28" height="22" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="315" cy="847" r="3" fill="#22303f"/>
  <rect x="313.5" y="848" width="3" height="7" rx="1.5" fill="#22303f"/>
  <polygon points="306,902 298,924 309,918 314,905" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="324,902 332,924 321,918 316,905" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="315" cy="884" r="22" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="315" cy="884" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="410" y="884" width="34" height="36" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="416" y="890" width="22" height="24" rx="2" fill="#f0c48c"/>
  <circle cx="400" cy="902" r="13" fill="none" stroke="#7f95ab" stroke-width="2.5" opacity=".6"/>

  <!-- Connectors from labels to elements -->
  <path d="M760 986 L760 966" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="760,952 751,966 769,966" fill="#c0392b"/>
  <path d="M375 986 L375 966" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="375,952 366,966 384,966" fill="#c0392b"/>

  <!-- Closing trail dots -->
  <circle cx="128" cy="1180" r="4" fill="#a9dcbe" opacity=".35"/>
  <circle cx="142" cy="1180" r="4" fill="#a9dcbe" opacity=".6"/>
  <circle cx="156" cy="1180" r="4" fill="#a9dcbe" opacity=".85"/>
  <circle cx="924" cy="1180" r="4" fill="#f0c48c" opacity=".85"/>
  <circle cx="938" cy="1180" r="4" fill="#f0c48c" opacity=".6"/>
  <circle cx="952" cy="1180" r="4" fill="#f0c48c" opacity=".35"/>
</g>

<!-- Icon: network nodes beside Protocol -->
<g transform="translate(872 222)">
  <path d="M28 8 L8 42 M28 8 L48 42 M8 42 L48 42" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="8" r="7" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="8" cy="42" r="7" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="48" cy="42" r="7" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: warning beside HTTP -->
<g transform="translate(848 451)">
  <polygon points="32,4 62,58 2,58" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="29" y="20" width="6" height="22" rx="3" fill="#22303f"/>
  <circle cx="32" cy="50" r="3.5" fill="#22303f"/>
</g>

<!-- Icon: shield beside HTTPS -->
<g transform="translate(852 622)">
  <path d="M28 3 L50 11 L50 28 C50 41 40 50 28 54 C16 50 6 41 6 28 L6 11 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Bottom icon row: lock, key, sealed envelope -->
<g>
  <g>
    <circle cx="440" cy="1228" r="28" fill="#dff1f7"/>
    <path d="M430 1224 L430 1216 A10 10 0 0 1 450 1216 L450 1224" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="426" y="1224" width="28" height="20" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="440" cy="1232" r="3" fill="#ffffff"/>
    <rect x="438.5" y="1233" width="3" height="6" rx="1.5" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="540" cy="1228" r="28" fill="#dff1f7"/>
    <circle cx="528" cy="1228" r="9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="528" cy="1228" r="3" fill="#ffffff"/>
    <path d="M537 1228 L556 1228 M550 1228 L550 1235 M555 1228 L555 1233" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="640" cy="1228" r="28" fill="#dff1f7"/>
    <rect x="622" y="1216" width="36" height="25" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <polyline points="622,1216 640,1230 658,1216" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="640" cy="1230" r="5" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  </g>
</g>

<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البروتوكول Protocol:</tspan> مجموعة قواعد متفق عليها</tspan>
  <tspan x="950" dy="40">تحدد طريقة تواصل جهازين.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Protocol:</tspan> a set of agreed rules that</tspan>
  <tspan x="120" dy="40">defines how two devices communicate.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">&#x200F;HTTP:</tspan> بروتوكول نقل صفحات الويب، وبياناته</tspan>
  <tspan x="950" dy="40">تنتقل <tspan font-weight="bold" fill="#17457f">دون تشفير.</tspan></tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTP:</tspan> the protocol that carries</tspan>
  <tspan x="120" dy="40">web pages; its data travels</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">without encryption.</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">&#x200F;HTTPS:</tspan> هو HTTP منقولًا عبر اتصال TLS <tspan font-weight="bold" fill="#2e7d32">مؤمَّن.</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTPS:</tspan> HTTP carried over</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#2e7d32">secured</tspan> TLS connection.</tspan>
</text>

<!-- Illustration labels -->
<text x="900" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="900" dy="0">&#x200F;HTTP: كارت بوستال</tspan>
  <tspan x="900" dy="40">مكشوف</tspan>
</text>
<text x="620" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="620" dy="0">HTTP: an open</tspan>
  <tspan x="620" dy="40">postcard</tspan>
</text>
<text x="460" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="460" dy="0">&#x200F;HTTPS: ظرف</tspan>
  <tspan x="460" dy="40">مقفول ومختوم</tspan>
</text>
<text x="170" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="170" dy="0">HTTPS: a sealed,</tspan>
  <tspan x="170" dy="40">stamped envelope</tspan>
</text>
</svg>
