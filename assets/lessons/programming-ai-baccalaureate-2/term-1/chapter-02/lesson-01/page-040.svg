<!-- Card 1 text: TRAP 3 -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">الفخ 3</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRAP 3</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«التوقيع الرقمي يحسّن سرعة الاتصال» ← خطأ؛</tspan>
  <tspan x="935" dy="40">فالتوقيع <tspan font-weight="bold" fill="#17457f">للسلامة والهوية</tspan> لا للسرعة.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"A digital signature improves</tspan>
  <tspan x="140" dy="40">communication speed" → false; the</tspan>
  <tspan x="140" dy="40">signature is for <tspan font-weight="bold" fill="#17457f">integrity</tspan> and</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">identity,</tspan> not speed.</tspan>
</text>

<!-- Card 2 text: TRAP 4 -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">الفخ 4</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRAP 4</tspan>
</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«القفل يعني أن الموقع أمين» ← خطأ؛</tspan>
  <tspan x="935" dy="40">فالقفل يعني أن الاتصال <tspan font-weight="bold" fill="#17457f">مشفر</tspan></tspan>
  <tspan x="935" dy="40">وأن الشهادة <tspan font-weight="bold" fill="#17457f">مطابقة للاسم</tspan> فقط.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"The padlock means the site is</tspan>
  <tspan x="140" dy="40">honest" → false; it only means the</tspan>
  <tspan x="140" dy="40">connection is <tspan font-weight="bold" fill="#17457f">encrypted</tspan> and the</tspan>
  <tspan x="140" dy="40">certificate <tspan font-weight="bold" fill="#17457f">matches the name.</tspan></tspan>
</text>

<!-- Card 3 text: Exam tip -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">نصيحة الامتحان:</tspan> في أي سؤال</tspan>
  <tspan x="935" dy="40">«طابِق التهديد بالتقنية»، اسأل نفسك:</tspan>
  <tspan x="935" dy="40">أي سؤال من <tspan font-weight="bold" fill="#17457f">الأسئلة الأربعة؟</tspan></tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Exam tip:</tspan> in any "match the threat to</tspan>
  <tspan x="140" dy="40">the technology" question, ask yourself:</tspan>
  <tspan x="140" dy="40">which of the <tspan font-weight="bold" fill="#17457f">four questions</tspan> is it?</tspan>
</text>
</svg>
