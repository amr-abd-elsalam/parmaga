<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التشفير المتماثل</tspan> Common-key (Symmetric):</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">المفتاح نفسه</tspan> يشفّر ويفك التشفير،</tspan>
  <tspan x="950" dy="40">فلا بد أن يكون عند الطرفين.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Common-key (symmetric)</tspan> cryptography:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">the same key</tspan> encrypts and decrypts, so</tspan>
  <tspan x="120" dy="40">both sides must have it.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ميزته: <tspan font-weight="bold" fill="#2e7d32">سريع جدًا</tspan> مع البيانات الكثيرة.</tspan>
  <tspan x="950" dy="40">ومشكلته: كيف يصل المفتاح إلى الطرف الآخر</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بأمان</tspan> أول مرة؟</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Its strength: <tspan font-weight="bold" fill="#2e7d32">very fast</tspan> with large</tspan>
  <tspan x="120" dy="40">amounts of data.</tspan>
  <tspan x="120" dy="40">Its problem: how does the key reach the</tspan>
  <tspan x="120" dy="40">other side <tspan font-weight="bold" fill="#17457f">safely</tspan> the first time?</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">زي مفتاح الشقة: نفس المفتاح يقفل ويفتح.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Like a flat key: the same key locks</tspan>
  <tspan x="140" dy="40">and unlocks.</tspan>
</text>

<text x="619" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="619" dy="0">نفس المفتاح</tspan>
</text>
<text x="470" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="470" dy="0">Same key</tspan>
</text>
<text x="790" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="790" dy="0">يقفل</tspan>
</text>
<text x="720" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="720" dy="0">Locks</tspan>
</text>
<text x="348" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="348" dy="0">يفتح</tspan>
</text>
<text x="265" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="265" dy="0">Unlocks</tspan>
</text>
</svg>
