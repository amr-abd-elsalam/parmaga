<!-- Texts in Layout order -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">العام يوصّل المفتاح…</tspan>
  <tspan x="935" dy="40">والمتماثل يشيل البيانات.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Public-key delivers the key…</tspan>
  <tspan x="140" dy="40">common-key carries the data.</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك 3</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT 3</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو استخدم HTTPS <tspan font-weight="bold" fill="#17457f">الشاحنة المصفحة</tspan></tspan>
  <tspan x="935" dy="40">لكل البيانات، ماذا سيحدث لسرعة</tspan>
  <tspan x="935" dy="40">تحميل صفحة فيها فيديو؟</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If HTTPS used the <tspan font-weight="bold" fill="#17457f">armored truck</tspan></tspan>
  <tspan x="140" dy="40">for all the data, what would happen</tspan>
  <tspan x="140" dy="40">to the loading speed of a page</tspan>
  <tspan x="140" dy="40">with a video?</tspan>
</text>

<text x="800" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="800" dy="0">سريع</tspan>
</text>
<text x="734" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="734" dy="0">Fast</tspan>
</text>
<text x="350" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="350" dy="0">بطيء</tspan>
</text>
<text x="280" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="280" dy="0">Slow</tspan>
</text>
</svg>
