<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="128" width="870" height="328" rx="16" fill="#22303f" opacity=".12"/>
<rect x="99" y="540" width="890" height="600" rx="12" fill="#22303f" opacity=".12"/>

<!-- Main idea card -->
<rect x="105" y="122" width="870" height="328" rx="16" fill="#fdf6d8" stroke="#e0c46a" stroke-width="2"/>
<rect x="961" y="138" width="6" height="296" rx="3" fill="#e0a55e"/>
<rect x="117" y="284" width="832" height="162" rx="10" fill="#eaf2fb"/>
<rect x="121" y="296" width="6" height="138" rx="3" fill="#2f7fb5"/>

<!-- Table fills -->
<rect x="95" y="534" width="890" height="600" rx="12" fill="#fffdf7"/>
<path d="M107 534 H505 V1134 H107 Q95 1134 95 1122 V546 Q95 534 107 534 Z" fill="#eaf2fb"/>

<!-- Table separators -->
<line x1="505" y1="534" x2="505" y2="1134" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="594" x2="985" y2="594" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="694" x2="985" y2="694" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="794" x2="985" y2="794" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="854" x2="985" y2="854" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="954" x2="985" y2="954" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="1014" x2="985" y2="1014" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="1074" x2="985" y2="1074" stroke="#c0392b" stroke-width="1.4"/>
<rect x="95" y="534" width="890" height="600" rx="12" fill="none" stroke="#c0392b" stroke-width="2"/>

<!-- Icon: light bulb (card top-left) -->
<g transform="translate(127 132)">
  <line x1="6" y1="22" x2="1" y2="22" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="22" x2="55" y2="22" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="7" x2="8" y2="3" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="7" x2="48" y2="3" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="22" r="15" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M23 25 Q28 18 33 25" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="21" y="36" width="14" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="21" y1="42" x2="35" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: open book (header line) -->
<g transform="translate(483 472)">
  <path d="M24 10 Q14 4 3 8 V40 Q14 36 24 42 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 10 Q34 4 45 8 V40 Q34 36 24 42 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="9" y1="18" x2="19" y2="19" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="26" x2="19" y2="27" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="19" x2="39" y2="18" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="27" x2="39" y2="26" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Card text: Arabic -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">حقيقة أساسية:</tspan> يعتمد أمان الاتصال والخدمات</tspan>
  <tspan x="935" dy="40">عبر الإنترنت على الجمع بين <tspan font-weight="bold" fill="#17457f">التشفير</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">والمصادقة،</tspan> وليس على تقنية واحدة.</tspan>
</text>

<!-- Card text: English -->
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Key Fact:</tspan> Secure online communication</tspan>
  <tspan x="140" dy="40">and services depend on combining</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">cryptography</tspan> and <tspan font-weight="bold" fill="#17457f">authentication</tspan> —</tspan>
  <tspan x="140" dy="40">not on any single technology.</tspan>
</text>

<!-- Section header -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المفاهيم الأساسية</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Key Concepts</text>

<!-- Row 1 -->
<text x="960" y="574" direction="ltr" unicode-bidi="plaintext" text-anchor="end" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">HTTPS</text>
<text x="120" y="574" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">HTTPS</text>

<!-- Row 2 -->
<text x="960" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">التشفير بالمفتاح المشترك</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">common-key</tspan>
  <tspan x="120" dy="40">cryptography</tspan>
</text>

<!-- Row 3 -->
<text x="960" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">التشفير بالمفتاح العام</text>
<text x="120" y="734" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">public-key</tspan>
  <tspan x="120" dy="40">cryptography</tspan>
</text>

<!-- Row 4 -->
<text x="960" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مصافحة TLS</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">TLS handshake</text>

<!-- Row 5 -->
<text x="960" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">المصادقة متعددة العوامل</text>
<text x="120" y="894" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">multi-factor</tspan>
  <tspan x="120" dy="40">authentication</tspan>
</text>

<!-- Row 6 -->
<text x="960" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">التوقيع الرقمي</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">digital signature</text>

<!-- Row 7 -->
<text x="960" y="1054" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الشهادة الرقمية</text>
<text x="120" y="1054" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">digital certificate</text>

<!-- Row 8 -->
<text x="960" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">عدم التنصل</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">non-repudiation</text>
</svg>
