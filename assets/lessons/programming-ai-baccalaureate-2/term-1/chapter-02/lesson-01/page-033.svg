<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">كلمة المرور لمرة واحدة</tspan> OTP: رمز مؤقت</tspan>
  <tspan x="950" dy="40">يصلح مرة واحدة، ويثبت أنك تملك الجهاز؛</tspan>
  <tspan x="950" dy="40">لذلك هو <tspan font-weight="bold" fill="#17457f">عامل حيازة.</tspan></tspan>
</text>

<text x="120"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">One-time password</tspan> (OTP): a temporary code</tspan>
  <tspan x="120" dy="40">that works only once and proves you own</tspan>
  <tspan x="120" dy="40">the device; so it is a <tspan font-weight="bold" fill="#17457f">possession factor.</tspan></tspan>
</text>

<text x="950"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأمان ثلاثي النطاقات &#x200E;3-D Secure:</tspan> <tspan font-weight="bold" fill="#17457f">طبقة تحقق</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">إضافية</tspan> عند الدفع بالبطاقة عبر الإنترنت،</tspan>
  <tspan x="950" dy="40">يطلب فيها البنك رمزًا أو تأكيدًا منك.</tspan>
</text>

<text x="120"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">3-D Secure:</tspan> an <tspan font-weight="bold" fill="#17457f">extra check</tspan> when paying</tspan>
  <tspan x="120" dy="40">by card online, where the bank asks you</tspan>
  <tspan x="120" dy="40">for a code or a confirmation.</tspan>
</text>

<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">رمز لمرة واحدة</text>
<text x="752" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">One-time code</text>
<text x="350" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">يحترق بعد الاستخدام</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Burns after use</text>
</svg>
