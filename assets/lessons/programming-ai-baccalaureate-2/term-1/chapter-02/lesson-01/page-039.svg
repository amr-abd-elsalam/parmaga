<!-- Page titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">ركن الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Exam Corner</text>

<!-- Section header -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخاخ تتكرر</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Common Traps</text>

<!-- Card 1 texts -->
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الفخ 1</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">TRAP 1</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;«HTTPS يشفّر كل البيانات بالمفتاح العام»</tspan>
  <tspan x="935" dy="40">← <tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> لأنه بطيء،</tspan>
  <tspan x="935" dy="40">والبيانات تُشفَّر <tspan font-weight="bold" fill="#17457f">بالتشفير المتماثل.</tspan></tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"HTTPS encrypts all data with</tspan>
  <tspan x="140" dy="40">public-key cryptography" → <tspan font-weight="bold" fill="#c0392b">false;</tspan></tspan>
  <tspan x="140" dy="40">it is slow, and the data is encrypted</tspan>
  <tspan x="140" dy="40">with <tspan font-weight="bold" fill="#17457f">common-key cryptography.</tspan></tspan>
</text>

<!-- Card 2 texts -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الفخ 2</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">TRAP 2</text>
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«كلمة مرور + سؤال سري = مصادقة</tspan>
  <tspan x="935" dy="40">متعددة العوامل» ← <tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> لأن الاثنين <tspan font-weight="bold" fill="#17457f">معرفة.</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Password + secret question =</tspan>
