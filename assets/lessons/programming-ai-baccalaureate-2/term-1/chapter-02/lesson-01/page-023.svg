<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">سلسلة الثقة</tspan> Chain of trust: الشهادة موقّعة</tspan>
  <tspan x="950" dy="40">من جهة، وهذه الجهة موقّعة من جهة أعلى،</tspan>
  <tspan x="950" dy="40">حتى نصل إلى <tspan font-weight="bold" fill="#17457f">جهة جذرية</tspan> مخزنة مسبقًا</tspan>
  <tspan x="950" dy="40">في المتصفح أو نظام التشغيل.</tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Chain of trust</tspan>: the certificate is signed</tspan>
  <tspan x="120" dy="40">by an authority, which is signed by</tspan>
  <tspan x="120" dy="40">a higher authority, up to a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">root authority</tspan> already stored in the</tspan>
  <tspan x="120" dy="40">browser or the operating system.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">القفل</tspan> في شريط العنوان يعني أن الاتصال <tspan font-weight="bold" fill="#17457f">مشفر،</tspan></tspan>
  <tspan x="950" dy="40">وأن الشهادة <tspan font-weight="bold" fill="#2e7d32">صالحة</tspan> لاسم الموقع.</tspan>
</text>

<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#17457f">padlock</tspan> in the address bar means</tspan>
  <tspan x="120" dy="40">the connection is <tspan font-weight="bold" fill="#17457f">encrypted</tspan> and the</tspan>
  <tspan x="120" dy="40">certificate is <tspan font-weight="bold" fill="#2e7d32">valid</tspan> for the site's name.</tspan>
</text>

<text x="950" y="1234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">شهادة الموقع</text>
<text x="120" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Site certificate</text>
<text x="950" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">جهة وسيطة</text>
<text x="120" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Intermediate authority</text>
<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الجهة الجذرية</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Root authority</text>
</svg>
