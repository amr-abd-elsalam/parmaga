<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">لعبة «فئة ولا خطوة؟»:</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">أ</tspan> × (معرفة + معرفة)،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">ب</tspan> × (معرفة + معرفة)،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">جـ</tspan> ○ (معرفة + حيازة)،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">د</tspan> ○ (سمات حيوية + حيازة)،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">هـ</tspan> × (سمات حيوية + سمات حيوية).</tspan>
</text>

<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">"Category or Step?" game:</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">a</tspan> × (knowledge + knowledge),</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">b</tspan> × (knowledge + knowledge),</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">c</tspan> ○ (knowledge + possession),</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">d</tspan> ○ (biometric + possession),</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">e</tspan> × (biometric + biometric).</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جرّب 5:</tspan> قد تتصل منى <tspan font-weight="bold" fill="#c0392b">بموقع مزيف</tspan></tspan>
  <tspan x="950" dy="40">اتصالًا مشفرًا تمامًا، فتعطي بياناتها</tspan>
  <tspan x="950" dy="40">للمحتال نفسه؛ <tspan font-weight="bold" fill="#17457f">التشفير وحده لا يكفي.</tspan></tspan>
</text>

<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Try It 5:</tspan> Mona could connect to a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">fake site</tspan> over a fully encrypted</tspan>
  <tspan x="120" dy="40">connection and give her details to</tspan>
  <tspan x="120" dy="40">the scammer himself;</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">encryption alone is not enough.</tspan></tspan>
</text>
</svg>
