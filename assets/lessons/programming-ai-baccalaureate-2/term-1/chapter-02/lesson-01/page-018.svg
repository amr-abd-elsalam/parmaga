<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">BEYOND THE BOOK</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">هذه فكرة <tspan font-weight="bold" fill="#c0392b">اتفاق المفاتيح</tspan> Diffie-Hellman.</tspan>
  <tspan x="935" dy="40">والإصدار <tspan font-weight="bold" fill="#17457f">TLS 1.3</tspan> ألغى طريقة إرسال</tspan>
  <tspan x="935" dy="40">المفتاح داخل صندوق، ويستخدم</tspan>
  <tspan x="935" dy="40">هذه الطريقة في كل اتصال.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">This is the idea of Diffie-Hellman</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">key agreement</tspan>. <tspan font-weight="bold" fill="#17457f">TLS 1.3</tspan> removed the</tspan>
  <tspan x="140" dy="40">key-in-a-box method and uses this</tspan>
  <tspan x="140" dy="40">method in every connection.</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ولأن <tspan font-weight="bold" fill="#17457f">مفاتيح الجلسة</tspan> تُحسب من جديد في كل</tspan>
  <tspan x="935" dy="40">اتصال ثم تُهمل، فإن سرقة مفتاح الخادم</tspan>
  <tspan x="935" dy="40">لاحقًا <tspan font-weight="bold" fill="#2e7d32">لا تكشف</tspan> الاتصالات القديمة.</tspan>
  <tspan x="935" dy="40">وهذا اسمه <tspan font-weight="bold" fill="#c0392b">السرية الأمامية</tspan> Forward Secrecy.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Because <tspan font-weight="bold" fill="#17457f">session keys</tspan> are calculated</tspan>
  <tspan x="140" dy="40">fresh for each connection and then</tspan>
  <tspan x="140" dy="40">discarded, stealing the server's key</tspan>
  <tspan x="140" dy="40">later <tspan font-weight="bold" fill="#2e7d32">does not expose</tspan> old connections.</tspan>
  <tspan x="140" dy="40">This is called <tspan font-weight="bold" fill="#c0392b">Forward Secrecy</tspan>.</tspan>
</text>
</svg>
