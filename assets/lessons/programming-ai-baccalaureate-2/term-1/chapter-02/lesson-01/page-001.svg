</text>
<text x="935" y="965" direction="ltr" unicode-bidi="plaintext" text-anchor="end" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffd24a">Lesson 2-1</text>
<text x="935" y="1008" direction="ltr" unicode-bidi="plaintext" text-anchor="end" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="34" font-weight="normal" fill="#ffffff">
