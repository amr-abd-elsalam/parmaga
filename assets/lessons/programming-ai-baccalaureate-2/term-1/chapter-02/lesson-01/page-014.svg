<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">كيف يتفق غريبان على سر؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">How Do Two Strangers Agree on a Secret?</text>

<!-- Paragraph 1 Arabic -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مصافحة</tspan> TLS (TLS handshake): الخطوات الأولى</tspan>
  <tspan x="950" dy="40">قبل إرسال أي بيانات؛ يقدّم فيها الخادم</tspan>
  <tspan x="950" dy="40">شهادته، ويتحقق المتصفح منها، ويتفق الطرفان</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">مفاتيح الجلسة</tspan>.</tspan>
</text>

<!-- Paragraph 1 English -->
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">TLS handshake:</tspan> the first steps before any</tspan>
  <tspan x="120" dy="40">data is sent; the server presents its</tspan>
  <tspan x="120" dy="40">certificate, the browser checks it, and</tspan>
  <tspan x="120" dy="40">both sides agree on <tspan font-weight="bold" fill="#17457f">session keys</tspan>.</tspan>
</text>

<!-- Paragraph 2 Arabic -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مفتاح الجلسة</tspan> Session key: مفتاح متماثل <tspan font-weight="bold" fill="#17457f">مؤقت</tspan></tspan>
  <tspan x="950" dy="40">يُنشأ لاتصال واحد، ثم يُهمَل بعد انتهائه.</tspan>
</text>

<!-- Paragraph 2 English -->
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Session key:</tspan> a <tspan font-weight="bold" fill="#17457f">temporary</tspan> common key</tspan>
  <tspan x="120" dy="40">created for one connection and discarded</tspan>
  <tspan x="120" dy="40">when it ends.</tspan>
</text>

<!-- Illustration labels -->
<text x="940" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مصافحة</text>
<text x="790" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Handshake</text>
<text x="760" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مفتاح الجلسة: صالح لاتصال واحد</text>
<text x="310" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Session key: valid for one connection</text>
</svg>
