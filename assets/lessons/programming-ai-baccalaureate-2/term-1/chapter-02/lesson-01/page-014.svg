<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="36" patternUnits="userSpaceOnUse">
    <line x1="0" y1="35.5" x2="1080" y2="35.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="236" width="870" height="116" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="488" width="870" height="152" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="776" width="870" height="116" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="1100" width="870" height="152" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info cards (English twins) -->
<rect x="105" y="230" width="870" height="116" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="246" width="6" height="84" rx="3" fill="#2f7fb5"/>
<rect x="105" y="482" width="870" height="152" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="498" width="6" height="120" rx="3" fill="#2f7fb5"/>
<rect x="105" y="770" width="870" height="116" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="786" width="6" height="84" rx="3" fill="#2f7fb5"/>
<rect x="105" y="1094" width="870" height="152" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="1110" width="6" height="120" rx="3" fill="#2f7fb5"/>

<!-- Icon: lock (step 1) -->
<g transform="translate(118 418)">
  <path d="M12 20 V14 A10 10 0 0 1 32 14 V20" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="6" y="20" width="32" height="22" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="22" cy="29" r="3.5" fill="#22303f"/>
  <rect x="20.5" y="30" width="3" height="7" rx="1.5" fill="#22303f"/>
</g>

<!-- Icon: shield with check (step 2) -->
<g transform="translate(118 694)">
  <path d="M22 2 L40 9 V22 C40 33 32 40 22 43 C12 40 4 33 4 22 V9 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13 22 L20 29 L32 15" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: key (step 3) -->
<g transform="translate(118 1028)">
  <circle cx="13" cy="22" r="10" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="13" cy="22" r="3.5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M23 22 H42 M35 22 V30 M41 22 V28" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Top pair -->
<text x="950" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">(2) مثلًا، عند شراء منتج عبر <tspan fill="#c96a1b">التسوق الإلكتروني،</tspan></tspan>
  <tspan x="950" dy="36">تُجمع هذه التقنيات وتُستخدم على النحو التالي:</tspan>
</text>
<text x="140" y="258" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0">(2) For example, when purchasing a product</tspan>
  <tspan x="140" dy="36">through <tspan fill="#c96a1b">online shopping,</tspan> these technologies</tspan>
  <tspan x="140" dy="36">are combined and used as follows.</tspan>
</text>

<!-- Step 1 -->
<text x="950" y="402" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">①</tspan> عندما تدخل إلى الموقع، يبدأ اتصال <tspan font-weight="bold" fill="#c0392b">HTTPS،</tspan> ويمنع</tspan>
  <tspan x="950" dy="36"><tspan font-weight="bold" fill="#c0392b">التشفير</tspan> أطرافًا ثالثة من قراءة محتوى الاتصال.</tspan>
</text>
<text x="140" y="510" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">①</tspan> When you access the site, <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan></tspan>
  <tspan x="140" dy="36">communication begins, and <tspan font-weight="bold" fill="#c0392b">encryption</tspan></tspan>
  <tspan x="140" dy="36">prevents communication content from being</tspan>
  <tspan x="140" dy="36">read by third parties.</tspan>
</text>

<!-- Step 2 -->
<text x="950" y="690" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">②</tspan> يفحص المتصفح <tspan font-weight="bold" fill="#c0392b">الشهادة الرقمية</tspan> للتأكد من أن</tspan>
  <tspan x="950" dy="36">الوجهة هي موقع التسوق الحقيقي.</tspan>
</text>
<text x="140" y="798" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">②</tspan> The browser checks the</tspan>
  <tspan x="140" dy="36"><tspan font-weight="bold" fill="#c0392b">digital certificate</tspan> to confirm that the</tspan>
  <tspan x="140" dy="36">destination is the genuine shopping site.</tspan>
</text>

<!-- Step 3 -->
<text x="950" y="942" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">③</tspan> عند تسجيل الدخول إلى الحساب، تمنع</tspan>
  <tspan x="950" dy="36"><tspan font-weight="bold" fill="#c0392b">المصادقة متعددة العوامل،</tspan> التي تجمع مثلًا بين</tspan>
  <tspan x="950" dy="36">كلمة المرور والمصادقة عبر الرسائل</tspan>
  <tspan x="950" dy="36">القصيرة <tspan font-weight="bold" fill="#c0392b">SMS،</tspan> تسجيل الدخول غير المصرح به.</tspan>
</text>
<text x="140" y="1122" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">③</tspan> For account login,</tspan>
  <tspan x="140" dy="36"><tspan font-weight="bold" fill="#c0392b">multi-factor authentication</tspan> combining a</tspan>
  <tspan x="140" dy="36">password and <tspan font-weight="bold" fill="#c0392b">SMS</tspan> authentication, etc.,</tspan>
  <tspan x="140" dy="36">prevents unauthorized logins.</tspan>
</text>
</svg>
