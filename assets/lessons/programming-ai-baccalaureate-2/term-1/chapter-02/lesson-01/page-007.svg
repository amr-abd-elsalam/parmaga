<!-- Paragraph 1: TLS -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بروتوكول</tspan> TLS (Transport Layer Security)&#x200E;:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بروتوكول أمان</tspan> يعمل تحت HTTP، ويوفر السرية</tspan>
  <tspan x="950" dy="40">والسلامة والتحقق من هوية الخادم.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">TLS</tspan> (Transport Layer Security): a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">security protocol</tspan> that works beneath HTTP</tspan>
  <tspan x="120" dy="40">and provides confidentiality, integrity,</tspan>
  <tspan x="120" dy="40">and verification of the server's identity.</tspan>
</text>

<!-- Paragraph 2: Confidentiality -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">السرية</tspan> Confidentiality: ألا يطّلع على</tspan>
  <tspan x="950" dy="40">البيانات إلا <tspan font-weight="bold" fill="#17457f">المصرح لهم.</tspan></tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Confidentiality:</tspan> only <tspan font-weight="bold" fill="#17457f">authorized</tspan> people</tspan>
  <tspan x="120" dy="40">can see the data.</tspan>
</text>

<!-- Paragraph 3: Integrity -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">السلامة</tspan> Integrity: أن تصل البيانات كما</tspan>
  <tspan x="950" dy="40">أُرسلت، وأن <tspan font-weight="bold" fill="#17457f">يُكتشف أي تعديل</tspan> عليها.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Integrity:</tspan> the data arrives as it was</tspan>
  <tspan x="120" dy="40">sent, and any change to it is <tspan font-weight="bold" fill="#17457f">detected.</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="935" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">السرية:</tspan> محدش يقرأ غيرنا</tspan>
</text>
<text x="650" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="650" dy="0"><tspan font-weight="bold" fill="#17457f">Confidentiality:</tspan></tspan>
  <tspan x="650" dy="40">no one else reads it</tspan>
</text>
<text x="505" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="505" dy="0"><tspan font-weight="bold" fill="#2e7d32">السلامة:</tspan> الرسالة توصل زي ما هي</tspan>
</text>
<text x="120" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#2e7d32">Integrity:</tspan> the message</tspan>
  <tspan x="120" dy="40">arrives unchanged</tspan>
</text>
<text x="518" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="518" dy="0"><tspan font-weight="bold" fill="#17457f">TLS</tspan></tspan>
</text>
</svg>
