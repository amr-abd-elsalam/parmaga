<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جرّب 3:</tspan> يصبح التحميل بطيئًا جدًا؛</tspan>
  <tspan x="950" dy="40">لأن <tspan font-weight="bold" fill="#17457f">التشفير بالمفتاح العام</tspan> يحتاج إلى</tspan>
  <tspan x="950" dy="40">حسابات كثيرة، والفيديو <tspan fill="#c96a1b">بيانات كبيرة.</tspan></tspan>
</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Try It 3:</tspan> loading becomes very slow;</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">public-key cryptography</tspan> needs heavy</tspan>
  <tspan x="120" dy="40">calculation, and a video is a</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">large amount of data.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جرّب 4:</tspan> تختلف الإجابة من موقع إلى آخر؛</tspan>
  <tspan x="950" dy="40">المهم أن تجد <tspan font-weight="bold" fill="#17457f">اسم الجهة</tspan> في <tspan font-weight="bold" fill="#17457f">بيانات الشهادة.</tspan></tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Try It 4:</tspan> the answer differs from site</tspan>
  <tspan x="120" dy="40">to site; what matters is finding the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">authority's name</tspan> in the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">certificate details.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">توقّع 2:</tspan> لا؛ تغيير حرف أو رقم واحد</tspan>
  <tspan x="950" dy="40">يغيّر <tspan font-weight="bold" fill="#c0392b">البصمة</tspan> تمامًا، <tspan font-weight="bold" fill="#2e7d32">فيُكتشف التعديل.</tspan></tspan>
</text>

<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Predict 2:</tspan> No; changing one letter or</tspan>
  <tspan x="120" dy="40">number changes the <tspan font-weight="bold" fill="#c0392b">hash</tspan> completely, so</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">the change is detected.</tspan></tspan>
</text>
</svg>
