<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 يضيف أحمد <tspan font-weight="bold" fill="#c0392b">لونه السري</tspan> إلى خليط منى،</tspan>
  <tspan x="950" dy="40">وتضيف منى لونها السري إلى خليط أحمد،</tspan>
  <tspan x="950" dy="40">فيصل الاثنان إلى <tspan font-weight="bold" fill="#2e7d32">لون نهائي واحد.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">4 Ahmed adds his <tspan font-weight="bold" fill="#c0392b">secret color</tspan> to Mona's</tspan>
  <tspan x="120" dy="40">mix, and Mona adds hers to Ahmed's mix,</tspan>
  <tspan x="120" dy="40">so both reach <tspan font-weight="bold" fill="#2e7d32">the same final color.</tspan></tspan>
</text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 مع سمير <tspan fill="#c96a1b">الأصفر</tspan> والخليطان، لكنه <tspan font-weight="bold" fill="#17457f">لا يستطيع</tspan></tspan>
  <tspan x="950" dy="40">فصل الألوان ليصل إلى اللون النهائي.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">5 Samir has the <tspan fill="#c96a1b">yellow</tspan> and both mixes,</tspan>
  <tspan x="120" dy="40">but he <tspan font-weight="bold" fill="#17457f">cannot</tspan> separate the colors</tspan>
  <tspan x="120" dy="40">to reach the final color.</tspan>
</text>
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">المفتاح ما اتبعتش أصلًا…</tspan>
  <tspan x="935" dy="40">اتحسب عند كل واحد.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The key was never sent…</tspan>
  <tspan x="140" dy="40">each side calculated it.</tspan>
</text>
<text x="660" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">اللون النهائي نفسه</text>
<text x="391" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">The same final color</text>
<text x="644" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">سمير لا يستطيع</text>
<text x="440" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Samir cannot</text>
</svg>
