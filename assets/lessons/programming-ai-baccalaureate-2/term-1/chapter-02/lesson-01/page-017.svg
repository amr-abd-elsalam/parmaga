  <path d="M24 10 C 31 5, 40 5, 45 8 L 45 40 C 40 37, 31 37, 24 42 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="10" x2="24" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
