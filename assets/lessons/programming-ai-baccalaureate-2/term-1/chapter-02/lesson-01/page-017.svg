<!-- Main idea: Arabic -->
<text x="935" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخلاصة: تذكّر:</tspan> يستخدم HTTPS التشفير</tspan>
  <tspan x="935" dy="36"><tspan font-weight="bold" fill="#17457f">بالمفتاح العام</tspan> لمشاركة مفتاح بأمان، والتشفير</tspan>
  <tspan x="935" dy="36"><tspan font-weight="bold" fill="#17457f">بالمفتاح المشترك</tspan> لنقل البيانات بسرعة. وتظل</tspan>
  <tspan x="935" dy="36">الخدمات آمنة بتكديس التشفير والشهادات</tspan>
  <tspan x="935" dy="36">والتوقيعات والمصادقة متعددة العوامل في طبقات.</tspan>
</text>

<!-- Main idea: English -->
<text x="140" y="330" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Key takeaway — Remember:</tspan> HTTPS uses</tspan>
  <tspan x="140" dy="36"><tspan font-weight="bold" fill="#17457f">public-key cryptography</tspan> to share a key</tspan>
  <tspan x="140" dy="36">safely and <tspan font-weight="bold" fill="#17457f">common-key cryptography</tspan> to</tspan>
  <tspan x="140" dy="36">move data quickly. Services stay safe</tspan>
  <tspan x="140" dy="36">by layering encryption, certificates,</tspan>
  <tspan x="140" dy="36">signatures, and</tspan>
  <tspan x="140" dy="36">multi-factor authentication.</tspan>
</text>

<!-- Section header -->
<text x="950" y="618" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">مصطلحات أساسية | KEY TERMS</text>

<!-- Term 1 -->
<text x="935" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الشهادة الرقمية:</tspan> تُثبت أن الموقع حقيقي.</tspan>
</text>
<text x="140" y="690" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">digital certificate</tspan> — proves</tspan>
  <tspan x="140" dy="36">a site is genuine.</tspan>
</text>

<!-- Term 2 -->
<text x="935" y="798" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المصادقة متعددة العوامل:</tspan> تمنع تسجيل</tspan>
  <tspan x="935" dy="36">الدخول غير المصرح به.</tspan>
</text>
<text x="140" y="870" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">multi-factor authentication</tspan> — blocks</tspan>
  <tspan x="140" dy="36">unauthorized logins.</tspan>
</text>

<!-- Term 3 -->
<text x="935" y="978" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التشفير:</tspan> يحافظ على خصوصية المحتوى.</tspan>
</text>
<text x="140" y="1014" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">encryption</tspan> — keeps content private.</tspan>
</text>

<!-- Term 4 -->
<text x="935" y="1086" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التوقيع الرقمي:</tspan> يكتشف التلاعب،</tspan>
  <tspan x="935" dy="36">ويوفر عدم التنصل.</tspan>
</text>
<text x="140" y="1158" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">digital signature</tspan> — detects</tspan>
  <tspan x="140" dy="36">tampering; gives non-repudiation.</tspan>
</text>
</svg>
