<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">هل منى في أمان 100%؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Is Mona 100% Safe?</tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا. لو اتصل بها شخص <tspan font-weight="bold" fill="#17457f">يدّعي</tspan> أنه من البنك،</tspan>
  <tspan x="950" dy="40">وأعطته <tspan font-weight="bold" fill="#c0392b">الرمز،</tspan> فلن تحميها أي تقنية.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No. If someone calls her <tspan font-weight="bold" fill="#17457f">pretending</tspan> to</tspan>
  <tspan x="120" dy="40">be from the bank and she gives him the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">code,</tspan> no technology will protect her.</tspan>
</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">الهندسة الاجتماعية</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">SOCIAL ENGINEERING</tspan>
</text>
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الهندسة الاجتماعية</tspan> Social engineering:</tspan>
  <tspan x="935" dy="40">خداع الإنسان نفسه ليكشف كلمة مروره أو رمزه.</tspan>
  <tspan x="935" dy="40">البنك <tspan font-weight="bold" fill="#17457f">لا يطلب</tspan> منك الرمز أبدًا في مكالمة.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Social engineering:</tspan> tricking the</tspan>
  <tspan x="140" dy="40">person into revealing their password</tspan>
  <tspan x="140" dy="40">or code. Your bank <tspan font-weight="bold" fill="#17457f">never asks</tspan> you</tspan>
  <tspan x="140" dy="40">for the code in a call.</tspan>
</text>
<text x="560" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="560" dy="0">«اديني الكود»</tspan>
</text>
<text x="330" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="330" dy="0">"Give me the code"</tspan>
</text>
<text x="770" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="770" dy="0">لا تعطِ الرمز لأحد</tspan>
</text>
<text x="461" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="461" dy="0">Never share the code</tspan>
</text>
</svg>
