<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">لماذا نشفّر؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Why Do We Encrypt?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">حكاية سمير الفضولي</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The Story of Nosy Samir</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أحمد (المتصفح) يرسل ورقة إلى منى (الخادم)،</tspan>
  <tspan x="950" dy="40">والورقة تمر بيد <tspan font-weight="bold" fill="#c0392b">سمير الفضولي</tspan> (المتنصت).</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Ahmed (the browser) sends a note</tspan>
  <tspan x="120" dy="40">to Mona (the server), and the note</tspan>
  <tspan x="120" dy="40">passes through the hands of <tspan font-weight="bold" fill="#c0392b">Nosy Samir</tspan></tspan>
  <tspan x="120" dy="40">(the eavesdropper).</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يكتب أحمد: «كلمة المرور 1234»، فيقرؤها سمير</tspan>
  <tspan x="950" dy="40">بصوت عالٍ. <tspan font-weight="bold" fill="#17457f">هذا هو HTTP.</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Ahmed writes: "The password is 1234,"</tspan>
  <tspan x="120" dy="40">and Samir reads it out loud.</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">This is HTTP.</tspan></tspan>
</text>

<text x="898" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">أحمد: المتصفح</text>
<text x="690" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Ahmed: Browser</text>
<text x="636" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">سمير: المتنصت</text>
<text x="394" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Samir: Eavesdropper</text>
<text x="330" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">منى: الخادم</text>
<text x="166" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Mona: Server</text>
</svg>
