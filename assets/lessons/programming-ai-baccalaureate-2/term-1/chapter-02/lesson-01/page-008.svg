<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التشفير</tspan> Encryption: تحويل البيانات المقروءة</tspan>
  <tspan x="950" dy="40">إلى صورة غير مفهومة باستخدام <tspan font-weight="bold" fill="#17457f">مفتاح.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Encryption:</tspan> turning readable data into</tspan>
  <tspan x="120" dy="40">an unreadable form using a <tspan font-weight="bold" fill="#17457f">key.</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">فك التشفير</tspan> Decryption: إعادة البيانات</tspan>
  <tspan x="950" dy="40">المشفرة إلى صورتها <tspan font-weight="bold" fill="#2e7d32">الأصلية</tspan> بالمفتاح المناسب.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Decryption:</tspan> returning encrypted data</tspan>
  <tspan x="120" dy="40">to its <tspan font-weight="bold" fill="#2e7d32">original</tspan> form with the right key.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المفتاح</tspan> Key: قيمة تستخدمها خوارزمية التشفير؛</tspan>
  <tspan x="950" dy="40">فطريقة التشفير قد تكون معروفة للجميع،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والسر</tspan> كله في المفتاح.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Key:</tspan> a value used by the encryption</tspan>
  <tspan x="120" dy="40">algorithm; the method can be known to</tspan>
  <tspan x="120" dy="40">everyone, and the whole <tspan font-weight="bold" fill="#17457f">secret</tspan> is</tspan>
  <tspan x="120" dy="40">in the key.</tspan>
</text>

<text x="939" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">النص الأصلي</text>
<text x="811" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Plaintext</text>
<text x="785" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">تشفير بالمفتاح</text>
<text x="564" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Encrypt with the key</text>
<text x="611" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">النص المشفر</text>
<text x="470" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Ciphertext</text>
<text x="468" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">فك التشفير بالمفتاح</text>
<text x="234" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Decrypt with the key</text>
</svg>
