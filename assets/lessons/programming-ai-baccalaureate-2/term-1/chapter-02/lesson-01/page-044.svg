<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">بطاقة المراجعة الأخيرة</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Final Review Card</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">الأمان</tspan> <tspan font-weight="bold" fill="#17457f">طبقات،</tspan> ولا توجد تقنية واحدة تكفي.</tspan>
</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">1 <tspan font-weight="bold" fill="#c0392b">Security</tspan> comes in <tspan font-weight="bold" fill="#17457f">layers;</tspan> no single</tspan>
  <tspan x="120" dy="40">technology is enough.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">2 مين يقرأ؟ ← التشفير. مين غيّر؟ ← التوقيع.</tspan>
  <tspan x="950" dy="40">مين الموقع؟ ← الشهادة.</tspan>
  <tspan x="950" dy="40">مين المستخدم؟ ← المصادقة متعددة العوامل.</tspan>
</text>

<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">2 Who reads? → Encryption.</tspan>
  <tspan x="120" dy="40">Who changed it? → Signature.</tspan>
  <tspan x="120" dy="40">Who is the site? → Certificate.</tspan>
  <tspan x="120" dy="40">Who is the user? → Multi-factor</tspan>
  <tspan x="120" dy="40">authentication.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">3 <tspan font-weight="bold" fill="#17457f">العام</tspan> يوصّل المفتاح،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والمتماثل</tspan> يشيل البيانات.</tspan>
</text>

<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">3 <tspan font-weight="bold" fill="#17457f">Public-key</tspan> delivers the key;</tspan>
