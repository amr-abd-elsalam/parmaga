<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="448" width="870" height="248" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="928" width="870" height="168" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info cards (English twins) -->
<rect x="105" y="442" width="870" height="248" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="458" width="6" height="216" rx="3" fill="#2f7fb5"/>
<rect x="105" y="922" width="870" height="168" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="938" width="6" height="136" rx="3" fill="#2f7fb5"/>

<!-- Bullets -->
<circle cx="966" cy="264" r="6" fill="#c0392b"/>
<circle cx="966" cy="784" r="6" fill="#c0392b"/>

<!-- Icon: open book beside the header -->
<g transform="translate(118 96)">
  <path d="M 26 12 C 18 6 8 6 2 9 V 46 C 8 43 18 43 26 49 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 26 12 C 34 6 44 6 50 9 V 46 C 44 43 34 43 26 49 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="9" y1="19" x2="20" y2="21" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="9" y1="29" x2="20" y2="31" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="21" x2="43" y2="19" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="31" x2="43" y2="29" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: padlock in the first card -->
<g transform="translate(852 522)">
  <path d="M 16 24 V 16 A 12 12 0 0 1 40 16 V 24" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <rect x="6" y="22" width="44" height="32" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="36" r="5" fill="#ffd24a"/>
  <rect x="26" y="38" width="4" height="9" rx="2" fill="#ffd24a"/>
</g>

<!-- Icon: shield with check in the second card -->
<g transform="translate(852 980)">
  <path d="M 28 2 L 50 10 V 28 C 50 42 40 50 28 54 C 16 50 6 42 6 28 V 10 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 18 28 L 25 35 L 38 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أهداف التعلم</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Learning Objectives</text>

<!-- Objective 1 -->
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اشرح كيف يؤمّن <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> الاتصال:</tspan>
  <tspan x="950" dy="40">كيف تستخدم مصافحة TLS التشفير <tspan font-weight="bold" fill="#17457f">بالمفتاح العام</tspan></tspan>
  <tspan x="950" dy="40">لمشاركة مفتاح بأمان، وكيف يحمي التشفير</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بالمفتاح المشترك</tspan> البيانات التي تليها.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain how <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> secures</tspan>
  <tspan x="140" dy="40">communication: how the TLS handshake</tspan>
  <tspan x="140" dy="40">uses <tspan font-weight="bold" fill="#17457f">public-key</tspan> cryptography to share</tspan>
  <tspan x="140" dy="40">a key safely, and how <tspan font-weight="bold" fill="#17457f">common-key</tspan></tspan>
  <tspan x="140" dy="40">cryptography then protects the data</tspan>
  <tspan x="140" dy="40">that follows.</tspan>
</text>

<!-- Objective 2 -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صِف كيف تُستخدم المصادقة، ومنها</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">المصادقة متعددة العوامل،</tspan> في الخدمات الفعلية،</tspan>
  <tspan x="950" dy="40">واشرح لماذا تُجمع <tspan font-weight="bold" fill="#17457f">تقنيات الأمان</tspan> معًا.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Describe how authentication, including</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">multi-factor authentication,</tspan> is used</tspan>
  <tspan x="140" dy="40">in real services, and explain why</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">security technologies</tspan> are combined.</tspan>
</text>
</svg>
