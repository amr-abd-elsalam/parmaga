<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الأمان طبقات</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Security Comes in Layers</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">هل تساءلت يومًا ماذا يحدث في الثانية</tspan>
  <tspan x="950" dy="40">التي تلي ضغطك على زر <tspan font-weight="bold" fill="#17457f">«تسجيل الدخول»؟</tspan></tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Have you ever wondered what happens</tspan>
  <tspan x="120" dy="40">in the second after you press the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">"Log in"</tspan> button?</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">في هذه الثانية تعمل <tspan font-weight="bold" fill="#c0392b">أربع تقنيات</tspan> معًا.</tspan>
</text>

<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">In that second, <tspan font-weight="bold" fill="#c0392b">four technologies</tspan></tspan>
  <tspan x="120" dy="40">work together.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لا توجد تقنية واحدة تحمينا؛ الأمان طبقات،</tspan>
  <tspan x="935" dy="40">وكل طبقة تجيب عن سؤال مختلف.</tspan>
</text>

<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">No single technology protects us;</tspan>
  <tspan x="140" dy="40">security comes in layers, and each</tspan>
  <tspan x="140" dy="40">layer answers a different question.</tspan>
</text>

<text x="312" y="1100" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">التشفير</text>

<text x="140" y="1132" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">Encryption</text>

<text x="965" y="1100" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">التوقيع الرقمي</text>

<text x="700" y="1132" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">Digital signature</text>

<text x="312" y="1180" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">الشهادة الرقمية</text>

<text x="140" y="1212" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">
  <tspan x="140" dy="0">Digital</tspan>
  <tspan x="140" dy="32">certificate</tspan>
</text>

<text x="965" y="1180" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">المصادقة متعددة العوامل</text>

<text x="700" y="1212" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" font-weight="normal" fill="#3d5a76">
  <tspan x="700" dy="0">Multi-factor</tspan>
  <tspan x="700" dy="32">authentication</tspan>
</text>
</svg>
