<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">إثبت إنك إنت</tspan>
</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">Prove It's You</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المصادقة Authentication:</tspan> <tspan font-weight="bold" fill="#17457f">التحقق</tspan> من أن من</tspan>
  <tspan x="950" dy="40">يطلب الدخول هو فعلًا من يدّعي أنه هو.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Authentication:</tspan> <tspan font-weight="bold" fill="#17457f">checking</tspan> that the</tspan>
  <tspan x="120" dy="40">person asking to log in really is who</tspan>
  <tspan x="120" dy="40">they claim to be.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="950" dy="0">اللي في دماغك: <tspan font-weight="bold" fill="#17457f">المعرفة</tspan></tspan>
</text>
<text x="640" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="640" dy="0">What's in your head:</tspan>
  <tspan x="640" dy="40"><tspan font-weight="bold" fill="#17457f">Knowledge</tspan></tspan>
</text>
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="950" dy="0">اللي في جيبك: <tspan fill="#c96a1b">الحيازة</tspan></tspan>
</text>
<text x="640" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="640" dy="0">What's in your pocket:</tspan>
  <tspan x="640" dy="40"><tspan fill="#c96a1b">Possession</tspan></tspan>
</text>
<text x="390" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="390" dy="0">اللي هو إنت:</tspan>
  <tspan x="390" dy="40"><tspan font-weight="bold" fill="#2e7d32">السمات الحيوية</tspan></tspan>
</text>
<text x="150" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="150" dy="0">What you are:</tspan>
  <tspan x="150" dy="40"><tspan font-weight="bold" fill="#2e7d32">Biometric</tspan></tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">العوامل الثلاثة</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Three Factors</tspan>
</text>

<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المعرفة Knowledge:</tspan> شيء تعرفه، مثل <tspan fill="#c96a1b">كلمة المرور</tspan></tspan>
  <tspan x="950" dy="40">أو الرقم السري PIN أو إجابة سؤال سري.</tspan>
</text>
<text x="132" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Knowledge:</tspan> something you know, like a</tspan>
  <tspan x="132" dy="40"><tspan fill="#c96a1b">password,</tspan> a PIN, or the answer to a</tspan>
  <tspan x="132" dy="40">secret question.</tspan>
</text>
