<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عدم التنصل</tspan> <tspan font-weight="bold" fill="#c0392b">Non-repudiation:</tspan> ألا يستطيع</tspan>
  <tspan x="950" dy="40">الموقّع أن ينكر توقيعه لاحقًا، لأن</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">مفتاحه الخاص</tspan> وحده ينتج هذا التوقيع،</tspan>
  <tspan x="950" dy="40">ما دام قد حافظ على سريته.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Non-repudiation:</tspan> the signer cannot later</tspan>
  <tspan x="120" dy="40">deny signing, because only their <tspan font-weight="bold" fill="#17457f">private</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">key</tspan> produces this signature, as long as</tspan>
  <tspan x="120" dy="40">they kept it secret.</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الشهادة تسأل: مين ده؟</tspan>
  <tspan x="935" dy="40">والتوقيع يسأل: الكلام اتغيّر؟ ومين قاله؟</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The certificate asks: Who is this?</tspan>
  <tspan x="140" dy="40">The signature asks: Was it changed?</tspan>
  <tspan x="140" dy="40">Who said it?</tspan>
</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«مش أنا!» ← <tspan font-weight="bold" fill="#c0392b">مرفوض</tspan></tspan>
</text>
<text x="610" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="610" dy="0">"Not me!" → <tspan font-weight="bold" fill="#c0392b">rejected</tspan></tspan>
</text>
<text x="460" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="460" dy="0"><tspan font-weight="bold" fill="#17457f">التوقيع</tspan> يثبت المرسل</tspan>
</text>
<text x="150" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">The <tspan font-weight="bold" fill="#17457f">signature</tspan> proves</tspan>
  <tspan x="150" dy="40">the sender</tspan>
</text>
</svg>
