<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 يحسب الطرفان <tspan font-weight="bold" fill="#17457f">مفتاح جلسة</tspan> مشتركًا، ثم تنتقل</tspan>
  <tspan x="950" dy="40">البيانات مشفرة بسرعة ← <tspan font-weight="bold" fill="#c0392b">التشفير.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">3 Both sides calculate a shared</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">session key,</tspan> then the data travels</tspan>
  <tspan x="120" dy="40">encrypted and fast → <tspan font-weight="bold" fill="#c0392b">Encryption.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 تكتب منى <tspan font-weight="bold" fill="#17457f">كلمة المرور،</tspan> فيصلها رمز على</tspan>
  <tspan x="950" dy="40">هاتفها ← <tspan font-weight="bold" fill="#c0392b">المصادقة متعددة العوامل.</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">4 Mona types her <tspan font-weight="bold" fill="#17457f">password,</tspan></tspan>
  <tspan x="120" dy="40">and a code reaches her phone →</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">Multi-factor authentication.</tspan></tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 عند الدفع، يطلب البنك تأكيدًا</tspan>
  <tspan x="950" dy="40">عبر <tspan font-weight="bold" fill="#c0392b">&#x200E;3-D Secure</tspan> ← <tspan font-weight="bold" fill="#17457f">طبقة إضافية.</tspan></tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">5 At payment, the bank asks for</tspan>
  <tspan x="120" dy="40">confirmation through <tspan font-weight="bold" fill="#c0392b">3-D Secure</tspan></tspan>
  <tspan x="120" dy="40">→ <tspan font-weight="bold" fill="#17457f">an extra layer.</tspan></tspan>
</text>

<text x="893" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="893" dy="0">نفق مشفر</tspan>
</text>
<text x="719" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="719" dy="0">Encrypted tunnel</tspan>
</text>
<text x="619" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="619" dy="0">رمز على الهاتف</tspan>
</text>
<text x="413" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="413" dy="0">Code on the phone</tspan>
</text>
<text x="293" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="293" dy="0">تأكيد البنك</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="120" dy="0">Bank confirmation</tspan>
</text>
</svg>
