<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التوقيع الرقمي</tspan> Digital signature: يحسب</tspan>
  <tspan x="950" dy="40">المرسل بصمة الرسالة ويوقّعها <tspan font-weight="bold" fill="#17457f">بمفتاحه الخاص،</tspan></tspan>
  <tspan x="950" dy="40">ويتحقق المستقبل منها بالمفتاح العام للمرسل.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Digital signature:</tspan> the sender calculates</tspan>
  <tspan x="120" dy="40">the message's hash and signs it with</tspan>
  <tspan x="120" dy="40">their <tspan font-weight="bold" fill="#17457f">private key,</tspan> and the receiver</tspan>
  <tspan x="120" dy="40">checks it with the sender's <tspan font-weight="bold" fill="#17457f">public key.</tspan></tspan>
</text>
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إذا <tspan font-weight="bold" fill="#17457f">فشل التحقق،</tspan> فالرسالة عُدّلت</tspan>
  <tspan x="950" dy="40">أو لم تصدر عن صاحب المفتاح.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If the <tspan font-weight="bold" fill="#17457f">check fails,</tspan> the message</tspan>
  <tspan x="120" dy="40">was changed or did not come from</tspan>
  <tspan x="120" dy="40">the key's owner.</tspan>
</text>

<text x="791" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="791" dy="0">البصمة</tspan>
</text>
<text x="722" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="722" dy="0">Hash</tspan>
</text>
<text x="667" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="667" dy="0">يوقّع بالمفتاح الخاص</tspan>
</text>
<text x="482" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="482" dy="0">Signs with</tspan>
  <tspan x="482" dy="40">private key</tspan>
</text>
<text x="411" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="411" dy="0">يتحقق بالمفتاح العام</tspan>
</text>
<text x="212" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="212" dy="0">Verifies with</tspan>
  <tspan x="212" dy="40">public key</tspan>
</text>
</svg>
