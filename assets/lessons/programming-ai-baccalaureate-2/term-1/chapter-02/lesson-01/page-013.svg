  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: key direction reverses between encryption and signing -->
<g>
  <linearGradient id="ilLock" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
  <linearGradient id="ilShackle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#7f95ab"/>
  </linearGradient>
  <linearGradient id="ilBlue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fc9f2"/>
    <stop offset="1" stop-color="#2f7fb5"/>
  </linearGradient>
  <linearGradient id="ilOrange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>

  <!-- shadows -->
  <rect x="484" y="886" width="100" height="64" rx="12" fill="#22303f" opacity=".18"/>
  <g transform="translate(184 918)" fill="#22303f" opacity=".18">
    <circle cx="0" cy="0" r="22"/>
    <rect x="18" y="-7" width="90" height="14" rx="4"/>
  </g>
  <g transform="translate(904 918)" fill="#22303f" opacity=".18">
    <circle cx="0" cy="0" r="22"/>
    <rect x="-108" y="-7" width="90" height="14" rx="4"/>
  </g>
  <path d="M404 968 H466 L492 994 V1064 H404 Z" fill="#22303f" opacity=".18"/>
  <g transform="translate(350 978) rotate(30)" fill="#22303f" opacity=".18">
    <circle cx="0" cy="0" r="22"/>
    <rect x="18" y="-7" width="90" height="14" rx="4"/>
  </g>
  <g transform="translate(644 1016)" fill="#22303f" opacity=".18">
    <circle cx="0" cy="0" r="22"/>
    <rect x="18" y="-7" width="90" height="14" rx="4"/>
  </g>
  <circle cx="796" cy="1016" r="24" fill="#22303f" opacity=".18"/>

  <!-- Top row: public key -->
  <g transform="translate(180 912)">
    <rect x="80" y="5" width="10" height="16" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="96" y="5" width="12" height="20" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="18" y="-7" width="90" height="14" rx="4" fill="url(#ilBlue)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="url(#ilBlue)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Top row: closed padlock -->
  <path d="M492 882 V870 A38 38 0 0 1 568 870 V882 H552 V870 A22 22 0 0 0 508 870 V882 Z" fill="url(#ilShackle)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="880" width="100" height="64" rx="12" fill="url(#ilLock)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="490" y="888" width="10" height="44" rx="5" fill="#ffffff" opacity=".35"/>
  <circle cx="530" cy="903" r="7" fill="#22303f"/>
  <rect x="527" y="906" width="6" height="18" rx="3" fill="#22303f"/>

  <!-- Top row: private key (facing left) -->
  <g transform="translate(900 912)">
    <rect x="-90" y="5" width="10" height="16" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-108" y="5" width="12" height="20" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-108" y="-7" width="90" height="14" rx="4" fill="url(#ilOrange)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="url(#ilOrange)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Bottom row: document with stamp mark -->
  <path d="M400 962 H462 L488 988 V1058 H400 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M462 962 V988 H488" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="412" y="978" width="38" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="412" y="992" width="62" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="412" y="1006" width="62" height="4" rx="2" fill="#8fc9f2"/>
  <circle cx="452" cy="1036" r="14" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="452" cy="1036" r="6" fill="#c96a1b"/>
  <line x1="472" y1="1026" x2="480" y2="1022" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="473" y1="1040" x2="481" y2="1042" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom row: private key stamping -->
  <g transform="translate(346 972) rotate(30)">
    <rect x="80" y="5" width="10" height="16" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="96" y="5" width="12" height="20" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="18" y="-7" width="90" height="14" rx="4" fill="url(#ilOrange)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="url(#ilOrange)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Bottom row: public key -->
  <g transform="translate(640 1010)">
    <rect x="80" y="5" width="10" height="16" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="96" y="5" width="12" height="20" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="18" y="-7" width="90" height="14" rx="4" fill="url(#ilBlue)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="22" fill="url(#ilBlue)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Bottom row: check badge -->
  <circle cx="792" cy="1010" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="780,1010 788,1019 805,1002 801,998 788,1011 784,1006" fill="#ffffff"/>

  <!-- Ground line -->
  <rect x="105" y="1256" width="870" height="8" rx="4" fill="#dff1f7"/>

  <!-- Row arrows -->
  <line x1="300" y1="912" x2="452" y2="912" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="464,912 450,904 450,920" fill="#c0392b"/>
  <line x1="596" y1="912" x2="766" y2="912" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="778,912 764,904 764,920" fill="#c0392b"/>
  <line x1="506" y1="1010" x2="590" y2="1010" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="602,1010 588,1002 588,1018" fill="#c0392b"/>

  <!-- Label connectors -->
  <line x1="230" y1="1052" x2="230" y2="944" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="230,930 222,944 238,944" fill="#c0392b"/>
  <line x1="850" y1="1052" x2="850" y2="944" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="850,930 842,944 858,944" fill="#c0392b"/>
  <line x1="444" y1="1148" x2="444" y2="1080" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="444,1066 436,1080 452,1080" fill="#c0392b"/>
  <line x1="690" y1="1148" x2="690" y2="1042" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="690,1028 682,1042 698,1042" fill="#c0392b"/>
</g>

<!-- Bullet 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في <tspan font-weight="bold" fill="#c0392b">التشفير:</tspan> المرسل يقفل بالمفتاح <tspan font-weight="bold" fill="#17457f">العام</tspan></tspan>
  <tspan x="950" dy="40">للمستقبل، والمستقبل يفتح بمفتاحه <tspan font-weight="bold" fill="#17457f">الخاص.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In <tspan font-weight="bold" fill="#c0392b">encryption:</tspan> the sender locks with</tspan>
  <tspan x="120" dy="40">the receiver's <tspan font-weight="bold" fill="#17457f">public key,</tspan> and the</tspan>
  <tspan x="120" dy="40">receiver opens with their <tspan font-weight="bold" fill="#17457f">private key.</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في <tspan font-weight="bold" fill="#c0392b">التوقيع:</tspan> صاحب التوقيع يوقّع بمفتاحه</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الخاص،</tspan> وأي شخص يتحقق بمفتاحه <tspan font-weight="bold" fill="#17457f">العام.</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In <tspan font-weight="bold" fill="#c0392b">signing:</tspan> the signer signs with</tspan>
  <tspan x="120" dy="40">their <tspan font-weight="bold" fill="#17457f">private key,</tspan> and anyone verifies</tspan>
  <tspan x="120" dy="40">with the signer's <tspan font-weight="bold" fill="#17457f">public key.</tspan></tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الخاص دايمًا عند صاحبه:</tspan>
  <tspan x="935" dy="40">يفتح رسايله، ويمضي باسمه.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The private key always stays with</tspan>
  <tspan x="140" dy="40">its owner: it opens their messages</tspan>
  <tspan x="140" dy="40">and signs in their name.</tspan>
</text>

<!-- Illustration labels (Layout order) -->
<text x="291" y="1094" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">يقفل بالعام</text>
<text x="118" y="1130" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Locks with public</text>
<text x="917" y="1094" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">يفتح بالخاص</text>
<text x="708" y="1130" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Opens with private</text>
<text x="509" y="1190" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">يوقّع بالخاص</text>
<text x="324" y="1226" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Signs with private</text>
<text x="770" y="1190" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">يتحقق بالعام</text>
<text x="575" y="1226" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Verifies with public</text>
</svg>
