  <polygon points="24,2 29.29,16.72 44.92,17.2 32.56,26.78 36.93,41.8 24,33 11.07,41.8 15.44,26.78 3.08,17.2 18.71,16.72" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Face: wink (tip) -->
<g transform="translate(880 742)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
