<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="30" patternUnits="userSpaceOnUse">
    <line x1="0" y1="29.5" x2="1080" y2="29.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Table shadow and fill -->
<rect x="99" y="376" width="890" height="850" rx="12" fill="#22303f" opacity=".12"/>
<rect x="95" y="370" width="890" height="850" rx="12" fill="#fffdf7"/>
<!-- Header row background -->
<rect x="95" y="370" width="890" height="80" rx="12" fill="#fdf6d8"/>
<rect x="95" y="410" width="890" height="40" fill="#fdf6d8"/>
<!-- Separators -->
<line x1="95" y1="450" x2="985" y2="450" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="620" x2="985" y2="620" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="940" x2="985" y2="940" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="1110" x2="985" y2="1110" stroke="#c0392b" stroke-width="1.4"/>
<line x1="590" y1="370" x2="590" y2="1220" stroke="#c0392b" stroke-width="1.4"/>
<!-- Table frame stroke -->
<rect x="95" y="370" width="890" height="850" rx="12" fill="none" stroke="#c0392b" stroke-width="2"/>

<!-- Icon: shield (security), top-left -->
<g transform="translate(118 84)">
  <path d="M25 2 L46 10 L46 26 C46 40 37 50 25 55 C13 50 4 40 4 26 L4 10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 28 L22 36 L36 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Icon: lock (security), top-right -->
<g transform="translate(908 84)">
  <path d="M14 26 L14 17 C14 4 38 4 38 17 L38 26" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="4" y="26" width="44" height="30" rx="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="38" r="4" fill="#22303f"/>
  <rect x="24" y="40" width="4" height="9" rx="2" fill="#22303f"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">3. الجمع بين تقنيات الأمان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">3. Combinations of Security Technologies</text>

<!-- Paragraph (1) -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#225f9c">
  <tspan x="950" dy="0">(1) لا يتحقق أمان الاتصال والخدمات بتقنية واحدة،</tspan>
  <tspan x="950" dy="30">بل <tspan font-weight="bold" fill="#17457f">بالجمع</tspan> بين عدة تقنيات أمان.</tspan>
</text>
<text x="120" y="294" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42">
  <tspan x="120" dy="0">(1) Safe communication and services are</tspan>
  <tspan x="120" dy="30">achieved not by a single technology, but by</tspan>
  <tspan x="120" dy="30"><tspan font-weight="bold" fill="#17457f">combining</tspan> multiple security technologies.</tspan>
</text>

<!-- Header row -->
<text x="965" y="401" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#c0392b">التقنية</text>
<text x="610" y="431" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#152b42">Technology</text>
<text x="570" y="401" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#c0392b">التأثير</text>
<text x="115" y="431" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#152b42">Effect</text>

<!-- Row 1 -->
<text x="965" y="481" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">
  <tspan x="965" dy="0">التشفير (بالمفتاح المشترك،</tspan>
  <tspan x="965" dy="30">بالمفتاح العام)</tspan>
</text>
<text x="610" y="541" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#2e7d32">
  <tspan x="610" dy="0">Encryption (common-key,</tspan>
  <tspan x="610" dy="30">public-key)</tspan>
</text>
<text x="570" y="481" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#225f9c">
  <tspan x="570" dy="0">يمنع أطرافًا ثالثة من</tspan>
  <tspan x="570" dy="30">قراءة محتوى الاتصال</tspan>
</text>
<text x="115" y="541" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42">
  <tspan x="115" dy="0">Prevents communication</tspan>
  <tspan x="115" dy="30">content from being read by</tspan>
  <tspan x="115" dy="30">third parties</tspan>
</text>

<!-- Row 2 -->
<text x="965" y="651" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">التوقيع الرقمي</text>
<text x="610" y="681" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#2e7d32">Digital signature</text>
<text x="570" y="651" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#225f9c">
  <tspan x="570" dy="0">يكتشف التلاعب بالبيانات أو</tspan>
  <tspan x="570" dy="30">انتحال هوية المرسل، ويجعل المرسل</tspan>
  <tspan x="570" dy="30">غير قادر على إنكار إرساله</tspan>
  <tspan x="570" dy="30">البيانات لاحقًا <tspan font-weight="bold" fill="#c0392b">(عدم التنصل)</tspan></tspan>
</text>
<text x="115" y="771" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42">
  <tspan x="115" dy="0">Detects data tampering or</tspan>
  <tspan x="115" dy="30">impersonation of the sender,</tspan>
  <tspan x="115" dy="30">and makes it impossible for</tspan>
  <tspan x="115" dy="30">the sender to deny having</tspan>
  <tspan x="115" dy="30">sent the data afterward</tspan>
  <tspan x="115" dy="30"><tspan font-weight="bold" fill="#c0392b">(non-repudiation)</tspan></tspan>
</text>

<!-- Row 3 -->
<text x="965" y="971" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">الشهادة الرقمية</text>
<text x="610" y="1001" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#2e7d32">Digital certificate</text>
<text x="570" y="971" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#225f9c">
  <tspan x="570" dy="0">تتحقق من أن الطرف المقابل</tspan>
  <tspan x="570" dy="30">في الاتصال حقيقي</tspan>
</text>
<text x="115" y="1031" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42">
  <tspan x="115" dy="0">Verifies that the</tspan>
  <tspan x="115" dy="30">communication partner</tspan>
  <tspan x="115" dy="30">is authentic</tspan>
</text>

<!-- Row 4 -->
<text x="965" y="1141" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">المصادقة متعددة العوامل</text>
<text x="610" y="1171" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" font-weight="bold" fill="#2e7d32">
  <tspan x="610" dy="0">Multi-factor</tspan>
  <tspan x="610" dy="30">authentication</tspan>
</text>
<text x="570" y="1141" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#225f9c">تمنع تسجيل الدخول غير المصرح به</text>
<text x="115" y="1171" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42">Prevents unauthorized logins</text>
</svg>
