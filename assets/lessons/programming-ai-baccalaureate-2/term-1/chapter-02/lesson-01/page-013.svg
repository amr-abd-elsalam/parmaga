  <rect x="50" y="43" width="8" height="12" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="20" y="34" width="38" height="10" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="13" cy="39" r="11" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="13" cy="39" r="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: signed document -->
<g transform="translate(122 376)">
  <path d="M8 2 H30 L42 14 V46 H8 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
