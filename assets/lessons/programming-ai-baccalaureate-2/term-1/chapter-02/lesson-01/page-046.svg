<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">حلول جرّب وتوقّع</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Answers to Try It and Predict</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جرّب 1:</tspan> «إنت مين يا موقع؟»؛</tspan>
  <tspan x="950" dy="40">الاسم المختلف بحرف علامة <tspan font-weight="bold" fill="#c0392b">موقع مزيف،</tspan></tspan>
  <tspan x="950" dy="40">والبنك لا يطلب <tspan font-weight="bold" fill="#17457f">كلمة المرور</tspan> في رسالة.</tspan>
</text>

<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Try It 1:</tspan> "Who are you, website?";</tspan>
  <tspan x="120" dy="40">a name off by one letter is a sign</tspan>
  <tspan x="120" dy="40">of a <tspan font-weight="bold" fill="#c0392b">fake site,</tspan> and the bank does not</tspan>
  <tspan x="120" dy="40">ask for your <tspan font-weight="bold" fill="#17457f">password</tspan> in a message.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">توقّع 1:</tspan> <tspan font-weight="bold" fill="#17457f">بالتشفير بالمفتاح العام؛</tspan></tspan>
  <tspan x="950" dy="40">صندوق يُقفل بقفل منى، أو حساب المفتاح</tspan>
  <tspan x="950" dy="40">عند الطرفين دون إرساله.</tspan>
</text>

<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Predict 1:</tspan> with <tspan font-weight="bold" fill="#17457f">public-key</tspan></tspan>
  <tspan x="120" dy="40">cryptography; a box locked with Mona's</tspan>
  <tspan x="120" dy="40">padlock, or both sides calculating the</tspan>
  <tspan x="120" dy="40">key without sending it.</tspan>
</text>

<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">جرّب 2:</tspan> لا؛ لأن القفل يُغلق</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بالمفتاح العام،</tspan> ولا يفتحه إلا</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">المفتاح الخاص</tspan> الذي مع منى وحدها.</tspan>
</text>

<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Try It 2:</tspan> No; the padlock closes</tspan>
  <tspan x="120" dy="40">with the <tspan font-weight="bold" fill="#17457f">public key,</tspan> and only the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">private key,</tspan> which Mona alone holds,</tspan>
  <tspan x="120" dy="40">opens it.</tspan>
</text>
</svg>
