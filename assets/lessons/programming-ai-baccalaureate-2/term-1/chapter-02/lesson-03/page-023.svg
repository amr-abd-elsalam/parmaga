<!-- Icon: open book (key terms) -->
<g transform="translate(372 148)">
  <path d="M26 12 C18 6 8 6 2 9 L2 44 C8 41 18 41 26 47 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
