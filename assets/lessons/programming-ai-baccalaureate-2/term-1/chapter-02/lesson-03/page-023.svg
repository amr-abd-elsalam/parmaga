<!-- Card texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تقييم المخاطر</tspan> Risk Assessment:</tspan>
  <tspan x="935" dy="40">تحديد المخاطر، وتقدير <tspan font-weight="bold" fill="#17457f">تأثير</tspan> كل منها</tspan>
  <tspan x="935" dy="40">واحتماليته، ثم ترتيبها.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Risk assessment:</tspan> identifying risks,</tspan>
  <tspan x="140" dy="40">estimating each one's <tspan font-weight="bold" fill="#17457f">impact</tspan> and</tspan>
  <tspan x="140" dy="40">likelihood, then ranking them.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">إدارة المخاطر</tspan> Risk Management:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الدورة الكاملة:</tspan> نقيّم، ثم نقرر</tspan>
  <tspan x="935" dy="40">ماذا نفعل، ثم نتابع.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Risk management:</tspan> <tspan font-weight="bold" fill="#17457f">the full cycle:</tspan></tspan>
  <tspan x="140" dy="40">assess, decide what to do,</tspan>
  <tspan x="140" dy="40">then follow up.</tspan>
</text>

<!-- Illustration labels -->
<text x="562" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="562" dy="0">قيّم</tspan>
</text>
<text x="496" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="496" dy="0">Assess</tspan>
</text>
<text x="828" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c96a1b">
  <tspan x="828" dy="0">قرّر</tspan>
</text>
<text x="762" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="762" dy="0">Decide</tspan>
</text>
<text x="292" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="292" dy="0">تابع</tspan>
</text>
<text x="200" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="200" dy="0">Follow up</tspan>
</text>
</svg>
