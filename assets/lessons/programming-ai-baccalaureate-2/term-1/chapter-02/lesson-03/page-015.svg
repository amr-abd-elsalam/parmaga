<!-- Section 5 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">5 الاستعادة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">5 Recovery</tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نعيد الأنظمة إلى تشغيل آمن وطبيعي،</tspan>
  <tspan x="950" dy="40">ونراقبها حتى نتأكد أنها <tspan font-weight="bold" fill="#2e7d32">سليمة.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We return systems to safe, normal operation</tspan>
  <tspan x="120" dy="40">and watch them to be sure they are <tspan font-weight="bold" fill="#2e7d32">clean.</tspan></tspan>
</text>
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في المدرسة: نسترجع السجلات من</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">نسخة احتياطية</tspan> سليمة.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">At school: we restore the records</tspan>
  <tspan x="132" dy="40">from a clean <tspan font-weight="bold" fill="#17457f">backup.</tspan></tspan>
</text>

<!-- Section 6 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">6 الدروس المستفادة والتحسين</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">6 Lessons Learned and Improvement</tspan>
</text>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نحلل ما حدث ونوثقه، <tspan font-weight="bold" fill="#17457f">ونقوّي الضوابط</tspan></tspan>
  <tspan x="950" dy="40">لنقلل احتمال التكرار وأثره.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We analyze and record what happened, and</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">strengthen controls</tspan> to reduce repeats.</tspan>
</text>
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إن دخل الهجوم عبر <tspan font-weight="bold" fill="#c0392b">رسالة احتيال،</tspan></tspan>
  <tspan x="950" dy="40">ندرّب الموظفين على كشفها.</tspan>
</text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">If the attack came through</tspan>
  <tspan x="132" dy="40">a <tspan font-weight="bold" fill="#c0392b">phishing email,</tspan> we train staff</tspan>
  <tspan x="132" dy="40">to spot such emails.</tspan>
</text>
</svg>
