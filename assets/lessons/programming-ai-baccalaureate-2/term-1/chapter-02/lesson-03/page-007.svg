<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الماء المتسرب = <tspan font-weight="bold" fill="#c0392b">البرمجية الخبيثة</tspan> التي تنتشر.</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The leaking water = the <tspan font-weight="bold" fill="#c0392b">malware</tspan></tspan>
  <tspan x="120" dy="40">that spreads.</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إغلاق المحبس = <tspan font-weight="bold" fill="#17457f">فصل الجهاز المصاب</tspan> عن الشبكة.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Closing the valve = <tspan font-weight="bold" fill="#17457f">disconnecting</tspan></tspan>
  <tspan x="120" dy="40">the infected device from the network.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الماسورة المكسورة = <tspan font-weight="bold" fill="#c0392b">الثغرة</tspan></tspan>
  <tspan x="950" dy="40">التي دخل منها المهاجم.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The broken pipe = the <tspan font-weight="bold" fill="#c0392b">vulnerability</tspan></tspan>
  <tspan x="120" dy="40">the attacker came in through.</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تجفيف الأرض = استرجاع الملفات</tspan>
  <tspan x="950" dy="40">من <tspan font-weight="bold" fill="#2e7d32">نسخة احتياطية سليمة.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Drying the floor = restoring files</tspan>
  <tspan x="120" dy="40">from a <tspan font-weight="bold" fill="#2e7d32">clean backup.</tspan></tspan>
</text>
</svg>
