<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">عندنا <tspan font-weight="bold" fill="#17457f">نسخة احتياطية</tspan> سليمة. لماذا لا نبدأ</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">بالاستعادة</tspan> فورًا ونوفّر الوقت؟</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">We have a <tspan font-weight="bold" fill="#17457f">clean backup.</tspan> Why not</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">recover</tspan> right away and save time?</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">الإجابة</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">ANSWER</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لأن <tspan font-weight="bold" fill="#c0392b">الثغرة</tspan> ما زالت مفتوحة،</tspan>
  <tspan x="935" dy="40">والبرمجية قد تكون <tspan font-weight="bold" fill="#17457f">باقية</tspan> في أجهزة أخرى.</tspan>
  <tspan x="935" dy="40">ستعود الملفات، ثم <tspan font-weight="bold" fill="#c0392b">يعود الهجوم</tspan> معها.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Because the <tspan font-weight="bold" fill="#c0392b">gap</tspan> is still open</tspan>
  <tspan x="140" dy="40">and the malware may <tspan font-weight="bold" fill="#17457f">remain</tspan> on other</tspan>
  <tspan x="140" dy="40">devices. The files come back,</tspan>
  <tspan x="140" dy="40">and so does <tspan font-weight="bold" fill="#c0392b">the attack.</tspan></tspan>
</text>
<text x="940" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="940" dy="0">الملفات المستعادة</tspan>
</text>
<text x="753" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="753" dy="0">Restored files</tspan>
</text>
<text x="500" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="500" dy="0">الثغرة المفتوحة</tspan>
</text>
<text x="285" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="285" dy="0">Open vulnerability</tspan>
</text>
<text x="275" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="275" dy="0">الهجوم يعود</tspan>
</text>
<text x="135" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="135" dy="0">Attack returns</tspan>
</text>
</svg>
