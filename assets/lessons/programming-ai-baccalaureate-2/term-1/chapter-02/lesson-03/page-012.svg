<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">المراحل الست للاستجابة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Six Stages of Response</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">تابع معنا حادثًا حقيقيًا:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">برنامج فدية</tspan> <tspan font-weight="bold" fill="#17457f">شفّر</tspan> سجلات الطلاب في مدرسة.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Follow a real incident with us:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">ransomware</tspan> <tspan font-weight="bold" fill="#17457f">encrypted</tspan> a school's</tspan>
  <tspan x="120" dy="40">student records.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البرمجية الخبيثة</tspan> Malware: برنامج صُمم</tspan>
  <tspan x="935" dy="40">ليضر أو يتجسس أو يتحكم <tspan font-weight="bold" fill="#17457f">دون إذن.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Malware:</tspan> software built to harm, spy,</tspan>
  <tspan x="140" dy="40">or take control <tspan font-weight="bold" fill="#17457f">without consent.</tspan></tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">برنامج الفدية</tspan> Ransomware: برمجية خبيثة</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">تشفّر</tspan> الملفات، ثم تطلب فدية.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Ransomware:</tspan> malware that <tspan font-weight="bold" fill="#17457f">encrypts</tspan></tspan>
  <tspan x="140" dy="40">files, then demands a ransom.</tspan>
</text>
