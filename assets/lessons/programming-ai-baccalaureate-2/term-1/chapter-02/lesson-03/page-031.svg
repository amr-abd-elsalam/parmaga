<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخاخ الامتحان</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAPS</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«تحديث البرنامج لإضافة ميزات» <tspan font-weight="bold" fill="#c0392b">حادث أمني؟</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"A software update to add features"</tspan>
  <tspan x="140" dy="40">is a <tspan font-weight="bold" fill="#c0392b">security incident?</tspan></tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">الحقيقة:</tspan> <tspan font-weight="bold" fill="#17457f">حدث عادي</tspan> مخطط له،</tspan>
  <tspan x="935" dy="40">لا يهدد أي ركن من ثلاثي CIA.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">The truth:</tspan> a <tspan font-weight="bold" fill="#17457f">normal,</tspan> planned event</tspan>
  <tspan x="140" dy="40">that threatens no part of CIA.</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«الاستعادة من النسخة الاحتياطية <tspan font-weight="bold" fill="#c0392b">فورًا»</tspan></tspan>
  <tspan x="935" dy="40">تبدو سريعة وذكية.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Restore from backup <tspan font-weight="bold" fill="#c0392b">immediately"</tspan></tspan>
  <tspan x="140" dy="40">sounds fast and smart.</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">الحقيقة:</tspan> <tspan font-weight="bold" fill="#c0392b">الثغرة</tspan> ما زالت مفتوحة،</tspan>
  <tspan x="935" dy="40">فيعود الحادث.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">The truth:</tspan> the <tspan font-weight="bold" fill="#c0392b">vulnerability</tspan></tspan>
  <tspan x="140" dy="40">is still open, so the incident returns.</tspan>
</text>
</svg>
