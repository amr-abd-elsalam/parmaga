<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الخطر: ماذا نعالج أولًا؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Risk: What Do We Fix First?</text>

<!-- Paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الحادث</tspan> شيء وقع بالفعل،</tspan>
  <tspan x="950" dy="40">أما <tspan font-weight="bold" fill="#c0392b">الخطر</tspan> فشيء قد يقع.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">An <tspan font-weight="bold" fill="#c0392b">incident</tspan> is something that</tspan>
  <tspan x="120" dy="40">has happened; a <tspan font-weight="bold" fill="#c0392b">risk</tspan> is</tspan>
  <tspan x="120" dy="40">something that might happen.</tspan>
</text>

<!-- Card header -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف دقيق</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">PRECISE DEFINITION</text>

<!-- Card paragraph -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخطر Risk:</tspan> مقياس لمدى تهديد حدث محتمل،</tspan>
  <tspan x="935" dy="40">يُحسب من <tspan font-weight="bold" fill="#17457f">حجم ضرره</tspan> إذا وقع <tspan font-weight="bold" fill="#17457f">واحتمال وقوعه.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Risk:</tspan> a measure of how much</tspan>
  <tspan x="140" dy="40">a possible event threatens us,</tspan>
  <tspan x="140" dy="40">from its <tspan font-weight="bold" fill="#17457f">harm</tspan> and its <tspan font-weight="bold" fill="#17457f">likelihood.</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="808" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">الحادث</tspan></text>
<text x="700" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Incident</tspan></text>
<text x="362" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">الخطر</tspan></text>
<text x="290" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Risk</tspan></text>
