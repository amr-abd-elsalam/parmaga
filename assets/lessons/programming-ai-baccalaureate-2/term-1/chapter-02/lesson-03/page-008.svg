<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Info card: shadow, fill and accent bar in one group -->
<g>
  <rect x="109" y="208" width="870" height="408" rx="16" fill="#22303f" opacity=".12"/>
  <rect x="105" y="202" width="870" height="408" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
  <rect x="961" y="218" width="6" height="376" rx="3" fill="#2f7fb5"/>
</g>

<!-- Illustration: a break-in attempt caught before anything is stolen -->
<g>
  <defs>
    <linearGradient id="ilWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff1f7"/>
    </linearGradient>
    <linearGradient id="ilDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb5"/>
      <stop offset="1" stop-color="#17457f"/>
    </linearGradient>
    <linearGradient id="ilNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17457f"/>
      <stop offset="1" stop-color="#2f7fb5"/>
    </linearGradient>
  </defs>
  <!-- shadows -->
  <rect x="144" y="956" width="800" height="286" rx="18" fill="#22303f" opacity=".18"/>
  <rect x="184" y="1004" width="150" height="112" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="429" y="996" width="230" height="240" rx="6" fill="#22303f" opacity=".18"/>
  <polygon points="222,1194 286,1194 278,1238 230,1238" fill="#22303f" opacity=".18"/>
  <rect x="602" y="1148" width="60" height="50" rx="10" fill="#22303f" opacity=".18"/>
  <ellipse cx="774" cy="1172" rx="46" ry="32" fill="#22303f" opacity=".18"/>
  <!-- wall -->
  <rect x="140" y="950" width="800" height="286" rx="18" fill="url(#ilWall)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="142" y1="1010" x2="938" y2="1010" stroke="#8fc9f2" stroke-width="1.4" opacity=".35"/>
  <line x1="142" y1="1070" x2="938" y2="1070" stroke="#8fc9f2" stroke-width="1.4" opacity=".35"/>
  <line x1="142" y1="1130" x2="938" y2="1130" stroke="#8fc9f2" stroke-width="1.4" opacity=".35"/>
  <line x1="142" y1="1190" x2="938" y2="1190" stroke="#8fc9f2" stroke-width="1.4" opacity=".35"/>
  <!-- floor -->
  <rect x="120" y="1232" width="840" height="18" rx="8" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <!-- night window -->
  <rect x="180" y="998" width="150" height="112" rx="10" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="192" y="1010" width="126" height="88" rx="6" fill="url(#ilNight)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="288" cy="1036" r="14" fill="#ffd24a"/>
  <circle cx="296" cy="1031" r="12" fill="#17457f"/>
  <circle cx="214" cy="1030" r="2.5" fill="#ffffff"/>
  <circle cx="238" cy="1078" r="2.5" fill="#ffffff"/>
  <circle cx="226" cy="1046" r="2" fill="#ffffff"/>
  <circle cx="300" cy="1080" r="2.5" fill="#ffffff"/>
  <line x1="255" y1="1011" x2="255" y2="1097" stroke="#e8dfd1" stroke-width="2.5"/>
  <line x1="193" y1="1054" x2="317" y2="1054" stroke="#e8dfd1" stroke-width="2.5"/>
  <rect x="172" y="1104" width="166" height="12" rx="4" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <!-- plant -->
  <path d="M250 1182 C222 1172 218 1146 228 1132 C244 1146 254 1164 250 1182 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M250 1182 C278 1170 284 1146 274 1130 C258 1144 248 1164 250 1182 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M250 1182 C242 1160 244 1140 252 1128 C262 1144 260 1164 250 1182 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="218,1188 282,1188 274,1232 226,1232" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="212" y="1182" width="76" height="12" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <!-- alarm glow and flashing rays -->
  <circle cx="540" cy="950" r="44" fill="#c0392b" opacity=".12"/>
  <line x1="540" y1="914" x2="540" y2="904" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="506" y1="926" x2="496" y2="918" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="574" y1="926" x2="584" y2="918" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="496" y1="950" x2="484" y2="950" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="584" y1="950" x2="596" y2="950" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- alarm light -->
  <path d="M516 958 A24 24 0 0 1 564 958 Z" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="530" cy="948" rx="5" ry="7" fill="#ffffff" opacity=".6"/>
  <rect x="508" y="958" width="64" height="14" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <!-- door frame and door -->
  <rect x="425" y="990" width="230" height="246" rx="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="437" y="1002" width="206" height="234" rx="6" fill="url(#ilDoor)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="431" y="1030" width="10" height="26" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="431" y="1180" width="10" height="26" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="462" y="1124" width="112" height="92" rx="6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  <!-- window in the door with the untouched safe -->
  <rect x="472" y="1020" width="136" height="86" rx="8" fill="#e8dfd1"/>
  <rect x="474" y="1088" width="132" height="16" fill="#b07a45"/>
  <rect x="506" y="1036" width="68" height="56" rx="5" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <rect x="512" y="1042" width="56" height="44" rx="3" fill="none" stroke="#a9dcbe" stroke-width="1.4"/>
  <circle cx="532" cy="1064" r="11" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <line x1="532" y1="1064" x2="539" y2="1058" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="552" y="1056" width="6" height="16" rx="3" fill="#a9dcbe"/>
  <rect x="512" y="1092" width="10" height="6" fill="#22303f"/>
  <rect x="558" y="1092" width="10" height="6" fill="#22303f"/>
  <polygon points="480,1100 494,1026 504,1026 490,1100" fill="#ffffff" opacity=".35"/>
  <rect x="472" y="1020" width="136" height="86" rx="8" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <!-- hasp and yellow padlock -->
  <rect x="616" y="1112" width="22" height="66" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M606 1146 V1128 A21 21 0 0 1 648 1128 V1146 H639 V1128 A12 12 0 0 0 615 1128 V1146 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="598" y="1142" width="60" height="50" rx="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="606" y="1150" width="8" height="34" rx="4" fill="#ffffff" opacity=".6"/>
  <circle cx="628" cy="1162" r="5" fill="#22303f"/>
  <rect x="626" y="1162" width="4" height="14" rx="2" fill="#22303f"/>
  <!-- alert ticks: the attempt is caught -->
  <line x1="590" y1="1134" x2="580" y2="1124" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="586" y1="1152" x2="572" y2="1152" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="590" y1="1170" x2="580" y2="1180" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- thin picking tool -->
  <polygon points="628,1160 712,1155 712,1161 628,1164" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- gloved hand from the right -->
  <rect x="812" y="1136" width="116" height="62" rx="12" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="800" y="1130" width="24" height="74" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M802 1140 C780 1128 748 1130 730 1142 C722 1148 722 1170 732 1180 C748 1196 780 1198 802 1190 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="700" y="1146" width="46" height="14" rx="7" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="724" cy="1170" rx="16" ry="9" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M762 1150 Q 770 1162 762 1176" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- security camera watching the hand -->
  <g transform="rotate(18 900 1010)">
    <rect x="902" y="994" width="12" height="32" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
    <rect x="872" y="1006" width="32" height="8" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
    <rect x="800" y="994" width="74" height="32" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="782" y="998" width="22" height="24" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="790" cy="1010" r="6" fill="#4fc3e8"/>
    <circle cx="860" cy="1004" r="4" fill="#c0392b"/>
  </g>
</g>

<!-- Icon: open book, beside the English card header -->
<g transform="translate(134 242)">
  <path d="M24 10 C16 4 6 4 2 8 V40 C6 36 16 36 24 42 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M24 10 C32 4 42 4 46 8 V40 C42 36 32 36 24 42 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Face: surprise, beside the Arabic paragraph -->
<g transform="translate(200 700)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Icon: warning triangle, beside the English paragraph -->
<g transform="translate(735 797)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Icon: shield with keyhole, beside the English paragraph -->
<g transform="translate(850 795)">
  <path d="M28 2 L52 10 V28 C52 42 42 52 28 56 C14 52 4 42 4 28 V10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="28" cy="26" r="6" fill="#ffffff"/>
  <rect x="26" y="28" width="4" height="12" rx="2" fill="#ffffff"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">ما الحادث الأمني بالضبط؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">What Exactly Is a Security Incident?</text>

<!-- Info card headers -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف دقيق</text>
<text x="198" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">PRECISE DEFINITION</text>

<!-- Info card paragraph -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحادث الأمني:</tspan> حدث يهدد فعلًا</tspan>
  <tspan x="935" dy="40">أو بشكل وشيك <tspan font-weight="bold" fill="#17457f">سرية المعلومات</tspan> أو سلامتها</tspan>
  <tspan x="935" dy="40">أو توافرها، أو يخالف سياسة أمنية.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Security incident:</tspan> an event that</tspan>
  <tspan x="140" dy="40">actually or imminently threatens the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">confidentiality,</tspan> integrity, or</tspan>
  <tspan x="140" dy="40">availability of information, or</tspan>
  <tspan x="140" dy="40">violates a security policy.</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يعني: <tspan font-weight="bold" fill="#17457f">لا يشترط</tspan> أن يقع ضرر.</tspan>
  <tspan x="950" dy="40">محاولة اختراق اكتُشفت قبل أن تسرق شيئًا</tspan>
  <tspan x="950" dy="40">هي <tspan font-weight="bold" fill="#c0392b">حادث</tspan> أيضًا.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So harm is <tspan font-weight="bold" fill="#17457f">not required.</tspan></tspan>
  <tspan x="120" dy="40">A break-in attempt caught before it</tspan>
  <tspan x="120" dy="40">steals anything is also an <tspan font-weight="bold" fill="#c0392b">incident.</tspan></tspan>
</text>
</svg>
