<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">BEYOND THE BOOK</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحدث Event</tspan> هو أي شيء يقع في النظام،</tspan>
  <tspan x="935" dy="40">مثل تسجيل دخول أو تحديث. ولا يصير</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">حادثًا Incident</tspan> إلا إذا هدد الأمن.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">An <tspan font-weight="bold" fill="#c0392b">event</tspan> is anything that happens in</tspan>
  <tspan x="140" dy="40">a system, like a login or an update.</tspan>
  <tspan x="140" dy="40">It becomes an <tspan font-weight="bold" fill="#c0392b">incident</tspan> only if it</tspan>
  <tspan x="140" dy="40">threatens security.</tspan>
</text>
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: كتابة كلمة مرور خطأ مرة واحدة</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">حدث عادي،</tspan> أما مئات المحاولات</tspan>
  <tspan x="950" dy="40">الخاطئة في دقيقة فهي <tspan font-weight="bold" fill="#c0392b">حادث.</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: typing a wrong password once is</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#2e7d32">normal event,</tspan> but hundreds of wrong</tspan>
  <tspan x="120" dy="40">tries in one minute is an <tspan font-weight="bold" fill="#c0392b">incident.</tspan></tspan>
</text>
<text x="785" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#2e7d32">حدث</tspan></text>
<text x="712" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#2e7d32">Event</tspan></text>
<text x="359" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">حادث</tspan></text>
<text x="265" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Incident</tspan></text>
</svg>
