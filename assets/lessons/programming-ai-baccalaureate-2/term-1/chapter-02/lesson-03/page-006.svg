<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 <tspan font-weight="bold" fill="#c0392b">الاستئصال:</tspan> تغيّر الماسورة المكسورة،</tspan>
  <tspan x="950" dy="40">فهي <tspan font-weight="bold" fill="#17457f">السبب.</tspan></tspan>
</text>
<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 <tspan font-weight="bold" fill="#c0392b">Eradication:</tspan> you replace</tspan>
  <tspan x="132" dy="40">the broken pipe, because it is the <tspan font-weight="bold" fill="#17457f">cause.</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 <tspan font-weight="bold" fill="#c0392b">الاستعادة:</tspan> تجفف الأرض وتفتح المحبس،</tspan>
  <tspan x="950" dy="40">فيعود البيت <tspan font-weight="bold" fill="#2e7d32">طبيعيًا.</tspan></tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">5 <tspan font-weight="bold" fill="#c0392b">Recovery:</tspan> you dry the floor and open</tspan>
  <tspan x="132" dy="40">the valve; the home is <tspan font-weight="bold" fill="#2e7d32">normal</tspan> again.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">6 <tspan font-weight="bold" fill="#c0392b">الدروس المستفادة والتحسين:</tspan></tspan>
  <tspan x="950" dy="40">تسأل لماذا انكسرت، وتغيّر المواسير القديمة.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">6 <tspan font-weight="bold" fill="#c0392b">Lessons learned &amp; improvement:</tspan></tspan>
  <tspan x="132" dy="40">you ask why it broke and replace old pipes.</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">أغلق المحبس قبل أن تصلّح الماسورة،</tspan>
  <tspan x="935" dy="40">وصلّح الماسورة قبل أن تمسح الأرض.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Close the valve before you fix</tspan>
  <tspan x="140" dy="40">the pipe, and fix the pipe</tspan>
  <tspan x="140" dy="40">before you mop the floor.</tspan>
</text>
</svg>
