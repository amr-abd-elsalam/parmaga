<!-- Section 3 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">3 الاحتواء</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">3 Containment</tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نمنع <tspan font-weight="bold" fill="#17457f">الضرر</tspan> من الانتشار، حتى قبل أن نزيل سببه.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We stop the <tspan font-weight="bold" fill="#17457f">damage</tspan> from spreading,</tspan>
  <tspan x="120" dy="40">even before we remove its cause.</tspan>
</text>
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في المدرسة: <tspan font-weight="bold" fill="#2e7d32">نفصل</tspan> الأجهزة</tspan>
  <tspan x="950" dy="40">المصابة عن الشبكة فورًا.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">At school: we <tspan font-weight="bold" fill="#2e7d32">disconnect</tspan> the infected</tspan>
  <tspan x="132" dy="40">devices from the network at once.</tspan>
</text>

<!-- Section 4 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">4 الاستئصال</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">4 Eradication</tspan>
</text>
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نزيل <tspan font-weight="bold" fill="#17457f">السبب الجذري:</tspan> نحذف البرمجية الخبيثة</tspan>
  <tspan x="950" dy="40">ونسد الثغرة التي دخلت منها.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We remove the <tspan font-weight="bold" fill="#17457f">root cause:</tspan> delete</tspan>
  <tspan x="120" dy="40">the malware and close the gap it used.</tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في المدرسة: نحذف <tspan fill="#c96a1b">برنامج الفدية</tspan></tspan>
  <tspan x="950" dy="40">ونحدّث النظام الضعيف.</tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">At school: we delete the <tspan fill="#c96a1b">ransomware</tspan></tspan>
  <tspan x="132" dy="40">and update the weak system.</tspan>
</text>
</svg>
