<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">BEYOND THE BOOK</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لماذا <tspan font-weight="bold" fill="#c0392b">نضرب</tspan> ولا نجمع؟ إذا كانت</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الاحتمالية</tspan> صفرًا، أي أن الحدث مستحيل،</tspan>
  <tspan x="935" dy="40">فالضرب يعطي خطرًا = صفر، وهذا <tspan font-weight="bold" fill="#2e7d32">منطقي.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Why <tspan font-weight="bold" fill="#c0392b">multiply,</tspan> not add?</tspan>
  <tspan x="140" dy="40">If the <tspan font-weight="bold" fill="#17457f">likelihood</tspan> is zero, the event</tspan>
  <tspan x="140" dy="40">is impossible, so multiplying gives</tspan>
  <tspan x="140" dy="40">a risk of zero, which makes <tspan font-weight="bold" fill="#2e7d32">sense.</tspan></tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">أما <tspan font-weight="bold" fill="#c0392b">الجمع</tspan> فكان سيعطي رقمًا كبيرًا</tspan>
  <tspan x="935" dy="40">لشيء لن يحدث أبدًا.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Adding</tspan> would give a big number to</tspan>
  <tspan x="140" dy="40">something that will never happen.</tspan>
</text>

<text x="581" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">احتمالية صفر</text>
<text x="392" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Zero likelihood</text>
<text x="267" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">خطر صفر</text>
<text x="143" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Zero risk</text>
</svg>
