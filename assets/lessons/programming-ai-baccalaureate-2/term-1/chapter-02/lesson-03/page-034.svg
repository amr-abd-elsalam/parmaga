<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الخلاصة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Summary</text>

<!-- Paragraph 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحادث:</tspan> تهديد لسرية المعلومات أو سلامتها</tspan>
  <tspan x="935" dy="40">أو توافرها، وقع أو كاد يقع.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Incident:</tspan> a threat to</tspan>
  <tspan x="140" dy="40">confidentiality, integrity, or</tspan>
  <tspan x="140" dy="40">availability, done or imminent.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الاستجابة:</tspan> جهّز ← شوف ← اقفل ←</tspan>
  <tspan x="935" dy="40">شيل ← رجّع ← <tspan font-weight="bold" fill="#2e7d32">اتعلّم.</tspan></tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Response:</tspan> prepare → detect →</tspan>
  <tspan x="140" dy="40">contain → eradicate → recover → <tspan font-weight="bold" fill="#2e7d32">learn.</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخطر</tspan> = التأثير × الاحتمالية،</tspan>
  <tspan x="935" dy="40">ونبدأ <tspan font-weight="bold" fill="#17457f">بالأعلى.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Risk</tspan> = impact × likelihood,</tspan>
  <tspan x="140" dy="40">and we start with the <tspan font-weight="bold" fill="#17457f">highest.</tspan></tspan>
</text>
</svg>
