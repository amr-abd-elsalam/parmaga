<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قبل أن نبدأ</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Before We Begin</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أنك بنيت <tspan font-weight="bold" fill="#17457f">أقوى سور</tspan> حول بيتك.</tspan>
  <tspan x="950" dy="40">هل يعني ذلك أن اللص لن يحاول أبدًا؟</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine you built the <tspan font-weight="bold" fill="#17457f">strongest wall</tspan></tspan>
  <tspan x="120" dy="40">around your house. Does that mean</tspan>
  <tspan x="120" dy="40">a thief will never try?</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا توجد حماية تمنع كل الهجمات؛ لذلك تحتاج</tspan>
  <tspan x="950" dy="40">كل مؤسسة إلى <tspan font-weight="bold" fill="#c0392b">خطة</tspan> لما بعد وقوع <tspan font-weight="bold" fill="#17457f">الحادث.</tspan></tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No protection can stop every attack,</tspan>
  <tspan x="120" dy="40">so every organization needs <tspan font-weight="bold" fill="#c0392b">a plan</tspan></tspan>
  <tspan x="120" dy="40">for when an <tspan font-weight="bold" fill="#17457f">incident</tspan> happens.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">في هذا الدرس فكرتان فقط:</tspan>
  <tspan x="935" dy="40"><tspan fill="#c0392b">رتّب</tspan> تصرفك، وابدأ <tspan fill="#c0392b">بالأخطر.</tspan></tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">This lesson has only two ideas:</tspan>
  <tspan x="140" dy="40">act <tspan fill="#c0392b">in order,</tspan> and start with</tspan>
  <tspan x="140" dy="40">the <tspan fill="#c0392b">most dangerous.</tspan></tspan>
</text>
</svg>
