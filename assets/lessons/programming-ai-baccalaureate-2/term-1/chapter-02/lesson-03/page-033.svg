<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">فخ الامتحان</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">EXAM TRAP</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«يجب معالجة كل <tspan font-weight="bold" fill="#c0392b">المخاطر</tspan> في وقت واحد.»</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"All <tspan font-weight="bold" fill="#c0392b">risks</tspan> must be fixed</tspan>
  <tspan x="140" dy="40">at the same time."</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الحقيقة: <tspan font-weight="bold" fill="#17457f">الموارد محدودة،</tspan></tspan>
  <tspan x="935" dy="40">ومن يعالج كل شيء معًا لا ينهي شيئًا.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The truth: <tspan font-weight="bold" fill="#17457f">resources are limited;</tspan></tspan>
  <tspan x="140" dy="40">whoever fixes everything at once</tspan>
  <tspan x="140" dy="40">finishes nothing.</tspan>
</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">في الامتحان <tspan fill="#c0392b">رتّب،</tspan></tspan>
  <tspan x="935" dy="40">وفي الواقع <tspan fill="#c0392b">افهم</tspan> لماذا رتّبت.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">In the exam, put them in <tspan fill="#c0392b">order;</tspan></tspan>
  <tspan x="140" dy="40">in real life, <tspan fill="#c0392b">understand</tspan> why you did.</tspan>
</text>
</svg>
