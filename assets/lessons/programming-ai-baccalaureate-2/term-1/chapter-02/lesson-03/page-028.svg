<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">BEYOND THE BOOK</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">درجتان متساويتان</tspan> لا تعنيان قرارًا</tspan>
  <tspan x="935" dy="40">واحدًا: النيزك <tspan fill="#c96a1b">(3 × 1)</tspan> وكلمة المرور</tspan>
  <tspan x="935" dy="40">المنسية <tspan fill="#c96a1b">(1 × 3)</tspan> درجتهما 3.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Equal scores</tspan> do not mean the same</tspan>
  <tspan x="140" dy="40">decision: the meteor <tspan fill="#c96a1b">(3 × 1)</tspan> and the</tspan>
  <tspan x="140" dy="40">forgotten password <tspan fill="#c96a1b">(1 × 3)</tspan> both</tspan>
  <tspan x="140" dy="40">score 3.</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لكن ضرر الأول <tspan font-weight="bold" fill="#17457f">كارثي</tspan> إن وقع،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">فالسياق والضوابط المتاحة</tspan> هي التي تحسم.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">But the first is a <tspan font-weight="bold" fill="#17457f">disaster</tspan> if it</tspan>
  <tspan x="140" dy="40">happens, so the <tspan font-weight="bold" fill="#17457f">context</tspan> and</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">available controls</tspan> decide.</tspan>
</text>
</svg>
