<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الإجابة الذكية:</tspan> أغلق المحبس أولًا.</tspan>
  <tspan x="950" dy="40">والآن لاحظ كيف تتحول القصة إلى <tspan font-weight="bold" fill="#c0392b">ست خطوات:</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">The smart answer:</tspan> close the valve first.</tspan>
  <tspan x="120" dy="40">Now see how the story becomes <tspan font-weight="bold" fill="#c0392b">six steps:</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">التحضير:</tspan> تعرف مكان المحبس قبل أي مشكلة.</tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">Preparation:</tspan> you know where</tspan>
  <tspan x="132" dy="40">the valve is before any problem.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 <tspan font-weight="bold" fill="#c0392b">الاكتشاف:</tspan> تتأكد أنه تسريب،</tspan>
  <tspan x="950" dy="40">لا كوب ماء انسكب.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 <tspan font-weight="bold" fill="#c0392b">Detection:</tspan> you make sure it is</tspan>
  <tspan x="132" dy="40">a leak, not a spilled glass of water.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 <tspan font-weight="bold" fill="#c0392b">الاحتواء:</tspan> تغلق المحبس حتى لا يصل</tspan>
  <tspan x="950" dy="40">الماء إلى باقي الشقة.</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 <tspan font-weight="bold" fill="#c0392b">Containment:</tspan> you close the valve</tspan>
  <tspan x="132" dy="40">so the water cannot reach the rest</tspan>
  <tspan x="132" dy="40">of the flat.</tspan>
</text>
</svg>
