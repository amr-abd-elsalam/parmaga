<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">ماذا ستتعلم في هذا الدرس؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">What will you learn in this lesson?</tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أن تعرف بدقة متى نسمّي</tspan>
  <tspan x="950" dy="40">ما حدث <tspan font-weight="bold" fill="#c0392b">«حادثًا أمنيًا».</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">To know exactly when we call something</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#c0392b">"security incident".</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أن ترتّب <tspan font-weight="bold" fill="#17457f">مراحل الاستجابة</tspan> الست</tspan>
  <tspan x="950" dy="40">وتعرف سبب كل خطوة.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">To order the six <tspan font-weight="bold" fill="#17457f">response stages</tspan></tspan>
  <tspan x="120" dy="40">and know the reason for each.</tspan>
</text>

<!-- Bullet 3 -->
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أن تقيس <tspan font-weight="bold" fill="#c0392b">الخطر</tspan> <tspan font-weight="bold" fill="#17457f">بالتأثير × الاحتمالية</tspan></tspan>
  <tspan x="950" dy="40">وتقرر ما يُعالج أولًا.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">To measure <tspan font-weight="bold" fill="#c0392b">risk</tspan> by <tspan font-weight="bold" fill="#17457f">impact × likelihood</tspan></tspan>
  <tspan x="120" dy="40">and decide what to fix first.</tspan>
</text>

<!-- Bullet 4 -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أن تصمم <tspan font-weight="bold" fill="#17457f">استجابة</tspan> لحادث حقيقي</tspan>
  <tspan x="950" dy="40">وتبرر كل قرار فيها.</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">To design a <tspan font-weight="bold" fill="#17457f">response</tspan> to a real incident</tspan>
  <tspan x="120" dy="40">and justify every decision in it.</tspan>
</text>
</svg>
