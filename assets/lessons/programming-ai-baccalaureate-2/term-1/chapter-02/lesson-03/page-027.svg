<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المصفوفة</tspan> هي <tspan font-weight="bold" fill="#17457f">المعادلة</tspan> نفسها مرسومة:</tspan>
  <tspan x="950" dy="40">التأثير على محور، والاحتمالية على محور.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">matrix</tspan> is the same <tspan font-weight="bold" fill="#17457f">formula</tspan> drawn:</tspan>
  <tspan x="120" dy="40">impact on one axis,</tspan>
  <tspan x="120" dy="40">likelihood on the other.</tspan>
</text>

<!-- Illustration labels: formula -->
<text x="864" y="372" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#c0392b">الخطر</tspan><tspan> = التأثير × الاحتمالية</tspan></text>
<text x="462" y="406" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#c0392b">Risk</tspan><tspan> = Impact × Likelihood</tspan></text>

<!-- Illustration labels: impact axis -->
<text x="236" y="570" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">التأثير</text>
<text x="120" y="608" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Impact</text>

