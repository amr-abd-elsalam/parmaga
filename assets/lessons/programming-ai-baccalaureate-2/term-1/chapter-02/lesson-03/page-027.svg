<text x="860" y="850" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الاحتمالية</text>
<text x="480" y="850" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Likelihood</text>

<!-- Caption -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">مصفوفة تقييم المخاطر</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Risk Evaluation Matrix</text>

<!-- Paragraph 2 -->
<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اقرأها: الخانة الحمراء <tspan font-weight="bold" fill="#c0392b">«حرج»</tspan> حيث يلتقي</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">التأثير العالي</tspan> بالاحتمالية العالية.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Read it: the red <tspan font-weight="bold" fill="#c0392b">"Critical"</tspan> cell is</tspan>
  <tspan x="120" dy="40">where <tspan font-weight="bold" fill="#17457f">high impact</tspan> meets high likelihood.</tspan>
</text>
