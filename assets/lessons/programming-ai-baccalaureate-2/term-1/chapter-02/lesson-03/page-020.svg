<g transform="translate(860 694)">
  <path d="M28 2 Q42 7 52 9 L52 28 Q52 46 28 54 Q4 46 4 28 L4 9 Q14 7 28 2 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
