<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النسخة الاحتياطية السليمة</tspan> Clean Backup:</tspan>
  <tspan x="935" dy="40">نسخة أُخذت قبل الإصابة،</tspan>
  <tspan x="935" dy="40">ونتأكد أنها <tspan font-weight="bold" fill="#2e7d32">خالية منها.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Clean backup:</tspan> a copy taken</tspan>
  <tspan x="140" dy="40">before the infection and checked</tspan>
  <tspan x="140" dy="40">to be <tspan font-weight="bold" fill="#2e7d32">free of it.</tspan></tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الضوابط الوقائية</tspan> Preventive Controls:</tspan>
  <tspan x="935" dy="40">إجراءات تمنع الحادث قبل وقوعه، مثل</tspan>
  <tspan x="935" dy="40">التحديثات وكلمات المرور القوية.</tspan>
  <tspan x="935" dy="40">وكل حادث ينبغي أن ينتهي <tspan font-weight="bold" fill="#17457f">بضابط أقوى.</tspan></tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Preventive controls:</tspan> measures that</tspan>
  <tspan x="140" dy="40">stop an incident before it happens,</tspan>
  <tspan x="140" dy="40">like updates and strong passwords.</tspan>
  <tspan x="140" dy="40">Every incident should end with a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">stronger control.</tspan></tspan>
</text>
</svg>
