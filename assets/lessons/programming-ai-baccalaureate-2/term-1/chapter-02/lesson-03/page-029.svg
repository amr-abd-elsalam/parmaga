<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">تذكّر في الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Remember in the Exam</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المراحل الست بالإنجليزية</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The six stages in English</text>

<text x="140" y="374" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">People Don't Click Every <tspan font-weight="bold" fill="#c0392b">Random Link</tspan></text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">كل حرف أول</tspan> مرحلة: P التحضير، D الاكتشاف،</tspan>
  <tspan x="950" dy="40"> C الاحتواء، E الاستئصال، R الاستعادة،</tspan>
  <tspan x="950" dy="40"> L الدروس المستفادة.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Each first letter</tspan> is a stage:</tspan>
  <tspan x="120" dy="40">P Preparation, D Detection,</tspan>
  <tspan x="120" dy="40">C Containment, E Eradication,</tspan>
  <tspan x="120" dy="40">R Recovery, L Lessons learned.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">والجملة نفسها <tspan font-weight="bold" fill="#2e7d32">نصيحة أمنية:</tspan></tspan>
  <tspan x="950" dy="40">الناس العاقلة لا تضغط على أي <tspan font-weight="bold" fill="#c0392b">رابط عشوائي.</tspan></tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">The sentence is also <tspan font-weight="bold" fill="#2e7d32">security advice:</tspan></tspan>
  <tspan x="120" dy="40">wise people don't click <tspan font-weight="bold" fill="#c0392b">random links.</tspan></tspan>
</text>
</svg>
