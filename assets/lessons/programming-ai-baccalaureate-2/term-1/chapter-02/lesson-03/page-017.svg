<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">BEYOND THE BOOK</tspan>
</text>

<!-- Paragraph 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">المراحل الست <tspan font-weight="bold" fill="#17457f">خريطة للاتجاه،</tspan></tspan>
  <tspan x="935" dy="40">لكن الاستجابة الحقيقية قد <tspan font-weight="bold" fill="#c0392b">ترجع خطوة.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The six stages <tspan font-weight="bold" fill="#17457f">map the direction,</tspan></tspan>
  <tspan x="140" dy="40">but a real response may <tspan font-weight="bold" fill="#c0392b">step back.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مثال: أثناء <tspan fill="#c96a1b">الاستعادة</tspan> تكتشف</tspan>
  <tspan x="935" dy="40">أن الفيروس ما زال موجودًا،</tspan>
  <tspan x="935" dy="40">فتعود إلى <tspan font-weight="bold" fill="#17457f">الاحتواء والاستئصال.</tspan></tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Example: during <tspan fill="#c96a1b">recovery</tspan> you find</tspan>
  <tspan x="140" dy="40">the virus is still there, so you go</tspan>
  <tspan x="140" dy="40">back to <tspan font-weight="bold" fill="#17457f">containment and eradication.</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ولهذا يجمع دليل <tspan font-weight="bold" fill="#c0392b">NIST</tspan> الشهير الاحتواء</tspan>
  <tspan x="935" dy="40">والاستئصال والاستعادة في <tspan font-weight="bold" fill="#17457f">مرحلة واحدة.</tspan></tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">That is why the well-known <tspan font-weight="bold" fill="#c0392b">NIST</tspan> guide</tspan>
  <tspan x="140" dy="40">groups containment, eradication,</tspan>
  <tspan x="140" dy="40">and recovery into <tspan font-weight="bold" fill="#17457f">one phase.</tspan></tspan>
</text>
</svg>
