  <tspan x="606" dy="0">برنامج الفدية</tspan>
</text>
<text x="469" y="1106" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">
