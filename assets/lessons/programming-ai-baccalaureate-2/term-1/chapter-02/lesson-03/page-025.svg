<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لنحسب: أعطِ كل <tspan font-weight="bold" fill="#c0392b">عامل</tspan> <tspan font-weight="bold" fill="#17457f">درجة</tspan> من 1 إلى 3.</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Let's calculate: give each <tspan font-weight="bold" fill="#c0392b">factor</tspan></tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">score</tspan> from 1 to 3.</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">النيزك: 3 × 1 = 3</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Meteor: 3 × 1 = 3</tspan>
</text>
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كلمة المرور المنسية: 1 × 3 = 3</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Forgotten password: 1 × 3 = 3</tspan>
</text>
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">برنامج الفدية: 3 × 3 = 9 — الأولوية الأولى</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Ransomware: 3 × 3 = 9 — top priority</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الأخطر ليس الأفظع ولا الأكثر حدوثًا؛</tspan>
  <tspan x="935" dy="40">الأخطر هو ما يجمع الاثنين.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The most dangerous is not the scariest</tspan>
  <tspan x="140" dy="40">or the most frequent; it is the one</tspan>
  <tspan x="140" dy="40">that combines both.</tspan>
</text>

<!-- Illustration labels (Layout order) -->
