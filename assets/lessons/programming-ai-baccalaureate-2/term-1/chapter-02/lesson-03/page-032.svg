  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">فخاخ الامتحان</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">EXAM TRAPS</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«فصل الجهاز عن الشبكة = استئصال.»</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Disconnecting the device =</tspan>
  <tspan x="140" dy="40">eradication."</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الحقيقة: هذا <tspan font-weight="bold" fill="#2e7d32">احتواء؛</tspan> الفيروس ما زال</tspan>
  <tspan x="935" dy="40">على الجهاز، لكنه معزول.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The truth: that is <tspan font-weight="bold" fill="#2e7d32">containment;</tspan></tspan>
  <tspan x="140" dy="40">the virus is still on the device,</tspan>
  <tspan x="140" dy="40">only isolated.</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«حجم الخطر يُحدد <tspan font-weight="bold" fill="#17457f">بالتأثير</tspan> وحده.»</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Risk size is set by <tspan font-weight="bold" fill="#17457f">impact</tspan> alone."</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الحقيقة: تذكّر <tspan fill="#c96a1b">النيزك؛</tspan> تأثيره كارثي،</tspan>
  <tspan x="935" dy="40">ومع ذلك ليس <tspan font-weight="bold" fill="#17457f">الأولوية.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The truth: remember the <tspan fill="#c96a1b">meteor;</tspan></tspan>
  <tspan x="140" dy="40">its impact is a disaster,</tspan>
  <tspan x="140" dy="40">yet it is not the <tspan font-weight="bold" fill="#17457f">priority.</tspan></tspan>
</text>
</svg>
