  <circle cx="40" cy="40" r="7" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
</g>
<g transform="translate(516 1186)">
  <path d="M 24 2 L 44 10 L 44 24 C 44 36 36 44 24 48 C 12 44 4 36 4 24 L 4 10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
