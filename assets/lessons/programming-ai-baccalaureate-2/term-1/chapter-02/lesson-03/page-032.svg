<g transform="translate(396 1186)">
  <line x1="8" y1="40" x2="24" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="40" x2="24" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
