  <line x1="511" y1="1002" x2="494" y2="1002" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="514" y1="1020" x2="498" y2="1032" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="566" y1="984" x2="582" y2="974" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="569" y1="1002" x2="586" y2="1002" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="566" y1="1020" x2="582" y2="1032" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="540" cy="1004" rx="30" ry="34" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <line x1="540" y1="972" x2="540" y2="1036" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="526" cy="994" r="4.5" fill="#22303f"/>
  <circle cx="554" cy="1010" r="4.5" fill="#22303f"/>
  <circle cx="528" cy="1020" r="3.5" fill="#22303f"/>
  <circle cx="553" cy="989" r="3" fill="#22303f"/>
  <circle cx="540" cy="962" r="15" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="534" cy="959" r="4.5" fill="#ffffff"/>
  <circle cx="546" cy="959" r="4.5" fill="#ffffff"/>
  <circle cx="535" cy="960" r="2" fill="#22303f"/>
  <circle cx="547" cy="960" r="2" fill="#22303f"/>

  <polygon points="592,986 592,1014 728,1002 728,930" fill="#4fc3e8" opacity=".35"/>
  <g transform="translate(838 1008) rotate(-45)">
    <rect x="-12" y="0" width="24" height="100" rx="11" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-12" y="0" width="24" height="18" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="790" cy="960" r="64" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="790" cy="960" r="48" fill="url(#ilLens)" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 760 936 Q 770 918 788 916" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="808" cy="986" r="5" fill="#ffffff" opacity=".85"/>
</g>

<!-- Header icon: warning triangle -->
<g transform="translate(400 156)">
  <polygon points="26,2 50,46 2,46" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="23" y="15" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="26" cy="39" r="3.5" fill="#22303f"/>
</g>

<!-- In-card icon: lock (containment) -->
<g transform="translate(820 446)">
  <path d="M 18 30 L 18 20 Q 18 6 32 6 Q 46 6 46 20 L 46 30" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="10" y="28" width="44" height="32" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="41" r="5" fill="#22303f"/>
  <rect x="30" y="42" width="4" height="10" rx="2" fill="#22303f"/>
</g>

<!-- In-card icon: meteor -->
<g transform="translate(820 762)">
  <path d="M 12 34 L 60 4 L 30 54 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="44" r="15" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="15" cy="40" r="3.5" fill="#f0c48c"/>
  <circle cx="25" cy="49" r="3" fill="#f0c48c"/>
</g>

