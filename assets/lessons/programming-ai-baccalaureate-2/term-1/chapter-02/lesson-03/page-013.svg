<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">1 التحضير</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">1 Preparation</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نجهّز الخطة والفريق والأدوات</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والنسخ الاحتياطية</tspan> قبل أي حادث.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We prepare the plan, the team, the tools,</tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">backups</tspan> before any incident.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في المدرسة: نسخ احتياطية <tspan fill="#c96a1b">أسبوعية،</tspan></tspan>
  <tspan x="950" dy="40">وقائمة بمن نتصل به.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">At school: <tspan fill="#c96a1b">weekly</tspan> backups</tspan>
  <tspan x="132" dy="40">and a list of who to call.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">2 الاكتشاف</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">2 Detection</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نلاحظ العلامات، ثم نتأكد أنها</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">حادث حقيقي</tspan> ونحدد نوعه.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We notice the signs, then confirm it is</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">real incident</tspan> and identify its type.</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في المدرسة: الملفات لا تُفتح،</tspan>
  <tspan x="950" dy="40">والموظفون لا يستطيعون الدخول.</tspan>
</text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">At school: files will not open</tspan>
  <tspan x="132" dy="40">and staff cannot log in.</tspan>
</text>
</svg>
