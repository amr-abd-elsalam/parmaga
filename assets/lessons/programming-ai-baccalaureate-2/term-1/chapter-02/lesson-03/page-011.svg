  <path d="M32 10 L10 48 L54 48 Z" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="10" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
