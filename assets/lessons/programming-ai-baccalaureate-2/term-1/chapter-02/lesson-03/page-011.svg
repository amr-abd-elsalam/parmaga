<!-- Icon: light bulb (notice / insight) -->
<g transform="translate(250 94)">
  <path d="M22 2 V0 M4 10 L1 7 M40 10 L43 7" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
