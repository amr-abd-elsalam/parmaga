  <path d="M16 24 Q22 16 28 24" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="15" y="38" width="14" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

