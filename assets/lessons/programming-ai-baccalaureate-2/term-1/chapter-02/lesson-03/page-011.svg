<g transform="translate(850 870)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لاحظ: أنواع الحوادث الثلاثة تقابل</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الثلاثي</tspan> نفسه بالترتيب.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Notice: the three incident types match</tspan>
  <tspan x="120" dy="40">the same <tspan font-weight="bold" fill="#17457f">triad</tspan>, in order.</tspan>
</text>

<!-- Bullets text -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تسرب المعلومات ← يضرب <tspan font-weight="bold" fill="#17457f">السرية.</tspan></text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Information leak → hits <tspan font-weight="bold" fill="#17457f">confidentiality.</tspan></text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">التلاعب بالبيانات ← يضرب <tspan font-weight="bold" fill="#17457f">السلامة.</tspan></text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Data tampering → hits <tspan font-weight="bold" fill="#17457f">integrity.</tspan></text>
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">انقطاع الخدمة ← يضرب <tspan font-weight="bold" fill="#17457f">التوافر.</tspan></text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Service outage → hits <tspan font-weight="bold" fill="#17457f">availability.</tspan></text>

<!-- Warning card text -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">في الامتحان</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">FOR THE EXAM</text>
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">صياغة مبسطة قد تقابلك:</tspan>
  <tspan x="935" dy="40">«موقف يقع فيه <tspan font-weight="bold" fill="#c0392b">ضرر</tspan> فعلي». احفظها،</tspan>
  <tspan x="935" dy="40">وافهم <tspan font-weight="bold" fill="#17457f">المعنى الأوسع.</tspan></tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A simple wording you may meet:</tspan>
  <tspan x="140" dy="40">"a situation where actual <tspan font-weight="bold" fill="#c0392b">damage</tspan></tspan>
  <tspan x="140" dy="40">occurs". Know it;</tspan>
  <tspan x="140" dy="40">grasp the <tspan font-weight="bold" fill="#17457f">wider idea.</tspan></tspan>
</text>
</svg>
