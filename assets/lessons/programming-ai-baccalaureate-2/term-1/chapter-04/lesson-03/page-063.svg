<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 1: الكمي وحدوده</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 1: Quantitative and Its Limit</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التقييم الكمي</tspan> يستخدم <tspan font-weight="bold" fill="#17457f">بيانات عددية</tspan> مثل PV</tspan>
  <tspan x="950" dy="40">ومعدل التحويل، ويغطي أعدادًا كبيرة</tspan>
  <tspan x="950" dy="40">من المستخدمين، ويبيّن ما يحدث ومقداره،</tspan>
  <tspan x="950" dy="40">لكنه <tspan font-weight="bold" fill="#17457f">لا يفسّر</tspan> سبب سلوك المستخدمين.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Quantitative evaluation</tspan> uses</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">numerical data</tspan> such as PV and the</tspan>
  <tspan x="120" dy="40">conversion rate; it covers large numbers</tspan>
  <tspan x="120" dy="40">of users and shows what is happening</tspan>
  <tspan x="120" dy="40">and how much, but it <tspan font-weight="bold" fill="#17457f">does not explain</tspan></tspan>
  <tspan x="120" dy="40">the reason for users' behavior.</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 2: النوعي وحدوده</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 2: Qualitative and Its Limit</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التقييم النوعي،</tspan> مثل اختبار قابلية الاستخدام</tspan>
  <tspan x="950" dy="40">والمقابلات، يكشف <tspan font-weight="bold" fill="#17457f">الأسباب</tspan> وتجربة المستخدم،</tspan>
  <tspan x="950" dy="40">لكنه يعتمد على <tspan font-weight="bold" fill="#17457f">عدد قليل</tspan> من الأشخاص،</tspan>
  <tspan x="950" dy="40">فلا يمثّل الجميع بالضرورة.</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Qualitative evaluation,</tspan> such as</tspan>
  <tspan x="120" dy="40">usability testing and interviews, reveals</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">reasons</tspan> and the user experience,</tspan>
  <tspan x="120" dy="40">but it relies on a <tspan font-weight="bold" fill="#17457f">small number</tspan></tspan>
  <tspan x="120" dy="40">of people, so it does not necessarily</tspan>
  <tspan x="120" dy="40">represent everyone.</tspan>
</text>
</svg>
