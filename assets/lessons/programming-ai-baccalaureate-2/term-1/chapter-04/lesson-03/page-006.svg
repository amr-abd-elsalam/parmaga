<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">ما قرأته منى في لوحة التحليلات</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">What Mona Read</tspan>
  <tspan x="120" dy="40">on the Analytics Dashboard</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الصفحة الرئيسية فُتحت <tspan fill="#c96a1b">5000</tspan> مرة.</tspan>
</text>

<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The home page was opened <tspan fill="#c96a1b">5000</tspan> times.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">&#x200F;%60</tspan> من الزيارات <tspan font-weight="bold" fill="#c0392b">خرجت</tspan> بعد أول صفحة.</tspan>
</text>

<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan fill="#c96a1b">60%</tspan> of visits <tspan font-weight="bold" fill="#c0392b">left</tspan> after the first page.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">من كل <tspan fill="#c96a1b">100</tspan> زيارة،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">زيارة واحدة فقط</tspan> انتهت بطلب.</tspan>
</text>

<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Out of every <tspan fill="#c96a1b">100</tspan> visits,</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">only one</tspan> ended with an order.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكن عندما سألها عمّ حسن:</tspan>
  <tspan x="950" dy="40">«ليه <tspan font-weight="bold" fill="#17457f">الناس</tspan> بتمشي؟» قالت:</tspan>
  <tspan x="950" dy="40">«معرفش، <tspan font-weight="bold" fill="#c0392b">الأرقام</tspan> مبتتكلمش!»</tspan>
</text>

<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But when Uncle Hassan asked her,</tspan>
  <tspan x="120" dy="40">“Why do <tspan font-weight="bold" fill="#17457f">people</tspan> leave?”, she said:</tspan>
  <tspan x="120" dy="40">“I don't know; <tspan font-weight="bold" fill="#c0392b">numbers</tspan> don't talk!”</tspan>
</text>
</svg>
