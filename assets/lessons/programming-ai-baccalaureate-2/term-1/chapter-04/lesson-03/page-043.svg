<!-- Example 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال 1:</tspan> دخل <tspan fill="#c96a1b">3 طلاب</tspan> موقع المدرسة:</tspan>
  <tspan x="950" dy="40">فتح الأول 5 صفحات، والثاني صفحتين،</tspan>
  <tspan x="950" dy="40">والثالث صفحة واحدة ثم خرج.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example 1:</tspan> <tspan fill="#c96a1b">3 students</tspan> visited the school</tspan>
  <tspan x="120" dy="40">website: the first opened 5 pages,</tspan>
  <tspan x="120" dy="40">the second 2 pages, and the third</tspan>
  <tspan x="120" dy="40">one page and then left.</tspan>
</text>

<!-- Main idea box text -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#17457f">PV = 5 + 2 + 1 = 8 ،</tspan> وعدد الأشخاص = 3</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">PV = 5 + 2 + 1 = 8,</tspan></tspan>
  <tspan x="140" dy="40">and the number of people = 3</tspan>
</text>

<!-- Outlined box: pause and think -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّف وفكّر</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PAUSE &amp; THINK</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">قال المدير: «عندنا 8 زوار».</tspan>
  <tspan x="935" dy="40">هل كلامه صحيح؟ ولماذا؟</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The principal said:</tspan>
  <tspan x="140" dy="40">“We have 8 visitors.”</tspan>
  <tspan x="140" dy="40">Is he right? Why?</tspan>
</text>
