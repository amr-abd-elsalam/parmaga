<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> أسلوب لتحليل كيفية الوصول</tspan>
  <tspan x="950" dy="40">إلى الموقع باستخدام القيم العددية، وهو</tspan>
  <tspan x="950" dy="40">الطريقة المحورية <tspan font-weight="bold" fill="#c0392b">للتقييم الكمي</tspan> للمواقع.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> a technique for</tspan>
  <tspan x="120" dy="40">analyzing how a website is accessed</tspan>
  <tspan x="120" dy="40">using numerical values; it is the</tspan>
  <tspan x="120" dy="40">central method of <tspan font-weight="bold" fill="#c0392b">quantitative</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">evaluation</tspan> for websites.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">كيف تعمل؟</tspan> يوضع <tspan font-weight="bold" fill="#c0392b">كود صغير</tspan> داخل صفحات الموقع،</tspan>
  <tspan x="950" dy="40">فيسجّل تلقائيًا كل فتح لصفحة</tspan>
  <tspan x="950" dy="40">وكل ضغطة على زر.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">How does it work?</tspan> A small piece of <tspan font-weight="bold" fill="#c0392b">code</tspan></tspan>
  <tspan x="120" dy="40">is placed in the site's pages, and it</tspan>
  <tspan x="120" dy="40">automatically records every page opening</tspan>
  <tspan x="120" dy="40">and every button click.</tspan>
</text>

<!-- Warning card texts -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تنبيه مهم:</tspan> أسماء المقاييس وطرق حسابها</tspan>
  <tspan x="935" dy="40">تختلف من أداة لأخرى،</tspan>
  <tspan x="935" dy="40">فاقرأ دائمًا <tspan font-weight="bold" fill="#17457f">تعريف الأداة</tspan> التي تستخدمها.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Important:</tspan> metric names and</tspan>
  <tspan x="140" dy="40">calculation methods differ from</tspan>
  <tspan x="140" dy="40">tool to tool, so always read the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">definition</tspan> of the tool you use.</tspan>
</text>
</svg>
