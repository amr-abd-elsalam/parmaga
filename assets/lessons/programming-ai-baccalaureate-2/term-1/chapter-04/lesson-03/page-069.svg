<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">كارت الملخص</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">Summary Card</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تقييم المواقع</tspan> = <tspan font-weight="bold" fill="#17457f">أدلة</tspan> من أكثر من مصدر.</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Website evaluation</tspan> = <tspan font-weight="bold" fill="#17457f">evidence</tspan></tspan>
  <tspan x="140" dy="40">from more than one source.</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">كمي</tspan> = <tspan font-weight="bold" fill="#17457f">كم؟</tspan> <tspan fill="#c96a1b">تحليلات الويب</tspan> واختبار A/B،</tspan>
  <tspan x="935" dy="40">وأهم مؤشراته PV ومعدل الارتداد وCVR.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Quantitative</tspan> = <tspan font-weight="bold" fill="#17457f">how much?</tspan></tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">Web analytics</tspan> and A/B testing;</tspan>
  <tspan x="140" dy="40">its key indicators are PV,</tspan>
  <tspan x="140" dy="40">bounce rate, and CVR.</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">نوعي</tspan> = <tspan font-weight="bold" fill="#17457f">لماذا؟</tspan> اختبار قابلية الاستخدام،</tspan>
  <tspan x="935" dy="40">والمقابلات، والتقييم الإرشادي.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Qualitative</tspan> = <tspan font-weight="bold" fill="#17457f">why?</tspan></tspan>
  <tspan x="140" dy="40">Usability testing, interviews,</tspan>
  <tspan x="140" dy="40">and heuristic evaluation.</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">القاعدة الذهبية:</tspan> الأرقام تقول</tspan>
  <tspan x="935" dy="40">أين المشكلة، والناس يقولون لماذا،</tspan>
  <tspan x="935" dy="40">والجمع بينهما يعطي <tspan font-weight="bold" fill="#2e7d32">الصورة الكاملة.</tspan></tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Golden rule:</tspan> numbers tell where</tspan>
  <tspan x="140" dy="40">the problem is, people tell why,</tspan>
  <tspan x="140" dy="40">and combining both gives</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#2e7d32">full picture.</tspan></tspan>
</text>
</svg>
