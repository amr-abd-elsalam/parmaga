<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">التقييم الإرشادي</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Heuristic Evaluation</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">التقييم الإرشادي</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Heuristic Evaluation</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التقييم الإرشادي</tspan> Heuristic Evaluation:</tspan>
  <tspan x="935" dy="40">يراجع فيه خبراء واجهة المستخدم ويقارنونها</tspan>
  <tspan x="935" dy="40">بقائمة من <tspan font-weight="bold" fill="#17457f">القواعد العملية</tspan> المعروفة،</tspan>
  <tspan x="935" dy="40">لاكتشاف مشكلات <tspan font-weight="bold" fill="#17457f">قابلية الاستخدام</tspan></tspan>
  <tspan x="935" dy="40">دون مشاركة مستخدمين.</tspan>
</text>

<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Heuristic evaluation:</tspan> experts review</tspan>
  <tspan x="140" dy="40">the user interface and compare it</tspan>
  <tspan x="140" dy="40">with a list of well-known</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">practical rules</tspan> to find <tspan font-weight="bold" fill="#17457f">usability</tspan></tspan>
  <tspan x="140" dy="40">problems, without involving users.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">هذه هي <tspan font-weight="bold" fill="#17457f">أداة سارة</tspan><tspan> في القصة.</tspan></text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">This is <tspan font-weight="bold" fill="#17457f">Sara's tool</tspan><tspan> in the story.</tspan></text>
</svg>
