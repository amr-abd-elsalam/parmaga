<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">تحليلات الويب</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Web Analytics</text>

<!-- Intro paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الآن ننتقل إلى أدوات منى:</tspan>
  <tspan x="950" dy="40">طرق نعرف بها <tspan font-weight="bold" fill="#17457f">«كم»</tspan> من الأرقام.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Now we move to Mona's tools: ways to</tspan>
  <tspan x="120" dy="40">learn the <tspan font-weight="bold" fill="#17457f">“how much”</tspan> from numbers.</tspan>
</text>

<!-- Info card texts -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تحليلات الويب</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Web Analytics</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تحليلات الويب</tspan> Web Analytics: جمع بيانات</tspan>
  <tspan x="935" dy="40">استخدام الموقع وقياسها وتحليلها <tspan font-weight="bold" fill="#17457f">بالأرقام،</tspan></tspan>
  <tspan x="935" dy="40">لفهم كيف يصل الناس إلى الموقع، وكيف</tspan>
  <tspan x="935" dy="40">يتفاعلون معه، وما النتائج التي يحققونها.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Web analytics:</tspan> collecting, measuring,</tspan>
  <tspan x="140" dy="40">and analyzing site usage data with</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">numbers</tspan> to understand how people</tspan>
  <tspan x="140" dy="40">reach the site, interact with it, and</tspan>
  <tspan x="140" dy="40">what results they get.</tspan>
</text>
