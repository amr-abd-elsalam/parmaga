<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#2e7d32">عدّل</tspan> عمّ حسن <tspan font-weight="bold" fill="#17457f">الموقع</tspan></tspan>
  <tspan x="950" dy="40">بناءً على ما قاله الثلاثة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Uncle Hassan <tspan font-weight="bold" fill="#2e7d32">fixed</tspan> the <tspan font-weight="bold" fill="#17457f">website</tspan></tspan>
  <tspan x="120" dy="40">based on what all three said.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بعد شهر عادت منى تقيس من جديد:</tspan>
  <tspan x="950" dy="40">ارتفع <tspan font-weight="bold" fill="#c0392b">معدل التحويل</tspan> من 1% إلى <tspan font-weight="bold" fill="#2e7d32">4%.</tspan></tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A month later, Mona measured again:</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">conversion rate</tspan> rose from 1% to <tspan font-weight="bold" fill="#2e7d32">4%.</tspan></tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الأرقام اكتشفت المشكلة، والناس فسّروها،</tspan>
  <tspan x="935" dy="40">والخبيرة أكملت الصورة،</tspan>
  <tspan x="935" dy="40">ثم عادت الأرقام لتثبت أن الحل نجح.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The numbers found the problem,</tspan>
  <tspan x="140" dy="40">people explained it,</tspan>
  <tspan x="140" dy="40">the expert completed the picture,</tspan>
  <tspan x="140" dy="40">and then the numbers came back</tspan>
  <tspan x="140" dy="40">to prove the fix worked.</tspan>
</text>

<!-- Illustration labels -->
<text x="950" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الأرقام تكتشف</tspan>
</text>
<text x="690" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="690" dy="0">Numbers find</tspan>
</text>
<text x="950" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الناس تفسّر</tspan>
</text>
<text x="690" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="690" dy="0">People explain</tspan>
</text>
<text x="390" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="390" dy="0">الخبيرة تكمل</tspan>
</text>
<text x="116" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="116" dy="0">Expert completes</tspan>
</text>
<text x="390" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="390" dy="0">نُصلح ونقيس</tspan>
</text>
<text x="116" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="116" dy="0">Fix and measure</tspan>
</text>
</svg>
