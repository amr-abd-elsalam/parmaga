<!-- Info card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">التقييم النوعي</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Qualitative Evaluation</tspan>
</text>

<!-- Info card paragraph A -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">تقييم يعتمد على <tspan font-weight="bold" fill="#17457f">الملاحظة والمقابلات</tspan></tspan>
  <tspan x="935" dy="40">والأوصاف لفهم <tspan font-weight="bold" fill="#17457f">تجربة المستخدم</tspan></tspan>
  <tspan x="935" dy="40">والأسباب المحتملة لسلوكه.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Evaluation that relies on <tspan font-weight="bold" fill="#17457f">observation,</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">interviews,</tspan> and descriptions to</tspan>
  <tspan x="140" dy="40">understand the <tspan font-weight="bold" fill="#17457f">user experience</tspan> and</tspan>
  <tspan x="140" dy="40">the possible reasons for behavior.</tspan>
</text>

<!-- Info card paragraph B -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يجيب عن أسئلة: <tspan font-weight="bold" fill="#c0392b">لماذا؟</tspan> كيف؟ ما الذي يُربك؟</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It answers questions like:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">Why?</tspan> How? What is confusing?</tspan>
</text>

<!-- Qualitative paragraph -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">«نوعي»</tspan> تعني نوع التجربة والإحساس،</tspan>
  <tspan x="950" dy="40">أي <tspan font-weight="bold" fill="#17457f">كلام الناس.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">“Qualitative”</tspan> means the kind of</tspan>
  <tspan x="120" dy="40">experience and feeling: <tspan font-weight="bold" fill="#17457f">people's words.</tspan></tspan>
</text>
</svg>
