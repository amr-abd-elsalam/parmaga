<!-- Info card texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">المؤشر ومؤشر الأداء الرئيسي</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Metric and KPI</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المؤشر أو المقياس</tspan> Metric: رقم محدد</tspan>
  <tspan x="935" dy="40">التعريف يقيس جانبًا من أداء الموقع.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Metric (indicator):</tspan> a clearly defined</tspan>
  <tspan x="140" dy="40">number that measures one side of a</tspan>
  <tspan x="140" dy="40">website's performance.</tspan>
</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">مؤشر الأداء الرئيسي</tspan> KPI: المؤشر الذي</tspan>
  <tspan x="935" dy="40">يرتبط مباشرة <tspan font-weight="bold" fill="#17457f">بهدف الموقع،</tspan></tspan>
  <tspan x="935" dy="40">مثل عدد الطلبات في موقع كشري الزعيم.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Key performance indicator (KPI):</tspan></tspan>
  <tspan x="140" dy="40">the metric directly linked to the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">site's goal,</tspan> such as the number of</tspan>
  <tspan x="140" dy="40">orders on the Al-Zaeem Koshary website.</tspan>
</text>

<!-- Closing paragraph -->
<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قبل أن نفهم المؤشرات،</tspan>
  <tspan x="950" dy="40">لا بد أن نفرّق بين <tspan font-weight="bold" fill="#17457f">ثلاث وحدات.</tspan></tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Before we understand the indicators,</tspan>
  <tspan x="120" dy="40">we must tell apart <tspan font-weight="bold" fill="#17457f">three units.</tspan></tspan>
</text>
</svg>
