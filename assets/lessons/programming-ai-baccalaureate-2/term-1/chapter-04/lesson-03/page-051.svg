<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">مقاييس وأدوات كمية أخرى</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Other Quantitative Metrics and Tools</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">الوقت المستغرق</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Time Spent</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الوقت المستغرق</tspan> Time Spent: <tspan font-weight="bold" fill="#17457f">متوسط المدة</tspan></tspan>
  <tspan x="935" dy="40">التي يقضيها الزائر في الصفحة أو الموقع.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Time spent:</tspan> the <tspan font-weight="bold" fill="#17457f">average time</tspan> a visitor</tspan>
  <tspan x="140" dy="40">spends on a page or on the site.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تحذير:</tspan> الوقت الطويل ليس جيدًا دائمًا؛</tspan>
  <tspan x="935" dy="40">قد يعني أن الزائر <tspan font-weight="bold" fill="#2e7d32">مستمتع،</tspan></tspan>
  <tspan x="935" dy="40">وقد يعني أنه <tspan font-weight="bold" fill="#17457f">تائه</tspan> لا يجد الزر.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Warning:</tspan> a long time is not always</tspan>
  <tspan x="140" dy="40">good; it may mean the visitor is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">enjoying</tspan> the site, or that they are</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">lost</tspan> and cannot find the button.</tspan>
</text>
</svg>
