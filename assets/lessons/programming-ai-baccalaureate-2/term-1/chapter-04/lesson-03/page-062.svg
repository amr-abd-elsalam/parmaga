<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الإجابة النموذجية</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Model Answer</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">سؤال على نمط الامتحان</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">EXAM-STYLE QUESTION</tspan>
</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشرح لماذا ينبغي لفريق موقع إلكتروني</tspan>
  <tspan x="935" dy="40">استخدام التقييم <tspan font-weight="bold" fill="#c0392b">النوعي والكمي</tspan> <tspan font-weight="bold" fill="#17457f">معًا</tspan></tspan>
  <tspan x="935" dy="40">بدلًا من أحدهما فقط. [6 درجات]</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain why a website team should use</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">both</tspan> <tspan font-weight="bold" fill="#c0392b">qualitative and quantitative</tspan></tspan>
  <tspan x="140" dy="40">evaluation rather than</tspan>
  <tspan x="140" dy="40">only one. [6 marks]</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">استخدم <tspan font-weight="bold" fill="#17457f">قالب الخطوات الثلاث،</tspan></tspan>
  <tspan x="950" dy="40">وكل خطوة تساوي <tspan fill="#c96a1b">درجتين.</tspan></tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Use the <tspan font-weight="bold" fill="#17457f">three-step template;</tspan></tspan>
  <tspan x="120" dy="40">each step is worth <tspan fill="#c96a1b">two marks.</tspan></tspan>
</text>

<text x="812" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">كم</text>
<text x="722" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">How much</text>
<text x="630" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">لماذا</text>
<text x="562" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Why</text>
<text x="393" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">مثال</text>
<text x="300" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Example</text>
</svg>
