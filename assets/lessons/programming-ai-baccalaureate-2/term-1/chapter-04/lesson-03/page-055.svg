<!-- Paragraph 1 (Arabic) -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">المعنى: الناس تأتي، لكنها <tspan font-weight="bold" fill="#c0392b">لا تشتري</tspan>.</tspan>
</text>

<!-- Paragraph 1 (English) -->
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Meaning: people come, but they <tspan font-weight="bold" fill="#c0392b">don't buy</tspan>.</tspan>
</text>

<!-- Key sentence strip (Arabic) -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الأرقام تقول لنا <tspan font-weight="bold" fill="#c0392b">أين</tspan> المشكلة،</tspan>
  <tspan x="935" dy="40">ولا تقول <tspan font-weight="bold" fill="#c0392b">لماذا</tspan>.</tspan>
</text>

<!-- Key sentence strip (English) -->
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Numbers tell us <tspan font-weight="bold" fill="#c0392b">where</tspan> the problem is,</tspan>
  <tspan x="140" dy="40">but not <tspan font-weight="bold" fill="#c0392b">why</tspan>.</tspan>
</text>

<!-- Paragraph 2 (Arabic) -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الخطوة التالية: <tspan font-weight="bold" fill="#17457f">اختبار قابلية الاستخدام</tspan></tspan>
  <tspan x="950" dy="40">أو <tspan font-weight="bold" fill="#17457f">المقابلات</tspan> لمعرفة السبب، ثم نُصلح</tspan>
  <tspan x="950" dy="40">ونعود إلى الأرقام لنتأكد.</tspan>
</text>

<!-- Paragraph 2 (English) -->
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The next step: <tspan font-weight="bold" fill="#17457f">usability testing</tspan> or</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">interviews</tspan> to find the cause;</tspan>
  <tspan x="120" dy="40">then we fix and return to the numbers</tspan>
  <tspan x="120" dy="40">to make sure.</tspan>
</text>
</svg>
