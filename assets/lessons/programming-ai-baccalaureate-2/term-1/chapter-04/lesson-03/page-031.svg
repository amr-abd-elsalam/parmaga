<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">القاعدة 1: الاتساق Consistency</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Rule 1: Consistency</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> ما إذا كان التصميم</tspan>
  <tspan x="935" dy="40">والعمليات <tspan font-weight="bold" fill="#c0392b">موحدة</tspan> عبر الموقع.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> whether the</tspan>
  <tspan x="140" dy="40">design and operations are <tspan font-weight="bold" fill="#c0392b">unified</tspan></tspan>
  <tspan x="140" dy="40">across the site.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">ببساطة:</tspan> <tspan font-weight="bold" fill="#17457f">الشيء نفسه</tspan> يظهر بالشكل نفسه</tspan>
  <tspan x="935" dy="40">ويعمل بالطريقة نفسها في كل الصفحات.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Simply:</tspan> the <tspan font-weight="bold" fill="#17457f">same thing</tspan> looks and</tspan>
  <tspan x="140" dy="40">works the same way on every page.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل <tspan fill="#c96a1b">إشارة مرور</tspan> تغيّر <tspan font-weight="bold" fill="#c0392b">معنى</tspan> ألوانها</tspan>
  <tspan x="950" dy="40">من شارع لآخر!</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine <tspan fill="#c96a1b">traffic lights</tspan> that change</tspan>
  <tspan x="120" dy="40">their <tspan font-weight="bold" fill="#c0392b">meaning</tspan> on every street!</tspan>
</text>
