<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Info card -->
<rect x="109" y="128" width="870" height="528" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="122" width="870" height="528" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="496" rx="3" fill="#2f7fb5"/>

<!-- Illustration: a plug that fits only one way -->
<g>
  <defs>
    <linearGradient id="ilWall8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ilHead8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb5"/>
      <stop offset="1" stop-color="#17457f"/>
    </linearGradient>
  </defs>
  <!-- shadows -->
  <rect x="109" y="916" width="862" height="340" rx="26" fill="#22303f" opacity=".18"/>
  <!-- backdrop -->
  <rect x="105" y="910" width="862" height="340" rx="26" fill="url(#ilWall8)" stroke="#8fc9f2" stroke-width="2.5"/>
  <path d="M105 1200 H967 V1224 Q967 1250 941 1250 H131 Q105 1250 105 1224 Z" fill="#e8dfd1"/>
  <path d="M105 1200 H967" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <path d="M320 1200 L300 1250 M540 1200 L540 1250 M760 1200 L780 1250" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="540" cy="1070" r="110" fill="#ffd24a" opacity=".12"/>
  <rect x="464" y="986" width="160" height="180" rx="22" fill="#22303f" opacity=".18"/>
  <circle cx="264" cy="1076" r="56" fill="#22303f" opacity=".18"/>
  <circle cx="824" cy="1076" r="56" fill="#22303f" opacity=".18"/>
  <ellipse cx="704" cy="1244" rx="30" ry="5" fill="#22303f" opacity=".18"/>

  <!-- sparkles -->
  <path d="M140 930 Q140 940 150 940 Q140 940 140 950 Q140 940 130 940 Q140 940 140 930 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M395 1002 Q395 1012 405 1012 Q395 1012 395 1022 Q395 1012 385 1012 Q395 1012 395 1002 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M340 1130 Q340 1140 350 1140 Q340 1140 340 1150 Q340 1140 330 1140 Q340 1140 340 1130 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>

  <!-- small plant -->
  <path d="M704 1206 Q682 1180 692 1156 Q710 1180 704 1206 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M704 1206 Q726 1178 718 1154 Q700 1180 704 1206 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="686,1204 722,1204 717,1240 691,1240" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- wall socket with uniquely shaped holes -->
  <rect x="460" y="980" width="160" height="180" rx="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="994" r="4" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
  <circle cx="540" cy="1146" r="4" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
  <circle cx="540" cy="1070" r="56" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="514" y="1043" width="8" height="30" rx="2" fill="#22303f"/>
  <rect x="554" y="1043" width="14" height="30" rx="2" fill="#22303f"/>
  <path d="M530 1104 V1098 A10 10 0 0 1 550 1098 V1104 Z" fill="#22303f"/>

  <!-- correct plug (left), pins match the holes -->
  <path d="M254 1126 C254 1172 210 1184 125 1184 L125 1196 C220 1196 266 1180 266 1126 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="260" cy="1070" r="56" fill="url(#ilHead8)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="260" cy="1070" r="44" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <path d="M222 1048 Q230 1030 250 1024" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <rect x="234" y="1043" width="8" height="30" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="274" y="1043" width="14" height="30" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <path d="M250 1104 V1098 A10 10 0 0 1 270 1098 V1104 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <!-- smooth motion into the socket -->
  <path d="M340 1052 H420 M340 1088 H420" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330 1070 H438" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <polygon points="452,1070 436,1061 436,1079" fill="#2e7d32" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <!-- green check -->
  <circle cx="175" cy="995" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M165 995 L172 1002 L185 988" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wrong plug (right), turned upside down -->
  <path d="M814 1126 C814 1180 860 1196 945 1196 L945 1184 C870 1184 826 1172 826 1126 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="820" cy="1070" r="56" fill="url(#ilHead8)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="820" cy="1070" r="44" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <path d="M782 1048 Q790 1030 810 1024" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <rect x="838" y="1067" width="8" height="30" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="792" y="1067" width="14" height="30" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <path d="M810 1036 V1042 A10 10 0 0 0 830 1042 V1036 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <!-- blocked before the socket -->
  <path d="M742 1040 L754 1046 M738 1070 H752 M742 1100 L754 1094" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M726 1070 H664 M654 1052 V1088" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="662,1070 674,1063 674,1077" fill="#c0392b"/>
  <!-- red cross -->
  <circle cx="905" cy="995" r="20" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M897 987 L913 1003 M913 987 L897 1003" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- dotted rotation arrow from the wrong position to the right one -->
  <path d="M800 995 L774 983.1 M748 972.5 L722 963.1 M696 955 L670 948.1 M644 942.5 L618 938.1 M592 935 L566 933.1 M540 932.5 L514 933.1 M488 935 L462 938.1 M436 942.5 L410 948.1 M384 955 L358 963.1 M332 972.5 L306 983.1" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="272,999 290,999 283,985" fill="#c0392b" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Icon: shield with check (card header row) -->
<g transform="translate(150 134)">
  <path d="M24 2 L44 10 V24 Q44 40 24 46 Q4 40 4 24 V10 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M15 24 L22 31 L34 17" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: small plug -->
<g transform="translate(820 800)">
  <rect x="18" y="0" width="6" height="14" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="32" y="0" width="6" height="14" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="10" y="12" width="36" height="26" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="22" y="38" width="12" height="8" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <path d="M28 46 Q28 56 42 56" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Emotion face: wink -->
<g transform="translate(920 830)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">القاعدة 2:</tspan>
  <tspan x="935" dy="40">منع الأخطاء Error Prevention</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Rule 2: Error Prevention</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> ما إذا كان التصميم يجعل</tspan>
  <tspan x="935" dy="40">من <tspan font-weight="bold" fill="#c0392b">الصعب</tspan> على المستخدمين ارتكاب الأخطاء.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> whether the</tspan>
  <tspan x="140" dy="40">design makes it <tspan font-weight="bold" fill="#c0392b">hard</tspan> for users to</tspan>
  <tspan x="140" dy="40">make mistakes.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">ببساطة:</tspan> <tspan font-weight="bold" fill="#17457f">منع الخطأ</tspan> قبل وقوعه أفضل</tspan>
  <tspan x="935" dy="40">من <tspan font-weight="bold" fill="#c0392b">رسالة خطأ</tspan> بعد وقوعه.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Simply:</tspan> <tspan font-weight="bold" fill="#17457f">preventing a mistake</tspan> before</tspan>
  <tspan x="140" dy="40">it happens is better than an</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">error message</tspan> after it.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">فيشة الكهرباء</tspan> لا تدخل في المقبس إلا بطريقة</tspan>
  <tspan x="950" dy="40">واحدة؛ هذا <tspan font-weight="bold" fill="#17457f">منع للخطأ بالتصميم.</tspan></tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan fill="#c96a1b">plug</tspan> fits into the socket</tspan>
  <tspan x="120" dy="40">only one way; that is <tspan font-weight="bold" fill="#17457f">error prevention</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">by design.</tspan></tspan>
</text>
</svg>
