<!-- Success card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">ميزته</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">Its Strength</tspan>
</text>

<!-- Success card paragraph -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">عميق،</tspan> ويكشف <tspan font-weight="bold" fill="#17457f">الأسباب</tspan></tspan>
  <tspan x="935" dy="40">التي لا تظهر في الأرقام.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It is <tspan font-weight="bold" fill="#2e7d32">deep</tspan> and reveals <tspan font-weight="bold" fill="#17457f">reasons</tspan></tspan>
  <tspan x="140" dy="40">that do not appear in numbers.</tspan>
</text>

<!-- Warning card header -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">حدّه</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Its Limit</tspan>
</text>

<!-- Warning card paragraph -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يعتمد عادةً على <tspan font-weight="bold" fill="#c0392b">عدد قليل</tspan> من الأشخاص،</tspan>
  <tspan x="935" dy="40">فلا يمثل <tspan font-weight="bold" fill="#17457f">كل المستخدمين</tspan> بالضرورة.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It usually relies on a <tspan font-weight="bold" fill="#c0392b">small number</tspan></tspan>
  <tspan x="140" dy="40">of people, so it does not necessarily</tspan>
  <tspan x="140" dy="40">represent <tspan font-weight="bold" fill="#17457f">all users.</tspan></tspan>
</text>

<!-- Karim paragraph -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذا هو <tspan font-weight="bold" fill="#c0392b">كريم</tspan> في القصة.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">This is <tspan font-weight="bold" fill="#c0392b">Karim</tspan> in the story.</tspan>
</text>
</svg>
