<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">خانة رقم الموبايل تقبل <tspan fill="#c96a1b">الحروف،</tspan></tspan>
  <tspan x="950" dy="40">وهذا ضد قاعدة <tspan font-weight="bold" fill="#c0392b">منع الأخطاء.</tspan></tspan>
</text>

<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The mobile number box accepts <tspan fill="#c96a1b">letters,</tspan></tspan>
  <tspan x="132" dy="40">which breaks the <tspan font-weight="bold" fill="#c0392b">error prevention</tspan> rule.</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يضغط الزبون <tspan fill="#c96a1b">«تأكيد الطلب»</tspan> فلا يظهر شيء،</tspan>
  <tspan x="950" dy="40">فيضغط مرة أخرى ويطلب طبقين!</tspan>
  <tspan x="950" dy="40">وهذا ضد قاعدة <tspan font-weight="bold" fill="#c0392b">وضوح حالة النظام.</tspan></tspan>
</text>

<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The customer presses <tspan fill="#c96a1b">“Confirm Order”</tspan></tspan>
  <tspan x="132" dy="40">and nothing appears, so they press</tspan>
  <tspan x="132" dy="40">again and order two plates!</tspan>
  <tspan x="132" dy="40">This breaks the <tspan font-weight="bold" fill="#c0392b">visibility</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#c0392b">of system status</tspan> rule.</tspan>
</text>
</svg>
