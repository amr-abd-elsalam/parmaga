<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Extra Insight</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كلمة <tspan font-weight="bold" fill="#c0392b">Heuristic</tspan> من الأصل اليوناني نفسه</tspan>
  <tspan x="935" dy="40">لكلمة <tspan font-weight="bold" fill="#17457f">«Eureka!»،</tspan> أي «وجدتُها!»،</tspan>
  <tspan x="935" dy="40">التي يُروى أن <tspan fill="#c96a1b">أرشميدس</tspan> صاح بها.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The word <tspan font-weight="bold" fill="#c0392b">heuristic</tspan> comes from the</tspan>
  <tspan x="140" dy="40">same Greek root as <tspan font-weight="bold" fill="#17457f">“Eureka!”,</tspan> meaning</tspan>
  <tspan x="140" dy="40">“I have found it!”, which <tspan fill="#c96a1b">Archimedes</tspan></tspan>
  <tspan x="140" dy="40">is said to have shouted.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">فالتقييم الإرشادي</tspan> معناه: الخبير يمسك</tspan>
  <tspan x="950" dy="40">القواعد، ثم يقول: <tspan font-weight="bold" fill="#2e7d32">وجدتُ المشكلة!</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So <tspan font-weight="bold" fill="#c0392b">heuristic evaluation</tspan> means: the</tspan>
  <tspan x="120" dy="40">expert holds the rules and then says:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">I found the problem!</tspan></tspan>
</text>
</svg>
