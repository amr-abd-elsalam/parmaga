<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">ثلاث وحدات يجب أن تفرّق بينها</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Three Units You Must Tell Apart</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المستخدم</tspan> User: الشخص، أو بدقة أكبر الجهاز</tspan>
  <tspan x="950" dy="40">أو المتصفح. مثال: <tspan fill="#c96a1b">أحمد.</tspan></tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">User:</tspan> the person, or more precisely the</tspan>
  <tspan x="132" dy="40">device or browser. Example: <tspan fill="#c96a1b">Ahmed.</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الزيارة أو الجلسة</tspan> Session / Visit: مرة واحدة</tspan>
  <tspan x="950" dy="40">يدخل فيها الشخص الموقع. مثال: دخل أحمد الصبح</tspan>
  <tspan x="950" dy="40">ودخل بالليل، فهذه <tspan font-weight="bold" fill="#17457f">زيارتان.</tspan></tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Session / visit:</tspan> one time a person</tspan>
  <tspan x="132" dy="40">enters the site. Example: Ahmed came in</tspan>
  <tspan x="132" dy="40">the morning and again at night,</tspan>
  <tspan x="132" dy="40">so these are <tspan font-weight="bold" fill="#17457f">two visits.</tspan></tspan>
</text>

<!-- Bullet 3 -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مشاهدة الصفحة</tspan> Page View: كل مرة</tspan>
  <tspan x="950" dy="40">تُفتح فيها صفحة. مثال: في زيارة الصبح</tspan>
  <tspan x="950" dy="40">فتح أحمد 4 صفحات، فهذه <tspan font-weight="bold" fill="#17457f">4 مشاهدات.</tspan></tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Page view:</tspan> each time a page is opened.</tspan>
  <tspan x="132" dy="40">Example: in the morning visit, Ahmed</tspan>
  <tspan x="132" dy="40">opened 4 pages, so these are</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">4 page views.</tspan></tspan>
</text>

<!-- Key sentence strip texts -->
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">شخص واحد ← عدة زيارات ←</tspan>
  <tspan x="935" dy="40">كل زيارة فيها عدة صفحات.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">One person → several visits →</tspan>
  <tspan x="140" dy="40">each visit has several pages.</tspan>
</text>
</svg>
