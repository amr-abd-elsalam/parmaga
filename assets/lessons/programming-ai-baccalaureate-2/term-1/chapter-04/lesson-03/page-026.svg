<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> يحدد فيه الخبراء مشكلات</tspan>
  <tspan x="950" dy="40">واجهة المستخدم استنادًا إلى <tspan font-weight="bold" fill="#c0392b">قواعد عملية.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> experts identify</tspan>
  <tspan x="120" dy="40">UI problems based on <tspan font-weight="bold" fill="#c0392b">rules of thumb.</tspan></tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">القواعد الإرشادية</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Heuristics</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">القواعد الإرشادية</tspan> Heuristics: قواعد عملية</tspan>
  <tspan x="935" dy="40">مستمدة من الخبرة، تُسمى أيضًا</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">«قواعد الإبهام»</tspan> Rules of Thumb؛</tspan>
  <tspan x="935" dy="40">ليست قوانين رياضية صارمة،</tspan>
  <tspan x="935" dy="40">لكنها تصح في <tspan font-weight="bold" fill="#2e7d32">أغلب الحالات.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Heuristics:</tspan> practical rules drawn</tspan>
  <tspan x="140" dy="40">from experience, also called</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">“rules of thumb”;</tspan> they are not</tspan>
  <tspan x="140" dy="40">strict mathematical laws, but they</tspan>
  <tspan x="140" dy="40">hold true in <tspan font-weight="bold" fill="#2e7d32">most cases.</tspan></tspan>
</text>
</svg>
