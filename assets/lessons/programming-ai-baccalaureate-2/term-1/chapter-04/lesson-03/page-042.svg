<!-- Warning card text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">أهم نقطة:</tspan> PV لا يساوي عدد الأشخاص.</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Most important point:</tspan> PV does not</tspan>
  <tspan x="140" dy="40">equal the number of people.</tspan>
</text>

<!-- Paragraph: thousand views -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ألف مشاهدة قد تأتي من <tspan fill="#c96a1b">ألف شخص،</tspan> أو من</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">عشرة أشخاص</tspan> فتح كل منهم الصفحة مئة مرة.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A thousand views may come from</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">a thousand people,</tspan> or from <tspan fill="#c96a1b">ten people</tspan></tspan>
  <tspan x="120" dy="40">who each opened the page a hundred times.</tspan>
</text>

<!-- Paragraph: remember -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تذكّر:</tspan> PV مثل <tspan font-weight="bold" fill="#17457f">عدّاد الباب الدوّار؛</tspan></tspan>
  <tspan x="950" dy="40">يعدّ كل لفّة، ولا يعرف إن كان</tspan>
  <tspan x="950" dy="40">الداخل هو الشخص نفسه.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Remember:</tspan> PV is like a <tspan font-weight="bold" fill="#17457f">revolving door</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">counter;</tspan> it counts every turn and does</tspan>
  <tspan x="120" dy="40">not know if the same person came in again.</tspan>
</text>
</svg>
