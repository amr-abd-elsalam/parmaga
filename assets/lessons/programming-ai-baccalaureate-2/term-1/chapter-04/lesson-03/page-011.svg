<!-- Box header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>

<!-- Paragraph 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو استعان عمّ حسن بمنى <tspan font-weight="bold" fill="#17457f">وحدها،</tspan></tspan>
  <tspan x="935" dy="40">ماذا كان سيعرف؟ وماذا كان سيفوته؟</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If Uncle Hassan had asked <tspan font-weight="bold" fill="#17457f">only</tspan> Mona,</tspan>
  <tspan x="140" dy="40">what would he have known?</tspan>
  <tspan x="140" dy="40">And what would he have missed?</tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وماذا لو استعان بكريم <tspan font-weight="bold" fill="#17457f">وحده؟</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">And what if he had asked <tspan font-weight="bold" fill="#17457f">only</tspan> Karim?</tspan>
</text>
</svg>
