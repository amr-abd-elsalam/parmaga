<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معدل التحويل CVR</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Conversion Rate (CVR)</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل التحويل</tspan> CVR (Conversion Rate):</tspan>
  <tspan x="935" dy="40">نسبة الزيارات أو المستخدمين، حسب طريقة</tspan>
  <tspan x="935" dy="40">الحساب، التي حققت <tspan font-weight="bold" fill="#17457f">الإجراء المستهدف.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Conversion rate</tspan> (CVR): the proportion</tspan>
  <tspan x="140" dy="40">of visits or users, depending on the</tspan>
  <tspan x="140" dy="40">calculation method, that achieved</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">target action.</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> نسبة الزيارات التي حققت</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">إجراءً مستهدفًا،</tspan> مثل الشراء أو التسجيل.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> the proportion of</tspan>
  <tspan x="120" dy="40">visits that achieved a <tspan font-weight="bold" fill="#c0392b">target action,</tspan></tspan>
  <tspan x="120" dy="40">such as a purchase or registration.</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل التحويل</tspan> =</tspan>
  <tspan x="935" dy="40">(عدد <tspan font-weight="bold" fill="#2e7d32">التحويلات</tspan> ÷ عدد الزيارات) × <tspan fill="#c96a1b">100%</tspan></tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Conversion rate</tspan> =</tspan>
  <tspan x="140" dy="40">(number of <tspan font-weight="bold" fill="#2e7d32">conversions</tspan> ÷</tspan>
  <tspan x="140" dy="40">number of visits) × <tspan fill="#c96a1b">100%</tspan></tspan>
</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تذكّر:</tspan> «من كل <tspan fill="#c96a1b">100</tspan> داخل، كام اشترى؟»</tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Remember:</tspan> “Out of every <tspan fill="#c96a1b">100</tspan> who</tspan>
  <tspan x="120" dy="40">come in, how many bought?”</tspan>
</text>
</svg>
