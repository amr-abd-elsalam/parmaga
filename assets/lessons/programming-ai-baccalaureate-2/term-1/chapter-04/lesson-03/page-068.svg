<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">القواعد الإرشادية الثلاث:</tspan>
  <tspan x="950" dy="40">إشارة، فيشة، أسانسير</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Three Heuristics:</tspan>
  <tspan x="120" dy="40">Traffic Light, Plug, Elevator</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الاتساق</tspan> هو <tspan font-weight="bold" fill="#17457f">إشارة المرور:</tspan></tspan>
  <tspan x="950" dy="40">ألوانها ثابتة في كل مكان.</tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Consistency</tspan> is the <tspan font-weight="bold" fill="#17457f">traffic light:</tspan></tspan>
  <tspan x="132" dy="40">its colors are the same everywhere.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">منع الأخطاء</tspan> هو <tspan font-weight="bold" fill="#17457f">الفيشة:</tspan></tspan>
  <tspan x="950" dy="40">لا تدخل إلا بطريقة واحدة.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Error prevention</tspan> is the <tspan font-weight="bold" fill="#17457f">plug:</tspan></tspan>
  <tspan x="132" dy="40">it fits only one way.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">وضوح حالة النظام</tspan> هو <tspan font-weight="bold" fill="#17457f">الأسانسير:</tspan></tspan>
  <tspan x="950" dy="40">يعرض لك رقم الدور.</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Visibility of system status</tspan></tspan>
  <tspan x="132" dy="40">is the <tspan font-weight="bold" fill="#17457f">elevator:</tspan></tspan>
  <tspan x="132" dy="40">it shows you the floor number.</tspan>
</text>

<text x="888" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الاتساق</text>
<text x="740" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Consistency</text>
<text x="623" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">منع الأخطاء</text>
<text x="401" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Error prevention</text>
<text x="374" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">وضوح حالة النظام</text>
<text x="131" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="131" dy="0">Visibility of</tspan>
  <tspan x="131" dy="40">system status</tspan>
</text>
</svg>
