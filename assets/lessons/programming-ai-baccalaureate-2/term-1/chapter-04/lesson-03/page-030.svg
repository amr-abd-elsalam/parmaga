<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">6 التعرّف بدل التذكّر</text>
<text x="132" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">6 Recognition rather than recall</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">7 المرونة وكفاءة الاستخدام</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">7 Flexibility and efficiency of use</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">8 التصميم الجمالي البسيط</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">8 Aesthetic and minimalist design</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">9 مساعدة المستخدم على التعرف على الأخطاء</tspan>
  <tspan x="950" dy="40">وتشخيصها والتعافي منها</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">9 Help users recognize, diagnose,</tspan>
  <tspan x="132" dy="40">and recover from errors</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">10 المساعدة والتوثيق</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">10 Help and documentation</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تحدَّ نفسك</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">CHALLENGE YOURSELF</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اختر قاعدة من <tspan font-weight="bold" fill="#17457f">القواعد العشر</tspan> غير قواعد</tspan>
  <tspan x="935" dy="40">درسنا الثلاث، وابحث عن <tspan fill="#c96a1b">مثال</tspan> لها في تطبيق</tspan>
  <tspan x="935" dy="40">تستخدمه يوميًا.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Choose one of the <tspan font-weight="bold" fill="#17457f">ten rules</tspan> other than</tspan>
  <tspan x="140" dy="40">our three, and find an <tspan fill="#c96a1b">example</tspan> of it</tspan>
  <tspan x="140" dy="40">in an app you use every day.</tspan>
</text>
</svg>
