<!-- Texts: table header row (right column first) -->
<text x="963" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">سؤال مغلق</text>
<text x="607" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Closed question</text>
<text x="563" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">سؤال مفتوح</text>
<text x="117" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Open question</text>

<!-- Texts: row 1 -->
<text x="963" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">هل أعجبك الموقع؟</text>
<text x="607" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="607" dy="0">Did you like</tspan>
  <tspan x="607" dy="40">the website?</tspan>
</text>
<text x="563" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="563" dy="0">احكِ لي عن آخر مرة طلبت</tspan>
  <tspan x="563" dy="40">فيها أكلًا أونلاين.</tspan>
</text>
<text x="117" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="117" dy="0">Tell me about the last</tspan>
  <tspan x="117" dy="40">time you ordered food</tspan>
  <tspan x="117" dy="40">online.</tspan>
</text>

<!-- Texts: row 2 -->
<text x="963" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">إجابته: نعم أو لا.</text>
<text x="607" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Answer: yes or no.</text>
<text x="563" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="563" dy="0">إجابته: قصة وتفاصيل</tspan>
  <tspan x="563" dy="40">وأسباب.</tspan>
</text>
<text x="117" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="117" dy="0">Answer: a story,</tspan>
  <tspan x="117" dy="40">details, and reasons.</tspan>
</text>

<!-- Texts: outlined box -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">اختبر نفسك</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">CHECK YOURSELF</text>
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">حوّل هذا <tspan font-weight="bold" fill="#17457f">السؤال المغلق</tspan> إلى <tspan font-weight="bold" fill="#17457f">سؤال مفتوح:</tspan></tspan>
  <tspan x="935" dy="40"><tspan fill="#c96a1b">«هل كان الدفع سهلًا؟»</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Turn this <tspan font-weight="bold" fill="#17457f">closed question</tspan></tspan>
  <tspan x="140" dy="40">into an <tspan font-weight="bold" fill="#17457f">open one:</tspan> <tspan fill="#c96a1b">“Was paying easy?”</tspan></tspan>
</text>
</svg>
