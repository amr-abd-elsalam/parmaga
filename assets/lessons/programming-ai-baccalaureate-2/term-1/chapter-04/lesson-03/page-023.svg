<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">المقابلة</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Interview</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المقابلة</tspan> Interview: <tspan font-weight="bold" fill="#17457f">حوار مباشر</tspan></tspan>
  <tspan x="935" dy="40">مع المستخدم لسماع رأيه واحتياجاته</tspan>
  <tspan x="935" dy="40">وما يضايقه بكلماته هو.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Interview:</tspan> a <tspan font-weight="bold" fill="#17457f">direct conversation</tspan></tspan>
  <tspan x="140" dy="40">with the user to hear their opinion,</tspan>
  <tspan x="140" dy="40">needs, and frustrations in their</tspan>
  <tspan x="140" dy="40">own words.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تعريف الكتاب: <tspan font-weight="bold" fill="#17457f">الاستماع</tspan> إلى آراء المستخدمين</tspan>
  <tspan x="950" dy="40">المباشرة لفهم <tspan font-weight="bold" fill="#17457f">احتياجاتهم واستيائهم.</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Textbook definition: <tspan font-weight="bold" fill="#17457f">hear</tspan> users'</tspan>
  <tspan x="120" dy="40">direct voices to understand their</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">needs and dissatisfactions.</tspan></tspan>
</text>
</svg>
