<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أشهر قائمة للقواعد الإرشادية هي <tspan font-weight="bold" fill="#c0392b">القواعد العشر</tspan></tspan>
  <tspan x="950" dy="40">التي نشرها <tspan font-weight="bold" fill="#17457f">جاكوب نيلسن</tspan> عام <tspan fill="#c96a1b">1994.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The most famous list of heuristics</tspan>
  <tspan x="120" dy="40">is the <tspan font-weight="bold" fill="#c0392b">ten rules</tspan> <tspan font-weight="bold" fill="#17457f">Jakob Nielsen</tspan></tspan>
  <tspan x="120" dy="40">published in <tspan fill="#c96a1b">1994.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">1 وضوح حالة النظام <tspan font-weight="bold" fill="#2e7d32">(في درسنا)</tspan></text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 Visibility of system status</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">(in our lesson)</tspan></tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">2 التطابق بين النظام والعالم الحقيقي</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">2 Match between system and the real world</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">3 تحكّم المستخدم وحريته</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">3 User control and freedom</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">4 الاتساق والمعايير <tspan font-weight="bold" fill="#2e7d32">(في درسنا)</tspan></text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 Consistency and standards</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">(in our lesson)</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">5 منع الأخطاء <tspan font-weight="bold" fill="#2e7d32">(في درسنا)</tspan></text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">5 Error prevention <tspan font-weight="bold" fill="#2e7d32">(in our lesson)</tspan></text>
