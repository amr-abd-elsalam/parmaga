<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Info card -->
<rect x="109" y="128" width="870" height="448" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="122" width="870" height="448" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="416" rx="3" fill="#2f7fb5"/>

<!-- Card header icon: open book -->
<g transform="translate(127 130)">
  <path d="M2 44 Q14 38 26 46 Q38 38 50 44 V50 H2 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 10 Q16 4 26 10 V44 Q16 38 4 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 10 Q36 4 48 10 V44 Q36 38 26 44 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 19 Q15 16 21 19 M10 27 Q15 24 21 27 M31 19 Q37 16 42 19 M31 27 Q37 24 42 27" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Emotion face: smile -->
<g transform="translate(900 770)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Requested illustration: elevator display and phone loading -->
<g>
  <defs>
    <linearGradient id="ilWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ilDoor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#8fc9f2"/>
    </linearGradient>
    <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff1f7"/>
    </linearGradient>
  </defs>
  <!-- shadows -->
  <rect x="624" y="838" width="320" height="284" rx="20" fill="#22303f" opacity=".18"/>
  <rect x="124" y="1116" width="836" height="34" rx="17" fill="#22303f" opacity=".18"/>
  <rect x="244" y="856" width="150" height="236" rx="24" fill="#22303f" opacity=".18"/>
  <!-- glows -->
  <ellipse cx="315" cy="968" rx="100" ry="120" fill="#4fc3e8" opacity=".12"/>
  <!-- wall -->
  <rect x="620" y="832" width="320" height="284" rx="20" fill="url(#ilWall)" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="755" cy="870" rx="80" ry="28" fill="#4fc3e8" opacity=".35"/>
  <!-- elevator frame and doors -->
  <rect x="650" y="900" width="210" height="210" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="664" y="914" width="89" height="196" fill="url(#ilDoor)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="757" y="914" width="89" height="196" fill="url(#ilDoor)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M690 930 V1090 M820 930 V1090" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <!-- floor display -->
  <rect x="695" y="852" width="120" height="36" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="712,880 726,860 740,880" fill="#4fc3e8"/>
  <circle cx="762" cy="870" r="5" fill="#7f95ab"/>
  <circle cx="782" cy="870" r="5" fill="#c96a1b"/>
  <circle cx="802" cy="870" r="5" fill="#7f95ab"/>
  <!-- call buttons -->
  <rect x="876" y="980" width="28" height="66" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="890" cy="1000" r="8" fill="#2e7d32"/>
  <polygon points="885,1003 890,996 895,1003" fill="#ffffff"/>
  <circle cx="890" cy="1026" r="8" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <!-- floor -->
  <rect x="120" y="1110" width="836" height="34" rx="17" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <!-- plant -->
  <path d="M174 1062 Q140 1030 150 990 Q182 1018 174 1062 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M174 1062 Q208 1030 200 986 Q166 1016 174 1062 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M174 1062 Q160 1010 176 966 Q192 1010 174 1062 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="146,1070 202,1070 196,1124 152,1124" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="140" y="1062" width="68" height="12" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <!-- phone stand and phone -->
  <path d="M290 1084 L340 1084 L352 1112 L278 1112 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="240" y="850" width="150" height="236" rx="24" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="252" y="874" width="126" height="184" rx="14" fill="url(#ilScreen)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="295" y="860" width="40" height="6" rx="3" fill="#8fc9f2"/>
  <circle cx="315" cy="1072" r="7" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M283 945 A32 32 0 1 0 347 945 A32 32 0 1 0 283 945 Z M293 945 A22 22 0 1 0 337 945 A22 22 0 1 0 293 945 Z" fill="#8fc9f2" fill-rule="evenodd"/>
  <path d="M315 913 A32 32 0 1 1 283 945 L293 945 A22 22 0 1 0 315 923 Z" fill="#4fc3e8"/>
  <circle cx="315" cy="918" r="5" fill="#4fc3e8"/>
  <circle cx="288" cy="945" r="5" fill="#4fc3e8"/>
  <rect x="268" y="1000" width="94" height="16" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="268" y="1000" width="63" height="16" rx="8" fill="#2e7d32"/>
  <rect x="268" y="1030" width="80" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="268" y="1044" width="54" height="8" rx="4" fill="#8fc9f2"/>
  <!-- person waiting -->
  <ellipse cx="589" cy="1126" rx="13" ry="6" fill="#22303f"/>
  <ellipse cx="613" cy="1126" rx="13" ry="6" fill="#22303f"/>
  <rect x="581" y="1040" width="16" height="84" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="603" y="1040" width="16" height="84" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M574 976 Q556 1008 562 1046 L574 1046 Q572 1012 584 986 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M626 976 Q644 1008 638 1046 L626 1046 Q628 1012 616 986 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M574 972 Q600 960 626 972 L634 1052 Q600 1060 566 1052 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="568" cy="1050" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="632" cy="1050" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <rect x="594" y="952" width="12" height="14" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="600" cy="936" r="22" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M578 932 Q580 908 602 910 Q622 910 622 930 Q612 920 600 922 Q588 922 578 932 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="592" cy="938" r="2.5" fill="#22303f"/>
  <circle cx="608" cy="938" r="2.5" fill="#22303f"/>
  <path d="M593 946 Q600 952 607 946" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dashed connector between elevator display and phone screen -->
  <path d="M690 870 L674.2 872.2 M662.3 873.9 L646.4 876.1 M634.5 877.8 L618.7 880 M606.8 881.7 L591 884 M579.1 885.6 L563.2 887.9 M551.4 889.6 L535.5 891.8 M523.6 893.5 L507.8 895.7 M495.9 897.4 L480.1 899.6 M468.2 901.3 L452.3 903.5 M440.4 905.2 L424.6 907.4 M412.7 909.1 L396.9 911.3" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="688" cy="870" r="5" fill="#c96a1b"/>
  <circle cx="394" cy="911" r="5" fill="#c96a1b"/>
</g>

<!-- Memory icons row -->
<g transform="translate(412 1180)">
  <path d="M28 0 V4 M2 22 H6 M50 22 H54 M9 4 L12 7 M47 4 L44 7" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="22" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="21" y="36" width="14" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="23" y="46" width="10" height="6" rx="2" fill="#22303f"/>
</g>
<g transform="translate(512 1180)">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(612 1180)">
  <circle cx="28" cy="28" r="24" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M15 29 L20 24 L25 30 L37 17 L42 22 L25 40 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">القاعدة 3: وضوح حالة</tspan>
  <tspan x="935" dy="40">النظام Visibility of System Status</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Rule 3: Visibility</tspan>
  <tspan x="140" dy="40">of System Status</tspan>
</text>
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">تعريف الكتاب: ما إذا كانت <tspan font-weight="bold" fill="#c0392b">حالة النظام</tspan></tspan>
  <tspan x="935" dy="40">موضحة بوضوح للمستخدمين، مثل</tspan>
  <tspan x="935" dy="40"><tspan fill="#c96a1b">مؤشرات المعالجة</tspan> ورسائل أخطاء الإدخال.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Textbook definition: whether</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">system status</tspan> is clearly indicated to</tspan>
  <tspan x="140" dy="40">users, such as <tspan fill="#c96a1b">processing indicators</tspan></tspan>
  <tspan x="140" dy="40">and input error messages.</tspan>
</text>
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ببساطة: يعرف المستخدم دائمًا <tspan font-weight="bold" fill="#17457f">ماذا يحدث الآن،</tspan></tspan>
  <tspan x="950" dy="40">كما يعرض لك الأسانسير رقم الدور.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Simply: the user always knows</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">what is happening now,</tspan> just as an elevator</tspan>
  <tspan x="120" dy="40">shows you the floor number.</tspan>
</text>
</svg>
