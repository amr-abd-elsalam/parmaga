<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">المفاهيم الكبرى</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Big Concepts</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الآن سنعطي كل شخصية في القصة <tspan font-weight="bold" fill="#17457f">اسمها العلمي.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Now we will give each character</tspan>
  <tspan x="120" dy="40">in the story its <tspan font-weight="bold" fill="#17457f">scientific name.</tspan></tspan>
</text>

<!-- Info card header -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">التقييم الكمي</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Quantitative Evaluation</tspan>
</text>

<!-- Info card paragraph A -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">تقييم يعتمد على <tspan font-weight="bold" fill="#17457f">بيانات عددية</tspan> ومقاييس</tspan>
  <tspan x="935" dy="40">محددة التعريف لقياس <tspan font-weight="bold" fill="#17457f">السلوك والنتائج.</tspan></tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Evaluation that relies on <tspan font-weight="bold" fill="#17457f">numerical</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">data</tspan> and clearly defined metrics</tspan>
  <tspan x="140" dy="40">to measure <tspan font-weight="bold" fill="#17457f">behavior and results.</tspan></tspan>
</text>

<!-- Info card paragraph B -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يجيب عن أسئلة: <tspan font-weight="bold" fill="#c0392b">كم؟</tspan> كم مرة؟ ما النسبة؟</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It answers questions like:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">How many?</tspan> How often? What percentage?</tspan>
</text>

<!-- Notice paragraph -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">لاحظ:</tspan> كلمة «كمّي» تبدأ بـ«كم»،</tspan>
  <tspan x="950" dy="40">إذن <tspan font-weight="bold" fill="#c0392b">الكمي = كم.</tspan></tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Notice:</tspan> the Arabic word “kammi”</tspan>
  <tspan x="120" dy="40">starts with “kam” (how many),</tspan>
  <tspan x="120" dy="40">so <tspan font-weight="bold" fill="#c0392b">quantitative = how many.</tspan></tspan>
</text>
</svg>
