<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الرقم وحده</tspan> لا يكفي لنعرف الفرق،</tspan>
  <tspan x="950" dy="40">وهنا نحتاج إلى <tspan font-weight="bold" fill="#c0392b">كريم.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#17457f">number alone</tspan> is not enough</tspan>
  <tspan x="120" dy="40">to tell the difference; this is</tspan>
  <tspan x="120" dy="40">where we need <tspan font-weight="bold" fill="#c0392b">Karim.</tspan></tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">عدد مرات الوصول</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Access Count</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">عدد مرات الوصول</tspan> Access Count:</tspan>
  <tspan x="935" dy="40">عدد مرات دخول الموقع،</tspan>
  <tspan x="935" dy="40">وهو مقياس عام <tspan font-weight="bold" fill="#17457f">لحجم الحركة.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Access count:</tspan> the number of times</tspan>
  <tspan x="140" dy="40">the site is entered; a general</tspan>
  <tspan x="140" dy="40">measure of <tspan font-weight="bold" fill="#17457f">traffic size.</tspan></tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">اختبار A/B</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">A/B Testing</text>
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">اختبار A/B:</tspan> نعرض نسختين من الصفحة</tspan>
  <tspan x="935" dy="40">لمجموعتين متشابهتين من الزوار</tspan>
  <tspan x="935" dy="40">في الوقت نفسه، <tspan font-weight="bold" fill="#17457f">ونقارن بالأرقام</tspan></tspan>
  <tspan x="935" dy="40">أي نسخة تحقق <tspan font-weight="bold" fill="#2e7d32">نتيجة أفضل.</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">A/B testing:</tspan> we show two versions</tspan>
  <tspan x="140" dy="40">of a page to two similar groups of</tspan>
  <tspan x="140" dy="40">visitors at the same time and</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">compare with numbers</tspan> which version</tspan>
  <tspan x="140" dy="40">gets <tspan font-weight="bold" fill="#2e7d32">better results.</tspan></tspan>
</text>
</svg>
