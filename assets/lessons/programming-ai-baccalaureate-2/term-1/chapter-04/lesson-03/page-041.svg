  <path d="M566 1046 L554 1042 M542 1038 L530 1034 M520 1031 L512 1029 M430 1031 L420 1037 M410 1043 L400 1049 M391 1054 L384 1058" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- boy (behind desk) -->
  <rect x="868" y="1034" width="18" height="22" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M832 1152 L836 1080 Q840 1056 868 1052 L888 1052 Q916 1056 920 1080 L924 1152 Z" fill="url(#ilShirt)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M864 1052 Q877 1064 890 1052" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
