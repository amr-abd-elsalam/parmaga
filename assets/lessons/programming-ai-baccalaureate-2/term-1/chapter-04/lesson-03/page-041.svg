<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">مشاهدات الصفحة PV</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Page Views (PV)</text>

<!-- Info card text -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مشاهدات الصفحة PV</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Page Views (PV)</text>
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">مشاهدات الصفحة</tspan> PV (Page Views):</tspan>
  <tspan x="935" dy="40">العدد الإجمالي لمرات فتح صفحات الموقع،</tspan>
  <tspan x="935" dy="40">بما فيها المرات <tspan font-weight="bold" fill="#17457f">المتكررة.</tspan></tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Page views</tspan> (PV): the total number of</tspan>
  <tspan x="140" dy="40">times the site's pages are opened,</tspan>
  <tspan x="140" dy="40">including <tspan font-weight="bold" fill="#17457f">repeated</tspan> times.</tspan>
</text>

<!-- Textbook definition -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> العدد الإجمالي</tspan>
  <tspan x="950" dy="40">لمرات مشاهدة الصفحة.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> the total number</tspan>
  <tspan x="120" dy="40">of times a page has been viewed.</tspan>
</text>

<!-- Example -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لو حدّث أحمد الصفحة 10 مرات، فهذه <tspan fill="#c96a1b">10 PV.</tspan></tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If Ahmed refreshes the page 10 times,</tspan>
  <tspan x="120" dy="40">that is <tspan fill="#c96a1b">10 PV.</tspan></tspan>
</text>
</svg>
