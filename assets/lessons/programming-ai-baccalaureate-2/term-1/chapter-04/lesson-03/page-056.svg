    <circle cx="636" cy="1111" r="3.5"/><circle cx="668" cy="1111" r="3.5"/><circle cx="700" cy="1111" r="3.5"/><circle cx="732" cy="1111" r="3.5"/><circle cx="764" cy="1111" r="3.5"/>
    <circle cx="652" cy="1094" r="3.5"/><circle cx="684" cy="1094" r="3.5"/><circle cx="716" cy="1094" r="3.5"/><circle cx="748" cy="1094" r="3.5"/>
    <circle cx="668" cy="1078" r="3.5"/><circle cx="700" cy="1078" r="3.5"/><circle cx="732" cy="1078" r="3.5"/>
