<!-- Header (Arabic) -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">حدود كل طريقة</tspan>
</text>

<!-- Header (English) -->
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Limits of Each Method</tspan>
</text>

<!-- Warning card 1 (Arabic) -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">حدّ الكمي:</tspan> الرقم وحده <tspan font-weight="bold" fill="#17457f">لا يفسّر السبب</tspan>.</tspan>
</text>

<!-- Warning card 1 (English) -->
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Limit of quantitative:</tspan> a number alone</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">does not explain the cause</tspan>.</tspan>
</text>

<!-- Warning card 2 (Arabic) -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">حدّ النوعي:</tspan> الملاحظة على خمسة أشخاص</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">لا تمثّل كل المستخدمين</tspan> بالضرورة.</tspan>
</text>

<!-- Warning card 2 (English) -->
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Limit of qualitative:</tspan> observing</tspan>
  <tspan x="140" dy="40">five people <tspan font-weight="bold" fill="#17457f">does not necessarily</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">represent all users</tspan>.</tspan>
</text>

<!-- Main idea box (Arabic) -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لذلك <tspan font-weight="bold" fill="#17457f">نجمع بينهما</tspan>: <tspan font-weight="bold" fill="#c0392b">الكمي</tspan> يغطي الكثيرين،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">والنوعي</tspan> يتعمق في القليلين.</tspan>
</text>

<!-- Main idea box (English) -->
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">So we <tspan font-weight="bold" fill="#17457f">combine them</tspan>: <tspan font-weight="bold" fill="#c0392b">quantitative</tspan></tspan>
  <tspan x="140" dy="40">covers many people, and <tspan font-weight="bold" fill="#c0392b">qualitative</tspan></tspan>
  <tspan x="140" dy="40">goes deep with a few.</tspan>
</text>
</svg>
