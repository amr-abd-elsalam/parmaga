<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">معدل الارتداد</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Bounce Rate</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معدل الارتداد</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Bounce Rate</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد</tspan> Bounce Rate، في تعريفه</tspan>
  <tspan x="935" dy="40">المبسط وهو تعريف الكتاب: نسبة الزيارات</tspan>
  <tspan x="935" dy="40">التي انتهت بعد مشاهدة <tspan font-weight="bold" fill="#17457f">الصفحة الأولى فقط.</tspan></tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce rate,</tspan> in its simple definition,</tspan>
  <tspan x="140" dy="40">which is the textbook definition:</tspan>
  <tspan x="140" dy="40">the proportion of visits that ended</tspan>
  <tspan x="140" dy="40">after viewing only the <tspan font-weight="bold" fill="#17457f">first page.</tspan></tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل كرة ضُربت في الحائط <tspan font-weight="bold" fill="#c0392b">فارتدت:</tspan></tspan>
  <tspan x="950" dy="40">لمست <tspan font-weight="bold" fill="#17457f">الصفحة الأولى،</tspan> ثم خرجت.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine a ball hitting a wall and</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">bouncing back:</tspan> it touched the <tspan font-weight="bold" fill="#17457f">first page</tspan></tspan>
  <tspan x="120" dy="40">and then left.</tspan>
</text>
</svg>
