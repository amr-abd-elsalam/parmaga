<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">لماذا نقيّم المواقع؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Why Do We Evaluate Websites?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أنك صممت <tspan font-weight="bold" fill="#c0392b">موقعًا إلكترونيًا</tspan> لمحل</tspan>
  <tspan x="950" dy="40">في حيّك، ونشرته على الإنترنت.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine you designed a <tspan font-weight="bold" fill="#c0392b">website</tspan></tspan>
  <tspan x="120" dy="40">for a shop in your neighborhood and</tspan>
  <tspan x="120" dy="40">published it online.</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صاحب المحل يسألك سؤالًا واحدًا:</tspan>
  <tspan x="950" dy="40">«هل الموقع <tspan font-weight="bold" fill="#17457f">ناجح؟»</tspan></tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The shop owner asks you one question:</tspan>
  <tspan x="120" dy="40">“Is the website <tspan font-weight="bold" fill="#17457f">successful?”</tspan></tspan>
</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لو أجبت «أيوه، شكله حلو!»</tspan>
  <tspan x="950" dy="40">فهذا <tspan font-weight="bold" fill="#17457f">رأي،</tspan> وليس <tspan font-weight="bold" fill="#c0392b">دليلًا.</tspan></tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If you answer “Yes, it looks nice!”,</tspan>
  <tspan x="120" dy="40">that is an <tspan font-weight="bold" fill="#17457f">opinion,</tspan> not <tspan font-weight="bold" fill="#c0392b">evidence.</tspan></tspan>
</text>
</svg>
