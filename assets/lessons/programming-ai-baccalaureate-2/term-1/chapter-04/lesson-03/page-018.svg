<!-- Texts in Layout order -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">واجهة المستخدم وتجربة المستخدم</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">UI and UX</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">واجهة المستخدم</tspan> UI: كل ما تراه وتتعامل</tspan>
  <tspan x="935" dy="40">معه على الشاشة، مثل الأزرار والقوائم</tspan>
  <tspan x="935" dy="40">والألوان والرسائل.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">User interface</tspan> (UI): everything you</tspan>
  <tspan x="140" dy="40">see and interact with on the screen,</tspan>
  <tspan x="140" dy="40">such as buttons, menus, colors,</tspan>
  <tspan x="140" dy="40">and messages.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تجربة المستخدم</tspan> UX: <tspan font-weight="bold" fill="#17457f">إحساسك</tspan> الكامل قبل</tspan>
  <tspan x="935" dy="40">الاستخدام وأثناءه وبعده.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">User experience</tspan> (UX): your whole</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">feeling</tspan> before, during, and after use.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل مطعمًا: <tspan font-weight="bold" fill="#c0392b">UI</tspan> هي شكل المطعم وترابيزاته،</tspan>
  <tspan x="950" dy="40">وUX هي <tspan font-weight="bold" fill="#17457f">إحساسك</tspan> وأنت خارج منه:</tspan>
  <tspan x="950" dy="40">هل ستعود أم لا؟</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine a restaurant: <tspan font-weight="bold" fill="#c0392b">UI</tspan> is how the</tspan>
  <tspan x="120" dy="40">restaurant and its tables look, and</tspan>
  <tspan x="120" dy="40">UX is <tspan font-weight="bold" fill="#17457f">how you feel</tspan> as you leave:</tspan>
  <tspan x="120" dy="40">will you come back or not?</tspan>
</text>
</svg>
