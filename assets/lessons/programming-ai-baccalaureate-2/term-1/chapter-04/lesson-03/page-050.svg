<!-- Text: Example 3 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال 3:</tspan> موقع كشري الزعيم استقبل <tspan fill="#c96a1b">2000</tspan> زيارة،</tspan>
  <tspan x="950" dy="40">وجاءت منها <tspan fill="#c96a1b">50</tspan> طلبية.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example 3:</tspan> the Al-Zaeem Koshary</tspan>
  <tspan x="120" dy="40">website received <tspan fill="#c96a1b">2000</tspan> visits, and <tspan fill="#c96a1b">50</tspan></tspan>
  <tspan x="120" dy="40">orders came from them.</tspan>
</text>

<!-- Text: formula strip -->
<text x="140" y="414" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">CVR = 50 ÷ 2000 × 100% = 2.5%</tspan>
</text>

<!-- Text: after fixing -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بعد <tspan font-weight="bold" fill="#17457f">تعديل الموقع:</tspan> 2000 زيارة و80 طلبية،</tspan>
  <tspan x="950" dy="40">فصار <tspan direction="ltr" unicode-bidi="embed">CVR = 80 ÷ 2000 × 100% = <tspan font-weight="bold" fill="#2e7d32">4%</tspan></tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">After <tspan font-weight="bold" fill="#17457f">fixing the website:</tspan></tspan>
  <tspan x="120" dy="40">2000 visits and 80 orders, so</tspan>
  <tspan x="120" dy="40">CVR = 80 ÷ 2000 × 100% = <tspan font-weight="bold" fill="#2e7d32">4%</tspan>.</tspan>
</text>

<!-- Text: Pause & Think box -->
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>
<text x="935" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">عدد الزيارات</tspan> لم يتغير، فما الذي تحسّن؟</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#17457f">number of visits</tspan> did not change,</tspan>
  <tspan x="140" dy="40">so what improved?</tspan>
</text>
</svg>
