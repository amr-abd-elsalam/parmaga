<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تعريف الكتاب:</tspan> مقارنة خيارين للتحقق</tspan>
  <tspan x="950" dy="40">من أيهما يؤدي إلى نتائج <tspan font-weight="bold" fill="#2e7d32">أفضل.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Textbook definition:</tspan> compare two options</tspan>
  <tspan x="120" dy="40">to verify which leads to <tspan font-weight="bold" fill="#2e7d32">better results.</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مثال:</tspan> نصف الزوار يرون زرًا أخضر</tspan>
  <tspan x="950" dy="40">عليه <tspan fill="#c96a1b">«اطلب الآن»،</tspan> والنصف الآخر يرون</tspan>
  <tspan x="950" dy="40">زرًا برتقاليًا عليه <tspan fill="#c96a1b">«جعان؟ اطلب!».</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Example:</tspan> half the visitors see a green</tspan>
  <tspan x="120" dy="40">button saying <tspan fill="#c96a1b">“Order Now”,</tspan> and the other</tspan>
  <tspan x="120" dy="40">half see an orange button saying</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">“Hungry? Order!”.</tspan></tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فخ امتحان:</tspan> اختبار A/B <tspan font-weight="bold" fill="#17457f">تقييم كمي؛</tspan></tspan>
  <tspan x="935" dy="40">فهو مسابقة بين توأمين،</tspan>
  <tspan x="935" dy="40">والحَكَم فيها هو الأرقام.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Exam trap:</tspan> A/B testing is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">quantitative;</tspan> it is a contest between</tspan>
  <tspan x="140" dy="40">twins, and the numbers are the judge.</tspan>
</text>
</svg>
