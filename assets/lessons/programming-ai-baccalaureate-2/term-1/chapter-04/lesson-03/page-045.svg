<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد</tspan> =</tspan>
  <tspan x="935" dy="40">(عدد الزيارات ذات الصفحة الواحدة ÷</tspan>
  <tspan x="935" dy="40">إجمالي الزيارات) × <tspan fill="#c96a1b">100%</tspan></tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce rate</tspan> =</tspan>
  <tspan x="140" dy="40">(number of one-page visits ÷</tspan>
  <tspan x="140" dy="40">total visits) × <tspan fill="#c96a1b">100%</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال 2: في مثال طلاب المدرسة،</tspan>
  <tspan x="950" dy="40">انتهت زيارة <tspan fill="#c96a1b">واحدة</tspan> من <tspan fill="#c96a1b">3</tspan> زيارات بعد صفحة واحدة.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example 2: in the school students example,</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">one</tspan> of the <tspan fill="#c96a1b">3</tspan> visits ended after one page.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد</tspan> = 1 ÷ 3 × 100% ≈ <tspan font-weight="bold" fill="#2e7d32">33%</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce rate</tspan> = 1 ÷ 3 × 100% ≈ <tspan font-weight="bold" fill="#2e7d32">33%</tspan></tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">اختبر نفسك</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">CHECK YOURSELF</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">موقع استقبل <tspan fill="#c96a1b">200</tspan> زيارة، منها <tspan fill="#c96a1b">50</tspan> زيارة</tspan>
  <tspan x="935" dy="40">انتهت بعد الصفحة الأولى.</tspan>
  <tspan x="935" dy="40">احسب معدل الارتداد.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A website received <tspan fill="#c96a1b">200</tspan> visits, and <tspan fill="#c96a1b">50</tspan></tspan>
  <tspan x="140" dy="40">of them ended after the first page.</tspan>
  <tspan x="140" dy="40">Calculate the bounce rate.</tspan>
</text>
</svg>
