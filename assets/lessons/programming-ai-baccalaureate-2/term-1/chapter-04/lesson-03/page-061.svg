<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">اكتب التعريفات هكذا في الامتحان</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">Write the Definitions</tspan>
  <tspan x="140" dy="40">Like This in the Exam</tspan>
</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">PV:</tspan> <tspan font-weight="bold" fill="#17457f">العدد الإجمالي</tspan> لمرات مشاهدة</tspan>
  <tspan x="935" dy="40">الصفحة، وليس عدد الأشخاص.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">PV:</tspan> the <tspan font-weight="bold" fill="#17457f">total number</tspan> of times</tspan>
  <tspan x="140" dy="40">a page has been viewed, not</tspan>
  <tspan x="140" dy="40">the number of people.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد:</tspan> نسبة الزيارات التي انتهت</tspan>
  <tspan x="935" dy="40">بعد مشاهدة <tspan font-weight="bold" fill="#17457f">الصفحة الأولى</tspan> فقط،</tspan>
  <tspan x="935" dy="40">وقد تختلف طريقة حسابه حسب الأداة.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce rate:</tspan> the proportion of visits</tspan>
  <tspan x="140" dy="40">that ended after viewing only</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">first page;</tspan> its calculation</tspan>
  <tspan x="140" dy="40">may differ by tool.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل التحويل:</tspan> نسبة الزيارات التي حققت</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#2e7d32">إجراءً مستهدفًا،</tspan> مثل الشراء أو التسجيل.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Conversion rate:</tspan> the proportion of</tspan>
  <tspan x="140" dy="40">visits that achieved a <tspan font-weight="bold" fill="#2e7d32">target action,</tspan></tspan>
  <tspan x="140" dy="40">such as a purchase or registration.</tspan>
</text>
</svg>
