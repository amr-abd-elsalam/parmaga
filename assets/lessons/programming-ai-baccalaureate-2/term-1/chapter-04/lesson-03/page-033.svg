<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أمثلة من المواقع</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Examples from Websites</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">تقويم</tspan><tspan> تختار منه التاريخ بدل كتابته يدويًا.</tspan></text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A <tspan font-weight="bold" fill="#17457f">calendar</tspan> to pick the date instead</tspan>
  <tspan x="132" dy="40">of typing it.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">سؤال: <tspan font-weight="bold" fill="#17457f">«هل أنت متأكد من الحذف؟»</tspan></text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A question: <tspan font-weight="bold" fill="#17457f">“Are you sure you want</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">to delete?”</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">زر «إرسال» يبقى <tspan font-weight="bold" fill="#c0392b">معطّلًا</tspan><tspan> حتى تكتمل البيانات.</tspan></text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The “Send” button stays <tspan font-weight="bold" fill="#c0392b">disabled</tspan></tspan>
  <tspan x="132" dy="40">until the data is complete.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">خانة رقم الموبايل لا تقبل إلا <tspan font-weight="bold" fill="#2e7d32">الأرقام.</tspan></text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The mobile number box accepts</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">only digits.</tspan></tspan>
</text>
