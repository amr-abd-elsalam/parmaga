<!-- Trap 4 (Arabic) -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">4 <tspan font-weight="bold" fill="#c0392b">الارتداد</tspan> = من خرج، <tspan font-weight="bold" fill="#c0392b">والتحويل</tspan> = من أنجز</tspan>
  <tspan x="935" dy="40">الإجراء؛ لا تخلط بينهما.</tspan>
</text>

<!-- Trap 4 (English) -->
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">4 <tspan font-weight="bold" fill="#c0392b">Bounce</tspan> = who left;</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">conversion</tspan> = who completed</tspan>
  <tspan x="140" dy="40">the action. Don't mix them up.</tspan>
</text>

<!-- Trap 5 (Arabic) -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">5 معدل <tspan font-weight="bold" fill="#c0392b">الارتداد المرتفع</tspan> ليس دائمًا سيئًا،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">والوقت الطويل</tspan> ليس دائمًا جيدًا.</tspan>
</text>

<!-- Trap 5 (English) -->
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">5 A <tspan font-weight="bold" fill="#c0392b">high bounce rate</tspan></tspan>
  <tspan x="140" dy="40">is not always bad, and a <tspan font-weight="bold" fill="#c0392b">long time</tspan></tspan>
  <tspan x="140" dy="40">is not always good.</tspan>
</text>

<!-- Trap 6 (Arabic) -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">6 <tspan font-weight="bold" fill="#c0392b">الرقم وحده</tspan> لا يفسّر السبب،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">وخمسة أشخاص</tspan> لا يمثّلون الجميع بالضرورة.</tspan>
</text>

<!-- Trap 6 (English) -->
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
