<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لذلك قد يقرأ الزائر <tspan font-weight="bold" fill="#17457f">مقالة كاملة</tspan></tspan>
  <tspan x="950" dy="40">في صفحة واحدة لمدة <tspan fill="#c96a1b">5 دقائق،</tspan> فلا تُحسب</tspan>
  <tspan x="950" dy="40">زيارته <tspan font-weight="bold" fill="#c0392b">ارتدادًا</tspan> في GA4.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So a visitor may read a <tspan font-weight="bold" fill="#17457f">full article</tspan></tspan>
  <tspan x="120" dy="40">on one page for <tspan fill="#c96a1b">5 minutes,</tspan> and the</tspan>
  <tspan x="120" dy="40">visit is not counted as a <tspan font-weight="bold" fill="#c0392b">bounce</tspan> in GA4.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معدل الارتداد المرتفع علامة تحتاج</tspan>
  <tspan x="935" dy="40">إلى فحص، وليس حكمًا نهائيًا.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">A high bounce rate is a sign that</tspan>
  <tspan x="140" dy="40">needs checking, not a final verdict.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">اكتبها هكذا في الامتحان</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">Write It Like This in the Exam</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد:</tspan> نسبة الزيارات التي انتهت</tspan>
  <tspan x="935" dy="40">بعد مشاهدة <tspan font-weight="bold" fill="#17457f">الصفحة الأولى فقط،</tspan> وقد تختلف</tspan>
  <tspan x="935" dy="40">طريقة حسابه حسب أداة التحليلات.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce rate:</tspan> the proportion of visits</tspan>
  <tspan x="140" dy="40">that ended after viewing only</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">first page;</tspan> its calculation</tspan>
  <tspan x="140" dy="40">method may differ depending on</tspan>
  <tspan x="140" dy="40">the analytics tool.</tspan>
</text>
</svg>
