<!-- Texts in Layout order -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">قابلية الاستخدام</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Usability</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مدى <tspan font-weight="bold" fill="#c0392b">سهولة استخدام</tspan> المنتج ليحقق المستخدم</tspan>
  <tspan x="935" dy="40">هدفه بفاعلية وكفاءة ورضا.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">How easily</tspan> a product can be used so</tspan>
  <tspan x="140" dy="40">the user reaches their goal</tspan>
  <tspan x="140" dy="40">effectively, efficiently, and</tspan>
  <tspan x="140" dy="40">with satisfaction.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ببساطة: هل يستطيع الزبون أن يطلب <tspan fill="#c96a1b">الكشري</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بسرعة،</tspan> دون أن يتوه، ودون أن يتضايق؟</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Simply put: can the customer order</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">koshary</tspan> <tspan font-weight="bold" fill="#17457f">quickly,</tspan> without getting lost,</tspan>
  <tspan x="120" dy="40">and without getting annoyed?</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تذكّرها <tspan font-weight="bold" fill="#17457f">بثلاث كلمات:</tspan><tspan> ينجح، بسرعة، ومبسوط.</tspan></text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Remember it in <tspan font-weight="bold" fill="#17457f">three words:</tspan></tspan>
  <tspan x="120" dy="40">succeeds, quickly, and happily.</tspan>
</text>

<text x="895" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">ينجح</text>
<text x="797" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Succeeds</text>
<text x="743" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">بسرعة</text>
<text x="645" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Quickly</text>
<text x="258" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مبسوط</text>
<text x="155" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Happily</text>
</svg>
