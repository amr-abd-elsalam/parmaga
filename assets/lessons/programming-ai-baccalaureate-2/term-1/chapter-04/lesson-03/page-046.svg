<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Extra Insight</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يختلف تعريف <tspan font-weight="bold" fill="#c0392b">معدل الارتداد</tspan> بين الأدوات:</tspan>
  <tspan x="935" dy="40">في الأداة القديمة <tspan font-weight="bold" fill="#17457f">Universal Analytics</tspan> كان</tspan>
  <tspan x="935" dy="40">يُحسب على أساس الزيارات ذات الصفحة الواحدة.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The definition of <tspan font-weight="bold" fill="#c0392b">bounce rate</tspan> differs</tspan>
  <tspan x="140" dy="40">between tools: in the older tool,</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">Universal Analytics,</tspan> it was calculated</tspan>
  <tspan x="140" dy="40">from one-page visits.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">أما في <tspan font-weight="bold" fill="#17457f">Google Analytics 4</tspan> فهو نسبة</tspan>
  <tspan x="935" dy="40">الزيارات <tspan font-weight="bold" fill="#c0392b">غير المتفاعلة.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In <tspan font-weight="bold" fill="#17457f">Google Analytics 4,</tspan> it is the</tspan>
  <tspan x="140" dy="40">proportion of visits that were</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">not engaged.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الزيارة المتفاعلة في GA4</tspan>
  <tspan x="950" dy="40">(يكفي شرط واحد)</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">An Engaged Visit in GA4</tspan>
  <tspan x="120" dy="40">(one condition is enough)</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">استمرت أكثر من <tspan fill="#c96a1b">10 ثوانٍ.</tspan></text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">It lasted longer than <tspan fill="#c96a1b">10 seconds.</tspan></text>

<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">شاهد فيها المستخدم <tspan font-weight="bold" fill="#17457f">صفحتين أو أكثر.</tspan></text>
<text x="132" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">The user viewed <tspan font-weight="bold" fill="#17457f">2 or more pages.</tspan></text>

<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">حدث فيها <tspan font-weight="bold" fill="#17457f">إجراء مستهدف.</tspan></text>
<text x="132" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">A <tspan font-weight="bold" fill="#17457f">target action</tspan><tspan> happened.</tspan></text>
</svg>
