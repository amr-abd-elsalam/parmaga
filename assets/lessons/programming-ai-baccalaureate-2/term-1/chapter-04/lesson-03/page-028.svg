<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">ميزاته</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">Its Strengths</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">سريع وقليل التكلفة،</tspan> ويمكن إجراؤه</tspan>
  <tspan x="935" dy="40">حتى قبل نشر الموقع.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Fast and low-cost,</tspan> and it can be done</tspan>
  <tspan x="140" dy="40">even before the website is published.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">حدوده</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Its Limits</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يعتمد على <tspan font-weight="bold" fill="#17457f">خبرة المراجع،</tspan> وقد يفوته</tspan>
  <tspan x="935" dy="40">ما لا يكتشفه إلا <tspan font-weight="bold" fill="#c0392b">المستخدم الحقيقي.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It depends on the reviewer's</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">experience,</tspan> and it may miss what only</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#c0392b">real user</tspan> would discover.</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لذلك يُستخدم التقييم الإرشادي إلى جانب</tspan>
  <tspan x="935" dy="40">اختبار قابلية الاستخدام، لا بدلًا منه.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">So heuristic evaluation is used</tspan>
  <tspan x="140" dy="40">alongside usability testing,</tspan>
  <tspan x="140" dy="40">not instead of it.</tspan>
</text>
</svg>
