<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 3: الجمع بمثال</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 3: Combine with an Example</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثلًا: إذا كان PV مرتفعًا ومعدل التحويل</tspan>
  <tspan x="950" dy="40">منخفضًا، فالأرقام تحدد <tspan font-weight="bold" fill="#17457f">مكان المشكلة،</tspan></tspan>
  <tspan x="950" dy="40">واختبار قابلية الاستخدام يكشف <tspan font-weight="bold" fill="#17457f">سببها،</tspan></tspan>
  <tspan x="950" dy="40">كأن يكون <tspan fill="#c96a1b">زر الشراء</tspan> غير واضح.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">For example: if PV is high and the</tspan>
  <tspan x="120" dy="40">conversion rate is low, the numbers</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">locate the problem,</tspan> and usability</tspan>
  <tspan x="120" dy="40">testing reveals its <tspan font-weight="bold" fill="#17457f">cause,</tspan> such as an</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">unclear buy button.</tspan></tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بعد الإصلاح نقيس الأرقام <tspan font-weight="bold" fill="#17457f">مرة أخرى</tspan></tspan>
  <tspan x="950" dy="40">للتأكد من <tspan font-weight="bold" fill="#2e7d32">التحسن.</tspan></tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">After the fix, we measure the numbers</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">again</tspan> to confirm the <tspan font-weight="bold" fill="#2e7d32">improvement.</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لذلك يعطي الجمع بينهما <tspan font-weight="bold" fill="#2e7d32">أدق</tspan> صورة.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Therefore, combining both gives</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#2e7d32">most accurate</tspan> picture.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كم + حدوده، ليه + حدوده، مثال يجمعهم.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">How much + its limit,</tspan>
  <tspan x="140" dy="40">why + its limit,</tspan>
  <tspan x="140" dy="40">an example that joins them.</tspan>
</text>
</svg>
