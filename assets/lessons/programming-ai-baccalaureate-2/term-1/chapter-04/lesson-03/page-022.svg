<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">التفكير بصوت عالٍ</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Think Aloud</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التفكير بصوت عالٍ</tspan> Think Aloud: يقول</tspan>
  <tspan x="935" dy="40">المستخدم <tspan font-weight="bold" fill="#17457f">كل ما يفكر فيه</tspan> أثناء الاستخدام،</tspan>
  <tspan x="935" dy="40">مثل: <tspan fill="#c96a1b">«بدوّر على زر الدفع… مش لاقيه!»</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Think aloud:</tspan> the user says</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">everything they think</tspan> while using the</tspan>
  <tspan x="140" dy="40">site, like: <tspan fill="#c96a1b">“I'm looking for the pay</tspan></tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">button… I can't find it!”</tspan></tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فخ امتحان:</tspan> اختبار قابلية الاستخدام</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">تقييم نوعي،</tspan> رغم كلمة «اختبار».</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Exam trap:</tspan> usability testing is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">qualitative,</tspan> despite the</tspan>
  <tspan x="140" dy="40">word “testing.”</tspan>
</text>
</svg>
