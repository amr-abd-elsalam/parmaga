<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">أدوات التقييم النوعي</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Qualitative Evaluation Tools</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذه أدوات كريم: طرق نعرف بها</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">«لماذا»</tspan> من الناس أنفسهم.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">These are Karim's tools: ways to learn</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">“why”</tspan> from people themselves.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">اختبار قابلية الاستخدام</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Usability Testing</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اختبار قابلية الاستخدام Usability Testing:</tspan>
  <tspan x="935" dy="40">يُطلب من <tspan font-weight="bold" fill="#17457f">مستخدمين حقيقيين</tspan> تنفيذ مهام</tspan>
  <tspan x="935" dy="40">محددة على الموقع، بينما <tspan font-weight="bold" fill="#17457f">يراقبهم الباحث</tspan></tspan>
  <tspan x="935" dy="40">ويسجّل أين يتعثرون.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Usability testing: <tspan font-weight="bold" fill="#17457f">real users</tspan></tspan>
  <tspan x="140" dy="40">are asked to perform specific tasks</tspan>
  <tspan x="140" dy="40">on the website while a <tspan font-weight="bold" fill="#17457f">researcher</tspan></tspan>
  <tspan x="140" dy="40">watches them and records</tspan>
  <tspan x="140" dy="40">where they struggle.</tspan>
</text>
</svg>
