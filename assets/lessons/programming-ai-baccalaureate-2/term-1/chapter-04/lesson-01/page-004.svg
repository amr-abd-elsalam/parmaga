<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">رايح بس ولا رايح جاي؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">One Way or Both Ways?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">جرّب مع زميلك: كلام <tspan font-weight="bold" fill="#17457f">بلا رد،</tspan></tspan>
  <tspan x="950" dy="40">ثم كلام مع <tspan font-weight="bold" fill="#2e7d32">أسئلة.</tspan> لاحظ الفرق!</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Try it: talk with <tspan font-weight="bold" fill="#17457f">no replies,</tspan> then</tspan>
  <tspan x="120" dy="40">with <tspan font-weight="bold" fill="#2e7d32">questions.</tspan> Notice the difference!</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">اتجاه واحد</tspan> One-way: المعلومة تذهب</tspan>
  <tspan x="935" dy="40">من المرسل إلى المتلقي <tspan font-weight="bold" fill="#17457f">فقط.</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">One-way:</tspan> information goes from sender</tspan>
  <tspan x="140" dy="40">to receiver <tspan font-weight="bold" fill="#17457f">only.</tspan></tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">اتجاهين</tspan> Two-way: المتلقي يرد ويشارك</tspan>
  <tspan x="935" dy="40">ويتفاعل Interaction، فيصبح <tspan font-weight="bold" fill="#2e7d32">مرسلًا</tspan> أيضًا.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Two-way:</tspan> the receiver responds,</tspan>
  <tspan x="140" dy="40">shares, and interacts,</tspan>
  <tspan x="140" dy="40">becoming a <tspan font-weight="bold" fill="#2e7d32">sender</tspan> too.</tspan>
</text>
</svg>
