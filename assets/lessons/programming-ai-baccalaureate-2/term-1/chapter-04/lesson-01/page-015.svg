<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الشركات تفعل الشيء نفسه</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Companies Do the Same</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لاحظت؟ لم تستخدم وسيلة واحدة.</tspan>
  <tspan x="950" dy="40">هذا هو <tspan font-weight="bold" fill="#c0392b">الجمع بين الوسائط</tspan> Combining media.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Notice? You did not use only one medium.</tspan>
  <tspan x="120" dy="40">This is <tspan font-weight="bold" fill="#c0392b">combining media</tspan>.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: <tspan fill="#c96a1b">إعلان تلفزيوني</tspan> يوجّهك إلى موقع،</tspan>
  <tspan x="950" dy="40">والموقع يشجّعك على المشاركة في وسائل التواصل.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: a <tspan fill="#c96a1b">TV ad</tspan> sends you</tspan>
  <tspan x="120" dy="40">to a website, and the website</tspan>
  <tspan x="120" dy="40">encourages you to share on SNS.</tspan>
</text>

<text x="905" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">انتشار</text>
<text x="818" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Reach</text>
<text x="578" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">عمق</text>
<text x="512" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Depth</text>
<text x="291" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مشاركة</text>
<text x="186" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Sharing</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كل وسيلة تقوم بما تُجيده،</tspan>
  <tspan x="935" dy="40">والكل <tspan font-weight="bold" fill="#2e7d32">يكمّل بعضه.</tspan></tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Each medium does what it does best,</tspan>
  <tspan x="140" dy="40">and together they <tspan font-weight="bold" fill="#2e7d32">complete each other.</tspan></tspan>
</text>
</svg>
