<!-- 1. Update -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التحديث</tspan> Update: تعديل المعلومة أو إضافة</tspan>
  <tspan x="950" dy="40">جديد إليها بعد نشرها.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Update:</tspan> changing information or adding</tspan>
  <tspan x="120" dy="40">something new after publishing.</tspan>
</text>

<!-- 2. Coverage -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التغطية</tspan> Coverage: المنطقة التي تصل إليها</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">إشارة البث،</tspan> ويلتقطها</tspan>
  <tspan x="950" dy="40">جهاز الاستقبال Receiving device.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Coverage:</tspan> the area a <tspan font-weight="bold" fill="#17457f">broadcast signal</tspan></tspan>
  <tspan x="120" dy="40">reaches, picked up by a receiving device.</tspan>
</text>

<!-- 3. Printed medium -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسيلة المطبوعة</tspan> Printed medium: وسيلة</tspan>
  <tspan x="950" dy="40">موجودة على <tspan font-weight="bold" fill="#17457f">الورق</tspan> تمسكها بيدك.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Printed medium:</tspan> a medium on <tspan font-weight="bold" fill="#17457f">paper</tspan> that</tspan>
  <tspan x="120" dy="40">you can hold in your hand.</tspan>
</text>

<!-- 4. Web page -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">صفحة الويب</tspan> Web page: مستند واحد</tspan>
  <tspan x="950" dy="40">داخل الموقع، والموقع مجموعة صفحات <tspan font-weight="bold" fill="#17457f">مترابطة.</tspan></tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Web page:</tspan> one document inside a website;</tspan>
  <tspan x="120" dy="40">a website is a set of <tspan font-weight="bold" fill="#17457f">linked</tspan> pages.</tspan>
</text>

<!-- 5. Web app -->
<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تطبيق الويب</tspan> Web app: موقع يعمل كبرنامج</tspan>
  <tspan x="950" dy="40">تفاعلي في <tspan font-weight="bold" fill="#17457f">المتصفح،</tspan> وبعضه يمكن تثبيته.</tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Web app:</tspan> a website that works like</tspan>
  <tspan x="120" dy="40">an interactive program in the <tspan font-weight="bold" fill="#17457f">browser;</tspan></tspan>
  <tspan x="120" dy="40">some can be installed.</tspan>
</text>
</svg>
