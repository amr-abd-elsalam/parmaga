<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Exam Traps</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">كلمات الإعدام</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">KILLER WORDS</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«دائمًا»، «فقط»، «بغض النظر»، «تلقائيًا»:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">كلمات</tspan> تجعل الاختيار غالبًا <tspan font-weight="bold" fill="#c0392b">خطأ.</tspan></tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Always," "only," "regardless,"</tspan>
  <tspan x="140" dy="40">"automatically": <tspan font-weight="bold" fill="#17457f">words</tspan> that usually</tspan>
  <tspan x="140" dy="40">make an option <tspan font-weight="bold" fill="#c0392b">wrong.</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«الراديو ينقل فيديو» أو</tspan>
  <tspan x="950" dy="40">«التلفزيون اتجاهين»: <tspan font-weight="bold" fill="#c0392b">خطأ.</tspan></tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">"Radio carries video" or</tspan>
  <tspan x="132" dy="40">"TV is two-way": <tspan font-weight="bold" fill="#c0392b">wrong.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«الصحف الأسرع انتشارًا» <tspan font-weight="bold" fill="#c0392b">خطأ:</tspan></tspan>
  <tspan x="950" dy="40">الأسرع <tspan font-weight="bold" fill="#2e7d32">وسائل التواصل.</tspan></tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">"Newspapers spread fastest" is <tspan font-weight="bold" fill="#c0392b">wrong:</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">SNS</tspan> is fastest.</tspan>
</text>

<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«الموقع يصل تلقائيًا» أو</tspan>
  <tspan x="950" dy="40">«يعمل عادةً دون إنترنت»: <tspan font-weight="bold" fill="#c0392b">خطأ.</tspan></tspan>
</text>
<text x="132" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">"A website reaches users automatically"</tspan>
  <tspan x="132" dy="40">or "normally works offline": <tspan font-weight="bold" fill="#c0392b">wrong.</tspan></tspan>
</text>
</svg>
