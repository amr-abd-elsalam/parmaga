  <circle cx="26" cy="26" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M15 27 L23 35 L38 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">نقطة + سبب = درجتين</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Point + Reason = 2 Marks</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لماذا تستخدم مؤسسة موقعًا وتلفزيونًا</tspan>
  <tspan x="950" dy="40">ووسائل تواصل <tspan font-weight="bold" fill="#17457f">معًا؟</tspan> [6 درجات]</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Why use a website, TV, and SNS <tspan font-weight="bold" fill="#17457f">together?</tspan></tspan>
  <tspan x="120" dy="40">[6 marks]</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">التلفزيون <tspan font-weight="bold" fill="#17457f">للانتشار الواسع،</tspan> لأنه يصل إلى</tspan>
  <tspan x="950" dy="40">عدد كبير جدًا في وقت واحد.</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">TV for <tspan font-weight="bold" fill="#17457f">wide reach,</tspan> because it reaches</tspan>
  <tspan x="132" dy="40">very many people at once.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الموقع <tspan font-weight="bold" fill="#17457f">للعمق،</tspan> لأنه يعرض التفاصيل الكاملة</tspan>
  <tspan x="950" dy="40">في أي وقت ويمكن تحديثه.</tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A website for <tspan font-weight="bold" fill="#17457f">depth,</tspan> because it shows</tspan>
  <tspan x="132" dy="40">full, updatable details any time.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وسائل التواصل <tspan font-weight="bold" fill="#17457f">للتناقل الشفهي،</tspan> لأن</tspan>
  <tspan x="950" dy="40">المستخدمين يشاركون المعلومة ويتفاعلون.</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">SNS for <tspan font-weight="bold" fill="#17457f">word of mouth,</tspan> because users</tspan>
  <tspan x="132" dy="40">share the information and interact.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">والخاتمة:</tspan> لا توجد وسيلة هي الأفضل لكل غرض،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#2e7d32">فالجمع</tspan> يجعل كل وسيلة تقوم بما تُجيده.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Conclusion:</tspan> no medium is best for</tspan>
  <tspan x="140" dy="40">everything, so <tspan font-weight="bold" fill="#2e7d32">combine</tspan> them.</tspan>
</text>
</svg>
