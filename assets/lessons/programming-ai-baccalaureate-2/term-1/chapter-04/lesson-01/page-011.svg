<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الدفع والسحب</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Push and Pull</text>

<!-- Intro paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">المعلومة تصلك بطريقتين:</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Information reaches you in two ways:</tspan>
</text>

<!-- Info card header -->
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Push -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الدفع Push:</tspan> المعلومة تأتي إليك</tspan>
  <tspan x="935" dy="40">دون أن تطلبها، مثل <tspan fill="#c96a1b">التلفزيون</tspan></tspan>
  <tspan x="935" dy="40">والإشعارات Notifications.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Push:</tspan> information comes to</tspan>
  <tspan x="140" dy="40">you without asking, like <tspan fill="#c96a1b">TV</tspan></tspan>
  <tspan x="140" dy="40">and notifications.</tspan>
</text>

<!-- Pull -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">السحب Pull:</tspan> أنت الذي تذهب إلى</tspan>
  <tspan x="935" dy="40">المعلومة، مثل فتح موقع.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Pull:</tspan> you go to the information,</tspan>
  <tspan x="140" dy="40">like opening a website.</tspan>
</text>

<!-- Success card -->
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">معلومة تميّزك:</tspan> الموقع يستطيع أن يقترب</tspan>
  <tspan x="935" dy="40">من الدفع بالإشعارات، ويعمل جزئيًا دون</tspan>
  <tspan x="935" dy="40">اتصال <tspan font-weight="bold" fill="#17457f">بالتخزين المؤقت</tspan> Cache.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Bonus fact:</tspan> a website can act like</tspan>
  <tspan x="140" dy="40">push with notifications, and work</tspan>
  <tspan x="140" dy="40">partly <tspan font-weight="bold" fill="#17457f">offline</tspan> with <tspan font-weight="bold" fill="#17457f">caching.</tspan></tspan>
</text>
</svg>
