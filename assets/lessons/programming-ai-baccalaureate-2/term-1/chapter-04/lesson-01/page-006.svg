<!-- Page titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">شخصيات الوسائط 2:</tspan>
  <tspan x="540" dy="48">الصحيفة والموقع</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Media Characters 2: Newspaper and Website</text>

<!-- Card 1 texts -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الصحيفة Newspaper: الجد الحكيم</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Newspaper: The Wise Grandpa</tspan>
</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">ورق مطبوع</tspan> تقرؤه دون إنترنت،</tspan>
  <tspan x="935" dy="40">لكنه لا يتغير بعد الطباعة. <tspan font-weight="bold" fill="#17457f">اتجاه واحد.</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Printed paper</tspan> you read</tspan>
  <tspan x="140" dy="40">without Internet, but it cannot</tspan>
  <tspan x="140" dy="40">change after printing. <tspan font-weight="bold" fill="#17457f">One-way.</tspan></tspan>
</text>

<!-- Card 2 texts -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الموقع الإلكتروني Website:</tspan>
  <tspan x="935" dy="40">المكتبة المفتوحة 24 ساعة</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Website: The Library Open 24 Hours</tspan>
</text>
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">صفحات ويب مترابطة</tspan> فيها نص وصور وصوت</tspan>
  <tspan x="935" dy="40">وفيديو، تُحدَّث في أي وقت، <tspan font-weight="bold" fill="#2e7d32">وتسمح بالتفاعل.</tspan></tspan>
  <tspan x="935" dy="40">لكنها تحتاج غالبًا إلى اتصال.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Linked web pages</tspan> with text, images,</tspan>
  <tspan x="140" dy="40">audio, and video; updated any time</tspan>
  <tspan x="140" dy="40">and <tspan font-weight="bold" fill="#2e7d32">interactive,</tspan> but usually needs</tspan>
  <tspan x="140" dy="40">a connection.</tspan>
</text>
