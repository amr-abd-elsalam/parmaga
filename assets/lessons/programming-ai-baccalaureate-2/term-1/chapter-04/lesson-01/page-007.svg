<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">شخصيات الوسائط 3:</tspan>
  <tspan x="540" dy="48">وسائل التواصل الاجتماعي</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Media Characters 3: SNS</text>

<!-- Info card: header -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">وسائل التواصل SNS: الجار اللي</tspan>
  <tspan x="935" dy="40">الخبر عنده بيلف الشارع</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">SNS: The Neighbor Who Spreads</tspan>
  <tspan x="140" dy="40">News Down the Street</tspan>
</text>

<!-- Info card: paragraph -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">SNS</tspan> (Social Networking Services)&#x200E;:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">أسرع وسيلة</tspan> في نشر المعلومة، والكل فيها</tspan>
  <tspan x="935" dy="40">ينشر ويشارك ويرد: <tspan font-weight="bold" fill="#17457f">اتجاهين.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">SNS</tspan> (Social Networking Services):</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">the fastest</tspan> at spreading</tspan>
  <tspan x="140" dy="40">information; everyone posts, shares,</tspan>
  <tspan x="140" dy="40">and replies: <tspan font-weight="bold" fill="#17457f">two-way.</tspan></tspan>
</text>

<!-- Warning card: paragraph -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه:</tspan> الأسرع ليس دائمًا الأدق.</tspan>
  <tspan x="935" dy="40">تأكّد من <tspan font-weight="bold" fill="#2e7d32">مصدر الخبر</tspan> قبل أن تشاركه.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Careful:</tspan> the fastest is not always</tspan>
  <tspan x="140" dy="40">the most accurate. Check <tspan font-weight="bold" fill="#2e7d32">the source</tspan></tspan>
  <tspan x="140" dy="40">before you share.</tspan>
</text>
</svg>
