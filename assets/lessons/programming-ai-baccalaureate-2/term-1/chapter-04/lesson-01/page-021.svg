<!-- 1. Form -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">النموذج</tspan> Form: خانات في <tspan font-weight="bold" fill="#17457f">صفحة الويب</tspan></tspan>
  <tspan x="950" dy="40">تملؤها وترسلها.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Form:</tspan> fields on a <tspan font-weight="bold" fill="#17457f">web page</tspan></tspan>
  <tspan x="120" dy="40">that you fill in and send.</tspan>
</text>

<!-- 2. Comments -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التعليقات</tspan> Comments: ردود يكتبها</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">المستخدمون</tspan> تحت المحتوى.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Comments:</tspan> replies <tspan font-weight="bold" fill="#17457f">users</tspan> write</tspan>
  <tspan x="120" dy="40">under the content.</tspan>
</text>

<!-- 3. Sharing -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المشاركة</tspan> Sharing: <tspan font-weight="bold" fill="#17457f">إعادة نشر محتوى</tspan></tspan>
  <tspan x="950" dy="40">ليراه آخرون.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Sharing:</tspan> <tspan font-weight="bold" fill="#17457f">posting content again</tspan></tspan>
  <tspan x="120" dy="40">so others can see it.</tspan>
</text>

<!-- 4. Offline -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">دون اتصال</tspan> Offline: عمل الجهاز أو المحتوى</tspan>
  <tspan x="950" dy="40">دون اتصال <tspan font-weight="bold" fill="#17457f">بالشبكة.</tspan></tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Offline:</tspan> a device or content working</tspan>
  <tspan x="120" dy="40">without a <tspan font-weight="bold" fill="#17457f">network connection.</tspan></tspan>
</text>

<!-- 5. Loading speed -->
<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">سرعة التحميل</tspan> Loading speed: الوقت الذي</tspan>
  <tspan x="950" dy="40">تستغرقه الصفحة لتظهر، وتتأثر</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">ببيئة الشبكة</tspan> Network environment،</tspan>
  <tspan x="950" dy="40">أي قوة الاتصال وسرعته.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Loading speed:</tspan> the time a page takes</tspan>
  <tspan x="120" dy="40">to appear; it depends on the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">network environment,</tspan> meaning the</tspan>
  <tspan x="120" dy="40">strength and speed of the connection.</tspan>
</text>
</svg>
