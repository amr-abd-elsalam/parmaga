<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">يعني إيه «وسيلة»؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">What Is a "Medium"?</text>

<text x="918" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">المرسل</text>
<text x="822" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Sender</text>
<text x="660" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الرسالة</text>
<text x="552" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Message</text>
<text x="480" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الوسيلة</text>
<text x="378" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Medium</text>
<text x="262" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">المتلقي</text>
<text x="146" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Receiver</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسيلة Medium:</tspan> الطريق الذي تمشي فيه</tspan>
  <tspan x="935" dy="40">المعلومة من المرسل إلى المتلقي،</tspan>
  <tspan x="935" dy="40">وجمعها <tspan font-weight="bold" fill="#17457f">الوسائط</tspan> Media.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Medium:</tspan> the path information</tspan>
  <tspan x="140" dy="40">travels from sender to receiver;</tspan>
  <tspan x="140" dy="40">its plural is <tspan font-weight="bold" fill="#17457f">media.</tspan></tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">المرسل</tspan> Sender يُنتج الرسالة Message،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">والمتلقي</tspan> Receiver تصل إليه.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#17457f">sender</tspan> creates the message,</tspan>
  <tspan x="140" dy="40">and the <tspan font-weight="bold" fill="#17457f">receiver</tspan> gets it.</tspan>
</text>
</svg>
