<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">مهمة عاجلة:</tspan>
  <tspan x="540" dy="48">بلّغ المدرسة كلها!</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Urgent Mission: Tell the Whole School!</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أن الامتحان <tspan font-weight="bold" fill="#c0392b">تأجّل</tspan> أسبوعًا،</tspan>
  <tspan x="950" dy="40">ويجب أن تعرف <tspan font-weight="bold" fill="#17457f">المدرسة كلها</tspan> اليوم.</tspan>
  <tspan x="950" dy="40">ماذا ستستخدم؟</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Imagine the exam is <tspan font-weight="bold" fill="#c0392b">postponed</tspan> by a week,</tspan>
  <tspan x="120" dy="40">and the <tspan font-weight="bold" fill="#17457f">whole school</tspan> must know today.</tspan>
  <tspan x="120" dy="40">What would you use?</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّف وفكّر</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PAUSE &amp; THINK</text>
<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">هل سيعرف الطالب الغائب اليوم بالخبر</tspan>
  <tspan x="935" dy="40">من <tspan font-weight="bold" fill="#17457f">الإذاعة المدرسية؟</tspan></tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">Will a student who is absent today</tspan>
  <tspan x="140" dy="40">hear the news from the <tspan font-weight="bold" fill="#17457f">school radio?</tspan></tspan>
</text>
</svg>
