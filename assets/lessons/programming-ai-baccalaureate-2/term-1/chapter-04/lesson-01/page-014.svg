<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فرح أخوك: هتعزم الناس إزاي؟</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">Your Brother's Wedding:</tspan>
  <tspan x="540" dy="36">How Will You Invite People?</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أخوك سيتزوج. كيف <tspan font-weight="bold" fill="#17457f">ستدعو</tspan> الناس؟</tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Your brother is getting married.</tspan>
  <tspan x="120" dy="40">How will you <tspan font-weight="bold" fill="#17457f">invite</tspan> people?</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كارت مطبوع للأقارب الكبار:</tspan>
  <tspan x="950" dy="40">مثل <tspan font-weight="bold" fill="#c0392b">الصحيفة،</tspan> ورق بلا إنترنت.</tspan>
</text>

<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A printed card for older relatives:</tspan>
  <tspan x="132" dy="40">like a <tspan font-weight="bold" fill="#c0392b">newspaper,</tspan> paper with no Internet.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مجموعة العائلة: <tspan font-weight="bold" fill="#c0392b">وسائل تواصل،</tspan></tspan>
  <tspan x="950" dy="40">والخبر ينتشر <tspan font-weight="bold" fill="#17457f">بالمشاركة.</tspan></tspan>
</text>

<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The family group chat: <tspan font-weight="bold" fill="#c0392b">SNS,</tspan></tspan>
  <tspan x="132" dy="40">and news spreads by <tspan font-weight="bold" fill="#17457f">sharing.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صفحة فيها الموعد والخريطة والصور:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">موقع،</tspan> وتفاصيل متاحة في أي وقت.</tspan>
</text>

<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A page with the time, map, and photos:</tspan>
  <tspan x="132" dy="40">a <tspan font-weight="bold" fill="#c0392b">website,</tspan> with details any time.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">رسالة خاصة لمدير والدك:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">رسالة مباشرة،</tspan> وتوصيل <tspan font-weight="bold" fill="#17457f">فردي.</tspan></tspan>
</text>

<text x="132" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A private message</tspan>
  <tspan x="132" dy="40">to your father's manager:</tspan>
  <tspan x="132" dy="40">a <tspan font-weight="bold" fill="#c0392b">direct message,</tspan> <tspan font-weight="bold" fill="#17457f">individual</tspan> delivery.</tspan>
</text>
</svg>
