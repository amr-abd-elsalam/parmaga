<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الموقع أبو 4 ميمات</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Website Strengths in Four Words</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نقاط قوة الموقع تبدأ كلها بحرف <tspan font-weight="bold" fill="#c0392b">الميم:</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">All four strengths start with</tspan>
  <tspan x="120" dy="40">the Arabic letter <tspan font-weight="bold" fill="#c0392b">م:</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">منوّع:</tspan> نص وصور وصوت وفيديو معًا.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">Diverse:</tspan> text, images, audio,</tspan>
  <tspan x="132" dy="40">and video together.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 <tspan font-weight="bold" fill="#c0392b">محدَّث:</tspan> تغيّر المعلومة في أي وقت.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 <tspan font-weight="bold" fill="#c0392b">Updatable:</tspan> change information</tspan>
  <tspan x="132" dy="40">at any time.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 <tspan font-weight="bold" fill="#c0392b">مفتوح للعالم:</tspan> من أي مكان</tspan>
  <tspan x="950" dy="40">فيه اتصال مناسب.</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 <tspan font-weight="bold" fill="#c0392b">Open to the world,</tspan></tspan>
  <tspan x="132" dy="40">with a suitable connection.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 <tspan font-weight="bold" fill="#c0392b">متفاعل:</tspan> يرد عليك بالنماذج Forms</tspan>
  <tspan x="950" dy="40">والتعليقات Comments.</tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 <tspan font-weight="bold" fill="#c0392b">Interactive:</tspan> responds through</tspan>
  <tspan x="132" dy="40">forms and comments.</tspan>
</text>

<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المتصفح</tspan> <tspan font-weight="bold" fill="#c0392b">Browser:</tspan> البرنامج الذي تفتح به</tspan>
  <tspan x="950" dy="40">المواقع، دون تثبيت تطبيق خاص.</tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Browser:</tspan> the program that opens</tspan>
  <tspan x="120" dy="40">websites, with no special app needed.</tspan>
</text>
</svg>
