  <circle cx="40" cy="13" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: speaker (Multimedia) -->
<g transform="translate(882 1172)">
  <polygon points="8,24 20,24 34,12 34,52 20,40 8,40" fill="#22303f" opacity=".18"/>
  <polygon points="4,18 16,18 30,6 30,46 16,34 4,34" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M38 18 Q 44 26 38 34 M45 11 Q 55 26 45 41" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قاموس الدرس</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Lesson Dictionary</text>

<!-- 1. Information -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المعلومات</tspan> Information: المحتوى الذي يُنقل،</tspan>
  <tspan x="950" dy="40">مثل النص والصورة والصوت والفيديو.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Information:</tspan> the content being carried,</tspan>
  <tspan x="120" dy="40">such as text, images, audio, and video.</tspan>
</text>

<!-- 2. Characteristics -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخصائص</tspan> Characteristics: الصفات التي تميّز</tspan>
  <tspan x="950" dy="40">الوسيلة: ما تنقله، واتجاهها، وانتشارها.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Characteristics:</tspan> the features of</tspan>
  <tspan x="120" dy="40">a medium: what it carries, its</tspan>
  <tspan x="120" dy="40">direction, and its reach.</tspan>
</text>

<!-- 3. Strengths -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">نقاط القوة</tspan> Strengths: ما تتفوق فيه</tspan>
  <tspan x="950" dy="40">الوسيلة على غيرها.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Strengths:</tspan> what a medium does</tspan>
  <tspan x="120" dy="40">better than others.</tspan>
</text>

<!-- 4. Constraints -->
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">القيود</tspan> Constraints: حدود ما تستطيع الوسيلة</tspan>
  <tspan x="950" dy="40">فعله، أو ما تحتاج إليه لتعمل.</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Constraints:</tspan> the limits of a medium,</tspan>
  <tspan x="120" dy="40">or what it needs in order to work.</tspan>
</text>

<!-- 5. Multimedia -->
<text x="950" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسائط المتعددة</tspan> Multimedia: نص وصورة</tspan>
  <tspan x="950" dy="40">وصوت وفيديو في محتوى واحد.</tspan>
</text>
<text x="120" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Multimedia:</tspan> text, images, audio,</tspan>
  <tspan x="120" dy="40">and video in one piece of content.</tspan>
</text>
</svg>
