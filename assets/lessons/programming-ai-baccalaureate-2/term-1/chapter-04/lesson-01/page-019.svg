  <path d="M14 6 H54 V56 H46 V64 H6 V14 H14 Z" fill="#22303f" opacity=".18"/>
  <rect x="10" y="0" width="40" height="50" rx="4" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
