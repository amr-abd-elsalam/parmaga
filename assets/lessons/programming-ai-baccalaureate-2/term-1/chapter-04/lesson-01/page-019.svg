  <path d="M20 27 Q 10 14 22 4" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: check badge (Strengths) -->
<g transform="translate(880 786)">
  <circle cx="4" cy="6" r="28" fill="#22303f" opacity=".18"/>
  <polygon points="28,0 21.3,8.8 19.8,19.8 8.8,21.3 0,28 -8.8,21.3 -19.8,19.8 -21.3,8.8 -28,0 -21.3,-8.8 -19.8,-19.8 -8.8,-21.3 0,-28 8.8,-21.3 19.8,-19.8 21.3,-8.8" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="0" cy="0" r="17" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M-8 1 L-2 7 L9 -6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: warning triangle (Constraints) -->
<g transform="translate(868 952)">
  <polygon points="36,10 66,62 6,62" fill="#22303f" opacity=".18"/>
  <polygon points="32,4 62,56 2,56" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="29" y="20" width="6" height="20" rx="3" fill="#22303f"/>
  <circle cx="32" cy="47" r="3.5" fill="#22303f"/>
</g>

