  <path d="M62 10 L62 54 L24 54 L4 32 L24 10 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="32" r="5" fill="#fffdf7" stroke="#22303f" stroke-width="2.5"/>
