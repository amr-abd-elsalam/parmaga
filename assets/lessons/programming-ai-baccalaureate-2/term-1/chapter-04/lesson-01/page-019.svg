  <path d="M24 40 L22 50 H38 L36 40 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="16" y="50" width="28" height="5" rx="2.5" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="0" y="0" width="60" height="40" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="6" y="6" width="48" height="28" rx="3" fill="#4fc3e8"/>
  <polygon points="25,12 25,28 38,20" fill="#ffffff"/>
</g>

<!-- Icon: picture (Multimedia) -->
<g transform="translate(806 1174)">
  <rect x="4" y="6" width="54" height="44" rx="5" fill="#22303f" opacity=".18"/>
  <rect x="0" y="0" width="54" height="44" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="5" y="5" width="44" height="34" rx="2" fill="#dff1f7"/>
