  <path d="M10 21 Q 18 18 27 21 M10 30 Q 18 27 27 30 M10 39 Q 18 36 27 39 M37 30 Q 46 27 54 30 M37 39 Q 44 36 50 39" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="44,2 52,2 52,24 48,20 44,24" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

