<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">شخصيات الوسائط 1:</tspan>
  <tspan x="540" dy="48">التلفزيون والراديو</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Media Characters 1: TV and Radio</text>

<!-- Card 1: TV -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">التلفزيون TV: الميكروفون الكبير</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">TV: The Big Microphone</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">صورة وصوت لجمهور <tspan font-weight="bold" fill="#c0392b">ضخم</tspan> في اللحظة نفسها،</tspan>
  <tspan x="935" dy="40">لكنه عادةً لا يسمعك: <tspan font-weight="bold" fill="#17457f">اتجاه واحد.</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Picture and sound for a <tspan font-weight="bold" fill="#c0392b">huge</tspan></tspan>
  <tspan x="140" dy="40">audience at once, but it usually</tspan>
  <tspan x="140" dy="40">cannot hear you: <tspan font-weight="bold" fill="#17457f">one-way.</tspan></tspan>
</text>

<!-- Card 2: Radio -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">الراديو Radio: رفيق المشاوير</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Radio: The Travel Buddy</text>
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">صوت فقط،</tspan> يرافقك وأنت تتحرك أو تعمل،</tspan>
  <tspan x="935" dy="40">بحسب التغطية Coverage وجهاز</tspan>
  <tspan x="935" dy="40">الاستقبال. <tspan font-weight="bold" fill="#17457f">اتجاه واحد.</tspan></tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Sound only;</tspan> it joins you while you</tspan>
  <tspan x="140" dy="40">move or work, depending on coverage</tspan>
  <tspan x="140" dy="40">and the receiving device. <tspan font-weight="bold" fill="#17457f">One-way.</tspan></tspan>
</text>

<!-- Card 3: Success -->
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">صِف زميلك لزميل مغمض العينين.</tspan>
  <tspan x="935" dy="40">هذا هو <tspan font-weight="bold" fill="#2e7d32">الراديو!</tspan></tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Describe a classmate to someone with</tspan>
  <tspan x="140" dy="40">eyes closed. That is <tspan font-weight="bold" fill="#2e7d32">radio!</tspan></tspan>
</text>
</svg>
