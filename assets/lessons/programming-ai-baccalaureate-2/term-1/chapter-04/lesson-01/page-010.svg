<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الموقع زي المحل</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">A Website Is Like a Shop</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الموقع مثل <tspan font-weight="bold" fill="#c0392b">المحل:</tspan> <tspan font-weight="bold" fill="#17457f">الزبون</tspan> هو الذي يذهب إليه.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A website is like a <tspan font-weight="bold" fill="#c0392b">shop:</tspan></tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">customer</tspan> must go to it.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 يحتاج إلى <tspan font-weight="bold" fill="#17457f">طريق:</tspan></tspan>
  <tspan x="950" dy="40">معظم وظائفه تحتاج إلى <tspan font-weight="bold" fill="#17457f">اتصال بالشبكة.</tspan></tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 It needs a <tspan font-weight="bold" fill="#17457f">road:</tspan> most functions</tspan>
  <tspan x="132" dy="40">need a <tspan font-weight="bold" fill="#17457f">network connection.</tspan></tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 يجب أن يأتي <tspan font-weight="bold" fill="#17457f">الزبون:</tspan></tspan>
  <tspan x="950" dy="40">لن تصلك المعلومة ما لم <tspan font-weight="bold" fill="#17457f">تفتح الموقع.</tspan></tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 The <tspan font-weight="bold" fill="#17457f">customer</tspan> must come: you get</tspan>
  <tspan x="132" dy="40">nothing unless you <tspan font-weight="bold" fill="#17457f">open the site.</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 الطريق قد يكون <tspan font-weight="bold" fill="#17457f">مزدحمًا:</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">سرعة التحميل</tspan> تختلف حسب جهازك وشبكتك.</tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 The road may be <tspan font-weight="bold" fill="#17457f">busy:</tspan> <tspan font-weight="bold" fill="#17457f">loading speed</tspan></tspan>
  <tspan x="132" dy="40">depends on your device and network.</tspan>
</text>
</svg>
