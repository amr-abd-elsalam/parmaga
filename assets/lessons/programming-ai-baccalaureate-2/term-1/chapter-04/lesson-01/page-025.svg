<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">تذكرة الخروج: 3-2-1</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Exit Ticket: 3-2-1</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قبل أن تغلق المذكرة، اكتب <tspan font-weight="bold" fill="#17457f">في دفترك</tspan>:</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Before you close this booklet,</tspan>
  <tspan x="120" dy="40">write in <tspan font-weight="bold" fill="#17457f">your notebook</tspan>:</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> <tspan font-weight="bold" fill="#17457f">وسائط</tspan>، وقوة كل منها في كلمة واحدة.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> <tspan font-weight="bold" fill="#17457f">media</tspan>, and the strength</tspan>
  <tspan x="120" dy="40">of each in one word.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> من <tspan font-weight="bold" fill="#17457f">قيود</tspan> الموقع الإلكتروني.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> <tspan font-weight="bold" fill="#17457f">constraints</tspan> of a website.</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> <tspan font-weight="bold" fill="#17457f">موقف</tspan> من حياتك، والوسيلة التي</tspan>
  <tspan x="950" dy="40">تختارها له، ولماذا.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> <tspan font-weight="bold" fill="#17457f">situation</tspan> from your life,</tspan>
  <tspan x="120" dy="40">the medium you would choose, and why.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">إذا كتبت اختيارًا مع <tspan font-weight="bold" fill="#17457f">سبب مقنع</tspan></tspan>
  <tspan x="935" dy="40">في البند الأخير، فقد حققت <tspan font-weight="bold" fill="#2e7d32">هدف الدرس</tspan>.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If you wrote a choice with a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">convincing reason</tspan> in the last item,</tspan>
  <tspan x="140" dy="40">you have reached the <tspan font-weight="bold" fill="#2e7d32">lesson's goal</tspan>.</tspan>
</text>
</svg>
