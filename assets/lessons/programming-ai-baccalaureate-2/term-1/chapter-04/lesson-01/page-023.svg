<!-- 1. Traditional media -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسائط التقليدية</tspan> Traditional media: وسائط</tspan>
  <tspan x="950" dy="40">سبقت الإنترنت، مثل <tspan fill="#c96a1b">التلفزيون والراديو والصحف.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Traditional media:</tspan> media that came</tspan>
  <tspan x="120" dy="40">before the Internet, such as <tspan fill="#c96a1b">TV, radio,</tspan></tspan>
  <tspan x="120" dy="40">and <tspan fill="#c96a1b">newspapers.</tspan></tspan>
</text>

<!-- 2. Digital media -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسائط الرقمية</tspan> Digital media: وسائط تعتمد</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">الأجهزة الرقمية</tspan> والشبكات، مثل</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">المواقع ووسائل التواصل.</tspan></tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Digital media:</tspan> media that rely on</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">digital devices</tspan> and networks, such as</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">websites and SNS.</tspan></tspan>
</text>

<!-- 3. Wide reach -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الانتشار الواسع</tspan> Wide reach: الوصول إلى عدد</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">كبير جدًا</tspan> من الناس.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Wide reach:</tspan> reaching a <tspan font-weight="bold" fill="#17457f">very large</tspan></tspan>
  <tspan x="120" dy="40">number of people.</tspan>
</text>

<!-- 4. Depth -->
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العمق</tspan> Depth: تقديم معلومات <tspan font-weight="bold" fill="#17457f">تفصيلية ومنظمة.</tspan></tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Depth:</tspan> offering <tspan font-weight="bold" fill="#17457f">detailed and organized</tspan></tspan>
  <tspan x="120" dy="40">information.</tspan>
</text>

<!-- 5. Individual delivery -->
<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التوصيل الفردي</tspan> Individual delivery: إرسال</tspan>
  <tspan x="950" dy="40">المعلومة إلى <tspan font-weight="bold" fill="#17457f">أشخاص محددين</tspan> بأسمائهم.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Individual delivery:</tspan> sending</tspan>
  <tspan x="120" dy="40">information to <tspan font-weight="bold" fill="#17457f">specific people</tspan> by name.</tspan>
</text>
</svg>
