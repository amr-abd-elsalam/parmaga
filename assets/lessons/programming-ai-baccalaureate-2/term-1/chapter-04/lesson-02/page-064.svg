<text x="968" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الفخ</text>
<text x="557" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">The trap</text>
<text x="523" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الصحيح</text>
<text x="112" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">Correct</text>

<text x="968" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0"><tspan font-weight="bold" fill="#c0392b">التقارب</tspan> والمحاذاة</tspan>
  <tspan x="968" dy="40">شيء واحد</tspan>
</text>
<text x="557" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0"><tspan font-weight="bold" fill="#c0392b">Proximity</tspan> =</tspan>
  <tspan x="557" dy="40">alignment</tspan>
</text>
<text x="523" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> التقارب يجمّع،</tspan>
  <tspan x="523" dy="40">والمحاذاة تنظّم</tspan>
</text>
<text x="112" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> proximity</tspan>
  <tspan x="112" dy="40">groups, alignment</tspan>
  <tspan x="112" dy="40">orders</tspan>
</text>
<text x="523" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0">«جنب بعض» <tspan font-weight="bold" fill="#c0392b">≠</tspan></tspan>
  <tspan x="523" dy="40">«على خط واحد»</tspan>
</text>
<text x="112" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">“Side by side” <tspan font-weight="bold" fill="#c0392b">≠</tspan></tspan>
  <tspan x="112" dy="40">“on one line”</tspan>
</text>

<text x="968" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0"><tspan font-weight="bold" fill="#c0392b">التكرار</tspan> والتباين</tspan>
  <tspan x="968" dy="40">متشابهان</tspan>
</text>
<text x="557" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0"><tspan font-weight="bold" fill="#c0392b">Repetition</tspan> and</tspan>
  <tspan x="557" dy="40">contrast are alike</tspan>
</text>
<text x="523" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> التكرار يوحّد،</tspan>
  <tspan x="523" dy="40">والتباين يُبرز</tspan>
</text>
<text x="112" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> repetition</tspan>
  <tspan x="112" dy="40">unifies, contrast</tspan>
  <tspan x="112" dy="40">highlights</tspan>
</text>
<text x="523" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0">«زي بعض» <tspan font-weight="bold" fill="#c0392b">≠</tspan></tspan>
  <tspan x="523" dy="40">«مختلف عن الكل»</tspan>
</text>
<text x="112" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">“Alike” <tspan font-weight="bold" fill="#c0392b">≠</tspan></tspan>
  <tspan x="112" dy="40">“different from all”</tspan>
</text>
</svg>
