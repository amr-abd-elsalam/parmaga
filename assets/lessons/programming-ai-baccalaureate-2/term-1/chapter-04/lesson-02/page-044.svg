<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">المسافة البيضاء White Space</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">White Space</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">المسافة البيضاء والهوامش White Space / Margins:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">المساحات الفارغة</tspan> حول العناصر وبينها.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">White space / margins: the <tspan font-weight="bold" fill="#17457f">empty areas</tspan></tspan>
  <tspan x="120" dy="40">around and between elements.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ليست مكانًا ضائعًا، بل هي التي تصنع</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">التقارب والتباين،</tspan> وتريح العين.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is not wasted space; it creates</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">proximity and contrast,</tspan></tspan>
  <tspan x="120" dy="40">and rests the eye.</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الصفحة محتاجة تتنفّس.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The page needs to breathe.</tspan>
</text>
</svg>
