<!-- Texts -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">إجابة نموذجية</tspan>
  <tspan x="540" dy="48">لسؤال الست درجات</tspan>
</text>

<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">
  <tspan x="540" dy="0">Model Answer for the 6-Mark Question</tspan>
</text>

<text x="935"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">سؤال على نمط الامتحان</tspan>
</text>

<text x="140"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">EXAM-STYLE QUESTION</tspan>
</text>

<text x="935"
      y="394"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">اشرح لماذا يُنشئ المصمم <tspan font-weight="bold" fill="#c0392b">شخصية نموذجية</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">وإطارًا هيكليًا</tspan> قبل اختيار الألوان</tspan>
  <tspan x="935" dy="40">والخطوط. <tspan font-weight="bold" fill="#17457f">[6 درجات]</tspan></tspan>
</text>

<text x="140"
      y="514"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Explain why a designer creates</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#c0392b">persona</tspan> and a <tspan font-weight="bold" fill="#c0392b">wireframe</tspan> before</tspan>
  <tspan x="140" dy="40">choosing colors and fonts. <tspan font-weight="bold" fill="#17457f">[6 marks]</tspan></tspan>
</text>

<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">6 درجات = 6 نقاط:</tspan>
  <tspan x="935" dy="40">3 لشخصية المستخدم و3 للمخطط الهيكلي.</tspan>
</text>

<text x="140"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">6 marks = 6 points: 3 for the persona</tspan>
  <tspan x="140" dy="40">and 3 for the wireframe.</tspan>
</text>
</svg>
