<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">مفتاح الحفظ:</tspan>
  <tspan x="540" dy="48">مين، فين، إزاي، لمين</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">The Memory Key: Who, Where, How, For Whom</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مين؟</tspan> ← شخصية المستخدم <tspan font-weight="bold" fill="#c0392b">Persona:</tspan> من هو المستخدم؟</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Who?</tspan> → <tspan font-weight="bold" fill="#c0392b">Persona:</tspan> Who is the user?</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">فين؟</tspan> ← المخطط الهيكلي <tspan font-weight="bold" fill="#c0392b">Wireframe:</tspan></tspan>
  <tspan x="950" dy="40">أين يوضع كل عنصر، وما الأهم؟</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Where?</tspan> → <tspan font-weight="bold" fill="#c0392b">Wireframe:</tspan> Where does each</tspan>
  <tspan x="132" dy="40">element go, and what matters most?</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">إزاي؟</tspan> ← مبادئ <tspan font-weight="bold" fill="#c0392b">CRAP:</tspan> كيف نجعل الصفحة واضحة؟</tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">How?</tspan> → <tspan font-weight="bold" fill="#c0392b">CRAP:</tspan> How do we make</tspan>
  <tspan x="132" dy="40">the page clear?</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">لمين؟</tspan> ← التصميم المتمحور حول المستخدم <tspan font-weight="bold" fill="#c0392b">UCD:</tspan></tspan>
  <tspan x="950" dy="40">لصالح من نقرر؟ <tspan font-weight="bold" fill="#2e7d32">للمستخدم دائمًا.</tspan></tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">For whom?</tspan> → <tspan font-weight="bold" fill="#c0392b">UCD:</tspan> Who do we decide for?</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">Always the user.</tspan></tspan>
</text>
</svg>
