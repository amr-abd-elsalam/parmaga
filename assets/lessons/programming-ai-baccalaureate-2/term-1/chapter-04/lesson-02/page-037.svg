<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تنبيه مهم</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Important Warning</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لا تعتمد على <tspan font-weight="bold" fill="#17457f">اللون وحده</tspan> لتمييز العنصر</tspan>
  <tspan x="935" dy="40">المهم، لأن بعض الناس لا يميّزون بعض الألوان.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Do not rely on <tspan font-weight="bold" fill="#17457f">color alone</tspan> to mark</tspan>
  <tspan x="140" dy="40">the important element, because some</tspan>
  <tspan x="140" dy="40">people cannot tell certain colors apart.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">أضف</tspan> إلى اللون الحجمَ أو الأيقونة أو النص.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Add</tspan> size, an icon, or text</tspan>
  <tspan x="140" dy="40">to the color.</tspan>
</text>
</svg>
