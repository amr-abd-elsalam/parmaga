<!-- Paragraph: Fidelity -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">دقة المخطط</tspan> Fidelity: <tspan font-weight="bold" fill="#17457f">درجة التفاصيل</tspan></tspan>
  <tspan x="950" dy="40">في المخطط الهيكلي.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Fidelity:</tspan> the <tspan font-weight="bold" fill="#17457f">level of detail</tspan></tspan>
  <tspan x="120" dy="40">in a wireframe.</tspan>
</text>

<!-- Bullet 1: Low-fidelity -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">منخفض الدقة</tspan> Low-fidelity: رسم سريع</tspan>
  <tspan x="950" dy="40">بالقلم على ورقة.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Low-fidelity:</tspan> a quick pencil sketch</tspan>
  <tspan x="132" dy="40">on paper.</tspan>
</text>

<!-- Bullet 2: High-fidelity -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عالي الدقة</tspan> High-fidelity: أقرب إلى</tspan>
  <tspan x="950" dy="40">الشكل الحقيقي، وفيه <tspan font-weight="bold" fill="#17457f">نصوص فعلية</tspan> ومقاسات.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">High-fidelity:</tspan> closer to the real look,</tspan>
  <tspan x="132" dy="40">with <tspan font-weight="bold" fill="#17457f">actual text</tspan> and measurements.</tspan>
</text>
