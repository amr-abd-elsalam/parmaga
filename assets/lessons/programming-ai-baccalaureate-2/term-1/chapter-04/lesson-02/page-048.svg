<!-- ===== Text ===== -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">التصميم المتمحور حول المستخدم</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">User-Centered Design (UCD)</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التصميم المتمحور حول</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">المستخدم</tspan> UCD – User-Centered Design:</tspan>
  <tspan x="950" dy="40">نهج يجعل <tspan font-weight="bold" fill="#17457f">فهم المستخدمين</tspan> واحتياجاتهم ومهامهم</tspan>
  <tspan x="950" dy="40">وسياق استخدامهم أساسًا لكل قرار تصميمي.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">User-centered design (UCD):</tspan> an approach</tspan>
  <tspan x="120" dy="40">that makes <tspan font-weight="bold" fill="#17457f">understanding users</tspan>, their</tspan>
  <tspan x="120" dy="40">needs, their tasks, and their context</tspan>
  <tspan x="120" dy="40">of use the basis of every design decision.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وهو <tspan font-weight="bold" fill="#17457f">عكس</tspan> التصميم من أجل راحة المُنشئ أو ذوقه.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is the <tspan font-weight="bold" fill="#17457f">opposite</tspan> of designing</tspan>
  <tspan x="120" dy="40">for the creator's convenience or taste.</tspan>
</text>
</svg>
