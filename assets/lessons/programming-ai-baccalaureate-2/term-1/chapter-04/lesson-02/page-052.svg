<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">اختبار المستخدم</tspan> User Testing: أن تعطي</tspan>
  <tspan x="950" dy="40">مستخدمين حقيقيين مهمة وتراقبهم <tspan font-weight="bold" fill="#17457f">دون مساعدة،</tspan></tspan>
  <tspan x="950" dy="40">لتكتشف أين يرتبكون.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">User testing:</tspan> giving real users a task</tspan>
  <tspan x="120" dy="40">and watching them <tspan font-weight="bold" fill="#17457f">without helping,</tspan></tspan>
  <tspan x="120" dy="40">to find where they get confused.</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">المستخدم لا يخطئ؛</tspan>
  <tspan x="935" dy="40">التصميم هو الذي يحتاج إلى إصلاح.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The user is not wrong;</tspan>
  <tspan x="140" dy="40">the design is what needs fixing.</tspan>
</text>
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">دورك الآن</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">YOUR TURN</tspan>
</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اطلب من أحد أفراد أسرتك أن يجد</tspan>
  <tspan x="935" dy="40">رقم مدرستك على موقعها، وراقبه <tspan font-weight="bold" fill="#17457f">دون مساعدة.</tspan></tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Ask a family member to find your</tspan>
  <tspan x="140" dy="40">school's number on its website;</tspan>
  <tspan x="140" dy="40">watch <tspan font-weight="bold" fill="#17457f">without helping.</tspan></tspan>
</text>
</svg>
