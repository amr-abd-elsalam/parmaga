<!-- Titles -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">عالم المستخدم:</tspan>
  <tspan x="540" dy="48">كلمات تحتاج أن تعرفها</tspan>
</text>
<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">The User's World: Words You Need to Know</text>

<!-- Paragraph 1 -->
<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المستخدم User:</tspan> الشخص الذي يتعامل</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">فعليًا</tspan> مع الموقع ليحقق هدفًا.</tspan>
</text>
<text x="120"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">User:</tspan> the person who <tspan font-weight="bold" fill="#17457f">actually</tspan> interacts</tspan>
  <tspan x="120" dy="40">with the website to achieve a goal.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">يعني: من <tspan font-weight="bold" fill="#17457f">سيفتح</tspan> الموقع، لا من صنعه.</tspan>
</text>
<text x="120"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In other words: the one who <tspan font-weight="bold" fill="#17457f">opens</tspan></tspan>
  <tspan x="120" dy="40">the site, not the one who made it.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> في موقع نتائج المدرسة، المستخدم هو</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">وليّ الأمر والطالب،</tspan> لا مبرمج الموقع.</tspan>
</text>
<text x="120"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> On a school results website,</tspan>
  <tspan x="120" dy="40">the users are <tspan font-weight="bold" fill="#2e7d32">parents and students,</tspan></tspan>
  <tspan x="120" dy="40">not the site's programmer.</tspan>
</text>
</svg>
