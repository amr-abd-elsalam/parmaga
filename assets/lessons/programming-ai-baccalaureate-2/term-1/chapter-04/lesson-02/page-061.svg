<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> من يستخدم حاسوب المكتبة بلا إنترنت</tspan>
  <tspan x="950" dy="40">منزلي يحتاج موقعًا خفيفًا <tspan font-weight="bold" fill="#17457f">سريع التحميل،</tspan></tspan>
  <tspan x="950" dy="40">والمعلومة الأساسية <tspan fill="#c96a1b">(الهاتف والمواعيد)</tspan></tspan>
  <tspan x="950" dy="40">في أول الصفحة.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> someone on a library computer</tspan>
  <tspan x="120" dy="40">with no home Internet needs a light,</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">fast-loading</tspan> site, with the key</tspan>
  <tspan x="120" dy="40">information <tspan fill="#c96a1b">(phone and hours)</tspan> at the top.</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">دورك الآن</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">YOUR TURN</tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لعيادة مجتمعية: اختر <tspan font-weight="bold" fill="#c0392b">حاجز وصول</tspan> واحدًا،</tspan>
  <tspan x="935" dy="40">واقترح <tspan font-weight="bold" fill="#17457f">حلًّا</tspan> يخدم الحاجة فاطمة.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">For a community clinic: choose one</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">access barrier</tspan> and suggest a <tspan font-weight="bold" fill="#17457f">solution</tspan></tspan>
  <tspan x="140" dy="40">that serves Hajja Fatma.</tspan>
</text>
</svg>
