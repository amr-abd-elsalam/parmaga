<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">وأداء الخادم</tspan> مثلًا لا علاقة له بشخصية</tspan>
  <tspan x="950" dy="40">المستخدم، لأنه <tspan font-weight="bold" fill="#17457f">صفة في الموقع</tspan> لا في المستخدم.</tspan>
</text>

<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Server performance,</tspan> for example, has</tspan>
  <tspan x="120" dy="40">nothing to do with a persona, because it</tspan>
  <tspan x="120" dy="40">describes <tspan font-weight="bold" fill="#17457f">the website,</tspan> not the user.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البحث والبيانات</tspan> Research / Data: معلومات</tspan>
  <tspan x="950" dy="40">نجمعها من <tspan font-weight="bold" fill="#2e7d32">المستخدمين الحقيقيين</tspan> بالاستبيان</tspan>
  <tspan x="950" dy="40">أو المقابلة أو الملاحظة أو إحصاءات الاستخدام.</tspan>
</text>

<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Research / Data:</tspan> information collected</tspan>
  <tspan x="120" dy="40">from <tspan font-weight="bold" fill="#2e7d32">real users</tspan> through surveys,</tspan>
  <tspan x="120" dy="40">interviews, observation,</tspan>
  <tspan x="120" dy="40">or usage statistics.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أهميتها أنها <tspan font-weight="bold" fill="#17457f">تمنع</tspan> المصمم</tspan>
  <tspan x="950" dy="40">من أن يصمم <tspan font-weight="bold" fill="#17457f">على مزاجه.</tspan></tspan>
</text>

<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
