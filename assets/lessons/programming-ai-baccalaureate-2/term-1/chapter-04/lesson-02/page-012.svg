<!-- Paragraph 1 -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">واجهة المستخدم UI</tspan> – User Interface:</tspan>
  <tspan x="950" dy="40">الجزء الذي <tspan font-weight="bold" fill="#17457f">يراه</tspan> المستخدم <tspan font-weight="bold" fill="#17457f">ويلمسه:</tspan></tspan>
  <tspan x="950" dy="40">الأزرار والقوائم والألوان والخطوط.</tspan>
</text>
<text x="120"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">User interface (UI):</tspan> the part the user</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">sees</tspan> and <tspan font-weight="bold" fill="#17457f">touches:</tspan></tspan>
  <tspan x="120" dy="40">buttons, menus, colors, and fonts.</tspan>
</text>

<!-- Info card: header -->
<text x="935"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">لاحظ الفرق</text>
<text x="140"
      y="474"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">Notice the difference</text>

<!-- Info card: paragraph 1 -->
<text x="935"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">UI</tspan> هي شكل السيارة من الخارج،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">وUX</tspan> هي <tspan font-weight="bold" fill="#17457f">إحساسك</tspan> وأنت تقودها.</tspan>
</text>
<text x="140"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">UI</tspan> is how the car looks from outside;</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">UX</tspan> is how it <tspan font-weight="bold" fill="#17457f">feels</tspan> to drive it.</tspan>
</text>

<!-- Info card: paragraph 2 -->
<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">الواجهة جزء من التجربة.</text>
<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">The interface is part of the experience.</text>

