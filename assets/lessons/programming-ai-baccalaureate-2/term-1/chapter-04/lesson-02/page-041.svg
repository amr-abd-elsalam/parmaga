<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">في العربية والإنجليزية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">In Arabic and English</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في الصفحات العربية تكون <tspan font-weight="bold" fill="#c0392b">المحاذاة الأساسية</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">إلى اليمين،</tspan> لأن القراءة من اليمين</tspan>
  <tspan x="935" dy="40">إلى اليسار؛ وفي الإنجليزية إلى اليسار.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">On Arabic pages, the <tspan font-weight="bold" fill="#c0392b">main alignment</tspan></tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#17457f">to the right,</tspan> because reading</tspan>
  <tspan x="140" dy="40">goes right to left; in English,</tspan>
  <tspan x="140" dy="40">it is to the left.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الكتاب الإنجليزي ذكر «الحواف اليسرى»،</tspan>
  <tspan x="935" dy="40">والمبدأ واحد: <tspan font-weight="bold" fill="#17457f">خط ثابت</tspan> حسب اتجاه اللغة.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The English book mentions “left edges”;</tspan>
  <tspan x="140" dy="40">the principle is the same:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">one fixed line</tspan> that follows the</tspan>
  <tspan x="140" dy="40">language's direction.</tspan>
</text>
</svg>
