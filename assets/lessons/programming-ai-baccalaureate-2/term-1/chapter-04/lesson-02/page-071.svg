<!-- Texts -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">إزاي؟</tspan> <tspan font-weight="bold" fill="#c0392b">CRAP</tspan> «تعالَ تتعلّم معانا تصميم»:</tspan>
  <tspan x="935" dy="40">تباين يُبرز، وتكرار يوحّد،</tspan>
  <tspan x="935" dy="40">ومحاذاة تنظّم، وتقارب يجمّع.</tspan>
</text>

<text x="140"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">How?</tspan> <tspan font-weight="bold" fill="#c0392b">CRAP:</tspan> contrast highlights,</tspan>
  <tspan x="140" dy="40">repetition unifies, alignment</tspan>
  <tspan x="140" dy="40">orders, proximity groups.</tspan>
</text>

<text x="935"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">لمين؟</tspan> <tspan font-weight="bold" fill="#c0392b">UCD:</tspan> <tspan font-weight="bold" fill="#2e7d32">للمستخدم</tspan> دائمًا، في دائرة:</tspan>
  <tspan x="935" dy="40">افهم، ثم صمّم، ثم اختبر، ثم حسّن.</tspan>
</text>

<text x="140"
      y="514"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">For whom?</tspan> <tspan font-weight="bold" fill="#c0392b">UCD:</tspan> always <tspan font-weight="bold" fill="#2e7d32">the user,</tspan></tspan>
  <tspan x="140" dy="40">in a cycle: understand, design,</tspan>
  <tspan x="140" dy="40">test, improve.</tspan>
</text>

<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">الهدفان</tspan>
</text>

<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">The Two Goals</tspan>
</text>

<text x="935"
      y="754"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قابلية الاستخدام</tspan> = «سهل؟».</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">إمكانية الوصول</tspan> = «للكل؟».</tspan>
</text>

<text x="140"
      y="834"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Usability</tspan> = “Easy?”.</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">Accessibility</tspan> = “For all?”.</tspan>
</text>
</svg>
