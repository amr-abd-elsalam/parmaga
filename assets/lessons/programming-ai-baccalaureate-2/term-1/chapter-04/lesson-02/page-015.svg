<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">شخصية المستخدم</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Persona</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">شخصية المستخدم</tspan> Persona: تمثيل لنمط أو فئة</tspan>
  <tspan x="950" dy="40">من المستخدمين في صورة <tspan font-weight="bold" fill="#17457f">شخص واحد محدد.</tspan></tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Persona:</tspan> a representation of a type or</tspan>
  <tspan x="120" dy="40">group of users as <tspan font-weight="bold" fill="#17457f">one specific person.</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لها اسم <tspan font-weight="bold" fill="#17457f">وهدف</tspan> واحتياجات وسلوك</tspan>
  <tspan x="950" dy="40">وسياق استخدام وتحديات.</tspan>
</text>

<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It has a name, a <tspan font-weight="bold" fill="#17457f">goal,</tspan> needs, behavior,</tspan>
  <tspan x="120" dy="40">a context of use, and challenges.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وتُبنى قدر الإمكان على بحث أو <tspan font-weight="bold" fill="#2e7d32">بيانات حقيقية،</tspan></tspan>
  <tspan x="950" dy="40">لا على الخيال وحده.</tspan>
</text>

<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is built, as far as possible,</tspan>
  <tspan x="120" dy="40">on <tspan font-weight="bold" fill="#2e7d32">real research or data,</tspan></tspan>
  <tspan x="120" dy="40">not on imagination alone.</tspan>
</text>
</svg>
