<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">لهذا نبدأ بالمخطط الهيكلي: نتفق على <tspan font-weight="bold" fill="#17457f">البنية</tspan></tspan>
  <tspan x="950" dy="40">أولًا، قبل أن نختلف على الألوان.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">That is why we start with the wireframe:</tspan>
  <tspan x="120" dy="40">we agree on the <tspan font-weight="bold" fill="#17457f">structure</tspan> first,</tspan>
  <tspan x="120" dy="40">before we disagree about colors.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تخيّل مهندسًا يدهن الشقة</tspan>
  <tspan x="935" dy="40">قبل أن يعرف أين الحيطان!</tspan>
  <tspan x="935" dy="40">هذا ما يحدث حين تختار الألوان</tspan>
  <tspan x="935" dy="40">قبل المخطط الهيكلي.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Imagine an engineer painting</tspan>
  <tspan x="140" dy="40">the apartment before knowing</tspan>
  <tspan x="140" dy="40">where the walls are!</tspan>
  <tspan x="140" dy="40">That is what happens when you</tspan>
  <tspan x="140" dy="40">choose colors before the wireframe.</tspan>
</text>
</svg>
