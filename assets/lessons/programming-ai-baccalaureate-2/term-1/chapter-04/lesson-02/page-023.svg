  <circle cx="46" cy="22" r="5" fill="#ffd24a"/>
  <circle cx="14" cy="36" r="5" fill="#2e7d32"/>
</g>

<!-- Emotion face: thinking -->
<g transform="translate(880 1036)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">أصحاب المصلحة</tspan> Stakeholders: كل من يهمه</tspan>
  <tspan x="950" dy="40">المشروع ويؤثر في قراراته.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Stakeholders:</tspan> everyone who cares about</tspan>
  <tspan x="120" dy="40">the project and affects its decisions.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">مثل: <tspan fill="#c96a1b">صاحب العيادة،</tspan> والأطباء، والمبرمج،</tspan>
  <tspan x="950" dy="40">والمصمم، وأحيانًا المرضى أنفسهم.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">For example: <tspan fill="#c96a1b">the clinic owner,</tspan></tspan>
  <tspan x="120" dy="40">the doctors, the programmer, the designer,</tspan>
  <tspan x="120" dy="40">and sometimes the patients themselves.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">الطبيب يريد صورته كبيرة، والمدير يريد</tspan>
  <tspan x="950" dy="40">اللون <tspan fill="#c96a1b">الأحمر،</tspan> والمصمم يريد <tspan fill="#c96a1b">الأزرق.</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">The doctor wants his photo big,</tspan>
  <tspan x="120" dy="40">the manager wants <tspan fill="#c96a1b">red,</tspan></tspan>
  <tspan x="120" dy="40">and the designer wants <tspan fill="#c96a1b">blue.</tspan></tspan>
</text>

<!-- Outlined box: header -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>

<!-- Outlined box: question -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">في مشروع موقع لمدرستك، من هم <tspan font-weight="bold" fill="#c0392b">أصحاب المصلحة؟</tspan></tspan>
  <tspan x="935" dy="40">اذكر ثلاثة منهم على الأقل.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">In a website project for your school,</tspan>
  <tspan x="140" dy="40">who are the <tspan font-weight="bold" fill="#c0392b">stakeholders?</tspan></tspan>
  <tspan x="140" dy="40">Name at least three.</tspan>
</text>
</svg>
