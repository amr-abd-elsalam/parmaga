    <polygon points="-3,1207 3,1207 4,1222 0,1228 -4,1222" fill="#c0392b" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="0" cy="1180" r="17" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -17 1178 C -18 1160 -6 1158 0 1158 C 8 1158 18 1162 17 1178 C 12 1170 4 1168 -2 1170 C -8 1171 -13 1173 -17 1178 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-6" cy="1181" r="2" fill="#22303f"/>
    <circle cx="6" cy="1181" r="2" fill="#22303f"/>
    <path d="M -5 1189 Q 0 1193 5 1189" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- doctor -->
  <g transform="translate(890 0)">
    <rect x="-36" y="1106" width="72" height="42" rx="12" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -7 1147 L 0 1156 L 6 1147" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-5.5" y="1144.5" width="11" height="4" fill="#ffffff"/>
    <rect x="-22" y="1113" width="44" height="28" rx="3" fill="#dff1f7" stroke="#17457f" stroke-width="2"/>
    <circle cx="0" cy="1123" r="6" fill="#7f95ab"/>
    <path d="M -11 1141 Q 0 1128 11 1141 Z" fill="#7f95ab"/>
    <rect x="-6" y="1192" width="12" height="14" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -34 1240 C -34 1214 -22 1204 0 1204 C 22 1204 34 1214 34 1240 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
