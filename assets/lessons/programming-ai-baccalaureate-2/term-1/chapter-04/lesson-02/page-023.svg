<!-- Icon: people (stakeholders) -->
<g transform="translate(884 218)">
  <circle cx="38" cy="14" r="9" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 22 50 Q 22 28 38 28 Q 54 28 54 50 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="20" cy="18" r="10" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 2 54 Q 2 32 20 32 Q 38 32 38 54 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: clinic -->
<g transform="translate(900 486)">
  <rect x="4" y="14" width="44" height="36" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="0,16 26,2 52,16" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="22" y="22" width="8" height="20" fill="#c0392b"/>
  <rect x="16" y="28" width="20" height="8" fill="#c0392b"/>
</g>

<!-- Icon: color palette -->
<g transform="translate(866 676)">
  <path d="M 30 4 C 48 4 60 16 58 32 C 56 44 46 44 42 40 C 38 36 32 40 34 46 C 36 54 28 58 22 56 C 8 52 0 42 2 28 C 4 14 16 4 30 4 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
