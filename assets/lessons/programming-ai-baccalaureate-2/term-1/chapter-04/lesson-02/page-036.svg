<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">1. التباين Contrast</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">1. Contrast</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التباين</tspan> Contrast: إظهار <tspan font-weight="bold" fill="#17457f">فرق واضح</tspan> بين</tspan>
  <tspan x="950" dy="40">العناصر المختلفة في الأهمية، بالحجم أو</tspan>
  <tspan x="950" dy="40">السُّمك أو اللون أو المسافة،</tspan>
  <tspan x="950" dy="40">حتى ترى العين <tspan font-weight="bold" fill="#17457f">الأهم</tspan> فورًا.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Contrast:</tspan> showing a <tspan font-weight="bold" fill="#17457f">clear difference</tspan></tspan>
  <tspan x="120" dy="40">between elements of different importance,</tspan>
  <tspan x="120" dy="40">through size, weight, color, or space,</tspan>
  <tspan x="120" dy="40">so the eye sees the <tspan font-weight="bold" fill="#17457f">most important</tspan></tspan>
  <tspan x="120" dy="40">one at once.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">القاعدة الذهبية: إذا فرّقت، ففرّق بوضوح.</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The golden rule: if you make things</tspan>
  <tspan x="140" dy="40">different, make them clearly different.</tspan>
</text>
</svg>
