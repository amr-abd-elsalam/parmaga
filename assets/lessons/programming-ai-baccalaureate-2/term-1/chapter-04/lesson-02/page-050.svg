<!-- ===== Text ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">خطأ يقع فيه الطلاب</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">A Common Student Mistake</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">التصميم المتمحور حول المستخدم <tspan font-weight="bold" fill="#17457f">لا يعني</tspan></tspan>
  <tspan x="935" dy="40">أن المستخدم هو من يصمم.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">User-centered design <tspan font-weight="bold" fill="#17457f">does not mean</tspan></tspan>
  <tspan x="140" dy="40">that the user does the designing.</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">المصمم</tspan> هو من يصمم، لكن قراره يُحسم بسؤال:</tspan>
  <tspan x="935" dy="40">«هل هذا <tspan font-weight="bold" fill="#2e7d32">لصالح المستخدم؟»</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#17457f">designer</tspan> designs, but each</tspan>
  <tspan x="140" dy="40">decision is settled by asking:</tspan>
  <tspan x="140" dy="40">“Is this for the <tspan font-weight="bold" fill="#2e7d32">user's benefit?”</tspan></tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تذكّر</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Remember</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">شخصية المستخدم</tspan> <tspan font-weight="bold" fill="#17457f">أداة</tspan> من أدوات هذا النهج،</tspan>
  <tspan x="935" dy="40">وليست شرطًا دائمًا.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A <tspan font-weight="bold" fill="#c0392b">persona</tspan> is one <tspan font-weight="bold" fill="#17457f">tool</tspan> of this</tspan>
  <tspan x="140" dy="40">approach, not a permanent requirement.</tspan>
</text>
</svg>
