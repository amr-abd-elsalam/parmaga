<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">شبكة التصميم</tspan> Grid: خطوط وهمية غير مرئية</tspan>
  <tspan x="950" dy="40">تقسم الصفحة إلى <tspan font-weight="bold" fill="#17457f">أعمدة وصفوف،</tspan></tspan>
  <tspan x="950" dy="40">وتُحاذى عليها العناصر.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Grid:</tspan> invisible guide lines that divide</tspan>
  <tspan x="120" dy="40">the page into <tspan font-weight="bold" fill="#17457f">columns and rows,</tspan> and</tspan>
  <tspan x="120" dy="40">elements are aligned to them.</tspan>
</text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تشبه <tspan font-weight="bold" fill="#17457f">سطور الكراسة:</tspan> لا تراها في الكتاب</tspan>
  <tspan x="950" dy="40">المطبوع، لكن الكلام مكتوب عليها.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is like the <tspan font-weight="bold" fill="#17457f">lines in a notebook:</tspan></tspan>
  <tspan x="120" dy="40">you don't see them in a printed book,</tspan>
  <tspan x="120" dy="40">but the text sits on them.</tspan>
</text>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وستحتاج <tspan font-weight="bold" fill="#c0392b">الشبكة</tspan> بعد قليل في مبدأ المحاذاة.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You will need the <tspan font-weight="bold" fill="#c0392b">grid</tspan> soon</tspan>
  <tspan x="120" dy="40">in the alignment principle.</tspan>
</text>
</svg>
