<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">أجزاء الصفحة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Parts of a Page</tspan>
</text>

<text x="935" y="442" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#17457f">الترويسة</text>
<text x="849" y="468" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">Header</text>
<text x="790" y="442" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#17457f">شريط التنقل</text>
<text x="666" y="468" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">Navigation</text>
<text x="569" y="442" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#17457f">المحتوى الرئيسي</text>
<text x="399" y="468" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">Main Content</text>
<text x="330" y="442" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#17457f">الشريط الجانبي</text>
<text x="205" y="468" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">Sidebar</text>
<text x="404" y="542" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#17457f">التذييل</text>
<text x="333" y="568" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="22" fill="#152b42">Footer</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الترويسة Header:</tspan> أعلى الصفحة، وفيها الشعار</tspan>
  <tspan x="950" dy="40">أو اسم الموقع، مثل <tspan fill="#c96a1b">لافتة المحل.</tspan></tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Header:</tspan> the top of the page, with</tspan>
  <tspan x="132" dy="40">the logo or site name, like <tspan fill="#c96a1b">a shop sign.</tspan></tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">شريط التنقل Navigation:</tspan> القائمة التي تنقلك</tspan>
  <tspan x="950" dy="40">بين الصفحات، مثل لوحة الأزرار في <tspan fill="#c96a1b">المصعد.</tspan></tspan>
</text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Navigation:</tspan> the menu that moves you</tspan>
  <tspan x="132" dy="40">between pages, like the button panel</tspan>
  <tspan x="132" dy="40">in <tspan fill="#c96a1b">an elevator.</tspan></tspan>
</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المحتوى الرئيسي Main Content:</tspan> المكان الذي</tspan>
  <tspan x="950" dy="40">يحمل المعلومة التي جاء المستخدم من أجلها.</tspan>
</text>
<text x="132" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Main content:</tspan> the area that holds</tspan>
  <tspan x="132" dy="40">the information the user came for.</tspan>
</text>
</svg>
