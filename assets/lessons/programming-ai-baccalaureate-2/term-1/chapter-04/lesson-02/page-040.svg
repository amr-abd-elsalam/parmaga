<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">3. المحاذاة Alignment</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">3. Alignment</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المحاذاة Alignment:</tspan> وضع العناصر</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">خط أساس مشترك،</tspan> فلا يوضع أي عنصر</tspan>
  <tspan x="950" dy="40">في الصفحة بشكل عشوائي.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Alignment:</tspan> placing elements</tspan>
  <tspan x="120" dy="40">on a <tspan font-weight="bold" fill="#17457f">shared baseline,</tspan> so nothing on the</tspan>
  <tspan x="120" dy="40">page is placed randomly.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تشبه <tspan fill="#c96a1b">طابور الصباح:</tspan> كل طالب يقف على <tspan font-weight="bold" fill="#17457f">الخط نفسه.</tspan></tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is like the <tspan fill="#c96a1b">morning line-up:</tspan></tspan>
  <tspan x="120" dy="40">every student stands on the <tspan font-weight="bold" fill="#17457f">same line.</tspan></tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: كل النصوص والصور تبدأ من <tspan font-weight="bold" fill="#17457f">الحافة نفسها.</tspan></tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: all text and images start</tspan>
  <tspan x="120" dy="40">from the <tspan font-weight="bold" fill="#17457f">same edge.</tspan></tspan>
</text>
</svg>
