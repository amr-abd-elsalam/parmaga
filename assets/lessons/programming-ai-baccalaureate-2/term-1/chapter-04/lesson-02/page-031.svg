<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التسلسل البصري</tspan> Visual Hierarchy:</tspan>
  <tspan x="950" dy="40">ترتيب العناصر بحيث ترى العين <tspan font-weight="bold" fill="#17457f">الأهم</tspan></tspan>
  <tspan x="950" dy="40">أولًا، ثم الأقل أهمية.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Visual hierarchy:</tspan> arranging elements so</tspan>
  <tspan x="120" dy="40">the eye sees the <tspan font-weight="bold" fill="#17457f">most important</tspan> first,</tspan>
  <tspan x="120" dy="40">then the less important.</tspan>
</text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مثال:</tspan> في موقع العيادة، <tspan fill="#c96a1b">المواعيد ورقم الحجز</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">في الأعلى</tspan> وبحجم كبير، وتاريخ تأسيس</tspan>
  <tspan x="950" dy="40">العيادة في الأسفل.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Example:</tspan> on the clinic site,</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">the schedule and booking number</tspan> are</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">at the top</tspan> and large, and the clinic's</tspan>
  <tspan x="120" dy="40">founding date is at the bottom.</tspan>
</text>
</svg>
