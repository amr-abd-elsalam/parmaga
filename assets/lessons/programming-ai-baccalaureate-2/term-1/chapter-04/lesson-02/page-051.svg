<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">التكرار التحسيني Iteration</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Iteration</tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التكرار التحسيني</tspan> Iteration: تحسين التصميم</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">جولات متتالية،</tspan> تستفيد كل جولة</tspan>
  <tspan x="950" dy="40">من نتائج الاختبار السابق.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Iteration:</tspan> improving the design in</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">successive rounds,</tspan> each round learning</tspan>
  <tspan x="120" dy="40">from the results of the previous test.</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">انتبه للفرق</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Watch the Difference</tspan>
</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«التكرار» في CRAP <tspan font-weight="bold" fill="#17457f">تكرار للشكل،</tspan></tspan>
  <tspan x="935" dy="40">أما <tspan font-weight="bold" fill="#c0392b">التكرار التحسيني</tspan> فتكرار لدورة</tspan>
  <tspan x="935" dy="40">التحسين؛ فانتبه في الامتحان.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">“Repetition” in CRAP repeats</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">the look;</tspan> <tspan font-weight="bold" fill="#c0392b">iteration</tspan> repeats</tspan>
  <tspan x="140" dy="40">the improvement cycle. Watch for</tspan>
  <tspan x="140" dy="40">this in the exam.</tspan>
</text>
