<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">نصيحة</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">Tip</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في الامتحان، أي <tspan font-weight="bold" fill="#17457f">سؤال مقالي</tspan> في هذا الدرس</tspan>
  <tspan x="935" dy="40">تستطيع أن تجيب عنه بهذه <tspan font-weight="bold" fill="#c0392b">السلسلة.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In the exam, you can answer</tspan>
  <tspan x="140" dy="40">any <tspan font-weight="bold" fill="#17457f">essay question</tspan> in this lesson</tspan>
  <tspan x="140" dy="40">with this <tspan font-weight="bold" fill="#c0392b">chain.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قلها <tspan font-weight="bold" fill="#17457f">بإيقاع</tspan> <tspan fill="#c96a1b">ثلاث</tspan> مرات:</tspan>
  <tspan x="950" dy="40">«مين، فين، إزاي، لمين».</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Say it in <tspan font-weight="bold" fill="#17457f">rhythm</tspan> <tspan fill="#c96a1b">three</tspan> times:</tspan>
  <tspan x="120" dy="40">“Who, where, how, for whom.”</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>
<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">قبل أن تكمل: هل تستطيع أن تقول</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الأسئلة الأربعة</tspan> دون النظر؟</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Before you go on: can you say</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">four questions</tspan> without looking?</tspan>
</text>
</svg>
