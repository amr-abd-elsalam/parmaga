<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="128" width="870" height="808" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="968" width="870" height="208" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info card -->
<rect x="105" y="122" width="870" height="808" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="776" rx="3" fill="#2f7fb5"/>

<!-- Outlined box -->
<rect x="105" y="962" width="870" height="208" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="978" width="6" height="176" rx="3" fill="#2f7fb5"/>

<!-- Icon: magnifier (look for the key word) -->
<g transform="translate(828 318)">
  <polygon points="34,38 38,34 54,50 50,54" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="18" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M14 21 Q 16 13 24 11" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="15" y="22" width="18" height="5" rx="2" fill="#c96a1b"/>
</g>

<!-- Icon: Contrast -->
<g transform="translate(150 384)">
  <rect x="0" y="0" width="64" height="44" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="8" y="8" width="34" height="12" rx="3" fill="#17457f"/>
  <rect x="8" y="26" width="48" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="8" y="34" width="38" height="4" rx="2" fill="#8fc9f2"/>
</g>

<!-- Icon: Repetition -->
<g transform="translate(150 544)">
  <rect x="2" y="4" width="16" height="36" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="5" y="9" width="10" height="6" rx="2" fill="#c96a1b"/>
  <rect x="24" y="4" width="16" height="36" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="27" y="9" width="10" height="6" rx="2" fill="#c96a1b"/>
  <rect x="46" y="4" width="16" height="36" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="49" y="9" width="10" height="6" rx="2" fill="#c96a1b"/>
</g>

<!-- Icon: Alignment -->
<g transform="translate(150 704)">
  <rect x="0" y="0" width="64" height="44" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <line x1="12" y1="7" x2="12" y2="37" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="15" y="9" width="40" height="6" rx="2" fill="#2f7fb5"/>
  <rect x="15" y="19" width="28" height="6" rx="2" fill="#2f7fb5"/>
  <rect x="15" y="29" width="36" height="6" rx="2" fill="#2f7fb5"/>
</g>

<!-- Icon: Proximity -->
<g transform="translate(150 824)">
  <rect x="0" y="0" width="64" height="44" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="13" cy="16" r="4.5" fill="#17457f"/>
  <circle cx="23" cy="16" r="4.5" fill="#17457f"/>
  <circle cx="13" cy="28" r="4.5" fill="#17457f"/>
  <circle cx="23" cy="28" r="4.5" fill="#17457f"/>
  <circle cx="41" cy="16" r="4.5" fill="#c96a1b"/>
  <circle cx="51" cy="16" r="4.5" fill="#c96a1b"/>
  <circle cx="41" cy="28" r="4.5" fill="#c96a1b"/>
  <circle cx="51" cy="28" r="4.5" fill="#c96a1b"/>
</g>

<!-- Face: thinking (test yourself) -->
<g transform="translate(590 999)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: pencil -->
<g transform="translate(650 970)">
  <polygon points="8,40 34,14 42,22 16,48" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="34,14 38,10 46,18 42,22" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="8,40 16,48 4,52" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Face: wink (lower area) -->
<g transform="translate(494 1226)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: star (lower area) -->
<g transform="translate(546 1201)">
  <polygon points="26,2 31.88,17.91 48.83,18.58 35.51,29.09 40.11,45.42 26,36 11.89,45.42 16.49,29.09 3.17,18.58 20.12,17.91" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- ===== Text ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">قاعدة حل أسئلة المطابقة</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Rule for Matching Questions</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ابحث عن <tspan font-weight="bold" fill="#17457f">الفعل</tspan> أو <tspan font-weight="bold" fill="#17457f">الكلمة المفتاحية</tspan></tspan>
  <tspan x="935" dy="40">في العبارة:</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Look for the <tspan font-weight="bold" fill="#17457f">action</tspan> or <tspan font-weight="bold" fill="#17457f">key word</tspan></tspan>
  <tspan x="140" dy="40">in the statement:</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يُبرز، يميّز، أكبر وأغمق ← <tspan font-weight="bold" fill="#c0392b">التباين.</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Highlights, distinguishes,</tspan>
  <tspan x="140" dy="40">bigger and bolder → <tspan font-weight="bold" fill="#c0392b">Contrast.</tspan></tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يوحّد، في كل الصفحات، نفس ← <tspan font-weight="bold" fill="#c0392b">التكرار.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Unifies, on every page,</tspan>
  <tspan x="140" dy="40">the same → <tspan font-weight="bold" fill="#c0392b">Repetition.</tspan></tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">حواف، خط، يحاذي ← <tspan font-weight="bold" fill="#c0392b">المحاذاة.</tspan></tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Edges, line, aligns → <tspan font-weight="bold" fill="#c0392b">Alignment.</tspan></tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">قريبة، معًا، يجمّع ← <tspan font-weight="bold" fill="#c0392b">التقارب.</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Close, together, groups → <tspan font-weight="bold" fill="#c0392b">Proximity.</tspan></tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">اختبر نفسك</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">TEST YOURSELF</text>

<text x="935" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">توحيد لون الأزرار في كل الصفحات: أي مبدأ؟</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Same button color on every page:</tspan>
  <tspan x="140" dy="40">which principle?</tspan>
</text>
</svg>
