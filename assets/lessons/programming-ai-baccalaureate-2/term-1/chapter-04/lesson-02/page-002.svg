<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قبل أن نبدأ</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Before We Begin</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الموقع مش ليك… الموقع <tspan fill="#c0392b">للي هيستخدمه.</tspan></tspan>
</text>

<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The website is not for you…</tspan>
  <tspan x="140" dy="40">it is for <tspan fill="#c0392b">the person</tspan> who will use it.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أن والدتك متعبة،</tspan>
  <tspan x="950" dy="40">وتحتاج <tspan font-weight="bold" fill="#17457f">رقم الطبيب</tspan> الآن.</tspan>
</text>

<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine your mother is unwell and you</tspan>
  <tspan x="120" dy="40">need the <tspan font-weight="bold" fill="#17457f">doctor's number</tspan> right now.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تفتح موقع العيادة فتجد <tspan fill="#c96a1b">عشرة ألوان</tspan></tspan>
  <tspan x="950" dy="40">وخطوطًا مختلفة، وزر الحجز صغيرًا في الركن،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">ورقم الهاتف</tspan> في آخر الصفحة.</tspan>
</text>

<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You open the clinic's website and find</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">ten colors,</tspan> different fonts,</tspan>
  <tspan x="120" dy="40">a tiny booking button in the corner,</tspan>
  <tspan x="120" dy="40">and the <tspan font-weight="bold" fill="#17457f">phone number</tspan> at the very bottom.</tspan>
</text>
</svg>
