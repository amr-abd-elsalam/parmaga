  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الشريط الجانبي</tspan> Sidebar: معلومات إضافية أو</tspan>
  <tspan x="950" dy="40">مرتبطة أو إعلانات، وهي <tspan font-weight="bold" fill="#17457f">أقل أهمية.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Sidebar:</tspan> extra or related information</tspan>
  <tspan x="120" dy="40">or ads, which are <tspan font-weight="bold" fill="#17457f">less important.</tspan></tspan>
</text>
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التذييل</tspan> Footer: أسفل الصفحة، وفيه حقوق</tspan>
  <tspan x="950" dy="40">النشر وبيانات التواصل والروابط.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Footer:</tspan> the bottom of the page, with</tspan>
  <tspan x="120" dy="40">copyright, contact details, and links.</tspan>
</text>
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">دورك الآن</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">YOUR TURN</tspan>
</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">افتح أي موقع تحبه: أين <tspan font-weight="bold" fill="#17457f">ترويسته؟</tspan></tspan>
  <tspan x="935" dy="40">وأين شريط التنقل؟ وماذا يوجد في <tspan font-weight="bold" fill="#17457f">التذييل؟</tspan></tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
