<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">3. غياب النص البديل</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">3. Missing alternative text</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">النص البديل Alt Text:</tspan> وصف نصي قصير للصورة</tspan>
  <tspan x="950" dy="40">يقرؤه <tspan font-weight="bold" fill="#17457f">قارئ الشاشة</tspan> للمكفوفين وضعاف البصر.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Alt text:</tspan> a short text description</tspan>
  <tspan x="120" dy="40">of an image that a <tspan font-weight="bold" fill="#17457f">screen reader</tspan> reads</tspan>
  <tspan x="120" dy="40">aloud for blind and low-vision users.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> «خريطة توضح موقع العيادة</tspan>
  <tspan x="950" dy="40">بجوار مسجد النور».</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> “A map showing the clinic's</tspan>
  <tspan x="120" dy="40">location next to Al-Nour Mosque.”</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">قارئ الشاشة Screen Reader:</tspan> برنامج يقرأ</tspan>
  <tspan x="950" dy="40">محتوى الشاشة <tspan font-weight="bold" fill="#17457f">بصوت مسموع</tspan></tspan>
  <tspan x="950" dy="40">لضعاف البصر والمكفوفين.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Screen reader:</tspan> a program that reads</tspan>
  <tspan x="120" dy="40">the screen's content <tspan font-weight="bold" fill="#17457f">aloud</tspan></tspan>
  <tspan x="120" dy="40">for low-vision and blind users.</tspan>
</text>
</svg>
