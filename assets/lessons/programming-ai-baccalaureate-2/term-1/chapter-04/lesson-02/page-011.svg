<!-- Paragraph 1 -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تجربة المستخدم UX</tspan> – User Experience:</tspan>
  <tspan x="950" dy="40">كل ما يمر به المستخدم <tspan font-weight="bold" fill="#17457f">ويشعر</tspan> به أثناء</tspan>
  <tspan x="950" dy="40">استخدام الموقع وبعده.</tspan>
</text>
<text x="120"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">User experience (UX):</tspan> everything</tspan>
  <tspan x="120" dy="40">the user goes through and <tspan font-weight="bold" fill="#17457f">feels</tspan> while</tspan>
  <tspan x="120" dy="40">using the website and afterwards.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">هل وصل إلى ما يريد؟ في كم من الوقت؟</tspan>
  <tspan x="950" dy="40">هل ارتبك؟ هل خرج <tspan font-weight="bold" fill="#2e7d32">راضيًا؟</tspan></tspan>
</text>
<text x="120"
      y="514"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">Did they reach what they wanted?</tspan>
  <tspan x="120" dy="40">How long did it take? Were they confused?</tspan>
  <tspan x="120" dy="40">Did they leave <tspan font-weight="bold" fill="#2e7d32">satisfied?</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> موقع جميل لكن زر الدفع مختفٍ،</tspan>
  <tspan x="950" dy="40">شكله جيد <tspan font-weight="bold" fill="#17457f">وتجربته سيئة.</tspan></tspan>
</text>
<text x="120"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> A beautiful website with a</tspan>
  <tspan x="120" dy="40">hidden payment button looks good but</tspan>
  <tspan x="120" dy="40">gives a <tspan font-weight="bold" fill="#17457f">bad experience.</tspan></tspan>
</text>
</svg>
