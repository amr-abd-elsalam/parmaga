  <polygon points="28,2 34.47,19.1 52.73,19.97 38.46,31.4 43.28,49.03 28,39 12.72,49.03 17.54,31.4 3.27,19.97 21.53,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
