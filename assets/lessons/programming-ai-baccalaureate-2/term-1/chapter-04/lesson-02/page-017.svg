    <path d="M-16 36 Q-16 14 0 14 Q16 14 16 36 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="10" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
