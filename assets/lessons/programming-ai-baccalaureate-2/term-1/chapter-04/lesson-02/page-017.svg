  <rect x="105" y="322" width="870" height="648" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
  <rect x="961" y="338" width="6" height="616" rx="3" fill="#c96a1b"/>
</g>

<!-- Memory illustration: from an anonymous crowd to one persona -->
