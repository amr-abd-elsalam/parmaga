<!-- Texts -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">5 لو اختيرت الألوان والخطوط أولًا،</tspan>
  <tspan x="950" dy="40">ينشغل النقاش <tspan font-weight="bold" fill="#17457f">بالتفضيلات الشخصية</tspan></tspan>
  <tspan x="950" dy="40">في المظهر. (المشكلة)</tspan>
</text>

<text x="120"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">5 If colors and fonts are chosen first,</tspan>
  <tspan x="120" dy="40">discussion gets stuck on <tspan font-weight="bold" fill="#17457f">personal</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">preferences</tspan> about appearance. (Problem)</tspan>
</text>

<text x="950"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">6 أما تحديد <tspan font-weight="bold" fill="#17457f">البنية</tspan> أولًا فيسهّل وصول</tspan>
  <tspan x="950" dy="40">أصحاب المصلحة إلى <tspan font-weight="bold" fill="#2e7d32">اتفاق.</tspan> (النتيجة)</tspan>
</text>

<text x="120"
      y="514"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">6 Deciding the <tspan font-weight="bold" fill="#17457f">structure</tspan> first makes</tspan>
  <tspan x="120" dy="40">it easier for stakeholders to reach</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">agreement.</tspan> (Result)</tspan>
</text>

<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#2e7d32">
  <tspan x="935" dy="0">جملة الختام</tspan>
</text>

<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#2e7d32">
  <tspan x="140" dy="0">Closing Sentence</tspan>
</text>

<text x="935"
      y="754"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">لذلك يبدأ التصميم من المستخدم إلى الداخل:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">مين،</tspan> ثم <tspan font-weight="bold" fill="#17457f">فين،</tspan> ثم <tspan font-weight="bold" fill="#17457f">إزاي.</tspan></tspan>
</text>

<text x="140"
      y="834"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">So design starts from the user</tspan>
  <tspan x="140" dy="40">inward: <tspan font-weight="bold" fill="#17457f">who,</tspan> then <tspan font-weight="bold" fill="#17457f">where,</tspan> then <tspan font-weight="bold" fill="#17457f">how.</tspan></tspan>
</text>
</svg>
