<text x="968" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الفخ</text>
<text x="557" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">The trap</text>
<text x="523" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الصحيح</text>
<text x="112" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">Correct</text>

<text x="968" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0">أداء الخادم من بيانات</tspan>
  <tspan x="968" dy="40"><tspan font-weight="bold" fill="#c0392b">شخصية المستخدم</tspan></tspan>
</text>
<text x="557" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0">Server speed belongs</tspan>
  <tspan x="557" dy="40">in a <tspan font-weight="bold" fill="#c0392b">persona</tspan></tspan>
</text>
<text x="523" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> الشخصية تصف</tspan>
  <tspan x="523" dy="40"><tspan font-weight="bold" fill="#2e7d32">إنسانًا</tspan> لا جهازًا</tspan>
</text>
<text x="112" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> a persona</tspan>
  <tspan x="112" dy="40">describes a <tspan font-weight="bold" fill="#2e7d32">human</tspan></tspan>
</text>
<text x="523" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan fill="#c96a1b">«إنسان</tspan> مش سيرفر»</tspan>
</text>
<text x="112" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">“A <tspan fill="#c96a1b">human,</tspan> not</tspan>
  <tspan x="112" dy="40">a server”</tspan>
</text>

<text x="968" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0"><tspan font-weight="bold" fill="#c0392b">التشفير</tspan> من مبادئ <tspan font-weight="bold" fill="#17457f">CRAP</tspan></tspan>
</text>
<text x="557" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0"><tspan font-weight="bold" fill="#c0392b">Encryption</tspan> is a</tspan>
  <tspan x="557" dy="40"><tspan font-weight="bold" fill="#17457f">CRAP</tspan> principle</tspan>
</text>
<text x="523" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> لا تشفير في</tspan>
  <tspan x="523" dy="40"><tspan font-weight="bold" fill="#17457f">المبادئ الأربعة</tspan></tspan>
</text>
<text x="112" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> no</tspan>
  <tspan x="112" dy="40">encryption in</tspan>
  <tspan x="112" dy="40">the <tspan font-weight="bold" fill="#17457f">four</tspan></tspan>
</text>
<text x="523" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0">«تعالَ تتعلّم</tspan>
  <tspan x="523" dy="40">معانا تصميم»</tspan>
</text>
<text x="112" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">Arabic memory</tspan>
  <tspan x="112" dy="40">sentence: C, R, A, P</tspan>
</text>
</svg>
