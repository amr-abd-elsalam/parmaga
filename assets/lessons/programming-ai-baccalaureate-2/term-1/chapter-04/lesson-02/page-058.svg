<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Did You Know?</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">توصي الإرشادات الدولية لإمكانية الوصول</tspan>
  <tspan x="935" dy="40">إلى محتوى الويب <tspan font-weight="bold" fill="#c0392b">WCAG</tspan> بنسبة تباين <tspan fill="#c96a1b">4.5:1</tspan></tspan>
  <tspan x="935" dy="40">على الأقل للنص العادي.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The international Web Content</tspan>
  <tspan x="140" dy="40">Accessibility Guidelines <tspan font-weight="bold" fill="#c0392b">(WCAG)</tspan></tspan>
  <tspan x="140" dy="40">recommend a contrast ratio</tspan>
  <tspan x="140" dy="40">of at least <tspan fill="#c96a1b">4.5:1</tspan> for normal text.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">2. صعوبة استخدام لوحة المفاتيح</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">2. Difficulty using the keyboard</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">المشكلة:</tspan> بعض الناس لا يستخدمون الفأرة،</tspan>
  <tspan x="950" dy="40">بل <tspan font-weight="bold" fill="#c0392b">لوحة المفاتيح</tspan> فقط.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Problem:</tspan> some people do not use</tspan>
  <tspan x="120" dy="40">a mouse, only the <tspan font-weight="bold" fill="#c0392b">keyboard.</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#2e7d32">الحل:</tspan> أن يمكن الوصول إلى كل زر <tspan font-weight="bold" fill="#c0392b">بمفتاح Tab،</tspan></tspan>
  <tspan x="950" dy="40">وأن يظهر <tspan font-weight="bold" fill="#17457f">بوضوح</tspan> أين يقف المستخدم.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#2e7d32">Solution:</tspan> every button can be reached</tspan>
  <tspan x="120" dy="40">with the <tspan font-weight="bold" fill="#c0392b">Tab key,</tspan> and it is <tspan font-weight="bold" fill="#17457f">clear</tspan></tspan>
  <tspan x="120" dy="40">where the user is.</tspan>
</text>
</svg>
