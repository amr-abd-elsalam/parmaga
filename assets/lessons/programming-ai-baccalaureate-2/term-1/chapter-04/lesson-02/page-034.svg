<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Did You Know?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشتهرت هذه <tspan font-weight="bold" fill="#17457f">المبادئ الأربعة</tspan> بهذا الاسم</tspan>
  <tspan x="935" dy="40">من كتاب المصممة <tspan fill="#c96a1b">روبن ويليامز</tspan></tspan>
  <tspan x="935" dy="40">«كتاب التصميم لغير المصممين».</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">These <tspan font-weight="bold" fill="#17457f">four principles</tspan> became famous</tspan>
  <tspan x="140" dy="40">under this name through designer</tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">Robin Williams's</tspan> book</tspan>
  <tspan x="140" dy="40">The Non-Designer's Design Book.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">وCRAP</tspan> بالإنجليزية كلمة عامية تعني</tspan>
  <tspan x="935" dy="40">«شيء رديء»، ولهذا <tspan font-weight="bold" fill="#2e7d32">لا تُنسى.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In English slang, <tspan font-weight="bold" fill="#c0392b">crap</tspan> means</tspan>
  <tspan x="140" dy="40">“rubbish,” which is why it is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">never forgotten.</tspan></tspan>
</text>
</svg>
