<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّف وفكّر</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PAUSE &amp; THINK</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">هل وصلت إلى <tspan font-weight="bold" fill="#17457f">رقم الطبيب</tspan> بسرعة؟</tspan>
  <tspan x="935" dy="40">ما الذي أخّرك؟</tspan>
</text>

<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Did you reach the <tspan font-weight="bold" fill="#17457f">doctor's number</tspan></tspan>
  <tspan x="140" dy="40">quickly? What slowed you down?</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صاحب هذا الموقع كان يراه جميلًا؛</tspan>
  <tspan x="950" dy="40">المشكلة ليست في الألوان، بل في أنه</tspan>
  <tspan x="950" dy="40">صمّمه <tspan font-weight="bold" fill="#c0392b">لنفسه،</tspan> لا <tspan font-weight="bold" fill="#2e7d32">لمن سيستخدمه.</tspan></tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The owner thought it was beautiful;</tspan>
  <tspan x="120" dy="40">the problem is not the colors, but that</tspan>
  <tspan x="120" dy="40">he designed it for <tspan font-weight="bold" fill="#c0392b">himself,</tspan></tspan>
  <tspan x="120" dy="40">not for <tspan font-weight="bold" fill="#2e7d32">its users.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في هذا الدرس ستغيّر <tspan font-weight="bold" fill="#c0392b">سؤالك</tspan></tspan>
  <tspan x="950" dy="40">من «ماذا أريد أنا؟» إلى</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">«من سيستخدم هذا؟</tspan> وماذا يحتاج؟ وفي أي ظروف؟».</tspan>
</text>

<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In this lesson, you will change your</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">question</tspan> from “What do I want?” to</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">“Who will use this?</tspan> What do they need?</tspan>
  <tspan x="120" dy="40">In what situation?”</tspan>
</text>
</svg>
