  <tspan x="950" dy="0">النفاذ الرقمي Digital Access</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Digital Access</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">النفاذ الرقمي Digital Access:</tspan> قدرة الناس</tspan>
  <tspan x="950" dy="40">على الوصول إلى الإنترنت والأجهزة أصلًا.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Digital access:</tspan> people's ability</tspan>
  <tspan x="120" dy="40">to reach the Internet and devices</tspan>
  <tspan x="120" dy="40">in the first place.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">لا تخلط بينهما</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Don't Mix Them Up</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">إمكانية الوصول:</tspan> هل يستطيع استخدام الموقع؟</tspan>
  <tspan x="935" dy="40">مشكلة في <tspan font-weight="bold" fill="#17457f">التصميم.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Accessibility:</tspan> Can they use</tspan>
  <tspan x="140" dy="40">the website? A <tspan font-weight="bold" fill="#17457f">design</tspan> problem.</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النفاذ الرقمي:</tspan> هل لديه جهاز وإنترنت أصلًا؟</tspan>
  <tspan x="935" dy="40">مشكلة في <tspan font-weight="bold" fill="#17457f">الظروف.</tspan></tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Digital access:</tspan> Do they have</tspan>
  <tspan x="140" dy="40">a device and Internet at all?</tspan>
  <tspan x="140" dy="40">A problem of <tspan font-weight="bold" fill="#17457f">circumstances.</tspan></tspan>
</text>
