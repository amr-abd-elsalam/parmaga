<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مثال: شخصية مستخدم</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Example: A Persona</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الحاجة <tspan font-weight="bold" fill="#c0392b">فاطمة،</tspan> 68 سنة، على المعاش.</tspan>
</text>

<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Hajja <tspan font-weight="bold" fill="#c0392b">Fatma,</tspan> 68, retired.</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">هدفها:</tspan> أن تعرف موعد طبيب العظام <tspan font-weight="bold" fill="#2e7d32">بسرعة.</tspan></tspan>
</text>

<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Her <tspan font-weight="bold" fill="#17457f">goal:</tspan> to find the bone doctor's</tspan>
  <tspan x="140" dy="40">schedule <tspan font-weight="bold" fill="#2e7d32">quickly.</tspan></tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">احتياجها وسياقها:</tspan> نظرها ضعيف،</tspan>
  <tspan x="935" dy="40">وتستخدم هاتف ابنها،</tspan>
  <tspan x="935" dy="40">ولا تحب القوائم الكثيرة.</tspan>
</text>

<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Needs and context:</tspan> her eyesight</tspan>
  <tspan x="140" dy="40">is weak, she uses her son's phone,</tspan>
  <tspan x="140" dy="40">and she dislikes long menus.</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">تحديها:</tspan> الخط الصغير والأزرار المتلاصقة.</tspan>
</text>

<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Her <tspan font-weight="bold" fill="#17457f">challenge:</tspan> small text and buttons</tspan>
  <tspan x="140" dy="40">placed too close together.</tspan>
</text>
</svg>
