<!-- Texts -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">شخصية المستخدم</tspan> تمثل نمطًا من المستخدمين</tspan>
  <tspan x="950" dy="40">بناءً على بحث أو بيانات عن <tspan font-weight="bold" fill="#17457f">أهدافهم</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">واحتياجاتهم.</tspan> (تعريف)</tspan>
</text>

<text x="120"
      y="274"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">1 A <tspan font-weight="bold" fill="#c0392b">persona</tspan> represents a type of users</tspan>
  <tspan x="120" dy="40">based on research or data about their</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">goals</tspan> and <tspan font-weight="bold" fill="#17457f">needs.</tspan> (Definition)</tspan>
</text>

<text x="950"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">2 فهي تجعل المصمم يفكر في</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">«ما يحتاجه هذا المستخدم»</tspan> بدل الاعتماد</tspan>
  <tspan x="950" dy="40">على ذوقه أو افتراضاته. (الفائدة)</tspan>
</text>

<text x="120"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">2 It makes the designer think about</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">“what this user needs”</tspan> instead of</tspan>
  <tspan x="120" dy="40">relying on taste or assumptions. (Benefit)</tspan>
</text>

<text x="950"
      y="714"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">3 فلا ينحرف اتجاه التصميم</tspan>
  <tspan x="950" dy="40">عن <tspan font-weight="bold" fill="#2e7d32">المستخدم.</tspan> (النتيجة)</tspan>
</text>

<text x="120"
      y="794"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">3 So the direction of the design does not</tspan>
  <tspan x="120" dy="40">drift away from the <tspan font-weight="bold" fill="#2e7d32">user.</tspan> (Result)</tspan>
</text>

<text x="950"
      y="914"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">4 <tspan font-weight="bold" fill="#c0392b">المخطط الهيكلي</tspan> يحدد مكان المعلومات</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">وأولويتها</tspan> قبل أي لون أو زخرفة. (تعريف)</tspan>
</text>

<text x="120"
      y="994"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">4 A <tspan font-weight="bold" fill="#c0392b">wireframe</tspan> sets the placement and</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">priority</tspan> of information before any color</tspan>
  <tspan x="120" dy="40">or decoration. (Definition)</tspan>
</text>
</svg>
