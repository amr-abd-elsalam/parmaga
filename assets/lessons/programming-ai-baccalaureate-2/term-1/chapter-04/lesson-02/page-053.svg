<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">قابلية الاستخدام</tspan>
  <tspan x="540" dy="48">وإمكانية الوصول</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">Usability and Accessibility</tspan>
</text>
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">قابلية الاستخدام</tspan> Usability: مدى قدرة</tspan>
  <tspan x="950" dy="40">مستخدمين محددين على إنجاز</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">مهمة محددة</tspan> في سياق محدد.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Usability:</tspan> how well specific users</tspan>
  <tspan x="120" dy="40">can complete a <tspan font-weight="bold" fill="#17457f">specific task</tspan></tspan>
  <tspan x="120" dy="40">in a specific context.</tspan>
</text>
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وتُقاس بثلاثة معايير:</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is measured by three criteria:</tspan>
</text>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الفاعلية</tspan> Effectiveness: هل أنجز المهمة؟</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Effectiveness:</tspan> did they</tspan>
  <tspan x="132" dy="40">complete the task?</tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الكفاءة</tspan> Efficiency: في كم من الوقت والجهد؟</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Efficiency:</tspan> how much time</tspan>
  <tspan x="132" dy="40">and effort did it take?</tspan>
</text>
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الرضا</tspan> Satisfaction: هل كانت التجربة مريحة؟</tspan>
</text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Satisfaction:</tspan> was the</tspan>
  <tspan x="132" dy="40">experience comfortable?</tspan>
</text>
</svg>
