<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لاحظ الفرق</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Notice the difference</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قابلية الاستخدام:</tspan> هل الموقع سهل؟</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Usability:</tspan> Is the site easy?</tspan>
</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">إمكانية الوصول:</tspan> هل يستطيع الجميع استخدامه؟</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Accessibility:</tspan> Can everyone use it?</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">قد يكون الموقع سهلًا لمعظم الناس،</tspan>
  <tspan x="935" dy="40">لكن <tspan fill="#c96a1b">ضعيف البصر</tspan> لا يستطيع قراءة خطه</tspan>
  <tspan x="935" dy="40">الباهت؛ فهو سهل لكنه <tspan font-weight="bold" fill="#17457f">ليس متاحًا للجميع.</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A site can be easy for most people,</tspan>
  <tspan x="140" dy="40">yet a <tspan fill="#c96a1b">low-vision user</tspan> cannot read its</tspan>
  <tspan x="140" dy="40">faint text: easy,</tspan>
  <tspan x="140" dy="40">but <tspan font-weight="bold" fill="#17457f">not accessible to everyone.</tspan></tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">هل تكفي مبادئ <tspan font-weight="bold" fill="#c0392b">CRAP</tspan> وحدها لتحقيق</tspan>
  <tspan x="935" dy="40">قابلية الاستخدام وإمكانية الوصول؟ ولماذا؟</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Are the <tspan font-weight="bold" fill="#c0392b">CRAP</tspan> principles alone enough</tspan>
  <tspan x="140" dy="40">to achieve usability and</tspan>
  <tspan x="140" dy="40">accessibility? Why?</tspan>
</text>
</svg>
