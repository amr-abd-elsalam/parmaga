<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Outlined card: shadow, fill, accent, dividers in one group -->
<g>
  <rect x="109" y="608" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>
  <rect x="105" y="602" width="870" height="608" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
  <rect x="961" y="618" width="6" height="576" rx="3" fill="#2f7fb5"/>
</g>

<!-- Face: thinking (assumptions) -->
<g transform="translate(820 336)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9 M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: thought bubble with a heart (a belief without evidence) -->
<g>
  <circle cx="852" cy="316" r="3.5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="866" cy="306" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M885 303 Q875 289 891 281 Q895 265 915 269 Q931 259 943 275 Q957 281 949 297 Q953 313 933 313 H897 Q879 315 885 303 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M915 304 C900 294 898 282 907 279 C912 278 915 282 915 285 C915 282 918 278 923 279 C932 282 930 294 915 304 Z" fill="#c0392b" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Icon: data document with a check badge (the cure) -->
<g transform="translate(870 534)">
  <rect x="-16" y="-23" width="36" height="46" rx="4" fill="#22303f" opacity=".18"/>
  <rect x="-20" y="-23" width="36" height="46" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M-13 -13 H8 M-13 -5 H4" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="-13" y="8" width="6" height="8" fill="#f0c48c"/>
  <rect x="-4" y="3" width="6" height="13" fill="#2f7fb5"/>
  <rect x="5" y="-1" width="6" height="17" fill="#2e7d32"/>
  <circle cx="26" cy="-20" r="12" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M20 -20 L24 -16 L32 -24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: pencil (your turn) -->
<g transform="translate(395 658)">
  <polygon points="-18,10 12,-20 20,-12 -10,18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="12,-20 17,-25 25,-17 20,-12" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="-18,10 -10,18 -24,24" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="-21,19 -24,24 -19,21" fill="#22303f"/>
  <path d="M-12 6 L14 -20" fill="none" stroke="#c96a1b" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Illustration: the task context, a bus, a phone, and a weak signal -->
<g>
  <rect x="799" y="886" width="142" height="66" rx="12" fill="#22303f" opacity=".18"/>
  <path d="M780 900 H790 M776 912 H788 M780 924 H790" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="795" y="880" width="142" height="66" rx="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="805" y="890" width="26" height="22" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="837" y="890" width="26" height="22" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="869" y="890" width="26" height="22" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="882" cy="904" r="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <path d="M876 903 Q876 895 882 895 Q888 895 888 903 Q885 899 882 899 Q879 899 876 903 Z" fill="#2b211c"/>
  <rect x="903" y="890" width="24" height="46" rx="3" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="797" y="922" width="102" height="6" fill="#c96a1b"/>
  <circle cx="822" cy="948" r="10" fill="#22303f"/>
  <circle cx="822" cy="948" r="4" fill="#7f95ab"/>
  <circle cx="910" cy="948" r="10" fill="#22303f"/>
  <circle cx="910" cy="948" r="4" fill="#7f95ab"/>
  <rect x="806" y="826" width="28" height="46" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="810" y="831" width="20" height="32" rx="2" fill="#4fc3e8"/>
  <path d="M820 840 A7 7 0 1 1 813 847" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="862" y="858" width="9" height="12" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="875" y="850" width="9" height="20" fill="#e8dfd1" stroke="#7f95ab" stroke-width="2.5"/>
  <rect x="888" y="842" width="9" height="28" fill="#e8dfd1" stroke="#7f95ab" stroke-width="2.5"/>
  <rect x="901" y="834" width="9" height="36" fill="#e8dfd1" stroke="#7f95ab" stroke-width="2.5"/>
</g>

<!-- Icon: star (remember) -->
<g transform="translate(220 1042) scale(.8)">
  <polygon points="0,-24 5.9,-8.1 22.8,-7.4 9.5,3.1 14.1,19.4 0,10 -14.1,19.4 -9.5,3.1 -22.8,-7.4 -5.9,-8.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Face: wink (tip) -->
<g transform="translate(300 1042)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: the five persona elements, read right to left -->
<g>
  <!-- name: ID tag -->
  <g transform="translate(890 1124)">
    <rect x="-20" y="-14" width="40" height="28" rx="5" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
    <path d="M-15 10 Q-9 2 -3 10 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-9" cy="-3" r="4.5" fill="#d59f6f" stroke="#22303f" stroke-width="2"/>
    <path d="M3 -5 H14 M3 2 H14 M3 8 H10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- goal: target -->
  <g transform="translate(810 1124)">
    <circle cx="0" cy="0" r="18" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#c0392b"/>
  </g>
  <!-- need: checklist -->
  <g transform="translate(730 1124)">
    <rect x="-15" y="-19" width="30" height="38" rx="4" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
    <path d="M-9 -9 L-6 -6 L-1 -12 M-9 5 L-6 8 L-1 2" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 -9 H10 M4 5 H10" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- context: map pin -->
  <g transform="translate(850 1176)">
    <path d="M0 20 C-12 6 -16 -1 -16 -6 C-16 -15 -9 -20 0 -20 C9 -20 16 -15 16 -6 C16 -1 12 6 0 20 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-6" r="5.5" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  </g>
  <!-- challenge: mountain -->
  <g transform="translate(770 1176)">
    <polygon points="-20,16 -4,-16 12,16" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="2,16 12,-2 22,16" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="-4,-16 -9,-6 1,-6" fill="#ffffff"/>
  </g>
</g>

<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الافتراضات الشخصية</tspan> Assumptions: ما يظنه</tspan>
  <tspan x="950" dy="40">المصمم عن المستخدم <tspan font-weight="bold" fill="#17457f">دون دليل،</tspan> مثل:</tspan>
  <tspan x="950" dy="40">«أنا أرى أن الناس يحبون هذا».</tspan>
</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Assumptions:</tspan> what the designer believes</tspan>
  <tspan x="120" dy="40">about the user <tspan font-weight="bold" fill="#17457f">without evidence,</tspan></tspan>
  <tspan x="120" dy="40">such as “I think people like this.”</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وشخصية المستخدم المبنية <tspan font-weight="bold" fill="#2e7d32">على البيانات</tspan></tspan>
  <tspan x="950" dy="40">هي <tspan font-weight="bold" fill="#17457f">علاج</tspan> هذه الافتراضات.</tspan>
</text>

<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A persona <tspan font-weight="bold" fill="#2e7d32">built on data</tspan> is <tspan font-weight="bold" fill="#17457f">the cure</tspan></tspan>
  <tspan x="120" dy="40">for these assumptions.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">دورك الآن</text>

<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">YOUR TURN</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اكتب <tspan font-weight="bold" fill="#c0392b">شخصية مستخدم</tspan> لزميل يبحث عن نتيجته</tspan>
  <tspan x="935" dy="40">من الهاتف <tspan fill="#c96a1b">في الحافلة</tspan> والإنترنت ضعيف.</tspan>
</text>

<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Write a <tspan font-weight="bold" fill="#c0392b">persona</tspan> for a classmate who</tspan>
  <tspan x="140" dy="40">looks for his result on his phone</tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">on the bus</tspan> with a weak</tspan>
  <tspan x="140" dy="40">Internet connection.</tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">اذكر:</tspan> الاسم، والهدف، والاحتياج،</tspan>
  <tspan x="935" dy="40">والسياق، والتحدي.</tspan>
</text>

<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Include:</tspan> the name, the goal,</tspan>
  <tspan x="140" dy="40">the need, the context,</tspan>
  <tspan x="140" dy="40">and the challenge.</tspan>
</text>
</svg>
