<!-- Info card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لماذا يقول الكتاب «غالبًا»؟</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Why does the book say “usually”?</tspan>
</text>

<!-- Info card paragraph -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">لأن بعض المخططات الهيكلية</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">عالية الدقة،</tspan> فليست كلها خالية تمامًا</tspan>
  <tspan x="935" dy="40">من التفاصيل البصرية.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">Because some wireframes are</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">high-fidelity,</tspan> so not all of them are</tspan>
  <tspan x="140" dy="40">completely free of visual detail.</tspan>
</text>

<!-- Section header -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">ثلاث كلمات يخلطها الطلاب</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Three Words Students Mix Up</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">المخطط الهيكلي، ثم النموذج البصري، ثم</tspan>
  <tspan x="950" dy="40">النموذج الأولي التفاعلي: <tspan font-weight="bold" fill="#17457f">ثلاث مراحل مختلفة.</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Wireframe, then mockup, then prototype:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">three different stages.</tspan></tspan>
</text>

