<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بنية المعلومات</tspan> Information Architecture:</tspan>
  <tspan x="950" dy="40">طريقة <tspan font-weight="bold" fill="#17457f">تقسيم</tspan> محتوى الموقع كله</tspan>
  <tspan x="950" dy="40">وتسميته وربط أجزائه.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Information architecture:</tspan> how the whole</tspan>
  <tspan x="120" dy="40">site's content is <tspan font-weight="bold" fill="#17457f">divided,</tspan> named, and</tspan>
  <tspan x="120" dy="40">linked together.</tspan>
</text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> <tspan fill="#c96a1b">صفحة رئيسية</tspan> تتفرع منها: الخدمات،</tspan>
  <tspan x="950" dy="40">والأطباء، والمواعيد، والعنوان.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> a <tspan fill="#c96a1b">home page</tspan> that branches into</tspan>
  <tspan x="120" dy="40">services, doctors, schedules, and address.</tspan>
</text>
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التخطيط</tspan> Layout: ترتيب العناصر</tspan>
  <tspan x="950" dy="40">داخل صفحة واحدة، <tspan font-weight="bold" fill="#17457f">والمخطط الهيكلي</tspan></tspan>
  <tspan x="950" dy="40">هو رسم هذا التخطيط.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Layout:</tspan> the arrangement of elements</tspan>
  <tspan x="120" dy="40">inside one page; a <tspan font-weight="bold" fill="#17457f">wireframe</tspan> is</tspan>
  <tspan x="120" dy="40">a drawing of this layout.</tspan>
</text>

<text x="965" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الصفحة الرئيسية</text>
