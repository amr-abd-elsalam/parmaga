<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> كل العناوين <tspan font-weight="bold" fill="#17457f">باللون الأزرق</tspan> وبالخط نفسه</tspan>
  <tspan x="950" dy="40">في كل الصفحات، فلا يشعر المستخدم</tspan>
  <tspan x="950" dy="40">أنه انتقل إلى موقع آخر.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> all headings are <tspan font-weight="bold" fill="#17457f">blue</tspan> and in</tspan>
  <tspan x="120" dy="40">the same font on every page, so the user</tspan>
  <tspan x="120" dy="40">never feels they moved to another site.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلح مرتبط</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Related Term</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الاتساق</tspan> Consistency: أن يبدو كل عنصر</tspan>
  <tspan x="935" dy="40">متشابه ويتصرف <tspan font-weight="bold" fill="#17457f">بالطريقة نفسها</tspan> في كل مكان</tspan>
  <tspan x="935" dy="40">من الموقع.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Consistency:</tspan> similar elements look</tspan>
  <tspan x="140" dy="40">and behave <tspan font-weight="bold" fill="#17457f">the same way</tspan> everywhere</tspan>
  <tspan x="140" dy="40">on the site.</tspan>
</text>
