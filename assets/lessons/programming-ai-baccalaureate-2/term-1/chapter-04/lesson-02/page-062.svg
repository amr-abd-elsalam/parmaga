<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam Traps</text>

<text x="968" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الفخ</text>
<text x="557" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">The trap</text>
<text x="523" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الصحيح</text>
<text x="112" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">Correct</text>

<text x="968" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0"><tspan font-weight="bold" fill="#c0392b">المخطط الهيكلي</tspan> تصميم</tspan>
  <tspan x="968" dy="40">نهائي بالألوان</tspan>
</text>
<text x="557" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0"><tspan font-weight="bold" fill="#c0392b">Wireframe</tspan> = a final</tspan>
  <tspan x="557" dy="40">colored design</tspan>
</text>
<text x="523" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> هيكل أولي</tspan>
  <tspan x="523" dy="40">للأماكن والأولويات</tspan>
</text>
<text x="112" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> it plans</tspan>
  <tspan x="112" dy="40">place and priority</tspan>
</text>
<text x="523" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan fill="#c96a1b">«الكروكي</tspan> مش الشقة»</tspan>
</text>
<text x="112" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">“The <tspan fill="#c96a1b">sketch</tspan> is not</tspan>
  <tspan x="112" dy="40">the apartment”</tspan>
</text>

<text x="968" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="968" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">UCD</tspan> يعني راحة</tspan>
  <tspan x="968" dy="40">المُنشئ أو المطوّر</tspan>
</text>
<text x="557" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="557" dy="0"><tspan font-weight="bold" fill="#c0392b">UCD</tspan> means the</tspan>
  <tspan x="557" dy="40">creator's comfort</tspan>
</text>
<text x="523" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0"><tspan font-weight="bold" fill="#c0392b">خطأ:</tspan> يعني</tspan>
  <tspan x="523" dy="40">منظور <tspan font-weight="bold" fill="#2e7d32">المستخدم</tspan></tspan>
</text>
<text x="112" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0"><tspan font-weight="bold" fill="#c0392b">Wrong:</tspan> it means</tspan>
  <tspan x="112" dy="40">the <tspan font-weight="bold" fill="#2e7d32">user's</tspan> view</tspan>
</text>
<text x="523" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="523" dy="0">«لمين؟ للمستخدم»</tspan>
</text>
<text x="112" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">“For whom?</tspan>
  <tspan x="112" dy="40">For the user.”</tspan>
</text>
