<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: صورة المنتج واسمه وسعره <tspan font-weight="bold" fill="#17457f">متقاربة،</tspan></tspan>
  <tspan x="950" dy="40">وبين كل منتج والآخر <tspan font-weight="bold" fill="#17457f">مسافة واضحة.</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: a product's image, name,</tspan>
  <tspan x="120" dy="40">and price sit <tspan font-weight="bold" fill="#17457f">close together,</tspan></tspan>
  <tspan x="120" dy="40">with <tspan font-weight="bold" fill="#17457f">clear space</tspan> between one product</tspan>
  <tspan x="120" dy="40">and the next.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">ماذا لو أخطأنا؟</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">What If We Get It Wrong?</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو اقترب سعر منتج من صورة <tspan font-weight="bold" fill="#17457f">منتج آخر،</tspan></tspan>
  <tspan x="935" dy="40">سيظن المستخدم أنه <tspan font-weight="bold" fill="#17457f">سعره.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If one product's price sits closer to</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">another product's</tspan> image,</tspan>
  <tspan x="140" dy="40">the user will think it is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">that product's price.</tspan></tspan>
</text>
</svg>
