<!-- Titles -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">التفكير التصميمي:</tspan>
  <tspan x="540" dy="48">انظر بعين المستخدم</tspan>
</text>
<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">
  <tspan x="540" dy="0">Design Thinking: See Through the User's Eyes</tspan>
</text>

<!-- Info card text -->
<text x="935"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935"
      y="394"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التفكير التصميمي</tspan> (Design Thinking):</tspan>
  <tspan x="935" dy="40">طريقة <tspan font-weight="bold" fill="#17457f">مرنة</tspan> لحل المشكلات تبدأ من</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">فهم المستخدم،</tspan> ثم تولّد حلولًا وتجرّبها</tspan>
  <tspan x="935" dy="40">وتحسّنها، مع إمكان الرجوع بين مراحلها.</tspan>
</text>
<text x="140"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Design Thinking:</tspan> a <tspan font-weight="bold" fill="#17457f">flexible</tspan> way of</tspan>
  <tspan x="140" dy="40">solving problems that starts with</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">understanding the user,</tspan> then</tspan>
  <tspan x="140" dy="40">generates solutions, tries them, and</tspan>
  <tspan x="140" dy="40">improves them, with the option of</tspan>
  <tspan x="140" dy="40">going back between its stages.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935"
      y="834"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">القاعدة الذهبية: المطوّر ليس هو المستخدم.</tspan>
</text>
<text x="140"
      y="874"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">The golden rule:</tspan>
  <tspan x="140" dy="40">the developer is not the user.</tspan>
</text>
</svg>
