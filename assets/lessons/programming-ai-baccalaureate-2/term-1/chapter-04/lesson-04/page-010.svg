<!-- Texts -->
<text x="960" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="960" dy="0">رأي</tspan>
</text>
<text x="645" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="645" dy="0">Opinion</tspan>
</text>
<text x="605" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="605" dy="0">دليل</tspan>
</text>
<text x="115" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">Evidence</tspan>
</text>
<text x="960" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="960" dy="0">«أشعر أن</tspan>
  <tspan x="960" dy="40">الصفحة سيئة.»</tspan>
</text>
<text x="645" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="645" dy="0">“I feel the page</tspan>
  <tspan x="645" dy="40">is bad.”</tspan>
</text>
<text x="605" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="605" dy="0">«غادر <tspan fill="#c96a1b">70%</tspan> من الزوار</tspan>
  <tspan x="605" dy="40">الصفحة خلال <tspan fill="#c96a1b">10</tspan> ثوانٍ.»</tspan>
</text>
<text x="115" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan fill="#c96a1b">“70%</tspan> of visitors left the</tspan>
  <tspan x="115" dy="40">page within <tspan fill="#c96a1b">10</tspan> seconds.”</tspan>
</text>
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لاحظ أن <tspan font-weight="bold" fill="#c0392b">الرأي</tspan> يبدأ غالبًا بـ «أشعر» أو «أظن»،</tspan>
  <tspan x="950" dy="40">أما <tspan font-weight="bold" fill="#2e7d32">الدليل</tspan> فيبدأ <tspan font-weight="bold" fill="#17457f">برقم</tspan> أو ملاحظة.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Notice that an <tspan font-weight="bold" fill="#c0392b">opinion</tspan> often starts with</tspan>
  <tspan x="120" dy="40">“I feel” or “I think”, while <tspan font-weight="bold" fill="#2e7d32">evidence</tspan></tspan>
  <tspan x="120" dy="40">starts with a <tspan font-weight="bold" fill="#17457f">number</tspan> or an observation.</tspan>
</text>
</svg>
