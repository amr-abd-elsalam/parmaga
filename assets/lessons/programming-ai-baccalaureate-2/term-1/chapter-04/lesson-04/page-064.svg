<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الأدوات الثلاث معًا</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Three Tools Together</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأدوات الثلاث</tspan> لا تعمل منفصلة،</tspan>
  <tspan x="950" dy="40">بل <tspan font-weight="bold" fill="#2e7d32">تتعاون</tspan> في قصة واحدة.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">three tools</tspan> do not work separately;</tspan>
  <tspan x="120" dy="40">they work <tspan font-weight="bold" fill="#2e7d32">together</tspan> in one story.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يمكنك أن تستخدم <tspan font-weight="bold" fill="#17457f">العين</tspan> في خطوة «خطّط»</tspan>
  <tspan x="950" dy="40">لتفهم المشكلة وتولّد الأفكار، <tspan font-weight="bold" fill="#17457f">والميزان</tspan></tspan>
  <tspan x="950" dy="40">في خطوتي «نفّذ» و«تحقّق»</tspan>
  <tspan x="950" dy="40">لتقارن بين فكرتين <tspan fill="#c96a1b">بالأرقام.</tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You can use the <tspan font-weight="bold" fill="#17457f">eye</tspan> in the “Plan” step</tspan>
  <tspan x="120" dy="40">to understand the problem and generate</tspan>
  <tspan x="120" dy="40">ideas, and the <tspan font-weight="bold" fill="#17457f">scale</tspan> in the “Do”</tspan>
  <tspan x="120" dy="40">and “Check” steps to compare two</tspan>
  <tspan x="120" dy="40">ideas with <tspan fill="#c96a1b">numbers.</tspan></tspan>
</text>

<!-- Illustration labels (Layout order) -->
<text x="205" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">خطّط</text>
<text x="143" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Plan</text>
<text x="892" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">نفّذ</text>
<text x="846" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Do</text>
<text x="580" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تحقّق</text>
<text x="500" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Check</text>
<text x="222" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تصرّف</text>
<text x="157" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Act</text>
</svg>
