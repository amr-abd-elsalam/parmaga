<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">مثال: الصورة المصغرة للفيديو</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Example: The Video Thumbnail</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صانع محتوى على منصة فيديو لديه</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">صورتان مصغرتان</tspan> لفيديو واحد: الصورة A</tspan>
  <tspan x="950" dy="40">وهو <tspan fill="#c96a1b">مبتسم،</tspan> والصورة B وهو <tspan fill="#c96a1b">متفاجئ.</tspan></tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A content creator on a video platform</tspan>
  <tspan x="120" dy="40">has <tspan font-weight="bold" fill="#c0392b">two thumbnails</tspan> for one video:</tspan>
  <tspan x="120" dy="40">image A with him <tspan fill="#c96a1b">smiling,</tspan> and image B</tspan>
  <tspan x="120" dy="40">with him <tspan fill="#c96a1b">surprised.</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بدل أن يسأل أصحابه «أيهما أجمل؟»،</tspan>
  <tspan x="950" dy="40">يعرض الصورة A على <tspan font-weight="bold" fill="#17457f">نصف المشاهدين،</tspan></tspan>
  <tspan x="950" dy="40">والصورة B على النصف الآخر، ثم يقارن</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">نسبة النقر</tspan> في الحالتين.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Instead of asking his friends</tspan>
  <tspan x="120" dy="40">“Which one is nicer?”, he shows image A</tspan>
  <tspan x="120" dy="40">to <tspan font-weight="bold" fill="#17457f">half of the viewers</tspan> and image B</tspan>
  <tspan x="120" dy="40">to the other half, then compares the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">click-through rate</tspan> in both cases.</tspan>
</text>
</svg>
