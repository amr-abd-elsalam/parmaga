<!-- Illustration: one goal phrase, two different results -->
<g>
  <defs>
    <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ilBarC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb5"/>
      <stop offset="1" stop-color="#17457f"/>
    </linearGradient>
    <linearGradient id="ilBarL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcbe"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="ilBarR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c48c"/>
      <stop offset="1" stop-color="#c96a1b"/>
    </linearGradient>
  </defs>
  <!-- shadows -->
  <rect x="224" y="1014" width="640" height="242" rx="24" fill="#22303f" opacity=".18"/>
  <!-- panel and sky -->
  <rect x="220" y="1008" width="640" height="242" rx="24" fill="url(#ilSky)" stroke="#8fc9f2" stroke-width="2"/>
  <ellipse cx="292" cy="1054" rx="22" ry="12" fill="#ffffff"/>
  <ellipse cx="314" cy="1046" rx="18" ry="14" fill="#ffffff"/>
  <ellipse cx="334" cy="1056" rx="18" ry="10" fill="#ffffff"/>
  <circle cx="790" cy="1050" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <!-- ground -->
  <ellipse cx="540" cy="1226" rx="300" ry="14" fill="#a9dcbe"/>
  <path d="M256 1226 Q 260 1213 264 1226 M268 1226 Q 271 1216 274 1226 M806 1226 Q 810 1213 814 1226 M818 1226 Q 821 1216 824 1226" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <!-- bar shadows -->
  <rect x="504" y="1092" width="80" height="140" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="294" y="1152" width="70" height="80" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="724" y="1166" width="70" height="66" rx="8" fill="#22303f" opacity=".18"/>
  <!-- bars -->
  <rect x="500" y="1086" width="80" height="140" rx="8" fill="url(#ilBarC)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="512" y="1100" width="10" height="112" rx="5" fill="#ffffff" opacity=".35"/>
  <rect x="290" y="1146" width="70" height="80" rx="8" fill="url(#ilBarL)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="300" y="1158" width="9" height="56" rx="4.5" fill="#ffffff" opacity=".35"/>
  <rect x="720" y="1160" width="70" height="66" rx="8" fill="url(#ilBarR)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="730" y="1172" width="9" height="42" rx="4.5" fill="#ffffff" opacity=".35"/>
  <!-- fork sign -->
  <rect x="504" y="1022" width="80" height="36" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="536" y="1048" width="8" height="42" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="500" y="1016" width="80" height="36" rx="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M540 1046 L540 1036 L526 1025 M540 1036 L554 1025" fill="none" stroke="#17457f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="521,1021 530,1022 522,1030" fill="#17457f"/>
  <polygon points="559,1021 550,1022 558,1030" fill="#17457f"/>
  <!-- arrow shadows -->
  <g transform="translate(544 1098) rotate(13.52)">
    <polygon points="0,-7 190,-7 190,-16 214,0 190,16 190,7 0,7" fill="#22303f" opacity=".18"/>
  </g>
  <g transform="translate(544 1098) rotate(169.74)">
    <polygon points="0,-7 189,-7 189,-16 213,0 189,16 189,7 0,7" fill="#22303f" opacity=".18"/>
  </g>
  <!-- branching arrows -->
  <g transform="translate(540 1092) rotate(13.52)">
    <polygon points="0,-7 190,-7 190,-16 214,0 190,16 190,7 0,7" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(540 1092) rotate(169.74)">
    <polygon points="0,-7 189,-7 189,-16 213,0 189,16 189,7 0,7" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="540" cy="1092" r="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: star -->
<g transform="translate(162 1130)">
  <polygon points="0,-24 5.9,-8.1 22.8,-7.4 9.5,3.1 14.1,19.4 0,10 -14.1,19.4 -9.5,3.1 -22.8,-7.4 -5.9,-8.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: document stack -->
<g transform="translate(918 1130)">
  <rect x="-14" y="-26" width="30" height="38" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-20" y="-20" width="30" height="40" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -14 -10 L 4 -10 M -14 -2 L 4 -2 M -14 6 L -2 6" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">عبارة «خفض معدل الارتداد بنسبة 10%»</tspan>
  <tspan x="935" dy="40">قد تحمل <tspan font-weight="bold" fill="#c0392b">معنيين.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The phrase “reduce the bounce rate</tspan>
  <tspan x="140" dy="40">by 10%” can have <tspan font-weight="bold" fill="#c0392b">two meanings.</tspan></tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">إذا كان المعدل 50%، فقد تعني أن يصبح 40%</tspan>
  <tspan x="935" dy="40">(نقص 10 <tspan font-weight="bold" fill="#c0392b">نقاط مئوية)،</tspan></tspan>
  <tspan x="935" dy="40">وقد تعني أن يصبح 45% (نقص 10% <tspan font-weight="bold" fill="#17457f">من قيمته).</tspan></tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If the rate is 50%, it may mean</tspan>
  <tspan x="140" dy="40">it becomes 40% (a drop of 10</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">percentage points),</tspan> or it may mean</tspan>
  <tspan x="140" dy="40">it becomes 45% (a drop of 10%</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">of its value).</tspan></tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لذلك اكتب الهدف دائمًا <tspan font-weight="bold" fill="#17457f">بالرقم النهائي،</tspan></tspan>
  <tspan x="935" dy="40">مثل «من 50% إلى 40%».</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">So always write the goal with</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">the final number,</tspan> such as</tspan>
  <tspan x="140" dy="40">“from 50% to 40%”.</tspan>
</text>
</svg>
