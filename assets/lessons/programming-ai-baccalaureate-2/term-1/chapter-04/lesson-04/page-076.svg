<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">خذ الدرس معك</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Take the Lesson With You</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">مشروعك الشخصي: PDCA على نفسك</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Your Personal Project:</tspan>
  <tspan x="120" dy="40">PDCA on Yourself</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">طبّق <tspan font-weight="bold" fill="#17457f">الدورة</tspan> على نفسك هذا الأسبوع، لتتحول</tspan>
  <tspan x="950" dy="40">المعلومة من درس للامتحان إلى <tspan font-weight="bold" fill="#2e7d32">مهارة للحياة.</tspan></tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Apply the <tspan font-weight="bold" fill="#17457f">cycle</tspan> to yourself this week,</tspan>
  <tspan x="120" dy="40">so the lesson turns from exam</tspan>
  <tspan x="120" dy="40">information into a <tspan font-weight="bold" fill="#2e7d32">life skill.</tspan></tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 اختر <tspan font-weight="bold" fill="#c0392b">عادة واحدة</tspan> تريد تحسينها،</tspan>
  <tspan x="950" dy="40">مثل وقت نومك، أو ساعات استخدام الموبايل،</tspan>
  <tspan x="950" dy="40">أو درجتك في مادة.</tspan>
</text>

<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 Choose <tspan font-weight="bold" fill="#c0392b">one habit</tspan> you want to improve,</tspan>
  <tspan x="132" dy="40">such as your bedtime, your phone hours,</tspan>
  <tspan x="132" dy="40">or your grade in a subject.</tspan>
</text>
</svg>
