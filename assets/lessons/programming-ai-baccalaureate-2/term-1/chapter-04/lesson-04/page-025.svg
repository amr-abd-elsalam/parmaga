<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">مثال 1: مذاكرتك</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Example 1: Your Studying</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">خطّط:</tspan> «سأحصل على <tspan fill="#c96a1b">8 من 10</tspan> في امتحان الوحدة،</tspan>
  <tspan x="950" dy="40">وسأذاكر ساعة كل يوم.»</tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Plan:</tspan> “I will score <tspan fill="#c96a1b">8 out of 10</tspan></tspan>
  <tspan x="132" dy="40">on the unit test, and I will study</tspan>
  <tspan x="132" dy="40">for one hour every day.”</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">نفّذ:</tspan> تذاكر ساعة كل يوم <tspan font-weight="bold" fill="#17457f">فعلًا.</tspan></tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Do:</tspan> you <tspan font-weight="bold" fill="#17457f">actually</tspan> study</tspan>
  <tspan x="132" dy="40">for one hour every day.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تحقّق:</tspan> تحل امتحانًا تجريبيًا</tspan>
  <tspan x="950" dy="40">فتجد درجتك <tspan fill="#c96a1b">6 من 10.</tspan></tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Check:</tspan> you take a practice test</tspan>
  <tspan x="132" dy="40">and find that your score is <tspan fill="#c96a1b">6 out of 10.</tspan></tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تصرّف:</tspan> تكتشف أن المسائل نقطة ضعفك،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">فتعدّل خطتك</tspan> لتخصص نصف الساعة للمسائل.</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Act:</tspan> you discover that problems are</tspan>
  <tspan x="132" dy="40">your weak point, so you <tspan font-weight="bold" fill="#17457f">revise your plan</tspan></tspan>
  <tspan x="132" dy="40">to spend half the hour on problems.</tspan>
</text>
</svg>
