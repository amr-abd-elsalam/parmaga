  <rect x="804" y="1005" width="112" height="100" rx="22" fill="url(#ilDo)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="814" y="1086" width="92" height="10" rx="5" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 810 1056 L 820 1056 M 812 1067 L 821 1067" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 828 1078 L 828 1050 Q 829 1041 839 1042 L 852 1046 Q 858 1056 870 1058 L 888 1063 Q 900 1067 899 1076 L 899 1078 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 846 1052 L 850 1060 M 854 1055 L 858 1063 M 862 1060 L 866 1067" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="824" y="1076" width="80" height="8" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>

