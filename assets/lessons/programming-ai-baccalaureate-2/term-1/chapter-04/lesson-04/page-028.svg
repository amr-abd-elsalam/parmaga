  <!-- shadows -->
  <rect x="488" y="858" width="112" height="100" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="808" y="1011" width="112" height="100" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="488" y="1166" width="112" height="100" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="168" y="1011" width="112" height="100" rx="22" fill="#22303f" opacity=".18"/>
  <g transform="translate(404 1016)">
    <polygon points="27.9,-8 37.5,-5.9 37.5,5.9 27.9,8 25.4,14.1 30.7,22.3 22.3,30.7 14.1,25.4 8,27.9 5.9,37.5 -5.9,37.5 -8,27.9 -14.1,25.4 -22.3,30.7 -30.7,22.3 -25.4,14.1 -27.9,8 -37.5,5.9 -37.5,-5.9 -27.9,-8 -25.4,-14.1 -30.7,-22.3 -22.3,-30.7 -14.1,-25.4 -8,-27.9 -5.9,-37.5 5.9,-37.5 8,-27.9 14.1,-25.4 22.3,-30.7 30.7,-22.3 25.4,-14.1" fill="#22303f" opacity=".18"/>
  </g>

