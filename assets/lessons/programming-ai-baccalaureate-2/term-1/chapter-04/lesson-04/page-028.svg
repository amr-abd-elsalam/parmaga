  <rect x="555" y="1216" width="12" height="32" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="572" y="1204" width="12" height="44" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 532 1182 L 532 1248 L 588 1248" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 538 1214 L 556 1200 L 566 1204 L 584 1182" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="589,1176 587.2,1186.2 579.4,1179.8" fill="#2e7d32"/>

  <!-- Act tile: judge's gavel -->
  <rect x="164" y="1005" width="112" height="100" rx="22" fill="url(#ilAct)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="190" y="1082" width="62" height="14" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="196" y="1076" width="50" height="8" rx="3" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="229.2,1013.7 235.4,1018.9 214.1,1044.2 208,1039" fill="#b07a45" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="194.2,1027.4 227.9,1055.7 213.8,1072.6 180.1,1044.3" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="221.8,1050.6 224.9,1053.1 210.7,1070 207.7,1067.4" fill="#b07a45"/>
  <polygon points="200.4,1032.6 197.3,1030 183.1,1046.9 186.2,1049.4" fill="#b07a45"/>
  <path d="M 258 1078 L 266 1072 M 260 1088 L 270 1088 M 174 1086 L 182 1082" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- central gear: the wheel that never stops -->
  <g transform="translate(400 1010)">
    <polygon points="27.9,-8 37.5,-5.9 37.5,5.9 27.9,8 25.4,14.1 30.7,22.3 22.3,30.7 14.1,25.4 8,27.9 5.9,37.5 -5.9,37.5 -8,27.9 -14.1,25.4 -22.3,30.7 -30.7,22.3 -25.4,14.1 -27.9,8 -37.5,5.9 -37.5,-5.9 -27.9,-8 -25.4,-14.1 -30.7,-22.3 -22.3,-30.7 -14.1,-25.4 -8,-27.9 -5.9,-37.5 5.9,-37.5 8,-27.9 14.1,-25.4 22.3,-30.7 30.7,-22.3 25.4,-14.1" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="18" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#17457f"/>
  </g>

  <!-- clockwise cycle arrows -->
  <path d="M 610 902 C 740 900, 840 920, 848 988" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="849.4,999.9 854.6,984.2 840.7,985.8" fill="#c0392b"/>
  <path d="M 812 1122 C 800 1190, 720 1214, 614 1212" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="602,1212 617,1205 617,1219" fill="#c0392b"/>
  <path d="M 468 1212 C 360 1214, 280 1190, 268 1124" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="265.9,1112.2 275.5,1125.7 261.7,1128.2" fill="#c0392b"/>
  <path d="M 232 990 C 240 920, 340 900, 468 902" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="480,902 465,895 465,909" fill="#c0392b"/>

  <!-- connector from the Plan label to the top tile -->
  <path d="M 700 1060 L 693.1 1052.8 M 688.2 1047.7 L 681.3 1040.5 M 676.5 1035.5 L 669.6 1028.2 M 664.7 1023.2 L 657.8 1016 M 652.9 1010.9 L 646 1003.7 M 641.2 998.6 L 634.3 991.4 M 629.4 986.4 L 622.5 979.1" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="606,962 620.7,967.3 610.6,976.9" fill="#c0392b"/>
</g>

<!-- light bulb icon beside the card header -->
<g transform="translate(680 132)">
  <path d="M 6 6 L 9 9 M 42 6 L 39 9 M 3 19 L 7 19 M 45 19 L 41 19" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="24" cy="19" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 17 16 Q 18 10 24 9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="18" y="32" width="12" height="7" rx="2" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="39" width="8" height="5" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- wink face (tip) -->
<g transform="translate(170 905)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- star icon (remember) -->
<g transform="translate(900 905)">
  <polygon points="0,-28 7.05,-9.71 26.63,-8.65 11.41,3.71 16.46,22.65 0,12 -16.46,22.65 -11.41,3.71 -26.63,-8.65 -7.05,-9.71" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Card texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">طريقة للحفظ</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">MEMORY TRICK</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">بالإنجليزية: <tspan font-weight="bold" fill="#17457f">Please Do Check Again،</tspan></tspan>
  <tspan x="935" dy="40">أي «من فضلك تحقّق مرة أخرى».</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In English: <tspan font-weight="bold" fill="#17457f">Please Do Check Again</tspan> —</tspan>
  <tspan x="140" dy="40">that is, “please check one more time”.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الجملة نفسها معناها <tspan font-weight="bold" fill="#c0392b">التكرار،</tspan></tspan>
  <tspan x="935" dy="40">وهذا هو <tspan font-weight="bold" fill="#17457f">جوهر</tspan> الدورة.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The sentence itself means <tspan font-weight="bold" fill="#c0392b">repeating,</tspan></tspan>
  <tspan x="140" dy="40">and that is the <tspan font-weight="bold" fill="#17457f">heart</tspan> of the cycle.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">بالعربية: «خطّط على الورق، نفّذ على الأرض،</tspan>
  <tspan x="935" dy="40">تحقّق بالأرقام، تصرّف بالقرار.»</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In Arabic: “Plan on paper,</tspan>
  <tspan x="140" dy="40">do on the ground, check with numbers,</tspan>
  <tspan x="140" dy="40">act with a decision.”</tspan>
</text>

<!-- Illustration labels -->
<text x="728" y="1106" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="728" dy="0">خطّط</tspan>
</text>
<text x="666" y="1144" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="666" dy="0">Plan</tspan>
</text>
<text x="894" y="1196" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="894" dy="0">نفّذ</tspan>
</text>
<text x="846" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="846" dy="0">Do</tspan>
</text>
<text x="576" y="1106" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="576" dy="0">تحقّق</tspan>
</text>
<text x="500" y="1144" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="500" dy="0">Check</tspan>
</text>
<text x="250" y="1196" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="250" dy="0">تصرّف</tspan>
</text>
<text x="190" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="190" dy="0">Act</tspan>
</text>
</svg>
