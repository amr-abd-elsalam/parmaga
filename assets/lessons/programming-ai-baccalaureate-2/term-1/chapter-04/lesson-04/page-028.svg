  <path d="M 512 868 Q 512 864 516 864 L 550 864 L 562 876 L 562 926 Q 562 930 558 930 L 516 930 Q 512 930 512 926 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
