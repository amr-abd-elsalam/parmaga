<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معدل التحويل</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">CONVERSION RATE</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل التحويل</tspan> (Conversion Rate): نسبة</tspan>
  <tspan x="935" dy="40">الزوار الذين أتموا <tspan font-weight="bold" fill="#17457f">الهدف المطلوب،</tspan></tspan>
  <tspan x="935" dy="40">مثل التسجيل أو الشراء.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Conversion Rate:</tspan> the percentage of</tspan>
  <tspan x="140" dy="40">visitors who complete the <tspan font-weight="bold" fill="#17457f">desired</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">goal,</tspan> such as signing up or buying.</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مثال: فتح نموذجَ التسجيل <tspan fill="#c96a1b">100</tspan> زائر،</tspan>
  <tspan x="935" dy="40">وأكمله <tspan fill="#c96a1b">40،</tspan> فمعدل التحويل <tspan fill="#c96a1b">40%.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Example: <tspan fill="#c96a1b">100</tspan> visitors opened</tspan>
  <tspan x="140" dy="40">the sign-up form and <tspan fill="#c96a1b">40</tspan> completed it,</tspan>
  <tspan x="140" dy="40">so the conversion rate is <tspan fill="#c96a1b">40%.</tspan></tspan>
</text>
<text x="950" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan fill="#c96a1b">100</tspan><tspan> فتحوا</tspan></text>
<text x="776" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan fill="#c96a1b">100</tspan><tspan> opened</tspan></text>
<text x="515" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#2e7d32">40</tspan><tspan> أكملوا</tspan></text>
<text x="360" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#2e7d32">40</tspan><tspan> completed</tspan></text>
</svg>
