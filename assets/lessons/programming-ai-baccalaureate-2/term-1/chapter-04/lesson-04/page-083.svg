<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">اكتشف الخطأ (الصفحة 63)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Spot the Mistake (Page 63)</tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 خالفت <tspan font-weight="bold" fill="#c0392b">«العشوائية»:</tspan> الفرق قد يكون</tspan>
  <tspan x="950" dy="40">سببه <tspan fill="#c96a1b">اليوم،</tspan> لا التصميم.</tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 It broke <tspan font-weight="bold" fill="#c0392b">“Even split”:</tspan> the difference</tspan>
  <tspan x="132" dy="40">may come from <tspan fill="#c96a1b">the day,</tspan> not the design.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 خالفت <tspan font-weight="bold" fill="#c0392b">«عنصر»:</tspan> تغيّرت <tspan font-weight="bold" fill="#17457f">ثلاثة عناصر،</tspan></tspan>
  <tspan x="950" dy="40">فلن نعرف أثر اللون وحده.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 It broke <tspan font-weight="bold" fill="#c0392b">“Element”:</tspan> <tspan font-weight="bold" fill="#17457f">three elements</tspan></tspan>
  <tspan x="132" dy="40">changed, so we cannot know the effect</tspan>
  <tspan x="132" dy="40">of the color alone.</tspan>
</text>

<!-- Bullet 3 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 خالفت <tspan font-weight="bold" fill="#c0392b">«عيّنة كافية»:</tspan> <tspan fill="#c96a1b">20 زائرًا</tspan></tspan>
  <tspan x="950" dy="40">لا يكفون، ولا نوقف الاختبار مبكرًا</tspan>
  <tspan x="950" dy="40">لأن نسخة متقدمة.</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 It broke <tspan font-weight="bold" fill="#c0392b">“Enough users”:</tspan> <tspan fill="#c96a1b">20 visitors</tspan></tspan>
  <tspan x="132" dy="40">are not enough, and we do not stop</tspan>
  <tspan x="132" dy="40">a test early because one version</tspan>
  <tspan x="132" dy="40">is ahead.</tspan>
</text>

<!-- Bullet 4 -->
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 <tspan font-weight="bold" fill="#2e7d32">سليمة:</tspan> تحققت فيها <tspan font-weight="bold" fill="#17457f">العينات الأربع</tspan> كلها.</tspan>
</text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 <tspan font-weight="bold" fill="#2e7d32">Sound:</tspan> it meets all of the <tspan font-weight="bold" fill="#17457f">Four E's.</tspan></tspan>
</text>
</svg>
