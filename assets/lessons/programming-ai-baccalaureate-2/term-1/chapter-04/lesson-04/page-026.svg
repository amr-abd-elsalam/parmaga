<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">مثال 2: الموقع الإلكتروني</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Example 2: The Website</tspan>
</text>

<!-- Bullet 1: Plan -->
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">خطّط:</tspan> نرفع نسبة إكمال التسجيل</tspan>
  <tspan x="950" dy="40">من <tspan fill="#c96a1b">30%</tspan> إلى <tspan fill="#c96a1b">40%</tspan> بتقليل خانات النموذج.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Plan:</tspan> we raise the sign-up</tspan>
  <tspan x="132" dy="40">completion rate from <tspan fill="#c96a1b">30%</tspan> to <tspan fill="#c96a1b">40%</tspan> by</tspan>
  <tspan x="132" dy="40">reducing the form's fields.</tspan>
</text>

<!-- Bullet 2: Do -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">نفّذ:</tspan> نحذف الخانات غير الضرورية من النموذج.</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Do:</tspan> we remove the unnecessary</tspan>
  <tspan x="132" dy="40">fields from the form.</tspan>
</text>

<!-- Bullet 3: Check -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تحقّق:</tspan> نقيس النسبة بعد التغيير فنجدها <tspan fill="#c96a1b">36%:</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">أفضل</tspan> من خط الأساس، لكنها أقل من الهدف.</tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Check:</tspan> we measure the rate after the</tspan>
  <tspan x="132" dy="40">change and find it is <tspan fill="#c96a1b">36%:</tspan> <tspan font-weight="bold" fill="#2e7d32">better</tspan> than</tspan>
  <tspan x="132" dy="40">the baseline, but below the goal.</tspan>
</text>

<!-- Bullet 4: Act -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تصرّف:</tspan> نعتمد التغيير لأنه <tspan font-weight="bold" fill="#2e7d32">حسّن النتيجة،</tspan></tspan>
  <tspan x="950" dy="40">ونخطط لتغيير جديد في <tspan font-weight="bold" fill="#17457f">الدورة التالية.</tspan></tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Act:</tspan> we keep the change because it</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">improved the result,</tspan> and plan a new</tspan>
  <tspan x="132" dy="40">change for the <tspan font-weight="bold" fill="#17457f">next cycle.</tspan></tspan>
</text>
</svg>
