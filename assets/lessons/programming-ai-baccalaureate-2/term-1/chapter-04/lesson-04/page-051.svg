<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">اختبار A/B: الميزان</tspan>
  <tspan x="540" dy="48">الذي يحكم بالأرقام</tspan>
</text>

<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">A/B Testing: The Scale</tspan>
  <tspan x="540" dy="36">That Judges with Numbers</tspan>
</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">اختبار A/B:</tspan> تجربة تقارن <tspan font-weight="bold" fill="#17457f">نسختين</tspan> بينهما</tspan>
  <tspan x="935" dy="40">فرق محدد، تُعرضان على <tspan font-weight="bold" fill="#17457f">مستخدمين حقيقيين</tspan></tspan>
  <tspan x="935" dy="40">موزعين عشوائيًا، ثم يُحكم بينهما</tspan>
  <tspan x="935" dy="40">بمقياس حُدِّد مسبقًا.</tspan>
</text>

<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">A/B testing:</tspan> an experiment that</tspan>
  <tspan x="140" dy="40">compares <tspan font-weight="bold" fill="#17457f">two versions</tspan> with a specific</tspan>
  <tspan x="140" dy="40">difference between them, shown to</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">real users</tspan> divided at random, and then</tspan>
  <tspan x="140" dy="40">judged by a metric set in advance.</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">الأرقام هي التي تقرر، لا الذوق.</text>

<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">Numbers decide, not taste.</text>
</svg>
