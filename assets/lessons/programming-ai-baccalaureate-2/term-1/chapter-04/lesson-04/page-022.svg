<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">دورة PDCA: العجلة</tspan>
  <tspan x="540" dy="48">التي لا تتوقف</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The PDCA Cycle: The Wheel That Never Stops</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">دورة PDCA:</tspan> طريقة منظمة</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">للتحسين المستمر</tspan> تكرر أربع خطوات:</tspan>
  <tspan x="935" dy="40">خطّط ← نفّذ ← تحقّق ← تصرّف،</tspan>
  <tspan x="935" dy="40">ثم تبدأ من جديد.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">PDCA cycle:</tspan> an organized method for</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">continuous improvement</tspan> that repeats</tspan>
  <tspan x="140" dy="40">four steps: Plan → Do → Check → Act,</tspan>
  <tspan x="140" dy="40">and then starts again.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اسمها مكوّن من <tspan font-weight="bold" fill="#17457f">الحروف الأولى</tspan> لأربع كلمات</tspan>
  <tspan x="950" dy="40">إنجليزية: Plan و Do و Check و Act</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Its name is made of the <tspan font-weight="bold" fill="#17457f">first letters</tspan></tspan>
  <tspan x="120" dy="40">of four English words: Plan, Do,</tspan>
  <tspan x="120" dy="40">Check, and Act.</tspan>
</text>

<text x="912" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">خطّط</tspan></text>
<text x="838" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Plan</tspan></text>
<text x="753" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">نفّذ</tspan></text>
<text x="700" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Do</tspan></text>
<text x="570" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">تحقّق</tspan></text>
<text x="482" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Check</tspan></text>
<text x="372" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">تصرّف</tspan></text>
<text x="304" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Act</tspan></text>
</svg>
