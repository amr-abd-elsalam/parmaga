<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT YOURSELF</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">حدّد خطوة <tspan font-weight="bold" fill="#17457f">التفكير التصميمي</tspan> في كل عبارة:</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Identify the <tspan font-weight="bold" fill="#17457f">design thinking</tspan> step</tspan>
  <tspan x="140" dy="40">in each statement:</tspan>
</text>

<text x="930" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«رسمنا الشاشة على ورقة في 5 دقائق.»</tspan>
</text>
<text x="150" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We drew the screen on paper</tspan>
  <tspan x="150" dy="40">in 5 minutes.”</tspan>
</text>

<text x="930" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«سألنا 6 طلاب عن أصعب شيء في الموقع.»</tspan>
</text>
<text x="150" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We asked 6 students about the</tspan>
  <tspan x="150" dy="40">hardest thing on the site.”</tspan>
</text>

<text x="930" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«كتبنا 15 فكرة دون أن ننتقد أيًّا منها.»</tspan>
</text>
<text x="150" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We wrote 15 ideas without</tspan>
  <tspan x="150" dy="40">criticizing any of them.”</tspan>
</text>

<text x="930" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«كتبنا: الطالب يحتاج أن يجد</tspan>
  <tspan x="930" dy="40">رابط التسجيل من الموبايل بسرعة.»</tspan>
</text>
<text x="150" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We wrote: the student needs to find</tspan>
  <tspan x="150" dy="40">the sign-up link on a phone quickly.”</tspan>
</text>

<text x="930" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«طلبنا من زميل أن يجرب الرسمة،</tspan>
  <tspan x="930" dy="40">ولاحظنا أين تردد.»</tspan>
</text>
<text x="150" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We asked a classmate to try</tspan>
  <tspan x="150" dy="40">the sketch and noticed where</tspan>
  <tspan x="150" dy="40">they hesitated.”</tspan>
</text>
</svg>
