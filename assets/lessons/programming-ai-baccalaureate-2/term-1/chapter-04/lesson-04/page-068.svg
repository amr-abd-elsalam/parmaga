<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان: لا تقع فيها</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam Traps: Don't Fall for Them</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذه أشهر <tspan font-weight="bold" fill="#c0392b">الأخطاء</tspan> في أسئلة الدرس،</tspan>
  <tspan x="950" dy="40">ومع كل فخ <tspan font-weight="bold" fill="#2e7d32">جملة تنقذك.</tspan></tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Here are the most common <tspan font-weight="bold" fill="#c0392b">mistakes</tspan></tspan>
  <tspan x="120" dy="40">in this lesson's questions, each with</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#2e7d32">sentence that saves you.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«قِس معدل الارتداد بعد التغيير»</tspan>
  <tspan x="950" dy="40">خطوة تصرّف؟ خطأ، بل <tspan font-weight="bold" fill="#2e7d32">تحقّق؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">قِس = تحقّق</tspan> دائمًا.</tspan>
</text>

<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Measure the bounce rate after the</tspan>
  <tspan x="132" dy="40">change” is Act? Wrong, it is <tspan font-weight="bold" fill="#2e7d32">Check;</tspan></tspan>
  <tspan x="132" dy="40">remember: <tspan font-weight="bold" fill="#17457f">measure = always Check.</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«فكّر في إجراء تحسين آخر»</tspan>
  <tspan x="950" dy="40">خطوة تحقّق؟ خطأ، بل <tspan font-weight="bold" fill="#2e7d32">تصرّف؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: قرار أو <tspan font-weight="bold" fill="#17457f">خطوة تالية = تصرّف.</tspan></tspan>
</text>

<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Consider another improvement measure”</tspan>
  <tspan x="132" dy="40">is Check? Wrong, it is <tspan font-weight="bold" fill="#2e7d32">Act;</tspan> remember:</tspan>
  <tspan x="132" dy="40">a decision or <tspan font-weight="bold" fill="#17457f">next step = Act.</tspan></tspan>
</text>
</svg>
