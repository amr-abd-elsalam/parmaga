<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">قاعدة «العينات الأربع» لاختبار A/B سليم</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Four E's of a Sound A/B Test</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عنصر:</tspan> <tspan font-weight="bold" fill="#17457f">فرق واحد</tspan> واضح، لتعرف سبب النتيجة.</tspan>
</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Element:</tspan> <tspan font-weight="bold" fill="#17457f">one clear difference</tspan>,</tspan>
  <tspan x="132" dy="40">so you know the cause of the result.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عدّاد:</tspan> مقياس يُحدَّد <tspan font-weight="bold" fill="#17457f">قبل الاختبار،</tspan></tspan>
  <tspan x="950" dy="40">حتى لا تختار بعده الرقم الذي يعجبك.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Exact metric:</tspan> a metric set</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">before the test</tspan>, so you do not pick</tspan>
  <tspan x="132" dy="40">the number you like afterwards.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عشوائية:</tspan> توزيع الزوار <tspan font-weight="bold" fill="#17457f">بالقرعة،</tspan></tspan>
  <tspan x="950" dy="40">لتكون المجموعتان <tspan font-weight="bold" fill="#2e7d32">متشابهتين.</tspan></tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Even split:</tspan> assigning visitors</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">at random</tspan>, so the two groups are <tspan font-weight="bold" fill="#2e7d32">alike</tspan>.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عيّنة كافية:</tspan> عدد كافٍ من المستخدمين،</tspan>
  <tspan x="950" dy="40">لأن <tspan fill="#c96a1b">5 زوار</tspan> لا يكفون للحكم.</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Enough users:</tspan> a large enough</tspan>
  <tspan x="132" dy="40">number of users, because <tspan fill="#c96a1b">5 visitors</tspan></tspan>
  <tspan x="132" dy="40">are not enough to judge.</tspan>
</text>
</svg>
