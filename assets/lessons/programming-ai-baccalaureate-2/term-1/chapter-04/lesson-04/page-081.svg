<!-- Section 1 header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">تحدّي الطائرة الورقية (الصفحة 30)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Paper Plane Challenge (Page 30)</tspan>
</text>

<!-- Section 1 paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا تستطيع؛ لأنها غيّرت <tspan font-weight="bold" fill="#17457f">ثلاثة أشياء</tspan> معًا،</tspan>
  <tspan x="950" dy="40">فعرفت أثر <tspan fill="#c96a1b">الحزمة كلها،</tspan> لا أثر كل تغيير وحده.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No, it cannot; it changed <tspan font-weight="bold" fill="#17457f">three things</tspan></tspan>
  <tspan x="120" dy="40">at once, so it learned the effect</tspan>
  <tspan x="120" dy="40">of the <tspan fill="#c96a1b">whole bundle,</tspan></tspan>
  <tspan x="120" dy="40">not the effect of each change alone.</tspan>
</text>

<!-- Section 2 header -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">خطوات PDCA (الصفحة 34)</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">PDCA Steps (Page 34)</tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 «قسنا عدد التسجيلات» ← <tspan font-weight="bold" fill="#c0392b">تحقّق</tspan></tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 “We measured the number of sign-ups”</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Check</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 «قررنا تعميم الزر الجديد» ← <tspan font-weight="bold" fill="#c0392b">تصرّف</tspan></tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 “We decided to apply the new button”</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Act</tspan></tspan>
</text>

<!-- Bullet 3 -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 «حددنا هدف رفع التسجيلات» ← <tspan font-weight="bold" fill="#c0392b">خطّط</tspan></tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 “We set the goal of raising sign-ups”</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Plan</tspan></tspan>
</text>

<!-- Bullet 4 -->
<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 «غيّرنا لون زر التسجيل» ← <tspan font-weight="bold" fill="#c0392b">نفّذ</tspan></tspan>
</text>
<text x="132" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 “We changed the color of the sign-up</tspan>
  <tspan x="132" dy="40">button” → <tspan font-weight="bold" fill="#c0392b">Do</tspan></tspan>
</text>
</svg>
