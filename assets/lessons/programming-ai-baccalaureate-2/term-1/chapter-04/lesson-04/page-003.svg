  <path d="M728 880 C 732 870 744 866 752 872" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="858" cy="858" r="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="872" cy="840" r="4" fill="#ffffff" stroke="#22303f" stroke-width="2"/>

