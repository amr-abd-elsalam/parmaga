  <rect x="27" y="20" width="6" height="26" fill="#17457f"/>
</g>

<!-- Bottom row: measure, try, repeat (read right to left) -->
<g transform="translate(652 1182)">
  <rect x="2" y="18" width="52" height="20" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <path d="M10 18 L10 28 M18 18 L18 24 M26 18 L26 28 M34 18 L34 24 M42 18 L42 28" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
</g>
<g transform="translate(512 1182)">
  <polygon points="8,40 36,12 46,22 18,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="36,12 40,8 50,18 46,22" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="8,40 18,50 4,54" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(372 1182)">
  <path d="M10 28 A 18 18 0 0 1 46 28" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 32 A 18 18 0 0 1 10 32" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <polygon points="40,26 52,26 46,36" fill="#2e7d32"/>
  <polygon points="4,34 16,34 10,22" fill="#2e7d32"/>
</g>
<g>
  <path d="M616 1198 L604 1210 L616 1222 M476 1198 L464 1210 L476 1222" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Texts in Layout order -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">والموقع الإلكتروني</tspan> يشبه محل <tspan fill="#c96a1b">الكشري</tspan> تمامًا:</tspan>
  <tspan x="950" dy="40">أول نسخة منه ليست أفضل نسخة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">A website</tspan> is just like the <tspan fill="#c96a1b">koshari shop</tspan>:</tspan>
  <tspan x="120" dy="40">its first version is not its best version.</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الهدف الأساسي من الدرس:</tspan>
  <tspan x="935" dy="40">لا تخمّن… قِس، ثم جرّب، ثم كرّر.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The main goal of this lesson:</tspan>
  <tspan x="140" dy="40">Don't guess… measure,</tspan>
  <tspan x="140" dy="40">then try, then repeat.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">القرار الجيد يُبنى على <tspan font-weight="bold" fill="#2e7d32">دليل</tspan> لا على رأي،</tspan>
  <tspan x="950" dy="40">وأول نسخة من أي عمل <tspan font-weight="bold" fill="#17457f">ليست الأخيرة</tspan>.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A good decision is built on <tspan font-weight="bold" fill="#2e7d32">evidence</tspan>,</tspan>
  <tspan x="120" dy="40">not on opinion, and the first version</tspan>
  <tspan x="120" dy="40">of any work <tspan font-weight="bold" fill="#17457f">is not the last</tspan>.</tspan>
</text>

<text x="793" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">رأي</tspan></text>
<text x="707" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Opinion</tspan></text>
<text x="342" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#2e7d32">دليل</tspan></text>
<text x="243" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#2e7d32">Evidence</tspan></text>
</svg>
