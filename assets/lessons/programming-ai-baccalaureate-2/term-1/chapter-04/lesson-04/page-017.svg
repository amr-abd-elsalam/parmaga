<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معدل الارتداد</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">BOUNCE RATE</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">معدل الارتداد</tspan> (Bounce Rate): نسبة</tspan>
  <tspan x="935" dy="40">الزيارات التي يغادر فيها الزائر الموقع بعد</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">صفحة واحدة</tspan> دون أن يتفاعل معه.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bounce Rate:</tspan> the percentage of visits</tspan>
  <tspan x="140" dy="40">in which the visitor leaves the site</tspan>
  <tspan x="140" dy="40">after <tspan font-weight="bold" fill="#17457f">one page</tspan> without</tspan>
  <tspan x="140" dy="40">interacting with it.</tspan>
</text>
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كلما <tspan font-weight="bold" fill="#17457f">قلّ</tspan> معدل الارتداد</tspan>
  <tspan x="935" dy="40">كان ذلك <tspan font-weight="bold" fill="#2e7d32">أفضل</tspan> غالبًا.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#17457f">lower</tspan> the bounce rate,</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#2e7d32">better</tspan> it usually is.</tspan>
</text>
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> تدخل محلًا ثم <tspan font-weight="bold" fill="#17457f">تخرج فورًا</tspan></tspan>
  <tspan x="950" dy="40">دون أن تشتري أو تسأل عن شيء.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> you walk into a shop and</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">leave right away</tspan> without buying or</tspan>
  <tspan x="120" dy="40">asking about anything.</tspan>
</text>
</svg>
