<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">نسبة النقر</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">CLICK-THROUGH RATE</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">نسبة النقر</tspan> (Click-Through Rate - CTR):</tspan>
  <tspan x="935" dy="40">عدد من نقروا على عنصر ÷ عدد من رأوه × 100%.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Click-Through Rate</tspan> (CTR): the number</tspan>
  <tspan x="140" dy="40">of people who clicked an element ÷</tspan>
  <tspan x="140" dy="40">the number who saw it × 100%.</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مثال: رأى الزرَّ <tspan fill="#c96a1b">1000</tspan> زائر،</tspan>
  <tspan x="935" dy="40">ونقر عليه <tspan fill="#c96a1b">50،</tspan> فنسبة النقر <tspan font-weight="bold" fill="#17457f">5%.</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Example: <tspan fill="#c96a1b">1,000</tspan> visitors saw the button</tspan>
  <tspan x="140" dy="40">and <tspan fill="#c96a1b">50</tspan> clicked it, so the CTR is <tspan font-weight="bold" fill="#17457f">5%.</tspan></tspan>
</text>
<text x="695" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="695" dy="0">1000 رأوا</tspan>
</text>
<text x="568" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="568" dy="0">1000 saw</tspan>
</text>
<text x="470" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="470" dy="0">50 نقروا</tspan>
</text>
<text x="330" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="330" dy="0">50 clicked</tspan>
</text>
</svg>
