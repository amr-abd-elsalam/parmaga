<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ما تراه أنت <tspan font-weight="bold" fill="#17457f">سهلًا</tspan> لأنك صنعته،</tspan>
  <tspan x="950" dy="40">قد يكون <tspan font-weight="bold" fill="#17457f">صعبًا</tspan> على غيرك.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">What looks <tspan font-weight="bold" fill="#17457f">easy</tspan> to you because you</tspan>
  <tspan x="120" dy="40">made it may be <tspan font-weight="bold" fill="#17457f">hard</tspan> for someone else.</tspan>
</text>

<!-- Info card text -->
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">منظور المستخدم</tspan> <tspan font-weight="bold" fill="#c0392b">(User's Perspective):</tspan></tspan>
  <tspan x="935" dy="40">النظر إلى المنتج كما يراه <tspan font-weight="bold" fill="#17457f">من يستخدمه،</tspan></tspan>
  <tspan x="935" dy="40">لا كما يراه من صنعه.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">User's Perspective:</tspan> looking at a</tspan>
  <tspan x="140" dy="40">product the way <tspan font-weight="bold" fill="#17457f">the person who uses it</tspan></tspan>
  <tspan x="140" dy="40">sees it, not the way the person who</tspan>
  <tspan x="140" dy="40">made it sees it.</tspan>
</text>

<!-- Paragraph 3: example -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> تطبيق تراه أنت سهلًا جدًا،</tspan>
  <tspan x="950" dy="40">قد يحتار فيه جدّك لأن <tspan font-weight="bold" fill="#17457f">أزراره صغيرة</tspan></tspan>
  <tspan x="950" dy="40">وكلماته <tspan font-weight="bold" fill="#17457f">غير مألوفة</tspan> له.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> an app that seems very easy to</tspan>
  <tspan x="120" dy="40">you may confuse your grandfather,</tspan>
  <tspan x="120" dy="40">because its <tspan font-weight="bold" fill="#17457f">buttons are small</tspan> and its</tspan>
  <tspan x="120" dy="40">words are <tspan font-weight="bold" fill="#17457f">unfamiliar</tspan> to him.</tspan>
</text>
</svg>
