  <path d="M760 968 L763.6 976.4 L772 980 L763.6 983.6 L760 992 L756.4 983.6 L748 980 L756.4 976.4 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M792 1025 L794.7 1031.3 L801 1034 L794.7 1036.7 L792 1043 L789.3 1036.7 L783 1034 L789.3 1031.3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
