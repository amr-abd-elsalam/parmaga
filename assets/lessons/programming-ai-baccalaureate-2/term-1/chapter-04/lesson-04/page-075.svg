<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 في خطوة <tspan font-weight="bold" fill="#c0392b">«تصرّف»</tspan> يعتمد <tspan font-weight="bold" fill="#2e7d32">ما نجح،</tspan></tspan>
  <tspan x="950" dy="40">أو يعدّل الخطة، ويحدد الخطوة التالية.</tspan>
</text>
<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">5 In the <tspan font-weight="bold" fill="#c0392b">“Act”</tspan> step, it adopts</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">what worked</tspan> or revises the plan, and</tspan>
  <tspan x="132" dy="40">decides the next step.</tspan>
</text>
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">6 <tspan font-weight="bold" fill="#c0392b">التكرار</tspan> يجعل التحسينات الصغيرة <tspan font-weight="bold" fill="#2e7d32">تتراكم،</tspan></tspan>
  <tspan x="950" dy="40">ويقلل خطر إضاعة الوقت والجهد</tspan>
  <tspan x="950" dy="40">على تغيير كبير قد يفشل.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">6 <tspan font-weight="bold" fill="#c0392b">Repetition</tspan> lets small improvements</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">add up</tspan> and reduces the risk of wasting</tspan>
  <tspan x="132" dy="40">time and effort on a big change</tspan>
  <tspan x="132" dy="40">that may fail.</tspan>
</text>
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">نصيحة:</tspan> اكتب اسم كل خطوة بوضوح،</tspan>
  <tspan x="935" dy="40">لأن المصحح يبحث عن الكلمات المفتاحية:</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">قياس النتائج،</tspan> <tspan font-weight="bold" fill="#17457f">والتصرف</tspan> بناءً عليها.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Tip:</tspan> write the name of each step</tspan>
  <tspan x="140" dy="40">clearly, because the marker looks for</tspan>
  <tspan x="140" dy="40">the key words: <tspan font-weight="bold" fill="#17457f">measuring results</tspan> and</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">acting</tspan> on them.</tspan>
</text>
</svg>
