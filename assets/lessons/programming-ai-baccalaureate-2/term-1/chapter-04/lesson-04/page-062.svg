<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">العين تكتشف، والميزان يحكم</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Eye Discovers, the Scale Judges</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">التفكير التصميمي</tspan> يساعدك على اكتشاف المشكلة</tspan>
  <tspan x="950" dy="40">وتوليد الحلول، <tspan font-weight="bold" fill="#c0392b">واختبار A/B</tspan> يساعدك</tspan>
  <tspan x="950" dy="40">على الحكم بين حلّين بالأرقام.</tspan>
</text>

<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Design thinking</tspan> helps you discover the</tspan>
  <tspan x="120" dy="40">problem and generate solutions, and</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">A/B testing</tspan> helps you judge between two</tspan>
  <tspan x="120" dy="40">solutions with numbers.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> اكتشفت <tspan font-weight="bold" fill="#17457f">بالتعاطف</tspan> أن الزر صعب الرؤية،</tspan>
  <tspan x="950" dy="40">فولّدت فكرتين، ثم حسمت بينهما باختبار A/B.</tspan>
</text>

<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> through <tspan font-weight="bold" fill="#17457f">empathy</tspan> you discovered</tspan>
  <tspan x="120" dy="40">that the button is hard to see, so you</tspan>
  <tspan x="120" dy="40">came up with two ideas, then settled</tspan>
  <tspan x="120" dy="40">between them with an A/B test.</tspan>
</text>
</svg>
