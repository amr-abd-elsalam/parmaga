<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">ليست سلّمًا في اتجاه واحد</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Not a One-Way Ladder</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الخطوات الخمس</tspan> ليست سلّمًا تصعده مرة واحدة؛</tspan>
  <tspan x="950" dy="40">يمكنك <tspan font-weight="bold" fill="#2e7d32">الرجوع</tspan> بينها في أي وقت.</tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#17457f">five steps</tspan> are not a ladder</tspan>
  <tspan x="120" dy="40">you climb once; you can <tspan font-weight="bold" fill="#2e7d32">go back</tspan></tspan>
  <tspan x="120" dy="40">between them at any time.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> إذا فشل زميلك في استخدام نموذجك،</tspan>
  <tspan x="950" dy="40">فقد تعود إلى <tspan font-weight="bold" fill="#c0392b">التعاطف</tspan> لأنك لم تفهم المستخدم</tspan>
  <tspan x="950" dy="40">جيدًا، أو إلى <tspan font-weight="bold" fill="#c0392b">التعريف</tspan> لأنك عرّفت المشكلة خطأ.</tspan>
</text>

<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> if your classmate fails to use</tspan>
  <tspan x="120" dy="40">your prototype, you may go back</tspan>
  <tspan x="120" dy="40">to <tspan font-weight="bold" fill="#c0392b">Empathize</tspan> because you did not</tspan>
  <tspan x="120" dy="40">understand the user well, or to <tspan font-weight="bold" fill="#c0392b">Define</tspan></tspan>
  <tspan x="120" dy="40">because you stated the problem wrongly.</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">التفكير التصميمي مثل GPS:</tspan>
  <tspan x="935" dy="40">إذا أخطأت الطريق، يعيد حساب المسار.</tspan>
</text>

<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Design thinking is like a GPS:</tspan>
  <tspan x="140" dy="40">if you take a wrong turn,</tspan>
  <tspan x="140" dy="40">it recalculates the route.</tspan>
</text>
</svg>
