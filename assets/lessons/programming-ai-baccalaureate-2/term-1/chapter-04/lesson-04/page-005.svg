<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">احفظ هذه الجملة: العين تكتشف،</tspan>
  <tspan x="935" dy="40">والميزان يحكم، والعجلة تكرّر.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Remember this sentence:</tspan>
  <tspan x="140" dy="40">The eye discovers, the scale judges,</tspan>
  <tspan x="140" dy="40">and the wheel repeats.</tspan>
</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّف وفكّر</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PAUSE &amp; THINK</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">فكّر في <tspan font-weight="bold" fill="#c0392b">تطبيق</tspan> تستخدمه كل يوم:</tspan>
  <tspan x="935" dy="40">هل <tspan font-weight="bold" fill="#17457f">تغيّر</tspan> شكله منذ أول مرة استخدمته فيها؟</tspan>
  <tspan x="935" dy="40">ولماذا تظن أن صانعيه غيّروه؟</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Think of an <tspan font-weight="bold" fill="#c0392b">app</tspan> you use every day:</tspan>
  <tspan x="140" dy="40">has its look <tspan font-weight="bold" fill="#17457f">changed</tspan> since the first</tspan>
  <tspan x="140" dy="40">time you used it? Why do you think</tspan>
  <tspan x="140" dy="40">its makers changed it?</tspan>
</text>
</svg>
