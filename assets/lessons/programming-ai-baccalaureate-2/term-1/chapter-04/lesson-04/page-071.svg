<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«الموقع المثالي من البداية</tspan>
  <tspan x="950" dy="40">لا يحتاج إلى تحسين»؟ خطأ؛</tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">أول طبق كشري ليس أفضل طبق.</tspan></tspan>
</text>

<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“A perfect website from the start needs</tspan>
  <tspan x="132" dy="40">no improvement”? Wrong; remember:</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">the first koshari dish</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">is not the best dish.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«يكفي تحسين الشكل البصري فقط»؟ خطأ،</tspan>
  <tspan x="950" dy="40">فالتحسين يشمل <tspan font-weight="bold" fill="#2e7d32">السهولة والمحتوى</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">والسرعة</tspan> أيضًا.</tspan>
</text>

<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Improving only the visual design is</tspan>
  <tspan x="132" dy="40">enough”? Wrong, improvement also covers</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">ease of use, content, and speed.</tspan></tspan>
</text>
</svg>
