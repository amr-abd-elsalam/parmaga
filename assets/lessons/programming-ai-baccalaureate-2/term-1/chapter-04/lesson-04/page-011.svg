<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
  <linearGradient id="ilTrayL" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9dcbe"/>
    <stop offset="1" stop-color="#2e7d32"/>
  </linearGradient>
  <linearGradient id="ilTrayR" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>
</defs>

<!-- Outlined box: shadow, fill, accent -->
<rect x="109" y="128" width="870" height="648" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="122" width="870" height="648" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="616" rx="3" fill="#2f7fb5"/>

<!-- Bullets -->
<circle cx="946" cy="344" r="6" fill="#c0392b"/>
<circle cx="946" cy="424" r="6" fill="#c0392b"/>
<circle cx="946" cy="624" r="6" fill="#c0392b"/>

<!-- Illustration: sorting statements into opinions and evidence -->
<g>
  <!-- shadows -->
  <rect x="482" y="818" width="124" height="74" rx="10" fill="#22303f" opacity=".18"/>
  <circle cx="544" cy="1006" r="96" fill="#22303f" opacity=".18"/>
  <polygon points="621,1065 687,1131 669,1149 603,1083" fill="#22303f" opacity=".18"/>
  <circle cx="678" cy="1140" r="13" fill="#22303f" opacity=".18"/>
  <path d="M130 1072 L378 1072 L358 1122 L150 1122 Z" fill="#22303f" opacity=".18"/>
  <rect x="124" y="1064" width="260" height="12" rx="6" fill="#22303f" opacity=".18"/>
  <path d="M710 1072 L958 1072 L938 1122 L730 1122 Z" fill="#22303f" opacity=".18"/>
  <rect x="704" y="1064" width="260" height="12" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="280" y="986" width="72" height="76" rx="8" fill="#22303f" opacity=".18"/>

  <!-- soft backdrop -->
  <ellipse cx="540" cy="1010" rx="425" ry="132" fill="#dff1f7"/>

  <!-- sparkles -->
  <path d="M410 893 Q412 903 422 905 Q412 907 410 917 Q408 907 398 905 Q408 903 410 893 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M670 893 Q672 903 682 905 Q672 907 670 917 Q668 907 658 905 Q668 903 670 893 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- stack of blank cards -->
  <g transform="rotate(-7 540 849)">
    <rect x="478" y="812" width="124" height="74" rx="10" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="rotate(5 540 849)">
    <rect x="478" y="812" width="124" height="74" rx="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <rect x="478" y="812" width="124" height="74" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>

  <!-- magnifying glass -->
  <polygon points="617,1059 683,1125 665,1143 599,1077" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="640,1082 683,1125 665,1143 622,1100" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="674" cy="1134" r="13" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1000" r="96" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1000" r="82" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="502" y="974" width="76" height="52" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M514 990 L566 990 M514 1002 L556 1002 M514 1014 L546 1014" fill="none" stroke="#7f95ab" stroke-width="3" stroke-linecap="round"/>
  <circle cx="540" cy="1000" r="82" fill="url(#ilGlass)" opacity=".35"/>
  <path d="M478 968 Q488 940 516 930" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".85"/>

  <!-- left tray: evidence -->
  <path d="M126 1066 L374 1066 L354 1116 L146 1116 Z" fill="url(#ilTrayL)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M146 944 L146 1054 L254 1054" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="1010" width="22" height="44" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="188" y="984" width="22" height="70" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="218" y="958" width="22" height="96" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <rect x="276" y="980" width="72" height="76" rx="8" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="284" y="992" width="56" height="58" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="298" y="972" width="28" height="16" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M290 1006 L295 1011 L304 1001 M290 1022 L295 1027 L304 1017 M290 1038 L295 1043 L304 1033" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M311 1006 L332 1006 M311 1022 L332 1022 M311 1038 L332 1038" fill="none" stroke="#7f95ab" stroke-width="3" stroke-linecap="round"/>
  <rect x="120" y="1058" width="260" height="12" rx="6" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>

  <!-- right tray: opinions -->
  <path d="M706 1066 L954 1066 L934 1116 L726 1116 Z" fill="url(#ilTrayR)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="translate(880 1004) scale(.85)">
    <path d="M-40 30 Q-57 30 -57 13 Q-57 -4 -39 -5 Q-35 -25 -13 -24 Q0 -40 20 -28 Q43 -30 45 -8 Q61 -4 59 13 Q57 30 40 30 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(790 1024)">
    <path d="M-40 30 Q-57 30 -57 13 Q-57 -4 -39 -5 Q-35 -25 -13 -24 Q0 -40 20 -28 Q43 -30 45 -8 Q61 -4 59 13 Q57 30 40 30 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <circle cx="722" cy="1044" r="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="712" cy="1030" r="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="700" y="1058" width="260" height="12" rx="6" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>

  <!-- curved arrows from the card stack into both trays -->
  <path d="M466 850 Q310 826 281 936" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="277,950 274,935 287,938" fill="#c0392b" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M614 850 Q770 826 799 936" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="803,950 806,935 793,938" fill="#c0392b" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- Icon: pencil (header) -->
<g transform="translate(140 132)">
  <path d="M14 36 L38 12 L46 20 L22 44 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M38 12 L42 8 Q46 5 49 8 L50 9 Q53 12 50 16 L46 20 Z" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M14 36 L22 44 L8 50 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M8 50 L11 43 L15 47 Z" fill="#22303f"/>
  <path d="M34 16 L42 24" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Face: thinking -->
<g transform="translate(790 284)">
  <circle r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: data document stack -->
<g transform="translate(806 516)">
  <rect x="12" y="4" width="38" height="48" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="6" y="10" width="38" height="48" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="13" y="38" width="6" height="12" fill="#2f7fb5"/>
  <rect x="22" y="30" width="6" height="20" fill="#c96a1b"/>
  <rect x="31" y="22" width="6" height="28" fill="#2e7d32"/>
</g>

<!-- Icon: two users -->
<g transform="translate(300 620)">
  <path d="M26 50 Q26 28 38 28 Q50 28 50 50 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="38" cy="16" r="8" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M6 50 Q6 28 18 28 Q30 28 30 50 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="18" cy="16" r="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Bottom icon row: light bulb, check badge, star -->
<g transform="translate(392 1184)">
  <path d="M28 4 C14 4 6 14 6 25 C6 33 11 38 16 43 L16 48 L40 48 L40 43 C45 38 50 33 50 25 C50 14 42 4 28 4 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M22 30 L28 36 L34 30" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18" y="48" width="20" height="7" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>
<g transform="translate(512 1184)">
  <circle cx="28" cy="28" r="26" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 29 L25 38 L41 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(632 1184)">
  <polygon points="28,2 34.5,20.1 53.7,20.7 38.5,32.4 43.9,50.8 28,40 12.1,50.8 17.5,32.4 2.3,20.7 21.5,20.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>
<text x="216" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="216" dy="0">TRY IT YOURSELF</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">صنّف كل عبارة: <tspan font-weight="bold" fill="#c0392b">رأي</tspan> أم <tspan font-weight="bold" fill="#c0392b">دليل؟</tspan></tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Classify each statement:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">opinion</tspan> or <tspan font-weight="bold" fill="#c0392b">evidence?</tspan></tspan>
</text>
<text x="930" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«أظن أن الزر الأزرق أجمل.»</tspan>
</text>
<text x="150" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“I think the blue button is nicer.”</tspan>
</text>
<text x="930" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«نقر 60 زائرًا من كل 1000</tspan>
  <tspan x="930" dy="40">على الزر الأزرق، و40 على الأحمر.»</tspan>
</text>
<text x="150" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“60 of every 1,000 visitors</tspan>
  <tspan x="150" dy="40">clicked the blue button, and 40</tspan>
  <tspan x="150" dy="40">clicked the red one.”</tspan>
</text>
<text x="930" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«قال 7 من 10 مستخدمين إنهم</tspan>
  <tspan x="930" dy="40">لم يجدوا زر التسجيل.»</tspan>
</text>
<text x="150" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“7 out of 10 users said they could</tspan>
  <tspan x="150" dy="40">not find the sign-up button.”</tspan>
</text>
</svg>
