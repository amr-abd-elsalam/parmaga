<!-- TEXT -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وهي لا تُستخدم في <tspan fill="#c96a1b">المواقع</tspan> فقط، بل في المصانع</tspan>
  <tspan x="950" dy="40">والشركات والمستشفيات، وفي <tspan font-weight="bold" fill="#17457f">مذاكرتك</tspan> أيضًا.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It is used not only for <tspan fill="#c96a1b">websites,</tspan> but also</tspan>
  <tspan x="120" dy="40">in factories, companies, and hospitals,</tspan>
  <tspan x="120" dy="40">and in <tspan font-weight="bold" fill="#17457f">your studying</tspan> too.</tspan>
</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">الخطوتان الأولى والثانية</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">STEPS 1 AND 2</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">خطّط (Plan):</tspan> حدّد المشكلة، وضع هدفًا</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">قابلًا للقياس،</tspan> واختر تغييرًا مناسبًا.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Plan:</tspan> identify the problem,</tspan>
  <tspan x="140" dy="40">set a <tspan font-weight="bold" fill="#17457f">measurable</tspan> goal,</tspan>
  <tspan x="140" dy="40">and choose a suitable change.</tspan>
</text>
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">نفّذ (Do):</tspan> طبّق التغيير المخطط له فعلًا،</tspan>
  <tspan x="935" dy="40">ويُفضَّل أن تبدأ على نطاق صغير.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Do:</tspan> actually apply the planned change;</tspan>
  <tspan x="140" dy="40">it is better to start on a small scale.</tspan>
</text>
</svg>
