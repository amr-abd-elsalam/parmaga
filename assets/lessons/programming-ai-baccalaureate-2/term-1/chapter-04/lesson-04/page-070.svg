<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«خطوات التفكير التصميمي صارمة</tspan>
  <tspan x="950" dy="40">في اتجاه واحد»؟ خطأ، <tspan font-weight="bold" fill="#2e7d32">فيمكن الرجوع</tspan> بينها؛</tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">GPS يعيد حساب المسار.</tspan></tspan>
</text>

<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Design thinking steps are strict</tspan>
  <tspan x="132" dy="40">and one-way”? Wrong, you <tspan font-weight="bold" fill="#2e7d32">can go back</tspan></tspan>
  <tspan x="132" dy="40">between them; remember:</tspan>
  <tspan x="132" dy="40">a <tspan font-weight="bold" fill="#17457f">GPS recalculates the route.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«تغيير عدة عناصر معًا يكشف أثر كل عنصر»؟</tspan>
  <tspan x="950" dy="40">خطأ، بل يكشف <tspan font-weight="bold" fill="#2e7d32">أثر الحزمة كلها؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">طبق المكرونة.</tspan></tspan>
</text>

<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Changing several elements together</tspan>
  <tspan x="132" dy="40">shows the effect of each one”? Wrong,</tspan>
  <tspan x="132" dy="40">it shows the effect of <tspan font-weight="bold" fill="#2e7d32">the whole</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">bundle;</tspan> remember: the <tspan font-weight="bold" fill="#17457f">pasta dish.</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«نحكم على اختبار <tspan font-weight="bold" fill="#c0392b">A/B</tspan> بعد عدد قليل</tspan>
  <tspan x="950" dy="40">من الزوار»؟ خطأ، بل بعد <tspan font-weight="bold" fill="#2e7d32">عينة كافية؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">العملة المرمية 4 مرات.</tspan></tspan>
</text>

<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“We judge an <tspan font-weight="bold" fill="#c0392b">A/B</tspan> test after only a few</tspan>
  <tspan x="132" dy="40">visitors”? Wrong, only after a</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#2e7d32">sufficient sample;</tspan> remember:</tspan>
  <tspan x="132" dy="40">the <tspan font-weight="bold" fill="#17457f">coin tossed 4 times.</tspan></tspan>
</text>
</svg>
