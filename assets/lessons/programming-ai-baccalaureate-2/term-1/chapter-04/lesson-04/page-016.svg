<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الهدف القابل للقياس</tspan> (Measurable Goal): هدف</tspan>
  <tspan x="950" dy="40">مكتوب برقم <tspan font-weight="bold" fill="#17457f">محدد</tspan> يمكن قياسه، لا بكلمات عامة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Measurable Goal:</tspan> a goal written with</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">specific number</tspan> that can be measured,</tspan>
  <tspan x="120" dy="40">not in general words.</tspan>
</text>

<text x="961" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="961" dy="0">هدف عام</tspan>
</text>
<text x="625" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="625" dy="0">General goal</tspan>
</text>
<text x="585" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="585" dy="0">هدف قابل للقياس</tspan>
</text>
<text x="115" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">Measurable goal</tspan>
</text>

<text x="961" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="961" dy="0">«نجعل الموقع أسهل.»</tspan>
</text>
<text x="625" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="625" dy="0">“Make the site</tspan>
  <tspan x="625" dy="40">easier.”</tspan>
</text>
<text x="585" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="585" dy="0"><tspan fill="#c96a1b">«8 من 10</tspan> طلاب يجدون رابط</tspan>
  <tspan x="585" dy="40">التسجيل خلال 5 ثوانٍ.»</tspan>
</text>
<text x="115" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan fill="#c96a1b">“8 of 10</tspan> students find</tspan>
  <tspan x="115" dy="40">the sign-up link within</tspan>
  <tspan x="115" dy="40">5 seconds.”</tspan>
</text>
