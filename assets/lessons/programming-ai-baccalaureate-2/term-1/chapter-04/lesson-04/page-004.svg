<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في هذا الدرس معك <tspan font-weight="bold" fill="#17457f">ثلاث أدوات</tspan>.</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In this lesson, you have <tspan font-weight="bold" fill="#17457f">three tools</tspan>.</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العين</tspan> — التفكير التصميمي:</tspan>
  <tspan x="950" dy="40">ما المشكلة الحقيقية عند المستخدم؟</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The eye</tspan> — design thinking:</tspan>
  <tspan x="132" dy="40">What is the user's real problem?</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الميزان</tspan> — اختبار A/B:</tspan>
  <tspan x="950" dy="40">أي الحلّين أفضل فعلًا؟</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The scale</tspan> — A/B testing:</tspan>
  <tspan x="132" dy="40">Which of the two solutions</tspan>
  <tspan x="132" dy="40">is really better?</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العجلة</tspan> — دورة PDCA:</tspan>
  <tspan x="950" dy="40">كيف ننظّم التحسين ونكرّره؟</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The wheel</tspan> — the PDCA cycle:</tspan>
  <tspan x="132" dy="40">How do we organize</tspan>
  <tspan x="132" dy="40">and repeat improvement?</tspan>
</text>

<text x="843" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
