<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«حدّد هدف خفض معدل الارتداد بنسبة 10%»</tspan>
  <tspan x="950" dy="40">خطوة نفّذ؟ خطأ، بل <tspan font-weight="bold" fill="#2e7d32">خطّط؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">هدف = خطة.</tspan></tspan>
</text>

<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Set the goal of reducing the bounce</tspan>
  <tspan x="132" dy="40">rate by 10%” is Do? Wrong, it is <tspan font-weight="bold" fill="#2e7d32">Plan;</tspan></tspan>
  <tspan x="132" dy="40">remember: <tspan font-weight="bold" fill="#17457f">goal = plan.</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«دورة <tspan font-weight="bold" fill="#c0392b">PDCA</tspan> تكتمل بعد تنفيذ واحد»؟ خطأ؛</tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">العجلة لا تدور</tspan> مرة واحدة فقط.</tspan>
</text>

<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“The <tspan font-weight="bold" fill="#c0392b">PDCA</tspan> cycle is complete after one</tspan>
  <tspan x="132" dy="40">execution”? Wrong; remember: the <tspan font-weight="bold" fill="#17457f">wheel</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">does not turn</tspan> just once.</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">«التفكير التصميمي يحل المشكلات</tspan>
  <tspan x="950" dy="40">من منظور المطوّر»؟ خطأ،</tspan>
  <tspan x="950" dy="40">بل من منظور <tspan font-weight="bold" fill="#2e7d32">المستخدم؛</tspan></tspan>
  <tspan x="950" dy="40">تذكّر: <tspan font-weight="bold" fill="#17457f">العين عين المستخدم.</tspan></tspan>
</text>

<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">“Design thinking solves problems from</tspan>
  <tspan x="132" dy="40">the developer's perspective”? Wrong,</tspan>
  <tspan x="132" dy="40">it is the <tspan font-weight="bold" fill="#2e7d32">user's perspective;</tspan></tspan>
  <tspan x="132" dy="40">remember: the eye is <tspan font-weight="bold" fill="#17457f">the user's eye.</tspan></tspan>
</text>
</svg>
