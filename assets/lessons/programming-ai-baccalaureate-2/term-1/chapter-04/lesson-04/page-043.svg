<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">طريقة للحفظ</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">MEMORY TRICK</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">بالعربية:</tspan> «حِسّ وحدّد، فكّر واصنع وجرّب.»</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">In Arabic:</tspan> “Feel and define,</tspan>
  <tspan x="140" dy="40">think, make, and try.”</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">بالإنجليزية:</tspan> Every Detective</tspan>
  <tspan x="935" dy="40">&#x200F;Investigates Problems Thoroughly، أي</tspan>
  <tspan x="935" dy="40">«كل محقق يفحص المشكلات بدقة».</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">In English:</tspan> Every Detective</tspan>
  <tspan x="140" dy="40">Investigates Problems Thoroughly.</tspan>
</text>
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الحروف الأولى <tspan fill="#c96a1b">E-D-I-P-T</tspan> هي الحروف</tspan>
  <tspan x="935" dy="40">الأولى من أسماء <tspan font-weight="bold" fill="#17457f">الخطوات الخمس.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The first letters <tspan fill="#c96a1b">E-D-I-P-T</tspan> are</tspan>
  <tspan x="140" dy="40">the first letters of the names of</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">five steps.</tspan></tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والمصمم يشبه <tspan font-weight="bold" fill="#c0392b">المحقق</tspan> فعلًا:</tspan>
  <tspan x="950" dy="40">يبحث عن <tspan font-weight="bold" fill="#17457f">الدليل</tspan> قبل أن يحكم.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A designer really is like a <tspan font-weight="bold" fill="#c0392b">detective:</tspan></tspan>
  <tspan x="120" dy="40">they look for <tspan font-weight="bold" fill="#17457f">evidence</tspan> before they judge.</tspan>
</text>
</svg>
