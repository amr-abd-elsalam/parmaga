  <ellipse cx="190" cy="1243" rx="14" ry="4" fill="none" stroke="#c96a1b" stroke-width="2"/>
  <ellipse cx="256" cy="1246" rx="24" ry="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="256" cy="1246" rx="14" ry="4" fill="none" stroke="#c96a1b" stroke-width="2"/>
  <ellipse cx="322" cy="1242" rx="24" ry="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="322" cy="1242" rx="14" ry="4" fill="none" stroke="#c96a1b" stroke-width="2"/>

  <!-- LEFT: balanced bar chart -->
  <path d="M392 1150 L566 1150 M392 1186 L566 1186" fill="none" stroke="#7f95ab" stroke-width="1.4" opacity=".35"/>
  <rect x="418" y="1118" width="58" height="104" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="496" y="1124" width="58" height="98" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="414" y="1112" width="58" height="110" rx="6" fill="url(#ilBarA)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="492" y="1118" width="58" height="104" rx="6" fill="url(#ilBarB)" stroke="#22303f" stroke-width="2.5"/>
  <path d="M392 1076 L392 1222 L566 1222" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
