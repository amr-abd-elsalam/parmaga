  <circle cx="650" cy="1183" r="8" fill="#c96a1b"/>
  <path d="M636 1205 Q650 1187 664 1205 Z" fill="#c96a1b"/>
  <circle cx="730" cy="1190" r="34" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="730" cy="1190" r="26" fill="none" stroke="#c96a1b" stroke-width="2"/>
  <polygon points="730,1177 733.23,1185.55 742.36,1185.98 735.23,1191.7 737.64,1200.52 730,1195.5 722.36,1200.52 724.77,1191.7 717.64,1185.98 726.77,1185.55" fill="#c96a1b"/>
  <circle cx="810" cy="1190" r="34" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="810" cy="1190" r="26" fill="none" stroke="#c96a1b" stroke-width="2"/>
  <circle cx="810" cy="1183" r="8" fill="#c96a1b"/>
  <path d="M796 1205 Q810 1187 824 1205 Z" fill="#c96a1b"/>
  <circle cx="890" cy="1190" r="34" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="890" cy="1190" r="26" fill="none" stroke="#c96a1b" stroke-width="2"/>
  <circle cx="890" cy="1183" r="8" fill="#c96a1b"/>
  <path d="M876 1205 Q890 1187 904 1205 Z" fill="#c96a1b"/>

  <!-- question mark thought bubble -->
  <circle cx="774" cy="1090" r="30" fill="#22303f" opacity=".18"/>
  <circle cx="770" cy="1084" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="750" cy="1124" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <circle cx="741" cy="1137" r="3" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <g transform="translate(770 1082)">
    <path d="M -11 -6 C -11 -22, 13 -22, 13 -6 C 13 3, 4 4, 4 11 L -4 11 C -4 -1, 5 0, 5 -6 C 5 -13, -3 -13, -3 -6 Z" fill="#17457f"/>
    <circle cx="0" cy="19" r="4" fill="#17457f"/>
  </g>

  <!-- connector: from doubt to confidence -->
  <path d="M732 1074 Q624 1028 520 1060" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="512,1063 522,1067 518,1053" fill="#c0392b"/>
</g>

<!-- ===== TEXT ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">العينة الكافية</tspan> (Sufficient Sample): عدد</tspan>
  <tspan x="935" dy="40">من المستخدمين يكفي لتكون النتيجة <tspan font-weight="bold" fill="#2e7d32">موثوقة،</tspan></tspan>
  <tspan x="935" dy="40">لا مجرد صدفة.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Sufficient Sample:</tspan> a number of users</tspan>
  <tspan x="140" dy="40">large enough for the result to be</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">reliable,</tspan> not just chance.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لو رميت عملة <tspan fill="#c96a1b">4 مرات</tspan> فظهرت «صورة» <tspan fill="#c96a1b">3 مرات،</tspan></tspan>
  <tspan x="950" dy="40">فهل العملة مغشوشة؟</tspan>
  <tspan x="950" dy="40">لا، فالعدد <tspan font-weight="bold" fill="#17457f">أقل من أن يكفي</tspan> للحكم.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If you toss a coin <tspan fill="#c96a1b">4 times</tspan> and get</tspan>
  <tspan x="120" dy="40">“heads” <tspan fill="#c96a1b">3 times,</tspan> is the coin unfair?</tspan>
  <tspan x="120" dy="40">No, the number is <tspan font-weight="bold" fill="#17457f">too small</tspan> to judge.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لذلك حدّد <tspan font-weight="bold" fill="#17457f">حجم العينة</tspan> <tspan font-weight="bold" fill="#2e7d32">قبل الاختبار،</tspan></tspan>
  <tspan x="950" dy="40">ولا توقف الاختبار مبكرًا</tspan>
  <tspan x="950" dy="40">لمجرد أن إحدى النسختين تتقدم.</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So set the <tspan font-weight="bold" fill="#17457f">sample size</tspan> <tspan font-weight="bold" fill="#2e7d32">before the test,</tspan></tspan>
  <tspan x="120" dy="40">and do not stop the test early just</tspan>
  <tspan x="120" dy="40">because one version is ahead.</tspan>
</text>
</svg>
