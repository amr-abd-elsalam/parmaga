  <path d="M471 1068 L479 1076 L493 1061" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M444 1040 L447 1047 L454 1050 L447 1053 L444 1060 L441 1053 L434 1050 L441 1047 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>

  <!-- RIGHT: four coins, three heads and one tails -->
  <circle cx="654" cy="1196" r="34" fill="#22303f" opacity=".18"/>
  <circle cx="734" cy="1196" r="34" fill="#22303f" opacity=".18"/>
  <circle cx="814" cy="1196" r="34" fill="#22303f" opacity=".18"/>
  <circle cx="894" cy="1196" r="34" fill="#22303f" opacity=".18"/>
