  <path d="M236 1118 L236 1228 A30 9 0 0 0 296 1228 L296 1118 Z" fill="#22303f" opacity=".18"/>
  <path d="M298 1178 L298 1228 A30 9 0 0 0 358 1228 L358 1178 Z" fill="#22303f" opacity=".18"/>
