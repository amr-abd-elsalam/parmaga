<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">جرّب بيدك: تحدّي الطائرة الورقية</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Hands-On: The Paper Plane Challenge</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نفّذوا هذه التجربة في مجموعات</tspan>
  <tspan x="950" dy="40">لتعيشوا <tspan font-weight="bold" fill="#17457f">دورة PDCA</tspan> بأيديكم.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Do this experiment in groups to experience</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">PDCA cycle</tspan> with your own hands.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">خطّط:</tspan> اكتبوا هدفًا برقم،</tspan>
  <tspan x="950" dy="40">مثل <tspan fill="#c96a1b">«تطير الطائرة 4 أمتار»،</tspan> واختاروا</tspan>
  <tspan x="950" dy="40">تعديلًا واحدًا ستجربونه.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">Plan:</tspan> write a goal with a number,</tspan>
  <tspan x="132" dy="40">such as <tspan fill="#c96a1b">“the plane flies 4 meters”,</tspan> and</tspan>
  <tspan x="132" dy="40">choose one change you will try.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 <tspan font-weight="bold" fill="#c0392b">نفّذ:</tspan> اصنعوا الطائرة وارموها.</tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 <tspan font-weight="bold" fill="#c0392b">Do:</tspan> make the plane and throw it.</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 <tspan font-weight="bold" fill="#c0392b">تحقّق:</tspan> قيسوا المسافة بالخطوات</tspan>
  <tspan x="950" dy="40">أو بشريط القياس، واكتبوها.</tspan>
</text>
<text x="132" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 <tspan font-weight="bold" fill="#c0392b">Check:</tspan> measure the distance in steps</tspan>
  <tspan x="132" dy="40">or with a measuring tape,</tspan>
  <tspan x="132" dy="40">and write it down.</tspan>
</text>
</svg>
