<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">تعود فكرة هذه الدورة إلى العالم الأمريكي</tspan>
  <tspan x="935" dy="40">والتر شيوهارت (Walter Shewhart) في مجال</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">ضبط الجودة</tspan> في المصانع.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The idea of this cycle goes back to</tspan>
  <tspan x="140" dy="40">the American scientist Walter Shewhart,</tspan>
  <tspan x="140" dy="40">in the field of <tspan font-weight="bold" fill="#17457f">quality control</tspan></tspan>
  <tspan x="140" dy="40">in factories.</tspan>
</text>
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ثم عرضها إدوارد ديمنج (W. Edwards Deming)</tspan>
  <tspan x="935" dy="40">في محاضراته باليابان عام 1950، فطوّرها</tspan>
  <tspan x="935" dy="40">اليابانيون إلى <tspan font-weight="bold" fill="#17457f">دورة PDCA،</tspan> ولهذا تُسمّى</tspan>
  <tspan x="935" dy="40">أحيانًا <tspan font-weight="bold" fill="#c0392b">«عجلة ديمنج».</tspan></tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Then W. Edwards Deming presented it in</tspan>
  <tspan x="140" dy="40">his lectures in Japan in 1950, and the</tspan>
  <tspan x="140" dy="40">Japanese developed it into the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">PDCA cycle,</tspan> which is why it is</tspan>
  <tspan x="140" dy="40">sometimes called the <tspan font-weight="bold" fill="#c0392b">“Deming wheel”.</tspan></tspan>
</text>
</svg>
