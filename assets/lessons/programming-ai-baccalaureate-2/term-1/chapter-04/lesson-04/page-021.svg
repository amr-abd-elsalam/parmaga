<!-- Icon: pencil (exercise) beside the English header -->
<g transform="translate(866 180)">
  <polygon points="10,30 30,10 38,18 18,38" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
