<!-- Icon: star (remember) beside question 2 -->
<g>
  <polygon points="300,493 305.3,507.7 320.9,508.2 308.6,517.8 312.9,532.8 300,524 287.1,532.8 291.4,517.8 279.1,508.2 294.7,507.7" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">احسبها أنت</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">CALCULATE IT YOURSELF</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> رأى إعلانًا 200 شخص، ونقر عليه 10.</tspan>
  <tspan x="935" dy="40">ما <tspan font-weight="bold" fill="#17457f">نسبة النقر؟</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> 200 people saw an ad, and 10</tspan>
  <tspan x="140" dy="40">clicked it. What is the <tspan font-weight="bold" fill="#17457f">CTR?</tspan></tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> كانت نسبة إكمال التسجيل 40%</tspan>
  <tspan x="935" dy="40">(خط الأساس)، <tspan font-weight="bold" fill="#17457f">والهدف</tspan> 50%،</tspan>
  <tspan x="935" dy="40">وبعد التغيير صارت 46%.</tspan>
  <tspan x="935" dy="40">هل تحقق الهدف؟ وهل تحسّن الموقع؟</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> The sign-up completion rate was 40%</tspan>
  <tspan x="140" dy="40">(the baseline), the <tspan font-weight="bold" fill="#17457f">goal</tspan> was 50%,</tspan>
  <tspan x="140" dy="40">and after the change it became 46%.</tspan>
  <tspan x="140" dy="40">Was the goal reached?</tspan>
  <tspan x="140" dy="40">Did the site improve?</tspan>
</text>
</svg>
