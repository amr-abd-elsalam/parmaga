  <rect x="893" y="1036" width="26" height="32" rx="7" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="791" y="1078" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="825" y="1078" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="859" y="1078" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="893" y="1078" width="26" height="32" rx="7" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="791" y="1120" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="825" y="1120" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="859" y="1120" width="26" height="32" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="893" y="1120" width="26" height="32" rx="7" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M899 1010H913M906 1003V1017M899 1052H913M912 1086L900 1102" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="901" cy="1088" r="2.5" fill="#22303f"/>
  <circle cx="911" cy="1100" r="2.5" fill="#22303f"/>
  <path d="M899 1132H913M899 1140H913" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
