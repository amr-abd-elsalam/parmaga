  <rect x="12" y="4" width="26" height="32" rx="3" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="6" y="10" width="26" height="32" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M11 20H27M11 27H27M11 34H21" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

