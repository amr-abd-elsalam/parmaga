<!-- Text: warning card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">انتبه في الامتحان</tspan>
</text>
<text x="214" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="214" dy="0">EXAM ALERT</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في سؤال يطلب الوصف الأفضل للتفكير التصميمي،</tspan>
  <tspan x="935" dy="40">قد تجد بين <tspan font-weight="bold" fill="#c0392b">الخيارات الخاطئة</tspan></tspan>
  <tspan x="935" dy="40">وصفًا لهذه <tspan font-weight="bold" fill="#17457f">الطرق الثلاث:</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In a question asking for the best</tspan>
  <tspan x="140" dy="40">description of design thinking,</tspan>
  <tspan x="140" dy="40">you may find these <tspan font-weight="bold" fill="#17457f">three methods</tspan></tspan>
  <tspan x="140" dy="40">among the <tspan font-weight="bold" fill="#c0392b">wrong options:</tspan></tspan>
</text>

<!-- Text: bullets -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">تحليل الاستخدام</tspan> = أرقام عن سلوك الزوار.</tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Web analytics</tspan> =</tspan>
  <tspan x="132" dy="40">numbers about visitor behavior.</tspan>
</text>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">التقييم الاستدلالي</tspan> = خبراء وقواعد عملية.</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Heuristic evaluation</tspan> =</tspan>
  <tspan x="132" dy="40">experts and rules of thumb.</tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">المخطط الهيكلي</tspan> = رسم لأماكن العناصر.</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Wireframe</tspan> =</tspan>
  <tspan x="132" dy="40">a sketch of where elements go.</tspan>
</text>

<!-- Text: key sentence strip -->
<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">التفكير التصميمي = منظور المستخدم.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Design thinking =</tspan>
  <tspan x="140" dy="40">the user's perspective.</tspan>
</text>
</svg>
