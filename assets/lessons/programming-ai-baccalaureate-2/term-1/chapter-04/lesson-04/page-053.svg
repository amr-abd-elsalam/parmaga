<!-- Texts -->
<text x="945" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="945" dy="0">تعريف</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الفرضية</tspan> (Hypothesis): <tspan font-weight="bold" fill="#17457f">توقّع مكتوب</tspan> قبل</tspan>
  <tspan x="935" dy="40">التجربة، يمكن أن تثبته النتائج أو تنفيه.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Hypothesis:</tspan> a <tspan font-weight="bold" fill="#17457f">written prediction</tspan> made</tspan>
  <tspan x="140" dy="40">before the experiment, which the</tspan>
  <tspan x="140" dy="40">results can prove or disprove.</tspan>
</text>
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: <tspan fill="#c96a1b">«الزر الأزرق</tspan> سيرفع <tspan font-weight="bold" fill="#17457f">نسبة النقر،</tspan></tspan>
  <tspan x="950" dy="40">لأنه أوضح على الخلفية البيضاء.»</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: <tspan fill="#c96a1b">“The blue button</tspan> will raise the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">click-through rate,</tspan> because it stands</tspan>
  <tspan x="120" dy="40">out more on the white background.”</tspan>
</text>
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لاحظ أن الفرضية الجيدة فيها <tspan font-weight="bold" fill="#17457f">توقّع وسبب.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Notice that a good hypothesis has</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">prediction</tspan> and a <tspan font-weight="bold" fill="#17457f">reason.</tspan></tspan>
</text>
</svg>
