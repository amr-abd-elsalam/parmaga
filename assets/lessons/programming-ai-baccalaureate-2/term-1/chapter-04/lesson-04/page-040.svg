<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 3: توليد الأفكار (Ideate)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 3: Ideate</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">توليد الأفكار:</tspan> إنتاج أكبر عدد ممكن</tspan>
  <tspan x="935" dy="40">من الأفكار قبل الحكم عليها؛</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الكمية أولًا،</tspan> ثم الاختيار.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Ideate:</tspan> producing as many ideas</tspan>
  <tspan x="140" dy="40">as possible before judging them;</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">quantity first,</tspan> then choosing.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في مثالنا: <tspan fill="#c96a1b">أداة صغيرة</tspan> على الشاشة الرئيسية،</tspan>
  <tspan x="950" dy="40">أو <tspan fill="#c96a1b">إشعار</tspan> قبل كل حصة،</tspan>
  <tspan x="950" dy="40">أو زر كبير بعنوان <tspan fill="#c96a1b">«حصتي الجاية».</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In our example: a <tspan fill="#c96a1b">small widget</tspan></tspan>
  <tspan x="120" dy="40">on the home screen, a <tspan fill="#c96a1b">notification</tspan></tspan>
  <tspan x="120" dy="40">before each class, or a big button</tspan>
  <tspan x="120" dy="40">called <tspan fill="#c96a1b">“My Next Class”.</tspan></tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">لا تنتقد</tspan> أي فكرة أثناء العصف الذهني،</tspan>
  <tspan x="950" dy="40">فالفكرة الغريبة قد تقود إلى <tspan font-weight="bold" fill="#2e7d32">فكرة رائعة.</tspan></tspan>
</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
