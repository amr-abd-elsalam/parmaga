<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Bullets -->
<circle cx="966" cy="144" r="6" fill="#c0392b"/>
<circle cx="114" cy="224" r="6" fill="#c0392b"/>
<circle cx="966" cy="344" r="6" fill="#c0392b"/>
<circle cx="114" cy="424" r="6" fill="#c0392b"/>
<circle cx="966" cy="544" r="6" fill="#c0392b"/>
<circle cx="114" cy="624" r="6" fill="#c0392b"/>
<circle cx="966" cy="784" r="6" fill="#c0392b"/>
<circle cx="114" cy="864" r="6" fill="#c0392b"/>

<!-- Icon: note and pencil (write the baseline) -->
<g transform="translate(122 132)">
  <rect x="4" y="4" width="38" height="50" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M12 18 H34 M12 28 H34 M12 38 H26" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="30,48 50,16 58,21 38,53" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="30,48 38,53 29,58" fill="#f0c48c" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="50,16 53,11 61,16 58,21" fill="#c0392b" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Icon: target (goal) -->
<g transform="translate(122 334)">
  <circle cx="28" cy="30" r="26" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="30" r="18" fill="#2f7fb5" stroke="#22303f" stroke-width="2"/>
  <circle cx="28" cy="30" r="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <circle cx="28" cy="30" r="4" fill="#c0392b"/>
  <path d="M28 30 L52 6" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M52 6 L52 -2 M52 6 L60 6" fill="none" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: magnifier over bars (measure) -->
<g transform="translate(122 532)">
  <rect x="4" y="18" width="10" height="36" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="18" y="28" width="10" height="26" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="32" y="40" width="10" height="14" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>
  <path d="M2 56 H48" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="20" r="12" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M54 29 L62 38" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: cycle (new cycle) -->
<g transform="translate(126 776)">
  <path d="M6.5 19 A17 17 0 0 1 39.5 19" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <polygon points="34,17 45,17 39.5,26" fill="#2e7d32" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M39.5 27 A17 17 0 0 1 6.5 27" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <polygon points="1,29 12,29 6.5,20" fill="#2f7fb5" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Face: smile -->
<g transform="translate(902 668)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: a week of tracking one habit shows steady progress -->
<g>
  <linearGradient id="ilPanel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilHeader" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>

  <!-- shadows -->
  <rect x="109" y="954" width="870" height="300" rx="28" fill="#22303f" opacity=".18"/>
  <rect x="204" y="990" width="680" height="180" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="906" y="1046" width="40" height="72" rx="8" fill="#22303f" opacity=".18"/>
  <circle cx="156" cy="1084" r="30" fill="#22303f" opacity=".18"/>

  <!-- panel -->
  <rect x="105" y="948" width="870" height="300" rx="28" fill="url(#ilPanel)"/>
  <rect x="105" y="948" width="870" height="300" rx="28" fill="none" stroke="#9db9d6" stroke-width="2"/>

  <!-- sparkles -->
  <path d="M150 978 Q152 985 159 987 Q152 989 150 996 Q148 989 141 987 Q148 985 150 978 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M928 1140 Q930 1147 937 1149 Q930 1151 928 1158 Q926 1151 919 1149 Q926 1147 928 1140 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M196 1124 Q197.5 1128.5 202 1130 Q197.5 1131.5 196 1136 Q194.5 1131.5 190 1130 Q194.5 1128.5 196 1124 Z" fill="#a9dcbe"/>

  <!-- calendar body -->
  <rect x="200" y="984" width="680" height="180" rx="14" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M200 1018 V998 Q200 984 214 984 H866 Q880 984 880 998 V1018 Z" fill="url(#ilHeader)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="295" y="972" width="10" height="22" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
  <rect x="535" y="972" width="10" height="22" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
  <rect x="775" y="972" width="10" height="22" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>

  <!-- day markers in header (day 1 on the right) -->
  <circle cx="828" cy="1001" r="5" fill="#ffd24a"/>
  <circle cx="732" cy="1001" r="5" fill="#8fc9f2"/>
  <circle cx="636" cy="1001" r="5" fill="#8fc9f2"/>
  <circle cx="540" cy="1001" r="5" fill="#8fc9f2"/>
  <circle cx="444" cy="1001" r="5" fill="#8fc9f2"/>
  <circle cx="348" cy="1001" r="5" fill="#8fc9f2"/>
  <circle cx="252" cy="1001" r="5" fill="#a9dcbe"/>

  <!-- seven day boxes -->
  <rect x="786" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="690" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="594" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="498" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="402" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="306" y="1026" width="84" height="124" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <rect x="210" y="1026" width="84" height="124" rx="10" fill="#e9f7ee" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- bars, gradually shorter from day 1 (right) to day 7 (left) -->
  <rect x="813" y="1040" width="30" height="100" rx="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="717" y="1052" width="30" height="88" rx="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="621" y="1064" width="30" height="76" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="525" y="1076" width="30" height="64" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="429" y="1088" width="30" height="52" rx="6" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
  <rect x="333" y="1100" width="30" height="40" rx="6" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
  <rect x="237" y="1112" width="30" height="28" rx="6" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>

  <!-- dashed baseline across the top of the first bar, as seven short segments from day 1 -->
  <path d="M790 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M694 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M598 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M502 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M406 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M310 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M214 1040 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10 m6 0 h10" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- phone beside the first box -->
  <rect x="902" y="1040" width="40" height="72" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="908" y="1050" width="28" height="50" rx="4" fill="#4fc3e8"/>
  <rect x="913" y="1056" width="8" height="8" rx="2" fill="#ffffff" opacity=".85"/>
  <rect x="924" y="1056" width="8" height="8" rx="2" fill="#ffffff" opacity=".85"/>
  <rect x="913" y="1068" width="8" height="8" rx="2" fill="#ffffff" opacity=".85"/>
  <path d="M917 1045 H927" fill="none" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="922" cy="1106" r="3" fill="#ffffff"/>

  <!-- check badge beside the last box -->
  <circle cx="152" cy="1078" r="30" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="152" cy="1078" r="21" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>
  <path d="M141 1078 L149 1086 L164 1070" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- curved arrow looping from the last box back to the first -->
  <path d="M252 1172 C 252 1236, 828 1236, 828 1180" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="819,1182 837,1182 828,1168" fill="#c0392b" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 اكتب <tspan font-weight="bold" fill="#c0392b">خط الأساس</tspan> اليوم برقم،</tspan>
  <tspan x="950" dy="40">مثل <tspan fill="#c96a1b">«أستخدم الموبايل 5 ساعات يوميًا».</tspan></tspan>
</text>

<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 Write today's <tspan font-weight="bold" fill="#c0392b">baseline</tspan> as a number,</tspan>
  <tspan x="132" dy="40">such as <tspan fill="#c96a1b">“I use my phone 5 hours a day”.</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">3 اكتب <tspan font-weight="bold" fill="#c0392b">هدفًا</tspan> برقم <tspan font-weight="bold" fill="#17457f">(خطّط)،</tspan> وطبّق</tspan>
  <tspan x="950" dy="40">تغييرًا واحدًا فقط طوال الأسبوع <tspan font-weight="bold" fill="#17457f">(نفّذ).</tspan></tspan>
</text>

<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">3 Write a <tspan font-weight="bold" fill="#c0392b">goal</tspan> as a number <tspan font-weight="bold" fill="#17457f">(Plan),</tspan> and</tspan>
  <tspan x="132" dy="40">apply only one change all week <tspan font-weight="bold" fill="#17457f">(Do).</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 بعد أسبوع، <tspan font-weight="bold" fill="#17457f">قِس النتيجة</tspan> وقارنها</tspan>
  <tspan x="950" dy="40">بخط الأساس وبالهدف <tspan font-weight="bold" fill="#17457f">(تحقّق).</tspan></tspan>
</text>

<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 After a week, <tspan font-weight="bold" fill="#17457f">measure the result</tspan></tspan>
  <tspan x="132" dy="40">and compare it with the baseline</tspan>
  <tspan x="132" dy="40">and the goal <tspan font-weight="bold" fill="#17457f">(Check).</tspan></tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 قرّر: اعتمد التغيير إن نجح، أو عدّله،</tspan>
  <tspan x="950" dy="40">ثم ابدأ <tspan font-weight="bold" fill="#2e7d32">دورة جديدة</tspan> <tspan font-weight="bold" fill="#17457f">(تصرّف).</tspan></tspan>
</text>

<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">5 Decide: keep the change if it worked</tspan>
  <tspan x="132" dy="40">or adjust it, then start a <tspan font-weight="bold" fill="#2e7d32">new cycle</tspan> <tspan font-weight="bold" fill="#17457f">(Act).</tspan></tspan>
</text>
</svg>
