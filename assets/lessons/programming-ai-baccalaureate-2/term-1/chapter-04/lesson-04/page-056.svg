<!-- Key sentence strip text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">القاعدة الدقيقة: لتعرف أثر عنصر واحد،</tspan>
  <tspan x="935" dy="40">غيّر عنصرًا واحدًا فقط بين النسختين.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The precise rule: to know the effect</tspan>
  <tspan x="140" dy="40">of one element, change only one</tspan>
  <tspan x="140" dy="40">element between the two versions.</tspan>
</text>

<!-- Paragraph 1 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أما إذا أردت أن تعرف هل <tspan font-weight="bold" fill="#17457f">التصميم الجديد كله</tspan></tspan>
  <tspan x="950" dy="40">أفضل من القديم، فيمكنك اختبار <tspan font-weight="bold" fill="#c0392b">حزمة تغييرات،</tspan></tspan>
  <tspan x="950" dy="40">لكنك لن تعرف أي جزء منها صنع الفرق.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But if you want to know whether the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">whole new design</tspan> is better than the old</tspan>
  <tspan x="120" dy="40">one, you can test <tspan font-weight="bold" fill="#c0392b">a bundle of changes,</tspan></tspan>
  <tspan x="120" dy="40">though you will not know which part</tspan>
  <tspan x="120" dy="40">made the difference.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إذن القاعدة <tspan font-weight="bold" fill="#17457f">مرتبطة بسؤالك:</tspan></tspan>
  <tspan x="950" dy="40">ماذا تريد أن تعرف؟</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So the rule <tspan font-weight="bold" fill="#17457f">depends on your question:</tspan></tspan>
  <tspan x="120" dy="40">what do you want to know?</tspan>
</text>
</svg>
