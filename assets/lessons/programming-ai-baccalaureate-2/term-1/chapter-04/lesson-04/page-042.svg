  <path d="M902 1176 Q 888 1142 902 1120 Q 916 1142 902 1176 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="882,1178 922,1178 918,1210 886,1210" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- pencil cup -->
  <rect x="151" y="1164" width="6" height="22" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="162" y="1168" width="6" height="18" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="146" y="1182" width="28" height="28" rx="4" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>

  <!-- tester (left): body, neck, head, hair, face -->
  <path d="M256 1214 Q 256 1172 300 1166 Q 344 1172 344 1214 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="294" y="1158" width="12" height="10" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="300" cy="1140" r="22" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M278 1136 Q 280 1112 302 1114 Q 324 1114 322 1136 Q 314 1124 300 1126 Q 288 1124 278 1136 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="294" cy="1140" r="2.5" fill="#22303f"/>
  <circle cx="308" cy="1140" r="2.5" fill="#22303f"/>
  <path d="M295 1149 Q 302 1155 309 1149" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- observer (right): body, hijab, face -->
  <path d="M652 1214 Q 652 1172 700 1168 Q 748 1172 748 1214 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M672 1152 Q 668 1108 700 1106 Q 732 1108 728 1152 Q 726 1176 700 1178 Q 674 1176 672 1152 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="700" cy="1144" rx="15" ry="18" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="694" cy="1140" r="2.5" fill="#22303f"/>
  <circle cx="706" cy="1140" r="2.5" fill="#22303f"/>

  <!-- table -->
  <rect x="135" y="1210" width="810" height="34" rx="8" fill="url(#ilWood)" stroke="#22303f" stroke-width="2.5"/>

  <!-- paper prototype held by the tester -->
  <rect x="345" y="1124" width="64" height="82" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="355" y="1132" width="44" height="66" rx="7" fill="none" stroke="#2f7fb5" stroke-width="2"/>
  <path d="M371 1137 L383 1137 M362 1148 L392 1148 M362 1157 L386 1157 M362 1166 L390 1166" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <rect x="362" y="1174" width="30" height="13" rx="5" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>

  <!-- tester arms, hands, pointing finger -->
  <path d="M330 1176 Q 340 1170 348 1170 L 350 1182 Q 340 1184 334 1192 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="349" cy="1176" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M326 1196 Q 350 1196 368 1190 L 370 1200 Q 350 1208 324 1208 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="377" cy="1187" rx="3" ry="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="373" cy="1196" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

