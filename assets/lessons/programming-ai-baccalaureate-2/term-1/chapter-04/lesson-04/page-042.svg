</g>

<!-- Face: wink for the tip -->
<g transform="translate(830 1048)">
  <circle cx="4" cy="6" r="26" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: a classmate tests a paper prototype while the designer silently observes -->
<g>
  <rect x="109" y="1106" width="870" height="154" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="105" y="1100" width="870" height="154" rx="22" fill="url(#ilSky)" stroke="#8fc9f2" stroke-width="2"/>

  <!-- wall sticky notes -->
  <rect x="180" y="1112" width="28" height="28" rx="3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="216" y="1108" width="28" height="28" rx="3" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <rect x="194" y="1142" width="28" height="28" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <path d="M186 1122 L202 1122 M186 1130 L198 1130 M222 1118 L238 1118 M222 1126 L234 1126 M200 1152 L216 1152 M200 1160 L212 1160" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>

