  <path d="M602 1121 Q 630 1102 658 1121 Q 630 1140 602 1121 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="630" cy="1121" r="9" fill="#2f7fb5"/>
  <circle cx="630" cy="1121" r="4" fill="#22303f"/>
  <circle cx="633" cy="1118" r="1.8" fill="#ffffff"/>
  <path d="M600 1129 L588 1131.2 M578 1133.1 L566 1135.4 M556 1137.2 L544 1139.5 M534 1141.3 L522 1143.6 M512 1145.5 L500 1147.7 M490 1149.6 L478 1151.8 M468 1153.7 L456 1156 M446 1157.9 L434 1160" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 5: الاختبار (Test)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 5: Test</tspan>
</text>

<!-- Info card text -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الاختبار:</tspan> تجربة النموذج الأولي مع</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">مستخدمين حقيقيين،</tspan> وجمع ملاحظاتهم،</tspan>
  <tspan x="935" dy="40">ومراقبة ما يفعلونه.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Test:</tspan> trying the prototype with <tspan font-weight="bold" fill="#17457f">real</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">users,</tspan> collecting their feedback, and</tspan>
  <tspan x="140" dy="40">watching what they do.</tspan>
</text>

<!-- Example paragraph -->
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في مثالنا: تعطي <tspan fill="#c96a1b">الورقة</tspan> لزميل،</tspan>
  <tspan x="950" dy="40">وتطلب منه أن يجد حصته القادمة،</tspan>
  <tspan x="950" dy="40">وتلاحظ أين <tspan font-weight="bold" fill="#17457f">يتردد</tspan> دون أن تساعده.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In our example: you give the <tspan fill="#c96a1b">sheet</tspan> to a</tspan>
  <tspan x="120" dy="40">classmate, ask them to find their next</tspan>
  <tspan x="120" dy="40">class, and notice where they <tspan font-weight="bold" fill="#17457f">hesitate</tspan></tspan>
  <tspan x="120" dy="40">without helping them.</tspan>
</text>

<!-- Tip paragraph -->
<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">نصيحة:</tspan> راقب ما <tspan font-weight="bold" fill="#2e7d32">يفعله</tspan> المستخدم،</tspan>
  <tspan x="950" dy="40">لا ما يقوله فقط.</tspan>
</text>
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Tip:</tspan> watch what the user <tspan font-weight="bold" fill="#2e7d32">does,</tspan></tspan>
  <tspan x="120" dy="40">not only what they say.</tspan>
</text>
</svg>
