</g>

<!-- Icon: star beside the tip -->
<g transform="translate(738 1026)">
  <g transform="translate(4 6)">
    <polygon points="22,0 27.3,14.7 42.9,15.2 30.6,24.8 34.9,39.8 22,31 9.1,39.8 13.4,24.8 1.1,15.2 16.7,14.7" fill="#22303f" opacity=".18"/>
