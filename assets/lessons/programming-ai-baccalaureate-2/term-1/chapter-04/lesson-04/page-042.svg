  <path d="M676 1206 Q 680 1180 694 1170 L 706 1172 Q 694 1190 690 1208 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="700" cy="1166" r="7" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="700" cy="1153" rx="3" ry="8" fill="#d59f6f" stroke="#22303f" stroke-width="2"/>

  <!-- clipboard with notes and pen -->
  <rect x="740" y="1146" width="58" height="70" rx="6" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="747" y="1158" width="44" height="50" rx="2" fill="#ffffff"/>
  <rect x="757" y="1141" width="24" height="11" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
  <path d="M753 1170 L785 1170 M753 1180 L781 1180 M753 1190 L785 1190 M753 1200 L773 1200" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M732 1204 Q 752 1212 772 1200 L 776 1210 Q 754 1222 730 1214 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
