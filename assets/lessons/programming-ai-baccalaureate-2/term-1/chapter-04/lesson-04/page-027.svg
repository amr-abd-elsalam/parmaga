<!-- ===== Text ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">أشهر خطأ</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">MOST COMMON MISTAKE</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يخلط كثير من الطلاب بين خطوتي</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">«تحقّق»</tspan> <tspan font-weight="bold" fill="#c0392b">و«تصرّف».</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Many students mix up</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#c0392b">“Check”</tspan> and <tspan font-weight="bold" fill="#c0392b">“Act”</tspan> steps.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تحقّق</tspan> = <tspan font-weight="bold" fill="#17457f">ترمومتر:</tspan> يقيس فقط،</tspan>
  <tspan x="950" dy="40">ويجيب عن سؤال «ماذا حدث؟».</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Check</tspan> = a <tspan font-weight="bold" fill="#17457f">thermometer:</tspan> it only measures</tspan>
  <tspan x="132" dy="40">and answers the question “What happened?”</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تصرّف</tspan> = <tspan font-weight="bold" fill="#17457f">طبيب:</tspan> يقرر،</tspan>
  <tspan x="950" dy="40">ويجيب عن سؤال «ماذا سنفعل بعد ذلك؟».</tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Act</tspan> = a <tspan font-weight="bold" fill="#17457f">doctor:</tspan> it decides and answers</tspan>
  <tspan x="132" dy="40">the question “What will we do next?”</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الترمومتر لا يكتب الروشتة أبدًا.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">A thermometer never writes</tspan>
  <tspan x="140" dy="40">the prescription.</tspan>
</text>
</svg>
