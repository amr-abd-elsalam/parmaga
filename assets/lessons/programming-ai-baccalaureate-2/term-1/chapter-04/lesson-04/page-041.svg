<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 4: النموذج الأولي (Prototype)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 4: Prototype</tspan>
</text>

<!-- Card header -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>

<!-- Card paragraph -->
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النموذج الأولي:</tspan> نسخة سريعة ورخيصة من الحل</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">نجرّبها،</tspan> وليست المنتج النهائي.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Prototype:</tspan> a quick, cheap version</tspan>
  <tspan x="140" dy="40">of the solution that we <tspan font-weight="bold" fill="#17457f">try out;</tspan></tspan>
  <tspan x="140" dy="40">it is not the final product.</tspan>
</text>

<!-- Paragraph: example -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في مثالنا: ترسم شاشة <tspan fill="#c96a1b">«حصتي الجاية»</tspan></tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">ورقة</tspan> في 5 دقائق، دون أي برمجة.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In our example: you draw</tspan>
  <tspan x="120" dy="40">the <tspan fill="#c96a1b">“My Next Class”</tspan> screen on <tspan font-weight="bold" fill="#17457f">paper</tspan></tspan>
  <tspan x="120" dy="40">in 5 minutes, without any programming.</tspan>
</text>

<!-- Paragraph: why paper -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لماذا الورقة؟ لأن تعديل رسمة</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">أسهل كثيرًا</tspan> من تعديل كود كامل.</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Why paper? Because changing</tspan>
  <tspan x="120" dy="40">a sketch is <tspan font-weight="bold" fill="#17457f">much easier</tspan> than changing</tspan>
  <tspan x="120" dy="40">a whole program.</tspan>
</text>
</svg>
