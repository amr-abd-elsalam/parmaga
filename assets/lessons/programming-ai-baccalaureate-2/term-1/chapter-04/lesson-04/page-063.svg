<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك: اكتشف الخطأ</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT YOURSELF: SPOT THE MISTAKE</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">أي قاعدة من <tspan font-weight="bold" fill="#c0392b">«العينات الأربع»</tspan> خالفتها</tspan>
  <tspan x="935" dy="40">كل تجربة؟ أم أنها سليمة؟</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Which of the <tspan font-weight="bold" fill="#c0392b">Four E's</tspan> did each</tspan>
  <tspan x="140" dy="40">experiment break? Or is it sound?</tspan>
</text>
<text x="930" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«عرضنا النسخة A يوم الجمعة،</tspan>
  <tspan x="930" dy="40">والنسخة B يوم الاثنين.»</tspan>
</text>
<text x="150" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We showed version A on Friday and</tspan>
  <tspan x="150" dy="40">version B on Monday.”</tspan>
</text>
<text x="930" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«غيّرنا اللون والعنوان والصورة</tspan>
  <tspan x="930" dy="40">معًا لنعرف أثر اللون.»</tspan>
</text>
<text x="150" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We changed the color, the heading,</tspan>
  <tspan x="150" dy="40">and the image together to find the</tspan>
  <tspan x="150" dy="40">effect of the color.”</tspan>
</text>
<text x="930" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«أوقفنا الاختبار بعد 20 زائرًا</tspan>
  <tspan x="930" dy="40">لأن B كانت متقدمة.»</tspan>
</text>
<text x="150" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We stopped the test after 20</tspan>
  <tspan x="150" dy="40">visitors because B was ahead.”</tspan>
</text>
<text x="930" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«حددنا المقياس قبل الاختبار،</tspan>
  <tspan x="930" dy="40">ووزعنا عددًا كافيًا من الزوار بالقرعة،</tspan>
  <tspan x="930" dy="40">وغيّرنا عنصرًا واحدًا.»</tspan>
</text>
<text x="150" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We set the metric before the test,</tspan>
  <tspan x="150" dy="40">assigned enough visitors at random,</tspan>
  <tspan x="150" dy="40">and changed one element.”</tspan>
</text>
</svg>
