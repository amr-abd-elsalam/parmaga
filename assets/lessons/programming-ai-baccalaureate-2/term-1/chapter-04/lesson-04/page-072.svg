<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">قاعدة الكلمات المطلقة</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">THE ABSOLUTE WORDS RULE</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في أسئلة الاختيار من متعدد، ضع <tspan font-weight="bold" fill="#c0392b">موضع الشك</tspan></tspan>
  <tspan x="935" dy="40">أي خيار فيه كلمات مثل «فقط» أو «وحده»</tspan>
  <tspan x="935" dy="40">أو «لا حاجة» أو «مرة واحدة».</tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In multiple-choice questions,</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">be suspicious</tspan> of any option with</tspan>
  <tspan x="140" dy="40">words like “only”, “alone”,</tspan>
  <tspan x="140" dy="40">“no need”, or “once”.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لأن الدرس كله ضد <tspan font-weight="bold" fill="#c0392b">الحلول المطلقة:</tspan></tspan>
  <tspan x="935" dy="40">التحسين يتكرر ولا يتوقف.</tspan>
</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Because the whole lesson is against</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">absolute answers:</tspan> improvement</tspan>
  <tspan x="140" dy="40">repeats and does not stop.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> «ينبغي أن تتم جميع التحسينات</tspan>
  <tspan x="950" dy="40">باختبار A/B <tspan font-weight="bold" fill="#c0392b">وحده»</tspan> خيار خاطئ.</tspan>
</text>

<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> “All improvements should</tspan>
  <tspan x="120" dy="40">be done with A/B testing <tspan font-weight="bold" fill="#c0392b">alone”</tspan></tspan>
  <tspan x="120" dy="40">is a wrong option.</tspan>
</text>
</svg>
