<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">احسبها أنت (الصفحة 21)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Calculate It Yourself (Page 21)</tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">نسبة النقر</tspan> = 10 ÷ 200 × 100% = 5%.</tspan>
</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">CTR</tspan> = 10 ÷ 200 × 100% = 5%.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 لم يتحقق <tspan font-weight="bold" fill="#17457f">الهدف،</tspan> لأن 46% أقل من 50%.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 The <tspan font-weight="bold" fill="#17457f">goal</tspan> was not reached,</tspan>
  <tspan x="132" dy="40">because 46% is less than 50%.</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكن الموقع <tspan font-weight="bold" fill="#2e7d32">تحسّن،</tspan> لأن 46% أعلى من</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">خط الأساس</tspan> 40% بـ 6 نقاط مئوية.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But the site <tspan font-weight="bold" fill="#2e7d32">improved,</tspan></tspan>
  <tspan x="120" dy="40">because 46% is 6 percentage points</tspan>
  <tspan x="120" dy="40">above the 40% <tspan font-weight="bold" fill="#17457f">baseline.</tspan></tspan>
</text>
</svg>
