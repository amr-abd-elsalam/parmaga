<!-- Card texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التحسين التكراري</tspan> (Iterative Improvement):</tspan>
  <tspan x="935" dy="40">تطوير المنتج على دفعات متتالية؛</tspan>
  <tspan x="935" dy="40">في كل دفعة <tspan font-weight="bold" fill="#17457f">تغيير، ثم قياس، ثم قرار،</tspan></tspan>
  <tspan x="935" dy="40">بدل محاولة الوصول إلى الكمال مرة واحدة.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Iterative Improvement:</tspan> developing</tspan>
  <tspan x="140" dy="40">a product in successive rounds;</tspan>
  <tspan x="140" dy="40">each round has <tspan font-weight="bold" fill="#17457f">a change, then a</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">measurement, then a decision,</tspan></tspan>
  <tspan x="140" dy="40">instead of trying to reach</tspan>
  <tspan x="140" dy="40">perfection all at once.</tspan>
</text>

<!-- Example paragraph -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> تعدّل طائرتك الورقية</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">جولة بعد جولة</tspan> حتى تطير أبعد.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> you adjust your paper plane</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">round after round</tspan> until it flies farther.</tspan>
</text>
</svg>
