<!-- Page titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">لماذا يحتاج الموقع إلى</tspan>
  <tspan x="540" dy="48">تحسين مستمر؟</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">Why Does a Website Need</tspan>
  <tspan x="540" dy="36">Continuous Improvement?</tspan>
</text>

<!-- Paragraph 1 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">النسخة الأولى</tspan> من أي موقع إلكتروني</tspan>
  <tspan x="950" dy="40">هي مجرد <tspan font-weight="bold" fill="#c0392b">أفضل تخمين</tspan> لدى الفريق.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#17457f">first version</tspan> of any website</tspan>
  <tspan x="120" dy="40">is only the team's <tspan font-weight="bold" fill="#c0392b">best guess.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ولا يعرف الفريق ما يناسب المستخدمين فعلًا</tspan>
  <tspan x="950" dy="40">إلا بعد أن يستخدم الموقعَ <tspan font-weight="bold" fill="#17457f">أشخاصٌ حقيقيون.</tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The team learns what truly suits users</tspan>
  <tspan x="120" dy="40">only after <tspan font-weight="bold" fill="#17457f">real people</tspan> use the site.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لذلك يجمع الفريق نوعين مهمين من الدليل:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">ملاحظات المستخدمين،</tspan> <tspan font-weight="bold" fill="#c0392b">وبيانات الاستخدام.</tspan></tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So the team collects two important kinds</tspan>
  <tspan x="120" dy="40">of evidence: <tspan font-weight="bold" fill="#c0392b">user feedback</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#c0392b">usage data.</tspan></tspan>
</text>

<!-- Illustration labels (right to left: Version 1, 2, 3) -->
<text x="891" y="1131" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">النسخة 1</text>
<text x="745" y="1167" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Version 1</text>
<text x="641" y="1131" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">النسخة 2</text>
<text x="495" y="1167" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Version 2</text>
<text x="346" y="1131" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">النسخة 3</text>
<text x="200" y="1167" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Version 3</text>
</svg>
