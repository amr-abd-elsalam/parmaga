<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كايزن</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KAIZEN</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">كايزن</tspan> (Kaizen) كلمة يابانية معناها</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#2e7d32">«التغيير للأفضل»،</tspan> وهي فلسفة <tspan font-weight="bold" fill="#17457f">للتحسين المستمر</tspan></tspan>
  <tspan x="935" dy="40">بخطوات صغيرة يشارك فيها الجميع.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Kaizen</tspan> is a Japanese word meaning</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">“change for the better”;</tspan> it is a</tspan>
  <tspan x="140" dy="40">philosophy of <tspan font-weight="bold" fill="#17457f">continuous improvement</tspan></tspan>
  <tspan x="140" dy="40">in small steps in which</tspan>
  <tspan x="140" dy="40">everyone takes part.</tspan>
</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ودورة PDCA من أشهر <tspan font-weight="bold" fill="#17457f">الأدوات</tspan> المستخدمة</tspan>
  <tspan x="935" dy="40">داخل هذه الفلسفة.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The PDCA cycle is one of the best-known</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">tools</tspan> used within this philosophy.</tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تذكّر <tspan font-weight="bold" fill="#17457f">قاعدة 1% يوميًا</tspan> التي تعلمتها:</tspan>
  <tspan x="950" dy="40">إنها روح كايزن نفسها.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
