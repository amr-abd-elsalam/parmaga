      <path d="M -18 22 Q 0 12 18 22 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -40 -16 L -50 6 M -40 -16 L -30 6 M 40 -16 L 30 6 M 40 -16 L 50 6" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
      <rect x="-44" y="-19" width="88" height="6" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
      <circle cx="0" cy="-20" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
      <rect x="-47" y="-9" width="14" height="15" rx="2" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
