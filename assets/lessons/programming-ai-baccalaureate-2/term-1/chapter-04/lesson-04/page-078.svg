      <path d="M -44 0 L -36 0 M -44 3 L -38 3" fill="none" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
      <rect x="33" y="-9" width="14" height="15" rx="2" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
      <rect x="34" y="-8" width="12" height="3" fill="#c96a1b"/>
