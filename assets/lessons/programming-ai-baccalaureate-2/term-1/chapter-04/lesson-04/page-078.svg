<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">بطاقة الحفظ</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">MEMORY CARD</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">العين = <tspan font-weight="bold" fill="#17457f">التفكير التصميمي:</tspan></tspan>
  <tspan x="935" dy="40">حِسّ وحدّد، فكّر واصنع وجرّب.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The eye = <tspan font-weight="bold" fill="#17457f">design thinking:</tspan> Empathize,</tspan>
  <tspan x="140" dy="40">Define, Ideate, Prototype, Test.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الميزان = <tspan font-weight="bold" fill="#17457f">اختبار A/B:</tspan></tspan>
  <tspan x="935" dy="40">عنصر، عدّاد، عشوائية، عيّنة كافية.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The scale = <tspan font-weight="bold" fill="#17457f">A/B testing:</tspan> Element,</tspan>
  <tspan x="140" dy="40">Exact metric, Even split, Enough users.</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">العجلة = <tspan font-weight="bold" fill="#17457f">دورة PDCA:</tspan></tspan>
  <tspan x="935" dy="40">خطّط، نفّذ، تحقّق، تصرّف… ثم كرّر.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The wheel = the <tspan font-weight="bold" fill="#17457f">PDCA cycle:</tspan></tspan>
  <tspan x="140" dy="40">Plan, Do, Check, Act… then repeat.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">القاعدة الذهبية:</tspan></tspan>
  <tspan x="935" dy="40">لا تخمّن… قِس، جرّب، كرّر.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#c0392b">golden rule:</tspan></tspan>
  <tspan x="140" dy="40">Don't guess… measure, try, repeat.</tspan>
</text>
</svg>
