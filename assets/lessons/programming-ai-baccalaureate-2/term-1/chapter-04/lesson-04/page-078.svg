      <path d="M -55 6 L -25 6 Q -40 20 -55 6 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 25 6 L 55 6 Q 40 20 25 6 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <!-- wheel of four clockwise arrow segments -->
    <g transform="translate(0 68)">
      <path d="M 1.92 -21.92 A 22 22 0 0 1 19.05 -11.00 L 22.52 -13.00 L 17.97 -0.94 L 8.66 -5.00 L 12.12 -7.00 A 14 14 0 0 0 1.22 -13.95 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
