<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قبل أن نبدأ</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Before We Start</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أنك فتحت <tspan font-weight="bold" fill="#c0392b">محل كشري</tspan> جديدًا.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine that you have just opened</tspan>
  <tspan x="120" dy="40">a new <tspan font-weight="bold" fill="#c0392b">koshari shop.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل سيكون أول طبق تصنعه <tspan font-weight="bold" fill="#17457f">أفضل طبق</tspan> في مصر؟</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Will the first dish you make</tspan>
  <tspan x="120" dy="40">be <tspan font-weight="bold" fill="#17457f">the best dish</tspan> in Egypt?</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بالطبع لا، لكنك ستعرف كيف <tspan font-weight="bold" fill="#17457f">تحسّنه:</tspan></tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">تسأل الزبائن،</tspan> وتلاحظ الأطباق</tspan>
  <tspan x="950" dy="40">التي تعود ممتلئة، <tspan fill="#c96a1b">وتعدّ الزبائن</tspan></tspan>
  <tspan x="950" dy="40">الذين يعودون مرة أخرى.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Of course not, but you will know how</tspan>
  <tspan x="120" dy="40">to <tspan font-weight="bold" fill="#17457f">improve</tspan> it: you <tspan fill="#c96a1b">ask your customers,</tspan></tspan>
  <tspan x="120" dy="40">notice the dishes that come back full,</tspan>
  <tspan x="120" dy="40">and <tspan fill="#c96a1b">count the customers</tspan></tspan>
  <tspan x="120" dy="40">who come back again.</tspan>
</text>
</svg>
