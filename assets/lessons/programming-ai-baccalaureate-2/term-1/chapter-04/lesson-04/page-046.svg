<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المخطط الهيكلي</tspan> (Wireframe): رسم تخطيطي</tspan>
  <tspan x="935" dy="40">يوضح <tspan font-weight="bold" fill="#17457f">أماكن العناصر</tspan> في صفحة الويب،</tspan>
  <tspan x="935" dy="40">دون ألوان أو صور أو تفاصيل.</tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Wireframe:</tspan> a layout sketch that shows</tspan>
  <tspan x="140" dy="40">where the <tspan font-weight="bold" fill="#17457f">elements</tspan> go on a web page,</tspan>
  <tspan x="140" dy="40">without colors, images, or details.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يشبه <tspan font-weight="bold" fill="#c0392b">المخطط الهيكلي</tspan> <tspan font-weight="bold" fill="#17457f">رسم المهندس</tspan></tspan>
  <tspan x="950" dy="40">لتوزيع الغرف قبل بناء البيت.</tspan>
</text>

<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">wireframe</tspan> is like an <tspan font-weight="bold" fill="#17457f">engineer's plan</tspan></tspan>
  <tspan x="120" dy="40">of the rooms before building a house.</tspan>
</text>

<text x="497" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">العنوان</text>
<text x="392" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Heading</text>
<text x="350" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">صورة</text>
<text x="278" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Image</text>
<text x="220" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">زر</text>
