<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">خط الأساس</tspan> (Baseline): قيمة المقياس</tspan>
  <tspan x="935" dy="40">قبل التغيير، وهي <tspan font-weight="bold" fill="#17457f">نقطة المقارنة؛</tspan></tspan>
  <tspan x="935" dy="40">ومن دونه لن تعرف هل <tspan font-weight="bold" fill="#2e7d32">تحسّنت</tspan> أم لا.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Baseline:</tspan> the value of the metric</tspan>
  <tspan x="140" dy="40">before the change; it is the point</tspan>
  <tspan x="140" dy="40">of <tspan font-weight="bold" fill="#17457f">comparison,</tspan> and without it you</tspan>
  <tspan x="140" dy="40">cannot know whether you <tspan font-weight="bold" fill="#2e7d32">improved.</tspan></tspan>
</text>
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> <tspan fill="#c96a1b">وزنك</tspan> قبل أن تبدأ الرياضة</tspan>
  <tspan x="950" dy="40">هو <tspan font-weight="bold" fill="#c0392b">خط الأساس</tspan> الذي تقارن به وزنك بعد شهر.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> your <tspan fill="#c96a1b">weight</tspan> before you start</tspan>
  <tspan x="120" dy="40">exercising is the <tspan font-weight="bold" fill="#c0392b">baseline</tspan> you compare</tspan>
  <tspan x="120" dy="40">with your weight after a month.</tspan>
</text>
<text x="740" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">قبل</text>
<text x="740" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Before</text>
<text x="420" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">بعد</text>
<text x="420" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">After</text>
<text x="230" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">خط الأساس</text>
<text x="230" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Baseline</text>
</svg>
