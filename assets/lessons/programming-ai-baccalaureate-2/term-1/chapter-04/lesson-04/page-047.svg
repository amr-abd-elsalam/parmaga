<!-- Texts -->
<text x="945" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="945" dy="0">تعريف</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التقييم الاستدلالي</tspan> (Heuristic Evaluation):</tspan>
  <tspan x="935" dy="40">أن يفحص خبراءُ واجهةَ المستخدم ويكتشفوا</tspan>
  <tspan x="935" dy="40">مشكلاتها اعتمادًا على <tspan font-weight="bold" fill="#17457f">قواعد عملية معروفة.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Heuristic Evaluation:</tspan> experts examine</tspan>
  <tspan x="140" dy="40">a user interface and find its problems</tspan>
  <tspan x="140" dy="40">based on <tspan font-weight="bold" fill="#17457f">well-known rules of thumb.</tspan></tspan>
</text>
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> خبير يقول: <tspan fill="#c96a1b">«الزر صغير،</tspan></tspan>
  <tspan x="950" dy="40">ولا يظهر بوضوح على هذه الخلفية.»</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> an expert says,</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">“The button is small</tspan> and does not</tspan>
  <tspan x="120" dy="40">stand out on this background.”</tspan>
</text>
</svg>
