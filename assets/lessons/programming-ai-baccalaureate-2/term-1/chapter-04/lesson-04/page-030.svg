<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">4 <tspan font-weight="bold" fill="#c0392b">تصرّف:</tspan> إذا حققتم الهدف فثبّتوا التصميم،</tspan>
  <tspan x="950" dy="40">وإن لم تحققوه فغيّروا شيئًا واحدًا فقط،</tspan>
  <tspan x="950" dy="40">مثل <tspan fill="#c96a1b">طول الجناح</tspan> أو <tspan fill="#c96a1b">ثنية المقدمة</tspan>.</tspan>
</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">4 <tspan font-weight="bold" fill="#c0392b">Act:</tspan> if you reach the goal,</tspan>
  <tspan x="132" dy="40">keep the design; if not, change only</tspan>
  <tspan x="132" dy="40">one thing, such as the <tspan fill="#c96a1b">wing length</tspan> or</tspan>
  <tspan x="132" dy="40">the <tspan fill="#c96a1b">nose fold</tspan>.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">5 <tspan font-weight="bold" fill="#17457f">كرّروا الدورة</tspan> مرتين أو ثلاثًا،</tspan>
  <tspan x="950" dy="40">وسجّلوا المسافة في كل مرة.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">5 <tspan font-weight="bold" fill="#17457f">Repeat the cycle</tspan> two or three times,</tspan>
  <tspan x="132" dy="40">and record the distance each time.</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">المجموعة التي غيّرت ثلاثة أشياء مرة واحدة،</tspan>
  <tspan x="935" dy="40">هل تستطيع أن تعرف أيها حسّن الطائرة؟</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Can the group that changed</tspan>
  <tspan x="140" dy="40">three things at once tell which one</tspan>
  <tspan x="140" dy="40">improved the plane?</tspan>
</text>
</svg>
