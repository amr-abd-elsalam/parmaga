<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">العين (خطّط):</tspan> تراقب زملاءك فتكتشف أن رابط</tspan>
  <tspan x="950" dy="40">التسجيل مختفٍ أسفل الصفحة على <tspan fill="#c96a1b">شاشة الموبايل.</tspan></tspan>
</text>

<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">1 <tspan font-weight="bold" fill="#c0392b">The eye (Plan):</tspan> you watch your</tspan>
  <tspan x="132" dy="40">classmates and discover that the</tspan>
  <tspan x="132" dy="40">sign-up link is hidden at the bottom</tspan>
  <tspan x="132" dy="40">of the page on a <tspan fill="#c96a1b">phone screen.</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">2 تولّد <tspan font-weight="bold" fill="#17457f">فكرتين:</tspan> <tspan fill="#c96a1b">زر تسجيل كبير</tspan> أعلى الصفحة،</tspan>
  <tspan x="950" dy="40">أو <tspan fill="#c96a1b">زر ثابت</tspan> يظهر دائمًا أسفل الشاشة.</tspan>
</text>

<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">2 You come up with <tspan font-weight="bold" fill="#17457f">two ideas:</tspan> a big</tspan>
  <tspan x="132" dy="40"><tspan fill="#c96a1b">sign-up button</tspan> at the top of the page,</tspan>
  <tspan x="132" dy="40">or a <tspan fill="#c96a1b">fixed button</tspan> always shown at the</tspan>
  <tspan x="132" dy="40">bottom of the screen.</tspan>
</text>
