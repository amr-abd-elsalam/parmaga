<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريفات</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITIONS</tspan>
</text>
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التكرار</tspan> (Iteration): تنفيذ الحلقة نفسها</tspan>
  <tspan x="935" dy="40">أكثر من مرة، وكل مرة تبني على <tspan font-weight="bold" fill="#17457f">ما تعلمته</tspan></tspan>
  <tspan x="935" dy="40">في المرة السابقة.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Iteration:</tspan> carrying out the same loop</tspan>
  <tspan x="140" dy="40">more than once, with each time building</tspan>
  <tspan x="140" dy="40">on <tspan font-weight="bold" fill="#17457f">what you learned</tspan> the time before.</tspan>
</text>
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التحسين المستمر</tspan> (Continuous Improvement):</tspan>
  <tspan x="935" dy="40">فلسفة ترى أن التحسين لا يتوقف،</tspan>
  <tspan x="935" dy="40">وأن التحسينات الصغيرة المتراكمة</tspan>
  <tspan x="935" dy="40">تصنع <tspan font-weight="bold" fill="#2e7d32">فرقًا كبيرًا.</tspan></tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Continuous Improvement:</tspan> a philosophy</tspan>
  <tspan x="140" dy="40">that sees improvement as never-ending,</tspan>
  <tspan x="140" dy="40">where small improvements that add up</tspan>
  <tspan x="140" dy="40">make <tspan font-weight="bold" fill="#2e7d32">a big difference.</tspan></tspan>
</text>
</svg>
