<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميّزك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DID YOU KNOW?</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو تحسّنت <tspan fill="#c96a1b">1%</tspan> فقط كل يوم، فبعد سنة</tspan>
  <tspan x="935" dy="40">ستصل إلى نحو <tspan font-weight="bold" fill="#17457f">37 ضعف</tspan> نقطة بدايتك، لأن ناتج</tspan>
  <tspan x="935" dy="40">ضرب 1.01 في نفسه 365 مرة يقارب <tspan fill="#c96a1b">37.8.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If you improve by only <tspan fill="#c96a1b">1%</tspan> every day,</tspan>
  <tspan x="140" dy="40">after one year you will reach about</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">37 times</tspan> your starting point,</tspan>
  <tspan x="140" dy="40">because multiplying 1.01 by itself</tspan>
  <tspan x="140" dy="40">365 times gives about <tspan fill="#c96a1b">37.8.</tspan></tspan>
</text>
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الدليل أم الرأي؟</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Evidence or Opinion?</text>
<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الدليل</tspan> (Evidence): <tspan font-weight="bold" fill="#17457f">معلومة حقيقية مقاسة</tspan></tspan>
  <tspan x="950" dy="40">أو ملاحظة موثقة تُبنى عليها القرارات.</tspan>
</text>
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Evidence:</tspan> real, <tspan font-weight="bold" fill="#17457f">measured information</tspan></tspan>
  <tspan x="120" dy="40">or a recorded observation that</tspan>
  <tspan x="120" dy="40">decisions are built on.</tspan>
</text>
</svg>
