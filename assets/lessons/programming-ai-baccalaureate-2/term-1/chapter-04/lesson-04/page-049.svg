<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشتهر <tspan font-weight="bold" fill="#c0392b">نموذج الأنماط الخمسة</tspan> عن طريق معهد</tspan>
  <tspan x="935" dy="40">التصميم في <tspan font-weight="bold" fill="#17457f">جامعة ستانفورد</tspan> (d.school).</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#c0392b">five-mode model</tspan> became famous</tspan>
  <tspan x="140" dy="40">through the design institute at</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">Stanford University</tspan> (the d.school).</tspan>
</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وتوجد نماذج أخرى <tspan font-weight="bold" fill="#17457f">للتفكير التصميمي</tspan></tspan>
  <tspan x="935" dy="40">بثلاث مراحل أو أربع أو ست؛ ولهذا يقول</tspan>
  <tspan x="935" dy="40">درسك إنه <tspan font-weight="bold" fill="#c0392b">«نموذج شائع»،</tspan> لا النموذج الوحيد.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">There are other <tspan font-weight="bold" fill="#17457f">design thinking</tspan> models</tspan>
  <tspan x="140" dy="40">with three, four, or six stages;</tspan>
  <tspan x="140" dy="40">that is why your lesson calls it</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">“a common model”,</tspan> not the only model.</tspan>
</text>
</svg>
