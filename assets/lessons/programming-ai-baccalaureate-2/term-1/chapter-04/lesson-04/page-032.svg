<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كان ديمنج نفسه يفضّل لاحقًا اسم <tspan font-weight="bold" fill="#c0392b">PDSA،</tspan></tspan>
  <tspan x="935" dy="40">فوضع <tspan font-weight="bold" fill="#17457f">«ادرس»</tspan> (Study) بدل «تحقّق» (Check)،</tspan>
  <tspan x="935" dy="40">ليؤكد أن الهدف هو <tspan font-weight="bold" fill="#2e7d32">التعلم</tspan></tspan>
  <tspan x="935" dy="40">من النتائج لا مجرد فحصها.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Deming himself later preferred</tspan>
  <tspan x="140" dy="40">the name <tspan font-weight="bold" fill="#c0392b">PDSA,</tspan> putting <tspan font-weight="bold" fill="#17457f">“Study”</tspan></tspan>
  <tspan x="140" dy="40">in place of “Check” to stress that</tspan>
  <tspan x="140" dy="40">the goal is to <tspan font-weight="bold" fill="#2e7d32">learn</tspan> from the results,</tspan>
  <tspan x="140" dy="40">not just to inspect them.</tspan>
</text>
<text x="775" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="775" dy="0">تحقّق</tspan>
</text>
<text x="690" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="690" dy="0">Check</tspan>
</text>
<text x="380" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="380" dy="0">ادرس</tspan>
</text>
<text x="300" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="300" dy="0">Study</tspan>
</text>
