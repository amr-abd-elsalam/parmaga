<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الإجابة النموذجية لسؤال</tspan>
  <tspan x="540" dy="48">الـ 6 درجات</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">Model Answer for the 6-Mark Question</tspan>
</text>
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">سؤال على نمط الامتحان</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">EXAM-STYLE QUESTION</tspan>
</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشرح لماذا يحسّن فريق موقع إلكتروني عمله</tspan>
  <tspan x="935" dy="40">عبر <tspan font-weight="bold" fill="#17457f">دورات PDCA متكررة</tspan> بدلًا من محاولة</tspan>
  <tspan x="935" dy="40">بناء موقع مثالي دفعة واحدة. <tspan fill="#c96a1b">[6 درجات]</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain why a website team improves in</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">repeated PDCA cycles</tspan> instead of trying</tspan>
  <tspan x="140" dy="40">to build a perfect site in one go. <tspan fill="#c96a1b">[6]</tspan></tspan>
</text>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إجابتك تتكون من <tspan font-weight="bold" fill="#17457f">6 أفكار،</tspan></tspan>
  <tspan x="950" dy="40">ولكل فكرة <tspan font-weight="bold" fill="#2e7d32">درجة واحدة.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Your answer has <tspan font-weight="bold" fill="#17457f">6 ideas,</tspan></tspan>
  <tspan x="120" dy="40">and each idea earns <tspan font-weight="bold" fill="#2e7d32">one mark.</tspan></tspan>
</text>
</svg>
