<!-- Text -->
<text x="935" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميّزك</tspan>
</text>
<text x="140" y="186" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>
<text x="935" y="222" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الدلالة الإحصائية</tspan> (Statistical Significance):</tspan>
  <tspan x="935" dy="36">أن يكون الفرق بين النسختين <tspan font-weight="bold" fill="#17457f">كبيرًا</tspan></tspan>
  <tspan x="935" dy="36">بما يكفي لنستبعد أنه حدث صدفة.</tspan>
</text>
<text x="140" y="330" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Statistical Significance:</tspan> when the</tspan>
  <tspan x="140" dy="36">difference between the two versions is</tspan>
  <tspan x="140" dy="36"><tspan font-weight="bold" fill="#17457f">large enough</tspan> for us to rule out that</tspan>
  <tspan x="140" dy="36">it happened by chance.</tspan>
</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0">ويحكم المحللون عليها <tspan font-weight="bold" fill="#17457f">بأدوات إحصائية؛</tspan> ولهذا</tspan>
  <tspan x="935" dy="36">لا يكفي أن تكون إحدى النسختين أعلى قليلًا.</tspan>
</text>
<text x="140" y="546" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0">Analysts judge it with <tspan font-weight="bold" fill="#17457f">statistical tools;</tspan></tspan>
  <tspan x="140" dy="36">that is why it is not enough for one</tspan>
  <tspan x="140" dy="36">version to be slightly higher.</tspan>
</text>
</svg>
