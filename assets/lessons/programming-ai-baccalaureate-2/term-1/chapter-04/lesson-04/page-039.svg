<!-- ===== TEXT ===== -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الخطوة 2: التعريف (Define)</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Step 2: Define</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف:</tspan> صياغة <tspan font-weight="bold" fill="#17457f">المشكلة الحقيقية</tspan></tspan>
  <tspan x="935" dy="40">في جملة واضحة ومحددة،</tspan>
  <tspan x="935" dy="40">بناءً على ما اكتشفته في التعاطف.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Define:</tspan> stating the <tspan font-weight="bold" fill="#17457f">real problem</tspan> in</tspan>
  <tspan x="140" dy="40">one clear, specific sentence, based on</tspan>
  <tspan x="140" dy="40">what you discovered while empathizing.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في مثالنا: «الطالب يحتاج أن يعرف</tspan>
  <tspan x="950" dy="40">حصته القادمة خلال <tspan fill="#c96a1b">3 ثوانٍ</tspan> من الموبايل.»</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In our example: “The student needs</tspan>
  <tspan x="120" dy="40">to know their next class</tspan>
  <tspan x="120" dy="40">within <tspan fill="#c96a1b">3 seconds</tspan> on a phone.”</tspan>
</text>

<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لاحظ أن الجملة تذكر <tspan font-weight="bold" fill="#17457f">المستخدم وحاجته،</tspan></tspan>
  <tspan x="950" dy="40">ولا تذكر <tspan font-weight="bold" fill="#c0392b">الحل</tspan> بعد.</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Notice that the sentence names the <tspan font-weight="bold" fill="#17457f">user</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">their need,</tspan> and does not name</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">solution</tspan> yet.</tspan>
</text>
</svg>
