<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">لماذا نغيّر عنصرًا واحدًا؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Why Change One Element?</tspan>
</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">زادت أمك الملح والشطة والجبنة في طبق</tspan>
  <tspan x="950" dy="40">المكرونة <tspan font-weight="bold" fill="#17457f">مرة واحدة،</tspan> فصار الطبق <tspan font-weight="bold" fill="#2e7d32">رائعًا.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Your mother added more salt, chili, and</tspan>
  <tspan x="120" dy="40">cheese to the pasta dish <tspan font-weight="bold" fill="#17457f">all at once,</tspan></tspan>
  <tspan x="120" dy="40">and the dish became <tspan font-weight="bold" fill="#2e7d32">delicious.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أيّ الثلاثة كان السبب؟ <tspan font-weight="bold" fill="#17457f">لن تعرف!</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Which of the three was the reason?</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">You will not know!</tspan></tspan>
</text>

<!-- Info card texts -->
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">حزمة التغييرات</tspan> (Bundle of Changes):</tspan>
  <tspan x="935" dy="40">تغيير عدة عناصر معًا في النسخة B؛ فتعرف</tspan>
  <tspan x="935" dy="40">أثر <tspan font-weight="bold" fill="#17457f">المجموعة كلها،</tspan> لا أثر كل عنصر وحده.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Bundle of Changes:</tspan> changing several</tspan>
  <tspan x="140" dy="40">elements together in version B; you</tspan>
  <tspan x="140" dy="40">learn the effect of <tspan font-weight="bold" fill="#17457f">the whole group,</tspan></tspan>
  <tspan x="140" dy="40">not the effect of each element alone.</tspan>
</text>
</svg>
