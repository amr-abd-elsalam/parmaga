  <g transform="translate(-8 6)">
    <path d="M482 1188 L492.7 1190.4 M503.4 1192.8 L513.9 1194.7 M524.3 1196.6 L534.6 1197.9 M544.8 1199.2 L554.9 1199.9 M564.9 1200.6 L574.7 1200.8 M584.5 1201 L594.1 1200.6 M603.7 1200.2 L613.1 1199.3 M622.4 1198.4 L631.6 1196.9 M640.7 1195.4 L649.7 1193.3 M658.6 1191.2 L664 1190" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="676,1186 664.6,1196.7 660.6,1183.3" fill="#c0392b" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round"/>
