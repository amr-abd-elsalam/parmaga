  <path d="M887.5 1118.3 A118 118 0 0 1 796.6 1223 L799.2 1234.7 L771.7 1206 L784.8 1172.3 L787.5 1184 A78 78 0 0 0 847.7 1114.8 Z" fill="url(#ilSegGreen)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M759.7 1225.5 A118 118 0 0 1 655 1134.6 L643.3 1137.2 L672 1109.7 L705.7 1122.8 L694 1125.5 A78 78 0 0 0 763.2 1185.7 Z" fill="url(#ilSegOrange)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
