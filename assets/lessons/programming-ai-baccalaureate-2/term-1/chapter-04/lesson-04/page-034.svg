  <circle cx="770" cy="1108" r="50" fill="url(#ilHub)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="770" cy="1084" r="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="794" cy="1108" r="6" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
