<!-- Texts, in Layout order -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT YOURSELF</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">حدّد خطوة <tspan font-weight="bold" fill="#17457f">PDCA</tspan> التي تنتمي إليها كل عبارة:</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Identify the <tspan font-weight="bold" fill="#17457f">PDCA</tspan> step that each</tspan>
  <tspan x="140" dy="40">statement belongs to:</tspan>
</text>

<text x="930" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«قسنا عدد التسجيلات بعد أسبوع من التغيير.»</tspan>
</text>
<text x="150" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We measured the number of sign-ups</tspan>
  <tspan x="150" dy="40">one week after the change.”</tspan>
</text>

<text x="930" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«قررنا تعميم الزر الجديد</tspan>
  <tspan x="930" dy="40">على كل صفحات الموقع.»</tspan>
</text>
<text x="150" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We decided to apply the new button</tspan>
  <tspan x="150" dy="40">to every page of the site.”</tspan>
</text>

<text x="930" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«حددنا هدف رفع التسجيلات</tspan>
  <tspan x="930" dy="40">من 20 إلى 30 يوميًا.»</tspan>
</text>
<text x="150" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We set the goal of raising sign-ups</tspan>
  <tspan x="150" dy="40">from 20 to 30 a day.”</tspan>
</text>

<text x="930" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«غيّرنا لون زر التسجيل.»</tspan>
</text>
<text x="150" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">“We changed the color</tspan>
  <tspan x="150" dy="40">of the sign-up button.”</tspan>
</text>
</svg>
