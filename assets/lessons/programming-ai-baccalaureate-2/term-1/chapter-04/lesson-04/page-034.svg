    <rect x="-42" y="-50" width="84" height="100" rx="12" fill="#ffffff"/>
    <path d="M -42 -28 L -42 -38 Q -42 -50 -30 -50 L 30 -50 Q 42 -50 42 -38 L 42 -28 Z" fill="#f0c48c"/>
    <path d="M -42 -28 L 42 -28" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-42" y="-50" width="84" height="100" rx="12" fill="none" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="24" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="16" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="14" r="3.5" fill="#c0392b"/>
    <path d="M 1 13 L 20 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
    <polygon points="20,-6 27,-9 24,-3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- card: paint brush -->
  <g transform="translate(420 1192) rotate(-5)">
    <rect x="-42" y="-50" width="84" height="100" rx="12" fill="#ffffff"/>
    <path d="M -42 -28 L -42 -38 Q -42 -50 -30 -50 L 30 -50 Q 42 -50 42 -38 L 42 -28 Z" fill="#ffd24a"/>
    <path d="M -42 -28 L 42 -28" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-42" y="-50" width="84" height="100" rx="12" fill="none" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -30 36 Q -16 28 -2 34 Q 12 40 28 32 L 29 38 Q 12 47 -2 40 Q -16 34 -29 42 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="25.2,-10.8 9.2,5.2 2.8,-1.2 18.8,-17.2" fill="#b07a45" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="9.2,5.2 3.2,11.2 -3.2,4.8 2.8,-1.2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 3.2 11.2 Q -2 20 -14 22 Q -11 10 -3.2 4.8 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <g transform="translate(292 1000)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(548 1055)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(560 1248)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- dotted curved arrows toward the wheel -->
  <path d="M448 1012 L458.3 1008.8 M468.5 1005.6 L478.9 1003.4 M489.3 1001.1 L499.8 999.9 M510.3 998.6 L520.9 998.4 M531.5 998.1 L542.3 998.8 M553 999.5 L563.9 1001.2 M574.7 1002.9 L585.7 1005.6 M596.7 1008.2 L607.8 1011.9 M618.9 1015.5 L630.1 1020.2 M641.3 1024.8 L652 1030" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
