<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التوزيع العشوائي</tspan> (Randomization):</tspan>
  <tspan x="935" dy="40">توزيع الزوار على النسختين <tspan font-weight="bold" fill="#17457f">بالصدفة،</tspan></tspan>
  <tspan x="935" dy="40">مثل القرعة، لتكون المجموعتان متشابهتين.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Randomization:</tspan> assigning visitors to</tspan>
  <tspan x="140" dy="40">the two versions <tspan font-weight="bold" fill="#17457f">by chance,</tspan> like a</tspan>
  <tspan x="140" dy="40">lottery, so the two groups are alike.</tspan>
</text>
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مثال على الخطأ:</tspan> لو عرضت النسخة A</tspan>
  <tspan x="950" dy="40">على زوار الصباح والنسخة B على زوار الليل،</tspan>
  <tspan x="950" dy="40">فقد يكون الفرق سببه <tspan font-weight="bold" fill="#17457f">الوقت</tspan> لا <tspan font-weight="bold" fill="#17457f">التصميم.</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">An example of a mistake:</tspan> if you show</tspan>
  <tspan x="120" dy="40">version A to morning visitors and</tspan>
  <tspan x="120" dy="40">version B to night visitors,</tspan>
  <tspan x="120" dy="40">the difference may be caused by</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">time,</tspan> not the <tspan font-weight="bold" fill="#17457f">design.</tspan></tspan>
</text>
</svg>
