<!-- TEXT -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الملاحظات تخبرك «لماذا»،</tspan>
  <tspan x="935" dy="40">وبيانات الاستخدام تخبرك «ماذا حدث».</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Feedback tells you “why”;</tspan>
  <tspan x="140" dy="40">usage data tells you “what happened”.</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تجربة المستخدم</tspan> (User Experience - UX):</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الإحساس الكامل</tspan> للمستخدم أثناء استخدام</tspan>
  <tspan x="935" dy="40">المنتج: هل هو سهل وواضح ومريح؟</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">User Experience (UX):</tspan> the user's <tspan font-weight="bold" fill="#17457f">whole</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">experience</tspan> while using a product:</tspan>
  <tspan x="140" dy="40">is it easy, clear, and comfortable?</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">سؤال سريع:</tspan> هل تعرف تطبيقًا تستخدمه</tspan>
  <tspan x="950" dy="40">دون أن يشرحه لك أحد؟ هذه <tspan font-weight="bold" fill="#2e7d32">تجربة مستخدم جيدة.</tspan></tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Quick question:</tspan> do you know an app</tspan>
  <tspan x="120" dy="40">you use without anyone explaining it</tspan>
  <tspan x="120" dy="40">to you? That is a <tspan font-weight="bold" fill="#2e7d32">good user experience.</tspan></tspan>
</text>
</svg>
