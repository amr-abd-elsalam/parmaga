<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">لغة الأرقام: كيف نقيس التحسن؟</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">The Language of Numbers:</tspan>
  <tspan x="540" dy="36">How Do We Measure Improvement?</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريفات</text>

<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITIONS</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تحليل الاستخدام</tspan> (Web Analytics):</tspan>
  <tspan x="935" dy="40">جمع بيانات الاستخدام <tspan font-weight="bold" fill="#17457f">العددية</tspan> وتحليلها</tspan>
  <tspan x="935" dy="40">لفهم سلوك زوار الموقع.</tspan>
</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Web Analytics:</tspan> collecting and</tspan>
  <tspan x="140" dy="40">analyzing <tspan font-weight="bold" fill="#17457f">numerical</tspan> usage data</tspan>
  <tspan x="140" dy="40">to understand the behavior of</tspan>
  <tspan x="140" dy="40">a site's visitors.</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المقياس</tspan> (Metric): رقم محدد نتابعه لنعرف</tspan>
  <tspan x="935" dy="40">هل تحسّن الوضع أم لا، مثل <tspan fill="#c96a1b">عدد التسجيلات.</tspan></tspan>
</text>

<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Metric:</tspan> a specific number we track</tspan>
  <tspan x="140" dy="40">to know whether things improved,</tspan>
  <tspan x="140" dy="40">such as the <tspan fill="#c96a1b">number of sign-ups.</tspan></tspan>
</text>
</svg>
