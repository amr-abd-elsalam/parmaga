<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المورد</tspan> Resource: أي شيء تطلبه من الخادم:</tspan>
  <tspan x="950" dy="40">صفحة، أو صورة، أو ملف، أو بيانات.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Resource:</tspan> anything you request from the</tspan>
  <tspan x="120" dy="40">server: a page, an image, a file, or data.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العنوان</tspan> URL: العنوان الكامل للمورد</tspan>
  <tspan x="950" dy="40">على الويب، مثل <tspan font-weight="bold" fill="#17457f">عنوان البيت</tspan> بالضبط.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">URL</tspan> (Uniform Resource Locator):</tspan>
  <tspan x="120" dy="40">the full address of a resource on</tspan>
  <tspan x="120" dy="40">the web, just like a <tspan font-weight="bold" fill="#17457f">home address.</tspan></tspan>
</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve" font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0" font-size="26" fill="#3d5a76">URL</tspan>
  <tspan x="140" dy="40">https://www.example.com/lessons/3-2?lang=ar</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="embed" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="735" dy="0"><tspan direction="ltr" unicode-bidi="embed" fill="#c96a1b">https</tspan>: البروتوكول.</tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan fill="#c96a1b">https</tspan>: the protocol.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="embed" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="415" dy="0"><tspan direction="ltr" unicode-bidi="embed" fill="#c96a1b">www.example.com</tspan>: اسم الخادم (النطاق).</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan fill="#c96a1b">www.example.com</tspan>: the server</tspan>
  <tspan x="132" dy="40">name (domain).</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="embed" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="455" dy="0"><tspan direction="ltr" unicode-bidi="embed" fill="#c96a1b">/lessons/3-2</tspan>: مسار المورد داخل الخادم.</tspan>
</text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan fill="#c96a1b">/lessons/3-2</tspan>: the path to the</tspan>
  <tspan x="132" dy="40">resource on the server.</tspan>
</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="embed" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="485" dy="0"><tspan direction="ltr" unicode-bidi="embed" fill="#c96a1b">?lang=ar</tspan>: معلومات إضافية مع الطلب.</tspan>
</text>
<text x="132" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan fill="#c96a1b">?lang=ar</tspan>: extra information</tspan>
  <tspan x="132" dy="40">sent with the request.</tspan>
</text>
