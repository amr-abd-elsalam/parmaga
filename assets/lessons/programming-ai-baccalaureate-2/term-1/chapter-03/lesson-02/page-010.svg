<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الواجهة الأمامية Frontend:</tspan> الجزء الذي تراه</tspan>
  <tspan x="950" dy="40">وتتعامل معه على <tspan font-weight="bold" fill="#17457f">جهاز العميل.</tspan></tspan>
</text>
<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Frontend:</tspan> the part you see and use on</tspan>
  <tspan x="132" dy="40">the <tspan font-weight="bold" fill="#17457f">client's device.</tspan></tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الواجهة الخلفية Backend:</tspan> الجزء الذي يعمل</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">الخادم</tspan> ويعالج الطلبات.</tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Backend:</tspan> the part that runs on the</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">server</tspan> and processes requests.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الشبكة Network:</tspan> أجهزة متصلة <tspan font-weight="bold" fill="#17457f">تنقل الرسائل</tspan></tspan>
  <tspan x="950" dy="40">بين العميل والخادم.</tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Network:</tspan> connected devices that <tspan font-weight="bold" fill="#17457f">carry</tspan></tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">messages</tspan> between the client and the</tspan>
  <tspan x="132" dy="40">server.</tspan>
</text>

