<!-- Texts -->
<text x="140" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42" xml:space="preserve">
<tspan x="140" dy="0" font-size="26" fill="#3d5a76">JSON</tspan>
<tspan x="140" dy="40">{</tspan>
<tspan x="140" dy="40">  "name": <tspan fill="#c96a1b">"Mona"</tspan>,</tspan>
<tspan x="140" dy="40">  "grade": <tspan fill="#c96a1b">11</tspan>,</tspan>
<tspan x="140" dy="40">  "subjects": [<tspan fill="#c96a1b">"math"</tspan>, <tspan fill="#c96a1b">"physics"</tspan>]</tspan>
<tspan x="140" dy="40">}</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">جرّب بنفسك</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">TRY IT YOURSELF</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">كم زوجًا من <tspan font-weight="bold" fill="#17457f">مفتاح وقيمة</tspan> هنا؟</tspan>
  <tspan x="935" dy="40">وما نوع قيمة كل مفتاح؟</tspan>
</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">How many <tspan font-weight="bold" fill="#17457f">key-value pairs</tspan> are here?</tspan>
  <tspan x="140" dy="40">And what type is each key's value?</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">تحقق من إجابتك</text>

<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">CHECK YOUR ANSWER</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ثلاثة أزواج: "name" قيمته نص،</tspan>
  <tspan x="935" dy="40">و"grade" قيمته رقم،</tspan>
  <tspan x="935" dy="40">و"subjects" قيمته مصفوفة.</tspan>
</text>

<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Three pairs: "name" has a text value,</tspan>
  <tspan x="140" dy="40">"grade" a number,</tspan>
  <tspan x="140" dy="40">and "subjects" an array.</tspan>
</text>
</svg>
