<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">5. ماذا يريد</tspan>
  <tspan x="540" dy="48">العميل؟ GET وPOST</tspan>
</text>

<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">5. What Does the Client Want? GET and POST</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">طريقة طلب</tspan> HTTP (HTTP Method):</tspan>
  <tspan x="950" dy="40">كلمة في أول كل طلب تحدد نوع العملية المطلوبة؛</tspan>
  <tspan x="950" dy="40">إنها <tspan font-weight="bold" fill="#17457f">«الفعل»</tspan> في جملة الطلب.</tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTP method:</tspan> a word at the start of</tspan>
  <tspan x="120" dy="40">every request that sets the kind of</tspan>
  <tspan x="120" dy="40">operation wanted;</tspan>
  <tspan x="120" dy="40">it is the <tspan font-weight="bold" fill="#17457f">“verb”</tspan> of the request.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">GET:</tspan> لطلب مورد أو بيانات من الخادم،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">ولا يُفترض أن يغيّر شيئًا</tspan> عليه.</tspan>
  <tspan x="950" dy="40">وأي معلومات إضافية تُكتب في العنوان <tspan fill="#c96a1b">URL</tspan> نفسه،</tspan>
  <tspan x="950" dy="40">فتظهر في شريط العنوان.</tspan>
</text>

<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">GET:</tspan> requests a resource or data from</tspan>
  <tspan x="120" dy="40">the server and is <tspan font-weight="bold" fill="#17457f">not meant to change</tspan></tspan>
  <tspan x="120" dy="40">anything on it. Any extra information</tspan>
  <tspan x="120" dy="40">is written in the <tspan fill="#c96a1b">URL</tspan> itself, so it</tspan>
  <tspan x="120" dy="40">shows in the address bar.</tspan>
</text>
</svg>
