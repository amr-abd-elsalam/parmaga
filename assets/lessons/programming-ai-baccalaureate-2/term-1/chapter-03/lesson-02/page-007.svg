<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">1. أطراف المحادثة:</tspan>
  <tspan x="540" dy="48">العميل والخادم</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">1. The Talkers: Client and Server</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العميل Client:</tspan> برنامج <tspan font-weight="bold" fill="#17457f">يبدأ الاتصال</tspan> بإرسال طلب</tspan>
  <tspan x="950" dy="40">إلى برنامج آخر ينتظر الطلبات، مثل المتصفح</tspan>
  <tspan x="950" dy="40">وتطبيق الهاتف، ويُطلق الاسم</tspan>
  <tspan x="950" dy="40">أحيانًا على الجهاز نفسه.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Client:</tspan> a program that <tspan font-weight="bold" fill="#17457f">starts the</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">communication</tspan> by sending a request to</tspan>
  <tspan x="120" dy="40">another program that waits for requests,</tspan>
  <tspan x="120" dy="40">such as a browser or a phone app;</tspan>
  <tspan x="120" dy="40">the name is sometimes used for</tspan>
  <tspan x="120" dy="40">the device itself.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخادم Server:</tspan> برنامج <tspan font-weight="bold" fill="#17457f">يعمل باستمرار،</tspan> ينتظر</tspan>
  <tspan x="950" dy="40">طلبات العملاء، ويعالجها، ويرد عليها. ويُطلق</tspan>
  <tspan x="950" dy="40">الاسم أيضًا على الحاسوب الذي يشغّله.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Server:</tspan> a program that <tspan font-weight="bold" fill="#17457f">runs all the time,</tspan></tspan>
  <tspan x="120" dy="40">waits for clients' requests, processes</tspan>
  <tspan x="120" dy="40">them, and replies. The name also refers</tspan>
  <tspan x="120" dy="40">to the computer that runs it.</tspan>
</text>
</svg>
