<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قبل أن تغلق المذكرة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Before You Close Your Notes</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تذكرة الخروج:</tspan> ثلاثة أسئلة في <tspan fill="#c96a1b">دقيقتين.</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">أجب أولًا،</tspan> ثم اقلب الصفحة.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Exit ticket:</tspan> three questions</tspan>
  <tspan x="120" dy="40">in <tspan fill="#c96a1b">two minutes.</tspan> <tspan font-weight="bold" fill="#17457f">Answer first,</tspan></tspan>
  <tspan x="120" dy="40">then turn the page.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تذكرة الخروج</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXIT TICKET</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">1 تسجيل الدخول: GET أم POST؟</tspan>
  <tspan x="935" dy="40">وHTTP أم HTTPS؟ ولماذا؟</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">1 Logging in: GET or POST?</tspan>
  <tspan x="140" dy="40">HTTP or HTTPS? Why?</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">2 ظهر لك رقم 500:</tspan>
  <tspan x="935" dy="40">هل المشكلة عندك أم عند الخادم؟</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">2 You got code 500: is the problem</tspan>
  <tspan x="140" dy="40">on your side or the server's?</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">3 في &#x200E;"temperature": 31،</tspan>
  <tspan x="935" dy="40">ما المفتاح وما القيمة؟</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">3 In "temperature": 31,</tspan>
  <tspan x="140" dy="40">what is the key and what is the value?</tspan>
</text>
</svg>
