<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Bullets -->
<circle cx="966" cy="544" r="6" fill="#c0392b"/>
<circle cx="114" cy="624" r="6" fill="#c0392b"/>
<circle cx="966" cy="744" r="6" fill="#c0392b"/>
<circle cx="114" cy="824" r="6" fill="#c0392b"/>

<!-- Illustration: plain HTTP is an open postcard; each request stands alone -->
<g stroke-linecap="round" stroke-linejoin="round">
  <linearGradient id="ilSceneSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fc3e8"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
  <rect x="109" y="956" width="866" height="296" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="105" y="950" width="866" height="296" rx="22" fill="url(#ilSceneSky)" stroke="#22303f" stroke-width="2.5"/>

  <!-- Clouds -->
  <ellipse cx="330" cy="992" rx="34" ry="13" fill="#ffffff"/>
  <circle cx="318" cy="984" r="14" fill="#ffffff"/>
  <circle cx="342" cy="979" r="17" fill="#ffffff"/>
  <ellipse cx="724" cy="988" rx="30" ry="12" fill="#ffffff"/>
  <circle cx="714" cy="981" r="12" fill="#ffffff"/>
  <circle cx="735" cy="977" r="15" fill="#ffffff"/>

  <!-- Soft ground strip -->
  <path d="M107 1172 Q540 1158 969 1172 V1230 Q969 1244 955 1244 H121 Q107 1244 107 1230 Z" fill="#8fc9f2" opacity=".35"/>

  <!-- Road -->
  <path d="M240 1116 C 420 1088, 620 1148, 800 1100 L800 1132 C 620 1180, 420 1120, 240 1148 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <path d="M246 1132 C 424 1104, 620 1164, 796 1116" fill="none" stroke="#ffd24a" stroke-width="3" stroke-dasharray="16 14"/>

  <!-- Server (left) -->
  <rect x="150" y="990" width="96" height="150" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="160" y="1140" width="16" height="8" rx="2" fill="#22303f"/>
  <rect x="220" y="1140" width="16" height="8" rx="2" fill="#22303f"/>
  <rect x="160" y="996" width="76" height="5" rx="2.5" fill="#2f7fb5"/>
  <rect x="162" y="1008" width="72" height="30" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="162" y="1048" width="72" height="30" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="162" y="1088" width="72" height="30" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M172 1023 H202 M172 1063 H202 M172 1103 H202" fill="none" stroke="#dff1f7" stroke-width="2.5"/>
  <circle cx="220" cy="1023" r="5" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
  <circle cx="220" cy="1063" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="220" cy="1103" r="5" fill="#4fc3e8" stroke="#22303f" stroke-width="2"/>

  <!-- Laptop (right) -->
  <rect x="808" y="1000" width="120" height="84" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="818" y="1010" width="100" height="62" rx="4" fill="url(#ilScreen)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="846" y="1024" width="44" height="30" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="876" y="1028" width="9" height="10" rx="1.5" fill="#c96a1b"/>
  <path d="M851 1034 H868 M851 1042 H868 M851 1049 H862" fill="none" stroke="#2f7fb5" stroke-width="2"/>
  <path d="M790 1084 H946 L958 1102 Q958 1108 950 1108 H786 Q778 1108 778 1102 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="846" y="1092" width="44" height="8" rx="3" fill="#e8dfd1" stroke="#22303f" stroke-width="2"/>

  <!-- Motion lines behind the travelling postcard -->
  <path d="M606 1032 H642 M614 1052 H656 M606 1072 H638" fill="none" stroke="#8fc9f2" stroke-width="3"/>

  <!-- Open postcard halfway along the road -->
  <g transform="translate(520 1050) rotate(-5)">
    <rect x="-68" y="-44" width="136" height="88" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-60" y="-36" width="120" height="72" rx="4" fill="none" stroke="#f0c48c" stroke-width="2"/>
    <path d="M4 -28 V28" fill="none" stroke="#c96a1b" stroke-width="2"/>
    <path d="M-50 -16 H-8 M-50 -2 H-8 M-50 12 H-8 M-50 26 H-22" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
    <rect x="30" y="-30" width="22" height="26" rx="2" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="41" cy="-17" r="5" fill="#c96a1b"/>
    <path d="M12 -20 q4 -4 8 0 q4 4 8 0" fill="none" stroke="#7f95ab" stroke-width="2"/>
    <path d="M14 8 H52 M14 20 H52" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>

  <!-- Large magnifying glass hovering over the postcard -->
  <circle cx="500" cy="1036" r="44" fill="#dff1f7" opacity=".35"/>
  <rect x="468" y="1020" width="62" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="468" y="1038" width="62" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="468" y="1056" width="40" height="8" rx="4" fill="#8fc9f2"/>
  <path d="M474 1012 Q486 1000 502 998" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M448 1036 a52 52 0 1 0 104 0 a52 52 0 1 0 -104 0 Z M456 1036 a44 44 0 1 0 88 0 a44 44 0 1 0 -88 0 Z" fill="#17457f" fill-rule="evenodd" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(463 999) rotate(-45)">
    <rect x="-9" y="-14" width="18" height="16" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-8" y="-52" width="16" height="40" rx="8" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <path d="M566 986 L568.5 992.5 L575 995 L568.5 997.5 L566 1004 L563.5 997.5 L557 995 L563.5 992.5 Z" fill="#ffd24a"/>

  <!-- Row of separate, unconnected postcards -->
  <g transform="translate(330 1200) rotate(-6)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="12" y="-14" width="11" height="12" rx="1.5" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
    <path d="M-22 -6 H4 M-22 4 H4 M-22 13 H-6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>
  <g transform="translate(425 1202) rotate(4)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="12" y="-14" width="11" height="12" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
    <path d="M-22 -6 H4 M-22 4 H4 M-22 13 H-6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>
  <g transform="translate(520 1199) rotate(-3)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="12" y="-14" width="11" height="12" rx="1.5" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
    <path d="M-22 -6 H4 M-22 4 H4 M-22 13 H-6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>
  <g transform="translate(615 1202) rotate(5)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="12" y="-14" width="11" height="12" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
    <path d="M-22 -6 H4 M-22 4 H4 M-22 13 H-6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>
  <g transform="translate(710 1200) rotate(-4)">
    <rect x="-30" y="-20" width="60" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="12" y="-14" width="11" height="12" rx="1.5" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
    <path d="M-22 -6 H4 M-22 4 H4 M-22 13 H-6" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>
  </g>

  <!-- Connector: direction of travel, laptop to server -->
  <line x1="392" y1="1088" x2="318" y2="1088" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="304,1088 318,1080 318,1096" fill="#c0392b"/>
</g>

<!-- Icon: network beside "on the web." -->
<g transform="translate(866 376)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M28 10 L10 44 M28 10 L46 44 M10 44 L46 44" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="10" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="10" cy="44" r="9" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="46" cy="44" r="9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: star beside the section header -->
<g transform="translate(150 446)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="0,-22 5.47,-7.52 20.92,-6.8 8.84,2.87 12.93,17.8 0,9.3 -12.93,17.8 -8.84,2.87 -20.92,-6.8 -5.47,-7.52" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Paragraph: HTTP definition -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">HTTP</tspan> (HyperText Transfer Protocol)&#x200E;</tspan>
  <tspan x="950" dy="40">بروتوكول نقل النص التشعبي: يحدد كيف يكتب</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">العميل</tspan> طلبه <tspan font-weight="bold" fill="#17457f">والخادم</tspan> استجابته على الويب.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTP</tspan> (HyperText Transfer Protocol): the</tspan>
  <tspan x="120" dy="40">protocol that sets how the <tspan font-weight="bold" fill="#17457f">client</tspan> writes</tspan>
  <tspan x="120" dy="40">requests and the <tspan font-weight="bold" fill="#17457f">server</tspan> writes responses</tspan>
  <tspan x="120" dy="40">on the web.</tspan>
</text>

<!-- Header -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">صفتان مهمتان في HTTP</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Two important features of HTTP</text>

<!-- Bullet 1 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الرسائل تنتقل <tspan font-weight="bold" fill="#17457f">مكشوفة؛</tspan> فمن يعترضها</tspan>
  <tspan x="950" dy="40">في الطريق يستطيع قراءتها.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Messages travel in <tspan font-weight="bold" fill="#17457f">plain text,</tspan> so</tspan>
  <tspan x="132" dy="40">anyone who intercepts them on the</tspan>
  <tspan x="132" dy="40">way can read them.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">عديم الحالة</tspan> Stateless: كل طلب <tspan font-weight="bold" fill="#17457f">مستقل،</tspan></tspan>
  <tspan x="950" dy="40">والخادم لا يتذكر الطلب السابق بنفسه.</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Stateless:</tspan> each request <tspan font-weight="bold" fill="#17457f">stands alone,</tspan></tspan>
  <tspan x="132" dy="40">and the server does not remember the</tspan>
  <tspan x="132" dy="40">previous request by itself.</tspan>
</text>
</svg>
