<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الدرس كله سبعة أسئلة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The whole lesson is seven questions</tspan>
</text>

<circle cx="966" cy="264" r="6" fill="#c0392b"/>
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مَن يتكلم؟ <tspan font-weight="bold" fill="#c0392b">العميل والخادم</tspan></tspan>
</text>
<circle cx="114" cy="304" r="6" fill="#c0392b"/>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Who is talking? The <tspan font-weight="bold" fill="#c0392b">client</tspan> and the <tspan font-weight="bold" fill="#c0392b">server</tspan></tspan>
</text>

<circle cx="966" cy="344" r="6" fill="#c0392b"/>
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بأي لغة؟ <tspan font-weight="bold" fill="#c0392b">HTTP</tspan></tspan>
</text>
<circle cx="114" cy="384" r="6" fill="#c0392b"/>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">In what language? <tspan font-weight="bold" fill="#c0392b">HTTP</tspan></tspan>
</text>

<circle cx="966" cy="424" r="6" fill="#c0392b"/>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل الكلام سري؟ <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan></tspan>
</text>
<circle cx="114" cy="464" r="6" fill="#c0392b"/>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Is the talk private? <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan></tspan>
</text>

<circle cx="966" cy="504" r="6" fill="#c0392b"/>
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ماذا يريد العميل؟ <tspan font-weight="bold" fill="#c0392b">GET</tspan> أو <tspan font-weight="bold" fill="#c0392b">POST</tspan></tspan>
</text>
<circle cx="114" cy="544" r="6" fill="#c0392b"/>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">What does the client want? <tspan font-weight="bold" fill="#c0392b">GET</tspan> or <tspan font-weight="bold" fill="#c0392b">POST</tspan></tspan>
</text>

<circle cx="966" cy="584" r="6" fill="#c0392b"/>
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ماذا حدث؟ <tspan font-weight="bold" fill="#c0392b">رمز الحالة</tspan></tspan>
</text>
<circle cx="114" cy="624" r="6" fill="#c0392b"/>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">What happened? The <tspan font-weight="bold" fill="#c0392b">status code</tspan></tspan>
</text>

<circle cx="966" cy="664" r="6" fill="#c0392b"/>
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">من أي نافذة؟ <tspan font-weight="bold" fill="#c0392b">API</tspan></tspan>
</text>
<circle cx="114" cy="704" r="6" fill="#c0392b"/>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Through which window? An <tspan font-weight="bold" fill="#c0392b">API</tspan></tspan>
</text>

<circle cx="966" cy="744" r="6" fill="#c0392b"/>
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بأي شكل تأتي البيانات؟ <tspan font-weight="bold" fill="#c0392b">JSON</tspan></tspan>
</text>
<circle cx="114" cy="784" r="6" fill="#c0392b"/>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">In what shape does the data come? <tspan font-weight="bold" fill="#c0392b">JSON</tspan></tspan>
</text>
</svg>
