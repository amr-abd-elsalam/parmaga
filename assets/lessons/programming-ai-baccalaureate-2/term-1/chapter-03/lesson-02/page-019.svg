<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">جرّب مع زمايلك: لعبة البوستجي</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY WITH CLASSMATES:</tspan>
  <tspan x="140" dy="40">THE POSTMAN GAME</tspan>
</text>

<!-- Paragraph 1 -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ثلاثة منكم: عميل، وخادم، وزميل</tspan>
  <tspan x="935" dy="40">في المنتصف هو <tspan font-weight="bold" fill="#17457f">«الشبكة».</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Three of you: a client, a server,</tspan>
  <tspan x="140" dy="40">and a classmate in the middle</tspan>
  <tspan x="140" dy="40">as <tspan font-weight="bold" fill="#17457f">“the network.”</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مرّر ورقة مكشوفة فتقرؤها الشبكة</tspan>
  <tspan x="935" dy="40">بصوت عالٍ: هذا <tspan font-weight="bold" fill="#c0392b">HTTP.</tspan> ثم مرّرها</tspan>
  <tspan x="935" dy="40">في <tspan font-weight="bold" fill="#17457f">ظرف مغلق</tspan> فلا تُقرأ: هذا <tspan font-weight="bold" fill="#2e7d32">HTTPS.</tspan></tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Pass an open note and the network</tspan>
  <tspan x="140" dy="40">can read it aloud: that is <tspan font-weight="bold" fill="#c0392b">HTTP.</tspan></tspan>
  <tspan x="140" dy="40">Then pass it in a <tspan font-weight="bold" fill="#17457f">sealed envelope,</tspan></tspan>
  <tspan x="140" dy="40">and it cannot be read: that is <tspan font-weight="bold" fill="#2e7d32">HTTPS.</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="940" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">العميل</text>
<text x="766" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Client</text>
<text x="708" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الشبكة</text>
<text x="479" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Network</text>
<text x="375" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الخادم</text>
<text x="191" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Server</text>
</svg>
