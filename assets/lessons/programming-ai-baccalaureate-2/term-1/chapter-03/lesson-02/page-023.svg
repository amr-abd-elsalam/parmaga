<!-- Texts -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">6. ماذا حدث؟ رموز الحالة</text>

<text x="540"
      y="154"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">6. What Happened? Status Codes</text>

<text x="950"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">رمز حالة HTTP</tspan> (Status code):</tspan>
  <tspan x="950" dy="40">رقم من ثلاثة أرقام في أول الاستجابة</tspan>
  <tspan x="950" dy="40">يبلغ عن <tspan font-weight="bold" fill="#17457f">نتيجة الطلب.</tspan></tspan>
</text>

<text x="120"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Status code:</tspan> a three-digit number at the</tspan>
  <tspan x="120" dy="40">start of the response that reports the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">result of the request.</tspan></tspan>
</text>

<text x="935"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">الرقم الأول هو المفتاح:</tspan>
  <tspan x="935" dy="40">هو الذي يحدد العائلة.</tspan>
</text>

<text x="140"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">The first digit is the key:</tspan>
  <tspan x="140" dy="40">it tells you the family.</tspan>
</text>
</svg>
