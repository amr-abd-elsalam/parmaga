<!-- Example paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: <tspan fill="#c96a1b">تطبيق الطقس</tspan> على موبايلك لا يقيس</tspan>
  <tspan x="950" dy="40">الحرارة بنفسه، بل يطلبها من <tspan font-weight="bold" fill="#c0392b">API</tspan> لخدمة طقس.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: the <tspan fill="#c96a1b">weather app</tspan> on your phone</tspan>
  <tspan x="120" dy="40">does not measure the temperature itself;</tspan>
  <tspan x="120" dy="40">it asks a weather service's <tspan font-weight="bold" fill="#c0392b">API</tspan> for it.</tspan>
</text>

<!-- Success card text -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">للتذكر: الـ API هو <tspan font-weight="bold" fill="#c0392b">الجرسون:</tspan></tspan>
  <tspan x="935" dy="40">إنت مش بتدخل المطبخ، بتطلب من <tspan font-weight="bold" fill="#2e7d32">المنيو.</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">To remember: the API is the <tspan font-weight="bold" fill="#c0392b">waiter:</tspan></tspan>
  <tspan x="140" dy="40">you don't enter the kitchen;</tspan>
  <tspan x="140" dy="40">you order from the <tspan font-weight="bold" fill="#2e7d32">menu.</tspan></tspan>
</text>
</svg>
