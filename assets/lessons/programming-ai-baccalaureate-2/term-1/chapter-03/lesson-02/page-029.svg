<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الكائن Object:</tspan> بين قوسين متعرجين { }،</tspan>
  <tspan x="950" dy="40">وفيه أزواج من مفتاح وقيمة.</tspan>
</text>

<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Object:</tspan> inside curly braces { },</tspan>
  <tspan x="132" dy="40">holding key-value pairs.</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المفتاح Key:</tspan> اسم الخانة، ويُكتب دائمًا</tspan>
  <tspan x="950" dy="40">بين علامتي تنصيص مزدوجتين، مثل <tspan fill="#c96a1b">"city".</tspan></tspan>
</text>

<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Key:</tspan> the name of the field, always</tspan>
  <tspan x="132" dy="40">written in double quotes, such as <tspan fill="#c96a1b">"city".</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">القيمة Value:</tspan> محتوى الخانة: نص مثل <tspan fill="#c96a1b">"Cairo"،</tspan></tspan>
  <tspan x="950" dy="40">أو رقم مثل <tspan fill="#c96a1b">31،</tspan> أو true/false، أو null،</tspan>
  <tspan x="950" dy="40">أو كائن آخر، أو مصفوفة.</tspan>
</text>

<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Value:</tspan> the field's content: text</tspan>
  <tspan x="132" dy="40">such as <tspan fill="#c96a1b">"Cairo",</tspan> a number such as <tspan fill="#c96a1b">31,</tspan></tspan>
  <tspan x="132" dy="40">true/false, null, another object,</tspan>
  <tspan x="132" dy="40">or an array.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المصفوفة Array:</tspan> قائمة قيم بين قوسين</tspan>
  <tspan x="950" dy="40">مربعين، مثل <tspan fill="#c96a1b">["math", "physics"].</tspan></tspan>
</text>

<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Array:</tspan> a list of values inside square</tspan>
  <tspan x="132" dy="40">brackets, such as <tspan fill="#c96a1b">["math", "physics"].</tspan></tspan>
</text>

<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">النقطتان :</tspan> بين المفتاح والقيمة،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والفاصلة ,</tspan> بين كل زوج والذي يليه.</tspan>
</text>

<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#17457f">colon :</tspan> goes between a key</tspan>
  <tspan x="120" dy="40">and its value, and a <tspan font-weight="bold" fill="#17457f">comma ,</tspan> goes</tspan>
  <tspan x="120" dy="40">between one pair and the next.</tspan>
</text>
</svg>
