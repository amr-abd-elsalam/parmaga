<!-- Text: success card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">تحقق من إجابتك</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">CHECK YOUR ANSWER</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;1 POST، لأنك ترسل بيانات ليعالجها الخادم،</tspan>
  <tspan x="935" dy="40">وHTTPS لتُشفَّر كلمة المرور</tspan>
  <tspan x="935" dy="40">فلا تُعترض بسهولة.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">1 POST, because you send data</tspan>
  <tspan x="140" dy="40">for the server to process, and HTTPS</tspan>
  <tspan x="140" dy="40">so the password is encrypted and</tspan>
  <tspan x="140" dy="40">not easily intercepted.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">2 عند الخادم؛ فعائلة 5xx تعني خطأ في الخادم.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">2 The server's side; the 5xx family</tspan>
  <tspan x="140" dy="40">means a server error.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">3 المفتاح "temperature"، والقيمة 31.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">3 The key is "temperature",</tspan>
  <tspan x="140" dy="40">and the value is 31.</tspan>
</text>

<!-- Text: key sentence strip -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">اتصال الويب محادثة منظمة لها أطراف،</tspan>
  <tspan x="935" dy="40">ولغة، وحماية، وأفعال، ونتائج، وشكل بيانات.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Web communication is an organized</tspan>
  <tspan x="140" dy="40">conversation with talkers, a language,</tspan>
  <tspan x="140" dy="40">protection, verbs, results,</tspan>
  <tspan x="140" dy="40">and a data shape.</tspan>
</text>
</svg>
