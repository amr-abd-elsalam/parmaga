<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">7. من أي نافذة؟</tspan>
  <tspan x="540" dy="48">واجهة برمجة التطبيقات (API)</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">7. Through Which Window? The API</text>

<!-- Arabic paragraph -->
<text x="950" y="294" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">واجهة برمجة</tspan></tspan>
  <tspan x="950" dy="36"><tspan font-weight="bold" fill="#c0392b">التطبيقات</tspan> API (Application Programming Interface):</tspan>
  <tspan x="950" dy="36">عقد أو مجموعة <tspan font-weight="bold" fill="#17457f">قواعد محددة</tspan> تسمح لبرنامج أن يطلب</tspan>
  <tspan x="950" dy="36">بيانات أو خدمات من برنامج آخر، دون أن يعرف</tspan>
  <tspan x="950" dy="36">كيف يعمل من الداخل. وهي تحدد:</tspan>
</text>

<!-- English paragraph -->
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">API</tspan> (Application Programming Interface):</tspan>
  <tspan x="120" dy="36">a contract or set of <tspan font-weight="bold" fill="#17457f">defined rules</tspan> that</tspan>
  <tspan x="120" dy="36">lets one program request data or services</tspan>
  <tspan x="120" dy="36">from another, without knowing how it works</tspan>
  <tspan x="120" dy="36">inside. It defines:</tspan>
</text>

<!-- Bullets -->
<text x="950" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">ما الطلبات</tspan><tspan> المسموحة.</tspan></text>
<text x="132" y="690" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Which requests</tspan><tspan> are allowed.</tspan></text>
<text x="950" y="726" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">بأي شكل</tspan><tspan> تُكتب.</tspan></text>
<text x="132" y="762" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42"><tspan font-weight="bold" fill="#17457f">How</tspan><tspan> they must be written.</tspan></text>
<text x="950" y="798" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">ماذا سيعود</tspan><tspan> في الرد.</tspan></text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42"><tspan font-weight="bold" fill="#17457f">What comes back</tspan><tspan> in the reply.</tspan></text>
</svg>
