<!-- Texts -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">200&#x200E; OK:</tspan> تمت معالجة الطلب بنجاح.</tspan>
</text>

<text x="120"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">200 OK:</tspan> the request was processed</tspan>
  <tspan x="120" dy="40">successfully.</tspan>
</text>

<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">404&#x200E; Not Found:</tspan> المورد المطلوب <tspan font-weight="bold" fill="#17457f">غير موجود</tspan></tspan>
  <tspan x="950" dy="40">بهذا العنوان، مثل عنوان مكتوب خطأ</tspan>
  <tspan x="950" dy="40">أو صفحة محذوفة. والخادم <tspan font-weight="bold" fill="#2e7d32">سليم،</tspan></tspan>
  <tspan x="950" dy="40">وهو الذي ردّ عليك.</tspan>
</text>

<text x="120"
      y="474"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">404 Not Found:</tspan> the requested resource</tspan>
  <tspan x="120" dy="40">is <tspan font-weight="bold" fill="#17457f">not at this URL,</tspan> such as a mistyped</tspan>
  <tspan x="120" dy="40">address or a deleted page. The server is</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">working;</tspan> it is the one that replied.</tspan>
</text>

<text x="950"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">500&#x200E; Internal Server Error:</tspan> خطأ داخل الخادم</tspan>
  <tspan x="950" dy="40">منعه من إكمال الطلب. قد يكون طلبك <tspan font-weight="bold" fill="#2e7d32">سليمًا،</tspan></tspan>
  <tspan x="950" dy="40">والرمز وحده لا يحدد السبب.</tspan>
</text>

<text x="120"
      y="794"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">500 Internal Server Error:</tspan> an error</tspan>
  <tspan x="120" dy="40">inside the server stopped it from</tspan>
  <tspan x="120" dy="40">completing the request.</tspan>
  <tspan x="120" dy="40">Your request may be <tspan font-weight="bold" fill="#2e7d32">fine;</tspan> the code</tspan>
  <tspan x="120" dy="40">alone does not give the cause.</tspan>
</text>
