<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">8. بأي شكل تأتي</tspan>
  <tspan x="540" dy="48">البيانات؟ JSON</tspan>
</text>

<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">8. In What Shape Does Data Come? JSON</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">JSON</tspan> (JavaScript Object Notation): <tspan font-weight="bold" fill="#17457f">صيغة نصية</tspan></tspan>
  <tspan x="950" dy="40">لكتابة البيانات بشكل منظم، يسهل على الإنسان</tspan>
  <tspan x="950" dy="40">قراءتها وعلى الحاسوب معالجتها.</tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">JSON</tspan> (JavaScript Object Notation):</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">text format</tspan> for writing data in</tspan>
  <tspan x="120" dy="40">an organized way that is easy for people</tspan>
  <tspan x="120" dy="40">to read and for computers to process.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميزك</text>

<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">EXTRA INSIGHT</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">رغم أن اسمها فيه JavaScript،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">فـ JSON</tspan> <tspan font-weight="bold" fill="#17457f">ليست لغة برمجة،</tspan></tspan>
  <tspan x="935" dy="40">وتستخدمها لغات كثيرة جدًا.</tspan>
</text>

<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Even though its name contains</tspan>
  <tspan x="140" dy="40">JavaScript, <tspan font-weight="bold" fill="#c0392b">JSON</tspan> is <tspan font-weight="bold" fill="#17457f">not a programming</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">language,</tspan> and many languages use it.</tspan>
</text>
</svg>
