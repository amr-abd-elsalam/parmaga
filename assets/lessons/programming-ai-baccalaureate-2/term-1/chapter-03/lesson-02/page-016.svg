<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">4. هل الكلام سري؟ HTTPS وTLS</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">4. Is the Talk Private? HTTPS and TLS</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> (HTTP Secure)&#x200E;: هو HTTP نفسه،</tspan>
  <tspan x="950" dy="40">بالطلبات والاستجابات نفسها، لكنها تمر</tspan>
  <tspan x="950" dy="40">داخل <tspan font-weight="bold" fill="#17457f">نفق آمن</tspan> يصنعه TLS.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> (HTTP Secure): the same HTTP, with</tspan>
  <tspan x="120" dy="40">the same requests and responses, but they</tspan>
  <tspan x="120" dy="40">pass through a <tspan font-weight="bold" fill="#17457f">secure tunnel</tspan> made by TLS.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">علامته:</tspan> يبدأ العنوان بـ <tspan fill="#c96a1b">https://&#x200E;،</tspan></tspan>
  <tspan x="950" dy="40">وتعرض بعض المتصفحات <tspan font-weight="bold" fill="#2e7d32">رمز قفل.</tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Its sign:</tspan> the address begins with</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">https://,</tspan> and some browsers show a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">padlock icon.</tspan></tspan>
</text>

<!-- Illustration labels (Layout order) -->
<text x="935" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">&#x200F;HTTP: <tspan font-weight="bold" fill="#c0392b">مكشوف</tspan></text>
<text x="750" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">HTTP: <tspan font-weight="bold" fill="#c0392b">open</tspan></text>
<text x="935" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">&#x200F;HTTPS: <tspan font-weight="bold" fill="#2e7d32">نفق آمن</tspan></text>
<text x="580" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">HTTPS: <tspan font-weight="bold" fill="#2e7d32">secure tunnel</tspan></text>
</svg>
