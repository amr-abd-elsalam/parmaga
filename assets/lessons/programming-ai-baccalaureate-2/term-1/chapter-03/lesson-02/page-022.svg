<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">للمعلومة فقط:</tspan> توجد طرق أخرى،</tspan>
  <tspan x="950" dy="40">مثل <tspan fill="#c96a1b">PUT</tspan> للتحديث و<tspan fill="#c96a1b"> DELETE</tspan> للحذف.</tspan>
</text>

<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Just so you know:</tspan> there are other</tspan>
  <tspan x="120" dy="40">methods, such as <tspan fill="#c96a1b">PUT</tspan> to update</tspan>
  <tspan x="120" dy="40">and <tspan fill="#c96a1b">DELETE</tspan> to delete.</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>

<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;«POST آمن لأن بياناته لا تظهر في العنوان»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">خطأ.</tspan> بيانات POST تنتقل <tspan font-weight="bold" fill="#17457f">مكشوفة</tspan> إذا كان</tspan>
  <tspan x="935" dy="40">الاتصال HTTP؛ الحماية تأتي من <tspan font-weight="bold" fill="#2e7d32">HTTPS،</tspan></tspan>
  <tspan x="935" dy="40">لا من الطريقة.</tspan>
</text>

<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">“POST is safe because its data</tspan>
  <tspan x="140" dy="40">is not in the URL” is <tspan font-weight="bold" fill="#c0392b">wrong.</tspan></tspan>
  <tspan x="140" dy="40">POST data travels in <tspan font-weight="bold" fill="#17457f">plain text</tspan> over</tspan>
  <tspan x="140" dy="40">HTTP; protection comes from <tspan font-weight="bold" fill="#2e7d32">HTTPS,</tspan></tspan>
  <tspan x="140" dy="40">not from the method.</tspan>
</text>
</svg>
