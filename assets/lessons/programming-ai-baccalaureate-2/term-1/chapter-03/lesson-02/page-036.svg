<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam Traps</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذه أشهر <tspan font-weight="bold" fill="#17457f">سبعة أخطاء</tspan> يقع فيها الطلاب.</tspan>
  <tspan x="950" dy="40">اعرفها مرة، ولن تقع فيها <tspan font-weight="bold" fill="#2e7d32">أبدًا.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">These are the <tspan font-weight="bold" fill="#17457f">seven</tspan> most common</tspan>
  <tspan x="120" dy="40">student <tspan font-weight="bold" fill="#17457f">mistakes.</tspan> Know them once,</tspan>
  <tspan x="120" dy="40">and you will <tspan font-weight="bold" fill="#2e7d32">never</tspan> fall for them.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;1 «POST آمن لأنه لا يظهر في العنوان»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> الحماية تأتي من <tspan font-weight="bold" fill="#2e7d32">HTTPS،</tspan> لا من الطريقة.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">1 “POST is safe because it is not</tspan>
  <tspan x="140" dy="40">in the URL” is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> protection</tspan>
  <tspan x="140" dy="40">comes from <tspan font-weight="bold" fill="#2e7d32">HTTPS,</tspan> not the method.</tspan>
</text>
