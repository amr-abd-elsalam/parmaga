<!-- Text: card 1 -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;5 «API برنامج أو لغة» <tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> هي <tspan font-weight="bold" fill="#17457f">واجهة،</tspan></tspan>
  <tspan x="935" dy="40">أي مجموعة <tspan font-weight="bold" fill="#17457f">قواعد</tspan> للتواصل بين البرامج.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">5 “An API is a program or a language”</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> it is an <tspan font-weight="bold" fill="#17457f">interface,</tspan> a set</tspan>
  <tspan x="140" dy="40">of <tspan font-weight="bold" fill="#17457f">rules</tspan> for programs to communicate.</tspan>
</text>

<!-- Text: card 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;6 «العميل هو الإنسان المستخدم»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> العميل هو <tspan font-weight="bold" fill="#17457f">البرنامج،</tspan></tspan>
  <tspan x="935" dy="40">أي المتصفح أو التطبيق.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">6 “The client is the human user”</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> the client is the <tspan font-weight="bold" fill="#17457f">program,</tspan></tspan>
  <tspan x="140" dy="40">the browser or app.</tspan>
</text>

<!-- Text: card 3 -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;7 «GET لإرسال البيانات»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> GET <tspan font-weight="bold" fill="#17457f">لطلب</tspan> البيانات،</tspan>
  <tspan x="935" dy="40">وPOST <tspan font-weight="bold" fill="#17457f">لإرسالها</tspan> لتُعالج.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">7 “GET is for sending data”</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> GET <tspan font-weight="bold" fill="#17457f">requests</tspan> data,</tspan>
  <tspan x="140" dy="40">and POST <tspan font-weight="bold" fill="#17457f">sends</tspan> data to be processed.</tspan>
</text>
