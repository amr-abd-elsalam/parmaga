<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والعميل هو <tspan font-weight="bold" fill="#17457f">البرنامج</tspan> (المتصفح أو التطبيق)،</tspan>
  <tspan x="950" dy="40">لا الإنسان الذي يستخدمه.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The client is the <tspan font-weight="bold" fill="#17457f">program</tspan> (the browser</tspan>
  <tspan x="120" dy="40">or app), not the person using it.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">شخصيات أخرى في القصة</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Other characters in the story</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المتصفح Browser:</tspan> برنامج عميل يطلب صفحات</tspan>
  <tspan x="950" dy="40">الويب ويعرضها لك.</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Browser:</tspan> a client program that requests</tspan>
  <tspan x="132" dy="40">web pages and displays them for you.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">خادم الويب Web server:</tspan> يستقبل طلبات <tspan fill="#c96a1b">HTTP</tspan></tspan>
  <tspan x="950" dy="40">ويرسل الصفحات والملفات.</tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Web server:</tspan> receives <tspan fill="#c96a1b">HTTP</tspan> requests and</tspan>
  <tspan x="132" dy="40">sends pages and files.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">خادم التطبيقات App server:</tspan> يشغّل منطق</tspan>
  <tspan x="950" dy="40">التطبيق، مثل التحقق من <tspan fill="#c96a1b">كلمة المرور.</tspan></tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">App server:</tspan> runs the application's</tspan>
  <tspan x="132" dy="40">logic, such as checking a <tspan fill="#c96a1b">password.</tspan></tspan>
</text>
</svg>
