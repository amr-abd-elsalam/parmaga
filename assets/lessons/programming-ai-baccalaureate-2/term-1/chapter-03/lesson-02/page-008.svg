<!-- Texts: success card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">للتذكر:</tspan> العميل هو اللي <tspan font-weight="bold" fill="#17457f">بيبدأ</tspan> الكلام،</tspan>
  <tspan x="935" dy="40">والخادم عمره ما بيبدأ؛ دايمًا بيستنى ويرد.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">To remember:</tspan> the client</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">starts</tspan> the talk; the server never</tspan>
  <tspan x="140" dy="40">starts, it always waits and replies.</tspan>
</text>

<!-- Texts: info card -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميزك</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">EXTRA INSIGHT</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">«العميل»</tspan> <tspan font-weight="bold" fill="#17457f">اسم دور،</tspan> لا نوع جهاز.</tspan>
  <tspan x="935" dy="40">فالجهاز نفسه قد يكون عميلًا في موقف،</tspan>
  <tspan x="935" dy="40">وخادمًا في موقف آخر.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">“Client”</tspan> is <tspan font-weight="bold" fill="#17457f">a role,</tspan> not a type</tspan>
  <tspan x="140" dy="40">of device. The same device can be</tspan>
  <tspan x="140" dy="40">a client in one case and a server</tspan>
  <tspan x="140" dy="40">in another.</tspan>
</text>

<!-- Illustration labels -->
<text x="495" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">عميل هنا</text>
<text x="300" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Client here</text>
<text x="780" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">خادم هنا</text>
<text x="585" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Server here</text>
