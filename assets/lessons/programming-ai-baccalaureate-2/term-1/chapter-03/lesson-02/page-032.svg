<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">3 يحتوي الطلب على الطريقة <tspan font-weight="bold" fill="#17457f">GET،</tspan> لأن المطلوب</tspan>
  <tspan x="950" dy="40">استرجاع صفحة، ومعها <tspan font-weight="bold" fill="#c0392b">عنوان المورد.</tspan></tspan>
</text>

<text x="120"
      y="234"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">3 The request carries the <tspan font-weight="bold" fill="#17457f">GET</tspan> method,</tspan>
  <tspan x="120" dy="40">since a page is wanted,</tspan>
  <tspan x="120" dy="40">plus the <tspan font-weight="bold" fill="#c0392b">resource's URL.</tspan></tspan>
</text>

<text x="950"
      y="394"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">4 يستقبل <tspan font-weight="bold" fill="#c0392b">الخادم</tspan> الطلب، <tspan font-weight="bold" fill="#17457f">ويعالجه،</tspan></tspan>
  <tspan x="950" dy="40">ويبحث عن الصفحة.</tspan>
</text>

<text x="120"
      y="474"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">4 The <tspan font-weight="bold" fill="#c0392b">server</tspan> receives the request,</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">processes</tspan> it, and looks for the page.</tspan>
</text>

<text x="950"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">5 يعيد الخادم استجابة تحتوي على محتوى</tspan>
  <tspan x="950" dy="40">الصفحة، مثل <tspan fill="#c96a1b">HTML.</tspan></tspan>
</text>

<text x="120"
      y="674"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">5 The server returns a response containing</tspan>
  <tspan x="120" dy="40">the page content, such as <tspan fill="#c96a1b">HTML.</tspan></tspan>
</text>

<text x="950"
      y="794"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">6 تحمل الاستجابة <tspan font-weight="bold" fill="#c0392b">رمز حالة:</tspan> <tspan font-weight="bold" fill="#2e7d32">200</tspan> إذا نجح</tspan>
  <tspan x="950" dy="40">الطلب، أو <tspan fill="#c96a1b">404</tspan> إذا لم يوجد المورد.</tspan>
  <tspan x="950" dy="40">ثم يعرض المتصفح الصفحة.</tspan>
</text>

<text x="120"
      y="914"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">6 The response carries a <tspan font-weight="bold" fill="#c0392b">status code:</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">200</tspan> for success or <tspan fill="#c96a1b">404</tspan> for not found.</tspan>
  <tspan x="120" dy="40">Then the browser shows the page.</tspan>
</text>

<text x="935"
      y="1074"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">لتميّز إجابتك: لو الاتصال <tspan font-weight="bold" fill="#c0392b">HTTPS،</tspan></tspan>
  <tspan x="935" dy="40">تنتقل الرسائل <tspan font-weight="bold" fill="#17457f">مشفرة</tspan> عبر TLS.</tspan>
</text>

<text x="140"
      y="1154"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">To stand out: if the connection</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">HTTPS,</tspan> the messages travel</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">encrypted</tspan> through TLS.</tspan>
</text>
</svg>
