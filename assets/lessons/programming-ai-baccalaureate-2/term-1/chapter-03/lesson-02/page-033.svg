<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">حيل التذكر</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Memory Tricks</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">GET</tspan> = «جيب»: يعني هات حاجة. <tspan font-weight="bold" fill="#c0392b">POST</tspan> = «بوسطة»:</tspan>
  <tspan x="950" dy="40">يعني ابعت حاجة.</tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">GET</tspan> = “bring”: get me something.</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">POST</tspan> = “post”: send something,</tspan>
  <tspan x="120" dy="40">like mail.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">حرف S في <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> = <tspan font-weight="bold" fill="#17457f">Secure</tspan> = سرّ.</tspan>
  <tspan x="950" dy="40">«حرف S بيقفل الظرف».</tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The S in <tspan font-weight="bold" fill="#c0392b">HTTPS</tspan> = <tspan font-weight="bold" fill="#17457f">Secure.</tspan></tspan>
  <tspan x="120" dy="40">“The S seals the envelope.”</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأرقام:</tspan> «2 تمام، 4 غلطتك، 5 غلطتي».</tspan>
  <tspan x="950" dy="40">والمتكلم هنا هو <tspan font-weight="bold" fill="#17457f">الخادم.</tspan></tspan>
</text>

<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">codes:</tspan> “2 all good,</tspan>
  <tspan x="120" dy="40">4 your mistake, 5 my mistake”;</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">server</tspan> is the one speaking.</tspan>
</text>
</svg>
