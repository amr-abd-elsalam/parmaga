      <stop offset="0" stop-color="#8fc9f2"/>
      <stop offset="1" stop-color="#2f7fb5"/>
    </linearGradient>
  </defs>
  <ellipse cx="540" cy="640" rx="351" ry="116" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
