    <circle cx="-4" cy="4" r="7" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Station 3 (bottom left): server tower -->
  <g transform="translate(371 729)">
    <circle r="50" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle r="45" fill="none" stroke="#17457f" stroke-width="3"/>
