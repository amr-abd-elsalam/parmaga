</g>

<!-- Icon: pencil -->
<g transform="translate(860 420)">
  <path d="M 12 40 L 36 16 L 44 24 L 20 48 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
