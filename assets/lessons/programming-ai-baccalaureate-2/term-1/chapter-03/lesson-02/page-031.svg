  <circle cx="616" cy="621" r="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(412 640)">
    <path d="M -26 8 Q -30 -4 -18 -6 Q -14 -18 0 -14 Q 10 -22 18 -10 Q 30 -8 26 8 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
