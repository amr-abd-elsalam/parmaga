    <path d="M -23 -24 L -29 -28 M 23 -24 L 29 -28" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Station 5 (top left): round check-mark badge -->
  <g transform="translate(371 551)">
    <circle r="50" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle r="45" fill="none" stroke="#2e7d32" stroke-width="3"/>
    <polygon points="32,0 26.1,7 27.7,16 19.1,19.1 16,27.7 7,26.1 0,32 -7,26.1 -16,27.7 -19.1,19.1 -27.7,16 -26.1,7 -32,0 -26.1,-7 -27.7,-16 -19.1,-19.1 -16,-27.7 -7,-26.1 0,-32 7,-26.1 16,-27.7 19.1,-19.1 27.7,-16 26.1,-7" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle r="23" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <polygon points="-12,0 -7,-5 -3,-1 8,-12 13,-7 -3,9" fill="#ffffff" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Station 6 (top right): the same laptop showing a full page -->
  <g transform="translate(709 551)">
    <circle r="50" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle r="45" fill="none" stroke="#2f7fb5" stroke-width="3"/>
    <rect x="-30" y="-28" width="60" height="38" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-26" y="-24" width="52" height="30" rx="2" fill="#ffffff"/>
    <rect x="-26" y="-24" width="52" height="6" rx="2" fill="#2f7fb5"/>
    <rect x="-22" y="-15" width="15" height="13" rx="2" fill="#a9dcbe"/>
    <polygon points="-22,-2 -16,-9 -11,-4 -7,-8 -7,-2" fill="#2e7d32"/>
    <path d="M -3 -13 L 21 -13 M -3 -8 L 21 -8 M -3 -3 L 14 -3" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
    <rect x="-22" y="1" width="44" height="3" fill="#f0c48c"/>
    <path d="M -34 10 L 34 10 L 37 16 L -37 16 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Direction arrows along the loop (clockwise) -->
  <g transform="translate(832.7 691.5) rotate(152.2)">
    <path d="M -12 0 L 5 0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
