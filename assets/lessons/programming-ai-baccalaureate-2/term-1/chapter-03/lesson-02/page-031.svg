<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">رحلة نقرة واحدة</text>

<text x="540"
      y="154"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">The Journey of One Click</text>

<text x="950"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">كل ما تعلمته يحدث في أقل من ثانية.</tspan>
  <tspan x="950" dy="40">تابع الرحلة؛ فهي نفسها إجابة سؤال</tspan>
  <tspan x="950" dy="40">«اشرح خطوة بخطوة»، وكل <tspan font-weight="bold" fill="#17457f">خطوة درجة.</tspan></tspan>
</text>

<text x="120"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">All you learned happens in under a second.</tspan>
  <tspan x="120" dy="40">Follow the journey; it is your answer to</tspan>
  <tspan x="120" dy="40">“explain step by step,”</tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">each step is one mark.</tspan></tspan>
</text>

<text x="950"
      y="834"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">المتصفح</tspan> هو <tspan font-weight="bold" fill="#17457f">العميل،</tspan> ويبدأ الاتصال</tspan>
  <tspan x="950" dy="40">حين تكتب العنوان أو تنقر رابطًا.</tspan>
</text>

<text x="120"
      y="914"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">1 The <tspan font-weight="bold" fill="#c0392b">browser</tspan> is the <tspan font-weight="bold" fill="#17457f">client;</tspan></tspan>
  <tspan x="120" dy="40">it starts the communication when you</tspan>
  <tspan x="120" dy="40">type an address or click a link.</tspan>
</text>

<text x="950"
      y="1074"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">2 يرسل العميل <tspan font-weight="bold" fill="#17457f">طلب HTTP</tspan> إلى الخادم عبر الشبكة.</tspan>
</text>

<text x="120"
      y="1114"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">2 The client sends an <tspan font-weight="bold" fill="#17457f">HTTP request</tspan></tspan>
  <tspan x="120" dy="40">to the server across the network.</tspan>
</text>
</svg>
