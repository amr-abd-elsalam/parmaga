    <polygon points="3,-6 13,0 3,6" fill="#c0392b"/>
  </g>
  <g transform="translate(247.3 588.5) rotate(-27.8)">
    <path d="M -12 0 L 5 0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="3,-6 13,0 3,6" fill="#c0392b"/>
  </g>
  <g transform="translate(540 537)">
    <path d="M -12 0 L 5 0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="3,-6 13,0 3,6" fill="#c0392b"/>
  </g>
  <g transform="translate(832.7 588.5) rotate(27.8)">
    <path d="M -12 0 L 5 0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="3,-6 13,0 3,6" fill="#c0392b"/>
  </g>
</g>

