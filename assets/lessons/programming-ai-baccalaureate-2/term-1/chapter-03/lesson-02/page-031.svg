    <polygon points="-6,-15 -6,-3 -3,-6 0,-1 3,-2 0,-7 4,-8" fill="#ffffff" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -34 6 L 26 6 L 30 13 L -38 13 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
