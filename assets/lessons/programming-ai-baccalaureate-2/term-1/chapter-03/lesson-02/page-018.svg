<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التشفير Encryption:</tspan> تحويل البيانات إلى</tspan>
  <tspan x="950" dy="40">صورة غير مفهومة، لا يعيدها إلى أصلها</tspan>
  <tspan x="950" dy="40">إلا من يملك <tspan font-weight="bold" fill="#17457f">المفتاح.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Encryption:</tspan> turning data into</tspan>
  <tspan x="120" dy="40">an unreadable form that only someone</tspan>
  <tspan x="120" dy="40">with <tspan font-weight="bold" fill="#17457f">the key</tspan> can turn back.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المتجسس Eavesdropper:</tspan> أي طرف في الطريق</tspan>
  <tspan x="950" dy="40">يحاول قراءة الرسائل أو تعديلها،</tspan>
  <tspan x="950" dy="40">مثل شبكة <tspan fill="#c96a1b">Wi-Fi</tspan> عامة غير آمنة.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Eavesdropper:</tspan> any party on the way that</tspan>
  <tspan x="120" dy="40">tries to read or change the messages,</tspan>
  <tspan x="120" dy="40">such as an unsafe public <tspan fill="#c96a1b">Wi-Fi</tspan> network.</tspan>
</text>

<!-- Info card texts -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميزك</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">EXTRA INSIGHT</text>
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">SSL</tspan> اسم قديم لبروتوكول سبق TLS</tspan>
  <tspan x="935" dy="40">وأُلغي لثغراته. الناس ما زالوا يقولون</tspan>
  <tspan x="935" dy="40">«شهادة SSL»، لكن <tspan font-weight="bold" fill="#2e7d32">الصحيح اليوم TLS.</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">SSL</tspan> is an old protocol before TLS,</tspan>
  <tspan x="140" dy="40">retired for its weaknesses.</tspan>
  <tspan x="140" dy="40">People still say “SSL certificate,”</tspan>
  <tspan x="140" dy="40">but <tspan font-weight="bold" fill="#2e7d32">today it is TLS.</tspan></tspan>
</text>
</svg>
