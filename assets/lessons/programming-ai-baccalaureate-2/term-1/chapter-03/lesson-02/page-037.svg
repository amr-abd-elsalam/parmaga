<!-- Text: card 1 -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;2 «404 معناها أن الخادم معطل» <tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan></tspan>
  <tspan x="935" dy="40">الخادم <tspan font-weight="bold" fill="#2e7d32">يعمل</tspan> وهو الذي ردّ عليك،</tspan>
  <tspan x="935" dy="40">والمشكلة في <tspan font-weight="bold" fill="#17457f">الطلب.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">2 “404 means the server is down”</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> the server is <tspan font-weight="bold" fill="#2e7d32">working</tspan> and</tspan>
  <tspan x="140" dy="40">replied to you; the problem is</tspan>
  <tspan x="140" dy="40">in the <tspan font-weight="bold" fill="#17457f">request.</tspan></tspan>
</text>

<!-- Text: card 2 -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;3 «HTTPS بروتوكول مختلف تمامًا عن HTTP»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan> هو <tspan font-weight="bold" fill="#17457f">HTTP نفسه</tspan> عبر اتصال TLS <tspan font-weight="bold" fill="#2e7d32">آمن.</tspan></tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">3 “HTTPS is a completely different</tspan>
  <tspan x="140" dy="40">protocol from HTTP” is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan></tspan>
  <tspan x="140" dy="40">it is the <tspan font-weight="bold" fill="#17457f">same HTTP</tspan> over a <tspan font-weight="bold" fill="#2e7d32">secure</tspan></tspan>
  <tspan x="140" dy="40">TLS connection.</tspan>
</text>

<!-- Text: card 3 -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;4 «JSON لغة برمجة» <tspan font-weight="bold" fill="#c0392b">خطأ؛</tspan></tspan>
  <tspan x="935" dy="40">هي <tspan font-weight="bold" fill="#17457f">صيغة</tspan> بيانات نصية.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">4 “JSON is a programming language”</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#c0392b">wrong;</tspan> it is a text data <tspan font-weight="bold" fill="#17457f">format.</tspan></tspan>
</text>
</svg>
