<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الاستجابة Response: رسالة</tspan>
  <tspan x="950" dy="40">من الخادم ردًا على الطلب</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Response: the server's message</tspan>
  <tspan x="120" dy="40">replying to a request</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">رمز الحالة:</tspan> نتيجة الطلب، مثل 200.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The <tspan font-weight="bold" fill="#c0392b">status code:</tspan> the result,</tspan>
  <tspan x="132" dy="40">such as 200.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الرؤوس:</tspan> معلومات إضافية عن الاستجابة.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Headers:</tspan> extra information</tspan>
  <tspan x="132" dy="40">about the response.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الجسم</tspan> غالبًا: المحتوى المطلوب،</tspan>
  <tspan x="950" dy="40">مثل صفحة HTML أو صورة أو بيانات JSON.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Usually a <tspan font-weight="bold" fill="#c0392b">body:</tspan> the requested</tspan>
  <tspan x="132" dy="40">content, such as an HTML page,</tspan>
  <tspan x="132" dy="40">an image, or JSON data.</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">القاعدة الذهبية</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Golden Rule</tspan>
</text>
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لكل طلب استجابة <tspan font-weight="bold" fill="#17457f">واحدة</tspan> تقابله.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Every request gets <tspan font-weight="bold" fill="#17457f">one</tspan></tspan>
  <tspan x="140" dy="40">matching response.</tspan>
</text>
</svg>
