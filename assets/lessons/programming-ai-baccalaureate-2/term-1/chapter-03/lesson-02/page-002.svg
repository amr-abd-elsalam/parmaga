<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الفكرة الكبرى</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Big Idea</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">سؤال سريع:</tspan> بتكتب اسم موقع وتدوس <tspan fill="#c96a1b">Enter.</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">الصفحة</tspan> كانت فين؟</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Quick question:</tspan> you type a site name</tspan>
  <tspan x="120" dy="40">and press <tspan fill="#c96a1b">Enter.</tspan> Where was the <tspan font-weight="bold" fill="#c0392b">page?</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لم تكن على جهازك، بل على <tspan font-weight="bold" fill="#17457f">جهاز بعيد،</tspan></tspan>
  <tspan x="950" dy="40">وجهازك <tspan font-weight="bold" fill="#c0392b">طلبها.</tspan></tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It was not on your device.</tspan>
  <tspan x="120" dy="40">It was on a <tspan font-weight="bold" fill="#17457f">distant computer,</tspan></tspan>
  <tspan x="120" dy="40">and your device <tspan font-weight="bold" fill="#c0392b">asked</tspan> for it.</tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الويب محادثة منظمة: طرف يسأل،</tspan>
  <tspan x="935" dy="40">وطرف يجيب، بلغة متفق عليها.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The web is an organized conversation:</tspan>
  <tspan x="140" dy="40">one side asks, one side answers,</tspan>
  <tspan x="140" dy="40">in an agreed language.</tspan>
</text>
</svg>
