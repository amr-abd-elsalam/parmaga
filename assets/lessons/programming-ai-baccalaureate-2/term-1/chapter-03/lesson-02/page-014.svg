<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">3. لغة المحادثة: HTTP</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">3. The Language: HTTP</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البروتوكول</tspan> Protocol: مجموعة <tspan font-weight="bold" fill="#17457f">قواعد متفق عليها</tspan></tspan>
  <tspan x="950" dy="40">تحدد شكل الرسائل وترتيبها، وكيف يفهمها كل طرف.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Protocol:</tspan> a set of <tspan font-weight="bold" fill="#17457f">agreed rules</tspan> that sets</tspan>
  <tspan x="120" dy="40">the form and order of messages and how</tspan>
  <tspan x="120" dy="40">each side understands them.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">من غير <tspan font-weight="bold" fill="#17457f">بروتوكول مشترك،</tspan> يبقى الطرفان</tspan>
  <tspan x="950" dy="40">مثل شخصين يتكلمان لغتين مختلفتين.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Without a <tspan font-weight="bold" fill="#17457f">shared protocol,</tspan> the two</tspan>
  <tspan x="120" dy="40">sides are like two people speaking</tspan>
  <tspan x="120" dy="40">different languages.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">النص التشعبي</tspan> Hypertext: نص فيه <tspan font-weight="bold" fill="#17457f">روابط</tspan> تنقلك</tspan>
  <tspan x="950" dy="40">إلى نصوص أخرى، ومنه جاء اسم HTTP.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Hypertext:</tspan> text with <tspan font-weight="bold" fill="#17457f">links</tspan> that take you</tspan>
  <tspan x="120" dy="40">to other texts; HTTP gets its name from it.</tspan>
</text>
</svg>
