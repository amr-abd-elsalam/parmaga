<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">404:</tspan> «الشقة رقم 404 مش موجودة في العمارة.</tspan>
  <tspan x="950" dy="40">العمارة <tspan font-weight="bold" fill="#2e7d32">سليمة،</tspan> بس <tspan font-weight="bold" fill="#17457f">العنوان</tspan> اللي طلبته غلط».</tspan>
</text>

<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">404:</tspan> “Flat 404 is not in the building.</tspan>
  <tspan x="120" dy="40">The building is <tspan font-weight="bold" fill="#2e7d32">fine;</tspan> the <tspan font-weight="bold" fill="#17457f">address</tspan></tspan>
  <tspan x="120" dy="40">you asked for is wrong.”</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">500:</tspan> «المطبخ فيه <tspan font-weight="bold" fill="#17457f">عطل.</tspan></tspan>
  <tspan x="950" dy="40">طلبك <tspan font-weight="bold" fill="#2e7d32">سليم،</tspan> بس المطبخ مش قادر يطبخ».</tspan>
</text>

<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">500:</tspan> “The kitchen has <tspan font-weight="bold" fill="#17457f">broken down.</tspan></tspan>
  <tspan x="120" dy="40">Your order is <tspan font-weight="bold" fill="#2e7d32">fine,</tspan> but the kitchen</tspan>
  <tspan x="120" dy="40">can't cook.”</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الـ <tspan font-weight="bold" fill="#c0392b">API</tspan> هو <tspan font-weight="bold" fill="#17457f">الجرسون،</tspan></tspan>
  <tspan x="950" dy="40">والـ <tspan font-weight="bold" fill="#c0392b">JSON</tspan> ورقة الأوردر المرتبة:</tspan>
  <tspan x="950" dy="40">«خانة: والمكتوب فيها».</tspan>
</text>

<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">API</tspan> is the <tspan font-weight="bold" fill="#17457f">waiter,</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#c0392b">JSON</tspan> is the neat order slip:</tspan>
  <tspan x="120" dy="40">“field: what's written in it.”</tspan>
</text>
</svg>
