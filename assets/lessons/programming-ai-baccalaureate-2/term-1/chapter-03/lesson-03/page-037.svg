<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">كيف تأخذ الدرجة كاملة؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">How to Get Full Marks</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">سؤال على نمط الامتحان</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM-STYLE QUESTION</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشرح كيف تساهم كل من <tspan font-weight="bold" fill="#c0392b">HTML و CSS و JavaScript</tspan></tspan>
  <tspan x="935" dy="40">في صفحة مكتبة تعرض قائمة كتب، وتكون</tspan>
  <tspan x="935" dy="40">منسّقة، وتُصفّي النتائج أثناء كتابة</tspan>
  <tspan x="935" dy="40">المستخدم. <tspan font-weight="bold" fill="#17457f">[6 درجات]</tspan></tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Explain how <tspan font-weight="bold" fill="#c0392b">HTML, CSS, and JavaScript</tspan></tspan>
  <tspan x="140" dy="40">each contribute to a library page that</tspan>
  <tspan x="140" dy="40">lists books, is styled, and filters the</tspan>
  <tspan x="140" dy="40">results as the user types. <tspan font-weight="bold" fill="#17457f">[6 marks]</tspan></tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">القاعدة الذهبية:</tspan> مصطلح الكتاب +</tspan>
  <tspan x="935" dy="40">مثال من السؤال = <tspan font-weight="bold" fill="#2e7d32">الدرجة كاملة.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Golden rule:</tspan> textbook term + example</tspan>
  <tspan x="140" dy="40">from the question = <tspan font-weight="bold" fill="#2e7d32">full marks.</tspan></tspan>
</text>

<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">درجتان لكل تقنية: <tspan font-weight="bold" fill="#c0392b">دورها،</tspan></tspan>
  <tspan x="950" dy="40">ثم <tspan fill="#c96a1b">مثال</tspan> عليه من السؤال.</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Two marks per technology: its <tspan font-weight="bold" fill="#c0392b">role,</tspan></tspan>
  <tspan x="120" dy="40">then an <tspan fill="#c96a1b">example</tspan> from the question.</tspan>
</text>
</svg>
