<!-- Trap 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">× إطار العمل لغة لتحديد بنية الصفحة.</tspan>
  <tspan x="950" dy="40">← هذه HTML؛ الإطار بنية جاهزة للتطوير.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× A framework is a language</tspan>
  <tspan x="120" dy="40">for defining page structure.</tspan>
  <tspan x="120" dy="40">→ That is HTML; a framework is a ready</tspan>
  <tspan x="120" dy="40">structure for development.</tspan>
</text>

<!-- Trap 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">× لا بد أن تستخدم كل صفحة التقنيات الثلاث.</tspan>
  <tspan x="950" dy="40">&#x200F;← HTML وحده يكفي لصفحة بسيطة.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× Every page must use</tspan>
  <tspan x="120" dy="40">all three technologies.</tspan>
  <tspan x="120" dy="40">→ HTML alone is enough for a simple page.</tspan>
</text>

<!-- Trap 3 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;× HTML لغة برمجة.</tspan>
  <tspan x="950" dy="40">&#x200F;← HTML لغة ترميز.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× HTML is a programming language.</tspan>
  <tspan x="120" dy="40">→ HTML is a markup language.</tspan>
</text>

<!-- Trap 4 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;○ Next.js مبني على React.</tspan>
  <tspan x="950" dy="40">← إطار عمل فوق مكتبة React.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">○ Next.js is built on React.</tspan>
  <tspan x="120" dy="40">→ A framework on top of the React library.</tspan>
</text>

<!-- Trap 5 -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">○ قد تبدو الصفحة الدلالية</tspan>
  <tspan x="950" dy="40">وغير الدلالية متطابقتين.</tspan>
  <tspan x="950" dy="40">← الفرق في المعنى لا في الشكل.</tspan>
</text>
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">○ A semantic page and a non-semantic</tspan>
  <tspan x="120" dy="40">page may look identical.</tspan>
  <tspan x="120" dy="40">→ The difference is in meaning, not looks.</tspan>
</text>
</svg>
