<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">جرّب بنفسك</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Try It Yourself</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">افتح أي موقع على الكمبيوتر،</tspan>
  <tspan x="950" dy="40">ثم <tspan font-weight="bold" fill="#17457f">صغّر عرض النافذة</tspan> تدريجيًا.</tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Open any website on a computer,</tspan>
  <tspan x="132" dy="40">then slowly <tspan font-weight="bold" fill="#17457f">make the window narrower.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أو اضغط <tspan fill="#c96a1b">F12</tspan> لفتح أدوات المطور،</tspan>
  <tspan x="950" dy="40">ثم <tspan fill="#c96a1b">Ctrl+Shift+M</tspan> لتجربة مقاسات الهواتف.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Or press <tspan fill="#c96a1b">F12</tspan> to open developer tools,</tspan>
  <tspan x="132" dy="40">then <tspan fill="#c96a1b">Ctrl+Shift+M</tspan> to try phone sizes.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">راقب: تتحول <tspan font-weight="bold" fill="#17457f">الأعمدة الثلاثة</tspan></tspan>
  <tspan x="950" dy="40">إلى عمودين ثم عمود واحد.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Watch: <tspan font-weight="bold" fill="#17457f">three columns</tspan></tspan>
  <tspan x="132" dy="40">turn into two, then one.</tspan>
</text>

<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل تغيّر الموقع؟ لا، الصفحة نفسها،</tspan>
  <tspan x="950" dy="40">لكن <tspan font-weight="bold" fill="#c0392b">التخطيط Layout</tspan> هو الذي <tspan font-weight="bold" fill="#2e7d32">تكيّف.</tspan></tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Did the site change?</tspan>
  <tspan x="120" dy="40">No, it is the same page,</tspan>
  <tspan x="120" dy="40">but the <tspan font-weight="bold" fill="#c0392b">layout</tspan> <tspan font-weight="bold" fill="#2e7d32">adapted.</tspan></tspan>
</text>
</svg>
