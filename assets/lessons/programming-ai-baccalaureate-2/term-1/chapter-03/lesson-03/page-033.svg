  <path d="M 350 1184 L 386 1184" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M 420 1062 L 425 1075 L 438 1080 L 425 1085 L 420 1098 L 415 1085 L 402 1080 L 415 1075 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- laptop -->
  <rect x="450" y="1080" width="180" height="122" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="460" y="1090" width="160" height="102" rx="4" fill="url(#ilScreen)"/>
  <rect x="470" y="1098" width="140" height="12" rx="3" fill="#2f7fb5"/>
  <rect x="470" y="1118" width="56" height="40" rx="4" fill="#f0c48c"/>
  <path d="M 474 1154 L 490 1134 L 502 1146 L 510 1138 L 522 1154 Z" fill="#2e7d32"/>
  <circle cx="514" cy="1127" r="4" fill="#ffd24a"/>
  <rect x="536" y="1120" width="74" height="6" rx="3" fill="#ffffff"/>
  <rect x="536" y="1132" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="536" y="1144" width="70" height="6" rx="3" fill="#ffffff"/>
  <rect x="470" y="1166" width="48" height="16" rx="6" fill="#2e7d32"/>
  <rect x="528" y="1166" width="82" height="16" rx="6" fill="#ffffff"/>
  <polygon points="430,1202 650,1202 672,1218 408,1218" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 520 1211 L 560 1211" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <!-- books -->
  <rect x="680" y="1196" width="92" height="22" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="688" y="1174" width="78" height="22" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="684" y="1152" width="84" height="22" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 694 1200 L 694 1214 M 702 1178 L 702 1192 M 698 1156 L 698 1170" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- thought bubbles and cloud -->
  <circle cx="648" cy="1132" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="666" cy="1116" r="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 696 1110 Q 676 1110 680 1092 Q 676 1070 700 1068 Q 708 1048 732 1052 Q 754 1044 766 1064 Q 788 1066 784 1088 Q 790 1110 766 1110 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
