  <rect x="290" y="1218" width="500" height="18" rx="6" fill="url(#ilDesk)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- plant -->
  <path d="M 317 1182 Q 296 1168 302 1142 Q 318 1158 317 1182 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 317 1182 Q 340 1166 336 1140 Q 318 1156 317 1182 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 317 1182 Q 312 1150 318 1128 Q 326 1152 317 1182 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="298,1182 336,1182 331,1218 303,1218" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- pencils and cup -->
  <rect x="352" y="1124" width="9" height="44" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="352,1124 361,1124 356.5,1112" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="364" y="1116" width="9" height="50" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="364,1116 373,1116 368.5,1104" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="376" y="1130" width="9" height="36" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="376,1130 385,1130 380.5,1118" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
