    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
  <!-- shadows -->
  <rect x="294" y="1224" width="500" height="18" rx="6" fill="#22303f" opacity=".18"/>
