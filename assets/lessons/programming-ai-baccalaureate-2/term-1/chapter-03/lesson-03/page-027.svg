<!-- Text -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المكوّن Component:</tspan> جزء مستقل من الواجهة يمكن</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">إعادة استخدامه،</tspan> مثل زر أو بطاقة أو قائمة.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Component:</tspan> an independent part of the</tspan>
  <tspan x="120" dy="40">interface that can be <tspan font-weight="bold" fill="#17457f">reused,</tspan> such as a</tspan>
  <tspan x="120" dy="40">button, a card, or a menu.</tspan>
</text>
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثل <tspan fill="#c96a1b">قالب الكحك:</tspan> تصمم <tspan font-weight="bold" fill="#17457f">«بطاقة منتج»</tspan> مرة واحدة،</tspan>
  <tspan x="950" dy="40">ثم تستخدمها مئة مرة ببيانات مختلفة.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Like a <tspan fill="#c96a1b">cookie mold:</tspan> design a</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">“product card”</tspan> once, then use it</tspan>
  <tspan x="120" dy="40">a hundred times with different data.</tspan>
</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">السحر هنا</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">HERE'S THE MAGIC</tspan>
</text>
<text x="935" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">عدّل البطاقة <tspan font-weight="bold" fill="#17457f">مرة واحدة،</tspan> فتتغير المئة كلها.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Edit the card <tspan font-weight="bold" fill="#17457f">once,</tspan></tspan>
  <tspan x="140" dy="40">and all hundred change.</tspan>
</text>
</svg>
