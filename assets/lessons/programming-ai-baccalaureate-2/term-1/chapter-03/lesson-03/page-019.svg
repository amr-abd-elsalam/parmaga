<!-- Illustration labels (Layout order) -->
<text x="930" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">إمكانية الوصول</text>
<text x="708" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Accessibility</text>
<text x="250" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">SEO</text>
<text x="190" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">SEO</text>

<!-- Bullet 1 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">قارئ الشاشة:</tspan> يقول له المستخدم</tspan>
  <tspan x="950" dy="40">«انتقل إلى المحتوى الرئيسي» فيقفز إلى &lt;main&gt;.</tspan>
  <tspan x="950" dy="40">هذه <tspan font-weight="bold" fill="#17457f">إمكانية الوصول</tspan> Accessibility.</tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Screen reader:</tspan> the user says</tspan>
  <tspan x="132" dy="40">“go to main content” and it jumps to</tspan>
  <tspan x="132" dy="40">&lt;main&gt;. This is <tspan font-weight="bold" fill="#17457f">accessibility</tspan>.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">محرك البحث:</tspan> أمين مكتبة آلي</tspan>
  <tspan x="950" dy="40">يقرأ الصفحات ويرتبها في فهرسه،</tspan>
  <tspan x="950" dy="40">واللافتات تساعده على فهمها. هذا هو <tspan font-weight="bold" fill="#17457f">SEO</tspan>.</tspan>
</text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Search engine:</tspan> an automatic librarian</tspan>
  <tspan x="132" dy="40">that reads pages and sorts them in its</tspan>
  <tspan x="132" dy="40">index; the signs help it</tspan>
  <tspan x="132" dy="40">understand them. This is <tspan font-weight="bold" fill="#17457f">SEO</tspan>.</tspan>
</text>
</svg>
