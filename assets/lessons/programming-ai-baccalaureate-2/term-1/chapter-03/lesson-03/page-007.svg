  <tspan x="453" dy="40">sharp”</tspan>
</text>
<text x="417" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
