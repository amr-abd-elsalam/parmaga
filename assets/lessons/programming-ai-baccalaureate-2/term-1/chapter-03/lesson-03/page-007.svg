<!-- Text: row 3 -->
<text x="733" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="733" dy="0">JavaScript</tspan>
</text>
<text x="697" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="697" dy="0">«أنا بتحرك</tspan>
  <tspan x="697" dy="40">وبرد عليك»</tspan>
</text>
<text x="453" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="453" dy="0">“I move</tspan>
  <tspan x="453" dy="40">and respond</tspan>
  <tspan x="453" dy="40">to you”</tspan>
</text>
<text x="417" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="417" dy="0">السلوك </tspan>
</text>
<text x="113" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0"><tspan font-weight="bold" fill="#17457f">Behavior</tspan></tspan>
</text>

<!-- Text: paragraph -->
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">حيلة الحروف:</tspan> HTML أربعة حروف وCSS ثلاثة؛</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الهيكل</tspan> هو <tspan font-weight="bold" fill="#17457f">الأساس</tspan> فأخذ حروفًا أكثر.</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Letter trick:</tspan> HTML has four letters</tspan>
  <tspan x="120" dy="40">and CSS three; the <tspan font-weight="bold" fill="#17457f">frame</tspan> is the <tspan font-weight="bold" fill="#17457f">base,</tspan></tspan>
  <tspan x="120" dy="40">so it got more letters.</tspan>
</text>
</svg>
