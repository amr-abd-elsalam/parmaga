<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">معلومة تميّزك: المكتبة أم إطار العمل؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Stand-Out Fact: Library or Framework?</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المكتبة Library</tspan> مثل <tspan font-weight="bold" fill="#17457f">صندوق العدة:</tspan></tspan>
  <tspan x="950" dy="40">أنت تختار الأداة وتستدعيها وقتما تحتاج.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">library</tspan> is like a <tspan font-weight="bold" fill="#17457f">toolbox:</tspan> you pick</tspan>
  <tspan x="120" dy="40">the tool and call it when you need it.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">إطار العمل Framework</tspan> مثل <tspan font-weight="bold" fill="#17457f">قالب البيت</tspan> الجاهز:</tspan>
  <tspan x="950" dy="40">هو يحدد الهيكل والقواعد،</tspan>
  <tspan x="950" dy="40">وأنت تملأ الأماكن التي حددها.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">framework</tspan> is like a <tspan font-weight="bold" fill="#17457f">ready house frame:</tspan></tspan>
  <tspan x="120" dy="40">it sets the structure and rules,</tspan>
  <tspan x="120" dy="40">and you fill the places it defines.</tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مع المكتبة: أنت تستدعي الكود.</tspan>
  <tspan x="935" dy="40">مع الإطار: الإطار يستدعي كودك.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">With a library, you call the code.</tspan>
  <tspan x="140" dy="40">With a framework,</tspan>
  <tspan x="140" dy="40">the framework calls your code.</tspan>
</text>
</svg>
