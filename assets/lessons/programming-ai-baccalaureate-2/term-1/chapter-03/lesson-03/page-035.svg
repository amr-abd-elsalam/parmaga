<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">أفخاخ الامتحان: ○ أم ×؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Exam Traps: ○ or ×?</tspan>
</text>

<!-- Trap 1 -->
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;× CSS تضيف سلوكًا إلى الصفحة.</tspan>
  <tspan x="950" dy="40">&#x200F;← CSS للمظهر، والسلوك لـ JavaScript.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× CSS adds behavior to the page.</tspan>
  <tspan x="120" dy="40">→ CSS is for appearance;</tspan>
  <tspan x="120" dy="40">behavior is JavaScript.</tspan>
</text>

<!-- Trap 2 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;× HTML الدلالية تجعل الصفحة أسرع بالضرورة.</tspan>
  <tspan x="950" dy="40">← فائدتها الفهم: إمكانية الوصول وSEO.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× Semantic HTML necessarily</tspan>
  <tspan x="120" dy="40">makes the page faster.</tspan>
  <tspan x="120" dy="40">→ Its benefit is understanding:</tspan>
  <tspan x="120" dy="40">accessibility and SEO.</tspan>
</text>

<!-- Trap 3 -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;× HTML الدلالية تضمن المركز الأول في البحث.</tspan>
  <tspan x="950" dy="40">← تساعد ولا تضمن.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× Semantic HTML guarantees</tspan>
  <tspan x="120" dy="40">first place in search.</tspan>
  <tspan x="120" dy="40">→ It helps but does not guarantee.</tspan>
</text>

<!-- Trap 4 -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">× التصميم المتجاوب لرفع الترتيب في البحث.</tspan>
  <tspan x="950" dy="40">← سببه تنوع الأجهزة.</tspan>
</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">× Responsive design is for</tspan>
  <tspan x="120" dy="40">raising search ranking.</tspan>
  <tspan x="120" dy="40">→ Its reason is the variety of devices.</tspan>
</text>
</svg>
