<rect x="892" y="772" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>
<rect x="892" y="1092" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>

<!-- Icon: star (title, left) -->
