</g>

<!-- Face: thinking (instruction strip) -->
<g transform="translate(890 292)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: pencil toward answer box 1 -->
<g transform="translate(840 561) rotate(15)">
  <path d="M -28 0 L -28 12 L 14 12 L 28 6 L 14 0 Z" fill="#22303f" opacity=".18"/>
  <rect x="-32" y="-6" width="6" height="12" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-26" y="-6" width="36" height="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="10,-6 24,0 10,6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="19,-2.4 24,0 19,2.4" fill="#22303f"/>
</g>

<!-- Icon: network nodes (beside question 2) -->
<g transform="translate(790 732)">
  <circle cx="-14" cy="20" r="10" fill="#22303f" opacity=".18"/>
  <circle cx="22" cy="20" r="10" fill="#22303f" opacity=".18"/>
  <circle cx="4" cy="-10" r="10" fill="#22303f" opacity=".18"/>
  <path d="M -18 14 L 0 -16 L 18 14 L -18 14" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="0" cy="-16" r="10" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-18" cy="14" r="10" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="18" cy="14" r="10" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: pencil toward answer box 2 -->
<g transform="translate(840 801) rotate(15)">
  <path d="M -28 0 L -28 12 L 14 12 L 28 6 L 14 0 Z" fill="#22303f" opacity=".18"/>
  <rect x="-32" y="-6" width="6" height="12" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-26" y="-6" width="36" height="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="10,-6 24,0 10,6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="19,-2.4 24,0 19,2.4" fill="#22303f"/>
</g>

<!-- Icon: code brackets (beside question 3) -->
<g transform="translate(800 1020)">
  <rect x="-26" y="-18" width="60" height="48" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="-30" y="-24" width="60" height="48" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -8 -12 L -20 0 L -8 12 M 8 -12 L 20 0 L 8 12" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 4 -15 L -4 15" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: pencil toward answer box 3 -->
<g transform="translate(840 1121) rotate(15)">
  <path d="M -28 0 L -28 12 L 14 12 L 28 6 L 14 0 Z" fill="#22303f" opacity=".18"/>
  <rect x="-32" y="-6" width="6" height="12" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-26" y="-6" width="36" height="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="10,-6 24,0 10,6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="19,-2.4 24,0 19,2.4" fill="#22303f"/>
</g>

<!-- Lower band: smile face -->
<g transform="translate(504 1214)">
  <circle cx="4" cy="6" r="26" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Lower band: light bulb -->
<g transform="translate(578 1216)">
  <circle cx="4" cy="0" r="17" fill="#22303f" opacity=".18"/>
  <path d="M -24 -18 L -20 -15 M 24 -18 L 20 -15 M 0 -31 L 0 -27" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="0" cy="-6" r="17" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -5 -4 L 0 2 L 5 -4" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="-8" y="10" width="16" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -8 16 L 8 16" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">راجع بذكاء</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Smart Review</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">خمّن: مين أنا؟ اكتب اسم التقنية أو المصطلح.</tspan>
</text>

<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Guess: who am I? Write the name</tspan>
  <tspan x="140" dy="40">of the technology or term.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> «أنا اللي حطيت العنوان والصورة في الصفحة،</tspan>
  <tspan x="950" dy="40">ومن غيري مفيش صفحة.»</tspan>
</text>

<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> “I put the heading and the image</tspan>
  <tspan x="120" dy="40">on the page; without me, there's no page.”</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> «أنا اللي خليت الزرار أخضر والخط كبير.»</tspan>
</text>

<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> “I made the button green</tspan>
  <tspan x="120" dy="40">and the text big.”</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> «كتبت في خانة البحث فالنتائج اتغيرت قدامك</tspan>
  <tspan x="950" dy="40">من غير ما الصفحة تتحمّل تاني.»</tspan>
</text>

<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> “You typed in the search box</tspan>
  <tspan x="120" dy="40">and the results changed</tspan>
  <tspan x="120" dy="40">without reloading the page.”</tspan>
</text>
</svg>
