<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">نموذج الإجابة</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Model Answer</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">HTML</tspan> <tspan fill="#c96a1b">(درجتان):</tspan> تبني <tspan font-weight="bold" fill="#17457f">بنية</tspan> الصفحة، فتضع</tspan>
  <tspan x="950" dy="40">العنوان وقائمة الكتب وخانة البحث.</tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">HTML</tspan> <tspan fill="#c96a1b">(2 marks):</tspan> builds the page's</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">structure,</tspan> placing the heading, the</tspan>
  <tspan x="132" dy="40">book list, and the search box.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">CSS</tspan> <tspan fill="#c96a1b">(درجتان):</tspan> تحدد <tspan font-weight="bold" fill="#17457f">مظهر</tspan> الصفحة، مثل ألوان</tspan>
  <tspan x="950" dy="40">المكتبة والخطوط وعرض الكتب في بطاقات.</tspan>
</text>
<text x="132" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">CSS</tspan> <tspan fill="#c96a1b">(2 marks):</tspan> sets the page's</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">appearance,</tspan> such as the library's colors,</tspan>
  <tspan x="132" dy="40">the fonts, and showing books as cards.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">JavaScript</tspan> <tspan fill="#c96a1b">(درجتان):</tspan> تضيف <tspan font-weight="bold" fill="#17457f">السلوك،</tspan> فتستجيب</tspan>
  <tspan x="950" dy="40">لكتابة المستخدم في خانة البحث وتعرض الكتب</tspan>
  <tspan x="950" dy="40">المطابقة فقط دون إعادة تحميل الصفحة.</tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">JavaScript</tspan> <tspan fill="#c96a1b">(2 marks):</tspan> adds <tspan font-weight="bold" fill="#17457f">behavior,</tspan></tspan>
  <tspan x="132" dy="40">responding to what the user types in</tspan>
  <tspan x="132" dy="40">the search box and showing only matching</tspan>
  <tspan x="132" dy="40">books without reloading the page.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">انتبه</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">WATCH OUT</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">إجابة «HTML للبنية» <tspan font-weight="bold" fill="#c0392b">وحدها</tspan></tspan>
  <tspan x="935" dy="40">قد تأخذ <tspan font-weight="bold" fill="#17457f">نصف</tspan> الدرجة فقط.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Writing <tspan font-weight="bold" fill="#c0392b">only</tspan> “HTML is for structure”</tspan>
  <tspan x="140" dy="40">may earn just <tspan font-weight="bold" fill="#17457f">half</tspan> the marks.</tspan>
</text>
</svg>
