<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">&#x200F;HTML الدلالية:</tspan>
  <tspan x="540" dy="48">لافتات على الرفوف</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">
  <tspan x="540" dy="0">Semantic HTML: Signs on the Shelves</tspan>
</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">جرّب: <tspan font-weight="bold" fill="#17457f">أغمض عينيك</tspan> وحاول أن تصل إلى</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">قائمة التنقل</tspan> في موقع. صعب، أليس كذلك؟</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Try it: <tspan font-weight="bold" fill="#17457f">close your eyes</tspan> and try to reach</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">menu</tspan> of a website. Hard, isn't it?</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذا ما يعيشه الكفيف كل يوم؛ لذلك يستخدم</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">قارئ الشاشة</tspan> Screen Reader، وهو برنامج يقرأ</tspan>
  <tspan x="950" dy="40">الصفحة <tspan font-weight="bold" fill="#17457f">بصوت مسموع</tspan>.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A blind user lives this every day, so</tspan>
  <tspan x="120" dy="40">they use a <tspan font-weight="bold" fill="#c0392b">screen reader</tspan>, a program that</tspan>
  <tspan x="120" dy="40">reads the page <tspan font-weight="bold" fill="#17457f">aloud</tspan>.</tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">قارئ الشاشة لا يرى الألوان؛</tspan>
  <tspan x="935" dy="40">إنه يقرأ أسماء العناصر.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">A screen reader does not see colors;</tspan>
  <tspan x="140" dy="40">it reads the names of the elements.</tspan>
</text>
</svg>
