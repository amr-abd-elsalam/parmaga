<!-- ===== TEXT ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="930" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">صفحة الويب Web Page:</tspan> مستند يُعرض</tspan>
  <tspan x="930" dy="40">في المتصفح، يُكتب أساسًا بلغة <tspan font-weight="bold" fill="#17457f">HTML.</tspan></tspan>
</text>

<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Web page:</tspan> a document shown in</tspan>
  <tspan x="140" dy="40">a browser, written mainly in <tspan font-weight="bold" fill="#17457f">HTML.</tspan></tspan>
</text>

<text x="930" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">الموقع الإلكتروني Website:</tspan> مجموعة صفحات</tspan>
  <tspan x="930" dy="40">مترابطة؛ الموقع <tspan fill="#c96a1b">كتاب</tspan> والصفحة <tspan fill="#c96a1b">ورقة</tspan> منه.</tspan>
</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Website:</tspan> a group of linked pages;</tspan>
  <tspan x="140" dy="40">the site is a <tspan fill="#c96a1b">book</tspan></tspan>
  <tspan x="140" dy="40">and a page is one <tspan fill="#c96a1b">sheet.</tspan></tspan>
</text>

<text x="930" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">المتصفح Browser:</tspan> برنامج يقرأ HTML وCSS</tspan>
  <tspan x="930" dy="40">وJavaScript ويحوّلها إلى صفحة تراها</tspan>
  <tspan x="930" dy="40">وتتفاعل معها.</tspan>
</text>

<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Browser:</tspan> a program that reads HTML,</tspan>
  <tspan x="140" dy="40">CSS, and JavaScript and turns them</tspan>
  <tspan x="140" dy="40">into a page you can see and use.</tspan>
</text>

<text x="930" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">العميل Client والخادم Server:</tspan> العميل</tspan>
  <tspan x="930" dy="40">جهازك ومتصفحك يطلب الصفحة، والخادم</tspan>
  <tspan x="930" dy="40">حاسوب يرسلها إليه، <tspan fill="#c96a1b">كالزبون والنادل.</tspan></tspan>
</text>

<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Client and server:</tspan> the client, your</tspan>
  <tspan x="140" dy="40">device and browser, requests the page;</tspan>
  <tspan x="140" dy="40">the server, a computer, sends it,</tspan>
  <tspan x="140" dy="40">like <tspan fill="#c96a1b">a customer and a waiter.</tspan></tspan>
</text>
</svg>
