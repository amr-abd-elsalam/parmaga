    <linearGradient id="ilScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#4fc3e8"/>
    </linearGradient>
    <linearGradient id="ilCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c48c"/>
      <stop offset="1" stop-color="#c96a1b"/>
    </linearGradient>
