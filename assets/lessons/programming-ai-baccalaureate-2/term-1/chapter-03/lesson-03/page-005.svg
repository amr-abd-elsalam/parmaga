  <path d="M 190 1166 Q 158 1152 126 1162 L 126 1234 Q 158 1226 190 1240 Q 222 1226 254 1234 L 254 1162 Q 222 1152 190 1166 Z" fill="url(#ilCover)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 1170 Q 162 1158 134 1166 L 134 1226 Q 162 1218 190 1232 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 1170 Q 218 1158 246 1166 L 246 1226 Q 218 1218 190 1232 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 146 1184 Q 162 1180 178 1186 M 146 1198 Q 162 1194 178 1200 M 146 1212 Q 162 1208 178 1214" fill="none" stroke="#8fc9f2" stroke-width="3" stroke-linecap="round"/>
  <path d="M 202 1186 Q 218 1180 234 1184 M 202 1200 Q 218 1194 234 1198 M 202 1214 Q 218 1208 234 1212" fill="none" stroke="#8fc9f2" stroke-width="3" stroke-linecap="round"/>

  <!-- flying sheet (one page) -->
  <path d="M 226 1158 Q 232 1146 240 1140" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(246 1120) rotate(14)">
    <path d="M 0 0 H 22 L 30 8 V 38 H 0 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 22 0 V 8 H 30" fill="none" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 6 17 H 24 M 6 24 H 24 M 6 31 H 18" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- server rack -->
  <rect x="290" y="1120" width="110" height="118" rx="10" fill="url(#ilRack)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="302" y="1132" width="86" height="26" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="302" y="1166" width="86" height="26" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="302" y="1200" width="86" height="26" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="314" cy="1145" r="4" fill="#a9dcbe"/>
  <circle cx="314" cy="1179" r="4" fill="#ffd24a"/>
  <circle cx="314" cy="1213" r="4" fill="#a9dcbe"/>
  <rect x="328" y="1140" width="48" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="328" y="1147" width="36" height="4" rx="2" fill="#dff1f7"/>
  <rect x="328" y="1174" width="48" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="328" y="1181" width="36" height="4" rx="2" fill="#dff1f7"/>
  <rect x="328" y="1208" width="48" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="328" y="1215" width="36" height="4" rx="2" fill="#dff1f7"/>
  <rect x="300" y="1238" width="14" height="6" rx="2" fill="#22303f"/>
  <rect x="376" y="1238" width="14" height="6" rx="2" fill="#22303f"/>

  <!-- request arrow (client to server) with envelope -->
  <line x1="424" y1="1150" x2="772" y2="1150" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="410,1150 426,1141 426,1159" fill="#c0392b"/>
  <rect x="568" y="1136" width="46" height="30" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 570 1138 L 591 1153 L 612 1138" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- response arrow (server to client) with HTML page -->
  <line x1="412" y1="1212" x2="762" y2="1212" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="776,1212 760,1203 760,1221" fill="#c0392b"/>
  <path d="M 572 1188 H 600 L 612 1200 V 1236 H 572 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 600 1188 V 1200 H 612" fill="none" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 584 1208 L 578 1214 L 584 1220 M 600 1208 L 606 1214 L 600 1220 M 594 1206 L 590 1222" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- client laptop with browser -->
  <rect x="790" y="1124" width="150" height="96" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="800" y="1134" width="130" height="76" rx="3" fill="url(#ilScreen)"/>
  <rect x="800" y="1134" width="130" height="14" rx="3" fill="#2f7fb5"/>
  <circle cx="808" cy="1141" r="2.5" fill="#ffd24a"/>
  <circle cx="815" cy="1141" r="2.5" fill="#ffffff"/>
  <circle cx="822" cy="1141" r="2.5" fill="#8fc9f2"/>
  <rect x="810" y="1156" width="40" height="40" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="822" cy="1168" r="5" fill="#ffffff"/>
  <path d="M 812 1194 L 826 1178 L 836 1188 L 842 1182 L 848 1194 Z" fill="#2e7d32"/>
  <rect x="858" y="1158" width="62" height="6" rx="3" fill="#17457f"/>
  <rect x="858" y="1172" width="52" height="5" rx="2" fill="#7f95ab"/>
  <rect x="858" y="1184" width="58" height="5" rx="2" fill="#7f95ab"/>
  <rect x="858" y="1196" width="34" height="9" rx="4" fill="#c96a1b"/>
  <polygon points="774,1220 956,1220 968,1236 762,1236" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="845" y="1223" width="40" height="5" rx="2" fill="#e8dfd1"/>

