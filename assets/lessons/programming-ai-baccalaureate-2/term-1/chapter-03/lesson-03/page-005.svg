  <!-- shadows -->
  <path d="M 194 1172 Q 162 1158 130 1168 L 130 1240 Q 162 1232 194 1246 Q 226 1232 258 1240 L 258 1168 Q 226 1158 194 1172 Z" fill="#22303f" opacity=".18"/>
