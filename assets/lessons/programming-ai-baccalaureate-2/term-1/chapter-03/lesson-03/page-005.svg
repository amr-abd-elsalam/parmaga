  <polygon points="768,1116 771,1123 778,1126 771,1129 768,1136 765,1129 758,1126 765,1123" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="956,1112 958,1117 963,1119 958,1121 956,1126 954,1121 949,1119 954,1117" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
