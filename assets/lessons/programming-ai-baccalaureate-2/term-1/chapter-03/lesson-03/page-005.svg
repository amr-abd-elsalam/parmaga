  <rect x="24" y="44" width="20" height="4" rx="2" fill="#8fc9f2"/>
</g>

<!-- Memory illustration: website book, server, request/response, client laptop -->
<g>
  <defs>
    <linearGradient id="ilRack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb5"/>
      <stop offset="1" stop-color="#17457f"/>
