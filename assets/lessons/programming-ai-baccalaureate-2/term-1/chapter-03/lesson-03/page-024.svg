<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لو بدأت بحقيبة صغيرة ستضع <tspan font-weight="bold" fill="#17457f">الأساسيات</tspan> فقط،</tspan>
  <tspan x="950" dy="40">ثم تضيف <tspan font-weight="bold" fill="#17457f">الكماليات</tspan> حين تكبر الحقيبة.</tspan>
  <tspan x="950" dy="40">والعكس صعب جدًا.</tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Start with a small suitcase and you pack</tspan>
  <tspan x="120" dy="40">only the <tspan font-weight="bold" fill="#17457f">essentials,</tspan> then add <tspan font-weight="bold" fill="#17457f">extras</tspan> as</tspan>
  <tspan x="120" dy="40">the bag grows. The reverse is very hard.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأولوية للجوال</tspan> Mobile-first:</tspan>
  <tspan x="950" dy="40">نصمم للهاتف أولًا، ثم نضيف للشاشات الأكبر،</tspan>
  <tspan x="950" dy="40">لأن كثيرًا من الناس يتصفحون من الهاتف.</tspan>
</text>

<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Mobile-first:</tspan> design for the phone</tspan>
  <tspan x="120" dy="40">first, then add for bigger screens,</tspan>
  <tspan x="120" dy="40">because many people browse on phones.</tspan>
</text>
</svg>
