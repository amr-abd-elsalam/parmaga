<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">السطر الذهبي</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Golden Line</text>

<!-- Key sentence strip text -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">&#x200F;HTML يبني، CSS يدهن، JavaScript يكهرب؛</tspan>
  <tspan x="935" dy="40">والدلالية تفهّم، والمتجاوب يكيّف،</tspan>
  <tspan x="935" dy="40">والإطار يوفّر.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">HTML builds, CSS paints,</tspan>
  <tspan x="140" dy="40">JavaScript wires; semantic HTML</tspan>
  <tspan x="140" dy="40">explains, responsive design adapts,</tspan>
  <tspan x="140" dy="40">and frameworks save effort.</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">النصف الأول هو <tspan font-weight="bold" fill="#17457f">الصفحة،</tspan></tspan>
  <tspan x="950" dy="40">والثاني ما يجعلها <tspan font-weight="bold" fill="#2e7d32">حديثة؛</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">احفظه</tspan> تصل منه إلى كل الدرس.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The first half is the <tspan font-weight="bold" fill="#17457f">page;</tspan></tspan>
  <tspan x="120" dy="40">the second, what makes it <tspan font-weight="bold" fill="#2e7d32">modern.</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">Memorize</tspan> it to recall the whole lesson.</tspan>
</text>

<!-- Illustration labels (Layout order, right to left per row) -->
