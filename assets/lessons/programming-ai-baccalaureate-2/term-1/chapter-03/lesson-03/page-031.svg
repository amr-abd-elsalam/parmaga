<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="930" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">المكتبة Library:</tspan> كود <tspan font-weight="bold" fill="#17457f">جاهز</tspan> يستدعيه</tspan>
  <tspan x="930" dy="40">المطوّر عند الحاجة لأداء مهام محددة.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Library:</tspan> <tspan font-weight="bold" fill="#17457f">ready-made</tspan> code</tspan>
  <tspan x="140" dy="40">that a developer calls when needed</tspan>
  <tspan x="140" dy="40">for specific tasks.</tspan>
</text>

<text x="930" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">إطار العمل Framework:</tspan> <tspan font-weight="bold" fill="#17457f">بنية</tspan> توفر مسبقًا</tspan>
  <tspan x="930" dy="40">وظائف ومكونات شائعة،</tspan>
  <tspan x="930" dy="40">وتحدد طريقة تنظيم التطبيق.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Framework:</tspan> a <tspan font-weight="bold" fill="#17457f">structure</tspan> that provides</tspan>
  <tspan x="140" dy="40">common functions and components</tspan>
  <tspan x="140" dy="40">in advance and sets</tspan>
  <tspan x="140" dy="40">how the app is organized.</tspan>
</text>

<text x="930" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">التوجيه Routing:</tspan> الانتقال بين صفحات</tspan>
  <tspan x="930" dy="40">التطبيق حسب الرابط.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Routing:</tspan> moving between the app's</tspan>
  <tspan x="140" dy="40">pages based on the link.</tspan>
</text>

<text x="930" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">العرض Rendering:</tspan> تحويل الكود والبيانات</tspan>
  <tspan x="930" dy="40">إلى صفحة مرئية، على <tspan fill="#c96a1b">الخادم</tspan> أو في <tspan fill="#c96a1b">المتصفح.</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Rendering:</tspan> turning code and data</tspan>
  <tspan x="140" dy="40">into a visible page, on the <tspan fill="#c96a1b">server</tspan></tspan>
  <tspan x="140" dy="40">or in the <tspan fill="#c96a1b">browser.</tspan></tspan>
</text>
</svg>
