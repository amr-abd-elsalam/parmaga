<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilTag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
  <linearGradient id="ilWord" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
</defs>

<!-- Illustration: the parts of one HTML element -->
<g>
  <!-- shadows -->
  <rect x="204" y="218" width="190" height="88" rx="18" fill="#22303f" opacity=".18"/>
  <rect x="408" y="218" width="272" height="88" rx="18" fill="#22303f" opacity=".18"/>
  <rect x="694" y="218" width="190" height="88" rx="18" fill="#22303f" opacity=".18"/>
  <rect x="194" y="604" width="100" height="22" rx="4" fill="#22303f" opacity=".18"/>
  <polygon points="888,594 928,594 922,626 894,626" fill="#22303f" opacity=".18"/>

  <!-- piece 1: opening tag -->
  <rect x="200" y="212" width="190" height="88" rx="18" fill="url(#ilTag)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="220" y="220" width="110" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  <path d="M236 236 L216 256 L236 276 M354 236 L374 256 L354 276" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="258" y="247" width="74" height="18" rx="9" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>

  <!-- piece 2: content -->
  <rect x="404" y="212" width="272" height="88" rx="18" fill="url(#ilWord)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="424" y="220" width="140" height="8" rx="4" fill="#ffffff" opacity=".85"/>
  <rect x="436" y="240" width="150" height="18" rx="9" fill="#c96a1b"/>
  <rect x="436" y="266" width="96" height="12" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <circle cx="632" cy="258" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M626 260 Q632 266 638 260" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- piece 3: closing tag -->
  <rect x="690" y="212" width="190" height="88" rx="18" fill="url(#ilTag)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="710" y="220" width="110" height="8" rx="4" fill="#ffffff" opacity=".35"/>
  <path d="M726 236 L706 256 L726 276 M844 236 L864 256 L844 276" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M754 238 L742 274" fill="none" stroke="#ffd24a" stroke-width="3" stroke-linecap="round"/>
  <rect x="764" y="247" width="66" height="18" rx="9" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>

  <!-- small gap sparkles between pieces -->
  <circle cx="397" cy="256" r="3" fill="#ffd24a"/>
  <circle cx="683" cy="256" r="3" fill="#ffd24a"/>

  <!-- wide curly bracket over the whole strip -->
  <path d="M206 204 Q206 186 226 186 H512 Q534 186 540 166 Q546 186 568 186 H854 Q874 186 874 204" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512 168 L504 162 M568 168 L576 162" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- pointer arrows from labels up to the pieces -->
  <path d="M295 386 V314 M540 386 V314 M785 386 V314" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="288,316 302,316 295,304" fill="#c0392b"/>
  <polygon points="533,316 547,316 540,304" fill="#c0392b"/>
  <polygon points="778,316 792,316 785,304" fill="#c0392b"/>

  <!-- connector from the Element label up to the bracket tip -->
  <path d="M462 545 H145 V130 H540 V152" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="533,152 547,152 540,164" fill="#c0392b"/>
  <circle cx="462" cy="545" r="4" fill="#c0392b"/>

  <!-- books on the left -->
  <rect x="190" y="598" width="100" height="22" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="198" y="578" width="86" height="20" rx="4" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="194" y="560" width="80" height="18" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M272 604 V614 M266 583 V593 M254 564 V574" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- plant on the right -->
  <path d="M904 584 Q880 566 884 544 Q902 560 904 584 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M904 584 Q928 566 924 544 Q906 560 904 584 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="884,588 924,588 918,620 890,620" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Info card: shadow, fill, accent -->
<rect x="109" y="648" width="870" height="528" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="642" width="870" height="528" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="658" width="6" height="496" rx="3" fill="#2f7fb5"/>

<!-- Card header icons: open book and star -->
<g transform="translate(440 648)">
  <path d="M30 10 Q18 2 4 6 V44 Q18 40 30 48 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 10 Q42 2 56 6 V44 Q42 40 30 48 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M10 17 Q18 15 24 18 M10 25 Q18 23 24 26 M10 33 Q18 31 24 34 M36 26 Q42 23 50 25 M36 34 Q42 31 50 33" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 5 V20 L46 16 L50 20 V4 Z" fill="#c0392b" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>
<g transform="translate(530 648)">
  <polygon points="28,4 33.88,19.91 50.83,20.58 37.51,31.09 42.11,47.42 28,38 13.89,47.42 18.49,31.09 5.17,20.58 22.12,19.91" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: room layout (furniture arranged) -->
<g transform="translate(860 850)">
  <rect x="0" y="0" width="56" height="56" rx="12" fill="#fdf6d8" stroke="#22303f" stroke-width="2.5"/>
  <rect x="8" y="8" width="26" height="12" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2"/>
  <circle cx="34" cy="36" r="8" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="8" y="30" width="12" height="18" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>
  <circle cx="46" cy="12" r="5" fill="#2e7d32"/>
</g>

<!-- Icon: doorbell ringing -->
<g transform="translate(860 1058)">
  <rect x="6" y="0" width="30" height="48" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="13" y="8" width="16" height="6" rx="3" fill="#8fc9f2"/>
  <circle cx="21" cy="30" r="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M42 16 Q48 24 42 32 M48 10 Q58 24 48 38" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Bottom band: code icon, wink face, lightning tile -->
<g transform="translate(430 1190)">
  <rect x="0" y="0" width="56" height="56" rx="12" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M20 18 L10 28 L20 38 M36 18 L46 28 L36 38" fill="none" stroke="#17457f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 16 L25 40" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(540 1218)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(594 1190)">
  <rect x="0" y="0" width="56" height="56" rx="12" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="32,8 14,32 27,32 23,48 42,24 29,24 34,8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Text: illustration labels -->
<text x="383" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="383" dy="0">وسم افتتاحي</tspan>
</text>
<text x="205" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="205" dy="0">Opening tag</tspan>
</text>
<text x="596" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="596" dy="0">المحتوى</tspan>
</text>
<text x="482" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="482" dy="0">Content</tspan>
</text>
<text x="873" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="873" dy="0">وسم ختامي</tspan>
</text>
<text x="690" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="690" dy="0">Closing tag</tspan>
</text>
<text x="594" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="594" dy="0">العنصر</tspan>
</text>
<text x="482" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="482" dy="0">Element</tspan>
</text>

<!-- Text: card header -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Text: term Layout -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التخطيط Layout:</tspan> <tspan font-weight="bold" fill="#17457f">ترتيب العناصر</tspan> وأماكنها</tspan>
  <tspan x="935" dy="40">على الصفحة، مثل توزيع الأثاث في الغرفة.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Layout:</tspan> the <tspan font-weight="bold" fill="#17457f">arrangement</tspan> and position</tspan>
  <tspan x="140" dy="40">of elements on the page,</tspan>
  <tspan x="140" dy="40">like furniture in a room.</tspan>
</text>

<!-- Text: term Event -->
<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحدث Event:</tspan> فعل يحدث في الصفحة،</tspan>
  <tspan x="935" dy="40"><tspan fill="#c96a1b">كالنقر،</tspan> فيستجيب له JavaScript،</tspan>
  <tspan x="935" dy="40">مثل جرس الباب حين يرن.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Event:</tspan> an action on the page,</tspan>
  <tspan x="140" dy="40">such as a <tspan fill="#c96a1b">click,</tspan> that JavaScript</tspan>
  <tspan x="140" dy="40">responds to, like a doorbell ringing.</tspan>
</text>
</svg>
