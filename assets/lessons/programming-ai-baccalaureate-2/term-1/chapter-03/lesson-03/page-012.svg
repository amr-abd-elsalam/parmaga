<!-- Text: card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Text: term 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">HTML:</tspan> اختصار HyperText Markup Language،</tspan>
  <tspan x="935" dy="40">أي لغة ترميز النص التشعبي؛</tspan>
  <tspan x="935" dy="40">تصف <tspan font-weight="bold" fill="#17457f">بنية الصفحة</tspan> بالوسوم.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">HTML:</tspan> short for HyperText Markup</tspan>
  <tspan x="140" dy="40">Language; it describes the page's</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">structure</tspan> using tags.</tspan>
</text>

<!-- Text: term 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الوسم Tag:</tspan> كلمة بين قوسين زاويين</tspan>
  <tspan x="935" dy="40">تحدد نوع المحتوى، مثل <tspan fill="#c96a1b">&lt;p&gt;</tspan> للفقرة.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Tag:</tspan> a word between angle brackets</tspan>
  <tspan x="140" dy="40">that sets the type of content,</tspan>
  <tspan x="140" dy="40">such as <tspan fill="#c96a1b">&lt;p&gt;</tspan> for a paragraph.</tspan>
</text>

<!-- Text: term 3 -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">العنصر Element:</tspan> الوسم الافتتاحي ومحتواه</tspan>
  <tspan x="935" dy="40">والوسم الختامي معًا، مثل <tspan fill="#c96a1b">&lt;p&gt;Hello&lt;/p&gt;.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Element:</tspan> the opening tag,</tspan>
  <tspan x="140" dy="40">its content, and the closing tag</tspan>
  <tspan x="140" dy="40">together, such as <tspan fill="#c96a1b">&lt;p&gt;Hello&lt;/p&gt;.</tspan></tspan>
</text>

<!-- Text: term 4 -->
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">CSS:</tspan> اختصار Cascading Style Sheets،</tspan>
  <tspan x="935" dy="40">أي أوراق الأنماط المتتالية؛</tspan>
  <tspan x="935" dy="40">تحدد <tspan font-weight="bold" fill="#17457f">الألوان</tspan> والخطوط والأحجام والتخطيط.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">CSS:</tspan> short for Cascading Style</tspan>
  <tspan x="140" dy="40">Sheets; it sets <tspan font-weight="bold" fill="#17457f">colors,</tspan> fonts,</tspan>
  <tspan x="140" dy="40">sizes, and layout.</tspan>
</text>
</svg>
