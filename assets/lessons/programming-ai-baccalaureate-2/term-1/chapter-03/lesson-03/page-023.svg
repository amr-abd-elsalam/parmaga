<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">كيف يحدث ذلك؟</tspan>
  <tspan x="950" dy="40">الاستعلام الإعلامي Media Query</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">How Does It Happen? The Media Query</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قاعدة في CSS تطبق تنسيقًا <tspan font-weight="bold" fill="#17457f">مختلفًا</tspan></tspan>
  <tspan x="950" dy="40">حسب <tspan font-weight="bold" fill="#c0392b">عرض الشاشة،</tspan> ومعناها:</tspan>
  <tspan x="950" dy="40">«لو الشاشة صغيرة، اعمل كذا».</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A CSS rule that applies <tspan font-weight="bold" fill="#17457f">different</tspan></tspan>
  <tspan x="120" dy="40">styling based on <tspan font-weight="bold" fill="#c0392b">screen width;</tspan> it means:</tspan>
  <tspan x="120" dy="40">“if the screen is small, do this.”</tspan>
</text>

<!-- Code box text -->
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve" font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42"><tspan x="140" dy="0" font-size="26" fill="#3d5a76">CSS</tspan>
<tspan x="140" dy="40">.cards { display: flex; }</tspan>
<tspan x="140" dy="40">@media (max-width: <tspan fill="#c96a1b">600px</tspan>) {</tspan>
<tspan x="140" dy="40">  .cards { flex-direction: column; }</tspan>
<tspan x="140" dy="40">}</tspan></text>

<!-- Success card text -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">ترجمتها</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">IN PLAIN WORDS</tspan>
</text>
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">البطاقات <tspan font-weight="bold" fill="#17457f">بجانب بعضها،</tspan></tspan>
  <tspan x="935" dy="40">إلا إذا كان عرض الشاشة 600 بكسل أو أقل،</tspan>
  <tspan x="935" dy="40">فتنزل <tspan font-weight="bold" fill="#2e7d32">تحت بعضها.</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The cards sit <tspan font-weight="bold" fill="#17457f">side by side,</tspan></tspan>
  <tspan x="140" dy="40">unless the screen is 600 pixels wide</tspan>
  <tspan x="140" dy="40">or less; then they <tspan font-weight="bold" fill="#2e7d32">stack.</tspan></tspan>
</text>
</svg>
