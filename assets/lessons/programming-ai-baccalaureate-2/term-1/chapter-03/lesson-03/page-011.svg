  <path d="M25 12 L19 32" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Card icon: pin beside the header -->
<g transform="translate(820 668)">
  <circle cx="22" cy="14" r="10" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
