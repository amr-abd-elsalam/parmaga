<rect x="105" y="662" width="870" height="332" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="678" width="6" height="300" rx="3" fill="#2f7fb5"/>

<!-- Icons beside the short English line: mouse pointer click, code -->
<g transform="translate(830 600)">
  <rect x="0" y="0" width="44" height="44" rx="10" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
