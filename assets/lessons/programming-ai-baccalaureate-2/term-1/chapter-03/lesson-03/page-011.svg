  <ellipse cx="22" cy="26" rx="8" ry="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Card face: surprise (important fact) -->
<g transform="translate(880 930)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Memory illustration: a click updates only the counter, the page is not reloaded -->
<g>
  <!-- shadows -->
  <rect x="109" y="1016" width="870" height="240" rx="24" fill="#22303f" opacity=".18"/>

  <!-- room and desk -->
  <rect x="105" y="1010" width="870" height="240" rx="24" fill="url(#ilSky)"/>
  <path d="M105 1206 H975 V1226 A24 24 0 0 1 951 1250 H129 A24 24 0 0 1 105 1226 Z" fill="url(#ilDesk)"/>
  <rect x="105" y="1206" width="870" height="5" fill="#e8dfd1" opacity=".35"/>
  <rect x="105" y="1010" width="870" height="240" rx="24" fill="none" stroke="#8fc9f2" stroke-width="2.5"/>

  <!-- wall clock -->
  <circle cx="935" cy="1046" r="18" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M935 1046 V1036 M935 1046 L942 1050" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="935" cy="1046" r="2.5" fill="#c0392b"/>

  <!-- plant -->
  <polygon points="140,1168 180,1168 174,1210 146,1210" fill="#22303f" opacity=".18"/>
  <path d="M156 1162 Q 132 1142 136 1118 Q 154 1136 156 1162 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156 1162 Q 180 1142 176 1118 Q 158 1136 156 1162 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156 1162 Q 150 1130 157 1106 Q 166 1130 156 1162 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="136,1162 176,1162 170,1204 142,1204" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- reload arrow that stays still, with a small red stop badge -->
  <path d="M260 1080 A30 30 0 1 1 230 1050" fill="none" stroke="#7f95ab" stroke-width="6" stroke-linecap="round"/>
  <polygon points="226,1038 244,1050 226,1062" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="262" cy="1106" r="13" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M256 1100 L268 1112 M268 1100 L256 1112" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- JavaScript lightning tile -->
  <rect x="304" y="1146" width="44" height="44" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="300" y="1140" width="44" height="44" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="325,1146 311,1165 321,1165 318,1178 333,1158 323,1158 327,1146" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- monitor -->
  <rect x="376" y="1030" width="336" height="170" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="530" y="1194" width="20" height="16" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="540" cy="1212" rx="50" ry="6" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="372" y="1024" width="336" height="170" rx="12" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="382" y="1034" width="316" height="150" rx="6" fill="#ffffff"/>
  <path d="M382 1040 A6 6 0 0 1 388 1034 H692 A6 6 0 0 1 698 1040 V1052 H382 Z" fill="#dff1f7"/>
  <circle cx="394" cy="1043" r="4" fill="#c0392b"/>
  <circle cx="407" cy="1043" r="4" fill="#ffd24a"/>
  <circle cx="420" cy="1043" r="4" fill="#2e7d32"/>
  <rect x="440" y="1038" width="200" height="10" rx="5" fill="#ffffff"/>
  <path d="M672 1043 A6 6 0 1 1 666 1037" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>

  <!-- static page parts, calm and pale -->
  <rect x="396" y="1062" width="288" height="14" rx="3" fill="#8fc9f2" opacity=".6"/>
  <rect x="396" y="1084" width="90" height="58" rx="4" fill="#dff1f7" stroke="#7f95ab" stroke-width="2"/>
  <path d="M400 1138 L428 1110 L446 1126 L458 1116 L482 1138 Z" fill="#a9dcbe" opacity=".85"/>
  <circle cx="468" cy="1098" r="6" fill="#ffd24a" opacity=".85"/>
  <rect x="496" y="1088" width="188" height="8" rx="4" fill="#e8dfd1"/>
  <rect x="496" y="1104" width="150" height="8" rx="4" fill="#e8dfd1"/>
  <rect x="496" y="1120" width="130" height="8" rx="4" fill="#e8dfd1"/>

  <!-- the like button and the pointer -->
  <rect x="396" y="1155" width="120" height="26" rx="13" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="396" y="1151" width="120" height="26" rx="13" fill="url(#ilBtn)" stroke="#17457f" stroke-width="2.5"/>
  <rect x="410" y="1155" width="50" height="5" rx="2.5" fill="#ffffff" opacity=".6"/>
  <path d="M440 1172 C 430 1165, 434 1157, 440 1161 C 446 1157, 450 1165, 440 1172 Z" fill="#ffffff" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="488" cy="1158" r="10" fill="none" stroke="#ffd24a" stroke-width="2.5" opacity=".85"/>
  <polygon points="488,1156 488,1178 493,1173 497,1182 501,1180 497,1171 504,1171" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- the only updated part: the counter, highlighted -->
  <ellipse cx="598" cy="1165" rx="40" ry="17" fill="#ffd24a" opacity=".35"/>
  <rect x="570" y="1152" width="56" height="26" rx="6" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="578" y="1158" width="40" height="14" rx="3" fill="#17457f"/>
  <circle cx="598" cy="1165" r="3" fill="#ffd24a"/>
  <rect x="562" y="1146" width="72" height="36" rx="8" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path d="M640 1150 L646 1144 M642 1166 H650" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="660" cy="1132" r="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M654 1132 H666 M660 1126 V1138" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- mouse with click ripples, cabled to the monitor -->
  <path d="M850 1110 C 850 1070, 760 1090, 708 1100" fill="none" stroke="#4fc3e8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="824" y="1116" width="60" height="90" rx="30" fill="#22303f" opacity=".18"/>
  <rect x="820" y="1110" width="60" height="90" rx="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M850 1112 A28 28 0 0 0 822 1140 V1145 H850 Z" fill="#4fc3e8" opacity=".6"/>
  <path d="M850 1110 V1145 M822 1145 H878" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="834" cy="1128" r="22" fill="none" stroke="#ffd24a" stroke-width="2.5" opacity=".6"/>
  <circle cx="834" cy="1128" r="13" fill="none" stroke="#ffd24a" stroke-width="2.5" opacity=".85"/>
  <path d="M800 1112 L792 1106 M796 1130 H786 M804 1094 L798 1086" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text: code box (JavaScript) -->
<text x="140" y="150" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve" font-family="Consolas, Menlo, Courier New, monospace" font-size="27" font-weight="normal" fill="#152b42">
<tspan x="140" dy="0" font-size="25" fill="#3d5a76">JavaScript</tspan>
<tspan x="140" dy="36">let count = <tspan fill="#c96a1b">0</tspan>;</tspan>
<tspan x="140" dy="36">const btn = document.getElementById(<tspan fill="#c96a1b">"likeBtn"</tspan>);</tspan>
<tspan x="140" dy="36">const out = document.getElementById(<tspan fill="#c96a1b">"count"</tspan>);</tspan>
<tspan x="140" dy="36">btn.addEventListener(<tspan fill="#c96a1b">"click"</tspan>, () =&gt; {</tspan>
<tspan x="140" dy="36">  count++;</tspan>
<tspan x="140" dy="36">  out.textContent = count;</tspan>
<tspan x="140" dy="36">});</tspan>
</text>

<!-- Text: paragraph -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">السطر <tspan font-weight="bold" fill="#c0392b">addEventListener</tspan> معناه: «انتظر حدث</tspan>
  <tspan x="950" dy="36">النقر <tspan font-weight="bold" fill="#17457f">click،</tspan> وعندما يحدث نفّذ ما بين القوسين».</tspan>
</text>
<text x="120" y="546" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">addEventListener</tspan> line means: “wait for</tspan>
  <tspan x="120" dy="36">the <tspan font-weight="bold" fill="#17457f">click</tspan> event, and when it happens, run</tspan>
  <tspan x="120" dy="36">what is inside the braces.”</tspan>
</text>

<!-- Text: info card -->
<text x="935" y="690" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">لاحظ</tspan>
</text>
<text x="140" y="726" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">NOTICE</tspan>
</text>
<text x="935" y="762" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;JavaScript غيّر <tspan font-weight="bold" fill="#17457f">الرقم وحده</tspan></tspan>
  <tspan x="935" dy="36">ولم يُعِد تحميل الصفحة كلها؛</tspan>
  <tspan x="935" dy="36">هذا معنى «تحديث <tspan font-weight="bold" fill="#c0392b">جزء فقط</tspan> من الشاشة».</tspan>
</text>
<text x="140" y="870" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0">JavaScript changed <tspan font-weight="bold" fill="#17457f">only the number</tspan></tspan>
  <tspan x="140" dy="36">without reloading the whole page;</tspan>
  <tspan x="140" dy="36">this is what “updating <tspan font-weight="bold" fill="#c0392b">only part</tspan></tspan>
  <tspan x="140" dy="36">of the screen” means.</tspan>
</text>
</svg>
