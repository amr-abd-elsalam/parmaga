    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <linearGradient id="ilBtn" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>
</defs>

<!-- Shadows: code box and info card -->
<rect x="109" y="128" width="870" height="296" rx="12" fill="#22303f" opacity=".12"/>
<rect x="109" y="668" width="870" height="332" rx="16" fill="#22303f" opacity=".12"/>

<!-- Fills: code box and info card -->
