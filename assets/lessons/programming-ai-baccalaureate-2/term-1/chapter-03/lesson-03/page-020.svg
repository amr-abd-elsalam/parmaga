<!-- ===== Text ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ الامتحان</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">HTML الدلالية</tspan> تساعد محرك البحث لكنها</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">لا تضمن</tspan> المركز الأول، ولا تجعل الصفحة</tspan>
  <tspan x="935" dy="40">أجمل أو أسرع بالضرورة.</tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Semantic HTML</tspan> helps search engines</tspan>
  <tspan x="140" dy="40">but <tspan font-weight="bold" fill="#17457f">does not guarantee</tspan> first place,</tspan>
  <tspan x="140" dy="40">and does not necessarily make</tspan>
  <tspan x="140" dy="40">the page prettier or faster.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات تميّزك</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">STAND-OUT TERMS</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الفهرسة Indexing:</tspan> قراءة محرك البحث</tspan>
  <tspan x="935" dy="40">للصفحة وتخزين معلوماتها في فهرسه.</tspan>
</text>

<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Indexing:</tspan> a search engine</tspan>
  <tspan x="140" dy="40">reading a page and storing its</tspan>
  <tspan x="140" dy="40">information in its index.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التقنيات المساعدة Assistive Technologies:</tspan></tspan>
  <tspan x="935" dy="40">أدوات تساعد ذوي الإعاقة على استخدام</tspan>
  <tspan x="935" dy="40">الحاسوب، ومنها قارئ الشاشة.</tspan>
</text>

<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Assistive technologies:</tspan> tools that</tspan>
  <tspan x="140" dy="40">help people with disabilities use</tspan>
  <tspan x="140" dy="40">computers, such as screen readers.</tspan>
</text>
</svg>
