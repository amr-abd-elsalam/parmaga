<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">Vue</tspan> <tspan font-weight="bold" fill="#17457f">«السهل التدريجي»:</tspan> تبدأ به</tspan>
  <tspan x="950" dy="40">صغيرًا وتكبر خطوة خطوة.</tspan>
</text>

<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Vue,</tspan> “the easy <tspan font-weight="bold" fill="#17457f">step-by-step</tspan> one”:</tspan>
  <tspan x="120" dy="40">start small and grow step by step.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">Next.js</tspan> «&#x200F;React ومعه عدة كاملة»:</tspan>
  <tspan x="950" dy="40">يضيف <tspan font-weight="bold" fill="#17457f">التوجيه Routing</tspan> بين الصفحات وطرقًا</tspan>
  <tspan x="950" dy="40">لتسريع عرضها.</tspan>
</text>

<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Next.js,</tspan> “React with a full toolkit”:</tspan>
  <tspan x="120" dy="40">adds <tspan font-weight="bold" fill="#17457f">routing</tspan> between pages and ways</tspan>
  <tspan x="120" dy="40">to speed up their display.</tspan>
</text>

<text x="868" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="868" dy="0">React</tspan>
</text>

<text x="450" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
