<!-- Text: outlined box -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">توقّف وفكّر</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">PAUSE &amp; THINK</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ماذا يحدث لو غاب صديق <tspan font-weight="bold" fill="#c0392b">CSS؟</tspan></tspan>
  <tspan x="935" dy="40">ولو غاب صديق <tspan font-weight="bold" fill="#c0392b">JavaScript؟</tspan></tspan>
  <tspan x="935" dy="40">ولو غاب صديق <tspan font-weight="bold" fill="#c0392b">HTML؟</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">What happens if the <tspan font-weight="bold" fill="#c0392b">CSS</tspan> friend</tspan>
  <tspan x="140" dy="40">is absent? The <tspan font-weight="bold" fill="#c0392b">JavaScript</tspan> friend?</tspan>
  <tspan x="140" dy="40">The <tspan font-weight="bold" fill="#c0392b">HTML</tspan> friend?</tspan>
</text>

<!-- Text: table header row -->
<text x="967" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="967" dy="0">من غاب؟</tspan>
</text>
<text x="713" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="713" dy="0">Who is</tspan>
  <tspan x="713" dy="40">missing?</tspan>
</text>
<text x="677" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="677" dy="0">ماذا يحدث؟</tspan>
</text>
<text x="113" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="113" dy="0">What happens?</tspan>
</text>

<!-- Text: row 1 -->
<text x="713" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="713" dy="0">CSS</tspan>
</text>
<text x="677" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="677" dy="0">زر <tspan font-weight="bold" fill="#2e7d32">يعمل</tspan> لكن شكله عادي</tspan>
</text>
<text x="113" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">A <tspan font-weight="bold" fill="#2e7d32">working</tspan> button</tspan>
  <tspan x="113" dy="40">with a plain look</tspan>
</text>

<!-- Text: row 2 -->
<text x="713" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="713" dy="0">JavaScript</tspan>
</text>
<text x="677" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="677" dy="0">زر جميل لكن الضغط عليه</tspan>
  <tspan x="677" dy="40"><tspan font-weight="bold" fill="#17457f">لا يفعل شيئًا</tspan></tspan>
</text>
<text x="113" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">A nice button that does</tspan>
  <tspan x="113" dy="40"><tspan font-weight="bold" fill="#17457f">nothing</tspan> when pressed</tspan>
</text>

<!-- Text: row 3 -->
<text x="713" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="713" dy="0">HTML</tspan>
</text>
<text x="677" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="677" dy="0"><tspan font-weight="bold" fill="#c0392b">لا يوجد زر</tspan> أصلًا!</tspan>
</text>
<text x="113" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">There is <tspan font-weight="bold" fill="#c0392b">no button</tspan> at all!</tspan>
</text>
</svg>
