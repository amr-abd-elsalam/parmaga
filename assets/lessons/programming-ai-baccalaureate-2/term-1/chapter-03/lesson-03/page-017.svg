<!-- ===== Text (Layout order) ===== -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">بدون دلالة: صناديق بلا لافتات</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Without Meaning: Boxes with No Signs</tspan>
</text>

<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve"
      font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42">
<tspan x="140" dy="0" font-size="26" fill="#3d5a76">HTML</tspan>
<tspan x="140" dy="40">&lt;div class=<tspan fill="#c96a1b">"top"</tspan>&gt;...&lt;/div&gt;</tspan>
<tspan x="140" dy="40">&lt;div class=<tspan fill="#c96a1b">"menu"</tspan>&gt;...&lt;/div&gt;</tspan>
<tspan x="140" dy="40">&lt;div class=<tspan fill="#c96a1b">"content"</tspan>&gt;...&lt;/div&gt;</tspan>
<tspan x="140" dy="40">&lt;div class=<tspan fill="#c96a1b">"bottom"</tspan>&gt;...&lt;/div&gt;</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">بدلالة: كل صندوق عليه لافتة</tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">With Meaning: Every Box Has a Sign</tspan>
</text>

<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve"
      font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42">
<tspan x="140" dy="0" font-size="26" fill="#3d5a76">HTML</tspan>
<tspan x="140" dy="40">&lt;header&gt;...&lt;/header&gt;</tspan>
<tspan x="140" dy="40">&lt;nav&gt;...&lt;/nav&gt;</tspan>
<tspan x="140" dy="40">&lt;main&gt;...&lt;/main&gt;</tspan>
<tspan x="140" dy="40">&lt;footer&gt;...&lt;/footer&gt;</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">قد تبدو الصفحتان متطابقتين؛</tspan>
  <tspan x="935" dy="40">الفرق في المعنى لا في الشكل.</tspan>
</text>

<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The two pages may look identical;</tspan>
  <tspan x="140" dy="40">the difference is in meaning, not looks.</tspan>
</text>
</svg>
