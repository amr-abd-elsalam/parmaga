<!-- Text: header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الشيء نفسه بالكود</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Same Thing in Code</tspan>
</text>

<!-- Text: paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ما تخيّلته <tspan font-weight="bold" fill="#17457f">حقيقي؛</tspan> هذا هو <tspan font-weight="bold" fill="#c0392b">زر الإعجاب</tspan> بالكود:</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">What you imagined is <tspan font-weight="bold" fill="#17457f">real;</tspan></tspan>
  <tspan x="120" dy="40">here is the <tspan font-weight="bold" fill="#c0392b">Like button</tspan> in code:</tspan>
</text>

<!-- Text: code box (HTML) -->
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve" font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42">
<tspan x="140" dy="0" font-size="26" fill="#3d5a76">HTML</tspan>
<tspan x="140" dy="40">&lt;button id=<tspan fill="#c96a1b">"likeBtn"</tspan>&gt;Like&lt;/button&gt;</tspan>
<tspan x="140" dy="40">&lt;p&gt;Likes: &lt;span id=<tspan fill="#c96a1b">"count"</tspan>&gt;<tspan fill="#c96a1b">0</tspan>&lt;/span&gt;&lt;/p&gt;</tspan>
</text>

<!-- Text: code box (CSS) -->
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" xml:space="preserve" font-family="Consolas, Menlo, Courier New, monospace" font-size="29" font-weight="normal" fill="#152b42">
<tspan x="140" dy="0" font-size="26" fill="#3d5a76">CSS</tspan>
<tspan x="140" dy="40">#likeBtn {</tspan>
<tspan x="140" dy="40">  background: orange;</tspan>
<tspan x="140" dy="40">  color: white;</tspan>
<tspan x="140" dy="40">  border-radius: <tspan fill="#c96a1b">12px</tspan>;</tspan>
<tspan x="140" dy="40">}</tspan>
</text>

<!-- Text: key sentence strip -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">&#x200F;HTML هو الأساس: من غيره لا توجد صفحة.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">HTML is the base:</tspan>
  <tspan x="140" dy="40">without it, there is no page.</tspan>
</text>
</svg>
