<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">توقّف وفكّر</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">PAUSE &amp; THINK</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ظهرت الصفحة نصوصًا سوداء وروابط زرقاء</tspan>
  <tspan x="935" dy="40">فوق بعضها. هل <tspan font-weight="bold" fill="#17457f">تعطّل</tspan> الموقع؟</tspan>
  <tspan x="935" dy="40">ما الذي <tspan font-weight="bold" fill="#c0392b">اختفى؟</tspan></tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The page now shows black text and</tspan>
  <tspan x="140" dy="40">blue links stacked on top of each</tspan>
  <tspan x="140" dy="40">other. Is the site <tspan font-weight="bold" fill="#17457f">broken?</tspan></tspan>
  <tspan x="140" dy="40">What <tspan font-weight="bold" fill="#c0392b">disappeared?</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">المحتوى</tspan> كله ما زال موجودًا؛ هذا هو <tspan font-weight="bold" fill="#c0392b">HTML.</tspan></tspan>
  <tspan x="950" dy="40">أما الذي اختفى فهو التنسيق؛ وهذا هو <tspan font-weight="bold" fill="#c0392b">CSS.</tspan></tspan>
</text>

<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">All the <tspan font-weight="bold" fill="#17457f">content</tspan> is still there;</tspan>
  <tspan x="120" dy="40">that is <tspan font-weight="bold" fill="#c0392b">HTML.</tspan></tspan>
  <tspan x="120" dy="40">What disappeared is the styling;</tspan>
  <tspan x="120" dy="40">that is <tspan font-weight="bold" fill="#c0392b">CSS.</tspan></tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">يمكن أن تعمل الصفحة بـ HTML وحده،</tspan>
  <tspan x="935" dy="40">ويُضاف CSS وJavaScript حسب الحاجة.</tspan>
</text>

<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">A page can work with HTML alone;</tspan>
  <tspan x="140" dy="40">CSS and JavaScript are added as needed.</tspan>
</text>
</svg>
