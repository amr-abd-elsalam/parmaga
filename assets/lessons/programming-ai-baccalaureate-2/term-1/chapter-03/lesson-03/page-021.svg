<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">التصميم المتجاوب:</tspan>
  <tspan x="540" dy="48">صفحة مثل الماء</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Responsive Design: A Page Like Water</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صُبّ الماء في <tspan fill="#c96a1b">كوب</tspan> فيأخذ شكل الكوب،</tspan>
  <tspan x="950" dy="40">وفي <tspan fill="#c96a1b">زجاجة</tspan> فيأخذ شكلها. الماء واحد،</tspan>
  <tspan x="950" dy="40">لكنه <tspan font-weight="bold" fill="#17457f">يتكيف</tspan> مع الوعاء.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Pour water into a <tspan fill="#c96a1b">cup</tspan> and it takes the</tspan>
  <tspan x="120" dy="40">cup's shape; into a <tspan fill="#c96a1b">bottle,</tspan> the bottle's.</tspan>
  <tspan x="120" dy="40">The water is the same,</tspan>
  <tspan x="120" dy="40">but it <tspan font-weight="bold" fill="#17457f">adapts</tspan> to the container.</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التصميم المتجاوب:</tspan> صفحة واحدة <tspan font-weight="bold" fill="#17457f">يتكيف</tspan></tspan>
  <tspan x="935" dy="40">تخطيطها تلقائيًا مع أي شاشة: كمبيوتر</tspan>
  <tspan x="935" dy="40">أو جهاز لوحي أو هاتف.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Responsive design:</tspan> one page whose</tspan>
  <tspan x="140" dy="40">layout <tspan font-weight="bold" fill="#17457f">adapts</tspan> automatically to any</tspan>
  <tspan x="140" dy="40">screen: computer, tablet, or phone.</tspan>
</text>
</svg>
