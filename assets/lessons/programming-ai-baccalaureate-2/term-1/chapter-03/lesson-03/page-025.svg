<!-- Warning card text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">فخ الامتحان</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">EXAM TRAP</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">سبب الحاجة إلى <tspan font-weight="bold" fill="#c0392b">التصميم المتجاوب</tspan></tspan>
  <tspan x="935" dy="40">هو <tspan font-weight="bold" fill="#2e7d32">تنوع الأجهزة،</tspan> لا سرعة العرض</tspan>
  <tspan x="935" dy="40">ولا الترتيب في البحث.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Responsive design</tspan> is needed because</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">devices vary,</tspan> not for display speed</tspan>
  <tspan x="140" dy="40">or search ranking.</tspan>
</text>

<!-- Info card text -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات تميّزك</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">STAND-OUT TERMS</tspan>
</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">منفذ العرض</tspan> Viewport: المساحة المرئية</tspan>
  <tspan x="935" dy="40">من الصفحة على شاشة الجهاز.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Viewport:</tspan> the visible area</tspan>
  <tspan x="140" dy="40">of the page on the device screen.</tspan>
</text>
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">سهولة الاستخدام</tspan> Usability: مدى سهولة</tspan>
  <tspan x="935" dy="40">استخدام الصفحة وراحة المستخدم فيها.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Usability:</tspan> how easy and comfortable</tspan>
  <tspan x="140" dy="40">the page is to use.</tspan>
</text>
</svg>
