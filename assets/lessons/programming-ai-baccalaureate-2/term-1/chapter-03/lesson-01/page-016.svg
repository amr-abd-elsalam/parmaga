<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قاعدة البيانات</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Database</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>

<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قاعدة البيانات</tspan> Database: نظام ينظم</tspan>
  <tspan x="935" dy="40">البيانات ويحفظها ويديرها، ويسترجعها</tspan>
  <tspan x="935" dy="40">عند الطلب، ويسجل الجديد منها.</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">وتبقى البيانات</tspan> فيها حتى بعد إغلاق التطبيق.</tspan>
</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Database:</tspan> a system that organizes,</tspan>
  <tspan x="140" dy="40">stores, and manages data, retrieves it</tspan>
  <tspan x="140" dy="40">when requested, and records new data.</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">The data stays</tspan> even after</tspan>
  <tspan x="140" dy="40">the app is closed.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">جدول</text>

<text x="870" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Table</text>

<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">سجل</text>

<text x="870" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Record</text>

<circle cx="966" cy="1104" r="6" fill="#c96a1b"/>
<circle cx="114" cy="1144" r="6" fill="#c96a1b"/>

<text x="950" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">مثل: المنتجات، والمستخدمون، والطلبات.</text>

<text x="132" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">e.g., products, users, orders.</text>

