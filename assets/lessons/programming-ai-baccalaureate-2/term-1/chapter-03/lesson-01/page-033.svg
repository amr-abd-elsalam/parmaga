<!-- TEXT -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">جهّز نفسك للامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Get Ready for the Exam</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في سؤال <tspan font-weight="bold" fill="#17457f">توزيع المهام،</tspan></tspan>
  <tspan x="950" dy="40">ابحث عن <tspan font-weight="bold" fill="#c0392b">الكلمة المفتاحية:</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In a <tspan font-weight="bold" fill="#17457f">task-assignment</tspan> question,</tspan>
  <tspan x="120" dy="40">look for the <tspan font-weight="bold" fill="#c0392b">key word:</tspan></tspan>
</text>

<!-- Header row -->
<text x="965" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">إذا وجدت</text>
<text x="475" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">If you see</text>
<text x="435" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">فالإجابة</text>
<text x="115" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">The answer is</text>

<!-- Row 1 -->
<text x="965" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">شاشة، صفحة، عرض،</tspan>
  <tspan x="965" dy="40">نموذج إدخال</tspan>
</text>
<text x="475" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="475" dy="0">screen, page, display,</tspan>
  <tspan x="475" dy="40">input form</tspan>
</text>
<text x="435" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">الواجهة الأمامية</text>
<text x="115" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">Frontend</text>

<!-- Row 2 -->
<text x="965" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">معالجة، تحقق، تحديد،</tspan>
  <tspan x="965" dy="40">اختيار، دفع، إشعارات</tspan>
</text>
<text x="475" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="475" dy="0">processing, checking,</tspan>
  <tspan x="475" dy="40">determining, selecting,</tspan>
  <tspan x="475" dy="40">payment, notifications</tspan>
</text>
<text x="435" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">الواجهة الخلفية</text>
<text x="115" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">Backend</text>

<!-- Row 3 -->
<text x="965" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">تخزين، سجل، معلومات محفوظة</text>
<text x="475" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="475" dy="0">storage, history,</tspan>
  <tspan x="475" dy="40">stored information</tspan>
</text>
<text x="435" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">قاعدة البيانات</text>
<text x="115" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">Database</text>
