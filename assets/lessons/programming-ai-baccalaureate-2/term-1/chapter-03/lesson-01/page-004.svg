<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ما الفرق بين <tspan font-weight="bold" fill="#c0392b">تطبيق الويب</tspan> والموقع</tspan>
  <tspan x="950" dy="40">التعريفي البسيط؟ الموقع التعريفي <tspan font-weight="bold" fill="#17457f">تقرؤه فقط،</tspan></tspan>
  <tspan x="950" dy="40">أما تطبيق الويب <tspan font-weight="bold" fill="#17457f">فيتفاعل معك:</tspan> تبحث فيه</tspan>
  <tspan x="950" dy="40">وتشتري وتنشر وترسل.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">How is a <tspan font-weight="bold" fill="#c0392b">web application</tspan> different from</tspan>
  <tspan x="120" dy="40">a simple information website? You only</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">read</tspan> an information website, but a</tspan>
  <tspan x="120" dy="40">web application <tspan font-weight="bold" fill="#17457f">interacts with you:</tspan></tspan>
  <tspan x="120" dy="40">you search, buy, post, and send in it.</tspan>
</text>
<text x="814" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">موقع تعريفي</text>
<text x="588" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Information website</text>
<text x="388" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تطبيق ويب</text>
<text x="204" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Web application</text>
<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الموقع التعريفي تقرؤه،</tspan>
  <tspan x="935" dy="40">وتطبيق الويب تتفاعل معه.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">You read an information website;</tspan>
  <tspan x="140" dy="40">you interact with a web application.</tspan>
</text>
</svg>
