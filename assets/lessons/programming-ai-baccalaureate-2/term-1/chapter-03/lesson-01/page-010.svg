<!-- Main idea card text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قاعدة الأفعال الستة:</tspan></tspan>
  <tspan x="935" dy="40">الواجهة الأمامية تعرض وتجمع،</tspan>
  <tspan x="935" dy="40">والواجهة الخلفية تقرر وتعالج،</tspan>
  <tspan x="935" dy="40">وقاعدة البيانات تخزن وتسترجع.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#c0392b">six-verb rule:</tspan></tspan>
  <tspan x="140" dy="40">the frontend shows and collects,</tspan>
  <tspan x="140" dy="40">the backend decides and processes,</tspan>
  <tspan x="140" dy="40">and the database stores and retrieves.</tspan>
</text>

<!-- Info card header -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريف</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>

<!-- Info card paragraph 1 -->
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">بنية الطبقات الثلاث Three-Tier Architecture:</tspan>
  <tspan x="935" dy="40">تقسيم التطبيق إلى طبقة عرض Presentation،</tspan>
  <tspan x="935" dy="40">وطبقة معالجة Logic، وطبقة بيانات Data،</tspan>
  <tspan x="935" dy="40">لكل منها <tspan font-weight="bold" fill="#17457f">مسؤولية</tspan> واضحة.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Three-tier architecture: dividing</tspan>
  <tspan x="140" dy="40">an app into a presentation tier,</tspan>
  <tspan x="140" dy="40">a logic tier, and a data tier,</tspan>
  <tspan x="140" dy="40">each with a clear <tspan font-weight="bold" fill="#17457f">responsibility.</tspan></tspan>
</text>

<!-- Info card paragraph 2 -->
<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وهي <tspan font-weight="bold" fill="#17457f">نموذج شائع،</tspan> لا قانون:</tspan>
  <tspan x="935" dy="40">فبعض التطبيقات فيها طبقات أكثر،</tspan>
  <tspan x="935" dy="40">وبعضها بلا قاعدة بيانات تقليدية.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It is a <tspan font-weight="bold" fill="#17457f">common model,</tspan> not a law: some apps have</tspan>
  <tspan x="140" dy="40">more tiers, and some have no traditional database.</tspan>
</text>
</svg>
