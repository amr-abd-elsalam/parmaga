<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميزك</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">GO BEYOND</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التحقق من تسجيل الدخول</tspan> Authentication:</tspan>
  <tspan x="935" dy="40">التأكد من أنك صاحب الحساب فعلًا، بمقارنة</tspan>
  <tspan x="935" dy="40">ما أدخلته بما هو محفوظ.</tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Authentication:</tspan> confirming that you</tspan>
  <tspan x="140" dy="40">really own the account by comparing</tspan>
  <tspan x="140" dy="40">what you entered with what is stored.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لماذا لا يحدث ذلك في المتصفح؟</tspan>
  <tspan x="935" dy="40">لأن ما يعمل على جهازك يستطيع أي شخص</tspan>
  <tspan x="935" dy="40">أن يغيّره، أما <tspan font-weight="bold" fill="#17457f">الخادم</tspan> فتحت سيطرة التطبيق.</tspan>
</text>

<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Why doesn't this happen in the browser?</tspan>
  <tspan x="140" dy="40">Because anyone can change what runs on</tspan>
  <tspan x="140" dy="40">their own device, while the <tspan font-weight="bold" fill="#17457f">server</tspan> is</tspan>
  <tspan x="140" dy="40">under the app's control.</tspan>
</text>

<text x="326" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">كلمة المرور</text>
<text x="187" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Password</text>
<text x="576" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تحقق</text>
<text x="497" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Check</text>
<text x="928" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الحساب المحفوظ</text>
<text x="708" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Stored account</text>
</svg>
