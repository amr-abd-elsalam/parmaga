<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريفات</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITIONS</tspan>
</text>

<!-- Definition 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخادم</tspan> Server: جهاز قوي، أو برنامج</tspan>
  <tspan x="935" dy="40">يعمل عليه، يبقى <tspan font-weight="bold" fill="#17457f">متصلًا بالإنترنت</tspan> ليستقبل</tspan>
  <tspan x="935" dy="40">طلبات آلاف المستخدمين ويرد عليها.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Server:</tspan> a powerful computer, or a</tspan>
  <tspan x="140" dy="40">program running on it, that stays</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">online</tspan> to receive and answer requests</tspan>
  <tspan x="140" dy="40">from thousands of users.</tspan>
</text>

<!-- Definition 2 -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المعالجة</tspan> Processing: العمل الذي يحوّل</tspan>
  <tspan x="935" dy="40">المدخلات إلى <tspan font-weight="bold" fill="#17457f">نتيجة</tspan>، مثل البحث</tspan>
  <tspan x="935" dy="40">والحساب والتحقق والترتيب.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Processing:</tspan> the work that turns input</tspan>
  <tspan x="140" dy="40">into a <tspan font-weight="bold" fill="#17457f">result</tspan>, such as searching,</tspan>
  <tspan x="140" dy="40">calculating, checking, and sorting.</tspan>
</text>

<!-- Definition 3 -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قواعد التطبيق</tspan> Business Rules: شروط يعمل</tspan>
  <tspan x="935" dy="40">بها التطبيق، مثل «لا يُقبل الطلب إذا نفد</tspan>
  <tspan x="935" dy="40">المخزون»، ومكانها <tspan font-weight="bold" fill="#17457f">الواجهة الخلفية</tspan>.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Business rules:</tspan> conditions the app</tspan>
  <tspan x="140" dy="40">follows, such as</tspan>
  <tspan x="140" dy="40">"no order if the item is out of stock";</tspan>
  <tspan x="140" dy="40">they live in the <tspan font-weight="bold" fill="#17457f">backend</tspan>.</tspan>
</text>
</svg>
