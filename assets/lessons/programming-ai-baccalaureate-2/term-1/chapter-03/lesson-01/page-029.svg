<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الموقف 2:</tspan> الصفحة تفتح جيدًا، لكن بعد الضغط</tspan>
  <tspan x="950" dy="40">على <tspan fill="#c96a1b">«بحث»</tspan> تظهر رسالة خطأ من الخادم.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Situation 2:</tspan> The page opens fine, but</tspan>
  <tspan x="120" dy="40">after pressing <tspan fill="#c96a1b">"Search"</tspan> a server error</tspan>
  <tspan x="120" dy="40">message appears.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">على الأرجح: الواجهة الخلفية،</tspan>
  <tspan x="950" dy="40">لأن المعالجة لم تتم.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Probably: the backend, because</tspan>
  <tspan x="120" dy="40">the processing did not happen.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الموقف 3:</tspan> <tspan font-weight="bold" fill="#2e7d32">نجح</tspan> تسجيل الدخول،</tspan>
  <tspan x="950" dy="40">لكن طلباتك القديمة اختفت كلها.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Situation 3:</tspan> Login <tspan font-weight="bold" fill="#2e7d32">worked,</tspan> but all</tspan>
  <tspan x="120" dy="40">your past orders have disappeared.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">على الأرجح: طبقة البيانات،</tspan>
  <tspan x="950" dy="40">لأن المحفوظ هو الذي ضاع.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Probably: the data tier, because</tspan>
  <tspan x="120" dy="40">the stored data is what was lost.</tspan>
</text>
</svg>
