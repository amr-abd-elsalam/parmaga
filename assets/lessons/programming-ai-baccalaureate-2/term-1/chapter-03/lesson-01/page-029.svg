<!-- Face: thinking (beside situation 2) -->
<g transform="translate(180 160)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: pencil (beside situation 2 English) -->
<g transform="translate(900 272) rotate(45)">
  <rect x="-8" y="-32" width="16" height="9" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-8" y="-23" width="16" height="37" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="-8,14 8,14 0,28" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="-3,23 3,23 0,28" fill="#22303f"/>
</g>

<!-- Icon: magnifying glass (beside answer 2) -->
<g transform="translate(150 372)">
  <g transform="translate(34 34) rotate(-45)">
    <rect x="-5" y="0" width="10" height="22" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
