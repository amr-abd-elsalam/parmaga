  <rect x="648" y="1096" width="104" height="14" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="648" y="1142" width="104" height="14" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2"/>

  <!-- Small open empty box -->
  <polygon points="836,1100 852,1086 826,1064 810,1080" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="946,1100 932,1086 950,1064 962,1080" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="836,1100 852,1086 930,1086 946,1100" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="836" y="1100" width="110" height="72" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="881" y="1100" width="20" height="18" fill="#e8dfd1" stroke="#22303f" stroke-width="2"/>
  <path d="M874 1066 Q866 1050 876 1034" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M898 1062 Q906 1046 898 1030" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="804" cy="1040" r="5" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <circle cx="822" cy="1020" r="4" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <circle cx="846" cy="1008" r="3.5" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>

