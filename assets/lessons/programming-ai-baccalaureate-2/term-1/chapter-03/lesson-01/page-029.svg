  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: key (beside situation 3 English) -->
<g transform="translate(880 690)">
  <rect x="12" y="-4" width="46" height="8" rx="3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="40" y="4" width="6" height="10" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="50" y="4" width="6" height="7" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: star (beside answer 3) -->
<g transform="translate(176 798)">
  <polygon points="0,-26 6.5,-8.9 24.7,-8 10.5,3.4 15.3,21 0,11 -15.3,21 -10.5,3.4 -24.7,-8 -6.5,-8.9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
