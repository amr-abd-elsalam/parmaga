  <path d="M13 19 Q15 12 22 11" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Face: thinking (beside situation 3) -->
<g transform="translate(180 600)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
