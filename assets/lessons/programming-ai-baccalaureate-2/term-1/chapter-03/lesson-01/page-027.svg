<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريفات</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITIONS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">شبكة التواصل الاجتماعي</tspan> SNS: خدمة للنشر</tspan>
  <tspan x="935" dy="40">والتواصل والمتابعة بين المستخدمين.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">SNS (Social Networking Service):</tspan></tspan>
  <tspan x="140" dy="40">a service for posting, communicating,</tspan>
  <tspan x="140" dy="40">and following between users.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخط الزمني</tspan> Timeline: صفحة تعرض منشورات</tspan>
  <tspan x="935" dy="40">من تتابعهم؛ عرضها عمل الواجهة الأمامية،</tspan>
  <tspan x="935" dy="40">واختيار ما فيها عمل الواجهة الخلفية.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Timeline:</tspan> a page showing posts from</tspan>
  <tspan x="140" dy="40">people you follow; displaying it is</tspan>
  <tspan x="140" dy="40">the frontend's job, and choosing its</tspan>
  <tspan x="140" dy="40">content is the backend's job.</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الإشعارات الفورية</tspan> Push Notifications:</tspan>
  <tspan x="935" dy="40">رسائل تصلك دون أن تطلبها، وتقرر</tspan>
  <tspan x="935" dy="40">الواجهة الخلفية متى تُرسل ولمن.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Push notifications:</tspan> messages that</tspan>
  <tspan x="140" dy="40">reach you without asking; the backend</tspan>
  <tspan x="140" dy="40">decides when and to whom they are sent.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التجارة الإلكترونية</tspan> E-commerce:</tspan>
  <tspan x="935" dy="40">البيع والشراء عبر الإنترنت.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">E-commerce:</tspan> buying and selling online.</tspan>
</text>
</svg>
