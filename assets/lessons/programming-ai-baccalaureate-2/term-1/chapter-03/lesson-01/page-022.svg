<!-- Text: Main idea card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">نازل وطالع</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">DOWN AND UP</tspan>
</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الطلب <tspan font-weight="bold" fill="#17457f">ينزل:</tspan> يكتب ← يرسل ← يسأل،</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The request goes <tspan font-weight="bold" fill="#17457f">down:</tspan></tspan>
  <tspan x="140" dy="40">types → sends → asks;</tspan>
</text>
<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">والنتيجة <tspan font-weight="bold" fill="#2e7d32">تطلع:</tspan> يرد ← يرتّب ← يعرض.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">the result comes <tspan font-weight="bold" fill="#2e7d32">up:</tspan></tspan>
  <tspan x="140" dy="40">answers → organizes → displays.</tspan>
</text>

<!-- Text: Key sentence strip -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">قاعدة مهمة في هذا النموذج:</tspan>
  <tspan x="935" dy="40">المستخدم لا يكلم المخزن مباشرة؛</tspan>
  <tspan x="935" dy="40">فالطريق إلى قاعدة البيانات</tspan>
  <tspan x="935" dy="40">يمر بالواجهة الخلفية.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Key rule in this model:</tspan>
  <tspan x="140" dy="40">the user never talks to the storeroom</tspan>
  <tspan x="140" dy="40">directly; the way to the database</tspan>
  <tspan x="140" dy="40">passes through the backend.</tspan>
</text>
</svg>
