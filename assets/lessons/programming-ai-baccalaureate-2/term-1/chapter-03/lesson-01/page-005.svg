<!-- ===== Text: Info card ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تعريفات</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITIONS</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المتصفح</tspan> Browser: البرنامج الذي تفتح به</tspan>
  <tspan x="935" dy="40">صفحات الويب، مثل <tspan fill="#c96a1b">Chrome وEdge وSafari،</tspan></tspan>
  <tspan x="935" dy="40">وفيه تعمل الواجهة الأمامية.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Browser:</tspan> the program you use to open</tspan>
  <tspan x="140" dy="40">web pages, such as <tspan fill="#c96a1b">Chrome, Edge,</tspan> and</tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">Safari;</tspan> the frontend runs inside it.</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المستخدم</tspan> User: الشخص الذي يتعامل</tspan>
  <tspan x="935" dy="40">مع التطبيق؛ يكتب ويضغط ويختار،</tspan>
  <tspan x="935" dy="40">ثم ينتظر <tspan font-weight="bold" fill="#17457f">النتيجة.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">User:</tspan> the person who works with the</tspan>
  <tspan x="140" dy="40">app; they type, click, and choose,</tspan>
  <tspan x="140" dy="40">then wait for the <tspan font-weight="bold" fill="#17457f">result.</tspan></tspan>
</text>

<!-- ===== Text: Outlined box ===== -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT YOURSELF</tspan>
</text>
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">افتح تطبيق ويب تستخدمه، واذكر <tspan font-weight="bold" fill="#17457f">ثلاثة أشياء</tspan></tspan>
  <tspan x="935" dy="40">تفعلها فيه ولا يتيحها موقع تعريفي.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Open a web app you use and name</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">three things</tspan> you do in it that an</tspan>
  <tspan x="140" dy="40">information website does not allow.</tspan>
</text>
</svg>
