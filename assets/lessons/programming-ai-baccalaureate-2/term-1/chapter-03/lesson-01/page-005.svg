  <circle cx="342" cy="1136" r="5" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="399" cy="1140" r="5" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>

  <!-- chair and student -->
  <rect x="878" y="1134" width="16" height="92" rx="8" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <path d="M800 1226 Q802 1152 842 1148 Q882 1152 884 1226 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
