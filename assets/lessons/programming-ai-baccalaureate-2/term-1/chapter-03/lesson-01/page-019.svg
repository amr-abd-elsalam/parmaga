<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">رحلة الطلب</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Request's Journey</text>

<!-- Opening paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تابع كلمة <tspan fill="#c96a1b">«سماعة»</tspan> من لحظة كتابتها</tspan>
  <tspan x="950" dy="40">حتى تظهر النتيجة على شاشتك.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Follow the word <tspan fill="#c96a1b">"headphones"</tspan> from the</tspan>
  <tspan x="120" dy="40">moment you type it until the result</tspan>
  <tspan x="120" dy="40">appears on your screen.</tspan>
</text>

<!-- Card headers -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريفات</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITIONS</text>

<!-- Definition 1: Request -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الطلب Request:</tspan> رسالة ترسلها الواجهة</tspan>
  <tspan x="935" dy="40">الأمامية إلى <tspan font-weight="bold" fill="#17457f">الواجهة الخلفية</tspan> بما يريده</tspan>
  <tspan x="935" dy="40">المستخدم، مثل «ابحث عن سماعة».</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Request:</tspan> a message the frontend sends</tspan>
  <tspan x="140" dy="40">to the <tspan font-weight="bold" fill="#17457f">backend</tspan> with what the user</tspan>
  <tspan x="140" dy="40">wants, such as "search for headphones".</tspan>
</text>

<!-- Definition 2: Query -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الاستعلام Query:</tspan> سؤال منظم ترسله</tspan>
  <tspan x="935" dy="40">الواجهة الخلفية إلى <tspan font-weight="bold" fill="#17457f">قاعدة البيانات</tspan></tspan>
  <tspan x="935" dy="40">لتطلب بيانات محددة.</tspan>
</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Query:</tspan> a structured question the</tspan>
  <tspan x="140" dy="40">backend sends to the <tspan font-weight="bold" fill="#17457f">database</tspan> to ask</tspan>
  <tspan x="140" dy="40">for specific data.</tspan>
</text>
</svg>
