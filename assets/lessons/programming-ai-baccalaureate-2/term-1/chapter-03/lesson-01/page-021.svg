<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Memory illustration: the request's journey (no text) -->
<g>
  <defs>
    <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1f7"/>
      <stop offset="1" stop-color="#8fc9f2"/>
    </linearGradient>
    <linearGradient id="ilServer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fb5"/>
      <stop offset="1" stop-color="#17457f"/>
    </linearGradient>
    <linearGradient id="ilDb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0c48c"/>
      <stop offset="1" stop-color="#c96a1b"/>
    </linearGradient>
  </defs>

  <!-- Shadows -->
  <rect x="134" y="1086" width="230" height="136" rx="12" fill="#22303f" opacity=".18"/>
  <path d="M116 1224 L382 1224 L370 1248 L128 1248 Z" fill="#22303f" opacity=".18"/>
  <rect x="474" y="1090" width="120" height="144" rx="8" fill="#22303f" opacity=".18"/>
  <path d="M704 1106 L704 1220 A60 16 0 0 0 824 1220 L824 1106 A60 16 0 0 0 704 1106 Z" fill="#22303f" opacity=".18"/>

  <!-- Scene backdrop -->
  <rect x="105" y="1066" width="862" height="186" rx="24" fill="url(#ilSky)" stroke="#8fc9f2" stroke-width="2"/>

  <!-- Laptop (frontend) -->
  <rect x="130" y="1080" width="230" height="136" rx="12" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="142" y="1092" width="206" height="112" rx="6" fill="url(#ilScreen)"/>
  <path d="M142 1110 L142 1098 Q142 1092 148 1092 L342 1092 Q348 1092 348 1098 L348 1110 Z" fill="#2f7fb5"/>
  <circle cx="152" cy="1101" r="3" fill="#ffffff"/>
  <circle cx="162" cy="1101" r="3" fill="#ffffff"/>
  <circle cx="172" cy="1101" r="3" fill="#ffffff"/>
  <rect x="154" y="1118" width="182" height="24" rx="12" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="166" y="1127" width="64" height="6" rx="3" fill="#c96a1b"/>
  <circle cx="318" cy="1129" r="6" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <line x1="322" y1="1133" x2="328" y2="1139" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="158" y="1152" width="52" height="44" rx="6" fill="#ffffff" stroke="#7f95ab" stroke-width="2"/>
  <rect x="218" y="1152" width="52" height="44" rx="6" fill="#ffffff" stroke="#7f95ab" stroke-width="2"/>
  <rect x="278" y="1152" width="52" height="44" rx="6" fill="#ffffff" stroke="#7f95ab" stroke-width="2"/>
  <path d="M173 1180 Q184 1158 195 1180" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="170" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <rect x="191" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <path d="M233 1180 Q244 1158 255 1180" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="230" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <rect x="251" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <path d="M293 1180 Q304 1158 315 1180" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="290" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <rect x="311" y="1176" width="7" height="12" rx="3" fill="#c96a1b"/>
  <path d="M112 1218 L378 1218 L366 1242 L124 1242 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="220" y="1218" width="50" height="6" rx="3" fill="#e8dfd1"/>

  <!-- Server (backend) -->
  <rect x="470" y="1084" width="120" height="44" rx="8" fill="url(#ilServer)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="470" y="1132" width="120" height="44" rx="8" fill="url(#ilServer)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="470" y="1180" width="120" height="44" rx="8" fill="url(#ilServer)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="490" cy="1106" r="4" fill="#a9dcbe"/>
  <circle cx="504" cy="1106" r="4" fill="#ffd24a"/>
  <rect x="528" y="1102" width="48" height="8" rx="4" fill="#8fc9f2"/>
  <circle cx="490" cy="1154" r="4" fill="#a9dcbe"/>
  <circle cx="504" cy="1154" r="4" fill="#ffd24a"/>
  <rect x="528" y="1150" width="48" height="8" rx="4" fill="#8fc9f2"/>
  <circle cx="490" cy="1202" r="4" fill="#a9dcbe"/>
  <circle cx="504" cy="1202" r="4" fill="#ffd24a"/>
  <rect x="528" y="1198" width="48" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="482" y="1224" width="96" height="10" rx="4" fill="#22303f"/>

  <!-- Database -->
  <path d="M700 1100 L700 1214 A60 16 0 0 0 820 1214 L820 1100 Z" fill="url(#ilDb)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M700 1138 A60 16 0 0 0 820 1138" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M700 1176 A60 16 0 0 0 820 1176" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="712" y="1122" width="8" height="78" rx="4" fill="#ffffff" opacity=".35"/>
  <ellipse cx="760" cy="1100" rx="60" ry="16" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>

  <!-- Packets on the way -->
  <rect x="398" y="1086" width="30" height="20" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <path d="M398 1088 L413 1098 L428 1088" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="401" y="1162" width="24" height="18" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <line x1="406" y1="1171" x2="420" y2="1171" stroke="#c96a1b" stroke-width="2" stroke-linecap="round"/>
  <rect x="626" y="1086" width="30" height="20" rx="3" fill="#4fc3e8" stroke="#22303f" stroke-width="2"/>
  <line x1="632" y1="1093" x2="650" y2="1093" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="632" y1="1100" x2="644" y2="1100" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <rect x="634" y="1156" width="24" height="18" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="628" y="1162" width="24" height="18" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <line x1="633" y1="1171" x2="647" y2="1171" stroke="#c96a1b" stroke-width="2" stroke-linecap="round"/>

  <!-- Connector arrows -->
  <line x1="372" y1="1112" x2="452" y2="1112" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="462,1112 450,1105 450,1119" fill="#c0392b"/>
  <line x1="602" y1="1112" x2="678" y2="1112" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="688,1112 676,1105 676,1119" fill="#c0392b"/>
  <line x1="688" y1="1188" x2="612" y2="1188" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="602,1188 614,1181 614,1195" fill="#c0392b"/>
  <line x1="462" y1="1188" x2="382" y2="1188" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="372,1188 384,1181 384,1195" fill="#c0392b"/>
</g>

<!-- Smile face -->
<g transform="translate(906 1118)">
  <circle cx="4" cy="6" r="26" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Check badge icon -->
<g transform="translate(868 1210)">
  <circle cx="4" cy="6" r="20" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="20" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -9 0 L -3 7 L 10 -7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Star icon -->
<g transform="translate(942 1210)">
  <polygon points="4,-14 9.3,-1.3 23,-0.2 12.6,8.8 15.8,22.2 4,15 -7.8,22.2 -4.6,8.8 -15,-0.2 -1.3,-1.3" fill="#22303f" opacity=".18"/>
  <polygon points="0,-20 5.3,-7.3 19,-6.2 8.6,2.8 11.8,16.2 0,9 -11.8,16.2 -8.6,2.8 -19,-6.2 -5.3,-7.3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Step 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> تكتب <tspan fill="#c96a1b">«سماعة»</tspan> في مربع البحث،</tspan>
  <tspan x="950" dy="40">فتستقبلها الواجهة الأمامية.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">1</tspan> You type <tspan fill="#c96a1b">"headphones"</tspan> in the search</tspan>
  <tspan x="120" dy="40">box, and the frontend receives it.</tspan>
</text>

<!-- Step 2 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> ترسل الواجهة الأمامية الكلمة</tspan>
  <tspan x="950" dy="40">في <tspan font-weight="bold" fill="#c0392b">طلب</tspan> إلى الواجهة الخلفية.</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">2</tspan> The frontend sends the word</tspan>
  <tspan x="120" dy="40">in a <tspan font-weight="bold" fill="#c0392b">request</tspan> to the backend.</tspan>
</text>

<!-- Step 3 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> ترسل الواجهة الخلفية <tspan font-weight="bold" fill="#c0392b">استعلامًا</tspan></tspan>
  <tspan x="950" dy="40">إلى قاعدة البيانات عن المنتجات المطابقة.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">3</tspan> The backend sends a <tspan font-weight="bold" fill="#c0392b">query</tspan></tspan>
  <tspan x="120" dy="40">to the database for matching products.</tspan>
</text>

<!-- Step 4 -->
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">4</tspan> تعيد قاعدة البيانات</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">بيانات المنتجات</tspan> المطابقة.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">4</tspan> The database returns the <tspan fill="#c96a1b">data</tspan></tspan>
  <tspan x="120" dy="40">of the matching products.</tspan>
</text>

<!-- Step 5 -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">5</tspan> ترتّب الواجهة الخلفية النتائج</tspan>
  <tspan x="950" dy="40">وترسلها في <tspan font-weight="bold" fill="#c0392b">استجابة</tspan> إلى الواجهة الأمامية.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">5</tspan> The backend organizes the results and</tspan>
  <tspan x="120" dy="40">sends them in a <tspan font-weight="bold" fill="#c0392b">response</tspan> to the frontend.</tspan>
</text>

<!-- Step 6 -->
<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">6</tspan> تعرض الواجهة الأمامية النتائج على <tspan font-weight="bold" fill="#2e7d32">شاشتك.</tspan></tspan>
</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">6</tspan> The frontend displays the results</tspan>
  <tspan x="120" dy="40">on your <tspan font-weight="bold" fill="#2e7d32">screen.</tspan></tspan>
</text>
</svg>
