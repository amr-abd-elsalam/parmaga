<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">أخطاء شائعة</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">COMMON MISTAKES</tspan>
</text>

<!-- Paragraph 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«الواجهة الخلفية تعمل على المتصفح» ×،</tspan>
  <tspan x="935" dy="40">فهي تعمل على <tspan font-weight="bold" fill="#2e7d32">الخادم.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"The backend runs on the browser" ×;</tspan>
  <tspan x="140" dy="40">it runs on the <tspan font-weight="bold" fill="#2e7d32">server.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«قاعدة البيانات هي المسؤولة عن البحث» ×،</tspan>
  <tspan x="935" dy="40">فالواجهة الخلفية <tspan font-weight="bold" fill="#17457f">تقود</tspan> البحث،</tspan>
  <tspan x="935" dy="40">وقاعدة البيانات <tspan font-weight="bold" fill="#17457f">تعيد</tspan> البيانات.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"The database is responsible</tspan>
  <tspan x="140" dy="40">for searching" ×; the backend <tspan font-weight="bold" fill="#17457f">leads</tspan></tspan>
  <tspan x="140" dy="40">the search, and the database <tspan font-weight="bold" fill="#17457f">returns</tspan></tspan>
  <tspan x="140" dy="40">the data.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«يعمل تطبيق الويب بالواجهة الأمامية</tspan>
  <tspan x="935" dy="40">وحدها» ×، <tspan font-weight="bold" fill="#17457f">فالطبقات الثلاث</tspan> <tspan font-weight="bold" fill="#2e7d32">تتعاون.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"A web app works with the frontend</tspan>
  <tspan x="140" dy="40">alone" ×; the <tspan font-weight="bold" fill="#17457f">three tiers</tspan> <tspan font-weight="bold" fill="#2e7d32">cooperate.</tspan></tspan>
</text>

<!-- Paragraph 4 -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«شاشة سلة التسوق» واجهة أمامية، مع أن فيها</tspan>
  <tspan x="935" dy="40">بيانات، لأن العبرة بالفعل: <tspan font-weight="bold" fill="#17457f">العرض.</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Cart screen" is frontend, even though</tspan>
  <tspan x="140" dy="40">it has data, because the verb counts:</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">displaying.</tspan></tspan>
</text>

<!-- Paragraph 5 -->
<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">«معالجة الدفع» <tspan font-weight="bold" fill="#2e7d32">واجهة خلفية،</tspan></tspan>
  <tspan x="935" dy="40">و«تخزين سجل الطلبات» قاعدة بيانات.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Payment processing" is <tspan font-weight="bold" fill="#2e7d32">backend;</tspan></tspan>
  <tspan x="140" dy="40">"storage of order history" is database.</tspan>
</text>
</svg>
