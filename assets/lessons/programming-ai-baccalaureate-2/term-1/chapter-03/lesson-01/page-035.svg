  <rect x="510" y="1215" width="60" height="18" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="510" y="1236" width="60" height="18" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="518" y="1201" width="22" height="4" rx="2" fill="#dff1f7"/>
