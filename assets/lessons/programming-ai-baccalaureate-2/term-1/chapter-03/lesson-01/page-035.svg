  <circle cx="553" cy="1245" r="3" fill="#a9dcbe"/>
  <polygon points="578,1242 582,1238 591,1247 587,1251" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="572" cy="1232" r="11" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>

  <path d="M722 1202 V1246 A28 8 0 0 0 778 1246 V1202 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
