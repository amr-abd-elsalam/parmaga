<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">ما تطبيق الويب؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">What Is a Web Application?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">&#x200F;YouTube وGmail والمتاجر الإلكترونية والخرائط</tspan>
  <tspan x="950" dy="40">على الويب كلها <tspan font-weight="bold" fill="#c0392b">تطبيقات ويب.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">YouTube, Gmail, online stores,</tspan>
  <tspan x="120" dy="40">and web maps are all <tspan font-weight="bold" fill="#c0392b">web applications.</tspan></tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تطبيق الويب</tspan> Web Application: برنامج</tspan>
  <tspan x="935" dy="40">تستخدمه غالبًا من خلال <tspan font-weight="bold" fill="#17457f">المتصفح،</tspan></tspan>
  <tspan x="935" dy="40">دون أن تثبّت برنامجًا خاصًا.</tspan>
  <tspan x="935" dy="40">وبعض تطبيقات الويب <tspan font-weight="bold" fill="#2e7d32">يمكن تثبيتها</tspan></tspan>
  <tspan x="935" dy="40">على الجهاز أيضًا.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Web application:</tspan> a program you</tspan>
  <tspan x="140" dy="40">usually use through the <tspan font-weight="bold" fill="#17457f">browser,</tspan></tspan>
  <tspan x="140" dy="40">without installing special software.</tspan>
  <tspan x="140" dy="40">Some web applications can also be</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">installed</tspan> on the device.</tspan>
</text>
</svg>
