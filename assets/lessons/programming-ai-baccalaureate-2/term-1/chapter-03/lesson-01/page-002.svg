<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">ماذا يحدث في ثانية واحدة؟</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">What Happens in One Second?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أنك كتبت في YouTube: <tspan fill="#c96a1b">«ملخص ماتش امبارح»</tspan></tspan>
  <tspan x="950" dy="40">وضغطت Enter، فظهرت أمامك قائمة فيديوهات</tspan>
  <tspan x="950" dy="40">خلال <tspan font-weight="bold" fill="#17457f">ثانية</tspan> تقريبًا.</tspan>
</text>

<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Imagine you typed <tspan fill="#c96a1b">"yesterday's match</tspan></tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">highlights"</tspan> in YouTube and pressed</tspan>
  <tspan x="120" dy="40">Enter, and a list of videos appeared</tspan>
  <tspan x="120" dy="40">in about <tspan font-weight="bold" fill="#17457f">a second.</tspan></tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">خمّن قبل أن تكمل</text>

<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">GUESS BEFORE YOU READ ON</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0">ماذا حدث <tspan font-weight="bold" fill="#17457f">خلف الشاشة</tspan> في هذه الثانية؟</tspan>
  <tspan x="935" dy="40">وكم <tspan font-weight="bold" fill="#17457f">جزءًا</tspan> اشترك في تجهيز النتيجة؟</tspan>
</text>

<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0">What happened <tspan font-weight="bold" fill="#17457f">behind the screen</tspan></tspan>
  <tspan x="140" dy="40">in that second? How many <tspan font-weight="bold" fill="#17457f">parts</tspan> worked</tspan>
  <tspan x="140" dy="40">together to prepare the result?</tspan>
</text>
</svg>
