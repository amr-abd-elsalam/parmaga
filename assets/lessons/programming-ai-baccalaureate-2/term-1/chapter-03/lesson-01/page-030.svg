<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الموقف 4:</tspan> صفحة <tspan fill="#c96a1b">حجز العيادة</tspan> تفتح،</tspan>
  <tspan x="950" dy="40">لكن لا تظهر أوقات متاحة.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Situation 4:</tspan> The <tspan fill="#c96a1b">clinic booking</tspan> page</tspan>
  <tspan x="120" dy="40">opens, but no free time slots appear.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ليس بالضرورة عطلًا: قد تكون كل المواعيد</tspan>
  <tspan x="950" dy="40">محجوزة فعلًا، أو يكون الخلل في المعالجة</tspan>
  <tspan x="950" dy="40">أو في البيانات.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Not necessarily a fault: all slots may</tspan>
  <tspan x="120" dy="40">really be booked, or the problem may be</tspan>
  <tspan x="120" dy="40">in the processing or in the data.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">درس المهندس</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">THE ENGINEER'S LESSON</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المهندس</tspan> لا يتسرع في الحكم؛</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">يجمع المعلومات أولًا</tspan> ثم <tspan font-weight="bold" fill="#2e7d32">يقرر.</tspan></tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">An <tspan font-weight="bold" fill="#c0392b">engineer</tspan> does not rush to judge;</tspan>
  <tspan x="140" dy="40">they <tspan font-weight="bold" fill="#17457f">gather information first,</tspan></tspan>
  <tspan x="140" dy="40">then <tspan font-weight="bold" fill="#2e7d32">decide.</tspan></tspan>
</text>
</svg>
