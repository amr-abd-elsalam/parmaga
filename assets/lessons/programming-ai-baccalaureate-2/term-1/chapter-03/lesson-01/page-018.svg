<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilDb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
  <linearGradient id="ilCloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
  <linearGradient id="ilBox" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fc3e8"/>
    <stop offset="1" stop-color="#2f7fb5"/>
  </linearGradient>
  <linearGradient id="ilFolder" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
</defs>

<!-- Info card: one frame group -->
<g>
  <rect x="109" y="128" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>
  <rect x="105" y="122" width="870" height="608" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
  <rect x="961" y="138" width="6" height="576" rx="3" fill="#2f7fb5"/>
</g>

<!-- Illustration: the data tier holds several kinds of storage -->
<g>
  <!-- shadows -->
  <rect x="510" y="793" width="68" height="56" rx="14" fill="#22303f" opacity=".18"/>
  <path d="M804 886 A62 20 0 0 0 928 886 L928 1026 A62 20 0 0 1 804 1026 Z" fill="#22303f" opacity=".18"/>
  <ellipse cx="866" cy="886" rx="62" ry="20" fill="#22303f" opacity=".18"/>
  <path d="M576 906 Q576 896 586 896 L629 896 L644 911 L716 911 Q726 911 726 921 L726 1036 Q726 1046 716 1046 L586 1046 Q576 1046 576 1036 Z" fill="#22303f" opacity=".18"/>
  <polygon points="369,936 399,906 509,906 509,1006 479,1036 369,1036" fill="#22303f" opacity=".18"/>
  <path d="M164 996 Q144 996 144 976 Q144 954 166 952 Q170 922 202 920 Q222 896 252 910 Q280 912 284 940 Q300 946 300 970 Q300 996 276 996 Z" fill="#22303f" opacity=".18"/>
  <rect x="132" y="1052" width="824" height="10" rx="5" fill="#22303f" opacity=".18"/>

  <!-- large green frame -->
  <rect x="110" y="770" width="860" height="466" rx="24" fill="none" stroke="#2e7d32" stroke-width="2.5"/>

  <!-- tier bus -->
  <path d="M217 815 L862 815 M862 815 L862 858 M647 815 L647 860 M435 815 L435 898 M217 815 L217 900" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="217" cy="815" r="7" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="435" cy="815" r="7" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="647" cy="815" r="7" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="862" cy="815" r="7" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>

  <!-- tier hub with stacked layers -->
  <rect x="506" y="787" width="68" height="56" rx="14" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="540,798 562,808 540,818 518,808" fill="#a9dcbe" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M518 817 L540 827 L562 817 M518 826 L540 836 L562 826" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- shelf -->
  <rect x="128" y="1046" width="824" height="10" rx="5" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>

  <!-- database cylinder -->
  <path d="M800 880 A62 20 0 0 0 924 880 L924 1020 A62 20 0 0 1 800 1020 Z" fill="url(#ilDb)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M800 925 A62 20 0 0 0 924 925 M800 970 A62 20 0 0 0 924 970" fill="none" stroke="#dff1f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M816 902 L816 1010" fill="none" stroke="#8fc9f2" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <circle cx="902" cy="916" r="4" fill="#4fc3e8"/>
  <circle cx="902" cy="962" r="4" fill="#ffd24a"/>
  <circle cx="902" cy="1008" r="4" fill="#a9dcbe"/>
  <ellipse cx="862" cy="880" rx="62" ry="20" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="856" cy="877" rx="38" ry="9" fill="#dff1f7" opacity=".6"/>

  <!-- folder with pictures -->
  <path d="M572 900 Q572 890 582 890 L625 890 L640 905 L712 905 Q722 905 722 915 L722 1030 Q722 1040 712 1040 L582 1040 Q572 1040 572 1030 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="588" y="872" width="72" height="78" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="594,930 612,904 626,918 638,908 654,930" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="642" y="862" width="70" height="88" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="648,920 666,894 682,910 706,920" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="698" cy="878" r="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M568 940 L726 940 L716 1040 L578 1040 Z" fill="url(#ilFolder)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M586 958 L708 958" fill="none" stroke="#c96a1b" stroke-width="2" stroke-linecap="round" opacity=".35"/>

  <!-- small box with lightning -->
  <path d="M335 955 L355 955 M328 980 L355 980 M335 1005 L355 1005" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="365,930 395,900 505,900 475,930" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="475,930 505,900 505,1000 475,1030" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="365" y="930" width="110" height="100" fill="url(#ilBox)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="373" y="938" width="12" height="84" rx="6" fill="#ffffff" opacity=".35"/>
  <polygon points="426,944 400,988 418,988 408,1018 444,970 426,970 438,944" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- cloud with arrow -->
  <path d="M160 990 Q140 990 140 970 Q140 948 162 946 Q166 916 198 914 Q218 890 248 904 Q276 906 280 934 Q296 940 296 964 Q296 990 272 990 Z" fill="url(#ilCloud)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M172 962 Q176 938 200 932" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <polygon points="208,996 228,996 228,1016 240,1016 218,1040 196,1016 208,1016" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Header icon: light bulb -->
<g transform="translate(650 126)">
  <circle cx="22" cy="18" r="15" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M22 10 Q16 11 15 18" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="15" y="31" width="14" height="11" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M17 36 L27 36" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Tip face: wink, in the free area beside the English paragraph -->
<g transform="translate(828 586)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Card texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">معلومة تميزك</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">GO BEYOND</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">طبقة البيانات</tspan> Data Tier أشمل من قاعدة</tspan>
  <tspan x="935" dy="40">البيانات: قد تضم قاعدة بيانات، أو تخزين</tspan>
  <tspan x="935" dy="40">ملفات وصور، أو <tspan font-weight="bold" fill="#17457f">ذاكرة مخبأة</tspan> Cache تحفظ</tspan>
  <tspan x="935" dy="40">البيانات المطلوبة كثيرًا لتصل بسرعة، أو</tspan>
  <tspan x="935" dy="40">خدمة بيانات خارجية، ويكفيك في الامتحان أن</tspan>
  <tspan x="935" dy="40">تقول «قاعدة البيانات».</tspan>
</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#c0392b">data tier</tspan> is broader than a</tspan>
  <tspan x="140" dy="40">database: it may include a database,</tspan>
  <tspan x="140" dy="40">file and image storage, a <tspan font-weight="bold" fill="#17457f">cache</tspan> that</tspan>
  <tspan x="140" dy="40">keeps frequently requested data so it</tspan>
  <tspan x="140" dy="40">arrives quickly, or an external data</tspan>
  <tspan x="140" dy="40">service; in the exam, saying</tspan>
  <tspan x="140" dy="40">"database" is enough.</tspan>
</text>

<!-- Illustration labels -->
<text x="937" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">قاعدة بيانات</text>
<text x="794" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Database</text>

<text x="718" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تخزين ملفات</text>
<text x="613" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="613" dy="0">File</tspan>
  <tspan x="587" dy="40">storage</tspan>
</text>

<text x="507" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">ذاكرة مخبأة</text>
<text x="392" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Cache</text>

<text x="289" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">خدمة خارجية</text>
<text x="149" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="149" dy="0">External</tspan>
  <tspan x="157" dy="40">service</tspan>
</text>
</svg>
