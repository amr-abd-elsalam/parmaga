<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">DEFINITION</tspan>
</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الطبقة</tspan> Tier: جزء من التطبيق</tspan>
  <tspan x="935" dy="40">له <tspan font-weight="bold" fill="#17457f">مسؤولية</tspan> محددة، وقد يعمل في مكان مستقل،</tspan>
  <tspan x="935" dy="40">كالمتصفح أو الخادم.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Tier:</tspan> a part of the app</tspan>
  <tspan x="140" dy="40">with one clear <tspan font-weight="bold" fill="#17457f">responsibility;</tspan></tspan>
  <tspan x="140" dy="40">it may run in its own place,</tspan>
  <tspan x="140" dy="40">such as the browser or the server.</tspan>
</text>
