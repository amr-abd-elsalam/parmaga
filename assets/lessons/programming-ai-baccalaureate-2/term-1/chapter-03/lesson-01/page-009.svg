<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الطبقات الثلاث</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Three Tiers</text>

<!-- Paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تذكر سؤال «الثانية الواحدة»؟</tspan>
  <tspan x="950" dy="40">الإجابة: ثلاث <tspan font-weight="bold" fill="#c0392b">طبقات</tspan> Tiers تعاونت معًا.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Remember the "one second" question?</tspan>
  <tspan x="120" dy="40">Answer: three <tspan font-weight="bold" fill="#c0392b">tiers</tspan> worked together.</tspan>
</text>

<!-- Illustration labels: Frontend -->
<text x="963" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" font-weight="bold" fill="#17457f">
