</text>
<text x="745" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">
  <tspan x="745" dy="0">Shows and</tspan>
  <tspan x="745" dy="40">collects</tspan>
</text>

