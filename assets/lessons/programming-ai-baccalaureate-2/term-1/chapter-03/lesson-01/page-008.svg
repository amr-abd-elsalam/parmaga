<!-- Section 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يدخل الزبون <tspan font-weight="bold" fill="#c0392b">المطبخ؟</tspan></tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Does the customer enter the <tspan font-weight="bold" fill="#c0392b">kitchen?</tspan></tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا، فالخلفية مخفية عن المستخدم.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No, the backend is hidden from users.</tspan>
</text>

<!-- Section 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يطبخ <tspan font-weight="bold" fill="#c0392b">الكاشير؟</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Does the <tspan font-weight="bold" fill="#c0392b">cashier</tspan> cook?</tspan>
</text>
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا. والواجهة الأمامية لا تتخذ</tspan>
  <tspan x="950" dy="40">قرارات التطبيق المهمة.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No. The frontend does not make</tspan>
  <tspan x="120" dy="40">the app's key decisions.</tspan>
</text>

<!-- Section 3 -->
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يقرر <tspan font-weight="bold" fill="#c0392b">المخزن</tspan> ما يُطبخ؟</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Does the <tspan font-weight="bold" fill="#c0392b">storeroom</tspan> decide the dish?</tspan>
</text>
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا. قاعدة البيانات تحفظ وتعطي</tspan>
  <tspan x="950" dy="40">ما يُطلب منها فقط.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No. The database only stores and</tspan>
  <tspan x="120" dy="40">gives what is asked.</tspan>
</text>

<!-- Section 4 -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ماذا لو نفد <tspan fill="#c96a1b">العدس</tspan> من المخزن؟</tspan>
</text>
<text x="120" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">What if the storeroom runs out of <tspan fill="#c96a1b">lentils?</tspan></tspan>
</text>
<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الكاشير والمطبخ يعملان، لكن الطبق لا يصل:</tspan>
  <tspan x="950" dy="40">عطل طبقة واحدة قد يوقف النتيجة كلها.</tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The cashier and kitchen work,</tspan>
  <tspan x="120" dy="40">but no plate arrives: one failed tier</tspan>
  <tspan x="120" dy="40">can stop the whole result.</tspan>
</text>
</svg>
