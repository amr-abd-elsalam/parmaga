  <rect x="704" y="1202" width="260" height="54" rx="6" fill="#22303f" opacity=".18"/>
  <path d="M 826 1170 H 942 Q 936 1200 884 1202 Q 832 1200 826 1170 Z" fill="#22303f" opacity=".18"/>
