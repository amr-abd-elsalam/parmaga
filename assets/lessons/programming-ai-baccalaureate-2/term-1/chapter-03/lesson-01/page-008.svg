  <path d="M 700 1068 H 960 V 1092 Q 947 1106 934 1092 Q 921 1106 908 1092 Q 895 1106 882 1092 Q 869 1106 856 1092 Q 843 1106 830 1092 Q 817 1106 804 1092 Q 791 1106 778 1092 Q 765 1106 752 1092 Q 739 1106 726 1092 Q 713 1106 700 1092 Z" fill="#c96a1b"/>
