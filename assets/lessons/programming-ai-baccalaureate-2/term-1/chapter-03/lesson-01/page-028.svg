<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">مين الغلطان؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Who's to Blame?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اقرأ الموقف وخمّن <tspan font-weight="bold" fill="#c0392b">الطبقة</tspan> المشتبه بها،</tspan>
  <tspan x="935" dy="40">وقل <tspan font-weight="bold" fill="#17457f">«على الأرجح»</tspan> لا «أكيد».</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Read the situation and guess the</tspan>
  <tspan x="140" dy="40">suspected <tspan font-weight="bold" fill="#c0392b">tier;</tspan> say <tspan font-weight="bold" fill="#17457f">"probably",</tspan></tspan>
  <tspan x="140" dy="40">not "certainly".</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الموقف 1:</tspan> زر <tspan fill="#c96a1b">«أضف للسلة»</tspan> لا يستجيب</tspan>
  <tspan x="950" dy="40">عند الضغط، والصفحة مشوهة.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Situation 1:</tspan> The <tspan fill="#c96a1b">"Add to cart"</tspan> button</tspan>
  <tspan x="120" dy="40">does not respond,</tspan>
  <tspan x="120" dy="40">and the page looks broken.</tspan>
</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">على الأرجح: الواجهة الأمامية،</tspan>
  <tspan x="950" dy="40">لأن العطل فيما تراه وتلمسه.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Probably: the frontend, because</tspan>
  <tspan x="120" dy="40">the fault is in what you see and touch.</tspan>
</text>
</svg>
