<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريفات</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITIONS</text>
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البيانات Data:</tspan> المعلومات التي يتعامل معها</tspan>
  <tspan x="935" dy="40">التطبيق، مثل <tspan fill="#c96a1b">أسماء المنتجات</tspan> وأسعارها</tspan>
  <tspan x="935" dy="40">والحسابات والمنشورات.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Data:</tspan> the information the app works</tspan>
  <tspan x="140" dy="40">with, such as <tspan fill="#c96a1b">product names</tspan> and</tspan>
  <tspan x="140" dy="40">prices, accounts, and posts.</tspan>
</text>
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">السجل Record:</tspan> <tspan font-weight="bold" fill="#17457f">وحدة واحدة</tspan> من البيانات</tspan>
  <tspan x="935" dy="40">المحفوظة، مثل بيانات منتج واحد</tspan>
  <tspan x="935" dy="40">أو طلب شراء واحد.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Record:</tspan> <tspan font-weight="bold" fill="#17457f">one saved unit</tspan> of data,</tspan>
  <tspan x="140" dy="40">such as the details of one product</tspan>
  <tspan x="140" dy="40">or one order.</tspan>
</text>
</svg>
