<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">معلومة تميزك</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">GO BEYOND</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">بروتوكول HTTP:</tspan> مجموعة القواعد المتفق عليها</tspan>
  <tspan x="935" dy="40">التي يتبادل بها <tspan font-weight="bold" fill="#17457f">المتصفح والخادم</tspan> الطلبات</tspan>
  <tspan x="935" dy="40">والاستجابات؛ ولذلك تبدأ عناوين</tspan>
  <tspan x="935" dy="40">المواقع بـ <tspan fill="#c96a1b">http أو https.</tspan></tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">HTTP:</tspan> the agreed set of rules</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">browser and server</tspan> use to exchange</tspan>
  <tspan x="140" dy="40">requests and responses; that is why web</tspan>
  <tspan x="140" dy="40">addresses start with <tspan fill="#c96a1b">http or https.</tspan></tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">واجهة برمجة التطبيقات API:</tspan> الباب المحدد</tspan>
  <tspan x="935" dy="40">الذي تطلب منه <tspan font-weight="bold" fill="#17457f">الواجهة الأمامية</tspan> خدمات</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الواجهة الخلفية</tspan> بطريقة متفق عليها.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">API:</tspan> the defined doorway through which</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#17457f">frontend</tspan> asks the <tspan font-weight="bold" fill="#17457f">backend</tspan> for</tspan>
  <tspan x="140" dy="40">services in an agreed way.</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">&#x200F;<tspan font-weight="bold" fill="#c0392b">SQL:</tspan> لغة تُكتب بها <tspan font-weight="bold" fill="#17457f">الاستعلامات</tspan></tspan>
  <tspan x="935" dy="40">في كثير من قواعد البيانات.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">SQL:</tspan> a language used to write</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">queries</tspan> in many databases.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">وكل هذه <tspan font-weight="bold" fill="#17457f">الرحلة</tspan> تحدث غالبًا</tspan>
  <tspan x="935" dy="40">في <tspan font-weight="bold" fill="#2e7d32">أقل من ثانية.</tspan></tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">This whole <tspan font-weight="bold" fill="#17457f">journey</tspan> usually happens</tspan>
  <tspan x="140" dy="40">in <tspan font-weight="bold" fill="#2e7d32">less than a second.</tspan></tspan>
</text>
</svg>
