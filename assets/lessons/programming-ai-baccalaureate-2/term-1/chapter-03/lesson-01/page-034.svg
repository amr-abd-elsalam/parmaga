<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Icon: chat bubble beside header line 1 -->
<g transform="translate(118 112)">
  <path d="M8 6 H48 Q54 6 54 12 V36 Q54 42 48 42 H24 L12 52 L14 42 H8 Q2 42 2 36 V12 Q2 6 8 6 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
