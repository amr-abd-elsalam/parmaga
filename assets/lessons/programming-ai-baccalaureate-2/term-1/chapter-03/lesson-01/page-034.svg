  <polygon points="33.78,8.32 43.68,18.22 49.33,12.57 39.43,2.67" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="29.54,12.56 39.44,22.46 43.68,18.22 33.78,8.32" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="9.74,32.36 19.64,42.26 39.44,22.46 29.54,12.56" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="9.74,32.36 19.64,42.26 4.79,47.21" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="4.79,47.21 6.55,41.91 10.09,45.45" fill="#22303f"/>
</g>

<!-- Success card: shadow, fill, accent in one group -->
<g>
  <rect x="109" y="992" width="870" height="152" rx="16" fill="#22303f" opacity=".12"/>
  <rect x="105" y="986" width="870" height="152" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
  <rect x="961" y="1002" width="6" height="120" rx="3" fill="#2e7d32"/>
</g>

<!-- Icon: tip star inside the card -->
<g transform="translate(180 1020)">
  <polygon points="0,-22 5.29,-7.28 20.92,-6.8 8.56,2.78 12.93,17.8 0,9 -12.93,17.8 -8.56,2.78 -20.92,-6.8 -5.29,-7.28" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Face: wink for the tip -->
<g transform="translate(870 1104)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Memory illustration: full message cycle, one group -->
<g>
  <rect x="254" y="1168" width="100" height="60" rx="6" fill="#22303f" opacity=".18"/>
  <path d="M244 1230 H364 L356 1244 H252 Z" fill="#22303f" opacity=".18"/>
  <rect x="509" y="1172" width="70" height="74" rx="5" fill="#22303f" opacity=".18"/>
  <path d="M749 1182 V1236 A35 10 0 0 0 819 1236 V1182 Z" fill="#22303f" opacity=".18"/>

  <rect x="250" y="1162" width="100" height="60" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="257" y="1169" width="86" height="46" rx="3" fill="#4fc3e8"/>
  <rect x="264" y="1176" width="42" height="12" rx="6" fill="#ffffff"/>
  <rect x="294" y="1196" width="42" height="12" rx="6" fill="#ffd24a"/>
  <path d="M240 1224 H360 L352 1238 H248 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="505" y="1166" width="70" height="22" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="505" y="1192" width="70" height="22" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="505" y="1218" width="70" height="22" rx="5" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="515" y="1175" width="26" height="4" rx="2" fill="#dff1f7"/>
  <rect x="515" y="1201" width="26" height="4" rx="2" fill="#dff1f7"/>
  <rect x="515" y="1227" width="26" height="4" rx="2" fill="#dff1f7"/>
  <circle cx="560" cy="1177" r="3.5" fill="#a9dcbe"/>
  <circle cx="560" cy="1203" r="3.5" fill="#a9dcbe"/>
  <circle cx="560" cy="1229" r="3.5" fill="#a9dcbe"/>
  <circle cx="578" cy="1166" r="13" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M571 1166 L576 1171 L585 1161" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M745 1176 V1230 A35 10 0 0 0 815 1230 V1176 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M745 1194 A35 10 0 0 0 815 1194" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M745 1212 A35 10 0 0 0 815 1212" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="780" cy="1176" rx="35" ry="10" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="820" cy="1168" r="13" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M820 1168 V1160 M820 1168 L826 1171" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="410" y="1176" width="28" height="18" rx="2" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M410 1176 L424 1186 L438 1176" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="644" y="1176" width="28" height="18" rx="2" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M644 1176 L658 1186 L672 1176" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="368" y1="1204" x2="480" y2="1204" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="492,1204 480,1197 480,1211" fill="#c0392b"/>
  <line x1="598" y1="1204" x2="718" y2="1204" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="730,1204 718,1197 718,1211" fill="#c0392b"/>
  <path d="M770 1252 Q540 1270 314 1252" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="302,1251 314,1244 316,1258" fill="#c0392b"/>
</g>

<!-- Header -->
<text x="950" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">نموذج إجابة من 6 درجات:</tspan>
  <tspan x="950" dy="36">إرسال رسالة في تطبيق محادثة على الويب</tspan>
</text>
<text x="120" y="222" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">A 6-mark model answer:</tspan>
  <tspan x="120" dy="36">sending a message in a web chat app</tspan>
</text>

<!-- Step 1 -->
<text x="950" y="294" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">1 <tspan font-weight="bold" fill="#c0392b">الواجهة الأمامية</tspan> تعرض شاشة المحادثة</tspan>
  <tspan x="950" dy="36">وتستقبل نص الرسالة.</tspan>
</text>
<text x="120" y="366" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">1 The <tspan font-weight="bold" fill="#c0392b">frontend</tspan> shows the chat screen</tspan>
  <tspan x="120" dy="36">and receives the message text.</tspan>
</text>

<!-- Step 2 -->
<text x="950" y="438" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">2 ترسل الرسالة في طلب إلى <tspan font-weight="bold" fill="#c0392b">الواجهة الخلفية.</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">2 It sends the message</tspan>
  <tspan x="120" dy="36">in a request to the <tspan font-weight="bold" fill="#c0392b">backend.</tspan></tspan>
</text>

<!-- Step 3 -->
<text x="950" y="546" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">5 <tspan font-weight="bold" fill="#c0392b">الواجهة الخلفية</tspan> تتحقق من المرسل وتحدد المستقبل.</tspan>
</text>
<text x="120" y="582" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">3 The <tspan font-weight="bold" fill="#c0392b">backend</tspan> checks the sender</tspan>
  <tspan x="120" dy="36">and determines the receiver.</tspan>
</text>

<!-- Step 4 -->
<text x="950" y="654" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">4 ترسل الرسالة إلى <tspan font-weight="bold" fill="#c0392b">قاعدة البيانات</tspan> لحفظها.</tspan>
</text>
<text x="120" y="690" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">4 It sends the message</tspan>
  <tspan x="120" dy="36">to the <tspan font-weight="bold" fill="#c0392b">database</tspan> to be saved.</tspan>
</text>

<!-- Step 5 -->
<text x="950" y="762" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">5 <tspan font-weight="bold" fill="#c0392b">قاعدة البيانات</tspan> تخزن الرسالة ووقتها وصاحبها.</tspan>
</text>
<text x="120" y="798" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">5 The <tspan font-weight="bold" fill="#c0392b">database</tspan> stores the message,</tspan>
  <tspan x="120" dy="36">its time, and its sender.</tspan>
</text>

<!-- Step 6 -->
<text x="950" y="870" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="950" dy="0">6 <tspan font-weight="bold" fill="#c0392b">الواجهة الأمامية</tspan> تعرض الرسالة في المحادثة.</tspan>
</text>
<text x="120" y="906" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="120" dy="0">6 The <tspan font-weight="bold" fill="#c0392b">frontend</tspan> displays</tspan>
  <tspan x="120" dy="36">the message in the chat.</tspan>
</text>

<!-- Success card text -->
<text x="935" y="1014" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0">نصيحة: اكتب <tspan font-weight="bold" fill="#2e7d32">بالترتيب،</tspan></tspan>
  <tspan x="935" dy="36">وأعطِ كل طبقة <tspan font-weight="bold" fill="#17457f">فعلين</tspan> من أفعالها.</tspan>
</text>
<text x="140" y="1086" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0">Tip: write <tspan font-weight="bold" fill="#2e7d32">in order,</tspan></tspan>
  <tspan x="140" dy="36">and give each tier <tspan font-weight="bold" fill="#17457f">two</tspan> of its verbs.</tspan>
</text>
</svg>
