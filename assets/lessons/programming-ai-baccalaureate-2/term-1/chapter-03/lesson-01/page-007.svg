</text>

<!-- Key sentence -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الأمامية بتعرض وتسمع،</tspan>
  <tspan x="935" dy="40">والخلفية بتفكّر وتقرر،</tspan>
  <tspan x="935" dy="40">والبيانات بتحفظ وتفتكر.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Frontend shows and listens,</tspan>
  <tspan x="140" dy="40">backend thinks and decides,</tspan>
  <tspan x="140" dy="40">data stores and remembers.</tspan>
</text>
</svg>
