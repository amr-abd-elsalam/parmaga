<text x="965" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="965" dy="0">في محل الكشري</tspan>
</text>
<text x="560" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="560" dy="0">In the koshary shop</tspan>
</text>
<text x="520" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="520" dy="0">في تطبيق الويب</tspan>
</text>
<text x="115" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">In a web application</tspan>
</text>

<!-- Row 1 -->
<text x="965" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">الزبون</tspan>
</text>
<text x="560" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="560" dy="0">Customer</tspan>
</text>
<text x="520" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="520" dy="0"><tspan font-weight="bold" fill="#17457f">المستخدم</tspan></tspan>
</text>
<text x="115" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan font-weight="bold" fill="#17457f">User</tspan></tspan>
</text>

<!-- Row 2 -->
<text x="965" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">الكاشير والشباك</tspan>
</text>
<text x="560" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="560" dy="0">Cashier and counter</tspan>
</text>
<text x="520" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="520" dy="0"><tspan font-weight="bold" fill="#17457f">الواجهة الأمامية</tspan></tspan>
</text>
<text x="115" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan font-weight="bold" fill="#17457f">Frontend</tspan></tspan>
</text>

<!-- Row 3 -->
<text x="965" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">المطبخ والطباخ</tspan>
</text>
<text x="560" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="560" dy="0">Kitchen and cook</tspan>
</text>
<text x="520" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="520" dy="0"><tspan font-weight="bold" fill="#17457f">الواجهة الخلفية</tspan></tspan>
</text>
<text x="115" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan font-weight="bold" fill="#17457f">Backend</tspan></tspan>
</text>

<!-- Row 4 -->
<text x="965" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">المخزن والثلاجة</tspan>
</text>
<text x="560" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
