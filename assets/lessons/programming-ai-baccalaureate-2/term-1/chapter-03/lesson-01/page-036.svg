<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">الخلاصة في 30 ثانية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">THE 30-SECOND SUMMARY</tspan>
</text>

<!-- Card paragraph -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ما تراه هو <tspan font-weight="bold" fill="#c0392b">الواجهة الأمامية:</tspan> تعرض وتجمع،</tspan>
  <tspan x="935" dy="40">ثم ترسل طلبك إلى <tspan font-weight="bold" fill="#c0392b">الواجهة الخلفية</tspan></tspan>
  <tspan x="935" dy="40">على الخادم: تقرر وتعالج، فتسأل</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">قاعدة البيانات:</tspan> تخزن وتسترجع،</tspan>
  <tspan x="935" dy="40">ثم تعود النتيجة في <tspan font-weight="bold" fill="#17457f">الطريق نفسه</tspan> إلى شاشتك.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">What you see is the <tspan font-weight="bold" fill="#c0392b">frontend:</tspan> it shows</tspan>
  <tspan x="140" dy="40">and collects, then sends your request to</tspan>
  <tspan x="140" dy="40">the <tspan font-weight="bold" fill="#c0392b">backend</tspan> on the server: it decides</tspan>
  <tspan x="140" dy="40">and processes, which asks the <tspan font-weight="bold" fill="#c0392b">database:</tspan></tspan>
  <tspan x="140" dy="40">it stores and retrieves; then the result</tspan>
  <tspan x="140" dy="40">returns <tspan font-weight="bold" fill="#17457f">the same way</tspan> to your screen.</tspan>
</text>

<!-- Illustration labels -->
<text x="615" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="615" dy="0">تعرض وتجمع</tspan>
</text>
<text x="461" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="461" dy="0">Shows and</tspan>
  <tspan x="461" dy="40">collects</tspan>
</text>
<text x="890" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="890" dy="0">تقرر وتعالج</tspan>
</text>
<text x="710" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="710" dy="0">Decides and</tspan>
  <tspan x="710" dy="40">processes</tspan>
</text>
<text x="360" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="360" dy="0">تخزن وتسترجع</tspan>
</text>
<text x="183" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="183" dy="0">Stores and</tspan>
  <tspan x="183" dy="40">retrieves</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الأمامية</tspan> بتعرض وتسمع،</tspan>
  <tspan x="935" dy="40">و<tspan font-weight="bold" fill="#c0392b">الخلفية</tspan> بتفكّر وتقرر،</tspan>
  <tspan x="935" dy="40">و<tspan font-weight="bold" fill="#c0392b">البيانات</tspan> بتحفظ وتفتكر.</tspan>
</text>
<text x="140" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Frontend</tspan> shows and listens,</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">backend</tspan> thinks and decides,</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">data</tspan> stores and remembers.</tspan>
</text>
</svg>
