<!-- TEXT -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">لماذا نفصل الطبقات؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Why Separate the Tiers?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تعريف</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DEFINITION</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فصل المسؤوليات</tspan> Separation of Concerns:</tspan>
  <tspan x="935" dy="40">مبدأ هندسي يجعل لكل جزء من البرنامج</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">مهمة واضحة</tspan> لا تختلط بغيرها.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Separation of concerns:</tspan></tspan>
  <tspan x="140" dy="40">an engineering principle that gives</tspan>
  <tspan x="140" dy="40">each part of a program <tspan font-weight="bold" fill="#17457f">one clear task</tspan></tspan>
  <tspan x="140" dy="40">that does not mix with others.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">يسهل اكتشاف <tspan font-weight="bold" fill="#17457f">الأعطال</tspan><tspan> وإصلاحها.</tspan></text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42"><tspan font-weight="bold" fill="#17457f">Faults</tspan><tspan> are easier to find and fix.</tspan></text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">يمكن <tspan font-weight="bold" fill="#17457f">تعديل</tspan><tspan> جزء دون أن يتأثر الباقي.</tspan></text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">One part can <tspan font-weight="bold" fill="#17457f">change</tspan></tspan>
  <tspan x="132" dy="40">without affecting the rest.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تعمل <tspan font-weight="bold" fill="#17457f">فرق مختلفة</tspan><tspan> في الوقت نفسه.</tspan></text>
<text x="132" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Different teams</tspan> can work</tspan>
  <tspan x="132" dy="40">at the same time.</tspan>
</text>
</svg>
