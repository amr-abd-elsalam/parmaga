<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Success card: shadow, fill, accent -->
<rect x="109" y="808" width="870" height="328" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="802" width="870" height="328" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="818" width="6" height="296" rx="3" fill="#2e7d32"/>

<!-- Key sentence strip -->
<rect x="105" y="1162" width="870" height="88" rx="10" fill="#fdf6d8"/>
<rect x="961" y="1178" width="6" height="56" rx="3" fill="#e0a55e"/>

<!-- Bullets: paragraph 1 -->
<circle cx="966" cy="224" r="6" fill="#2e7d32"/>
<circle cx="114" cy="344" r="6" fill="#2e7d32"/>
<!-- Bullets: paragraph 2 -->
<circle cx="966" cy="504" r="6" fill="#c0392b"/>
<circle cx="114" cy="624" r="6" fill="#c0392b"/>

<!-- Header band icons: pencil and star -->
<g transform="translate(170 128) rotate(-35)">
  <rect x="-26" y="-7" width="40" height="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="14,-7 28,0 14,7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-35" y="-7" width="9" height="14" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
</g>
<g transform="translate(245 128) scale(0.85)">
  <polygon points="0,-26 7.6,-8.5 26,-8.5 11.5,3.5 17,22 0,11.5 -17,22 -11.5,3.5 -26,-8.5 -7.6,-8.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Thinking face and light bulb beside paragraph 1 -->
<g transform="translate(825 402)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(915 404)">
  <circle cx="0" cy="-6" r="19" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-9" y="12" width="18" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="-6" y1="27" x2="6" y2="27" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="-34" x2="0" y2="-29" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="-26" y1="-20" x2="-22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="-20" x2="22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Memory illustration beside paragraph 2: balance of 3 + 3 -->
<g>
  <rect x="824" y="766" width="70" height="14" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="820" y="760" width="70" height="14" rx="6" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="851" y="652" width="8" height="110" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="765" y="656" width="180" height="8" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="855" cy="650" r="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <line x1="780" y1="664" x2="760" y2="712" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="780" y1="664" x2="800" y2="712" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="930" y1="664" x2="910" y2="712" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="930" y1="664" x2="950" y2="712" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="768" cy="705" r="6" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>
  <circle cx="780" cy="705" r="6" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>
  <circle cx="792" cy="705" r="6" fill="#2e7d32" stroke="#22303f" stroke-width="2"/>
  <circle cx="918" cy="705" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <circle cx="930" cy="705" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <circle cx="942" cy="705" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <path d="M 755 712 Q 780 734 805 712 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 905 712 Q 930 734 955 712 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Check badge in the success card -->
<g transform="translate(600 854)">
  <circle cx="4" cy="6" r="20" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="20" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -8 0 L -2 7 L 9 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">إجابة سؤال الست درجات (3 + 3)</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Answering the 6-Mark Question (3 + 3)</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#2e7d32">الفقرة 1 (القوة):</tspan> يناسب المهام القائمة</tspan>
  <tspan x="950" dy="40">على الأنماط: الأنماط، والتعرف، والتنبؤ،</tspan>
  <tspan x="950" dy="40">مع مثال لكل نقطة.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#2e7d32">Paragraph 1 (strengths):</tspan> suited to</tspan>
  <tspan x="132" dy="40">pattern-based tasks: patterns,</tspan>
  <tspan x="132" dy="40">recognition, prediction, with an</tspan>
  <tspan x="132" dy="40">example for each.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الفقرة 2 (الحذر):</tspan> الأخلاق (تحيز)،</tspan>
  <tspan x="950" dy="40">والخصوصية (بيانات شخصية)، والقرار النهائي</tspan>
  <tspan x="950" dy="40">(المسؤولية)، مع مثال لكل نقطة.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">Paragraph 2 (cautions):</tspan> ethics</tspan>
  <tspan x="132" dy="40">(bias), privacy (personal data),</tspan>
  <tspan x="132" dy="40">final decision (responsibility),</tspan>
  <tspan x="132" dy="40">with an example for each.</tspan>
</text>

<!-- Success card header -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">جملة الختام</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">Closing Sentence</text>

<!-- Success card paragraph -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لذلك يُستخدم <tspan font-weight="bold" fill="#17457f">أداةً مساعدة،</tspan> ويبقى</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#2e7d32">الحكم البشري</tspan> ضروريًا كلما ارتفع</tspan>
  <tspan x="935" dy="40">أثر القرار.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">So it is used as a <tspan font-weight="bold" fill="#17457f">helping tool,</tspan> and</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#2e7d32">human judgment</tspan> remains essential as</tspan>
  <tspan x="140" dy="40">the impact of the decision rises.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">الذكاء الاصطناعي يلاحظ، والإنسان يقرّر.</text>
<text x="140" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">AI notices; the human decides.</text>
</svg>
