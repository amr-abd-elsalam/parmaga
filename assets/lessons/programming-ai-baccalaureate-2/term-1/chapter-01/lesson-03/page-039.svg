<!-- Texts -->
<text x="950"
      y="150"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#c0392b">دورك الآن: ابحث بنفسك</text>

<text x="120"
      y="186"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#c0392b">Your Turn: Investigate</text>

<text x="935"
      y="258"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="28"
      fill="#225f9c">اختر قصة واحدة، وابحث عن <tspan font-weight="bold" fill="#17457f">مصدرها،</tspan><tspan> ثم أجب.</tspan></text>

<text x="140"
      y="294"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="27"
      fill="#152b42">
  <tspan x="140" dy="0">Choose one story, find its <tspan font-weight="bold" fill="#17457f">source,</tspan></tspan>
  <tspan x="140" dy="36">then answer.</tspan>
</text>

<text x="950"
      y="402"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="28"
      fill="#225f9c">1. ماذا حدث؟</text>

<text x="120"
      y="438"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="27"
      fill="#152b42">1. What happened?</text>

<text x="950"
      y="582"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="28"
      fill="#225f9c">
  <tspan x="950" dy="0">2. أي حرف من <tspan font-weight="bold" fill="#17457f">«بِه صَح؟»</tspan></tspan>
  <tspan x="950" dy="36">أو أي خط أحمر ينطبق عليها؟</tspan>
</text>

<text x="120"
      y="654"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="27"
      fill="#152b42">
  <tspan x="120" dy="0">2. Which letter of <tspan font-weight="bold" fill="#17457f">"Bih Sah?"</tspan> or</tspan>
  <tspan x="120" dy="36">which red line applies to it?</tspan>
</text>

<text x="950"
      y="834"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="28"
      fill="#225f9c">3. ما القاعدة التي كانت ستمنع المشكلة؟</text>

<text x="120"
      y="870"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="27"
      fill="#152b42">
  <tspan x="120" dy="0">3. What rule would have prevented</tspan>
  <tspan x="120" dy="36">the problem?</tspan>
</text>

<text x="950"
      y="1050"
      direction="rtl"
