<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Warning card shadow, fill, accent -->
<rect x="109" y="128" width="870" height="968" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="122" width="870" height="968" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="138" width="6" height="936" rx="3" fill="#c96a1b"/>

<!-- Bullets: Arabic -->
<circle cx="946" cy="224" r="6" fill="#c0392b"/>
<circle cx="946" cy="464" r="6" fill="#c0392b"/>
<circle cx="946" cy="664" r="6" fill="#c0392b"/>
<circle cx="946" cy="824" r="6" fill="#c0392b"/>
<circle cx="946" cy="944" r="6" fill="#c0392b"/>
<!-- Bullets: English -->
<circle cx="134" cy="344" r="6" fill="#c0392b"/>
<circle cx="134" cy="544" r="6" fill="#c0392b"/>
<circle cx="134" cy="744" r="6" fill="#c0392b"/>
<circle cx="134" cy="864" r="6" fill="#c0392b"/>
<circle cx="134" cy="1024" r="6" fill="#c0392b"/>

<!-- Header icons: warning triangle and thinking face -->
<g transform="translate(480 160)">
  <polygon points="0,-26 28,24 -28,24" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-3" y="-10" width="6" height="20" rx="3" fill="#22303f"/>
  <circle cx="0" cy="16" r="3.5" fill="#22303f"/>
</g>
<g transform="translate(600 160)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Memory illustration: exam traps -->
<!-- Exam paper -->
<rect x="154" y="1120" width="150" height="124" rx="8" fill="#22303f" opacity=".18"/>
<rect x="150" y="1114" width="150" height="124" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
<line x1="170" y1="1140" x2="270" y2="1140" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="1162" x2="255" y2="1162" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="1184" x2="265" y2="1184" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
<path d="M 172 1214 L 180 1222 L 194 1206" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 214 1206 L 230 1222 M 230 1206 L 214 1222" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<!-- Magnifying glass -->
<polygon points="322,1187 330,1181 362,1215 354,1221" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="300" cy="1165" r="30" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
<path d="M 284 1152 Q 292 1144 302 1145" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<!-- Road with a pit -->
<rect x="404" y="1212" width="340" height="28" rx="14" fill="#22303f" opacity=".18"/>
<rect x="400" y="1206" width="340" height="28" rx="14" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
<ellipse cx="560" cy="1220" rx="44" ry="9" fill="#3a2411"/>
<!-- Pencil walking toward the pit -->
<g transform="translate(455 1182) rotate(-15)">
  <rect x="-40" y="-8" width="70" height="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="30,-8 46,0 30,8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-50" y="-8" width="10" height="16" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
</g>
<!-- Warning sign -->
<rect x="657" y="1170" width="6" height="38" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
<polygon points="660,1116 692,1170 628,1170" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="657" y="1132" width="6" height="22" rx="3" fill="#22303f"/>
<circle cx="660" cy="1162" r="3.5" fill="#22303f"/>
<!-- Light bulb -->
<g transform="translate(800 1170)">
  <circle cx="0" cy="-6" r="19" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-9" y="12" width="18" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="-6" y1="27" x2="6" y2="27" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="-34" x2="0" y2="-29" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="-26" y1="-20" x2="-22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="-20" x2="22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- Wink face -->
<g transform="translate(885 1140)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- Check badge -->
<g transform="translate(905 1215)">
  <circle cx="4" cy="6" r="22" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -9 0 L -3 7 L 10 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخاخ الامتحان</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAPS</text>

<!-- Bullet 1 -->
<text x="930" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">المعالجة السريعة لبيانات كثيرة،</tspan>
  <tspan x="930" dy="40">والتعرف على الصور والصوت:</tspan>
  <tspan x="930" dy="40"><tspan font-weight="bold" fill="#2e7d32">نقاط قوة،</tspan> لا حذر.</tspan>
</text>
<text x="150" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">Fast processing of large data and</tspan>
  <tspan x="150" dy="40">recognizing images and audio:</tspan>
  <tspan x="150" dy="40"><tspan font-weight="bold" fill="#2e7d32">strengths,</tspan> not cautions.</tspan>
</text>

<!-- Bullet 2 -->
<text x="930" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">إيجاد الأنماط وتصنيفها: <tspan font-weight="bold" fill="#2e7d32">نقطة قوة،</tspan></tspan>
  <tspan x="930" dy="40">فهو ما «لا ينتمي» إلى الحذر.</tspan>
</text>
<text x="150" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">Finding and classifying patterns:</tspan>
  <tspan x="150" dy="40"><tspan font-weight="bold" fill="#2e7d32">a strength,</tspan> so it</tspan>
  <tspan x="150" dy="40">"does not belong" to caution.</tspan>
</text>

<!-- Bullet 3 -->
<text x="930" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0">«نترك <tspan font-weight="bold" fill="#17457f">الأحكام الأخلاقية</tspan> بالكامل</tspan>
  <tspan x="930" dy="40">للذكاء الاصطناعي»: ×</tspan>
</text>
<text x="150" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">"Leave <tspan font-weight="bold" fill="#17457f">ethical judgments</tspan> entirely</tspan>
  <tspan x="150" dy="40">to AI": ×</tspan>
</text>

<!-- Bullet 4 -->
<text x="930" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الترجمة الآلية <tspan font-weight="bold" fill="#17457f">تلقائية،</tspan><tspan> لا بشرية.</tspan></text>
<text x="150" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0">Machine translation is <tspan font-weight="bold" fill="#17457f">automatic,</tspan></tspan>
  <tspan x="150" dy="40">not human.</tspan>
</text>

<!-- Bullet 5 -->
<text x="930" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#17457f">التشخيص بالصور</tspan> للرعاية الصحية،</tspan>
  <tspan x="930" dy="40">والآفات للزراعة.</tspan>
</text>
<text x="150" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0"><tspan font-weight="bold" fill="#17457f">Image diagnosis</tspan> is healthcare;</tspan>
  <tspan x="150" dy="40">pests are agriculture.</tspan>
</text>
</svg>
