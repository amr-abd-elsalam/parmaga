<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilSkyDecision" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
</defs>

<!-- Icon: warning triangle (AI mistake) -->
<g transform="translate(870 300)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Icon: check badge (responsibility) -->
<g transform="translate(790 584)">
  <circle cx="28" cy="28" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M18 28 L25 35 L39 21" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: hand with pen over signature card (signing) -->
<g transform="translate(880 584)">
  <rect x="4" y="22" width="40" height="30" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M10 42 C 15 32, 19 48, 24 38 C 28 32, 32 46, 38 40" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 34 L46 12 L52 17 L36 39 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 34 L36 39 L28 42 Z" fill="#22303f"/>
  <path d="M42 18 C 44 8, 54 6, 55 14 C 56 22, 50 26, 45 24 Z" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Face: smile (examples) -->
<g transform="translate(902 834)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: a machine suggests, a person signs and owns the decision -->
<g>
  <rect x="109" y="910" width="870" height="334" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="904" width="870" height="334" rx="24" fill="url(#ilSkyDecision)"/>
  <path d="M105 1206 H975 V1214 Q975 1238 951 1238 H129 Q105 1238 105 1214 Z" fill="#dff1f7"/>
  <line x1="105" y1="1206" x2="975" y2="1206" stroke="#7f95ab" stroke-width="2"/>

  <!-- Sun and clouds -->
  <circle cx="920" cy="944" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="190" cy="944" rx="32" ry="11" fill="#ffffff"/>
  <ellipse cx="218" cy="936" rx="20" ry="11" fill="#ffffff"/>
  <ellipse cx="790" cy="946" rx="28" ry="10" fill="#ffffff"/>

  <!-- Responsibility badge above the person -->
  <circle cx="308" cy="972" r="24" fill="#22303f" opacity=".18"/>
  <circle cx="304" cy="966" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M293 966 L301 974 L316 958" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating icons: graduation cap, coin, stethoscope -->
  <rect x="410" y="994" width="40" height="16" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="430,972 472,988 430,1004 388,988" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M430 988 L462 998 V1014" fill="none" stroke="#ffd24a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="462" cy="1016" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>

  <circle cx="544" cy="996" r="22" fill="#22303f" opacity=".18"/>
  <circle cx="540" cy="990" r="22" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="990" r="14" fill="none" stroke="#c96a1b" stroke-width="2.5"/>
  <rect x="537" y="981" width="6" height="18" rx="3" fill="#c96a1b"/>

  <path d="M630 970 V990 Q630 1010 650 1010 Q670 1010 670 990 V970" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M650 1010 C 650 1030, 668 1036, 680 1030" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="630" cy="968" r="4" fill="#22303f"/>
  <circle cx="670" cy="968" r="4" fill="#22303f"/>
  <circle cx="688" cy="1028" r="10" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="688" cy="1028" r="4" fill="#ffffff"/>

  <!-- Chair back -->
  <rect x="226" y="1076" width="18" height="104" rx="6" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>

  <!-- Person: torso and head -->
  <rect x="262" y="1072" width="84" height="104" rx="16" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="294" y="1072" width="20" height="10" rx="4" fill="#17457f"/>
  <circle cx="304" cy="1044" r="24" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M280 1040 Q 282 1016 304 1016 Q 326 1016 328 1040 Q 316 1028 280 1040 Z" fill="#2b211c"/>
  <circle cx="296" cy="1046" r="2.5" fill="#22303f"/>
  <circle cx="312" cy="1046" r="2.5" fill="#22303f"/>
  <path d="M296 1054 Q 304 1060 312 1054" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow from laptop to the suggestion card -->
  <line x1="726" y1="1100" x2="556" y2="1100" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="542,1100 556,1092 556,1108" fill="#c0392b"/>

  <!-- Desk -->
  <rect x="200" y="1182" width="14" height="24" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="886" y="1182" width="14" height="24" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="174" y="1174" width="760" height="10" rx="4" fill="#22303f" opacity=".18"/>
  <rect x="170" y="1166" width="760" height="16" rx="4" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>

  <!-- Suggestion card on the desk -->
  <rect x="414" y="1124" width="120" height="44" rx="5" fill="#22303f" opacity=".18"/>
  <rect x="410" y="1118" width="120" height="48" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="424" y="1128" width="70" height="4" rx="2" fill="#7f95ab"/>
  <rect x="424" y="1138" width="50" height="4" rx="2" fill="#7f95ab"/>
  <path d="M432 1156 C 440 1146, 446 1162, 456 1152 C 464 1146, 470 1160, 486 1152" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="512" cy="1150" r="8" fill="#2e7d32"/>
  <path d="M508 1150 L511 1153 L516 1147" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arm, pen, and hand signing -->
  <polygon points="334,1082 348,1094 424,1148 414,1160" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="424,1158 450,1124 456,1129 430,1162" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="422" cy="1152" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

  <!-- Laptop with gear on its screen -->
  <rect x="744" y="1056" width="150" height="100" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="740" y="1050" width="150" height="100" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="752" y="1062" width="126" height="76" rx="4" fill="#8fc9f2"/>
  <g transform="translate(815 1100)">
    <g><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(60)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(120)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(180)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(240)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(300)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <circle cx="0" cy="0" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#22303f"/>
  </g>
  <polygon points="726,1150 904,1150 914,1166 716,1166" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <rect x="105" y="904" width="870" height="334" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">القرار النهائي والمسؤولية</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Final Decision and Accountability</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">عندما يخطئ الذكاء الاصطناعي، من يُحاسَب؟</tspan>
  <tspan x="950" dy="40">الآلة <tspan font-weight="bold" fill="#17457f">لا تُحاسَب</tspan> ولا تعتذر.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">When AI makes a mistake, who is held</tspan>
  <tspan x="120" dy="40">accountable? A machine <tspan font-weight="bold" fill="#17457f">cannot be held</tspan></tspan>
  <tspan x="120" dy="40">accountable or apologize.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لذلك يجب أن يوقّع على <tspan font-weight="bold" fill="#17457f">القرارات عالية الأثر</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">إنسانٌ</tspan> يتحمل مسؤوليتها.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So <tspan font-weight="bold" fill="#17457f">high-impact decisions</tspan> must be</tspan>
  <tspan x="120" dy="40">signed by <tspan font-weight="bold" fill="#2e7d32">a person</tspan> who takes</tspan>
  <tspan x="120" dy="40">responsibility for them.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أمثلة: قبول طالب في <tspan fill="#c96a1b">منحة،</tspan> أو منح <tspan fill="#c96a1b">قرض،</tspan></tspan>
  <tspan x="950" dy="40">أو تشخيص <tspan fill="#c96a1b">مرض.</tspan></tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Examples: accepting a student for a</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">scholarship,</tspan> granting a <tspan fill="#c96a1b">loan,</tspan> or</tspan>
  <tspan x="120" dy="40">diagnosing a <tspan fill="#c96a1b">disease.</tspan></tspan>
</text>
</svg>
