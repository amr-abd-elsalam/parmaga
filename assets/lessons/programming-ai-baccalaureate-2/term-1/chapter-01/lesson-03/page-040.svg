<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17457f"/>
    <stop offset="1" stop-color="#2f7fb5"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Table shadow -->
<rect x="99" y="202" width="890" height="860" rx="12" fill="#22303f" opacity=".12"/>
<!-- Table fill -->
<rect x="95" y="196" width="890" height="860" rx="12" fill="#fffdf7"/>
<!-- Header row background -->
<rect x="95" y="196" width="890" height="100" rx="12" fill="#fdf6d8"/>
<rect x="95" y="246" width="890" height="50" fill="#fdf6d8"/>
<!-- Zebra rows -->
<rect x="95" y="476" width="890" height="180" fill="#fbf6e9"/>
<rect x="95" y="876" width="890" height="180" rx="12" fill="#fbf6e9"/>
<rect x="95" y="876" width="890" height="30" fill="#fbf6e9"/>

<!-- Separators -->
<line x1="685" y1="196" x2="685" y2="1056" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="296" x2="985" y2="296" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="476" x2="985" y2="476" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="656" x2="985" y2="656" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="876" x2="985" y2="876" stroke="#c0392b" stroke-width="1.4"/>
<!-- Table frame -->
<rect x="95" y="196" width="890" height="860" rx="12" fill="none" stroke="#c0392b" stroke-width="2"/>

<!-- Title icons -->
<g transform="translate(150 108)">
  <polygon points="0,-26 7.6,-8.5 26,-8.5 11.5,3.5 17,22 0,11.5 -17,22 -11.5,3.5 -26,-8.5 -7.6,-8.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(930 104)">
  <circle cx="0" cy="-6" r="19" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-9" y="12" width="18" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="-6" y1="27" x2="6" y2="27" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="-34" x2="0" y2="-29" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="-26" y1="-20" x2="-22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="-20" x2="22" y2="-17" stroke="#c96a1b" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Memory illustration: night review scene -->
<!-- Alarm clock -->
<g>
  <circle cx="176" cy="1118" r="14" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="244" cy="1118" r="14" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <line x1="182" y1="1200" x2="172" y2="1220" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="238" y1="1200" x2="248" y2="1220" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="214" cy="1166" r="46" fill="#22303f" opacity=".18"/>
  <circle cx="210" cy="1160" r="46" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="210" cy="1124" r="3" fill="#22303f"/>
  <circle cx="246" cy="1160" r="3" fill="#22303f"/>
  <circle cx="210" cy="1196" r="3" fill="#22303f"/>
  <circle cx="174" cy="1160" r="3" fill="#22303f"/>
  <line x1="210" y1="1160" x2="210" y2="1134" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="1160" x2="228" y2="1170" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210" cy="1160" r="4" fill="#22303f"/>
</g>
<!-- Night window with desk -->
<g>
  <rect x="334" y="1086" width="420" height="150" rx="18" fill="#22303f" opacity=".18"/>
  <rect x="330" y="1080" width="420" height="150" rx="18" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="400" cy="1122" r="20" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="394" cy="1116" r="4" fill="#f0c48c"/>
  <circle cx="407" cy="1129" r="3" fill="#f0c48c"/>
  <g transform="translate(470 1104)"><polygon points="0,-9 2.6,-3 9,-3 4,1.5 6,8 0,4.5 -6,8 -4,1.5 -9,-3 -2.6,-3" fill="#ffd24a"/></g>
  <g transform="translate(520 1138)"><polygon points="0,-9 2.6,-3 9,-3 4,1.5 6,8 0,4.5 -6,8 -4,1.5 -9,-3 -2.6,-3" fill="#ffffff"/></g>
  <g transform="translate(590 1102)"><polygon points="0,-9 2.6,-3 9,-3 4,1.5 6,8 0,4.5 -6,8 -4,1.5 -9,-3 -2.6,-3" fill="#ffd24a"/></g>
  <g transform="translate(640 1132)"><polygon points="0,-9 2.6,-3 9,-3 4,1.5 6,8 0,4.5 -6,8 -4,1.5 -9,-3 -2.6,-3" fill="#ffffff"/></g>
  <g transform="translate(710 1104)"><polygon points="0,-9 2.6,-3 9,-3 4,1.5 6,8 0,4.5 -6,8 -4,1.5 -9,-3 -2.6,-3" fill="#ffd24a"/></g>
  <!-- Lamp light -->
  <polygon points="700,1158 590,1210 700,1210" fill="#ffd24a" opacity=".35"/>
  <!-- Desk -->
  <rect x="314" y="1216" width="460" height="24" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="310" y="1210" width="460" height="24" rx="6" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <!-- Open book -->
  <path d="M 455 1210 L 465 1172 Q 500 1164 540 1178 L 540 1210 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 625 1210 L 615 1172 Q 580 1164 540 1178 L 540 1210 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="472" y1="1186" x2="530" y2="1190" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="470" y1="1198" x2="530" y2="1201" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="550" y1="1190" x2="608" y2="1186" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <line x1="550" y1="1201" x2="610" y2="1198" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <!-- Lamp -->
  <polyline points="690,1204 670,1162 698,1140" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 690 1128 L 728 1146 L 716 1164 L 680 1146 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="690" cy="1206" rx="26" ry="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
</g>
<!-- Smile face and check badge -->
<g transform="translate(850 1140)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(915 1200)">
  <circle cx="4" cy="6" r="24" fill="#22303f" opacity=".18"/>
  <circle cx="0" cy="0" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -10 0 L -3 8 L 11 -7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">مراجعة ليلة الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Night-Before-the-Exam Review</text>

<!-- Header row -->
<text x="965" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">السؤال</text>
<text x="703" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Question</text>
<text x="667" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">المفتاح</text>
<text x="115" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Key</text>

<!-- Row 1 -->
<text x="965" y="334" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">خدمات الحياة</tspan>
  <tspan x="965" dy="40">اليومية؟</tspan>
</text>
<text x="703" y="414" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="703" dy="0">Daily-life</tspan>
  <tspan x="703" dy="40">services?</tspan>
</text>
<text x="667" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">وجه ← صوت ← ترجمة ← توصية</text>
<text x="115" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Face → voice →</tspan>
  <tspan x="115" dy="40">translation → recommendation</tspan>
</text>

<!-- Row 2 -->
<text x="965" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">الصناعات</tspan>
  <tspan x="965" dy="40">الأربع؟</tspan>
</text>
<text x="703" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="703" dy="0">The four</tspan>
  <tspan x="703" dy="40">industries?</tspan>
</text>
<text x="667" y="534" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">حقل ← مصنع ← طريق ← مستشفى</text>
<text x="115" y="574" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Field → factory →</tspan>
  <tspan x="115" dy="40">road → hospital</tspan>
</text>

<!-- Row 3 -->
<text x="965" y="734" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">فيمَ يبرع؟</text>
<text x="703" y="774" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="703" dy="0">What is it</tspan>
  <tspan x="703" dy="40">good at?</tspan>
</text>
<text x="667" y="694" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="667" dy="0">يلتقط النمط، يعرف الشكل،</tspan>
  <tspan x="667" dy="40">يتوقع القادم</tspan>
</text>
<text x="115" y="774" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Spots the pattern,</tspan>
  <tspan x="115" dy="40">knows the shape,</tspan>
  <tspan x="115" dy="40">predicts what's next</tspan>
</text>

<!-- Row 4 -->
<text x="965" y="934" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">متى نحذر؟</text>
<text x="703" y="974" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="703" dy="0">When to be</tspan>
  <tspan x="703" dy="40">careful?</tspan>
</text>
<text x="667" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="667" dy="0">أخلاق، خصوصية،</tspan>
  <tspan x="667" dy="40">قرار + <tspan font-weight="bold" fill="#c0392b">«بِه صَح؟»</tspan></tspan>
</text>
<text x="115" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Ethics, privacy,</tspan>
  <tspan x="115" dy="40">decision + <tspan font-weight="bold" fill="#c0392b">"Bih Sah?"</tspan></tspan>
</text>
</svg>
