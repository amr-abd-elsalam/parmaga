  <polygon points="0,-32 7.6,-10.5 30.4,-9.9 12.4,4 18.8,25.9 0,13 -18.8,25.9 -12.4,4 -30.4,-9.9 -7.6,-10.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
