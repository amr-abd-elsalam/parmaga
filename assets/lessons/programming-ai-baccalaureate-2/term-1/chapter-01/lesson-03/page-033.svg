<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">حقوق المؤلف</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Copyright</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الحق القانوني</tspan> لصاحب العمل، مثل كتاب أو صورة</tspan>
  <tspan x="950" dy="40">أو أغنية، في <tspan font-weight="bold" fill="#17457f">التحكم في استخدام</tspan> عمله.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#c0392b">legal right</tspan> of a work's owner,</tspan>
  <tspan x="120" dy="40">such as a book, image, or song,</tspan>
  <tspan x="120" dy="40">to <tspan font-weight="bold" fill="#17457f">control how the work is used.</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كثير من النماذج تدرّبت على <tspan font-weight="bold" fill="#17457f">أعمال محمية،</tspan></tspan>
  <tspan x="950" dy="40">والسؤال <tspan font-weight="bold" fill="#c0392b">ما زال مطروحًا:</tspan> هل هذا من حقها؟</tspan>
  <tspan x="950" dy="40">وكيف يأخذ صاحب العمل حقه؟</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Many models were trained on</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">protected works,</tspan> and the question is</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">still open:</tspan> do they have the right?</tspan>
  <tspan x="120" dy="40">And how does the owner get their due?</tspan>
</text>
</svg>
