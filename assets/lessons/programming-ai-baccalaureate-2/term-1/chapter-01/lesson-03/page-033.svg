<g transform="translate(412 1179)">
  <path d="M28 4 L50 12 V28 C 50 40, 40 48, 28 52 C 16 48, 6 40, 6 28 V12 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
