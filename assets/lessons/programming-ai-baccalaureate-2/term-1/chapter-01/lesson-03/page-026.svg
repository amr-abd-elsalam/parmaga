<!-- Icon: balance scale (ethics) -->
<g transform="translate(870 462)">
  <rect x="26" y="10" width="4" height="38" fill="#17457f"/>
  <rect x="14" y="46" width="28" height="6" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <line x1="8" y1="16" x2="48" y2="16" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="2" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="18" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
