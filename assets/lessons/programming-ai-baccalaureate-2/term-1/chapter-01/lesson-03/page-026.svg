</defs>

<!-- Key sentence strip -->
<rect x="109" y="208" width="870" height="168" rx="10" fill="#22303f" opacity=".12"/>
<rect x="105" y="202" width="870" height="168" rx="10" fill="#fdf6d8"/>
<rect x="961" y="218" width="6" height="136" rx="3" fill="#e0a55e"/>

<!-- Strip icon: warning triangle -->
