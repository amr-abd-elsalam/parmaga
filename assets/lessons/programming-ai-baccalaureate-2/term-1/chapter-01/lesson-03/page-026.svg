  <circle cx="28" cy="10" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: padlock (privacy) -->
<g transform="translate(870 622)">
  <path d="M14 28 V18 A14 14 0 0 1 42 18 V28 H35 V18 A7 7 0 0 0 21 18 V28 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
