  <path d="M30 34 L36 39 L28 42 Z" fill="#22303f"/>
  <path d="M42 18 C 44 8, 54 6, 55 14 C 56 22, 50 26, 45 24 Z" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Illustration: road with three red lines -->
<g>
  <rect x="109" y="910" width="866" height="340" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="904" width="870" height="346" rx="24" fill="#e8dfd1"/>
  <path d="M105 990 V928 Q105 904 129 904 H951 Q975 904 975 928 V990 Z" fill="url(#ilSky)"/>
  <circle cx="905" cy="942" r="22" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="210" cy="940" rx="34" ry="12" fill="#ffffff"/>
  <ellipse cx="240" cy="932" rx="22" ry="12" fill="#ffffff"/>
  <ellipse cx="700" cy="930" rx="28" ry="10" fill="#ffffff"/>
  <path d="M105 990 C 200 958, 300 958, 420 990 Z" fill="#8fc9f2"/>
  <path d="M660 990 C 770 955, 880 958, 975 980 V990 Z" fill="#8fc9f2"/>

  <polygon points="515,990 565,990 750,1246 330,1246" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="538,1035 542,1035 543,1060 537,1060" fill="#ffffff"/>
  <polygon points="536,1100 544,1100 546,1140 534,1140" fill="#ffffff"/>

  <polygon points="493,1020 587,1020 591,1026 489,1026" fill="#c0392b"/>
  <polygon points="450,1080 630,1080 637,1090 443,1090" fill="#c0392b"/>
  <polygon points="392,1160 688,1160 699,1176 381,1176" fill="#c0392b"/>

  <!-- Sign 1: balance scale -->
  <rect x="296" y="1126" width="8" height="60" rx="2" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="254" y="1056" width="100" height="76" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="250" y="1050" width="100" height="76" rx="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(272 1060)">
    <rect x="26" y="10" width="4" height="38" fill="#17457f"/>
    <rect x="14" y="46" width="28" height="6" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <line x1="8" y1="16" x2="48" y2="16" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="2" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="18" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="16" x2="38" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="46" y1="16" x2="54" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M2 34 Q10 44 18 34 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M38 34 Q46 44 54 34 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="28" cy="10" r="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Sign 2: padlock -->
  <rect x="722" y="1068" width="6" height="34" rx="2" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="692" y="1018" width="74" height="56" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="688" y="1012" width="74" height="56" rx="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(701 1016) scale(.85)">
    <path d="M14 28 V18 A14 14 0 0 1 42 18 V28 H35 V18 A7 7 0 0 0 21 18 V28 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="8" y="26" width="40" height="28" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="28" cy="37" r="4" fill="#22303f"/>
    <rect x="26.5" y="38" width="3" height="9" rx="1.5" fill="#22303f"/>
  </g>

  <!-- Sign 3: hand with pen over signature card -->
  <rect x="416" y="1008" width="5" height="22" rx="2" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="390" y="964" width="64" height="50" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="386" y="958" width="64" height="50" rx="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(397 961) scale(.75)">
    <rect x="4" y="22" width="40" height="30" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <path d="M10 42 C 15 32, 19 48, 24 38 C 28 32, 32 46, 38 40" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 34 L46 12 L52 17 L36 39 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M30 34 L36 39 L28 42 Z" fill="#22303f"/>
    <path d="M42 18 C 44 8, 54 6, 55 14 C 56 22, 50 26, 45 24 Z" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Delivery cart with gear, stopped before the first line -->
  <rect x="494" y="1196" width="100" height="44" rx="8" fill="#22303f" opacity=".18"/>
  <path d="M590 1200 L606 1188" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="490" y="1190" width="100" height="44" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="490" y="1190" width="100" height="10" rx="5" fill="#17457f"/>
  <circle cx="510" cy="1237" r="9" fill="#22303f"/>
  <circle cx="570" cy="1237" r="9" fill="#22303f"/>
  <circle cx="510" cy="1237" r="3.5" fill="#ffffff"/>
  <circle cx="570" cy="1237" r="3.5" fill="#ffffff"/>
  <g transform="translate(540 1214)">
    <g><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(60)"><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(120)"><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(180)"><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(240)"><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(300)"><rect x="-3" y="-17" width="6" height="7" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <circle cx="0" cy="0" r="11" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#22303f"/>
  </g>

  <rect x="105" y="904" width="870" height="346" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">متى نحذر؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">When Should We Be Careful?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الخطوط الحمراء الثلاثة:</tspan>
  <tspan x="935" dy="40">أخلاق، خصوصية، قرار</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The three red lines:</tspan>
  <tspan x="140" dy="40">ethics, privacy, decision</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأخلاق:</tspan> قد يظلم الحكم الآلي بعض الناس.</tspan>
</text>
<text x="132" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Ethics:</tspan> an automated judgment may</tspan>
  <tspan x="132" dy="40">be unfair to some people.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخصوصية:</tspan> يتعامل مع بياناتك الشخصية والحساسة.</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Privacy:</tspan> it handles your personal</tspan>
  <tspan x="132" dy="40">and sensitive data.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">القرار النهائي:</tspan> إذا أخطأ،</tspan>
  <tspan x="950" dy="40">فمن المسؤول عن النتيجة؟</tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Final decision:</tspan> if it is wrong,</tspan>
  <tspan x="132" dy="40">who is responsible for the result?</tspan>
</text>
</svg>
