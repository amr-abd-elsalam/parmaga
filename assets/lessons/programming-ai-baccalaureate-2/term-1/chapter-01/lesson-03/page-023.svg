  <polyline points="195,876 232,860 270,872 290,905 270,935 240,958 214,985 240,1006 275,1002 306,980 334,955 364,935 396,918" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#22303f" stroke-width="2.5">
    <circle cx="195" cy="876" r="9" fill="#2f7fb5"/>
    <circle cx="232" cy="860" r="9" fill="#4fc3e8"/>
    <circle cx="270" cy="872" r="9" fill="#c96a1b"/>
    <circle cx="290" cy="905" r="9" fill="#2e7d32"/>
    <circle cx="270" cy="935" r="9" fill="#ffd24a"/>
    <circle cx="240" cy="958" r="9" fill="#2f7fb5"/>
    <circle cx="214" cy="985" r="9" fill="#4fc3e8"/>
    <circle cx="240" cy="1006" r="9" fill="#c96a1b"/>
    <circle cx="275" cy="1002" r="9" fill="#2e7d32"/>
    <circle cx="306" cy="980" r="9" fill="#ffd24a"/>
    <circle cx="334" cy="955" r="9" fill="#2f7fb5"/>
    <circle cx="364" cy="935" r="9" fill="#4fc3e8"/>
    <circle cx="396" cy="918" r="9" fill="#c96a1b"/>
  </g>
</g>

<!-- Scientist in a lab coat -->
<rect x="425" y="1086" width="14" height="16" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
<rect x="398" y="1098" width="68" height="92" rx="16" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
<polygon points="418,1100 446,1100 432,1130" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M418 1100 L426 1146 M446 1100 L438 1146" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="432" cy="1070" r="22" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
<path d="M410 1066 Q 412 1044 432 1044 Q 452 1044 454 1066 Q 444 1054 432 1056 Q 420 1056 410 1066 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="437" cy="1069" r="3" fill="#22303f"/>
<circle cx="449" cy="1069" r="3" fill="#22303f"/>
<path d="M438 1080 Q 444 1084 450 1080" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="456,1108 468,1116 516,1160 506,1168" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Laptop showing the folded shape -->
<rect x="525" y="1086" width="120" height="80" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<rect x="533" y="1094" width="104" height="64" rx="3" fill="#dff1f7"/>
<polyline points="545,1146 562,1110 582,1140 602,1106 626,1144" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="545" cy="1146" r="4" fill="#c96a1b"/>
<circle cx="562" cy="1110" r="4" fill="#2e7d32"/>
<circle cx="582" cy="1140" r="4" fill="#ffd24a"/>
<circle cx="602" cy="1106" r="4" fill="#4fc3e8"/>
<circle cx="626" cy="1144" r="4" fill="#c96a1b"/>
<polygon points="505,1178 665,1178 655,1166 515,1166" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="512" cy="1166" r="7" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>

<!-- Medicine capsule beside the laptop -->
<g transform="translate(705 1165) rotate(-25)">
  <path d="M0 -9 L-11 -9 A9 9 0 0 0 -11 9 L0 9 Z" fill="#c96a1b"/>
  <path d="M0 -9 L11 -9 A9 9 0 0 1 11 9 L0 9 Z" fill="#ffffff"/>
  <rect x="-20" y="-9" width="40" height="18" rx="9" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Desk -->
<rect x="320" y="1188" width="10" height="48" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="770" y="1188" width="10" height="48" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="300" y="1178" width="500" height="12" rx="4" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>

<rect x="105" y="842" width="866" height="404" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>

<!-- Header icon: flask -->
<g transform="translate(120 92)">
  <path d="M21 4 L21 20 L7 45 Q5 50 10 50 L42 50 Q47 50 45 45 L31 20 L31 4 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 36 L39 36 L44 45 Q46 48 42 48 L10 48 Q6 48 8 45 Z" fill="#4fc3e8"/>
  <circle cx="22" cy="42" r="3" fill="#ffffff"/>
  <circle cx="31" cy="40" r="2" fill="#ffffff"/>
  <rect x="17" y="2" width="18" height="6" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon beside the short paragraph line: molecule -->
<g transform="translate(880 322)">
  <path d="M12 32 L30 12 L48 30 L28 44 Z" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="12" cy="32" r="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="30" cy="12" r="8" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="48" cy="30" r="8" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="44" r="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Face in the card: surprise for an important fact -->
<g transform="translate(440 455) scale(.8)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">دعم اكتشاف الأدوية</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Drug-Discovery Support</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يساعد الذكاء الاصطناعي العلماء على <tspan font-weight="bold" fill="#17457f">تسريع</tspan></tspan>
  <tspan x="950" dy="40">البحث عن <tspan font-weight="bold" fill="#c0392b">أدوية جديدة.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">AI helps scientists <tspan font-weight="bold" fill="#17457f">speed up</tspan> the search</tspan>
  <tspan x="120" dy="40">for <tspan font-weight="bold" fill="#c0392b">new medicines.</tspan></tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">هل تعلم؟</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">DID YOU KNOW?</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في 2024، كان ديميس هاسابيس وجون جمبر</tspan>
  <tspan x="935" dy="40">ضمن الفائزين <tspan font-weight="bold" fill="#17457f">بجائزة نوبل</tspan> في الكيمياء،</tspan>
  <tspan x="935" dy="40">عن <tspan font-weight="bold" fill="#c0392b">AlphaFold2،</tspan> وهو نموذج ذكاء اصطناعي</tspan>
  <tspan x="935" dy="40">يتنبأ <tspan font-weight="bold" fill="#17457f">بتركيب البروتينات.</tspan></tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In 2024, Demis Hassabis and John Jumper</tspan>
  <tspan x="140" dy="40">were among the <tspan font-weight="bold" fill="#17457f">Chemistry Nobel</tspan> winners</tspan>
  <tspan x="140" dy="40">for <tspan font-weight="bold" fill="#c0392b">AlphaFold2,</tspan> an AI model that</tspan>
  <tspan x="140" dy="40">predicts <tspan font-weight="bold" fill="#17457f">protein structures.</tspan></tspan>
</text>
</svg>
