  <line x1="420" y1="210" x2="660" y2="210" stroke="#7fa8cf" stroke-width="2.4"/>

  <text x="540" y="158"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#1d4e89">اقرأ ثم أجب</text>

  <text x="540" y="196"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#2b4a6f">Read and Answer</text>

  <text x="962" y="262"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a4f8a">
    <tspan x="962" dy="0">يُستخدم الذكاء الاصطناعي على نطاق واسع في حياتنا اليومية. على سبيل</tspan>
    <tspan x="962" dy="32">المثال، تستخدم توصيات مقاطع الفيديو التي تناسب تفضيلات</tspan>
    <tspan x="962" dy="32">المستخدم نظام (أ). كما تستخدم تقنية (ب) عند التحدث إلى هاتف</tspan>
    <tspan x="962" dy="32">ذكي لتشغيله، بينما تحوّل تقنية (ج) نصًا بلغة أجنبية إلى اللغة</tspan>
    <tspan x="962" dy="32">الأم للمستخدم.</tspan>
  </text>

  <text x="118" y="428"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#14283f">
    <tspan x="118" dy="0">AI is widely used in our daily lives. For example,</tspan>
    <tspan x="118" dy="28">recommendations of videos that match the user’s</tspan>
    <tspan x="118" dy="28">preferences use an (a) system. A (b) technology is used</tspan>
    <tspan x="118" dy="28">when speaking to a smartphone to operate it, and (c)</tspan>
    <tspan x="118" dy="28">converts foreign-language text into one’s native language.</tspan>
  </text>

  <text x="950" y="606"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#1d4e89">السؤال الأول</text>

  <text x="750" y="606"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#8a94a0">|</text>

  <text x="734" y="606"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="end"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#14283f">Question One</text>

  <text x="950" y="650"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f8a">أكمل الفراغات (أ–ج).</text>

  <text x="120" y="686"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#14283f">Fill in the blanks (a–c).</text>

  <text x="338" y="752"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#2e7d32">(أ)</text>
  <text x="222" y="752"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">(a)</text>

  <text x="598" y="752"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#2e7d32">(ب)</text>
  <text x="482" y="752"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">(b)</text>

  <text x="858" y="752"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#2e7d32">(ج)</text>
  <text x="742" y="752"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">(c)</text>

  <text x="950" y="814"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#1d4e89">السؤال الثاني</text>

  <text x="736" y="814"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#8a94a0">|</text>

  <text x="720" y="814"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="end"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#14283f">Question Two</text>

  <text x="950" y="854"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f8a">اختر كل ما يتطلب الحذر عند استخدام الذكاء الاصطناعي.</text>

  <text x="120" y="888"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#14283f">Choose all that require caution when using AI.</text>

  <text x="896" y="930"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1d4e89">.1</text>
  <text x="872" y="930"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a4f8a">المعالجة عالية السرعة لكميات كبيرة من البيانات.</text>
  <text x="120" y="960"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#14283f">High-speed processing of large amounts of data.</text>

  <text x="896" y="990"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1d4e89">.2</text>
  <text x="872" y="990"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a4f8a">الأحكام الأخلاقية.</text>
  <text x="120" y="1020"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#14283f">Ethical judgments.</text>

  <text x="896" y="1050"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1d4e89">.3</text>
  <text x="872" y="1050"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a4f8a">القرارات التي تشمل المعلومات الشخصية أو الخصوصية.</text>
  <text x="120" y="1080"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#14283f">Judgments involving personal information or privacy.</text>

  <text x="896" y="1110"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1d4e89">.4</text>
  <text x="872" y="1110"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a4f8a">التعرّف على الصور والصوت.</text>
  <text x="120" y="1140"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#14283f">Recognition of images and audio.</text>

</svg>
