<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الصيانة التنبؤية</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Predictive Maintenance</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">حساسات</tspan> تجمع بيانات الماكينة، مثل <tspan fill="#c96a1b">الاهتزاز</tspan></tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">والحرارة،</tspan> فيتوقع الذكاء الاصطناعي عطلها</tspan>
  <tspan x="950" dy="40">قبل أن يحدث، ليصلحها الفني في الوقت المناسب.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Sensors</tspan> collect machine data, such as</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">vibration and heat,</tspan> so AI can predict</tspan>
  <tspan x="120" dy="40">a failure before it happens and a</tspan>
  <tspan x="120" dy="40">technician can fix it in time.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">انتبه: <tspan font-weight="bold" fill="#c0392b">الصيانة التنبؤية</tspan> لأعطال الماكينات</tspan>
  <tspan x="935" dy="40">والمعدات، أما عيوب المنتجات فيكشفها</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">فحص الجودة.</tspan></tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Note: <tspan font-weight="bold" fill="#c0392b">predictive maintenance</tspan> is about</tspan>
  <tspan x="140" dy="40">machine and equipment failures;</tspan>
  <tspan x="140" dy="40">product defects are found by</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">quality inspection.</tspan></tspan>
</text>
</svg>
