  <rect x="67" y="92" width="946" height="1086" fill="none" stroke="#c0392b" stroke-width="2.4"/>

  <rect x="88" y="222" width="904" height="340" rx="14" fill="#fdf6d6" stroke="#d8c179" stroke-width="1.8"/>

