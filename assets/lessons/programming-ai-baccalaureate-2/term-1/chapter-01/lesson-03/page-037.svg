<!-- Texts -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">القصة 2: أداة التوظيف المتحيزة (التحيز)</text>

<text x="120"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">Story 2: The Biased</tspan>
  <tspan x="120" dy="40">Hiring Tool (Bias)</tspan>
</text>

<text x="950"
      y="274"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">بحسب تقرير لوكالة <tspan fill="#c96a1b">Reuters</tspan> سنة 2018،</tspan>
  <tspan x="950" dy="40">اكتشف متخصصون في أمازون أن أداة توظيف</tspan>
  <tspan x="950" dy="40">تجريبية تقيّم المتقدمين <tspan font-weight="bold" fill="#c0392b">بتحيز ضد النساء،</tspan></tspan>
  <tspan x="950" dy="40">فتخلّت الشركة عنها.</tspan>
</text>

<text x="120"
      y="434"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">According to a 2018 <tspan fill="#c96a1b">Reuters</tspan> report,</tspan>
  <tspan x="120" dy="40">specialists at Amazon found that</tspan>
  <tspan x="120" dy="40">an experimental hiring tool rated</tspan>
  <tspan x="120" dy="40">applicants <tspan font-weight="bold" fill="#c0392b">with bias against women,</tspan></tspan>
  <tspan x="120" dy="40">so the company dropped it.</tspan>
</text>

<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">فكّر لحظة</text>

<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">THINK FOR A MOMENT</text>

<text x="935"
      y="754"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">من أين تعلّمت الآلة هذا <tspan font-weight="bold" fill="#c0392b">التحيز؟</tspan></text>

<text x="140"
      y="794"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Where did the machine learn</tspan>
  <tspan x="140" dy="40">this <tspan font-weight="bold" fill="#c0392b">bias</tspan> from?</tspan>
</text>
</svg>
