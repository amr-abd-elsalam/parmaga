<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">رحلة حبة الطماطم:</tspan>
  <tspan x="540" dy="48">الذكاء الاصطناعي في الصناعة</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">A Tomato's Journey: AI in Industry</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تابع حبة طماطم واحدة في رحلتها، وستمر</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">أربع صناعات</tspan> تستخدم <tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي.</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Follow one tomato's journey: it passes</tspan>
  <tspan x="120" dy="40">through <tspan font-weight="bold" fill="#17457f">four industries</tspan> that use <tspan font-weight="bold" fill="#c0392b">AI.</tspan></tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المحطة 1: الحقل (الزراعة)</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Stop 1: The Field (Agriculture)</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">طائرة مسيّرة</tspan> صغيرة تصوّر الزرع من أعلى،</tspan>
