  <rect x="19" y="19" width="18" height="18" rx="3" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Illustration: an ordinary morning full of AI -->
<g>
  <rect x="125" y="890" width="830" height="356" rx="30" fill="url(#ilSky)"/>
  <circle cx="420" cy="930" r="6" fill="#ffd24a"/>
  <circle cx="680" cy="925" r="5" fill="#8fc9f2"/>
  <circle cx="170" cy="1060" r="5" fill="#a9dcbe"/>
  <circle cx="910" cy="1070" r="6" fill="#ffd24a"/>
  <ellipse cx="540" cy="1236" rx="150" ry="8" fill="#22303f" opacity=".18"/>

  <!-- dotted links from phone to bubbles -->
  <line x1="540" y1="1117" x2="800" y2="975" stroke="#2f7fb5" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 10"/>
  <line x1="540" y1="1117" x2="280" y2="975" stroke="#2f7fb5" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 10"/>
