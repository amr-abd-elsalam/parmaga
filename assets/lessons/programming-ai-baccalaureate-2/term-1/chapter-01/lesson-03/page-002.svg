  <rect x="67" y="92" width="946" height="1226" rx="7" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <rect x="105" y="780" width="870" height="380" rx="16" fill="#fdf6dc" stroke="#d9bf62" stroke-width="2"/>

  <text x="540" y="176"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#1b3a63">الذكاء الاصطناعي في الحياة اليومية والصناعة</text>

  <text x="540" y="220"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">AI in Daily Life and Industry</text>

  <line x1="420" y1="238" x2="660" y2="238" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

  <text x="950" y="288"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">أصبح الذكاء الاصطناعي جزءًا من خدمات كثيرة نستخدمها</tspan>
    <tspan x="950" dy="40">يوميًا، كما يُستخدم في مجالات صناعية متعددة. يستطيع</tspan>
    <tspan x="950" dy="40">العثور على أنماط في البيانات والتنبؤ بالنتائج، لكنه لا</tspan>
    <tspan x="950" dy="40">يناسب كل مهمة، وبعض استخداماته تحتاج إلى الحذر</tspan>
    <tspan x="950" dy="40">والإشراف البشري.</tspan>
  </text>

  <text x="120" y="496"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="120" dy="0">AI is already part of many services we use every</tspan>
    <tspan x="120" dy="34">day, and it is also used across various industries.</tspan>
    <tspan x="120" dy="34">It can find patterns in data and predict outcomes,</tspan>
    <tspan x="120" dy="34">but it is not suitable for every task, and some uses</tspan>
    <tspan x="120" dy="34">require caution and human oversight.</tspan>
  </text>

