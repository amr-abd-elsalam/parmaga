  <path d="M504 990 Q500 950 540 948 Q582 950 576 990 Q566 968 540 966 Q516 968 504 990 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="527" cy="998" r="3" fill="#22303f"/>
  <circle cx="553" cy="998" r="3" fill="#22303f"/>
  <path d="M531 1012 Q540 1017 549 1012" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="516" y="1078" width="48" height="78" rx="8" fill="#22303f"/>
  <rect x="521" y="1085" width="38" height="62" rx="4" fill="#4fc3e8"/>
  <circle cx="522" cy="1128" r="10" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="558" cy="1128" r="10" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

  <!-- small question mark above the head -->
  <path d="M580 912 Q580 900 592 900 Q604 900 604 911 Q604 919 595 923 Q592 925 592 932" fill="none" stroke="#c96a1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="592" cy="942" r="3.5" fill="#c96a1b"/>
