        font-size="26"
        font-weight="bold"
        fill="#a87a12">Learning Objectives</text>

  <text x="586" y="824"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#a87a12">|</text>

  <text x="780" y="824"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#a87a12">أهداف التعلم</text>

  <line x1="140" y1="842" x2="940" y2="842" stroke="#dfcc8a" stroke-width="2"/>

  <circle cx="952" cy="874" r="5" fill="#c0392b"/>
  <text x="930" y="882"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#225f9c">
    <tspan x="930" dy="0">التعرّف على أمثلة لاستخدام الذكاء الاصطناعي</tspan>
    <tspan x="930" dy="34">في الحياة اليومية والصناعة.</tspan>
  </text>

  <text x="150" y="952"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="150" dy="0">Identify examples of AI use in daily life</tspan>
    <tspan x="150" dy="32">and industry.</tspan>
  </text>

  <circle cx="952" cy="1018" r="5" fill="#c0392b"/>
  <text x="930" y="1026"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#225f9c">
    <tspan x="930" dy="0">توضيح ما يبرع فيه الذكاء الاصطناعي وما يتطلب</tspan>
    <tspan x="930" dy="34">الحذر عند استخدامه.</tspan>
  </text>

  <text x="150" y="1096"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="150" dy="0">Explain what AI is good at and what requires</tspan>
    <tspan x="150" dy="32">caution when using it.</tspan>
  </text>

