<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الدرس في جملة واحدة</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Whole Lesson in One Sentence</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">اعترف! استخدمته كام مرة النهارده؟</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Be honest! How many times</tspan>
  <tspan x="120" dy="40">did you use it today?</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قبل أن نبدأ، عُدّ على أصابعك:</tspan>
  <tspan x="950" dy="40">كم مرة استخدمت <tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي</tspan> اليوم؟</tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Before we start, count on your fingers:</tspan>
  <tspan x="120" dy="40">how many times did you use <tspan font-weight="bold" fill="#c0392b">AI</tspan> today?</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">إذا فتحت هاتفك <tspan fill="#c96a1b">بوجهك،</tspan> أو شاهدت فيديو</tspan>
  <tspan x="950" dy="40">اقترحه التطبيق، فقد <tspan font-weight="bold" fill="#17457f">استخدمته</tspan> دون أن تنتبه.</tspan>
</text>

<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If your phone unlocked with your <tspan fill="#c96a1b">face</tspan></tspan>
  <tspan x="120" dy="40">or an app suggested a video,</tspan>
  <tspan x="120" dy="40">you already <tspan font-weight="bold" fill="#17457f">used AI</tspan>.</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">الذكاء الاصطناعي يلاحظ، والإنسان يقرّر.</text>

<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">AI notices; the human decides.</text>
</svg>
