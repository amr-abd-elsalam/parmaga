  <circle cx="800" cy="1160" r="62" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="280" cy="1160" r="62" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>

  <!-- top right: face in scanning frame -->
  <path d="M768 963 L768 943 L788 943" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M812 943 L832 943 L832 963" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M832 987 L832 1007 L812 1007" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M788 1007 L768 1007 L768 987" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="800" cy="975" rx="17" ry="22" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="793" cy="970" r="2.5" fill="#22303f"/>
  <circle cx="807" cy="970" r="2.5" fill="#22303f"/>
  <path d="M794 984 Q800 988 806 984" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="762" y1="975" x2="838" y2="975" stroke="#4fc3e8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- top left: three video thumbnails, one highlighted -->
  <rect x="229" y="963" width="28" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <polygon points="239,969 239,981 249,975" fill="#2f7fb5"/>
  <rect x="264" y="959" width="32" height="32" rx="5" fill="#ffd24a" stroke="#c96a1b" stroke-width="3"/>
  <polygon points="275,968 275,982 287,975" fill="#c96a1b"/>
  <rect x="303" y="963" width="28" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <polygon points="313,969 313,981 323,975" fill="#2f7fb5"/>

  <!-- bottom right: two scribble cards with two-way arrow -->
  <rect x="750" y="1138" width="32" height="44" rx="4" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
  <path d="M756 1150 Q761 1146 766 1150 T776 1150" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <path d="M756 1160 Q761 1156 766 1160 T776 1160" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <path d="M756 1170 Q761 1166 766 1170" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <rect x="818" y="1138" width="32" height="44" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <path d="M824 1150 Q829 1146 834 1150 T844 1150" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <path d="M824 1160 Q829 1156 834 1160 T844 1160" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <path d="M824 1170 Q829 1166 834 1170" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <line x1="789" y1="1160" x2="811" y2="1160" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="785,1160 792,1155 792,1165" fill="#2e7d32"/>
  <polygon points="815,1160 808,1155 808,1165" fill="#2e7d32"/>

  <!-- bottom left: curved sound waves -->
  <circle cx="250" cy="1160" r="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M266 1144 Q278 1160 266 1176" fill="none" stroke="#17457f" stroke-width="3" stroke-linecap="round"/>
  <path d="M280 1132 Q298 1160 280 1188" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M294 1120 Q318 1160 294 1200" fill="none" stroke="#4fc3e8" stroke-width="3" stroke-linecap="round"/>

  <!-- student -->
  <path d="M470 1236 L470 1090 Q470 1050 510 1045 L570 1045 Q610 1050 610 1090 L610 1236 Z" fill="url(#ilShirt)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="528" y="1022" width="24" height="26" rx="6" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M478 1065 Q462 1120 500 1140 L528 1128 L522 1112 L500 1118 Q492 1100 498 1070 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
