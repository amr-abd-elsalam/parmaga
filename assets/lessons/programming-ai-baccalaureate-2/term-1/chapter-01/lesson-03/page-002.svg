  <line x1="46" y1="18" x2="54" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="28" x2="54" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="38" x2="54" y2="38" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
