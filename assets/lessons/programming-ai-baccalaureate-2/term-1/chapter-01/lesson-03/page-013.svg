<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c6836"/>
      <stop offset="0.55" stop-color="#87552a"/>
      <stop offset="1" stop-color="#a3713d"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#faf4e5"/>
    </linearGradient>
  </defs>

  <!-- 1) الخلفية الخشبية البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0,250 C 300,205 720,300 1080,255" stroke="#5d3c1b" stroke-width="24" fill="none" opacity="0.08"/>
  <path d="M0,1090 C 340,1140 730,1045 1080,1100" stroke="#5d3c1b" stroke-width="22" fill="none" opacity="0.07"/>

  <!-- 2) الورقة -->
  <rect x="42" y="40" width="1012" height="1290" rx="8" fill="#3a2411" opacity="0.18"/>
  <rect x="34" y="30" width="1012" height="1290" rx="8" fill="url(#paperTone)"/>

  <!-- 3) سطور الكراسة الزرقاء الباهتة -->
  <g stroke="#cfe1f0" stroke-width="1.4">
    <line x1="76" y1="104" x2="1004" y2="104"/>
    <line x1="76" y1="140" x2="1004" y2="140"/>
    <line x1="76" y1="176" x2="1004" y2="176"/>
    <line x1="76" y1="212" x2="1004" y2="212"/>
    <line x1="76" y1="248" x2="1004" y2="248"/>
    <line x1="76" y1="284" x2="1004" y2="284"/>
    <line x1="76" y1="320" x2="1004" y2="320"/>
    <line x1="76" y1="356" x2="1004" y2="356"/>
    <line x1="76" y1="392" x2="1004" y2="392"/>
    <line x1="76" y1="428" x2="1004" y2="428"/>
    <line x1="76" y1="464" x2="1004" y2="464"/>
    <line x1="76" y1="500" x2="1004" y2="500"/>
    <line x1="76" y1="536" x2="1004" y2="536"/>
    <line x1="76" y1="572" x2="1004" y2="572"/>
    <line x1="76" y1="608" x2="1004" y2="608"/>
    <line x1="76" y1="644" x2="1004" y2="644"/>
    <line x1="76" y1="680" x2="1004" y2="680"/>
    <line x1="76" y1="716" x2="1004" y2="716"/>
    <line x1="76" y1="752" x2="1004" y2="752"/>
    <line x1="76" y1="788" x2="1004" y2="788"/>
    <line x1="76" y1="824" x2="1004" y2="824"/>
    <line x1="76" y1="860" x2="1004" y2="860"/>
    <line x1="76" y1="896" x2="1004" y2="896"/>
    <line x1="76" y1="932" x2="1004" y2="932"/>
    <line x1="76" y1="968" x2="1004" y2="968"/>
    <line x1="76" y1="1004" x2="1004" y2="1004"/>
    <line x1="76" y1="1040" x2="1004" y2="1040"/>
    <line x1="76" y1="1076" x2="1004" y2="1076"/>
    <line x1="76" y1="1112" x2="1004" y2="1112"/>
    <line x1="76" y1="1148" x2="1004" y2="1148"/>
    <line x1="76" y1="1184" x2="1004" y2="1184"/>
    <line x1="76" y1="1220" x2="1004" y2="1220"/>
    <line x1="76" y1="1256" x2="1004" y2="1256"/>
  </g>

  <!-- 4) الإطار الأحمر الخارجي الوحيد -->
  <rect x="67" y="70" width="946" height="1226" rx="6" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <!-- 5) خلفيات البطاقات -->
  <rect x="95" y="176" width="890" height="546" rx="16" fill="#eaf6ea" fill-opacity="0.88" stroke="#79b97c" stroke-width="1.8"/>
  <rect x="95" y="742" width="890" height="424" rx="16" fill="#fdf1de" fill-opacity="0.9" stroke="#e0a04a" stroke-width="1.8"/>
  <rect x="112" y="758" width="195" height="42" rx="10" fill="#f6c98a" fill-opacity="0.55" stroke="#dd9433" stroke-width="1.4"/>

  <!-- 6) خطوط الإجابة الوظيفية -->
  <line x1="130" y1="968" x2="950" y2="968" stroke="#9db4c7" stroke-width="2"/>
  <line x1="130" y1="1148" x2="950" y2="1148" stroke="#9db4c7" stroke-width="2"/>

  <!-- 7) النصوص التعليمية -->

  <!-- العنوانان -->
  <text x="540" y="112" direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#16466f">حل الصح والخطأ ثم جرّب بنفسك</text>
  <text x="540" y="150" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#41648a">True-or-False Solution and Try It Yourself</text>

  <!-- البند A -->
  <text x="118" y="216" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">A —</text>
  <text x="232" y="216" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">صح</text>
  <text x="242" y="216" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">| True</text>
  <text x="958" y="216" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="958" dy="0">يبرع الذكاء الاصطناعي في الاستدلال</tspan>
    <tspan x="958" dy="36">الاحتمالي والتنبؤ اعتمادًا على البيانات.</tspan>
  </text>
  <text x="118" y="288" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="118" dy="0">AI is good at probabilistic reasoning and</tspan>
    <tspan x="118" dy="30">prediction based on data.</tspan>
  </text>

  <!-- البند B -->
  <text x="118" y="352" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">B —</text>
  <text x="232" y="352" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">صح</text>
  <text x="242" y="352" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">| True</text>
  <text x="958" y="352" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="958" dy="0">يبرع الذكاء الاصطناعي في التعرّف على</tspan>
    <tspan x="958" dy="36">الصور والصوت والنصوص.</tspan>
  </text>
  <text x="118" y="424" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="118" dy="0">AI is good at recognizing images, audio, and text.</tspan>
  </text>

  <!-- البند C -->
  <text x="118" y="458" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#c0392b">C —</text>
  <text x="236" y="458" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#c0392b">خطأ</text>
  <text x="246" y="458" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#c0392b">| False</text>
  <text x="958" y="458" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="958" dy="0">قد تؤدي أحكام الذكاء الاصطناعي إلى التمييز أو</tspan>
    <tspan x="958" dy="36">التحيز؛ لذلك لا ينبغي ترك الأحكام الأخلاقية له بالكامل.</tspan>
  </text>
  <text x="118" y="530" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="118" dy="0">AI judgments can lead to discrimination or prejudice,</tspan>
    <tspan x="118" dy="30">so ethical judgments should not be left entirely to AI.</tspan>
  </text>

  <!-- البند D -->
  <text x="118" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">D —</text>
  <text x="232" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">صح</text>
  <text x="242" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e7e34">| True</text>
  <text x="958" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="958" dy="0">يؤثر التحيز في بيانات التدريب في دقة</tspan>
    <tspan x="958" dy="36">أحكام الذكاء الاصطناعي.</tspan>
  </text>
  <text x="118" y="666" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="118" dy="0">Bias in training data affects the accuracy</tspan>
    <tspan x="118" dy="30">of AI judgments.</tspan>
  </text>

  <!-- عنوان قسم التجربة -->
  <text x="190" y="788" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#b9670c">جرّب</text>
  <text x="200" y="788" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="30" font-weight="bold" fill="#b9670c">| Try</text>

  <!-- السؤال الأول -->
  <text x="928" y="832" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#b9670c">.1</text>
  <text x="912" y="832" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="912" dy="0">ما اسم النظام الذي يتنبأ بالتفضيلات</tspan>
    <tspan x="912" dy="36">من بيانات السلوك السابق ويعرض التوصيات؟</tspan>
  </text>
  <text x="120" y="904" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="120" dy="0">What is the term for a system that predicts preferences</tspan>
    <tspan x="120" dy="30">from past behavior data and displays recommendations?</tspan>
  </text>

  <!-- السؤال الثاني -->
  <text x="928" y="1012" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#b9670c">.2</text>
  <text x="912" y="1012" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#1a5a96">
    <tspan x="912" dy="0">ما اسم تقنية الذكاء الاصطناعي التي تتعرّف</tspan>
    <tspan x="912" dy="36">على الصوت، وتفهم الأوامر، وتنفذها؟</tspan>
  </text>
  <text x="120" y="1084" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <tspan x="120" dy="0">What is the term for the AI technology that recognizes</tspan>
    <tspan x="120" dy="30">a voice, understands commands, and executes them?</tspan>
  </text>

</svg>
