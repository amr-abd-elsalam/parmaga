<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Illustration shadow -->
<rect x="124" y="838" width="840" height="318" rx="20" fill="#22303f" opacity=".18"/>

<!-- Key sentence strip -->
<rect x="105" y="722" width="870" height="88" rx="10" fill="#fdf6d8"/>
<rect x="961" y="738" width="6" height="56" rx="3" fill="#e0a55e"/>

<!-- Icon: AI chip beside paragraph 2 -->
<g transform="translate(200 436)">
  <g stroke="#22303f" stroke-width="2.5" stroke-linecap="round">
    <line x1="18" y1="3" x2="18" y2="10"/>
    <line x1="28" y1="3" x2="28" y2="10"/>
    <line x1="38" y1="3" x2="38" y2="10"/>
    <line x1="18" y1="46" x2="18" y2="53"/>
    <line x1="28" y1="46" x2="28" y2="53"/>
    <line x1="38" y1="46" x2="38" y2="53"/>
    <line x1="3" y1="18" x2="10" y2="18"/>
    <line x1="3" y1="28" x2="10" y2="28"/>
    <line x1="3" y1="38" x2="10" y2="38"/>
    <line x1="46" y1="18" x2="53" y2="18"/>
    <line x1="46" y1="28" x2="53" y2="28"/>
    <line x1="46" y1="38" x2="53" y2="38"/>
  </g>
  <rect x="10" y="10" width="36" height="36" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="19" y="19" width="18" height="18" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
