<!-- Emotion face: smile beside paragraph 1 -->
<g transform="translate(900 366)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: listens, understands, acts -->
<g>
  <rect x="120" y="832" width="840" height="318" rx="20" fill="url(#ilBg)"/>

  <g transform="translate(0 -6)">
    <!-- Circle shadows -->
    <circle cx="784" cy="956" r="80" fill="#22303f" opacity=".18"/>
    <circle cx="544" cy="956" r="80" fill="#22303f" opacity=".18"/>
    <circle cx="304" cy="956" r="80" fill="#22303f" opacity=".18"/>

    <!-- Circles -->
    <circle cx="780" cy="950" r="80" fill="url(#ilC1)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="540" cy="950" r="80" fill="url(#ilC2)" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="300" cy="950" r="80" fill="url(#ilC3)" stroke="#22303f" stroke-width="2.5"/>

    <!-- Arrows right to left -->
    <line x1="688" y1="950" x2="642" y2="950" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="628,950 642,941 642,959" fill="#c0392b"/>
    <line x1="448" y1="950" x2="402" y2="950" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="388,950 402,941 402,959" fill="#c0392b"/>

    <!-- Step 1: ear with sound waves -->
    <g transform="translate(750 950)">
      <path d="M -22 -8 Q -22 -46 10 -46 Q 40 -46 40 -12 Q 40 8 24 20 Q 14 28 14 40 Q 14 54 0 54 Q -14 54 -16 42 Q -18 30 -22 -8 Z" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -6 -8 Q -6 -28 10 -28 Q 24 -28 24 -12 Q 24 0 14 6" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M 800 925 Q 812 950 800 975" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 815 912 Q 832 950 815 988" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 830 900 Q 852 950 830 1000" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Step 2: speech bubble with gear -->
    <path d="M 502 905 H 578 Q 600 905 600 927 V 963 Q 600 985 578 985 H 526 L 500 1008 L 506 985 H 502 Q 480 985 480 963 V 927 Q 480 905 502 905 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <g transform="translate(540 945)">
      <rect x="-5" y="-27" width="10" height="54" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <g transform="rotate(45)">
        <rect x="-5" y="-27" width="10" height="54" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(90)">
        <rect x="-5" y="-27" width="10" height="54" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(135)">
        <rect x="-5" y="-27" width="10" height="54" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <circle cx="0" cy="0" r="19" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    </g>

    <!-- Step 3: smartphone with sun and cloud -->
    <rect x="264" y="884" width="72" height="128" rx="12" fill="#22303f"/>
    <rect x="271" y="896" width="58" height="104" rx="6" fill="#4fc3e8"/>
    <line x1="294" y1="912" x2="294" y2="916" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="276" y1="930" x2="280" y2="930" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="281" y1="917" x2="284" y2="920" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="307" y1="917" x2="304" y2="920" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="294" cy="930" r="11" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <path d="M 292 966 Q 286 966 286 959 Q 286 952 294 952 Q 296 942 306 942 Q 316 942 318 950 Q 324 950 324 958 Q 324 966 318 966 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="284" y="976" width="32" height="6" rx="3" fill="#ffffff"/>
    <rect x="290" y="988" width="20" height="6" rx="3" fill="#dff1f7"/>
  </g>

  <rect x="120" y="832" width="840" height="318" rx="20" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Bottom icon group -->
<g transform="translate(404 1182)">
  <polygon points="28,4 33.9,19.9 50.8,20.6 37.5,31.1 42.1,47.4 28,38 13.9,47.4 18.5,31.1 5.2,20.6 22.1,19.9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(512 1182)">
  <line x1="10" y1="42" x2="46" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="42" x2="28" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="42" x2="28" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="10" cy="42" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="46" cy="42" r="8" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
</g>
<g transform="translate(620 1182)">
  <circle cx="28" cy="28" r="24" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الساعة 7:05 صباحًا — المساعد الصوتي</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">7:05 a.m. — Voice Assistant</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تسأل هاتفك: «الجو عامل إيه النهارده؟»</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">فيرد عليك.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You ask your phone, "What's the weather</tspan>
  <tspan x="120" dy="40">like today?" and it <tspan font-weight="bold" fill="#2e7d32">answers you.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المساعد الصوتي</tspan> يعمل في <tspan font-weight="bold" fill="#17457f">ثلاث خطوات:</tspan></tspan>
  <tspan x="950" dy="40">يتعرف على صوتك ويحوّله إلى نص،</tspan>
  <tspan x="950" dy="40">ثم يفهم المطلوب، ثم ينفّذه.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">voice assistant</tspan> works in <tspan font-weight="bold" fill="#17457f">three steps:</tspan></tspan>
  <tspan x="120" dy="40">it recognizes your voice and turns it</tspan>
  <tspan x="120" dy="40">into text, understands the request,</tspan>
  <tspan x="120" dy="40">then carries it out.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">احفظها: يسمع، يفهم، ينفّذ.</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">Remember: it listens, understands, acts.</text>

<!-- Illustration labels -->
<text x="810" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">يسمع</text>
<text x="724" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Listens</text>
<text x="570" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">يفهم</text>
<text x="452" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Understands</text>
<text x="331" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">ينفّذ</text>
<text x="268" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Acts</text>
</svg>
