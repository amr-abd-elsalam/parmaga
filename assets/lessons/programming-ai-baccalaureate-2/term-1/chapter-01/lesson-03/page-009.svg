<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b87c42"/>
      <stop offset="0.55" stop-color="#a06a35"/>
      <stop offset="1" stop-color="#87582b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0 250 C 300 210, 780 300, 1080 240" stroke="#6f471f" stroke-width="10" fill="none" opacity="0.12"/>
  <path d="M0 1080 C 320 1130, 760 1020, 1080 1090" stroke="#6f471f" stroke-width="12" fill="none" opacity="0.10"/>

  <rect x="42" y="34" width="1012" height="1298" rx="8" fill="#7a4d24" opacity="0.28"/>
  <rect x="34" y="26" width="1012" height="1298" rx="6" fill="url(#paperGrad)"/>

  <g stroke="#bcd6ea" stroke-width="1.4" opacity="0.55">
