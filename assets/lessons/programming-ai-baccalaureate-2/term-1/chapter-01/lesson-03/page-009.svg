    <line x1="92" y1="990" x2="988" y2="990"/>
    <line x1="92" y1="1028" x2="988" y2="1028"/>
    <line x1="92" y1="1066" x2="988" y2="1066"/>
    <line x1="92" y1="1104" x2="988" y2="1104"/>
    <line x1="92" y1="1142" x2="988" y2="1142"/>
  </g>

  <rect x="67" y="58" width="946" height="1258" rx="5" fill="none" stroke="#c0392b" stroke-width="2.4"/>

  <text x="540" y="120"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#17456f">نشاط استكشافي: الذكاء الاصطناعي من حولنا</text>

  <text x="540" y="164"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="31"
        fill="#2b6ca3">Explore: AI Around Us</text>

  <rect x="95" y="195" width="890" height="236" rx="14" fill="#fdf6dc" stroke="#e0c66a" stroke-width="2"/>

  <text x="950" y="240"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#8a6a12">السؤال الموجّه | Guiding Question</text>

  <text x="950" y="285"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5fa8">
    <tspan x="950" dy="0">أين يُستخدم الذكاء الاصطناعي في الحياة اليومية</tspan>
    <tspan x="950" dy="38">والصناعة؟ وما الذي يبرع فيه؟ وما الذي يتطلب الحذر؟</tspan>
  </text>

  <text x="130" y="367"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="130" dy="0">Where is AI used in daily life and industry,</tspan>
    <tspan x="130" dy="32">what is AI good at, and what needs caution?</tspan>
  </text>

  <rect x="95" y="471" width="890" height="558" rx="14" fill="#eef5fd" stroke="#9dc2e6" stroke-width="2"/>

  <text x="950" y="516"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#14507e">استكشف مع زميل | Explore in Pairs</text>

  <text x="950" y="559"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5fa8">
    <tspan x="950" dy="0">بالتعاون مع زميل، اذكر ثلاث خدمات استخدمتها هذا</tspan>
    <tspan x="950" dy="38">الأسبوع وتعتقد أنها تستخدم الذكاء الاصطناعي، مثل</tspan>
    <tspan x="950" dy="38">توصية بمقطع فيديو، أو مساعد صوتي، أو تطبيق للترجمة.</tspan>
  </text>

  <text x="130" y="677"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="130" dy="0">With a partner, list three services you used</tspan>
    <tspan x="130" dy="32">this week that you think used AI, such as a video</tspan>
    <tspan x="130" dy="32">recommendation, a voice assistant, or a</tspan>
    <tspan x="130" dy="32">translation app.</tspan>
  </text>

  <text x="950" y="817"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5fa8">
    <tspan x="950" dy="0">لكل خدمة، توقّع البيانات التي يحتاج إليها الذكاء</tspan>
    <tspan x="950" dy="38">الاصطناعي لأداء مهمته، ثم حددا أي خدمة ستكون</tspan>
    <tspan x="950" dy="38">عاقبة الخطأ فيها أكبر.</tspan>
  </text>

  <text x="130" y="935"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="130" dy="0">For each service, predict what data the AI needed</tspan>
    <tspan x="130" dy="32">to do its job. Then decide which service would</tspan>
    <tspan x="130" dy="32">matter most if it made a mistake.</tspan>
  </text>

  <rect x="701" y="1058" width="283" height="100" rx="10" fill="#fffdf6" stroke="#9db9d2" stroke-width="2"/>
  <circle cx="952" cy="1088" r="17" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="952" y="1097"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">1</text>

  <rect x="398" y="1058" width="283" height="100" rx="10" fill="#fffdf6" stroke="#9db9d2" stroke-width="2"/>
  <circle cx="649" cy="1088" r="17" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="649" y="1097"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">2</text>

  <rect x="95" y="1058" width="283" height="100" rx="10" fill="#fffdf6" stroke="#9db9d2" stroke-width="2"/>
  <circle cx="346" cy="1088" r="17" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="346" y="1097"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#2e7d32">3</text>

</svg>
