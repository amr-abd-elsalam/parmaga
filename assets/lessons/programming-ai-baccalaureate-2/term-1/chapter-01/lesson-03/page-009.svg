<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">النمط</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Pattern</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">تكرار</tspan> أو <tspan font-weight="bold" fill="#17457f">علاقة ثابتة</tspan> في البيانات،</tspan>
  <tspan x="950" dy="40">مثل: من يشاهد <tspan fill="#c96a1b">مباراة كرة</tspan> يبحث بعدها</tspan>
  <tspan x="950" dy="40">غالبًا عن ملخصها.</tspan>
</text>

<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">repeated</tspan> <tspan font-weight="bold" fill="#17457f">relationship</tspan> in data, like:</tspan>
  <tspan x="120" dy="40">people who watch a <tspan fill="#c96a1b">football match</tspan> often</tspan>
  <tspan x="120" dy="40">look for its highlights afterward.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">التصنيف</tspan>
</text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Classification</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وضع <tspan font-weight="bold" fill="#17457f">كل عنصر</tspan> في <tspan font-weight="bold" fill="#c0392b">فئة:</tspan></tspan>
  <tspan x="950" dy="40">هل الرسالة مزعجة أم سليمة؟</tspan>
  <tspan x="950" dy="40">هل الصورة سليمة أم فيها مرض؟</tspan>
</text>

<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Putting <tspan font-weight="bold" fill="#17457f">each item</tspan> into a <tspan font-weight="bold" fill="#c0392b">group:</tspan></tspan>
  <tspan x="120" dy="40">is the email spam or safe?</tspan>
  <tspan x="120" dy="40">Is the scan healthy or showing disease?</tspan>
</text>

