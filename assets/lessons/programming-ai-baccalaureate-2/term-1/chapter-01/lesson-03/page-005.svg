<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="pmgWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d5a30"/>
      <stop offset="0.55" stop-color="#a9713f"/>
      <stop offset="1" stop-color="#7d4d28"/>
    </linearGradient>
    <linearGradient id="pmgPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
    <marker id="pmgArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#pmgWood)"/>
  <path d="M0,240 C280,190 760,300 1080,235" stroke="#6d4222" stroke-width="18" fill="none" opacity=".16"/>
  <path d="M0,1060 C300,1120 780,1000 1080,1075" stroke="#6d4222" stroke-width="16" fill="none" opacity=".14"/>

  <rect x="42" y="38" width="1012" height="1294" rx="8" fill="#4a2c14" opacity=".28"/>
  <rect x="34" y="28" width="1012" height="1294" rx="8" fill="url(#pmgPaper)"/>

  <g stroke="#c9dcf0" stroke-width="1.6" opacity=".75">
    <line x1="80" y1="168" x2="1000" y2="168"/>
    <line x1="80" y1="212" x2="1000" y2="212"/>
    <line x1="80" y1="256" x2="1000" y2="256"/>
    <line x1="80" y1="300" x2="1000" y2="300"/>
    <line x1="80" y1="344" x2="1000" y2="344"/>
    <line x1="80" y1="388" x2="1000" y2="388"/>
    <line x1="80" y1="432" x2="1000" y2="432"/>
    <line x1="80" y1="476" x2="1000" y2="476"/>
    <line x1="80" y1="520" x2="1000" y2="520"/>
    <line x1="80" y1="564" x2="1000" y2="564"/>
    <line x1="80" y1="608" x2="1000" y2="608"/>
    <line x1="80" y1="652" x2="1000" y2="652"/>
    <line x1="80" y1="696" x2="1000" y2="696"/>
    <line x1="80" y1="740" x2="1000" y2="740"/>
    <line x1="80" y1="784" x2="1000" y2="784"/>
    <line x1="80" y1="828" x2="1000" y2="828"/>
    <line x1="80" y1="872" x2="1000" y2="872"/>
    <line x1="80" y1="916" x2="1000" y2="916"/>
    <line x1="80" y1="960" x2="1000" y2="960"/>
    <line x1="80" y1="1004" x2="1000" y2="1004"/>
    <line x1="80" y1="1048" x2="1000" y2="1048"/>
    <line x1="80" y1="1092" x2="1000" y2="1092"/>
    <line x1="80" y1="1136" x2="1000" y2="1136"/>
  </g>

  <rect x="67" y="70" width="946" height="1246" rx="6"
        fill="none" stroke="#d24b45" stroke-width="2.4"/>

  <rect x="115" y="810" width="240" height="92" rx="12" fill="#f2f7fd" stroke="#4a7fb5" stroke-width="2"/>
  <rect x="420" y="810" width="240" height="92" rx="12" fill="#f2f7fd" stroke="#4a7fb5" stroke-width="2"/>
  <rect x="725" y="810" width="240" height="92" rx="12" fill="#f2f7fd" stroke="#4a7fb5" stroke-width="2"/>

  <line x1="366" y1="856" x2="408" y2="856" stroke="#c62828" stroke-width="4" marker-end="url(#pmgArrow)"/>
  <line x1="671" y1="856" x2="713" y2="856" stroke="#c62828" stroke-width="4" marker-end="url(#pmgArrow)"/>

  <rect x="115" y="960" width="850" height="155" rx="14" fill="#fdf5d3" stroke="#d9c26a" stroke-width="2.2"/>

  <text x="540" y="170"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#1f4e8c">ما الذي يبرع فيه الذكاء الاصطناعي؟</text>

  <text x="540" y="218"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#152b42">What Is AI Good At?</text>

  <circle cx="140" cy="291" r="22" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="140" y="301"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#2e7d32">1</text>

  <text x="950" y="300"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#225f9c">
    <tspan x="950" dy="0">إيجاد الأنماط وتصنيفها في البيانات المعقدة،</tspan>
    <tspan x="950" dy="44">مثل الصور والنصوص.</tspan>
  </text>

  <text x="175" y="392"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="175" dy="0">Finding and classifying patterns in complex</tspan>
    <tspan x="175" dy="36">data, such as images and text.</tspan>
  </text>

  <circle cx="140" cy="491" r="22" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="140" y="501"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#2e7d32">2</text>

  <text x="950" y="500"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#225f9c">
    <tspan x="950" dy="0">التعرّف على الصور والصوت والنصوص وتوليدها.</tspan>
  </text>

  <text x="175" y="548"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="175" dy="0">Recognizing and generating images,</tspan>
    <tspan x="175" dy="36">audio, and text.</tspan>
  </text>

  <circle cx="140" cy="647" r="22" fill="none" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="140" y="657"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#2e7d32">3</text>

  <text x="950" y="656"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#225f9c">
    <tspan x="950" dy="0">الاستدلال الاحتمالي والتنبؤ اعتمادًا على البيانات.</tspan>
  </text>

  <text x="175" y="704"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="175" dy="0">Probabilistic reasoning and prediction</tspan>
    <tspan x="175" dy="36">based on data.</tspan>
  </text>

  <text x="235" y="848"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        fill="#225f9c">البيانات</text>
  <text x="235" y="881"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">Data</text>

  <text x="540" y="848"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        fill="#225f9c">اكتشاف الأنماط</text>
  <text x="540" y="881"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">Pattern Finding</text>

  <text x="845" y="848"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        fill="#225f9c">التنبؤ</text>
  <text x="845" y="881"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">Prediction</text>

  <text x="930" y="1020"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#225f9c">
    <tspan x="930" dy="0">الذكاء الاصطناعي بارع في إيجاد الأنماط داخل البيانات.</tspan>
  </text>

  <text x="150" y="1074"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="150" dy="0">AI is good at finding patterns in data.</tspan>
  </text>

</svg>
