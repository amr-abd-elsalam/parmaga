<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
</defs>

<!-- Illustration: a computer learns from labeled emails, then sorts a new one -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="109" y="730" width="866" height="420" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="724" width="866" height="420" rx="24" fill="url(#ilBack)" stroke="#8fc9f2" stroke-width="2.5"/>

  <!-- Spam stack (red X) -->
  <g transform="translate(705 836)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M38 29 L52 43 M52 29 L38 43" fill="none" stroke="#c0392b"/>
  </g>
  <g transform="translate(705 892)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M38 29 L52 43 M52 29 L38 43" fill="none" stroke="#c0392b"/>
  </g>
  <g transform="translate(705 948)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M38 29 L52 43 M52 29 L38 43" fill="none" stroke="#c0392b"/>
  </g>
  <g transform="translate(705 1004)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M38 29 L52 43 M52 29 L38 43" fill="none" stroke="#c0392b"/>
  </g>

  <!-- Safe stack (green check) -->
  <g transform="translate(835 836)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M36 36 L42 42 L54 29" fill="none" stroke="#2e7d32"/>
  </g>
  <g transform="translate(835 892)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M36 36 L42 42 L54 29" fill="none" stroke="#2e7d32"/>
  </g>
  <g transform="translate(835 948)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M36 36 L42 42 L54 29" fill="none" stroke="#2e7d32"/>
  </g>
  <g transform="translate(835 1004)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#ffffff"/>
    <path d="M4 5 L45 22 L86 5" fill="none"/>
    <path d="M36 36 L42 42 L54 29" fill="none" stroke="#2e7d32"/>
  </g>

  <!-- Arrow from both stacks into the laptop -->
  <path d="M750 1064 V1094 M880 1064 V1094 H680 V930 H642" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="626,930 642,921 642,939" fill="#c0392b"/>

  <!-- Laptop with a gear -->
  <rect x="434" y="876" width="180" height="120" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="430" y="870" width="180" height="120" rx="10" fill="url(#ilScreen)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="442" y="882" width="156" height="96" rx="6" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="410,990 630,990 652,1014 388,1014" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="495" y="998" width="50" height="8" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(520 930)" stroke="#22303f" stroke-width="2.5">
    <rect x="-7" y="-34" width="14" height="14" rx="3" fill="#ffd24a"/>
    <rect x="-7" y="20" width="14" height="14" rx="3" fill="#ffd24a"/>
    <rect x="-34" y="-7" width="14" height="14" rx="3" fill="#ffd24a"/>
    <rect x="20" y="-7" width="14" height="14" rx="3" fill="#ffd24a"/>
    <g transform="rotate(45)">
      <rect x="-7" y="-34" width="14" height="14" rx="3" fill="#ffd24a"/>
      <rect x="-7" y="20" width="14" height="14" rx="3" fill="#ffd24a"/>
      <rect x="-34" y="-7" width="14" height="14" rx="3" fill="#ffd24a"/>
      <rect x="20" y="-7" width="14" height="14" rx="3" fill="#ffd24a"/>
    </g>
    <circle cx="0" cy="0" r="24" fill="#ffd24a"/>
    <circle cx="0" cy="0" r="9" fill="#dff1f7"/>
  </g>

  <!-- Two empty trays below the laptop -->
  <g stroke="#22303f" stroke-width="2.5">
    <polygon points="420,1046 504,1046 496,1078 428,1078" fill="#8fc9f2"/>
    <rect x="414" y="1036" width="96" height="10" rx="5" fill="#2f7fb5"/>
    <polygon points="536,1046 620,1046 612,1078 544,1078" fill="#8fc9f2"/>
    <rect x="530" y="1036" width="96" height="10" rx="5" fill="#2f7fb5"/>
  </g>

  <!-- New email with a question mark -->
  <g transform="translate(175 900)" stroke="#22303f" stroke-width="2.5">
    <rect x="0" y="0" width="110" height="64" rx="8" fill="#ffffff"/>
    <path d="M5 6 L55 34 L105 6" fill="none"/>
    <circle cx="110" cy="0" r="18" fill="#ffd24a"/>
    <path d="M104 -5 Q104 -12 110 -12 Q116 -12 116 -6 Q116 -1 110 1 V5" fill="none"/>
    <circle cx="110" cy="11" r="2.5" fill="#22303f"/>
  </g>
  <line x1="320" y1="940" x2="398" y2="940" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="414,940 398,931 398,949" fill="#c0392b"/>
</g>

<!-- Icon: chip beside header -->
<g transform="translate(120 104)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 8 V2 M22 8 V2 M29 8 V2 M15 36 V42 M22 36 V42 M29 36 V42 M8 15 H2 M8 22 H2 M8 29 H2 M36 15 H42 M36 22 H42 M36 29 H42" fill="none"/>
  <rect x="8" y="8" width="28" height="28" rx="4" fill="#2f7fb5"/>
  <rect x="15" y="15" width="14" height="14" rx="2" fill="#8fc9f2"/>
</g>

<!-- Icon: light bulb beside first paragraph -->
<g transform="translate(890 404)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 22 H9 M47 22 H52 M10 6 L14 10 M46 6 L42 10" fill="none" stroke="#c96a1b"/>
  <circle cx="28" cy="22" r="17" fill="#ffd24a"/>
  <path d="M22 24 L28 30 L34 24" fill="none"/>
  <rect x="20" y="38" width="16" height="13" rx="3" fill="#7f95ab"/>
</g>

<!-- Face: smile beside the example -->
<g transform="translate(900 664)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Bottom icon row: documents, check badge, star -->
<g transform="translate(372 1180)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="14" y="2" width="34" height="44" rx="4" fill="#dff1f7"/>
  <rect x="6" y="10" width="34" height="44" rx="4" fill="#ffffff"/>
  <path d="M13 22 H33 M13 30 H33 M13 38 H27" fill="none" stroke="#2f7fb5"/>
</g>
<g transform="translate(512 1180)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="28" cy="28" r="24" fill="#2e7d32"/>
  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#ffffff"/>
</g>
<g transform="translate(652 1180)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">التعلم الآلي</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Machine Learning (ML)</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">فرع من الذكاء الاصطناعي <tspan font-weight="bold" fill="#c0392b">يتعلم</tspan> فيه الكمبيوتر</tspan>
  <tspan x="950" dy="40">من <tspan font-weight="bold" fill="#17457f">الأمثلة والبيانات،</tspan> بدل أن نكتب له</tspan>
  <tspan x="950" dy="40">كل قاعدة بأيدينا.</tspan>
</text>

<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A branch of AI in which the computer</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">learns</tspan> from <tspan font-weight="bold" fill="#17457f">examples and data,</tspan> instead</tspan>
  <tspan x="120" dy="40">of us writing every rule by hand.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">مثال:</tspan> نعطيه آلاف الرسائل المصنفة إلى</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">«مزعجة»</tspan> <tspan fill="#c96a1b">و«سليمة»،</tspan> فيستنتج الفرق بينهما وحده.</tspan>
</text>

<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan fill="#c96a1b">Example:</tspan> we give it thousands of emails</tspan>
  <tspan x="120" dy="40">labeled <tspan fill="#c96a1b">"spam"</tspan> or <tspan fill="#c96a1b">"safe,"</tspan> and it works</tspan>
  <tspan x="120" dy="40">out the difference by itself.</tspan>
</text>

<!-- Illustration labels (listed in the page prompt) -->
<text x="790" y="772" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="790" dy="0">مزعجة</tspan>
</text>
<text x="716" y="808" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="716" dy="0">Spam</tspan>
</text>
<text x="920" y="772" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="920" dy="0">سليمة</tspan>
</text>
<text x="848" y="808" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="848" dy="0">Safe</tspan>
</text>
<text x="305" y="1008" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="305" dy="0">رسالة جديدة</tspan>
</text>
<text x="155" y="1044" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="155" dy="0">New email</tspan>
</text>
</svg>
