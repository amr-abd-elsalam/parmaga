<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">مقياس الوجع:</tspan>
  <tspan x="540" dy="48">متى يتدخل الإنسان؟</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">The Pain Scale:</tspan>
  <tspan x="540" dy="36">When Should a Human Step In?</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اسأل: لو أخطأ <tspan font-weight="bold" fill="#17457f">الذكاء الاصطناعي</tspan> هنا،</tspan>
  <tspan x="950" dy="40">فكم ستوجع <tspan font-weight="bold" fill="#c0392b">الغلطة</tspan> من 1 إلى 10؟</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Ask: if <tspan font-weight="bold" fill="#17457f">AI</tspan> is wrong here, how much would</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">mistake</tspan> hurt, from 1 to 10?</tspan>
</text>

<!-- Bullets text -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اقترح أغنية لا تعجبك: <tspan fill="#c96a1b">1</tspan></tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Suggests a song you don't like: <tspan fill="#c96a1b">1</tspan></tspan>
</text>
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ترجم قائمة طعام خطأً: <tspan fill="#c96a1b">3</tspan></tspan>
</text>
<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Translates a menu wrongly: <tspan fill="#c96a1b">3</tspan></tspan>
</text>
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قرر من يُقبل في وظيفة: <tspan fill="#c96a1b">8</tspan></tspan>
</text>
<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Decides who gets a job: <tspan fill="#c96a1b">8</tspan></tspan>
</text>
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">شخّص مرضًا من الأشعة: <tspan fill="#c96a1b">10</tspan></tspan>
</text>
<text x="132" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Diagnoses a disease from an X-ray: <tspan fill="#c96a1b">10</tspan></tspan>
</text>
