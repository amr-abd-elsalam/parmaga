  <path d="M338 1188 H362 M350 1176 V1200" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <path d="M368 1178 Q 372 1188 368 1198" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
  <path d="M376 1182 Q 379 1188 376 1194" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow from box toward the player -->
  <line x1="484" y1="1140" x2="402" y2="1140" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="390,1140 404,1132 404,1148" fill="#c0392b"/>

  <!-- System box with screen (red X) and gear -->
  <rect x="494" y="1080" width="140" height="124" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="490" y="1074" width="140" height="130" rx="12" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="506" y="1088" width="108" height="44" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(560 1110)">
    <g transform="rotate(45)"><rect x="-3.5" y="-16" width="7" height="32" rx="3" fill="#c0392b"/></g>
    <g transform="rotate(-45)"><rect x="-3.5" y="-16" width="7" height="32" rx="3" fill="#c0392b"/></g>
  </g>
  <g transform="translate(560 1168)">
    <g><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(60)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(120)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(180)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(240)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <g transform="rotate(300)"><rect x="-3" y="-20" width="6" height="8" rx="1.5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/></g>
    <circle cx="0" cy="0" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#22303f"/>
  </g>

  <!-- Tilted balance scale floating above the box -->
  <g transform="translate(526 994) scale(1.2)">
    <rect x="26" y="12" width="4" height="36" fill="#17457f"/>
    <rect x="14" y="46" width="28" height="6" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <g transform="rotate(-14 28 16)">
      <line x1="6" y1="16" x2="50" y2="16" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
