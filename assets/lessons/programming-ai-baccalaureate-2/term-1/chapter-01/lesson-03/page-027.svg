      <line x1="8" y1="16" x2="14" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="42" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="48" y1="16" x2="54" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2 30 Q 8 40 14 30 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M42 30 Q 48 40 54 30 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <circle cx="28" cy="16" r="4" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Arrow from photo cards into the box -->
  <line x1="772" y1="1130" x2="648" y2="1130" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="636,1130 650,1122 650,1138" fill="#c0392b"/>

  <!-- Stack of photo cards: tall players -->
  <g transform="rotate(-9 840 1130)">
    <rect x="792" y="1068" width="96" height="124" rx="8" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="840" cy="1088" r="8" fill="#b57e50"/>
    <rect x="831" y="1098" width="18" height="70" rx="6" fill="#2f7fb5"/>
  </g>
  <g transform="rotate(7 840 1130)">
    <rect x="792" y="1068" width="96" height="124" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="840" cy="1088" r="8" fill="#e8b98d"/>
    <rect x="831" y="1098" width="18" height="70" rx="6" fill="#17457f"/>
  </g>
  <rect x="796" y="1074" width="96" height="124" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="792" y="1068" width="96" height="124" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="800" y="1076" width="80" height="100" rx="4" fill="#dff1f7"/>
  <rect x="823" y="1102" width="7" height="30" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="850" y="1102" width="7" height="30" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="830" y="1100" width="20" height="34" rx="5" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <rect x="831" y="1132" width="18" height="38" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <line x1="840" y1="1142" x2="840" y2="1170" stroke="#22303f" stroke-width="2"/>
  <circle cx="840" cy="1090" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <path d="M831 1088 Q 832 1080 840 1080 Q 849 1080 849 1088 Q 844 1084 831 1088 Z" fill="#2b211c"/>

  <rect x="105" y="984" width="870" height="260" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">التحيز</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Bias</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">ميل غير عادل</tspan> في النتائج، سببه غالبًا</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">بيانات تدريب</tspan> لا تمثل الجميع.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">An <tspan font-weight="bold" fill="#17457f">unfair tendency</tspan> in results,</tspan>
  <tspan x="120" dy="40">often caused by <tspan font-weight="bold" fill="#17457f">training data</tspan> that</tspan>
  <tspan x="120" dy="40">does not represent everyone.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مثال: نظام تدرّب على صور <tspan fill="#c96a1b">لاعبين طوال</tspan> فقط</tspan>
  <tspan x="950" dy="40">قد يستنتج خطأً أن القصير لا يجيد اللعب.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Example: a system trained only on</tspan>
  <tspan x="120" dy="40">photos of <tspan fill="#c96a1b">tall players</tspan> may wrongly</tspan>
  <tspan x="120" dy="40">decide short people can't play well.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التمييز</tspan> (Discrimination) هو النتيجة</tspan>
  <tspan x="950" dy="40">العملية للتحيز: معاملة شخص بظلم</tspan>
  <tspan x="950" dy="40">بسبب صفة مثل النوع أو اللون.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Discrimination</tspan> is the practical</tspan>
  <tspan x="120" dy="40">result of bias: treating a person</tspan>
  <tspan x="120" dy="40">unfairly because of a trait such as</tspan>
  <tspan x="120" dy="40">gender or color.</tspan>
</text>
</svg>
