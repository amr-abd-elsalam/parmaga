  <path d="M287 1116 Q 288 1103 300 1103 Q 313 1103 313 1116 Q 306 1109 287 1116 Z" fill="#2b211c"/>
  <circle cx="295" cy="1120" r="2" fill="#22303f"/>
  <circle cx="305" cy="1120" r="2" fill="#22303f"/>
  <path d="M295 1125 Q 300 1129 305 1125" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
