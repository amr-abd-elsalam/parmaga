<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilSkyHalluc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
</defs>

<!-- Key sentence strip -->
<rect x="109" y="808" width="870" height="128" rx="10" fill="#22303f" opacity=".12"/>
<rect x="105" y="802" width="870" height="128" rx="10" fill="#fdf6d8"/>
<rect x="961" y="818" width="6" height="96" rx="3" fill="#e0a55e"/>

<!-- Header band icon: cloud with question mark -->
<g transform="translate(600 150)">
  <ellipse cx="0" cy="6" rx="24" ry="13" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-8" cy="-4" r="11" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="8" cy="-8" r="12" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="0" cy="5" rx="21" ry="10" fill="#8fc9f2"/>
  <circle cx="-8" cy="-3" r="8" fill="#8fc9f2"/>
  <circle cx="8" cy="-7" r="9" fill="#8fc9f2"/>
  <path d="M -6 -8 Q -6 -16 1 -16 Q 8 -16 8 -10 Q 8 -5 1 -2 V 3" fill="none" stroke="#17457f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1" cy="10" r="2.5" fill="#17457f"/>
</g>

<!-- Face: surprise (important fact) -->
<g transform="translate(690 150)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="11" r="5" fill="#22303f"/>
</g>

<!-- Icon: warning triangle (false information) -->
<g transform="translate(860 376)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Icon: open book (verify with a reference) -->
<g transform="translate(860 664)">
  <path d="M28 14 C 20 8, 10 8, 4 10 V46 C 10 44, 20 44, 28 50 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 14 C 36 8, 46 8, 52 10 V46 C 46 44, 36 44, 28 50 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M10 20 Q 17 18 23 21" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 28 Q 17 26 23 29" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <path d="M33 21 Q 39 18 46 20" fill="none" stroke="#17457f" stroke-width="2" stroke-linecap="round"/>
  <path d="M33 29 Q 39 26 46 28" fill="none" stroke="#17457f" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Icon inside strip: check badge (always verify) -->
<g transform="translate(868 862)">
  <circle cx="26" cy="26" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 26 L23 33 L37 19" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Illustration: a confident AI answer hides a made-up fact -->
<g>
  <rect x="109" y="956" width="870" height="290" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="950" width="870" height="290" rx="24" fill="url(#ilSkyHalluc)"/>
  <path d="M105 1206 H975 V1216 Q975 1240 951 1240 H129 Q105 1240 105 1216 Z" fill="#a9dcbe"/>
  <line x1="105" y1="1206" x2="975" y2="1206" stroke="#2e7d32" stroke-width="2"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="992" rx="32" ry="11" fill="#ffffff"/>
  <ellipse cx="228" cy="984" rx="20" ry="11" fill="#ffffff"/>
  <ellipse cx="420" cy="980" rx="26" ry="9" fill="#ffffff"/>

  <!-- Answer card -->
  <rect x="604" y="986" width="300" height="210" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="600" y="980" width="300" height="210" rx="14" fill="#ffffff"/>
  <rect x="600" y="980" width="300" height="38" rx="14" fill="#2f7fb5"/>
  <rect x="600" y="1002" width="300" height="16" fill="#2f7fb5"/>
  <polygon points="700,1018 760,1018 680,1190 620,1190" fill="#dff1f7" opacity=".6"/>
  <rect x="624" y="1040" width="200" height="8" rx="4" fill="#7f95ab"/>
  <rect x="624" y="1068" width="230" height="8" rx="4" fill="#7f95ab"/>
  <rect x="624" y="1098" width="210" height="8" rx="4" fill="#7f95ab"/>
  <rect x="616" y="1091" width="228" height="22" rx="6" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="624" y="1128" width="220" height="8" rx="4" fill="#7f95ab"/>
  <rect x="624" y="1156" width="160" height="8" rx="4" fill="#7f95ab"/>
  <rect x="600" y="980" width="300" height="210" rx="14" fill="none" stroke="#22303f" stroke-width="2.5"/>

  <!-- Sparkles (shiny, confident look) -->
  <polygon points="580,1000 584,1010 594,1014 584,1018 580,1028 576,1018 566,1014 576,1010" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="930,1100 933,1107 940,1110 933,1113 930,1120 927,1113 920,1110 927,1107" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Big star badge -->
  <circle cx="884" cy="1010" r="40" fill="#22303f" opacity=".18"/>
  <circle cx="880" cy="1004" r="40" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(880 1006)">
    <polygon points="0,-32 7.6,-10.5 30.4,-9.9 12.4,4 18.8,25.9 0,13 -18.8,25.9 -12.4,4 -30.4,-9.9 -7.6,-10.5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Student: legs and shoes -->
  <rect x="444" y="1146" width="22" height="54" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="476" y="1146" width="22" height="54" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="452" cy="1202" rx="14" ry="5" fill="#22303f"/>
  <ellipse cx="490" cy="1202" rx="14" ry="5" fill="#22303f"/>

  <!-- Student: torso and head -->
  <rect x="436" y="1036" width="70" height="116" rx="14" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="471" cy="1010" r="24" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <path d="M447 1006 Q 449 982 471 982 Q 493 982 495 1006 Q 483 994 447 1006 Z" fill="#2b211c"/>
  <circle cx="465" cy="1012" r="2.5" fill="#22303f"/>
  <circle cx="481" cy="1012" r="2.5" fill="#22303f"/>
  <path d="M465 1021 L479 1021" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>

  <!-- Open reference book in the left hand -->
  <rect x="324" y="1092" width="102" height="46" rx="4" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M330 1086 Q 352 1078 375 1088 V1132 Q 352 1122 330 1130 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M375 1088 Q 398 1078 420 1086 V1130 Q 398 1122 375 1132 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="338" y="1096" width="28" height="4" rx="2" fill="#7f95ab"/>
  <rect x="338" y="1106" width="24" height="4" rx="2" fill="#7f95ab"/>
  <rect x="384" y="1096" width="28" height="4" rx="2" fill="#7f95ab"/>
  <rect x="384" y="1106" width="22" height="4" rx="2" fill="#7f95ab"/>
  <polygon points="436,1044 448,1054 426,1114 414,1108" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="418" cy="1112" r="8" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>

  <!-- Right arm and magnifying glass over the red line -->
  <polygon points="496,1044 506,1056 604,1150 594,1158" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="632,1116 638,1122 610,1152 604,1146" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="602" cy="1152" r="8" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="650" cy="1102" r="20" fill="#dff1f7" opacity=".6"/>
  <circle cx="650" cy="1102" r="22" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <path d="M640 1094 Q 644 1088 652 1088" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <rect x="105" y="950" width="870" height="290" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الهلوسة</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Hallucination</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أن يُنتج الذكاء الاصطناعي، وخاصة التوليدي،</tspan>
  <tspan x="950" dy="40">معلومة تبدو <tspan font-weight="bold" fill="#17457f">مقنعة ومنطقية</tspan></tspan>
  <tspan x="950" dy="40">لكنها <tspan font-weight="bold" fill="#c0392b">خاطئة أو مختلَقة.</tspan></tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">When AI, especially generative AI,</tspan>
  <tspan x="120" dy="40">produces information that sounds</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">convincing and logical</tspan> but is</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">false or made up.</tspan></tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هو لا يكذب عن قصد، فهو لا يعرف أنه مخطئ؛</tspan>
  <tspan x="950" dy="40">إنه يكمل الكلام بالشكل <tspan font-weight="bold" fill="#17457f">الأكثر احتمالًا،</tspan></tspan>
  <tspan x="950" dy="40">والأكثر احتمالًا <tspan font-weight="bold" fill="#c0392b">ليس دائمًا الصحيح.</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">It does not lie on purpose, because it</tspan>
  <tspan x="120" dy="40">does not know it is wrong; it continues</tspan>
  <tspan x="120" dy="40">the text in the <tspan font-weight="bold" fill="#17457f">most likely way,</tspan> and the</tspan>
  <tspan x="120" dy="40">most likely is <tspan font-weight="bold" fill="#c0392b">not always the correct.</tspan></tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">قد يخطئ وهو واثق، فتحقّق دائمًا.</tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">It can be confidently wrong,</tspan>
  <tspan x="140" dy="40">so always verify.</tspan>
</text>
</svg>
