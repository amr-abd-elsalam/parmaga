<!-- Page titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">يومك من الصبح:</tspan>
  <tspan x="540" dy="48">الذكاء الاصطناعي في حياتك</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Your Day from the Morning: AI in Your Life</text>

<!-- Paragraph 1 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تعال نتتبع يومًا عاديًا من حياتك،</tspan>
  <tspan x="950" dy="40">ونكتشف أين يختبئ <tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي.</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Let's follow an ordinary day in your life</tspan>
  <tspan x="120" dy="40">and discover where <tspan font-weight="bold" fill="#c0392b">AI</tspan> is hiding.</tspan>
</text>

<!-- Section header -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الساعة 7:00 صباحًا — التعرف على الوجه</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">7:00 a.m. — Face Recognition</text>

<!-- Paragraph 2 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تستيقظ، فتنظر إلى هاتفك، <tspan font-weight="bold" fill="#2e7d32">فيُفتح فورًا.</tspan></text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You wake up, look at your phone,</tspan>
  <tspan x="120" dy="40">and it <tspan font-weight="bold" fill="#2e7d32">unlocks right away.</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التعرف على الوجه</tspan> <tspan font-weight="bold" fill="#17457f">تقنية</tspan> تكتشف الوجه</tspan>
  <tspan x="950" dy="40">في الصورة، ثم تتعرف على صاحبه.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Face recognition</tspan> is a <tspan font-weight="bold" fill="#17457f">technology</tspan> that</tspan>
  <tspan x="120" dy="40">detects a face in an image, then</tspan>
  <tspan x="120" dy="40">identifies whose face it is.</tspan>
</text>
</svg>
