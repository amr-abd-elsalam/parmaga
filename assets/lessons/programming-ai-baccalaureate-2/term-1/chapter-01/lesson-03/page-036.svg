<!-- Texts -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">قصص حقيقية: عندما أخطأ</tspan>
  <tspan x="540" dy="48">الذكاء الاصطناعي</tspan>
</text>

<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      fill="#152b42">True Stories: When AI Got It Wrong</text>

<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="950" dy="0">القصة 1: المحامي والقضايا</tspan>
  <tspan x="950" dy="40">المزيفة (الهلوسة)</tspan>
</text>

<text x="120"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">Story 1: The Lawyer and</tspan>
  <tspan x="120" dy="40">the Fake Cases (Hallucination)</tspan>
</text>

<text x="950"
      y="474"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">في قضية <tspan fill="#c96a1b">Mata v. Avianca</tspan> سنة 2023 في نيويورك،</tspan>
  <tspan x="950" dy="40">استخدم محامون <tspan font-weight="bold" fill="#17457f">ChatGPT</tspan> في البحث،</tspan>
  <tspan x="950" dy="40">فولّد لهم أوصافًا لقضايا <tspan font-weight="bold" fill="#c0392b">غير موجودة</tspan> أصلًا.</tspan>
</text>

<text x="120"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In <tspan fill="#c96a1b">Mata v. Avianca</tspan> in New York in 2023,</tspan>
  <tspan x="120" dy="40">lawyers used <tspan font-weight="bold" fill="#17457f">ChatGPT</tspan> for research,</tspan>
  <tspan x="120" dy="40">and it generated descriptions of cases</tspan>
  <tspan x="120" dy="40">that <tspan font-weight="bold" fill="#c0392b">did not exist.</tspan></tspan>
</text>

<text x="950"
      y="794"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">قدّموها إلى المحكمة،</tspan>
  <tspan x="950" dy="40">فعاقبتهم بغرامة <tspan fill="#c96a1b">5,000</tspan> دولار.</tspan>
</text>

<text x="120"
      y="874"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">They submitted them to the court,</tspan>
  <tspan x="120" dy="40">which fined them <tspan fill="#c96a1b">$5,000.</tspan></tspan>
</text>
</svg>
