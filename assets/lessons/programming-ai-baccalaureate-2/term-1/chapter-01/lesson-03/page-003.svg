<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5c34"/>
      <stop offset="0.55" stop-color="#79492a"/>
      <stop offset="1" stop-color="#5e3820"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
  </defs>

  <!-- خلفية خشبية بسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0 250 C 300 210, 760 300, 1080 240" stroke="#a9713f" stroke-width="16" fill="none" opacity="0.16"/>
  <path d="M0 1080 C 320 1130, 780 1020, 1080 1090" stroke="#a9713f" stroke-width="14" fill="none" opacity="0.13"/>

  <!-- ظل الورقة -->
  <rect x="42" y="38" width="1012" height="1294" rx="10" fill="#2a1608" opacity="0.22"/>

  <!-- الورقة -->
  <rect x="34" y="28" width="1012" height="1294" rx="10" fill="url(#paperGrad)"/>

  <!-- أسطر الدفتر الزرقاء الباهتة -->
  <g stroke="#cfe2f0" stroke-width="1.4">
    <line x1="78" y1="124" x2="1002" y2="124"/>
    <line x1="78" y1="160" x2="1002" y2="160"/>
    <line x1="78" y1="196" x2="1002" y2="196"/>
    <line x1="78" y1="232" x2="1002" y2="232"/>
    <line x1="78" y1="268" x2="1002" y2="268"/>
    <line x1="78" y1="304" x2="1002" y2="304"/>
    <line x1="78" y1="340" x2="1002" y2="340"/>
    <line x1="78" y1="376" x2="1002" y2="376"/>
    <line x1="78" y1="412" x2="1002" y2="412"/>
    <line x1="78" y1="448" x2="1002" y2="448"/>
    <line x1="78" y1="484" x2="1002" y2="484"/>
    <line x1="78" y1="520" x2="1002" y2="520"/>
    <line x1="78" y1="556" x2="1002" y2="556"/>
    <line x1="78" y1="592" x2="1002" y2="592"/>
    <line x1="78" y1="628" x2="1002" y2="628"/>
    <line x1="78" y1="664" x2="1002" y2="664"/>
    <line x1="78" y1="700" x2="1002" y2="700"/>
    <line x1="78" y1="736" x2="1002" y2="736"/>
    <line x1="78" y1="772" x2="1002" y2="772"/>
    <line x1="78" y1="808" x2="1002" y2="808"/>
    <line x1="78" y1="844" x2="1002" y2="844"/>
    <line x1="78" y1="880" x2="1002" y2="880"/>
    <line x1="78" y1="916" x2="1002" y2="916"/>
    <line x1="78" y1="952" x2="1002" y2="952"/>
    <line x1="78" y1="988" x2="1002" y2="988"/>
    <line x1="78" y1="1024" x2="1002" y2="1024"/>
    <line x1="78" y1="1060" x2="1002" y2="1060"/>
    <line x1="78" y1="1096" x2="1002" y2="1096"/>
    <line x1="78" y1="1132" x2="1002" y2="1132"/>
  </g>

  <!-- الإطار الأحمر الخارجي الوحيد -->
  <rect x="67" y="60" width="946" height="1230" rx="8" fill="none" stroke="#c0392b" stroke-width="2.2"/>

  <!-- خلفيات البطاقات -->
  <rect x="100" y="232" width="424" height="424" rx="18" fill="#fffefa" opacity="0.9" stroke="#a9c4d8" stroke-width="1.8"/>
  <rect x="556" y="232" width="424" height="424" rx="18" fill="#fffefa" opacity="0.9" stroke="#a9c4d8" stroke-width="1.8"/>
  <rect x="100" y="690" width="424" height="424" rx="18" fill="#fffefa" opacity="0.9" stroke="#a9c4d8" stroke-width="1.8"/>
  <rect x="556" y="690" width="424" height="424" rx="18" fill="#fffefa" opacity="0.9" stroke="#a9c4d8" stroke-width="1.8"/>

  <!-- خط بسيط تحت العنوان -->
  <line x1="330" y1="202" x2="750" y2="202" stroke="#9fc3de" stroke-width="2.2"/>

  <!-- أيقونات يدوية بسيطة -->
  <g fill="none" stroke="#2f6fa8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="144,252 149,265.1 163,265.8 152.1,274.6 155.8,288.2 144,280.5 132.2,288.2 135.9,274.6 125,265.8 139,265.1"/>
    <rect x="592" y="250" width="16" height="26" rx="8"/>
    <path d="M585 272 A15 15 0 0 0 615 272"/>
    <path d="M600 287 V296"/>
    <path d="M589 296 H611"/>
    <circle cx="144" cy="730" r="20"/>
    <ellipse cx="144" cy="730" rx="8.5" ry="20"/>
    <path d="M124 730 H164"/>
    <circle cx="600" cy="730" r="14"/>
    <path d="M594 735 Q600 740.5 606 735"/>
    <path d="M580 718 V712 H586"/>
    <path d="M614 712 H620 V718"/>
    <path d="M580 742 V748 H586"/>
    <path d="M614 748 H620 V742"/>
  </g>
  <g fill="#2f6fa8" stroke="none">
    <circle cx="595" cy="726" r="1.9"/>
    <circle cx="605" cy="726" r="1.9"/>
  </g>

  <!-- العنوان العربي -->
  <text x="540" y="132"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#1f5fa0">استخدام الذكاء الاصطناعي في الحياة اليومية</text>

  <!-- العنوان الإنجليزي -->
  <text x="540" y="178"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#14263d">Use of AI in Daily Life</text>

  <!-- البطاقة 1 : أنظمة التوصية -->
  <text x="502" y="284"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f7a45">أنظمة التوصية |</text>

  <text x="122" y="324"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#1f7a45">Recommendation Systems</text>

  <text x="502" y="368"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        fill="#1f5fa0">
    <tspan x="502" dy="0">تتنبأ بتفضيلات المستخدم من</tspan>
    <tspan x="502" dy="30">بيانات سلوكه السابق، ثم تعرض</tspan>
    <tspan x="502" dy="30">توصيات مناسبة.</tspan>
  </text>

  <text x="122" y="470"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20"
        fill="#14263d">
    <tspan x="122" dy="0">They predict user</tspan>
    <tspan x="122" dy="29">preferences from past</tspan>
    <tspan x="122" dy="29">behavior data and display</tspan>
    <tspan x="122" dy="29">suitable recommendations.</tspan>
  </text>

  <text x="502" y="594"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="20"
        fill="#c96a12">أمثلة |</text>

  <text x="122" y="624"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="18"
        fill="#c96a12">Examples: YouTube, Amazon, Spotify</text>

  <!-- البطاقة 2 : المساعدات الصوتية -->
  <text x="958" y="284"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f7a45">المساعدات الصوتية |</text>

  <text x="578" y="324"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#1f7a45">Voice Assistants</text>

  <text x="958" y="368"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        fill="#1f5fa0">
    <tspan x="958" dy="0">تتعرّف على الصوت، وتفهم</tspan>
    <tspan x="958" dy="30">الأوامر، ثم تنفذها.</tspan>
  </text>

  <text x="578" y="470"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20"
        fill="#14263d">
    <tspan x="578" dy="0">They recognize a voice,</tspan>
    <tspan x="578" dy="29">understand commands, and</tspan>
    <tspan x="578" dy="29">execute them.</tspan>
  </text>

  <text x="958" y="594"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="20"
        fill="#c96a12">أمثلة |</text>

  <text x="578" y="624"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="18"
        fill="#c96a12">Examples: Siri, Google Assistant</text>

  <!-- البطاقة 3 : الترجمة الآلية -->
  <text x="502" y="742"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f7a45">الترجمة الآلية |</text>

  <text x="122" y="782"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#1f7a45">Machine Translation</text>

  <text x="502" y="826"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        fill="#1f5fa0">
    <tspan x="502" dy="0">تترجم النصوص تلقائيًا</tspan>
    <tspan x="502" dy="30">من لغة إلى أخرى.</tspan>
  </text>

  <text x="122" y="928"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20"
        fill="#14263d">
    <tspan x="122" dy="0">It automatically translates</tspan>
    <tspan x="122" dy="29">text from one language</tspan>
    <tspan x="122" dy="29">into another.</tspan>
  </text>

  <text x="502" y="1052"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="20"
        fill="#c96a12">أمثلة |</text>

  <text x="122" y="1082"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="18"
        fill="#c96a12">Examples: Google Translate, DeepL</text>

  <!-- البطاقة 4 : التعرّف على الوجه -->
  <text x="958" y="742"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f7a45">التعرّف على الوجه |</text>

  <text x="578" y="782"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#1f7a45">Face Recognition</text>

  <text x="958" y="826"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        fill="#1f5fa0">
    <tspan x="958" dy="0">يكتشف الوجوه البشرية في الصور</tspan>
    <tspan x="958" dy="30">ويتعرّف عليها تلقائيًا.</tspan>
  </text>

  <text x="578" y="928"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20"
        fill="#14263d">
    <tspan x="578" dy="0">It automatically detects and</tspan>
    <tspan x="578" dy="29">identifies human faces in</tspan>
    <tspan x="578" dy="29">photographs.</tspan>
  </text>

  <text x="958" y="1052"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="20"
        fill="#c96a12">مثال | فتح الهاتف الذكي |</text>

  <text x="578" y="1082"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="18"
        fill="#c96a12">Example: Smartphone unlocking</text>

</svg>
