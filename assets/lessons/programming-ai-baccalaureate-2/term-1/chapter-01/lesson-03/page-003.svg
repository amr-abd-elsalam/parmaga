<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>

<!-- Outlined box: shadow and fill -->
<rect x="109" y="888" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="882" width="870" height="288" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="898" width="6" height="256" rx="3" fill="#2f7fb5"/>

<!-- Icon: light bulb beside paragraph 1 -->
<g transform="translate(150 134)">
  <circle cx="28" cy="22" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M22 22 Q28 30 34 22" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="20" y="38" width="16" height="14" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="20" y1="45" x2="36" y2="45" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: document stack beside paragraph 2 -->
<g transform="translate(150 316)">
  <rect x="16" y="4" width="34" height="44" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="8" y="12" width="34" height="44" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <line x1="15" y1="24" x2="35" y2="24" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="33" x2="35" y2="33" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="42" x2="28" y2="42" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Illustration: the machine notices, the doctor decides -->
<g>
  <rect x="125" y="500" width="830" height="252" rx="26" fill="url(#ilBg)"/>

  <!-- light board with X-ray -->
  <rect x="604" y="516" width="330" height="226" rx="16" fill="#22303f" opacity=".18"/>
  <rect x="600" y="510" width="330" height="226" rx="16" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="618" y="526" width="294" height="194" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="690" y="502" width="24" height="14" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="816" y="502" width="24" height="14" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(765 624) rotate(-18)">
    <rect x="-110" y="-22" width="220" height="16" rx="8" fill="#dff1f7"/>
    <rect x="-110" y="6" width="220" height="16" rx="8" fill="#dff1f7"/>
    <circle cx="-110" cy="-14" r="12" fill="#dff1f7"/>
    <circle cx="110" cy="-14" r="12" fill="#dff1f7"/>
    <circle cx="-110" cy="14" r="12" fill="#dff1f7"/>
    <circle cx="110" cy="14" r="12" fill="#dff1f7"/>
  </g>
  <polyline points="789,590 797,596 790,603 798,611" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="794" cy="600" r="22" fill="none" stroke="#c96a1b" stroke-width="3"/>

  <!-- arrow from the circle to the left -->
  <line x1="770" y1="600" x2="474" y2="600" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="462,600 476,593 476,607" fill="#c0392b"/>

  <!-- doctor -->
  <ellipse cx="290" cy="746" rx="100" ry="6" fill="#22303f" opacity=".18"/>
  <path d="M205 746 L205 640 Q205 602 245 598 L315 598 Q355 602 355 640 L355 746 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M258 598 L280 640 L302 598 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M258 598 L272 650 L250 640" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 598 L288 650 L310 640" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="268" y="582" width="24" height="18" rx="6" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M262 600 Q258 640 280 652 Q302 640 298 600" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="280" cy="656" r="6" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M207 630 Q190 690 210 740 L230 740 Q220 690 232 640 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="280" cy="556" r="32" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M248 556 Q244 518 280 516 Q318 518 312 556 Q304 534 280 532 Q258 534 248 556 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="268" cy="560" r="3" fill="#22303f"/>
  <circle cx="292" cy="560" r="3" fill="#22303f"/>
  <path d="M272 572 Q280 577 288 572" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- report card with green check -->
  <rect x="364" y="626" width="96" height="110" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="360" y="620" width="96" height="110" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <line x1="372" y1="642" x2="412" y2="642" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="372" y1="658" x2="440" y2="658" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="372" y1="674" x2="440" y2="674" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="434" cy="642" r="13" fill="#a9dcbe" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M428 642 L433 647 L441 637" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M384 708 Q394 696 402 708 T420 706 T440 704" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- arm, hand and pen -->
  <path d="M350 625 Q380 660 372 700 L356 702 Q360 668 336 645 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="380,711 384,701 406,679 412,685 390,707" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <circle cx="370" cy="706" r="10" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Thinking face inside the box -->
<g transform="translate(200 1012)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Pencil icon inside the box -->
<g transform="translate(850 1110) rotate(-35)">
  <rect x="-8" y="20" width="8" height="14" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="0" y="20" width="44" height="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="44,20 58,27 44,34" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Lower band icons -->
<g transform="translate(392 1190)">
  <path d="M28 4 L50 12 L50 28 Q50 46 28 54 Q6 46 6 28 L6 12 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 29 L26 37 L39 21" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(512 1190)">
  <circle cx="28" cy="28" r="24" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(632 1190)">
  <circle cx="18" cy="14" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M4 52 Q4 28 18 28 Q32 28 32 52 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="40" cy="16" r="9" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M26 52 Q26 30 40 30 Q54 30 54 52 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل <tspan font-weight="bold" fill="#17457f">جهاز أشعة</tspan> يلمح <tspan fill="#c96a1b">كسرًا صغيرًا</tspan></tspan>
  <tspan x="950" dy="40">في العظم بسرعة.</tspan>
</text>

<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine an <tspan font-weight="bold" fill="#17457f">X-ray machine</tspan> that quickly</tspan>
  <tspan x="120" dy="40">spots a <tspan fill="#c96a1b">small crack</tspan> in a bone.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الجهاز <tspan font-weight="bold" fill="#17457f">يرى،</tspan> لكن الطبيب هو الذي</tspan>
  <tspan x="950" dy="40">يكتب التشخيص ويتحمل <tspan font-weight="bold" fill="#c0392b">مسؤوليته.</tspan></tspan>
</text>

<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The machine <tspan font-weight="bold" fill="#17457f">sees;</tspan> the doctor writes</tspan>
  <tspan x="120" dy="40">the diagnosis and is <tspan font-weight="bold" fill="#c0392b">responsible.</tspan></tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الجهاز يلاحظ</text>

<text x="620" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">The machine notices</text>

<text x="420" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الطبيب يقرّر</text>

<text x="130" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">The doctor decides</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فكّر لحظة</text>

<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">THINK FOR A MOMENT</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لو أخطأ الجهاز، فمن <tspan font-weight="bold" fill="#17457f">يُحاسَب:</tspan></tspan>
  <tspan x="935" dy="40">الجهاز أم الطبيب؟ ولماذا؟</tspan>
</text>

<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">If the machine is wrong,</tspan>
  <tspan x="140" dy="40">who is <tspan font-weight="bold" fill="#17457f">held responsible:</tspan> the machine</tspan>
  <tspan x="140" dy="40">or the doctor? Why?</tspan>
</text>
</svg>
