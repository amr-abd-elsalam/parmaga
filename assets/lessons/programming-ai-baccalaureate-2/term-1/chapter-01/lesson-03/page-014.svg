<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fc3e8"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="688" width="870" height="208" rx="16" fill="#22303f" opacity=".12"/>
<rect x="124" y="922" width="840" height="334" rx="20" fill="#22303f" opacity=".18"/>

<!-- Warning card -->
<rect x="105" y="682" width="870" height="208" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="698" width="6" height="176" rx="3" fill="#c96a1b"/>

<!-- Illustration: menu translated by phone camera -->
<g>
  <rect x="120" y="916" width="840" height="334" rx="20" fill="url(#ilBg)"/>

  <!-- Restaurant table -->
  <path d="M120 1196 H960 V1230 Q960 1250 940 1250 H140 Q120 1250 120 1230 Z" fill="#b07a45"/>
  <line x1="121" y1="1196" x2="959" y2="1196" stroke="#7d4f28" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hanging lamp -->
  <line x1="440" y1="918" x2="440" y2="944" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 418 966 Q 418 944 440 944 Q 462 944 462 966 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right: foreign menu card -->
  <rect x="714" y="951" width="210" height="236" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="710" y="945" width="210" height="236" rx="14" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="722" y="958" width="186" height="28" rx="6" fill="#c96a1b"/>
  <path d="M 765 972 q 5 -8 10 0 t 10 0 t 10 0 t 10 0 t 10 0 t 10 0 t 10 0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 735 1020 q 6 -9 12 0 t 12 0 t 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 862 1020 q 5 -9 10 0 t 10 0" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 735 1060 q 6 -9 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 862 1060 q 5 -9 10 0 t 10 0" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 735 1100 q 6 -9 12 0 t 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 862 1100 q 5 -9 10 0 t 10 0" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 735 1140 q 6 -9 12 0 t 12 0 t 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 862 1140 q 5 -9 10 0 t 10 0" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Scanning beam -->
  <polygon points="572,1030 700,985 700,1110 572,1070" fill="#4fc3e8" opacity=".35"/>

  <!-- Middle: hand holding phone -->
  <rect x="508" y="1120" width="56" height="128" rx="16" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="494" y="1070" width="82" height="62" rx="26" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="500" y="990" width="70" height="124" rx="12" fill="#22303f"/>
  <rect x="506" y="1000" width="58" height="104" rx="6" fill="url(#ilScreen)"/>
  <circle cx="535" cy="995" r="2" fill="#7f95ab"/>
  <ellipse cx="504" cy="1076" rx="10" ry="18" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="574" cy="1050" rx="9" ry="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="575" cy="1068" rx="9" ry="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="574" cy="1086" rx="9" ry="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

  <!-- Left: phone screen with the clear menu -->
  <rect x="184" y="946" width="200" height="286" rx="22" fill="#22303f" opacity=".18"/>
  <rect x="180" y="940" width="200" height="286" rx="22" fill="#22303f"/>
  <rect x="192" y="958" width="176" height="250" rx="12" fill="#ffffff"/>
  <rect x="204" y="972" width="152" height="24" rx="6" fill="#2f7fb5"/>
  <rect x="236" y="981" width="88" height="6" rx="3" fill="#ffffff"/>

  <g transform="translate(226 1036)">
    <path d="M -16 -4 H 16 Q 16 14 0 14 Q -16 14 -16 -4 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M -5 -10 Q -8 -15 -5 -20" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 5 -10 Q 2 -15 5 -20" fill="none" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="254" y="1026" width="96" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="254" y="1040" width="62" height="8" rx="4" fill="#a9dcbe"/>

  <g transform="translate(224 1104)">
    <rect x="-12" y="-12" width="22" height="26" rx="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 10 -6 Q 20 -6 20 1 Q 20 8 10 8" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="254" y="1094" width="96" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="254" y="1108" width="62" height="8" rx="4" fill="#a9dcbe"/>

  <g transform="translate(226 1168)">
    <ellipse cx="0" cy="0" rx="18" ry="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <ellipse cx="0" cy="-2" rx="9" ry="4" fill="#c96a1b"/>
  </g>
  <rect x="254" y="1158" width="96" height="8" rx="4" fill="#8fc9f2"/>
  <rect x="254" y="1172" width="62" height="8" rx="4" fill="#a9dcbe"/>

  <circle cx="370" cy="950" r="16" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 362 950 L 368 956 L 379 944" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="916" width="840" height="334" rx="20" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Emotion face: thinking, beside paragraph 1 -->
<g transform="translate(900 364)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: open book beside paragraph 2 -->
<g transform="translate(880 572)">
  <path d="M28 12 Q16 4 4 8 V46 Q16 42 28 50 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 12 Q40 4 52 8 V46 Q40 42 28 50 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="10" y1="20" x2="22" y2="22" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="30" x2="22" y2="32" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="22" x2="46" y2="20" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="32" x2="46" y2="30" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: warning triangle inside card -->
<g transform="translate(620 690)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25.5" y="18" width="5" height="18" rx="2.5" fill="#22303f"/>
  <circle cx="28" cy="43" r="3" fill="#22303f"/>
</g>

<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الساعة 4:00 عصرًا — الترجمة الآلية</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">4:00 p.m. — Machine Translation</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قائمة طعام بلغة لا تعرفها؟</tspan>
  <tspan x="950" dy="40">وجّه إليها <tspan font-weight="bold" fill="#17457f">كاميرا هاتفك</tspan> فتظهر <tspan font-weight="bold" fill="#2e7d32">الترجمة.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A menu in a language you don't know?</tspan>
  <tspan x="120" dy="40">Point your <tspan font-weight="bold" fill="#17457f">phone camera</tspan> at it</tspan>
  <tspan x="120" dy="40">and the <tspan font-weight="bold" fill="#2e7d32">translation appears.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الترجمة الآلية</tspan> هي ترجمة النص من لغة</tspan>
  <tspan x="950" dy="40">إلى أخرى <tspan font-weight="bold" fill="#17457f">تلقائيًا</tspan> بالكمبيوتر، دون مترجم بشري.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Machine translation</tspan> is translating text</tspan>
  <tspan x="120" dy="40">between languages <tspan font-weight="bold" fill="#17457f">automatically</tspan> by</tspan>
  <tspan x="120" dy="40">computer, without a human translator.</tspan>
</text>

<!-- Warning card text -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخ امتحان</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">EXAM TRAP</text>
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">«يترجم فيها البشر يدويًا» <tspan font-weight="bold" fill="#17457f">عبارة خاطئة.</tspan></text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">"Humans translate it by hand"</tspan>
  <tspan x="140" dy="40">is a <tspan font-weight="bold" fill="#17457f">false statement.</tspan></tspan>
</text>
</svg>
