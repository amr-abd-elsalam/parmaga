    <path d="M -39 -3 Q -42 -48 0 -48 Q 42 -48 39 -3 Q 21 -27 -6 -30 Q -27 -27 -39 -3 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
