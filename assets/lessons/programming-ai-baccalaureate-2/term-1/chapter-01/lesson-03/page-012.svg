    <path d="M -12 18 Q 0 27 12 18" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="198" y="512" width="96" height="106" rx="6" fill="none" stroke="#c96a1b" stroke-width="3"/>
  <rect x="176" y="500" width="140" height="192" rx="10" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <rect x="336" y="500" width="148" height="192" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 378 624 Q 378 594 410 594 Q 442 594 442 624 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="translate(410 562)">
    <circle cx="0" cy="0" r="26" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -26 -2 Q -28 -32 0 -32 Q 28 -32 26 -2 Q 14 -18 -4 -20 Q -18 -18 -26 -2 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-9" cy="2" r="3" fill="#22303f"/>
    <circle cx="9" cy="2" r="3" fill="#22303f"/>
    <path d="M -8 12 Q 0 18 8 12" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="360" y="642" width="100" height="10" rx="5" fill="#8fc9f2"/>
  <rect x="360" y="664" width="76" height="10" rx="5" fill="#8fc9f2"/>
  <circle cx="474" cy="506" r="20" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 464 506 L 471 513 L 484 499" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="120" y="432" width="840" height="400" rx="20" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: light bulb beside paragraph 2 -->
<g transform="translate(126 302)">
  <line x1="6" y1="6" x2="11" y2="11" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="6" x2="45" y2="11" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="8" y2="24" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="24" x2="48" y2="24" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="22" r="17" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="37" width="16" height="13" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="22" y1="43.5" x2="34" y2="43.5" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Emotion face: thinking -->
<g transform="translate(920 250)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: warning triangle inside card -->
<g transform="translate(760 1074)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25.5" y="18" width="5" height="18" rx="2.5" fill="#22303f"/>
  <circle cx="28" cy="43" r="3" fill="#22303f"/>
</g>

<!-- Icon: shield inside card -->
<g transform="translate(850 1074)">
  <path d="M28 4 L50 12 V28 Q50 46 28 54 Q6 46 6 28 V12 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 12 L42 17 V28 Q42 40 28 46 Z" fill="#8fc9f2"/>
</g>

<!-- Bottom icon group -->
<g transform="translate(404 1192)">
  <path d="M14 24 V16 Q14 4 26 4 Q38 4 38 16 V24" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="6" y="22" width="40" height="28" rx="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="26" cy="33" r="4" fill="#22303f"/>
  <rect x="24.5" y="35" width="3" height="9" rx="1.5" fill="#22303f"/>
</g>
