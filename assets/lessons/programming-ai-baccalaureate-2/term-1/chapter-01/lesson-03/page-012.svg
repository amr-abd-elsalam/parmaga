  <path d="M 792 692 V640 Q 792 608 830 608 Q 868 608 868 640 V692 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="translate(830 576)">
    <circle cx="0" cy="0" r="26" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -26 -2 Q -28 -32 0 -32 Q 28 -32 26 -2 Q 14 -18 -4 -20 Q -18 -18 -26 -2 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="-9" cy="2" r="3" fill="#22303f"/>
