  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(624 1192)">
  <line x1="10" y1="42" x2="46" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="42" x2="28" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="42" x2="28" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="10" cy="42" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="46" cy="42" r="8" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الاكتشاف</tspan> (Detection) يجيب: «هل يوجد وجه؟»،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">والتعرف</tspan> (Recognition) يجيب: «وجه مَن هذا؟».</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Detection</tspan> answers "Is there a face?";</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">recognition</tspan> answers "Whose face is it?"</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">وفتح هاتفك يحتاج إلى <tspan font-weight="bold" fill="#17457f">الخطوتين معًا.</tspan></text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Unlocking your phone needs <tspan font-weight="bold" fill="#17457f">both steps.</tspan></text>

<!-- Illustration labels -->
<text x="796" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">اكتشاف</text>
<text x="680" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Detection</text>
<text x="370" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تعرّف</text>
<text x="245" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Recognition</text>

<!-- Warning card text -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">خلي بالك</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">ITS CAUTION</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الوجه <tspan font-weight="bold" fill="#17457f">بيانات حساسة،</tspan> والتطابق الخاطئ</tspan>
  <tspan x="935" dy="40">قد يظلم إنسانًا بريئًا.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A face is <tspan font-weight="bold" fill="#17457f">sensitive data,</tspan></tspan>
  <tspan x="140" dy="40">and a false match can harm</tspan>
  <tspan x="140" dy="40">an innocent person.</tspan>
</text>
</svg>
