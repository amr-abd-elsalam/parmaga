<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="124" y="438" width="840" height="400" rx="20" fill="#22303f" opacity=".18"/>
<rect x="109" y="888" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>

<!-- Warning card -->
