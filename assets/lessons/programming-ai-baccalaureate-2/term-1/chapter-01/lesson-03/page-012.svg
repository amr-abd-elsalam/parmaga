  <rect x="714" y="538" width="72" height="74" rx="4" fill="none" stroke="#c96a1b" stroke-width="3"/>
  <rect x="600" y="480" width="300" height="212" rx="10" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Arrow from detection to recognition -->
  <line x1="570" y1="586" x2="522" y2="586" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="508,586 524,576 524,596" fill="#c0392b"/>

  <!-- Left card: matching the face with a profile -->
  <rect x="164" y="466" width="340" height="252" rx="16" fill="#22303f" opacity=".18"/>
  <rect x="160" y="460" width="340" height="252" rx="16" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="176" y="500" width="140" height="192" rx="10" fill="url(#ilScan)"/>
  <path d="M 196 692 V664 Q 196 632 246 632 Q 296 632 296 664 V692 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="236" y="602" width="20" height="32" fill="#d59f6f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
