  <rect x="580" y="460" width="340" height="252" rx="16" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="600" y="480" width="300" height="212" rx="10" fill="url(#ilPhoto)"/>
  <ellipse cx="860" cy="506" rx="22" ry="10" fill="#ffffff"/>
  <ellipse cx="640" cy="512" rx="16" ry="8" fill="#ffffff"/>

