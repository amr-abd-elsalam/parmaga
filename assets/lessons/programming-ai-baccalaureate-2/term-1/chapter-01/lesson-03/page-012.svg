  <rect x="67" y="72" width="946" height="1228" rx="4" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <rect x="105" y="200" width="870" height="108" rx="14" fill="#fdf6d8" stroke="#d9c77a" stroke-width="2"/>

  <rect x="906" y="332" width="54" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="906" y="488" width="54" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="906" y="572" width="54" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="906" y="728" width="54" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>

  <rect x="100" y="916" width="880" height="249" rx="16" fill="#e9f6ea" stroke="#3d8b52" stroke-width="2"/>
  <line x1="140" y1="984" x2="945" y2="984" stroke="#7fbf8f" stroke-width="1.6"/>

  <text x="540" y="132"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#1b4a80">مثال محلول: صح أم خطأ؟</text>

  <text x="540" y="176"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#152b42">Worked Example: True or False?</text>

  <text x="940" y="246"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">ضع علامة صح أو خطأ أمام كل عبارة.</text>

  <text x="135" y="290"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">Mark each statement True or False.</text>

  <text x="874" y="372"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#c0392b">A</text>

  <text x="845" y="372"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="845" dy="0">يبرع الذكاء الاصطناعي في الاستدلال الاحتمالي</tspan>
    <tspan x="845" dy="38">والتنبؤ اعتمادًا على البيانات.</tspan>
  </text>

  <text x="120" y="450"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="120" dy="0">AI is good at probabilistic reasoning</tspan>
    <tspan x="120" dy="34">and prediction based on data.</tspan>
  </text>

  <text x="874" y="528"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#c0392b">B</text>

  <text x="845" y="528"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="845" dy="0">يبرع الذكاء الاصطناعي في التعرّف على الصور والصوت.</tspan>
  </text>

  <text x="120" y="568"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="120" dy="0">AI is good at recognizing images and audio.</tspan>
  </text>

  <text x="874" y="612"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#c0392b">C</text>

  <text x="845" y="612"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="845" dy="0">من المقبول ترك الأحكام الأخلاقية</tspan>
    <tspan x="845" dy="38">للذكاء الاصطناعي بالكامل.</tspan>
  </text>

  <text x="120" y="690"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="120" dy="0">It is fine to leave ethical judgments</tspan>
    <tspan x="120" dy="34">entirely to AI.</tspan>
  </text>

  <text x="874" y="768"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#c0392b">D</text>

  <text x="845" y="768"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="845" dy="0">قد تصبح أحكام الذكاء الاصطناعي غير دقيقة</tspan>
    <tspan x="845" dy="38">عندما تكون بيانات التدريب متحيزة.</tspan>
  </text>

  <text x="120" y="846"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="120" dy="0">AI judgments can become inaccurate</tspan>
    <tspan x="120" dy="34">when training data is biased.</tspan>
  </text>

  <text x="945" y="964"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#1f6b3a">حل الجزء الأول</text>

  <text x="140" y="964"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1f6b3a">| Solution to Part One</text>

  <text x="945" y="1026"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#256d3a">أ–A: نظام التوصية</text>

  <text x="140" y="1026"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#14532d">| Recommendation System</text>

  <text x="945" y="1061"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#256d3a">ب–B: المساعد الصوتي</text>

  <text x="140" y="1061"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#14532d">| Voice Assistant</text>

  <text x="945" y="1096"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#256d3a">ج–C: الترجمة الآلية</text>

  <text x="140" y="1096"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#14532d">| Machine Translation</text>

  <text x="945" y="1131"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#256d3a">د–D: التعرّف على الوجه</text>

  <text x="140" y="1131"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#14532d">| Face Recognition</text>

</svg>
