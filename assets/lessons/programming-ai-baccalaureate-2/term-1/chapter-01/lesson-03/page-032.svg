<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilSkyBlackBox" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
</defs>

<!-- Outlined box: shadow, fill, accent -->
<rect x="109" y="768" width="870" height="208" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="762" width="870" height="208" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="778" width="6" height="176" rx="3" fill="#2f7fb5"/>

<!-- Icon: chip with pins (AI) -->
<g transform="translate(864 324)">
  <line x1="18" y1="4" x2="18" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="4" x2="28" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="4" x2="38" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="18" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="28" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="38" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="18" x2="12" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="28" x2="12" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="38" x2="12" y2="38" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="52" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="52" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="38" x2="52" y2="38" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="12" y="12" width="32" height="32" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="20" width="16" height="16" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Face: thinking (the classmate story) -->
<g transform="translate(900 654)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon in box: light bulb (think) -->
<g transform="translate(866 902)">
  <circle cx="28" cy="22" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="21" y="36" width="14" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="23" y1="51" x2="33" y2="51" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M22 22 Q 28 14 34 22" fill="none" stroke="#c96a1b" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Illustration: data enters a closed black box, a result comes out -->
<g>
  <rect x="109" y="994" width="870" height="260" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="988" width="870" height="260" rx="24" fill="url(#ilSkyBlackBox)"/>
  <path d="M105 1222 H975 V1224 Q975 1248 951 1248 H129 Q105 1248 105 1224 Z" fill="#dff1f7"/>
  <line x1="105" y1="1222" x2="975" y2="1222" stroke="#7f95ab" stroke-width="2"/>

  <!-- Clouds -->
  <ellipse cx="380" cy="1012" rx="30" ry="10" fill="#ffffff"/>
  <ellipse cx="404" cy="1004" rx="18" ry="10" fill="#ffffff"/>
  <ellipse cx="730" cy="1008" rx="28" ry="10" fill="#ffffff"/>

  <!-- Input arrow into the box -->
  <line x1="830" y1="1132" x2="670" y2="1132" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="656,1132 670,1124 670,1140" fill="#c0392b"/>

  <!-- Data cards (input) -->
  <g transform="rotate(-12 880 1138)">
    <rect x="848" y="1098" width="64" height="80" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="rotate(10 880 1138)">
    <rect x="848" y="1098" width="64" height="80" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <rect x="858" y="1112" width="40" height="6" rx="3" fill="#f0c48c"/>
  </g>
  <rect x="852" y="1104" width="64" height="80" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="848" y="1098" width="64" height="80" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="858" y="1112" width="44" height="6" rx="3" fill="#c96a1b"/>
  <rect x="858" y="1126" width="34" height="6" rx="3" fill="#c96a1b"/>
  <circle cx="868" cy="1152" r="7" fill="#f0c48c" stroke="#22303f" stroke-width="2"/>
  <rect x="882" y="1149" width="20" height="6" rx="3" fill="#c96a1b"/>

  <!-- Closed black box -->
  <polygon points="474,1042 504,1016 654,1016 654,1136 624,1162 474,1162" fill="#22303f" opacity=".18"/>
  <rect x="470" y="1036" width="150" height="120" fill="#22303f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="470,1036 500,1010 650,1010 620,1036" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="620,1036 650,1010 650,1130 620,1156" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M524 1078 A22 22 0 1 1 557 1097 L552 1102 V1114 H540 V1098 L551 1087 A10 10 0 1 0 536 1078 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="546" cy="1132" r="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

  <!-- Output arrow from the box -->
  <line x1="462" y1="1120" x2="292" y2="1120" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="278,1120 292,1112 292,1128" fill="#c0392b"/>

  <!-- Result card (output) -->
  <rect x="164" y="1092" width="100" height="72" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="160" y="1086" width="100" height="72" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="172" y="1100" width="70" height="6" rx="3" fill="#ffd24a"/>
  <rect x="172" y="1116" width="70" height="6" rx="3" fill="#c96a1b"/>
  <rect x="172" y="1130" width="56" height="6" rx="3" fill="#c96a1b"/>
  <rect x="172" y="1144" width="64" height="6" rx="3" fill="#c96a1b"/>

  <!-- Student peeking with a flashlight -->
  <rect x="356" y="1214" width="14" height="22" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="376" y="1214" width="14" height="22" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="363" cy="1238" rx="10" ry="4" fill="#22303f"/>
  <ellipse cx="383" cy="1238" rx="10" ry="4" fill="#22303f"/>
  <rect x="348" y="1170" width="50" height="50" rx="12" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="373" cy="1150" r="20" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M353 1147 Q 355 1128 373 1128 Q 391 1128 393 1147 Q 383 1137 353 1147 Z" fill="#2b211c"/>
  <circle cx="371" cy="1149" r="2.5" fill="#22303f"/>
  <circle cx="383" cy="1149" r="2.5" fill="#22303f"/>
  <path d="M371 1159 L381 1158" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <polygon points="390,1176 398,1186 432,1164 426,1154" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="rotate(-30 446 1150)">
    <rect x="432" y="1143" width="30" height="14" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
    <rect x="460" y="1140" width="8" height="20" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <circle cx="430" cy="1160" r="7" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="468,1138 520,1104 540,1138" fill="#ffd24a" opacity=".35"/>

  <rect x="105" y="988" width="870" height="260" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">مشكلة الصندوق الأسود</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Black-Box Problem</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نرى <tspan font-weight="bold" fill="#17457f">المُدخل والنتيجة،</tspan> لكننا <tspan font-weight="bold" fill="#c0392b">لا نفهم</tspan> كيف وصل</tspan>
  <tspan x="950" dy="40">الذكاء الاصطناعي إلى نتيجته.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">We see the <tspan font-weight="bold" fill="#17457f">input and the result,</tspan> but</tspan>
  <tspan x="120" dy="40">we <tspan font-weight="bold" fill="#c0392b">cannot understand</tspan> how the AI</tspan>
  <tspan x="120" dy="40">reached its result.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل زميلًا أجاب <tspan font-weight="bold" fill="#2e7d32">إجابة صحيحة،</tspan> فلما سأله</tspan>
  <tspan x="950" dy="40">المعلم: «كيف وصلت إليها؟» قال:</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">«لا أعرف،</tspan> أحسست بذلك».</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine a classmate who answered</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">correctly,</tspan> and when the teacher asked,</tspan>
  <tspan x="120" dy="40">"How did you get it?" said,</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">"I don't know,</tspan> I just felt it."</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">فكّر لحظة</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">THINK FOR A MOMENT</tspan>
</text>
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">هل تثق بإجابته في <tspan fill="#c96a1b">امتحان؟</tspan> وفي <tspan fill="#c96a1b">تشخيص مرض؟</tspan></tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Would you trust his answer in a <tspan fill="#c96a1b">test?</tspan></tspan>
  <tspan x="140" dy="40">In <tspan fill="#c96a1b">diagnosing a disease?</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="935" y="1028" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مُدخل</tspan>
</text>
<text x="850" y="1064" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="850" dy="0">Input</tspan>
</text>
<text x="262" y="1028" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="262" dy="0">نتيجة</tspan>
</text>
<text x="165" y="1064" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="165" dy="0">Result</tspan>
</text>
</svg>
