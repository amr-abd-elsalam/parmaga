  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25.5" y="18" width="5" height="18" rx="2.5" fill="#22303f"/>
  <circle cx="28" cy="43" r="3" fill="#22303f"/>
</g>

<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">كيف يعرف ما يعجبك؟</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">How Does It Know What You Like?</text>

<!-- Bullet 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">يقارن اختياراتك باختيارات <tspan font-weight="bold" fill="#17457f">أشخاص يشبهونك.</tspan></text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">It compares your choices with those</tspan>
  <tspan x="132" dy="40">of <tspan font-weight="bold" fill="#17457f">people like you.</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">أو يقارن العناصر الجديدة بما <tspan font-weight="bold" fill="#17457f">أحببته من قبل.</tspan></text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Or it compares new items with things</tspan>
  <tspan x="132" dy="40">you <tspan font-weight="bold" fill="#17457f">liked before.</tspan></tspan>
</text>

<!-- Warning card text -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">خلي بالك</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">ITS CAUTION</text>
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">يستخدم <tspan font-weight="bold" fill="#17457f">بياناتك الشخصية،</tspan></tspan>
  <tspan x="935" dy="40">وقد يحبسك في <tspan font-weight="bold" fill="#17457f">نوع واحد</tspan> من المحتوى.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">It uses your <tspan font-weight="bold" fill="#17457f">personal data,</tspan></tspan>
  <tspan x="140" dy="40">and it can trap you</tspan>
  <tspan x="140" dy="40">in <tspan font-weight="bold" fill="#17457f">one type</tspan> of content.</tspan>
</text>

<!-- Illustration labels -->
<text x="845" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">أشخاص يشبهونك</text>
<text x="630" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">People like you</text>
<text x="398" y="1154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">ما أحببته</text>
<text x="218" y="1194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">What you liked</text>
</svg>
