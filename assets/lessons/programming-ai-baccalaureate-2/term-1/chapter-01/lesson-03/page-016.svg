<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWoodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6537"/>
      <stop offset="0.55" stop-color="#7d4e28"/>
      <stop offset="1" stop-color="#603a1c"/>
    </linearGradient>
    <linearGradient id="paperSheetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefcf5"/>
      <stop offset="1" stop-color="#faf5e6"/>
    </linearGradient>
  </defs>

  <!-- 1) خلفية المكتب الخشبي البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWoodGrad)"/>
  <path d="M0 250 C 300 205, 760 300, 1080 235" fill="none" stroke="#4d2d13" stroke-width="14" opacity="0.10"/>
  <path d="M0 1080 C 340 1140, 720 1030, 1080 1105" fill="none" stroke="#4d2d13" stroke-width="16" opacity="0.09"/>

  <!-- 2) ظل بسيط + ورقة دفتر دافئة -->
  <rect x="42" y="36" width="1012" height="1298" rx="10" fill="#2b1a0c" opacity="0.22"/>
  <rect x="34" y="26" width="1012" height="1298" rx="10" fill="url(#paperSheetGrad)"/>

  <!-- 3) سطور الدفتر الأفقية الزرقاء الباهتة -->
  <g stroke="#c5daea" stroke-width="1.4">
    <line x1="80" y1="110" x2="1000" y2="110"/>
    <line x1="80" y1="146" x2="1000" y2="146"/>
    <line x1="80" y1="182" x2="1000" y2="182"/>
    <line x1="80" y1="218" x2="1000" y2="218"/>
    <line x1="80" y1="254" x2="1000" y2="254"/>
    <line x1="80" y1="290" x2="1000" y2="290"/>
    <line x1="80" y1="326" x2="1000" y2="326"/>
    <line x1="80" y1="362" x2="1000" y2="362"/>
    <line x1="80" y1="398" x2="1000" y2="398"/>
    <line x1="80" y1="434" x2="1000" y2="434"/>
    <line x1="80" y1="470" x2="1000" y2="470"/>
    <line x1="80" y1="506" x2="1000" y2="506"/>
    <line x1="80" y1="542" x2="1000" y2="542"/>
    <line x1="80" y1="578" x2="1000" y2="578"/>
    <line x1="80" y1="614" x2="1000" y2="614"/>
    <line x1="80" y1="650" x2="1000" y2="650"/>
    <line x1="80" y1="686" x2="1000" y2="686"/>
    <line x1="80" y1="722" x2="1000" y2="722"/>
    <line x1="80" y1="758" x2="1000" y2="758"/>
    <line x1="80" y1="794" x2="1000" y2="794"/>
    <line x1="80" y1="830" x2="1000" y2="830"/>
    <line x1="80" y1="866" x2="1000" y2="866"/>
    <line x1="80" y1="902" x2="1000" y2="902"/>
    <line x1="80" y1="938" x2="1000" y2="938"/>
    <line x1="80" y1="974" x2="1000" y2="974"/>
    <line x1="80" y1="1010" x2="1000" y2="1010"/>
    <line x1="80" y1="1046" x2="1000" y2="1046"/>
    <line x1="80" y1="1082" x2="1000" y2="1082"/>
    <line x1="80" y1="1118" x2="1000" y2="1118"/>
    <line x1="80" y1="1154" x2="1000" y2="1154"/>
  </g>

  <!-- 4) الإطار الأحمر الخارجي الرفيع الوحيد -->
  <rect x="67" y="62" width="946" height="1250" rx="6"
        fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- 5) خلفيات البطاقات والأشرطة -->
  <rect x="105" y="208" width="870" height="42" rx="10" fill="#e6f4e4" stroke="#7fb37c" stroke-width="1.6"/>
  <rect x="105" y="512" width="870" height="42" rx="10" fill="#e6f4e4" stroke="#7fb37c" stroke-width="1.6"/>
  <rect x="105" y="724" width="870" height="42" rx="10" fill="#e6f4e4" stroke="#7fb37c" stroke-width="1.6"/>
  <rect x="105" y="964" width="870" height="200" rx="14" fill="#fdf6dc" stroke="#d8c689" stroke-width="1.8"/>

  <!-- 6) خطوط وظيفية بسيطة -->
  <line x1="360" y1="196" x2="720" y2="196" stroke="#c0392b" stroke-width="2" opacity="0.75"/>

  <!-- 7) النص التعليمي -->

  <!-- العنوان العربي -->
  <text x="540" y="140"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#123f66">فكّر كمهندس: ابحث ثم قرر</text>

  <!-- العنوان الإنجليزي -->
  <text x="540" y="180"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#1d3a56">Think as an Engineer: Investigate and Decide</text>

  <!-- عنوان القسم الأول -->
  <text x="128" y="238"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1e7a33">1.</text>
  <text x="235" y="239"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1b5e20">ابحث</text>
  <text x="252" y="238"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14304a">| Investigate</text>

  <!-- فقرة القسم الأول بالعربية -->
  <text x="950" y="288"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1e5fa8">
    <tspan x="950" dy="0">اختر مجالًا واحدًا من الدرس غير الزراعة: الرعاية الصحية،</tspan>
    <tspan x="950" dy="34">أو التصنيع، أو الخدمات اللوجستية. ابحث عن مثال حقيقي وموثّق</tspan>
    <tspan x="950" dy="34">لاستخدام الذكاء الاصطناعي فيه، وسجّل المصدر الذي استخدمته.</tspan>
  </text>

  <!-- فقرة القسم الأول بالإنجليزية -->
  <text x="120" y="392"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="120" dy="0">Choose one industry from the lesson other than agriculture:</tspan>
    <tspan x="120" dy="29">healthcare, manufacturing, or logistics. Find one real,</tspan>
    <tspan x="120" dy="29">documented example of AI being used in it and record the</tspan>
    <tspan x="120" dy="29">source you used.</tspan>
  </text>

  <!-- عنوان القسم الثاني -->
  <text x="128" y="542"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1e7a33">2.</text>
  <text x="235" y="543"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1b5e20">وازن</text>
  <text x="252" y="542"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14304a">| Weigh It Up</text>

  <!-- فقرة القسم الثاني بالعربية -->
  <text x="950" y="592"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1e5fa8">
    <tspan x="950" dy="0">دوّن فائدة واحدة وجانبًا واحدًا يتطلب الحذر عند استخدام</tspan>
    <tspan x="950" dy="34">الذكاء الاصطناعي في هذا المجال.</tspan>
  </text>

  <!-- فقرة القسم الثاني بالإنجليزية -->
  <text x="120" y="662"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="120" dy="0">Note one benefit and one caution of using AI</tspan>
    <tspan x="120" dy="29">in that industry.</tspan>
  </text>

  <!-- عنوان القسم الثالث -->
  <text x="128" y="754"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1e7a33">3.</text>
  <text x="235" y="755"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1b5e20">قرر</text>
  <text x="252" y="754"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14304a">| Decide</text>

  <!-- فقرة القسم الثالث بالعربية -->
  <text x="950" y="804"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1e5fa8">
    <tspan x="950" dy="0">هل ينبغي استخدام الذكاء الاصطناعي لهذه المهمة بمفرده،</tspan>
    <tspan x="950" dy="34">أم مع مراجعة بشرية؟ اقترح نهجًا واحدًا، وقدّم سببين.</tspan>
  </text>

  <!-- فقرة القسم الثالث بالإنجليزية -->
  <text x="120" y="874"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="120" dy="0">Should this industry use AI for this task on its own</tspan>
    <tspan x="120" dy="29">or with a human checking the result? Recommend one</tspan>
    <tspan x="120" dy="29">approach and give two reasons.</tspan>
  </text>

  <!-- عنوان بطاقة التلميح -->
  <text x="230" y="1003"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#8a6d1f">تلميح</text>
  <text x="242" y="1002"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#8a6d1f">| Hint</text>

  <!-- نص التلميح بالعربية -->
  <text x="930" y="1044"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24"
        fill="#1e5fa8">
    <tspan x="930" dy="0">يجيد الذكاء الاصطناعي اكتشاف الأنماط بسرعة، لكننا نحتاج إلى إشراف</tspan>
    <tspan x="930" dy="32">بشري عندما قد يضر القرار الخاطئ بأحد الأشخاص أو يتعلق بالمسؤولية.</tspan>
  </text>

  <!-- نص التلميح بالإنجليزية -->
  <text x="150" y="1112"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#152b42">
    <tspan x="150" dy="0">AI is good at finding patterns quickly, but a human is needed</tspan>
    <tspan x="150" dy="30">when a wrong result could harm someone or involve responsibility.</tspan>
  </text>

</svg>
