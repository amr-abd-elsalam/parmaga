  <path d="M22 46 Q22 26 34 26 Q46 26 46 46 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="34" cy="14" r="8" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: tag beside bullet 2 -->
