<!-- Icon: people beside bullet 1 -->
<g transform="translate(870 264)">
  <path d="M4 46 Q4 26 16 26 Q28 26 28 46 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
