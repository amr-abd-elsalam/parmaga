  <path d="M 475 884 Q 481 882 487 884" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="470" y="978" width="316" height="50" rx="14" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="rotate(33 505 915)">
    <rect x="495" y="905" width="66" height="20" rx="10" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Phone with screen glow -->
  <polygon points="546,906 506,862 506,890" fill="#8fc9f2" opacity=".35"/>
  <rect x="546" y="892" width="38" height="64" rx="7" fill="#22303f"/>
  <rect x="551" y="900" width="28" height="48" rx="4" fill="#4fc3e8"/>
