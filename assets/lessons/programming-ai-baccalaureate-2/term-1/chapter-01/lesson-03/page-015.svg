<!-- Memory illustration: night playlist -->
<g>
  <rect x="240" y="1116" width="600" height="128" rx="18" fill="url(#ilBand)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="300" cy="1180" r="40" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="296" cy="1180" r="20" fill="#ffd24a"/>
  <circle cx="306" cy="1173" r="18" fill="#17457f"/>
  <circle cx="320" cy="1198" r="3" fill="#ffd24a"/>
  <circle cx="280" cy="1158" r="2.5" fill="#ffd24a"/>

  <rect x="640" y="1153" width="80" height="54" rx="8" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="672,1169 672,1191 692,1180" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="520" y="1153" width="80" height="54" rx="8" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="552,1169 552,1191 572,1180" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="400" y="1153" width="80" height="54" rx="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="432,1169 432,1191 452,1180" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <line x1="634" y1="1180" x2="614" y2="1180" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="604,1180 616,1173 616,1187" fill="#c0392b"/>
  <line x1="514" y1="1180" x2="494" y2="1180" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="484,1180 496,1173 496,1187" fill="#c0392b"/>

  <g transform="translate(752 1152)">
    <polygon points="28,4 33.9,19.9 50.8,20.6 37.5,31.1 42.1,47.4 28,38 13.9,47.4 18.5,31.1 5.2,20.6 22.1,19.9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
