<!-- Section header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">الساعة 10:00 مساءً — نظام التوصية</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">10:00 p.m. — Recommendation System</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تفتح فيديو واحدًا، <tspan font-weight="bold" fill="#17457f">فيقترح</tspan> عليك التطبيق غيره،</tspan>
  <tspan x="950" dy="40">فتجد الساعة صارت <tspan fill="#c96a1b">1:00!</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You open one video, the app <tspan font-weight="bold" fill="#17457f">suggests</tspan></tspan>
  <tspan x="120" dy="40">another, and suddenly it's <tspan fill="#c96a1b">1:00 a.m.!</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">نظام التوصية</tspan> يتوقع ما قد يعجبك</tspan>
  <tspan x="950" dy="40">من <tspan font-weight="bold" fill="#17457f">سلوكك السابق:</tspan> ما شاهدته،</tspan>
  <tspan x="950" dy="40">أو اشتريته، أو سمعته.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">recommendation system</tspan> predicts what</tspan>
  <tspan x="120" dy="40">you may like from your <tspan font-weight="bold" fill="#17457f">past behavior:</tspan></tspan>
  <tspan x="120" dy="40">what you watched, bought, or listened to.</tspan>
</text>
</svg>
