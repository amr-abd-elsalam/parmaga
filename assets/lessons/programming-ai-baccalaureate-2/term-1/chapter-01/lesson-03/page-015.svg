  <rect x="473" y="888" width="14" height="14" fill="#e8b98d" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="448" y="896" width="64" height="104" rx="26" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="480" cy="868" r="28" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M452 868 Q449 838 480 838 Q511 838 508 864 Q495 850 475 852 Q459 854 452 868 Z" fill="#2b211c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
