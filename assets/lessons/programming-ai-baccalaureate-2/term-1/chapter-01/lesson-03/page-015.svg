  <circle cx="552" cy="946" r="10" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

  <!-- Chain of video thumbnails -->
  <rect x="582" y="833" width="76" height="50" rx="8" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="612,848 612,868 630,858" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="507" y="764" width="66" height="44" rx="8" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="533,777 533,795 549,786" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="411" y="717" width="58" height="38" rx="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="434,728 434,744 448,736" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="325" y="690" width="50" height="32" rx="6" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="345,699 345,713 357,706" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <line x1="590" y1="830" x2="582" y2="820" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="576,812 586.6,817 576.6,823.6" fill="#c0392b"/>
  <line x1="504" y1="778" x2="482" y2="762" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
