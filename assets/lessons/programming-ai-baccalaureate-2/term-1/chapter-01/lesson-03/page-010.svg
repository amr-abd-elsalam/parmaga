<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>

<!-- Outlined box: shadow, fill, accent bar -->
<rect x="109" y="808" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="802" width="870" height="368" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="818" width="6" height="336" rx="3" fill="#2f7fb5"/>

<!-- Answer box (empty) -->
<rect x="877" y="1100" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>

<!-- Illustration: a likelihood, not a certainty -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="109" y="506" width="866" height="276" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="500" width="866" height="276" rx="24" fill="url(#ilBack)" stroke="#8fc9f2" stroke-width="2.5"/>

  <!-- Gauge (center) -->
  <path d="M374 730 A170 170 0 0 1 714 730 Z" fill="#22303f" opacity=".18"/>
  <rect x="364" y="724" width="360" height="24" rx="12" fill="#22303f" opacity=".18"/>
  <path d="M370 724 A170 170 0 0 1 710 724 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <g stroke="#22303f" stroke-width="2.5">
    <path d="M390 720 A150 150 0 0 1 433.93 613.93 L465.75 645.75 A105 105 0 0 0 435 720 Z" fill="#8fc9f2"/>
    <path d="M433.93 613.93 A150 150 0 0 1 540 570 L540 615 A105 105 0 0 0 465.75 645.75 Z" fill="#ffd24a"/>
    <path d="M540 570 A150 150 0 0 1 646.07 613.93 L614.25 645.75 A105 105 0 0 0 540 615 Z" fill="#f0c48c"/>
    <path d="M646.07 613.93 A150 150 0 0 1 690 720 L645 720 A105 105 0 0 0 614.25 645.75 Z" fill="#a9dcbe"/>
    <rect x="360" y="718" width="360" height="24" rx="12" fill="#2f7fb5"/>
    <polygon points="651.4,663.25 543.63,727.13 536.37,712.87" fill="#17457f"/>
    <circle cx="540" cy="720" r="14" fill="#ffd24a"/>
  </g>

  <!-- Movie ticket (right) -->
  <g transform="rotate(-8 835 650)">
    <path d="M776 606 H902 Q914 606 914 618 V642 A14 14 0 0 0 914 670 V694 Q914 706 902 706 H776 Q764 706 764 694 V670 A14 14 0 0 0 764 642 V618 Q764 606 776 606 Z" fill="#22303f" opacity=".18"/>
    <path d="M772 600 H898 Q910 600 910 612 V636 A14 14 0 0 0 910 664 V688 Q910 700 898 700 H772 Q760 700 760 688 V664 A14 14 0 0 0 760 636 V612 Q760 600 772 600 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
    <line x1="800" y1="610" x2="800" y2="690" stroke="#c96a1b" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="780" cy="625" r="4" fill="#c96a1b"/>
    <circle cx="780" cy="675" r="4" fill="#c96a1b"/>
    <g transform="translate(833 628) scale(.8)" stroke="#22303f" stroke-width="2.5">
      <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a"/>
    </g>
  </g>

  <!-- Cloud with raindrops (left) -->
  <g transform="translate(4 6)">
    <path d="M180 650 Q160 650 160 630 Q160 608 184 606 Q190 576 222 578 Q240 556 268 568 Q300 566 304 596 Q326 600 324 624 Q322 650 298 650 Z" fill="#22303f" opacity=".18"/>
  </g>
  <path d="M180 650 Q160 650 160 630 Q160 608 184 606 Q190 576 222 578 Q240 556 268 568 Q300 566 304 596 Q326 600 324 624 Q322 650 298 650 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <g fill="#4fc3e8" stroke="#22303f" stroke-width="2">
    <path d="M190 656 Q199 670 190 676 Q181 670 190 656 Z"/>
    <path d="M220 662 Q229 676 220 682 Q211 676 220 662 Z"/>
    <path d="M280 662 Q289 676 280 682 Q271 676 280 662 Z"/>
    <path d="M305 656 Q314 670 305 676 Q296 670 305 656 Z"/>
  </g>

  <!-- Small closed umbrella below the cloud -->
  <line x1="250" y1="690" x2="250" y2="698" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250 698 Q262 724 256 744 H244 Q238 724 250 698 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <path d="M250 744 V758 Q250 766 243 766 Q237 766 237 760" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: chip beside the header -->
<g transform="translate(122 106) scale(.8)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 8 V2 M22 8 V2 M29 8 V2 M15 36 V42 M22 36 V42 M29 36 V42 M8 15 H2 M8 22 H2 M8 29 H2 M36 15 H42 M36 22 H42 M36 29 H42" fill="none"/>
  <rect x="8" y="8" width="28" height="28" rx="4" fill="#2f7fb5"/>
  <rect x="15" y="15" width="14" height="14" rx="2" fill="#8fc9f2"/>
</g>

<!-- Icon: light bulb beside the Arabic paragraph -->
<g transform="translate(150 282)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 22 H9 M47 22 H52 M10 6 L14 10 M46 6 L42 10" fill="none" stroke="#c96a1b"/>
  <circle cx="28" cy="22" r="17" fill="#ffd24a"/>
  <path d="M22 24 L28 30 L34 24" fill="none"/>
  <rect x="20" y="38" width="16" height="13" rx="3" fill="#7f95ab"/>
</g>

<!-- Face: thinking, beside the answer box -->
<g transform="translate(800 1129)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Bottom icon row: documents, network, star -->
<g transform="translate(372 1194)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="14" y="2" width="34" height="44" rx="4" fill="#dff1f7"/>
  <rect x="6" y="10" width="34" height="44" rx="4" fill="#ffffff"/>
  <path d="M13 22 H33 M13 30 H33 M13 38 H27" fill="none" stroke="#2f7fb5"/>
</g>
<g transform="translate(512 1194)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M28 12 L10 44 M28 12 L46 44 M10 44 H46" fill="none" stroke="#2f7fb5"/>
  <circle cx="28" cy="12" r="9" fill="#4fc3e8"/>
  <circle cx="10" cy="44" r="9" fill="#8fc9f2"/>
  <circle cx="46" cy="44" r="9" fill="#8fc9f2"/>
</g>
<g transform="translate(652 1194)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الاستدلال الاحتمالي والتنبؤ</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Probabilistic Reasoning</tspan>
  <tspan x="120" dy="40">and Prediction</tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الذكاء الاصطناعي لا يقول «أكيد»،</tspan>
  <tspan x="950" dy="40">بل <tspan font-weight="bold" fill="#c0392b">«غالبًا»:</tspan> احتمال <tspan fill="#c96a1b">85%</tspan> أن يعجبك</tspan>
  <tspan x="950" dy="40">هذا الفيلم. هذا <tspan font-weight="bold" fill="#17457f">تخمين ذكي،</tspan> لا ضمان.</tspan>
</text>

<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">AI says <tspan font-weight="bold" fill="#c0392b">&quot;probably,&quot;</tspan> not &quot;certainly&quot;:</tspan>
  <tspan x="120" dy="40">an <tspan fill="#c96a1b">85%</tspan> chance you'll like this film.</tspan>
  <tspan x="120" dy="40">A <tspan font-weight="bold" fill="#17457f">smart guess,</tspan> not a guarantee.</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>

<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">توقّعات الطقس تقول: <tspan fill="#c96a1b">«احتمال المطر 70%».</tspan></tspan>
  <tspan x="935" dy="40">هل هذا وعد بأن السماء ستمطر؟</tspan>
</text>

<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The weather forecast says:</tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">&quot;70% chance of rain.&quot;</tspan></tspan>
  <tspan x="140" dy="40">Is that a promise that it will rain?</tspan>
</text>
</svg>
