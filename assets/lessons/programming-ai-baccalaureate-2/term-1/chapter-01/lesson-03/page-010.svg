<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6738"/>
      <stop offset="0.55" stop-color="#8a5a30"/>
      <stop offset="1" stop-color="#6d4522"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodBg)"/>
  <path d="M0,300 C300,262 780,338 1080,298" fill="none" stroke="#5b3818" stroke-width="26" opacity="0.12"/>
  <path d="M0,985 C270,1022 800,942 1080,988" fill="none" stroke="#5b3818" stroke-width="22" opacity="0.10"/>

  <rect x="42" y="38" width="1012" height="1294" rx="8" fill="#3c2411" opacity="0.22"/>
  <rect x="34" y="28" width="1012" height="1294" rx="8" fill="#fffdf7"/>

  <g stroke="#cfe1f2" stroke-width="1.4" opacity="0.85">
    <line x1="78" y1="108" x2="1002" y2="108"/>
    <line x1="78" y1="144" x2="1002" y2="144"/>
    <line x1="78" y1="180" x2="1002" y2="180"/>
    <line x1="78" y1="216" x2="1002" y2="216"/>
    <line x1="78" y1="252" x2="1002" y2="252"/>
    <line x1="78" y1="288" x2="1002" y2="288"/>
    <line x1="78" y1="324" x2="1002" y2="324"/>
    <line x1="78" y1="360" x2="1002" y2="360"/>
    <line x1="78" y1="396" x2="1002" y2="396"/>
    <line x1="78" y1="432" x2="1002" y2="432"/>
    <line x1="78" y1="468" x2="1002" y2="468"/>
    <line x1="78" y1="504" x2="1002" y2="504"/>
    <line x1="78" y1="540" x2="1002" y2="540"/>
    <line x1="78" y1="576" x2="1002" y2="576"/>
    <line x1="78" y1="612" x2="1002" y2="612"/>
    <line x1="78" y1="648" x2="1002" y2="648"/>
    <line x1="78" y1="684" x2="1002" y2="684"/>
    <line x1="78" y1="720" x2="1002" y2="720"/>
    <line x1="78" y1="756" x2="1002" y2="756"/>
    <line x1="78" y1="792" x2="1002" y2="792"/>
    <line x1="78" y1="828" x2="1002" y2="828"/>
    <line x1="78" y1="864" x2="1002" y2="864"/>
    <line x1="78" y1="900" x2="1002" y2="900"/>
    <line x1="78" y1="936" x2="1002" y2="936"/>
    <line x1="78" y1="972" x2="1002" y2="972"/>
    <line x1="78" y1="1008" x2="1002" y2="1008"/>
    <line x1="78" y1="1044" x2="1002" y2="1044"/>
    <line x1="78" y1="1080" x2="1002" y2="1080"/>
    <line x1="78" y1="1116" x2="1002" y2="1116"/>
    <line x1="78" y1="1152" x2="1002" y2="1152"/>
  </g>

  <rect x="67" y="63" width="946" height="1252" rx="6" fill="none" stroke="#d23b3b" stroke-width="2.6"/>

  <text x="540"
        y="118"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#17457f">فكّر وناقش</text>

  <text x="540"
        y="157"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#0e6f68">Think and Discuss</text>

  <line x1="392" y1="173" x2="688" y2="173" stroke="#178f88" stroke-width="3" stroke-linecap="round"/>

  <rect x="95" y="190" width="890" height="300" rx="16" fill="#e6f6f4" stroke="#178f88" stroke-width="2.6"/>

  <text x="950"
        y="230"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#0e6f68">الحالة الأولى: الرعاية الصحية | Healthcare</text>

  <text x="950"
        y="272"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1f5c9e">
    <tspan x="950" dy="0">يفكر أحد المستشفيات في استخدام نظام ذكاء اصطناعي لتشخيص</tspan>
    <tspan x="950" dy="33">الأمراض من صور الأشعة السينية. وضّح لماذا يجب أن يؤكد طبيب</tspan>
    <tspan x="950" dy="33">بشري التشخيص النهائي، وألا يُترك للذكاء الاصطناعي وحده.</tspan>
  </text>

  <text x="125"
        y="376"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16283f">
    <tspan x="125" dy="0">A hospital is considering using image-diagnosis</tspan>
    <tspan x="125" dy="29">AI to detect diseases from X-ray images. Explain</tspan>
    <tspan x="125" dy="29">why the final diagnosis should be confirmed by a</tspan>
    <tspan x="125" dy="29">human doctor rather than left to AI alone.</tspan>
  </text>

  <rect x="95" y="508" width="890" height="300" rx="16" fill="#e6f6f4" stroke="#178f88" stroke-width="2.6"/>

  <text x="950"
        y="548"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#0e6f68">الحالة الثانية: الخصوصية | Privacy</text>

  <text x="950"
        y="590"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1f5c9e">
    <tspan x="950" dy="0">تستخدم خدمات الذكاء الاصطناعي غالبًا بيانات شخصية، مثل</tspan>
    <tspan x="950" dy="33">ما تشاهده أو تشتريه أو تقوله. لماذا يثير ذلك مخاوف تتعلق</tspan>
    <tspan x="950" dy="33">بالخصوصية؟ ومن ينبغي أن يقرر كيفية استخدام بياناتك؟</tspan>
  </text>

  <text x="125"
        y="694"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16283f">
    <tspan x="125" dy="0">AI services often use your personal data, such as</tspan>
    <tspan x="125" dy="29">what you watch, buy, or say. Why does this raise</tspan>
    <tspan x="125" dy="29">privacy concerns, and who should decide how your</tspan>
    <tspan x="125" dy="29">data is used?</tspan>
  </text>

  <rect x="95" y="826" width="890" height="333" rx="16" fill="#e6f6f4" stroke="#178f88" stroke-width="2.6"/>

  <text x="950"
        y="866"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#0e6f68">تأمل وتحدَّ نفسك | Reflect and Challenge</text>

  <text x="950"
        y="908"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1f5c9e">
    <tspan x="950" dy="0">ما استخدام الذكاء الاصطناعي الذي فاجأك أكثر؟ وأين</tspan>
    <tspan x="950" dy="33">يتخذ الذكاء الاصطناعي قرارات تتعلق بك؟ اختر مهمة</tspan>
    <tspan x="950" dy="33">تحتاج إلى الحذر، واقترح قاعدة تجعل استخدام الذكاء</tspan>
    <tspan x="950" dy="33">الاصطناعي فيها أكثر أمانًا.</tspan>
  </text>

  <text x="125"
        y="1045"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16283f">
    <tspan x="125" dy="0">Which use of AI surprised you most? Where does AI</tspan>
    <tspan x="125" dy="29">make decisions about you? Choose one task where</tspan>
    <tspan x="125" dy="29">AI needs caution and suggest one rule that would</tspan>
    <tspan x="125" dy="29">make using AI for that task safer.</tspan>
  </text>

</svg>
