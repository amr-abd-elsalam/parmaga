<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المحطة 4: المستشفى (الرعاية الصحية)</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Stop 4: The Hospital (Healthcare)</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">الأشعة السينية</tspan> (X-ray) تُظهر العظام والصدر،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والتصوير المقطعي</tspan> (CT) يُظهر شرائح كثيرة</tspan>
  <tspan x="950" dy="40">من الجسم.</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">An <tspan font-weight="bold" fill="#17457f">X-ray</tspan> shows bones and the chest;</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">CT scan</tspan> shows many slices of the body.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي للتشخيص بالصور</tspan> تدرّب على</tspan>
  <tspan x="950" dy="40">آلاف الصور الطبية، فيلاحظ <tspan font-weight="bold" fill="#17457f">علامات مرض</tspan></tspan>
  <tspan x="950" dy="40">قد تفوت العين.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Image-diagnosis AI</tspan> is trained on</tspan>
  <tspan x="120" dy="40">thousands of medical images, so it notices</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">signs of disease</tspan> the eye might miss.</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">لكنه أداة مساعدة، والقرار للطبيب.</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">But it is a helping tool;</tspan>
  <tspan x="140" dy="40">the doctor decides.</tspan>
</text>
</svg>
