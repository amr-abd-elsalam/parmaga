<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فيمَ يبرع الذكاء الاصطناعي؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">What Is AI Good At?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">يلتقط النمط، يعرف الشكل، يتوقع القادم.</tspan>
</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Spots the pattern, knows the shape,</tspan>
  <tspan x="140" dy="40">predicts what's next.</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">يلتقط <tspan font-weight="bold" fill="#c0392b">النمط</tspan> ← إيجاد الأنماط وتصنيفها</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0">Spots the <tspan font-weight="bold" fill="#c0392b">pattern</tspan> →</tspan>
  <tspan x="132" dy="40">finding and classifying patterns</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">يعرف <tspan font-weight="bold" fill="#c0392b">الشكل</tspan> ← التعرف على الصور</tspan>
  <tspan x="950" dy="40">والصوت والنص وتوليدها</tspan>
</text>
<text x="132" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0">Knows the <tspan font-weight="bold" fill="#c0392b">shape</tspan> → recognizing and</tspan>
  <tspan x="132" dy="40">generating images, audio, text</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">يتوقع <tspan font-weight="bold" fill="#c0392b">القادم</tspan> ← التنبؤ الاحتمالي من البيانات</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0">Predicts <tspan font-weight="bold" fill="#c0392b">what's next</tspan> →</tspan>
  <tspan x="132" dy="40">probabilistic prediction from data</tspan>
</text>
</svg>
