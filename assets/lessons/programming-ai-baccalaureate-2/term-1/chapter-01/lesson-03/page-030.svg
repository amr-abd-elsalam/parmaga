  <circle cx="568" cy="1090" r="8" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>

  <!-- Arrows between gates -->
  <line x1="773" y1="1137" x2="740" y2="1148.5" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
