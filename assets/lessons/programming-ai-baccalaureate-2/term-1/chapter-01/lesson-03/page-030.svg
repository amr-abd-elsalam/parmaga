  <line x1="353" y1="1153" x2="324" y2="1142.7" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="311,1138 326.7,1135.2 321.3,1150.2" fill="#c0392b"/>
  <line x1="215" y1="1098.5" x2="199.6" y2="1091" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="187,1085 203,1083.8 196.2,1098.2" fill="#c0392b"/>

  <!-- Gate 1: tilted balance scale -->
  <g transform="translate(820 1120)">
    <rect x="-6" y="40" width="12" height="20" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="4" cy="6" r="44" fill="#22303f" opacity=".18"/>
    <circle cx="0" cy="0" r="44" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="33" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <g transform="translate(-22 -24) scale(.8)">
      <rect x="26" y="12" width="4" height="36" fill="#17457f"/>
      <rect x="14" y="46" width="28" height="6" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
      <g transform="rotate(-14 28 16)">
        <line x1="6" y1="16" x2="50" y2="16" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8" y1="16" x2="2" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="8" y1="16" x2="14" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="48" y1="16" x2="42" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="48" y1="16" x2="54" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M2 30 Q 8 40 14 30 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M42 30 Q 48 40 54 30 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <circle cx="28" cy="16" r="4" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Gate 2: cloud with question mark -->
  <g transform="translate(680 1170)">
    <rect x="-6" y="40" width="12" height="20" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="4" cy="6" r="44" fill="#22303f" opacity=".18"/>
    <circle cx="0" cy="0" r="44" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
