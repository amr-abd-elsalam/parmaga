  <path d="M533 1022 Q 540 1027 547 1022" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
  <rect x="512" y="1068" width="56" height="42" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="522" y="1078" width="36" height="4" rx="2" fill="#7f95ab"/>
