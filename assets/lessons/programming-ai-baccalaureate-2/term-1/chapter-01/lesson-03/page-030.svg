<!-- Illustration: a student checks an AI answer through four gates -->
<g>
  <rect x="109" y="972" width="870" height="274" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="966" width="870" height="274" rx="24" fill="url(#ilSkyGolden)"/>
  <path d="M105 1140 C 300 1120, 780 1120, 975 1140 V1216 Q975 1240 951 1240 H129 Q105 1240 105 1216 Z" fill="#a9dcbe"/>

