    <g transform="scale(.9)">
      <ellipse cx="0" cy="6" rx="24" ry="13" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
      <circle cx="-8" cy="-4" r="11" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
      <circle cx="8" cy="-8" r="12" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
