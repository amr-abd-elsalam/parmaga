<rect x="105" y="830" width="866" height="410" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>

<!-- Icon beside paragraph 1: delivery truck -->
<g transform="translate(884 380)">
  <rect x="2" y="6" width="32" height="24" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
