  <ellipse cx="-6" cy="20" rx="40" ry="5" fill="#22303f" opacity=".18"/>
  <rect x="-28" y="-16" width="42" height="28" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
