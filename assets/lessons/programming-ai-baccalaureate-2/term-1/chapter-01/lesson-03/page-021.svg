<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المحطة 3: الطريق (الخدمات اللوجستية)</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Stop 3: The Road (Logistics)</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">شاحنة توصيل</tspan> تحمل علب الصلصة إلى عشرات</tspan>
  <tspan x="950" dy="40">المتاجر. فما أفضل ترتيب للمحطات؟</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#17457f">delivery truck</tspan> carries the sauce cans</tspan>
  <tspan x="120" dy="40">to dozens of stores. What is the best</tspan>
  <tspan x="120" dy="40">order of stops?</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تحسين مسارات التوصيل</text>
<text x="190" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Route Optimization</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">يحسب الذكاء الاصطناعي <tspan font-weight="bold" fill="#17457f">أفضل طريق</tspan> وترتيب</tspan>
  <tspan x="950" dy="40">للمحطات، مع مراعاة <tspan fill="#c96a1b">الزحام</tspan> والمسافة والوقت،</tspan>
  <tspan x="950" dy="40">فيقل الوقود والتأخير.</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">AI calculates the <tspan font-weight="bold" fill="#17457f">best route</tspan> and order</tspan>
  <tspan x="120" dy="40">of stops, considering <tspan fill="#c96a1b">traffic,</tspan> distance,</tspan>
  <tspan x="120" dy="40">and time, so less fuel is used and</tspan>
  <tspan x="120" dy="40">there are fewer delays.</tspan>
</text>
</svg>
