<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="608" width="870" height="648" rx="16" fill="#22303f" opacity=".12"/>

<!-- Key sentence strip -->
<rect x="105" y="122" width="870" height="128" rx="10" fill="#fdf6d8"/>
<rect x="961" y="138" width="6" height="96" rx="3" fill="#e0a55e"/>

<!-- Outlined box -->
<rect x="105" y="602" width="870" height="648" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="618" width="6" height="616" rx="3" fill="#2f7fb5"/>

<!-- Answer boxes -->
<rect x="869" y="994" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>
<rect x="869" y="1074" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>
<rect x="869" y="1154" width="58" height="58" rx="8" fill="#fffdf7" stroke="#225f9c" stroke-width="2"/>

<!-- Star icon in strip -->
<g transform="translate(852 182)">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- People icon beside header -->
<g transform="translate(532 296)">
  <path d="M26 54 Q26 30 40 30 Q54 30 54 54 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="40" cy="16" r="9" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M2 54 Q2 30 18 30 Q34 30 34 54 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="18" cy="16" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Check badge beside paragraph -->
<g transform="translate(862 540)">
  <circle cx="25" cy="25" r="23" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M14 26 L22 34 L37 17" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Pencil icon beside card header -->
<g transform="translate(300 622)">
  <g transform="rotate(-35 27 27)">
    <rect x="2" y="20" width="8" height="14" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
    <rect x="10" y="20" width="30" height="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
    <polygon points="40,20 52,27 40,34" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="48,25 52,27 48,29" fill="#22303f"/>
  </g>
</g>

<!-- Thinking face in answer area -->
<g transform="translate(560 1110)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Key sentence -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كلما زاد وجع الغلطة، اقترب الإنسان أكثر.</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The more a mistake hurts,</tspan>
  <tspan x="140" dy="40">the closer the human must be.</tspan>
</text>

<!-- Header -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الإشراف البشري</tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Human Oversight</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وجود <tspan font-weight="bold" fill="#17457f">إنسان يراجع</tspan> نتيجة الذكاء الاصطناعي،</tspan>
  <tspan x="950" dy="40">ويستطيع تعديلها أو رفضها قبل تنفيذها.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Having a <tspan font-weight="bold" fill="#17457f">person review</tspan> the AI's result,</tspan>
  <tspan x="120" dy="40">able to change or reject it</tspan>
  <tspan x="120" dy="40">before it is carried out.</tspan>
</text>

<!-- Card header -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">جرّب بنفسك</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">TRY IT</tspan>
</text>

<!-- Card paragraph -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">ضع كل حالة على <tspan font-weight="bold" fill="#17457f">المقياس</tspan> من 1 إلى 10:</tspan>
  <tspan x="935" dy="40">تصحيح إملائي تلقائي، وكاميرا مرور</tspan>
  <tspan x="935" dy="40">تكتب مخالفة، ونظام يرشّح دواءً لمريض.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Place each case on the <tspan font-weight="bold" fill="#17457f">scale</tspan></tspan>
  <tspan x="140" dy="40">from 1 to 10: automatic spell-check,</tspan>
  <tspan x="140" dy="40">a traffic camera issuing a fine,</tspan>
  <tspan x="140" dy="40">and a system suggesting</tspan>
  <tspan x="140" dy="40">a medicine for a patient.</tspan>
</text>

<!-- Answer items -->
<text x="853" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="853" dy="0">تصحيح إملائي</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Spell-check</tspan>
</text>
<text x="853" y="1114" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="853" dy="0">كاميرا مرور</tspan>
</text>
<text x="140" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Traffic camera</tspan>
</text>
<text x="853" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="853" dy="0">ترشيح دواء</tspan>
</text>
<text x="140" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Medicine suggestion</tspan>
</text>
</svg>
