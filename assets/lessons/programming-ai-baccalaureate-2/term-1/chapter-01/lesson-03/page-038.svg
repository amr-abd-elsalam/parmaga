<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Warning card: shadow, fill, accent -->
<rect x="109" y="888" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="882" width="870" height="288" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="898" width="6" height="256" rx="3" fill="#c96a1b"/>

<!-- Icon: AI chip beside the section header -->
<g transform="translate(120 110) scale(.9)">
  <line x1="20" y1="0" x2="20" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="0" x2="30" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="0" x2="40" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="52" x2="20" y2="60" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="52" x2="30" y2="60" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="52" x2="40" y2="60" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="20" x2="8" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="30" x2="8" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="40" x2="8" y2="40" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="20" x2="60" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="30" x2="60" y2="30" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="40" x2="60" y2="40" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="8" y="8" width="44" height="44" rx="6" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="18" width="24" height="24" rx="3" fill="#17457f"/>
</g>

<!-- Icon: face scan -->
<g transform="translate(880 226)">
  <path d="M2 16 V6 Q2 2 6 2 H16" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 2 H50 Q54 2 54 6 V16" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M2 40 V50 Q2 54 6 54 H16" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 54 H50 Q54 54 54 50 V40" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 50 Q12 38 28 38 Q44 38 44 50 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="28" cy="23" r="11" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="24" cy="22" r="2" fill="#22303f"/>
  <circle cx="32" cy="22" r="2" fill="#22303f"/>
</g>

<!-- Emotion face: surprise (important fact) -->
<g transform="translate(880 790)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Icon: warning triangle inside the card -->
<g transform="translate(130 892)">
  <polygon points="24,2 46,44 2,44" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="21.5" y="14" width="5" height="16" rx="2.5" fill="#22303f"/>
  <circle cx="24" cy="37" r="3" fill="#22303f"/>
</g>

<!-- Illustration: a system wrongly matches two different faces -->
<g>
  <rect x="109" y="1186" width="870" height="76" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="105" y="1180" width="870" height="76" rx="14" fill="url(#ilScreen)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="262" y="1184" width="618" height="68" rx="10" fill="#8fc9f2" opacity=".35"/>

  <!-- Scanning frame around the left card -->
  <path d="M292 1196 V1188 Q292 1184 296 1184 H304" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 1184 H368 Q372 1184 372 1188 V1196" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M292 1240 V1248 Q292 1252 296 1252 H304" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M360 1252 H368 Q372 1252 372 1248 V1240" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left photo card: man with dark hair and beard -->
  <rect x="300" y="1188" width="64" height="60" rx="6" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M310 1246 Q310 1228 332 1226 Q354 1228 354 1246 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M326 1227 L332 1236 L338 1227 Z" fill="#ffffff"/>
  <circle cx="332" cy="1211" r="12" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <path d="M320 1208 Q320 1196 332 1197 Q344 1196 344 1208 Q338 1202 332 1202 Q326 1202 320 1208 Z" fill="#2b211c"/>
  <path d="M321 1213 Q332 1231 343 1213 Q338 1220 332 1220 Q326 1220 321 1213 Z" fill="#2b211c"/>
  <circle cx="328" cy="1209" r="2" fill="#22303f"/>
  <circle cx="336" cy="1209" r="2" fill="#22303f"/>

  <!-- Dashed match line -->
  <line x1="378" y1="1218" x2="702" y2="1218" stroke="#17457f" stroke-width="2.5" stroke-dasharray="10 8" stroke-linecap="round"/>

  <!-- Large red X over the match line -->
  <g transform="rotate(45 540 1218)">
    <rect x="535" y="1192" width="10" height="52" rx="4" fill="#c0392b" stroke="#22303f" stroke-width="2"/>
  </g>
  <g transform="rotate(-45 540 1218)">
    <rect x="535" y="1192" width="10" height="52" rx="4" fill="#c0392b" stroke="#22303f" stroke-width="2"/>
  </g>

  <!-- Scanning frame around the right card -->
  <path d="M708 1196 V1188 Q708 1184 712 1184 H720" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M776 1184 H784 Q788 1184 788 1188 V1196" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M708 1240 V1248 Q708 1252 712 1252 H720" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M776 1252 H784 Q788 1252 788 1248 V1240" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right photo card: different man with glasses -->
  <rect x="716" y="1188" width="64" height="60" rx="6" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M726 1246 Q726 1228 748 1226 Q770 1228 770 1246 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M742 1227 L748 1236 L754 1227 Z" fill="#ffffff"/>
  <circle cx="748" cy="1211" r="13" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M735 1210 Q735 1200 740 1199 L740 1206 Z" fill="#7f95ab"/>
  <path d="M761 1210 Q761 1200 756 1199 L756 1206 Z" fill="#7f95ab"/>
  <circle cx="743" cy="1210" r="4" fill="none" stroke="#22303f" stroke-width="2"/>
  <circle cx="753" cy="1210" r="4" fill="none" stroke="#22303f" stroke-width="2"/>
  <line x1="747" y1="1210" x2="749" y2="1210" stroke="#22303f" stroke-width="2"/>
  <path d="M744 1218 Q748 1221 752 1218" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>

  <!-- Magnifying glass beside the cards -->
  <g transform="rotate(-45 830 1212)">
    <rect x="826" y="1228" width="8" height="20" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <circle cx="830" cy="1212" r="16" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M821 1207 Q824 1201 830 1200" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Texts -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="950" dy="0">القصة 3: التطابق الخاطئ</tspan>
  <tspan x="950" dy="40">(التعرف على الوجه والقرار النهائي)</tspan>
</text>

<text x="120"
      y="234"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">Story 3: The False Match</tspan>
  <tspan x="120" dy="40">(Face Recognition and</tspan>
  <tspan x="120" dy="40">the Final Decision)</tspan>
</text>

<text x="950"
      y="354"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">في ديترويت بأمريكا، قُبض على روبرت ويليامز</tspan>
  <tspan x="950" dy="40">بسبب <tspan font-weight="bold" fill="#c0392b">تطابق خاطئ</tspan> من نظام تعرف على الوجه،</tspan>
  <tspan x="950" dy="40">وحُبس <tspan fill="#c96a1b">30 ساعة</tspan> في جريمة لم يرتكبها.</tspan>
</text>

<text x="120"
      y="474"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In Detroit, USA, Robert Williams was</tspan>
  <tspan x="120" dy="40">arrested because of a <tspan font-weight="bold" fill="#c0392b">false match</tspan></tspan>
  <tspan x="120" dy="40">from a face recognition system, and was</tspan>
  <tspan x="120" dy="40">held for <tspan fill="#c96a1b">30 hours</tspan> for a crime</tspan>
  <tspan x="120" dy="40">he did not commit.</tspan>
</text>

<text x="950"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">كانت هذه <tspan font-weight="bold" fill="#17457f">أول حالة معلنة</tspan> لقبض خاطئ</tspan>
  <tspan x="950" dy="40">بسبب تطابق وجه خاطئ.</tspan>
</text>

<text x="120"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">It was the <tspan font-weight="bold" fill="#17457f">first publicly reported</tspan></tspan>
  <tspan x="120" dy="40">wrongful arrest caused by</tspan>
  <tspan x="120" dy="40">a false face match.</tspan>
</text>

<text x="935"
      y="914"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">التقنية نفسها التي تفتح هاتفك</tspan>
  <tspan x="935" dy="40">قد تظلم إنسانًا إذا تُرك لها <tspan font-weight="bold" fill="#17457f">قرار مهم</tspan></tspan>
  <tspan x="935" dy="40">دون <tspan font-weight="bold" fill="#2e7d32">مراجعة بشرية.</tspan></tspan>
</text>

<text x="140"
      y="1034"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">The same technology that unlocks</tspan>
  <tspan x="140" dy="40">your phone can wrong a person if it</tspan>
  <tspan x="140" dy="40">is left to make an <tspan font-weight="bold" fill="#17457f">important decision</tspan></tspan>
  <tspan x="140" dy="40">without <tspan font-weight="bold" fill="#2e7d32">human review.</tspan></tspan>
</text>
</svg>
