<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9713f"/>
      <stop offset="0.55" stop-color="#95602f"/>
      <stop offset="1" stop-color="#7d4e22"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fdf7e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodBg)"/>
  <path d="M0 250 C 300 210, 760 300, 1080 245" stroke="#6d4319" stroke-width="16" fill="none" opacity="0.13"/>
  <path d="M0 1060 C 320 1010, 740 1120, 1080 1055" stroke="#6d4319" stroke-width="14" fill="none" opacity="0.11"/>

  <rect x="44" y="42" width="1012" height="1290" rx="8" fill="#5d3714" opacity="0.28"/>
  <rect x="34" y="30" width="1012" height="1290" rx="6" fill="url(#paperFill)"/>

  <g stroke="#bcd4ea" stroke-width="1.4" opacity="0.85">
    <line x1="76" y1="115" x2="1004" y2="115"/>
    <line x1="76" y1="160" x2="1004" y2="160"/>
    <line x1="76" y1="205" x2="1004" y2="205"/>
    <line x1="76" y1="250" x2="1004" y2="250"/>
    <line x1="76" y1="295" x2="1004" y2="295"/>
    <line x1="76" y1="340" x2="1004" y2="340"/>
    <line x1="76" y1="385" x2="1004" y2="385"/>
    <line x1="76" y1="430" x2="1004" y2="430"/>
    <line x1="76" y1="475" x2="1004" y2="475"/>
    <line x1="76" y1="520" x2="1004" y2="520"/>
    <line x1="76" y1="565" x2="1004" y2="565"/>
    <line x1="76" y1="610" x2="1004" y2="610"/>
    <line x1="76" y1="655" x2="1004" y2="655"/>
    <line x1="76" y1="700" x2="1004" y2="700"/>
    <line x1="76" y1="745" x2="1004" y2="745"/>
    <line x1="76" y1="790" x2="1004" y2="790"/>
    <line x1="76" y1="835" x2="1004" y2="835"/>
    <line x1="76" y1="880" x2="1004" y2="880"/>
    <line x1="76" y1="925" x2="1004" y2="925"/>
    <line x1="76" y1="970" x2="1004" y2="970"/>
    <line x1="76" y1="1015" x2="1004" y2="1015"/>
    <line x1="76" y1="1060" x2="1004" y2="1060"/>
    <line x1="76" y1="1105" x2="1004" y2="1105"/>
    <line x1="76" y1="1150" x2="1004" y2="1150"/>
  </g>

  <rect x="67" y="58" width="946" height="1234" fill="none" stroke="#c0392b" stroke-width="2.2"/>

  <text x="540" y="146"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#1b4f8a">البيانات والنتائج تحتاجان إلى المراجعة</text>

  <text x="540" y="192"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">Data and Results Need Review</text>

  <g fill="#fffdf6" stroke="#c0392b" stroke-width="1.6">
    <rect x="105" y="226" width="250" height="82" rx="10"/>
    <rect x="415" y="226" width="250" height="82" rx="10"/>
    <rect x="725" y="226" width="250" height="82" rx="10"/>
  </g>

  <g stroke="#c0392b" stroke-width="3">
    <line x1="363" y1="267" x2="398" y2="267"/>
    <line x1="673" y1="267" x2="708" y2="267"/>
  </g>
  <polygon points="398,258 412,267 398,276" fill="#c0392b"/>
  <polygon points="708,258 722,267 708,276" fill="#c0392b"/>

  <text x="230" y="258"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25"
        fill="#225f9c">بيانات التدريب</text>
  <text x="230" y="292"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">Training Data</text>

  <text x="540" y="258"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25"
        fill="#225f9c">الذكاء الاصطناعي</text>
  <text x="540" y="292"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">AI</text>

  <text x="850" y="258"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25"
        fill="#225f9c">النتيجة</text>
  <text x="850" y="292"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22"
        fill="#152b42">Result</text>

  <polygon points="128,360 148,394 108,394" fill="#f6d3ce" stroke="#c0392b" stroke-width="2"/>
  <text x="128" y="390"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#c0392b">!</text>

  <text x="950" y="390"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">قد تصبح أحكام الذكاء الاصطناعي غير دقيقة</tspan>
    <tspan x="950" dy="38">إذا كانت بيانات التدريب متحيزة.</tspan>
  </text>

  <text x="165" y="476"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="165" dy="0">AI judgments may become inaccurate when the</tspan>
    <tspan x="165" dy="34">training data is biased.</tspan>
  </text>

  <polygon points="128,535 148,569 108,569" fill="#f6d3ce" stroke="#c0392b" stroke-width="2"/>
  <text x="128" y="565"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#c0392b">!</text>

  <text x="950" y="565"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">قد يولّد محتوى مختلفًا عن الحقائق،</tspan>
    <tspan x="950" dy="38">ويُعرف ذلك بالهلوسة.</tspan>
  </text>

  <text x="165" y="651"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="165" dy="0">It may generate content that differs from the</tspan>
    <tspan x="165" dy="34">facts; this is called hallucination.</tspan>
  </text>

  <polygon points="128,710 148,744 108,744" fill="#f6d3ce" stroke="#c0392b" stroke-width="2"/>
  <text x="128" y="740"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#c0392b">!</text>

  <text x="950" y="740"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">قد تظهر مشكلات متعلقة بحقوق المؤلف</tspan>
    <tspan x="950" dy="38">عند استخدام أعمال محمية في التدريب.</tspan>
  </text>

  <text x="165" y="826"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="165" dy="0">Copyright issues may arise when protected works</tspan>
    <tspan x="165" dy="34">are used as training data.</tspan>
  </text>

  <polygon points="128,885 148,919 108,919" fill="#f6d3ce" stroke="#c0392b" stroke-width="2"/>
  <text x="128" y="915"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#c0392b">!</text>

  <text x="950" y="915"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">قد يصعب توضيح كيفية وصوله إلى الحكم،</tspan>
    <tspan x="950" dy="38">وتُعرف هذه بمشكلة الصندوق الأسود.</tspan>
  </text>

  <text x="165" y="1001"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="165" dy="0">It may be unclear how AI reached its judgment;</tspan>
    <tspan x="165" dy="34">this is called the black-box problem.</tspan>
  </text>

</svg>
