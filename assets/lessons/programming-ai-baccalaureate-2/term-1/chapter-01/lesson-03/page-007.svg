<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
  <linearGradient id="ilBox" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
</defs>

<!-- Illustration: classify vs generate -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="109" y="718" width="866" height="420" rx="24" fill="#22303f" opacity=".18"/>
  <rect x="105" y="712" width="866" height="420" rx="24" fill="url(#ilBack)" stroke="#8fc9f2" stroke-width="2.5"/>

  <!-- dashed separator -->
  <line x1="540" y1="740" x2="540" y2="1110" stroke="#7f95ab" stroke-width="2.5" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- RIGHT HALF: classifies -->
  <!-- cat photo card -->
  <rect x="866" y="931" width="86" height="110" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="862" y="925" width="86" height="110" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="870" y="933" width="70" height="74" rx="6" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <g stroke="#22303f" stroke-width="2.5">
    <polygon points="888,966 890,944 902,958" fill="#c96a1b"/>
    <polygon points="922,966 920,944 908,958" fill="#c96a1b"/>
    <circle cx="905" cy="972" r="18" fill="#c96a1b"/>
  </g>
  <circle cx="899" cy="968" r="2.5" fill="#22303f"/>
  <circle cx="911" cy="968" r="2.5" fill="#22303f"/>
  <rect x="872" y="1015" width="50" height="8" rx="4" fill="#8fc9f2"/>

  <!-- arrow into classifier box -->
  <line x1="852" y1="980" x2="826" y2="980" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="810,980 826,971 826,989" fill="#c0392b"/>

  <!-- classifier box -->
  <rect x="726" y="936" width="82" height="100" rx="16" fill="#22303f" opacity=".18"/>
  <rect x="722" y="930" width="82" height="100" rx="16" fill="url(#ilBox)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="734" y="944" width="58" height="72" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M744 962 H782 M744 980 H772 M744 998 H762" fill="none" stroke="#4fc3e8" stroke-width="3" stroke-linecap="round"/>

  <!-- arrow out to check card -->
  <line x1="714" y1="980" x2="690" y2="980" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="674,980 690,971 690,989" fill="#c0392b"/>

  <!-- green check card -->
  <rect x="582" y="941" width="86" height="90" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="578" y="935" width="86" height="90" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="621" cy="980" r="28" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M607 980 L617 990 L636 970" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LEFT HALF: generates -->
  <!-- easel legs -->
  <path d="M185 1060 L170 1112 M315 1060 L330 1112 M250 1060 V1106" fill="none" stroke="#7d4f28" stroke-width="3" stroke-linecap="round"/>
  <!-- canvas -->
  <rect x="154" y="856" width="200" height="210" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="150" y="850" width="200" height="210" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>

  <!-- new cartoon cat -->
  <g stroke="#22303f" stroke-width="2.5">
    <ellipse cx="250" cy="1020" rx="40" ry="28" fill="#f0c48c"/>
    <polygon points="214,930 214,880 244,908" fill="#f0c48c"/>
    <polygon points="286,930 286,880 256,908" fill="#f0c48c"/>
    <circle cx="250" cy="950" r="45" fill="#f0c48c"/>
    <polygon points="244,958 256,958 250,965" fill="#c96a1b"/>
    <path d="M238 972 Q244 980 250 970 Q256 980 262 972" fill="none"/>
    <path d="M205 960 H228 M205 970 L228 966 M272 960 H295 M272 966 L295 970" fill="none"/>
  </g>
  <circle cx="234" cy="944" r="5" fill="#22303f"/>
  <circle cx="266" cy="944" r="5" fill="#22303f"/>

  <!-- generator box -->
  <rect x="404" y="931" width="100" height="100" rx="16" fill="#22303f" opacity=".18"/>
  <rect x="400" y="925" width="100" height="100" rx="16" fill="url(#ilBox)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="414" y="939" width="72" height="72" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M466 941 Q466 955 480 955 Q466 955 466 969 Q466 955 452 955 Q466 955 466 941 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>

  <!-- pencil held by the box, drawing on the canvas -->
  <path d="M296 990 Q 306 984 318 976" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#22303f" stroke-width="2.5">
    <rect x="344" y="960" width="70" height="18" fill="#ffd24a"/>
    <polygon points="322,969 344,960 344,978" fill="#f0c48c"/>
    <polygon points="322,969 330,966 330,972" fill="#22303f"/>
    <rect x="414" y="960" width="14" height="18" rx="3" fill="#c96a1b"/>
  </g>

  <!-- sparkles around the canvas -->
  <g fill="#ffd24a" stroke="#22303f" stroke-width="2">
    <path d="M130 860 Q130 872 142 872 Q130 872 130 884 Q130 872 118 872 Q130 872 130 860 Z"/>
    <path d="M372 850 Q372 862 384 862 Q372 862 372 874 Q372 862 360 862 Q372 862 372 850 Z"/>
    <path d="M128 1036 Q128 1048 140 1048 Q128 1048 128 1060 Q128 1048 116 1048 Q128 1048 128 1036 Z"/>
    <path d="M372 1038 Q372 1050 384 1050 Q372 1050 372 1062 Q372 1050 360 1050 Q372 1050 372 1038 Z"/>
  </g>
</g>

<!-- Icon: star beside header -->
<g transform="translate(122 100) scale(.8)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a"/>
</g>

<!-- Icon: light bulb beside the definition -->
<g transform="translate(880 330)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 22 H9 M47 22 H52 M10 6 L14 10 M46 6 L42 10" fill="none" stroke="#c96a1b"/>
  <circle cx="28" cy="22" r="17" fill="#ffd24a"/>
  <path d="M22 24 L28 30 L34 24" fill="none"/>
  <rect x="20" y="38" width="16" height="13" rx="3" fill="#7f95ab"/>
</g>

<!-- Face: smile beside the difference -->
<g transform="translate(900 620)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Bottom icon row: pencil, chip, check badge -->
<g transform="translate(372 1170)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="14,34 42,6 50,14 22,42" fill="#ffd24a"/>
  <polygon points="10,46 14,34 22,42" fill="#f0c48c"/>
  <polygon points="42,6 46,2 54,10 50,14" fill="#c96a1b"/>
</g>
<g transform="translate(518 1176)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M15 8 V2 M22 8 V2 M29 8 V2 M15 36 V42 M22 36 V42 M29 36 V42 M8 15 H2 M8 22 H2 M8 29 H2 M36 15 H42 M36 22 H42 M36 29 H42" fill="none"/>
  <rect x="8" y="8" width="28" height="28" rx="4" fill="#2f7fb5"/>
  <rect x="15" y="15" width="14" height="14" rx="2" fill="#8fc9f2"/>
</g>
<g transform="translate(652 1170)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="28" cy="28" r="24" fill="#2e7d32"/>
  <path d="M17 28 L25 36 L40 20" fill="none" stroke="#ffffff"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">الذكاء الاصطناعي التوليدي</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Generative AI</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نوع من الذكاء الاصطناعي يصنع <tspan font-weight="bold" fill="#c0392b">محتوى جديدًا،</tspan></tspan>
  <tspan x="950" dy="40">مثل نص أو صورة أو صوت، بدل أن <tspan font-weight="bold" fill="#17457f">يصنّف</tspan> فقط.</tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A type of AI that creates <tspan font-weight="bold" fill="#c0392b">new content,</tspan></tspan>
  <tspan x="120" dy="40">such as text, images, or audio,</tspan>
  <tspan x="120" dy="40">instead of only <tspan font-weight="bold" fill="#17457f">classifying.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الفرق ببساطة: <tspan font-weight="bold" fill="#17457f">نموذج التصنيف</tspan> يقول</tspan>
  <tspan x="950" dy="40">«هذه صورة قطة»، <tspan font-weight="bold" fill="#c0392b">والنموذج التوليدي</tspan></tspan>
  <tspan x="950" dy="40">يرسم لك قطة جديدة.</tspan>
</text>

<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Simply put: a <tspan font-weight="bold" fill="#17457f">classifier</tspan> says</tspan>
  <tspan x="120" dy="40">&quot;this is a photo of a cat,&quot; while</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#c0392b">generative model</tspan> draws you a new cat.</tspan>
</text>

<!-- Illustration labels (listed in the page prompt) -->
<text x="798" y="772" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="798" dy="0">يصنّف</tspan>
</text>
<text x="688" y="812" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="688" dy="0">Classifies</tspan>
</text>
<text x="346" y="772" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="346" dy="0">يولّد</tspan>
</text>
<text x="248" y="812" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="248" dy="0">Generates</tspan>
</text>
</svg>
