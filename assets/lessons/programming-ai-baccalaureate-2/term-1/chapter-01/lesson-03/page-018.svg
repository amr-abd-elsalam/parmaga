<g transform="translate(860 1050)"><rect x="-23" y="-66" width="46" height="66" rx="6" fill="#c0392b"/><rect x="-23" y="-46" width="46" height="22" fill="#ffffff"/><rect x="-23" y="-66" width="46" height="66" rx="6" fill="none" stroke="#22303f" stroke-width="2.5"/><ellipse cx="0" cy="-66" rx="23" ry="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/></g>
<g transform="translate(680 960)"><circle cx="0" cy="0" r="13" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/><path d="M -6 0 L -2 5 L 7 -6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(770 960)"><circle cx="0" cy="0" r="13" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/><path d="M -6 0 L -2 5 L 7 -6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(860 960)"><circle cx="0" cy="0" r="13" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/><path d="M -6 0 L -2 5 L 7 -6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

<!-- Side bin -->
<rect x="505" y="1095" width="120" height="60" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<rect x="499" y="1091" width="132" height="10" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>

<!-- Dented can pushed off the belt, outlined in red -->
<g transform="translate(575 1090) rotate(25)">
  <path d="M -23 -60 Q -23 -66 -17 -66 L 17 -66 Q 23 -66 23 -60 L 23 -50 L 11 -40 L 23 -30 L 23 -6 Q 23 0 17 0 L -17 0 Q -23 0 -23 -6 Z" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="0" cy="-66" rx="23" ry="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-31" y="-76" width="62" height="86" rx="10" fill="none" stroke="#c0392b" stroke-width="2.5"/>
</g>

<!-- Pusher arm -->
<circle cx="530" cy="992" r="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<polygon points="524,996 536,988 556,1018 544,1026" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="544,1022 558,1012 568,1036 554,1046" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Scanning beam and camera -->
<polygon points="442,884 458,884 484,976 416,976" fill="#4fc3e8" opacity=".35"/>
<rect x="425" y="826" width="50" height="40" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
<circle cx="450" cy="872" r="10" fill="#22303f"/>
<circle cx="450" cy="872" r="4" fill="#4fc3e8"/>

<!-- Belt direction arrow -->
<line x1="700" y1="1100" x2="828" y2="1100" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="828,1092 844,1100 828,1108" fill="#c0392b"/>

<rect x="105" y="744" width="866" height="420" rx="24" fill="none" stroke="#22303f" stroke-width="2.5"/>

<!-- Header icons -->
<g transform="translate(120 102)">
  <path d="M4 48 L4 24 L16 16 L16 24 L28 16 L28 24 L40 16 L40 8 L48 8 L48 48 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
