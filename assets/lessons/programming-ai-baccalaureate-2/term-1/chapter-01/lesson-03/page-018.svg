  <rect x="67" y="74" width="946" height="1202" rx="3" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <text x="540" y="132"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="38" font-weight="bold" fill="#1b3f6b">تمارين المراجعة</text>

  <text x="540" y="178"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#2f5d8a">Review Exercises</text>

  <text x="950" y="242"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#17578f">أولًا: اختر كل ما يبرع فيه الذكاء الاصطناعي</text>

  <text x="120" y="270"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#2d4a63">Select all the tasks that AI excels at.</text>

  <text x="112" y="326" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">A</text>
  <text x="950" y="326"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">الأحكام الأخلاقية</text>
  <text x="160" y="354"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Ethical judgments</text>

  <text x="112" y="382" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">B</text>
  <text x="950" y="382"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">إيجاد السمات في الصور والنصوص وتصنيفها</text>
  <text x="160" y="410"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Finding features in images and text and classifying them</text>

  <text x="112" y="438" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">C</text>
  <text x="950" y="438"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">القرارات المرتبطة بالمعلومات الشخصية</text>
  <text x="160" y="466"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Judgments involving personal information</text>

  <text x="112" y="494" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">D</text>
  <text x="950" y="494"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">الاستدلال الاحتمالي والتنبؤ اعتمادًا على البيانات</text>
  <text x="160" y="522"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Probabilistic reasoning and prediction based on data</text>

  <text x="112" y="550" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">E</text>
  <text x="950" y="550"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">اتخاذ القرارات التي تتطلب تحمّل المسؤولية</text>
  <text x="160" y="578"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Decision-making that bears responsibility for results</text>

  <text x="112" y="606" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">F</text>
  <text x="950" y="606"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">التعرّف على الصور والصوت والنصوص وتوليدها</text>
  <text x="160" y="634"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Recognition and generation of images, audio, and text</text>

  <text x="950" y="690"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#17578f">ثانيًا: اختر الوصف غير الصحيح</text>

  <text x="120" y="718"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#2d4a63">Choose the description that is not correct.</text>

  <text x="112" y="746" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">A</text>
  <text x="950" y="746"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="950" dy="0">يتنبأ نظام التوصية بالتفضيلات من بيانات</tspan>
    <tspan x="950" dy="28">السلوك السابق ويعرض التوصيات.</tspan>
  </text>
  <text x="160" y="802"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="160" dy="0">A recommendation system predicts preferences from past</tspan>
    <tspan x="160" dy="28">behavior data and displays recommendations.</tspan>
  </text>

  <text x="112" y="858" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">B</text>
  <text x="950" y="858"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">يتعرّف المساعد الصوتي على الصوت، ويفهم الأوامر، وينفذها.</text>
  <text x="160" y="886"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="160" dy="0">A voice assistant recognizes a voice, understands</tspan>
    <tspan x="160" dy="28">commands, and executes them.</tspan>
  </text>

  <text x="112" y="942" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">C</text>
  <text x="950" y="942"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="950" dy="0">الترجمة الآلية نظام يترجم فيه البشر النصوص</tspan>
    <tspan x="950" dy="28">يدويًا من لغة إلى أخرى.</tspan>
  </text>
  <text x="160" y="998"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="160" dy="0">Machine translation is a system in which humans manually</tspan>
    <tspan x="160" dy="28">translate text from one language to another.</tspan>
  </text>

  <text x="112" y="1054" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#1e7d4f">D</text>
  <text x="950" y="1054"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="950" dy="0">يكتشف التعرّف على الوجه الوجوه البشرية</tspan>
    <tspan x="950" dy="28">في الصور ويتعرّف عليها تلقائيًا.</tspan>
  </text>
  <text x="160" y="1110"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="160" dy="0">Face recognition automatically detects and identifies</tspan>
    <tspan x="160" dy="28">human faces in photographs.</tspan>
  </text>

</svg>
