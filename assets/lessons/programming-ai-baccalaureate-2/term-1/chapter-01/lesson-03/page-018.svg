  <path d="M16 28 L25 37 L41 19" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(680 1218)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">المحطة 2: المصنع (التصنيع)</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Stop 2: The Factory (Manufacturing)</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تتحول الطماطم إلى صلصة في علب</tspan>
  <tspan x="950" dy="40">تمر بسرعة على <tspan font-weight="bold" fill="#17457f">خط الإنتاج</tspan>.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The tomatoes become sauce in cans</tspan>
  <tspan x="120" dy="40">that move fast along the <tspan font-weight="bold" fill="#17457f">production line</tspan>.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أتمتة فحص الجودة</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Automated Quality Inspection</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الأتمتة</tspan> تعني أن تؤدي الآلة العمل وحدها.</tspan>
  <tspan x="950" dy="40">هنا تفحص كاميرا مع <tspan font-weight="bold" fill="#17457f">الذكاء الاصطناعي</tspan> كل علبة</tspan>
  <tspan x="950" dy="40">وتُخرج المعيبة.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Automation</tspan> means a machine does the work</tspan>
  <tspan x="120" dy="40">by itself. Here, a camera with <tspan font-weight="bold" fill="#17457f">AI</tspan> checks</tspan>
  <tspan x="120" dy="40">every can and removes the faulty ones.</tspan>
</text>
</svg>
