<g transform="translate(360 1050)"><rect x="-23" y="-66" width="46" height="66" rx="6" fill="#c0392b"/><rect x="-23" y="-46" width="46" height="22" fill="#ffffff"/><rect x="-23" y="-66" width="46" height="66" rx="6" fill="none" stroke="#22303f" stroke-width="2.5"/><ellipse cx="0" cy="-66" rx="23" ry="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/></g>

