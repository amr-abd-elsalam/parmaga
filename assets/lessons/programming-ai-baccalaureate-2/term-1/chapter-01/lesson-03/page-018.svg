  <rect x="2" y="14" width="48" height="32" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="26" cy="30" r="10" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="26" cy="30" r="4" fill="#17457f"/>
</g>

<!-- Bottom icon row -->
<g transform="translate(372 1190)">
  <path d="M18 2 L18 10 M28 2 L28 10 M38 2 L38 10 M18 46 L18 54 M28 46 L28 54 M38 46 L38 54 M2 18 L10 18 M2 28 L10 28 M2 38 L10 38 M46 18 L54 18 M46 28 L54 28 M46 38 L54 38" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="10" y="10" width="36" height="36" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="20" width="16" height="16" rx="3" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
</g>
