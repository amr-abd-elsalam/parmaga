<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5c33"/>
      <stop offset="0.55" stop-color="#7a4c28"/>
      <stop offset="1" stop-color="#67401f"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fbf5e7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0,250 C 280,205 720,300 1080,240" fill="none" stroke="#553317" stroke-width="14" opacity="0.12"/>
  <path d="M0,1090 C 300,1150 760,1040 1080,1110" fill="none" stroke="#553317" stroke-width="12" opacity="0.10"/>

  <rect x="42" y="40" width="1012" height="1290" rx="5" fill="#3a2311" opacity="0.25"/>
