<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">إذن ما الحل؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">So what is the solution?</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تعدد الأنوية والمعالجة المتوازية</tspan> — النواة</tspan>
  <tspan x="935" dy="40">وحدة معالجة داخل المعالج. بدلًا من نواة</tspan>
  <tspan x="935" dy="40">واحدة أسرع، نضع <tspan font-weight="bold" fill="#17457f">عدة أنوية</tspan> تعمل معًا على</tspan>
  <tspan x="935" dy="40">أجزاء من المهمة.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">multi-core and parallel processing</tspan> —</tspan>
  <tspan x="140" dy="40">a core is a processing unit inside</tspan>
  <tspan x="140" dy="40">the processor. Instead of one faster</tspan>
  <tspan x="140" dy="40">core, <tspan font-weight="bold" fill="#17457f">several cores</tspan> work together on</tspan>
  <tspan x="140" dy="40">parts of the task.</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التصميمات المتخصصة</tspan> — شرائح مصممة لنوع</tspan>
  <tspan x="935" dy="40">واحد من المهام، فتؤديه <tspan font-weight="bold" fill="#17457f">بكفاءة أعلى</tspan> من</tspan>
  <tspan x="935" dy="40">المعالج العام.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">specialized designs</tspan> — chips designed</tspan>
  <tspan x="140" dy="40">for one type of task, so they do it</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">more efficiently</tspan> than a general</tspan>
  <tspan x="140" dy="40">processor.</tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">تشبيه:</tspan> <tspan fill="#c96a1b">4 طباخين</tspan> في المطبخ بدل طباخ</tspan>
  <tspan x="935" dy="40">واحد سريع!</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Analogy:</tspan> <tspan fill="#c96a1b">4 cooks</tspan> in the kitchen</tspan>
  <tspan x="140" dy="40">instead of one fast cook!</tspan>
</text>
</svg>
