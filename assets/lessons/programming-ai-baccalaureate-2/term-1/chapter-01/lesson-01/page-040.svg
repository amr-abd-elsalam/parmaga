<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
  <linearGradient id="ilCoin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="368" width="870" height="488" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="888" width="870" height="208" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info card -->
<rect x="105" y="362" width="870" height="488" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="378" width="6" height="456" rx="3" fill="#2f7fb5"/>

<!-- Warning card -->
<rect x="105" y="882" width="870" height="208" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="898" width="6" height="176" rx="3" fill="#c96a1b"/>

<!-- Wink face beside the opening paragraph -->
<g transform="translate(160 160)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Coin icon beside the opening paragraph -->
<g transform="translate(860 232)">
  <circle cx="28" cy="28" r="24" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="28" r="15" fill="none" stroke="#c96a1b" stroke-width="2.5"/>
  <path d="M 0 14 Q -6 28 0 42" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56 14 Q 62 28 56 42" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Info card header icons: open book and chip -->
<g transform="translate(392 366)">
  <path d="M 2 10 Q 14 4 26 10 L 26 46 Q 14 40 2 46 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 26 10 Q 38 4 50 10 L 50 46 Q 38 40 26 46 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="20" x2="20" y2="18" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="30" x2="20" y2="28" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="44" y2="20" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="44" y2="30" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g transform="translate(560 366)">
  <line x1="18" y1="2" x2="18" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="2" x2="26" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="2" x2="34" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="42" x2="18" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="42" x2="26" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="42" x2="34" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="18" x2="10" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="34" x2="10" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="50" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="34" x2="50" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="10" y="10" width="32" height="32" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="18" y="18" width="16" height="16" rx="3" fill="#4fc3e8"/>
</g>

<!-- Warning card icon: triangle with exclamation drawn as shapes -->
<g transform="translate(128 892)">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Memory illustration: laptop and phone, quantum computer, spinning coin -->
<g>
  <!-- laptop -->
  <rect x="174" y="1166" width="110" height="70" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="170" y="1160" width="110" height="70" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="178" y="1168" width="94" height="54" rx="3" fill="#4fc3e8"/>
  <path d="M 156 1232 L 294 1232 L 284 1246 L 166 1246 Z" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- phone -->
  <rect x="324" y="1152" width="56" height="96" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="320" y="1146" width="56" height="96" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="327" y="1156" width="42" height="72" rx="4" fill="#4fc3e8"/>
  <circle cx="348" cy="1235" r="3" fill="#ffffff"/>

  <!-- quantum computer (tiered chandelier) -->
  <ellipse cx="540" cy="1180" rx="92" ry="60" fill="#dff1f7" opacity=".6"/>
  <rect x="490" y="1116" width="100" height="10" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="515" y1="1126" x2="515" y2="1138" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540" y1="1126" x2="540" y2="1138" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="565" y1="1126" x2="565" y2="1138" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="540" cy="1144" rx="56" ry="9" fill="url(#ilGold)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="510" y1="1153" x2="510" y2="1174" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="530" y1="1153" x2="530" y2="1174" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="550" y1="1153" x2="550" y2="1174" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="570" y1="1153" x2="570" y2="1174" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="540" cy="1180" rx="44" ry="8" fill="url(#ilGold)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="524" y1="1188" x2="524" y2="1206" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540" y1="1188" x2="540" y2="1206" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="556" y1="1188" x2="556" y2="1206" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="540" cy="1212" rx="32" ry="7" fill="url(#ilGold)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="534" y1="1219" x2="534" y2="1231" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="546" y1="1219" x2="546" y2="1231" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="524" y="1232" width="32" height="14" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="532" y="1235" width="16" height="8" rx="2" fill="#4fc3e8"/>

  <!-- spinning coin -->
  <path d="M 712 1146 Q 696 1186 712 1226" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M 808 1146 Q 824 1186 808 1226" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M 730 1156 Q 720 1186 730 1216" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 790 1156 Q 800 1186 790 1216" fill="none" stroke="#17457f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="748" cy="1186" rx="20" ry="44" fill="#ffd24a" opacity=".35"/>
  <ellipse cx="772" cy="1186" rx="20" ry="44" fill="#ffd24a" opacity=".35"/>
  <ellipse cx="760" cy="1186" rx="22" ry="44" fill="url(#ilCoin)" stroke="#22303f" stroke-width="2.5" opacity=".85"/>
  <ellipse cx="760" cy="1246" rx="30" ry="4" fill="#22303f" opacity=".18"/>
  <path transform="translate(860 1150)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path transform="translate(670 1232)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path transform="translate(900 1222)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Opening paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تشبيه العملة <tspan font-weight="bold" fill="#17457f">للتقريب</tspan> فقط،</tspan>
  <tspan x="950" dy="40">والفيزياء الحقيقية أعمق منه.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The coin analogy is only</tspan>
  <tspan x="120" dy="40">an <tspan font-weight="bold" fill="#17457f">approximation;</tspan> the real physics</tspan>
  <tspan x="120" dy="40">goes deeper.</tspan>
</text>

<!-- Info card header -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Info card term -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحوسبة الكمومية</tspan> — نهج حوسبي يستخدم</tspan>
  <tspan x="935" dy="40">خصائص ميكانيكا الكم، مثل التراكب،</tspan>
  <tspan x="935" dy="40">لمعالجة المعلومات، وقد يتفوق تفوقًا</tspan>
  <tspan x="935" dy="40">كبيرًا في <tspan font-weight="bold" fill="#17457f">أنواع محددة</tspan> من المسائل.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">quantum computing</tspan> — a computing</tspan>
  <tspan x="140" dy="40">approach that uses properties of</tspan>
  <tspan x="140" dy="40">quantum mechanics, such as</tspan>
  <tspan x="140" dy="40">superposition, to process information;</tspan>
  <tspan x="140" dy="40">it may greatly outperform in</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">specific kinds</tspan> of problems.</tspan>
</text>

<!-- Warning card -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه:</tspan> الحاسوب الكمومي <tspan font-weight="bold" fill="#17457f">ليس أسرع</tspan> في</tspan>
  <tspan x="935" dy="40">كل شيء، ولن يستبدل هاتفك أو حاسوبك.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Careful:</tspan> A quantum computer is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">not faster</tspan> at everything, and it will</tspan>
  <tspan x="140" dy="40">not replace your phone or computer.</tspan>
</text>
</svg>
