  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: chip -->
<g transform="translate(770 716)">
  <line x1="20" y1="4" x2="20" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="4" x2="28" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="4" x2="36" y2="12" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="20" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="28" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="36" y1="44" x2="36" y2="52" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="20" x2="12" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="28" x2="12" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="4" y1="36" x2="12" y2="36" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="52" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="52" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="36" x2="52" y2="36" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="12" y="12" width="32" height="32" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="21" y="21" width="14" height="14" rx="2" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: open book -->
<g transform="translate(866 712)">
  <path d="M32 16 Q20 8 4 12 L4 52 Q20 48 32 56 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 16 Q44 8 60 12 L60 52 Q44 48 32 56 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="10" y1="22" x2="26" y2="24" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="26" y2="34" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="54" y2="22" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="54" y2="32" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Memory illustration: gears, vacuum tube, phone -->
<rect x="125" y="1112" width="830" height="136" rx="20" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>

<g>
  <g transform="rotate(0 230 1180)"><rect x="223" y="1144" width="14" height="72" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(45 230 1180)"><rect x="223" y="1144" width="14" height="72" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(90 230 1180)"><rect x="223" y="1144" width="14" height="72" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(135 230 1180)"><rect x="223" y="1144" width="14" height="72" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
  <circle cx="230" cy="1180" r="28" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="230" cy="1180" r="9" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
</g>
<g>
  <g transform="rotate(22 300 1206)"><rect x="295" y="1182" width="10" height="48" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(67 300 1206)"><rect x="295" y="1182" width="10" height="48" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(112 300 1206)"><rect x="295" y="1182" width="10" height="48" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/></g>
  <g transform="rotate(157 300 1206)"><rect x="295" y="1182" width="10" height="48" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/></g>
  <circle cx="300" cy="1206" r="18" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="300" cy="1206" r="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
</g>

<g>
  <ellipse cx="540" cy="1174" rx="62" ry="52" fill="#ffd24a" opacity=".35"/>
  <path d="M515 1218 L515 1160 Q515 1128 540 1128 Q565 1128 565 1160 L565 1218 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M528 1204 L528 1164 L540 1176 L552 1164 L552 1204" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="540" cy="1176" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="510" y="1216" width="60" height="22" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="525" y1="1238" x2="525" y2="1246" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540" y1="1238" x2="540" y2="1246" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="555" y1="1238" x2="555" y2="1246" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="470" cy="1140" r="4" fill="#ffd24a"/>
  <circle cx="612" cy="1146" r="4" fill="#ffd24a"/>
  <circle cx="600" cy="1214" r="3" fill="#f0c48c"/>
</g>

<g>
  <path d="M640 1158 Q660 1180 640 1202" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M664 1146 Q692 1180 664 1214" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M688 1134 Q724 1180 688 1226" fill="none" stroke="#4fc3e8" stroke-width="2.5" stroke-linecap="round"/>
</g>

<g>
  <rect x="774" y="1142" width="56" height="100" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="770" y="1136" width="56" height="100" rx="10" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="777" y="1146" width="42" height="74" rx="4" fill="#4fc3e8"/>
  <rect x="784" y="1156" width="28" height="6" rx="3" fill="#ffffff"/>
  <rect x="784" y="1170" width="20" height="6" rx="3" fill="#dff1f7"/>
  <circle cx="798" cy="1228" r="3" fill="#ffffff"/>
  <polygon points="884,1138 858,1186 876,1186 864,1232 904,1172 884,1172 898,1138" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Text: Card 1 -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">احسبها بنفسك</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">WORK IT OUT</tspan>
</text>

<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan fill="#c96a1b">30 طنًا</tspan> تساوي وزن كم سيارة صغيرة تقريبًا؟</tspan>
  <tspan x="935" dy="40">وكم يزن هاتفك؟</tspan>
</text>

<text x="140"
      y="314"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan fill="#c96a1b">30 tons</tspan> equals the weight of about</tspan>
  <tspan x="140" dy="40">how many small cars?</tspan>
  <tspan x="140" dy="40">And how much does your phone weigh?</tspan>
</text>

<!-- Text: Card 2 -->
<text x="935"
      y="474"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 1</tspan>
</text>

<text x="140"
      y="514"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 1 TERMS</tspan>
</text>

<text x="935"
      y="554"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحاسوب الإلكتروني</tspan> — آلة تعالج البيانات</tspan>
  <tspan x="935" dy="40">بإشارات كهربائية، لا بتروس ميكانيكية،</tspan>
  <tspan x="935" dy="40">لذلك هي <tspan font-weight="bold" fill="#17457f">أسرع بكثير.</tspan></tspan>
</text>

<text x="140"
      y="674"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">electronic computer</tspan> — a machine that</tspan>
  <tspan x="140" dy="40">processes data with electrical signals,</tspan>
  <tspan x="140" dy="40">not mechanical gears,</tspan>
  <tspan x="140" dy="40">so it is <tspan font-weight="bold" fill="#17457f">much faster.</tspan></tspan>
</text>

<text x="935"
      y="834"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الصمام المفرغ</tspan> — أنبوب زجاجي مفرغ</tspan>
  <tspan x="935" dy="40">من الهواء يعمل <tspan font-weight="bold" fill="#17457f">كمفتاح للتيار،</tspan></tspan>
  <tspan x="935" dy="40">لكنه كبير وساخن ويحترق كثيرًا.</tspan>
</text>

<text x="140"
      y="954"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">vacuum tube</tspan> — an air-free glass tube</tspan>
  <tspan x="140" dy="40">that works as a <tspan font-weight="bold" fill="#17457f">switch for current,</tspan></tspan>
  <tspan x="140" dy="40">but it is large, hot,</tspan>
  <tspan x="140" dy="40">and often burns out.</tspan>
</text>
</svg>
