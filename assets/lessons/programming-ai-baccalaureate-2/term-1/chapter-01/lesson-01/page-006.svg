<!-- Shadows -->
<rect x="109" y="128" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="448" width="870" height="648" rx="16" fill="#22303f" opacity=".12"/>
<rect x="129" y="1118" width="830" height="136" rx="20" fill="#22303f" opacity=".18"/>

<!-- Card 1: Outlined box -->
