<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b07c42"/>
      <stop offset="0.55" stop-color="#9a6733"/>
      <stop offset="1" stop-color="#82552a"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
  </defs>

  <!-- 1) خلفية خشبية بسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0,240 C300,205 780,300 1080,255" fill="none" stroke="#6f4620" stroke-width="10" opacity="0.14"/>
  <path d="M0,1080 C320,1130 760,1030 1080,1085" fill="none" stroke="#6f4620" stroke-width="12" opacity="0.12"/>

  <!-- 2) ورق الدفتر مع ظل بسيط -->
  <rect x="42" y="40" width="1012" height="1300" rx="8" fill="#4a2f14" opacity="0.22"/>
  <rect x="34" y="30" width="1012" height="1300" rx="8" fill="url(#paperGrad)"/>

  <!-- 3) سطور الدفتر الزرقاء الباهتة -->
  <g stroke="#cfe1f0" stroke-width="1.6">
    <line x1="92" y1="252" x2="988" y2="252"/>
    <line x1="92" y1="298" x2="988" y2="298"/>
    <line x1="92" y1="344" x2="988" y2="344"/>
    <line x1="92" y1="390" x2="988" y2="390"/>
    <line x1="92" y1="436" x2="988" y2="436"/>
    <line x1="92" y1="482" x2="988" y2="482"/>
    <line x1="92" y1="528" x2="988" y2="528"/>
    <line x1="92" y1="574" x2="988" y2="574"/>
    <line x1="92" y1="620" x2="988" y2="620"/>
    <line x1="92" y1="666" x2="988" y2="666"/>
    <line x1="92" y1="712" x2="988" y2="712"/>
    <line x1="92" y1="758" x2="988" y2="758"/>
    <line x1="92" y1="804" x2="988" y2="804"/>
    <line x1="92" y1="850" x2="988" y2="850"/>
    <line x1="92" y1="896" x2="988" y2="896"/>
    <line x1="92" y1="942" x2="988" y2="942"/>
    <line x1="92" y1="988" x2="988" y2="988"/>
    <line x1="92" y1="1034" x2="988" y2="1034"/>
    <line x1="92" y1="1080" x2="988" y2="1080"/>
    <line x1="92" y1="1126" x2="988" y2="1126"/>
  </g>

  <!-- 4) إطار أحمر خارجي واحد فقط (لا يوجد خط هامش رأسي داخلي) -->
  <rect x="67" y="62" width="946" height="1258" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <!-- 5) فاصل العنوان وفاصل الأقسام -->
  <line x1="290" y1="232" x2="790" y2="232" stroke="#a8c2dd" stroke-width="2.4"/>
  <line x1="150" y1="654" x2="930" y2="654" stroke="#bcccdd" stroke-width="2" stroke-dasharray="10 9"/>

  <!-- 6) الرسم التوضيحي الأول: أشخاص متصلون وفقاعات رسائل -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="126" y="228" width="74" height="44" rx="14" stroke="#1d5fa8" stroke-width="2.6"/>
    <path d="M146,272 L144,290 L165,272" stroke="#1d5fa8" stroke-width="2.6"/>
    <circle cx="147" cy="250" r="3.2" fill="#1d5fa8" stroke="none"/>
    <circle cx="163" cy="250" r="3.2" fill="#1d5fa8" stroke="none"/>
    <circle cx="179" cy="250" r="3.2" fill="#1d5fa8" stroke="none"/>
    <rect x="210" y="242" width="60" height="38" rx="12" stroke="#c0392b" stroke-width="2.6"/>
    <path d="M250,280 L254,296 L234,280" stroke="#c0392b" stroke-width="2.6"/>
    <line x1="164" y1="312" x2="224" y2="312" stroke="#7aa3cc" stroke-width="2.2" stroke-dasharray="7 7"/>
    <circle cx="150" cy="312" r="14" stroke="#15263f" stroke-width="2.6"/>
    <path d="M129,344 q21,-24 42,0" stroke="#15263f" stroke-width="2.6"/>
    <circle cx="238" cy="312" r="14" stroke="#15263f" stroke-width="2.6"/>
    <path d="M217,344 q21,-24 42,0" stroke="#15263f" stroke-width="2.6"/>
  </g>

  <!-- 7) الرسم التوضيحي الثاني: متجر إلكتروني وعربة تسوق -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128,716 L145,688 L255,688 L272,716 Z" stroke="#15263f" stroke-width="2.6"/>
    <line x1="172" y1="688" x2="163" y2="716" stroke="#c0392b" stroke-width="2"/>
    <line x1="200" y1="688" x2="200" y2="716" stroke="#c0392b" stroke-width="2"/>
    <line x1="228" y1="688" x2="237" y2="716" stroke="#c0392b" stroke-width="2"/>
    <rect x="138" y="716" width="124" height="62" stroke="#15263f" stroke-width="2.6"/>
    <rect x="150" y="738" width="34" height="40" stroke="#15263f" stroke-width="2.2"/>
    <rect x="196" y="732" width="44" height="24" stroke="#1d5fa8" stroke-width="2.2"/>
    <path d="M272,724 L284,724 L296,760" stroke="#c0392b" stroke-width="2.6"/>
    <path d="M292,734 L348,734 L340,760 L300,760 Z" stroke="#c0392b" stroke-width="2.6"/>
    <circle cx="306" cy="772" r="6.5" stroke="#c0392b" stroke-width="2.4"/>
    <circle cx="336" cy="772" r="6.5" stroke="#c0392b" stroke-width="2.4"/>
  </g>

  <!-- 8) دوائر أرقام الأقسام -->
  <circle cx="958" cy="300" r="18" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text x="958" y="308"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#c0392b">1</text>

  <circle cx="958" cy="734" r="18" fill="none" stroke="#c0392b" stroke-width="2.4"/>
  <text x="958" y="742"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#c0392b">2</text>

  <!-- 9) العناوين -->
  <text x="540" y="155"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#143a63">التواصل الاجتماعي والتجارة الإلكترونية</text>

  <text x="540" y="205"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="31"
        fill="#21456f">Social Networking and E-commerce</text>

  <!-- 10) القسم الأول -->
  <text x="930" y="310"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="36"
        font-weight="bold"
        fill="#c0392b">
    <tspan x="930" dy="0">شبكات التواصل الاجتماعي SNS</tspan>
  </text>

  <text x="930" y="390"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#1d5fa8">
    <tspan x="930" dy="0">خدمات تسمح للمستخدمين بالتواصل ونشر</tspan>
    <tspan x="930" dy="46">المعلومات ومشاركتها بسرعة.</tspan>
  </text>

  <text x="120" y="502"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#c0392b">
    <tspan x="120" dy="0">Social Networking Services SNS</tspan>
  </text>

  <text x="120" y="552"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#15263f">
    <tspan x="120" dy="0">Services that allow users to connect and post</tspan>
    <tspan x="120" dy="42">and share information rapidly.</tspan>
  </text>

  <!-- 11) القسم الثاني -->
  <text x="930" y="744"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="36"
        font-weight="bold"
        fill="#c0392b">
    <tspan x="930" dy="0">التجارة الإلكترونية E-commerce</tspan>
  </text>

  <text x="930" y="828"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#1d5fa8">
    <tspan x="930" dy="0">شراء السلع والخدمات وبيعها عبر الإنترنت،</tspan>
    <tspan x="930" dy="46">مثل المتاجر الإلكترونية.</tspan>
  </text>

  <text x="120" y="936"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#c0392b">
    <tspan x="120" dy="0">E-commerce</tspan>
  </text>

  <text x="120" y="984"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#15263f">
    <tspan x="120" dy="0">Buying and selling goods and services through</tspan>
    <tspan x="120" dy="42">the Internet, such as online stores.</tspan>
  </text>

</svg>
