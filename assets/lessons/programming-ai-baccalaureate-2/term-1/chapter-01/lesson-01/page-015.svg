<!-- Text: card header -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 5</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 5 TERMS</tspan>
</text>

<!-- Text: term 1 -->
<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحوسبة السحابية</tspan> — استخدام موارد حوسبة</tspan>
  <tspan x="935" dy="40">مثل التخزين والمعالجة والبرامج، موجودة</tspan>
  <tspan x="935" dy="40">في <tspan font-weight="bold" fill="#17457f">مراكز بيانات بعيدة،</tspan> عبر الإنترنت</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">وعند الحاجة،</tspan> بدلًا من امتلاكها على جهازك.</tspan>
</text>

<text x="140"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">cloud computing</tspan> — using computing</tspan>
  <tspan x="140" dy="40">resources such as storage, processing,</tspan>
  <tspan x="140" dy="40">and software in <tspan font-weight="bold" fill="#17457f">distant data centers,</tspan></tspan>
  <tspan x="140" dy="40">over the Internet and <tspan font-weight="bold" fill="#17457f">when needed,</tspan></tspan>
  <tspan x="140" dy="40">instead of owning them on your device.</tspan>
</text>

<!-- Text: term 2 -->
<text x="935"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تكنولوجيا المعلومات كخدمة</tspan> — أن تستأجر</tspan>
  <tspan x="935" dy="40">التقنية <tspan font-weight="bold" fill="#17457f">وتدفع حسب استخدامك،</tspan> بدلًا من</tspan>
  <tspan x="935" dy="40">شراء الأجهزة وإدارتها بنفسك.</tspan>
</text>

<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">IT as a service</tspan> — renting technology</tspan>
  <tspan x="140" dy="40">and <tspan font-weight="bold" fill="#17457f">paying for what you use,</tspan></tspan>
  <tspan x="140" dy="40">instead of buying and managing</tspan>
  <tspan x="140" dy="40">the equipment yourself.</tspan>
</text>
</svg>
