<!-- Header row: right cell -->
<text x="962" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="962" dy="0">إذا رأيت…</tspan>
</text>
<text x="558" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">
  <tspan x="558" dy="0">If you see…</tspan>
</text>
<!-- Header row: left cell -->
<text x="522" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="522" dy="0">تذكّر أن…</tspan>
</text>
<text x="113" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">
  <tspan x="113" dy="0">Remember that…</tspan>
</text>

<!-- Row 1: right cell -->
<text x="962" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">الواقع الافتراضي</tspan>
  <tspan x="962" dy="40">يسرّع المعالجة</tspan>
</text>
<text x="558" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">VR speeds up</tspan>
  <tspan x="558" dy="40">processing</tspan>
</text>
<!-- Row 1: left cell -->
<text x="522" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">خطأ: VR بيئة</tspan>
  <tspan x="522" dy="40">افتراضية فقط</tspan>
</text>
<text x="113" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">False: VR is only a</tspan>
  <tspan x="113" dy="40">virtual environment</tspan>
</text>

<!-- Row 2: right cell -->
<text x="962" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">&#x200F;AR أم VR؟</tspan>
</text>
<text x="558" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">AR or VR?</tspan>
</text>
<!-- Row 2: left cell -->
<text x="522" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">يضيف للواقع = AR،</tspan>
  <tspan x="522" dy="40">يستبدله = VR</tspan>
</text>
<text x="113" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">Adds to reality = AR;</tspan>
  <tspan x="113" dy="40">replaces it = VR</tspan>
</text>

<!-- Row 3: right cell -->
<text x="962" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">لماذا الحوسبة الطرفية</tspan>
  <tspan x="962" dy="40">في السيارة؟</tspan>
</text>
<text x="558" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">Why edge computing</tspan>
  <tspan x="558" dy="40">in a car?</tspan>
</text>
<!-- Row 3: left cell -->
<text x="522" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">لأن تأخير 0.1 ثانية</tspan>
  <tspan x="522" dy="40">قد يسبب حادثًا</tspan>
</text>
<text x="113" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">Because a 0.1-second</tspan>
  <tspan x="113" dy="40">delay can cause</tspan>
  <tspan x="113" dy="40">an accident</tspan>
</text>
</svg>
