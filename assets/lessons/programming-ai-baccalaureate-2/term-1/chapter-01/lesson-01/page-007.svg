      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 1</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 1 TERMS</tspan>
</text>

<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الترانزستور</tspan> — <tspan font-weight="bold" fill="#17457f">مفتاح إلكتروني</tspan> صغير جدًا</tspan>
  <tspan x="935" dy="40">يفتح مرور التيار أو يغلقه، فيمثل <tspan fill="#c96a1b">1 أو 0.</tspan></tspan>
  <tspan x="935" dy="40">حل محل الصمام لأنه أصغر وأبرد</tspan>
  <tspan x="935" dy="40">وأوفر في الطاقة.</tspan>
</text>

<text x="140"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">transistor</tspan> — a very small</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">electronic switch</tspan> that turns current</tspan>
  <tspan x="140" dy="40">on or off, representing <tspan fill="#c96a1b">1 or 0.</tspan></tspan>
  <tspan x="140" dy="40">It replaced the vacuum tube</tspan>
  <tspan x="140" dy="40">because it is smaller, cooler,</tspan>
  <tspan x="140" dy="40">and uses less power.</tspan>
</text>

