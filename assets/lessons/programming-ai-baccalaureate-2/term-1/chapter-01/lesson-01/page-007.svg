</text>

<!-- Text: Caption -->
<text x="950"
      y="1034"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">من مفتاح بحجم لمبة</tspan>
  <tspan x="950" dy="40">إلى <tspan font-weight="bold" fill="#17457f">مليارات المفاتيح</tspan> على <tspan font-weight="bold" fill="#17457f">شريحة واحدة.</tspan></tspan>
</text>

<text x="120"
      y="1114"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">From a switch the size of a light bulb</tspan>
  <tspan x="120" dy="40">to <tspan font-weight="bold" fill="#17457f">billions of switches</tspan> on <tspan font-weight="bold" fill="#17457f">one chip.</tspan></tspan>
</text>
