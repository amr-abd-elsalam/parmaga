<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilBoard" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <radialGradient id="ilGlass" cx="0.4" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </radialGradient>
</defs>

<!-- Shadows -->
<rect x="99" y="192" width="890" height="760" rx="12" fill="#22303f" opacity=".12"/>
<rect x="434" y="991" width="220" height="255" rx="14" fill="#22303f" opacity=".18"/>
<polygon points="274,1041 349,1176 199,1176" fill="#22303f" opacity=".18"/>

<!-- Table fills -->
<rect x="95" y="186" width="890" height="760" rx="12" fill="#fffdf7"/>
<rect x="95" y="186" width="890" height="120" rx="12" fill="#fdf6d8"/>
<rect x="95" y="246" width="890" height="60" fill="#fdf6d8"/>
<rect x="95" y="466" width="890" height="240" fill="#fbf6e9"/>

<!-- Table separators and frame -->
<line x1="95" y1="306" x2="985" y2="306" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="466" x2="985" y2="466" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="706" x2="985" y2="706" stroke="#c0392b" stroke-width="1.4"/>
<line x1="540" y1="186" x2="540" y2="946" stroke="#c0392b" stroke-width="1.4"/>
<rect x="95" y="186" width="890" height="760" rx="12" fill="none" stroke="#c0392b" stroke-width="2"/>

<!-- Title icons -->
<g transform="translate(125 76)">
  <polygon points="28,2 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25" y="16" width="6" height="20" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>
<g transform="translate(902 76)">
  <circle cx="26" cy="22" r="20" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="40" width="16" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M20 22 Q 26 14 32 22" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Memory illustration -->
<ellipse cx="540" cy="1250" rx="380" ry="10" fill="#22303f" opacity=".12"/>

<!-- Clipboard with exam paper -->
<rect x="430" y="985" width="220" height="255" rx="14" fill="url(#ilBoard)" stroke="#22303f" stroke-width="2.5"/>
<rect x="448" y="1012" width="184" height="212" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
<rect x="500" y="975" width="80" height="26" rx="8" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
<rect x="494" y="1042" width="120" height="6" rx="3" fill="#8fc9f2"/>
<rect x="494" y="1087" width="100" height="6" rx="3" fill="#8fc9f2"/>
<rect x="494" y="1132" width="115" height="6" rx="3" fill="#8fc9f2"/>
<rect x="494" y="1177" width="90" height="6" rx="3" fill="#8fc9f2"/>
<path d="M462 1045 L470 1053 L484 1037" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M464 1082 L480 1098 M480 1082 L464 1098" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<path d="M462 1135 L470 1143 L484 1127" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M464 1172 L480 1188 M480 1172 L464 1188" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

<!-- Magnifying glass -->
<polygon points="668,1192 680,1180 728,1228 716,1240" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="640" cy="1150" r="52" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<circle cx="640" cy="1150" r="41" fill="url(#ilGlass)" opacity=".85"/>
<path d="M614 1136 Q 622 1118 642 1114" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

<!-- Warning triangle -->
<polygon points="270,1035 345,1170 195,1170" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="263" y="1072" width="14" height="58" rx="7" fill="#22303f"/>
<circle cx="270" cy="1150" r="8" fill="#22303f"/>

<!-- Pencil -->
<rect x="170" y="1206" width="150" height="22" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
<rect x="150" y="1206" width="24" height="22" rx="4" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
<polygon points="320,1206 352,1217 320,1228" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="342,1214 352,1217 342,1220" fill="#22303f"/>

<!-- Thinking face -->
<g transform="translate(850 1035)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Light bulb -->
<circle cx="850" cy="1145" r="34" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
<rect x="834" y="1176" width="32" height="26" rx="5" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
<path d="M838 1148 Q 850 1132 862 1148" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="850" y1="1097" x2="850" y2="1085" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="802" y1="1145" x2="790" y2="1145" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="898" y1="1145" x2="910" y2="1145" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="816" y1="1111" x2="807" y2="1102" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="884" y1="1111" x2="893" y2="1102" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فخاخ الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam Traps</text>

<!-- Header row: right cell -->
<text x="962" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="962" dy="0">إذا رأيت…</tspan>
</text>
<text x="558" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">
  <tspan x="558" dy="0">If you see…</tspan>
</text>
<!-- Header row: left cell -->
<text x="522" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="522" dy="0">تذكّر أن…</tspan>
</text>
<text x="113" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">
  <tspan x="113" dy="0">Remember that…</tspan>
</text>

<!-- Row 1: right cell -->
<text x="962" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">قانون مور قانون فيزيائي</tspan>
</text>
<text x="558" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">Moore's Law is a</tspan>
  <tspan x="558" dy="40">physical law</tspan>
</text>
<!-- Row 1: left cell -->
<text x="522" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">خطأ: هو ملاحظة تجريبية</tspan>
</text>
<text x="113" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">False: it is an</tspan>
  <tspan x="113" dy="40">empirical observation</tspan>
</text>

<!-- Row 2: right cell -->
<text x="962" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">الإنترنت هو الويب</tspan>
</text>
<text x="558" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">The Internet is</tspan>
  <tspan x="558" dy="40">the Web</tspan>
</text>
<!-- Row 2: left cell -->
<text x="522" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">خطأ: الويب خدمة</tspan>
  <tspan x="522" dy="40">فوق الإنترنت</tspan>
</text>
<text x="113" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">False: the Web is</tspan>
  <tspan x="113" dy="40">a service on the</tspan>
  <tspan x="113" dy="40">Internet</tspan>
</text>

<!-- Row 3: right cell -->
<text x="962" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">الشراء من محل بالنقد</tspan>
  <tspan x="962" dy="40">تجارة إلكترونية</tspan>
</text>
<text x="558" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">Buying at a shop with</tspan>
  <tspan x="558" dy="40">cash is e-commerce</tspan>
</text>
<!-- Row 3: left cell -->
<text x="522" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">خطأ: التجارة</tspan>
  <tspan x="522" dy="40">الإلكترونية عبر الإنترنت</tspan>
</text>
<text x="113" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">False: e-commerce</tspan>
  <tspan x="113" dy="40">happens through the</tspan>
  <tspan x="113" dy="40">Internet</tspan>
</text>
</svg>
