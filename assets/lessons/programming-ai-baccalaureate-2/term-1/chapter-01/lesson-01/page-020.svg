    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="128" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="528" width="870" height="328" rx="16" fill="#22303f" opacity=".12"/>
<rect x="174" y="1156" width="80" height="100" rx="8" fill="#22303f" opacity=".18"/>
<circle cx="824" cy="1196" r="36" fill="#22303f" opacity=".18"/>

<!-- Info card -->
<rect x="105" y="122" width="870" height="368" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="336" rx="3" fill="#2f7fb5"/>

<!-- Warning card -->
<rect x="105" y="522" width="870" height="328" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="538" width="6" height="296" rx="3" fill="#c96a1b"/>

<!-- Memory illustration: observed and measured doubling trend -->
<g>
  <rect x="170" y="1150" width="80" height="100" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="192" y="1142" width="36" height="16" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 182 1180 L 188 1186 L 198 1174" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="206" y1="1180" x2="238" y2="1180" stroke="#8fc9f2" stroke-width="1.4"/>
  <path d="M 182 1204 L 188 1210 L 198 1198" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="206" y1="1204" x2="238" y2="1204" stroke="#8fc9f2" stroke-width="1.4"/>
  <path d="M 182 1228 L 188 1234 L 198 1222" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="206" y1="1228" x2="238" y2="1228" stroke="#8fc9f2" stroke-width="1.4"/>

  <rect x="360" y="1244" width="40" height="6" rx="2" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="420" y="1238" width="40" height="12" rx="2" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="480" y="1226" width="40" height="24" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="540" y="1202" width="40" height="48" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="600" y="1160" width="40" height="90" rx="2" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <line x1="330" y1="1150" x2="330" y2="1250" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="1250" x2="680" y2="1250" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M 370 1230 Q 560 1226 650 1156" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="660,1146 657,1162 645,1153" fill="#c0392b"/>

  <polygon points="843,1222 851,1214 889,1252 881,1260" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="820" cy="1190" r="36" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 798 1206 L 812 1198 L 826 1188 L 842 1170" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="842" cy="1170" r="4" fill="#2e7d32"/>
</g>

<!-- Icon: open book beside card header -->
<g transform="translate(560 148)">
  <path d="M 0 -16 Q -13 -24 -26 -18 L -26 18 Q -13 12 0 20 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 0 -16 Q 13 -24 26 -18 L 26 18 Q 13 12 0 20 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="-20" y1="-8" x2="-6" y2="-6" stroke="#8fc9f2" stroke-width="1.4"/>
  <line x1="-20" y1="0" x2="-6" y2="2" stroke="#8fc9f2" stroke-width="1.4"/>
  <line x1="6" y1="-6" x2="20" y2="-8" stroke="#2f7fb5" stroke-width="1.4"/>
  <line x1="6" y1="2" x2="20" y2="0" stroke="#2f7fb5" stroke-width="1.4"/>
</g>

<!-- Icon: warning triangle in warning card -->
<g transform="translate(175 552)">
  <polygon points="0,-24 26,20 -26,20" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-3" y="-10" width="6" height="16" rx="3" fill="#22303f"/>
  <circle cx="0" cy="12" r="3.5" fill="#22303f"/>
</g>

<!-- Face: thinking beside short English line -->
<g transform="translate(880 1100)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الملاحظة التجريبية</tspan> — استنتاج مبني على ما</tspan>
  <tspan x="935" dy="40">رُصد وقيس في الواقع، لا على برهان نظري،</tspan>
  <tspan x="935" dy="40">لذلك <tspan font-weight="bold" fill="#17457f">قد يتوقف.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">empirical observation</tspan> — a conclusion</tspan>
  <tspan x="140" dy="40">based on what was observed and</tspan>
  <tspan x="140" dy="40">measured, not on a theoretical proof,</tspan>
  <tspan x="140" dy="40">so it can <tspan font-weight="bold" fill="#17457f">stop being true.</tspan></tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه في الامتحان:</tspan> اسمه «قانون» لكنه ليس</tspan>
  <tspan x="935" dy="40">قانونًا فيزيائيًا مثل الجاذبية، بل</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">ملاحظة تجريبية</tspan> لاتجاه استمر عقودًا.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Watch out in the exam:</tspan> It is called</tspan>
  <tspan x="140" dy="40">a "law," but it is not a physical law</tspan>
  <tspan x="140" dy="40">like gravity; it is an</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">empirical observation</tspan> of a trend that</tspan>
  <tspan x="140" dy="40">lasted for decades.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">توقّع <tspan font-weight="bold" fill="#17457f">Gordon Moore</tspan> سنة <tspan fill="#c96a1b">1965</tspan> أن يتضاعف</tspan>
  <tspan x="950" dy="40">العدد كل عام، ثم عدّل توقعه سنة <tspan fill="#c96a1b">1975</tspan></tspan>
  <tspan x="950" dy="40">إلى كل عامين.</tspan>
</text>
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In <tspan fill="#c96a1b">1965,</tspan> <tspan font-weight="bold" fill="#17457f">Gordon Moore</tspan> predicted the</tspan>
  <tspan x="120" dy="40">number would double every year; in <tspan fill="#c96a1b">1975</tspan></tspan>
  <tspan x="120" dy="40">he revised it to every two years.</tspan>
</text>
</svg>
