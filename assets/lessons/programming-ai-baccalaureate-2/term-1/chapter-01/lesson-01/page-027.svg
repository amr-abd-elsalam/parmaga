<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="128" width="870" height="248" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="408" width="870" height="768" rx="16" fill="#22303f" opacity=".12"/>

<!-- Warning card -->
<rect x="105" y="122" width="870" height="248" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="138" width="6" height="216" rx="3" fill="#c96a1b"/>

<!-- Info card -->
<rect x="105" y="402" width="870" height="768" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="418" width="6" height="736" rx="3" fill="#2f7fb5"/>

<!-- Warning icon: triangle with exclamation mark -->
<g transform="translate(150 132)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Surprise face beside the warning -->
<g transform="translate(905 314)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- E-commerce icon: shopping cart -->
<g transform="translate(870 600)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="14,14 54,14 47,34 18,34" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <line x1="24" y1="16" x2="26" y2="32" stroke="#c96a1b" stroke-width="2.5"/>
  <line x1="36" y1="16" x2="36" y2="32" stroke="#c96a1b" stroke-width="2.5"/>
  <path d="M2 6 L10 6 L17 40 L48 40" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="21" cy="48" r="4.5" fill="#22303f"/>
  <circle cx="44" cy="48" r="4.5" fill="#22303f"/>
</g>

<!-- Remote work icon: house with laptop -->
<g transform="translate(870 840)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 54,24 2,24" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="8" y="24" width="40" height="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="16" y="30" width="24" height="14" rx="2" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <path d="M12 46 L44 46 L41 51 L15 51 Z" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Online learning icon: tablet with a lesson -->
<g transform="translate(870 1080)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="10" y="2" width="36" height="52" rx="6" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="15" y="8" width="26" height="38" rx="2" fill="#ffffff"/>
  <circle cx="28" cy="20" r="8" fill="#2f7fb5"/>
  <polygon points="25,16 33,20 25,24" fill="#ffffff"/>
  <rect x="18" y="32" width="20" height="4" rx="2" fill="#8fc9f2"/>
  <rect x="18" y="39" width="14" height="4" rx="2" fill="#8fc9f2"/>
</g>

<!-- Lower band: smile face and light bulb -->
<g transform="translate(500 1218)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(556 1190)" stroke-linecap="round" stroke-linejoin="round">
  <line x1="2" y1="22" x2="7" y2="22" stroke="#c96a1b" stroke-width="2.5"/>
  <line x1="49" y1="22" x2="54" y2="22" stroke="#c96a1b" stroke-width="2.5"/>
  <line x1="9" y1="4" x2="13" y2="8" stroke="#c96a1b" stroke-width="2.5"/>
  <line x1="47" y1="4" x2="43" y2="8" stroke="#c96a1b" stroke-width="2.5"/>
  <circle cx="28" cy="22" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="38" width="16" height="14" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="21" y1="45" x2="35" y2="45" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text: Warning card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه:</tspan> السرعة <tspan font-weight="bold" fill="#17457f">سلاح ذو حدين؛</tspan></tspan>
  <tspan x="935" dy="40">فالشائعة تنتشر بالسرعة نفسها التي</tspan>
  <tspan x="935" dy="40">ينتشر بها الخبر الصحيح.</tspan>
</text>

<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Careful:</tspan> Speed is a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">double-edged sword;</tspan> a rumor spreads</tspan>
  <tspan x="140" dy="40">as fast as true news.</tspan>
</text>

<!-- Text: Info card -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>

<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التجارة الإلكترونية</tspan> (EC) — بيع السلع</tspan>
  <tspan x="935" dy="40">والخدمات وشراؤها عبر الإنترنت.</tspan>
</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">e-commerce</tspan> (EC) — buying and</tspan>
  <tspan x="140" dy="40">selling goods and services</tspan>
  <tspan x="140" dy="40">through the Internet.</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">العمل عن بُعد</tspan> — أداء العمل من المنزل</tspan>
  <tspan x="935" dy="40">أو من مكان بعيد عن مقر العمل</tspan>
  <tspan x="935" dy="40">باستخدام الإنترنت.</tspan>
</text>

<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">remote work</tspan> — doing your work from</tspan>
  <tspan x="140" dy="40">home or a place away from the</tspan>
  <tspan x="140" dy="40">workplace using the Internet.</tspan>
</text>

<text x="935" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعلم عبر الإنترنت</tspan> — تقديم الدروس</tspan>
  <tspan x="935" dy="40">والمواد التعليمية عبر الإنترنت،</tspan>
  <tspan x="935" dy="40">مباشرة أو مسجلة.</tspan>
</text>

<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">online learning</tspan> — delivering lessons</tspan>
  <tspan x="140" dy="40">and study materials over the</tspan>
  <tspan x="140" dy="40">Internet, live or recorded.</tspan>
</text>
</svg>
