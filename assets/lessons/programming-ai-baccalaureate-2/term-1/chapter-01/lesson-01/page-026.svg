<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">خمسة تغيرات في حياتك</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Five Changes in Your Life</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">افتكر لعبة «يوم من غير إنترنت»؟ كل حاجة</tspan>
  <tspan x="950" dy="40">افتقدتها هي تغيّر من هذه <tspan font-weight="bold" fill="#17457f">التغيرات الخمسة.</tspan></tspan>
</text>

<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Remember the "day without the Internet"</tspan>
  <tspan x="120" dy="40">game? Everything you missed is one</tspan>
  <tspan x="120" dy="40">of these <tspan font-weight="bold" fill="#17457f">five changes.</tspan></tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>

<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">شبكات التواصل الاجتماعي</tspan> (SNS) — خدمات</tspan>
  <tspan x="935" dy="40">تتيح للمستخدمين التواصل ونشر المحتوى</tspan>
  <tspan x="935" dy="40">ومشاركته، وتنشر المعلومات بسرعة كبيرة.</tspan>
</text>

<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">SNS (Social Networking Service)</tspan> —</tspan>
  <tspan x="140" dy="40">services that let users connect,</tspan>
  <tspan x="140" dy="40">post, and share content, spreading</tspan>
  <tspan x="140" dy="40">information very fast.</tspan>
</text>
</svg>
