<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">2 صياد المبالغات</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">2 The Exaggeration Hunter</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اجمع عنوانين من الإنترنت عن</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الحوسبة الكمومية</tspan> أو <tspan font-weight="bold" fill="#17457f">السيارات ذاتية القيادة.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Collect two Internet headlines about</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">quantum computing</tspan> or <tspan font-weight="bold" fill="#17457f">self-driving cars.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">احكم على كل عنوان: هل <tspan font-weight="bold" fill="#c0392b">يبالغ؟</tspan></tspan>
  <tspan x="950" dy="40">وما <tspan font-weight="bold" fill="#2e7d32">الصياغة الأدق؟</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Judge each headline: Does it <tspan font-weight="bold" fill="#c0392b">exaggerate?</tspan></tspan>
  <tspan x="120" dy="40">What is the more <tspan font-weight="bold" fill="#2e7d32">accurate wording?</tspan></tspan>
</text>
