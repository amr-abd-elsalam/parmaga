<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والآن اربط اللعبة <tspan font-weight="bold" fill="#17457f">بالكمبيوتر:</tspan></tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Now link the game to the <tspan font-weight="bold" fill="#17457f">computer:</tspan></tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التضاعف</tspan> = عدد <tspan font-weight="bold" fill="#17457f">الترانزستورات</tspan> في الشريحة</tspan>
  <tspan x="950" dy="40">يتضاعف تقريبًا كل عامين.</tspan>
</text>
<text x="132" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Doubling</tspan> = the number of <tspan font-weight="bold" fill="#17457f">transistors</tspan></tspan>
  <tspan x="132" dy="40">on a chip roughly doubles about</tspan>
  <tspan x="132" dy="40">every two years.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">العجز عن الطي</tspan> = التصغير يقترب</tspan>
  <tspan x="950" dy="40">الآن من <tspan font-weight="bold" fill="#17457f">حد فيزيائي.</tspan></tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Being unable to fold</tspan> = miniaturization</tspan>
  <tspan x="132" dy="40">is now approaching a <tspan font-weight="bold" fill="#17457f">physical limit.</tspan></tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">قانون مور</tspan> (Moore's Law) — ملاحظة تقول</tspan>
  <tspan x="935" dy="40">إن عدد الترانزستورات في الدائرة المتكاملة</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">يتضاعف</tspan> تقريبًا كل عامين.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Moore's Law</tspan> — the observation that</tspan>
  <tspan x="140" dy="40">the number of transistors on an</tspan>
  <tspan x="140" dy="40">integrated circuit roughly <tspan font-weight="bold" fill="#17457f">doubles</tspan></tspan>
  <tspan x="140" dy="40">every two years.</tspan>
</text>
</svg>
