  <rect x="67" y="58" width="946" height="1258" rx="4" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <text x="540" y="108"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42" font-weight="bold" fill="#14477e">طبّق ما تعلمت</text>

  <text x="540" y="147"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#2f5074">Apply What You Learned</text>

  <line x1="404" y1="161" x2="676" y2="161" stroke="#b98b3a" stroke-width="2" opacity="0.8"/>

  <rect x="95" y="176" width="890" height="340" rx="14" fill="#e8f4e6" stroke="#7fae83" stroke-width="2"/>

  <text x="955" y="218"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="bold" fill="#1f6b3a">في سياق جديد</text>

  <text x="125" y="218"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#2c7a4b">In a New Context</text>

  <text x="955" y="266"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#1b4f8f">
    <tspan x="955" dy="0">قرية لم يتوفر بها اتصال بالإنترنت من قبل، ثم اتصلت</tspan>
    <tspan x="955" dy="33">بالإنترنت عالي السرعة، وأصبحت خدمات الدفع غير النقدي</tspan>
    <tspan x="955" dy="33">متاحة فيها لأول مرة. بالاستعانة بمراحل التطور</tspan>
    <tspan x="955" dy="33">والتغيرات الاجتماعية التي درستها:</tspan>
  </text>

  <line x1="140" y1="386" x2="940" y2="386" stroke="#a8cba9" stroke-width="1.6" stroke-dasharray="7 7"/>

  <text x="125" y="415"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#16324f">
    <tspan x="125" dy="0">A village that has never had Internet access is</tspan>
    <tspan x="125" dy="28">connected to high-speed Internet, and cashless</tspan>
    <tspan x="125" dy="28">payment becomes available for the first time.</tspan>
    <tspan x="125" dy="28">Using the stages and social changes you studied:</tspan>
  </text>

  <text x="944" y="546"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#1f6b3a">1.</text>

  <text x="928" y="546"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#1b4f8f">توقّع تغيرين قد يطرآن على الحياة اليومية.</text>

  <text x="155" y="576"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#16324f">Predict two ways daily life may change.</text>

  <text x="944" y="614"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#1f6b3a">2.</text>

  <text x="928" y="614"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#1b4f8f">حدّد مشكلة جديدة قد تواجه القرية.</text>

  <text x="155" y="644"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#16324f">Identify one new problem the village may face.</text>

  <g>
    <line x1="260" y1="744" x2="822" y2="744" stroke="#a08e72" stroke-width="2.5"/>

    <polygon points="314,744 328,694 342,744" fill="none" stroke="#4a6b8a" stroke-width="2.5"/>
    <line x1="319" y1="726" x2="337" y2="726" stroke="#4a6b8a" stroke-width="2"/>
    <line x1="322" y1="712" x2="334" y2="712" stroke="#4a6b8a" stroke-width="2"/>
    <circle cx="328" cy="692" r="3.5" fill="#c0392b"/>
