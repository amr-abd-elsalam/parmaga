    <path d="M 346 676 A 26 26 0 0 1 346 712" fill="none" stroke="#4a6b8a" stroke-width="2" opacity="0.75"/>

    <path d="M 498 708 A 16 16 0 0 1 504 678 A 22 22 0 0 1 546 676 A 16 16 0 0 1 552 708 Z"
          fill="#dbe9f9" stroke="#6f9bd1" stroke-width="2"/>
    <circle cx="512" cy="698" r="3" fill="#6f9bd1"/>
    <circle cx="526" cy="692" r="3" fill="#6f9bd1"/>
    <circle cx="540" cy="698" r="3" fill="#6f9bd1"/>

    <path d="M 348 702 Q 420 676 496 694" fill="none" stroke="#c0504d" stroke-width="2.2" stroke-dasharray="8 6"/>
    <path d="M 554 698 Q 600 684 646 706" fill="none" stroke="#c0504d" stroke-width="2.2" stroke-dasharray="8 6"/>

    <rect x="636" y="714" width="46" height="30" fill="#f7edda" stroke="#7a6a55" stroke-width="2"/>
    <polygon points="630,714 659,693 688,714" fill="#c98b6a" stroke="#7a6a55" stroke-width="2"/>
    <rect x="652" y="728" width="14" height="16" fill="#a9764f" stroke="#7a6a55" stroke-width="1.4"/>

    <rect x="696" y="706" width="52" height="38" fill="#f7edda" stroke="#7a6a55" stroke-width="2"/>
    <polygon points="690,706 722,681 754,706" fill="#c98b6a" stroke="#7a6a55" stroke-width="2"/>
    <rect x="705" y="714" width="14" height="12" fill="#dbe9f9" stroke="#7a6a55" stroke-width="1.4"/>
    <rect x="728" y="724" width="14" height="20" fill="#a9764f" stroke="#7a6a55" stroke-width="1.4"/>

    <rect x="762" y="718" width="42" height="26" fill="#f7edda" stroke="#7a6a55" stroke-width="2"/>
    <polygon points="756,718 783,699 810,718" fill="#c98b6a" stroke="#7a6a55" stroke-width="2"/>
    <rect x="776" y="728" width="13" height="16" fill="#a9764f" stroke="#7a6a55" stroke-width="1.4"/>
  </g>

  <rect x="95" y="758" width="890" height="404" rx="14" fill="#e6effb" stroke="#7ba7d9" stroke-width="2"/>

  <text x="955" y="796"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="bold" fill="#14477e">إجابة السؤال الرئيسي</text>

  <text x="125" y="796"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#2f5074">Lesson Question Answered</text>

  <text x="955" y="840"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" fill="#1b4f8f">
    <tspan x="955" dy="0">تطورت تكنولوجيا المعلومات عبر مراحل متتابعة؛ وفي كل مرحلة</tspan>
    <tspan x="955" dy="30">أصبحت الأجهزة أصغر وأسرع وأكثر اتصالًا. وأدى ذلك إلى تغير</tspan>
    <tspan x="955" dy="30">طرق الوصول إلى المعلومات والتواصل والعمل والتعلم والدفع.</tspan>
    <tspan x="955" dy="30">كما انتقلت تكنولوجيا المعلومات من أجهزة منفردة إلى خدمات</tspan>
    <tspan x="955" dy="30">رقمية متصلة تدعم تحليل البيانات والذكاء الاصطناعي.</tspan>
  </text>

  <line x1="140" y1="978" x2="940" y2="978" stroke="#9dbfe0" stroke-width="1.6" stroke-dasharray="7 7"/>

  <text x="125" y="1000"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#16324f">
    <tspan x="125" dy="0">Information technology developed through a series of</tspan>
    <tspan x="125" dy="26">stages. At each stage, devices became smaller, faster,</tspan>
    <tspan x="125" dy="26">and more connected. This changed how people access</tspan>
    <tspan x="125" dy="26">information, communicate, work, learn, and pay.</tspan>
    <tspan x="125" dy="26">Information technology also moved from individual</tspan>
    <tspan x="125" dy="26">machines to connected digital services supporting</tspan>
  </text>

  <text x="125" y="1152"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#16324f">data analysis and AI.</text>

</svg>
