<!-- Text: paragraph -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">ثم <tspan fill="#c96a1b">«طار»</tspan> الحاسوب إلى <tspan font-weight="bold" fill="#c0392b">السحابة،</tspan></tspan>
  <tspan x="950" dy="40">فهل تعرف أين توجد السحابة فعلًا؟</tspan>
</text>

<text x="120"
      y="234"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">Then the computer <tspan fill="#c96a1b">"flew"</tspan> to the <tspan font-weight="bold" fill="#c0392b">cloud.</tspan></tspan>
  <tspan x="120" dy="40">Do you know where the cloud really is?</tspan>
</text>

<!-- Text: key sentence strip -->
<text x="935"
      y="354"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">السحابة = كمبيوتر حد تاني،</tspan>
  <tspan x="935" dy="40">في مبنى حقيقي، بتأجّره بالإنترنت.</tspan>
</text>

<text x="140"
      y="434"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">The cloud = someone else's computer,</tspan>
  <tspan x="140" dy="40">in a real building, that you rent</tspan>
  <tspan x="140" dy="40">over the Internet.</tspan>
</text>

<!-- Text: illustration labels -->
<text x="440"
      y="914"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="440" dy="0">مركز بيانات حقيقي</tspan>
</text>

<text x="150"
      y="954"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="150" dy="0">A real data center</tspan>
</text>

<text x="830"
      y="914"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="830" dy="0">أنت</tspan>
</text>

<text x="780"
      y="954"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="780" dy="0">You</tspan>
</text>

<text x="640"
      y="634"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="640" dy="0">الإنترنت</tspan>
</text>

<text x="465"
      y="674"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="465" dy="0">The Internet</tspan>
</text>

<!-- Text: caption -->
<text x="950"
      y="1034"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">السحابة ليست في السماء،</tspan>
  <tspan x="950" dy="40">بل <tspan font-weight="bold" fill="#17457f">أجهزة حقيقية</tspan> في <tspan font-weight="bold" fill="#17457f">مكان حقيقي.</tspan></tspan>
</text>

<text x="120"
      y="1114"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">The cloud is not in the sky;</tspan>
  <tspan x="120" dy="40">it is <tspan font-weight="bold" fill="#17457f">real machines</tspan> in a <tspan font-weight="bold" fill="#17457f">real place.</tspan></tspan>
</text>
</svg>
