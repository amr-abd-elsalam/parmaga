<!-- Illustration labels -->
<text x="860" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">عميل</text>
<text x="770" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Customer</text>
<text x="604" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">صاحب متجر</text>
<text x="462" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Shop owner</text>
<text x="420" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">شخص بلا بطاقة أو هاتف</text>
<text x="160" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="160" dy="0">Person with no</tspan>
  <tspan x="160" dy="40">card or phone</tspan>
</text>

<!-- Box header -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فكّر</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">THINK</text>

<!-- Box paragraph -->
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">في مجتمع خالٍ تمامًا من النقد، من الشخص</tspan>
  <tspan x="935" dy="40">الذي قد يُترك خلف <tspan font-weight="bold" fill="#c0392b">الفجوة الرقمية؟</tspan></tspan>
  <tspan x="935" dy="40">وكيف نساعده؟</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In a fully cashless society, who might</tspan>
  <tspan x="140" dy="40">be left behind by the <tspan font-weight="bold" fill="#c0392b">digital divide?</tspan></tspan>
  <tspan x="140" dy="40">And how can we help them?</tspan>
</text>
