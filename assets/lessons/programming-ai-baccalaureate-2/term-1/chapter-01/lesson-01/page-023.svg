  <path d="M -7 6 Q -7 13 0 15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">لماذا يتباطأ قانون مور؟</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Why Is Moore's Law Slowing Down?</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كلما صغُر الترانزستور، ظهرت <tspan font-weight="bold" fill="#17457f">مشكلات</tspan></tspan>
  <tspan x="950" dy="40">لم تكن موجودة من قبل.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The smaller the transistor gets,</tspan>
  <tspan x="120" dy="40">the more <tspan font-weight="bold" fill="#17457f">new problems</tspan> appear that did</tspan>
  <tspan x="120" dy="40">not exist before.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التصغير</tspan> — جعل الترانزستورات أصغر فأصغر</tspan>
  <tspan x="935" dy="40">ليدخل عدد أكبر منها في الشريحة نفسها.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">miniaturization</tspan> — making transistors</tspan>
  <tspan x="140" dy="40">smaller and smaller so more of them</tspan>
  <tspan x="140" dy="40">fit on the same chip.</tspan>
</text>

<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تيار التسرب</tspan> — تيار يمر رغم أن الترانزستور</tspan>
  <tspan x="935" dy="40">«مغلق»، فيضيع جزء من الطاقة ويسخن الجهاز.</tspan>
  <tspan x="935" dy="40">مثل <tspan fill="#c96a1b">صنبور مغلق لكنه ينقّط.</tspan></tspan>
</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">leakage current</tspan> — current that flows</tspan>
  <tspan x="140" dy="40">even when the transistor is "off,"</tspan>
  <tspan x="140" dy="40">wasting energy and heating the device.</tspan>
  <tspan x="140" dy="40">Like a <tspan fill="#c96a1b">closed tap that still drips.</tspan></tspan>
</text>
</svg>
