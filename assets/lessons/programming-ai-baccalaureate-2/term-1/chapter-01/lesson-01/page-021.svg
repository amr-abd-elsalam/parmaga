<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">محقق قانون مور</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Moore's Law Detective</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا تحفظ القانون… <tspan font-weight="bold" fill="#17457f">اكتشفه</tspan> بنفسك</tspan>
  <tspan x="950" dy="40">من <tspan fill="#c96a1b">أرقام حقيقية!</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Don't memorize the law… <tspan font-weight="bold" fill="#17457f">discover</tspan> it</tspan>
  <tspan x="120" dy="40">yourself from <tspan fill="#c96a1b">real numbers!</tspan></tspan>
</text>

<text x="965" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="965" dy="0">المعالج</tspan>
</text>
<text x="535" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="535" dy="0">Processor</tspan>
</text>
<text x="495" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="495" dy="0">عدد الترانزستورات</tspan>
</text>
<text x="115" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">Transistor count</tspan>
</text>

<text x="535" y="580" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="535" dy="0">Intel 4004 (1971)</tspan>
</text>

<text x="115" y="580" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="115" dy="0">2,300</tspan>
</text>

<text x="535" y="700" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="535" dy="0">Apple M1 Ultra (2022)</tspan>
</text>

<text x="115" y="700" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="115" dy="0">114 billion</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">1.</tspan> كم ضعفًا زاد العدد؟</tspan>
  <tspan x="950" dy="40">اقسم <tspan fill="#c96a1b">114,000,000,000</tspan> على <tspan fill="#c96a1b">2,300.</tspan></tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">1.</tspan> By how many times did the number</tspan>
  <tspan x="120" dy="40">increase? Divide <tspan fill="#c96a1b">114,000,000,000</tspan></tspan>
  <tspan x="120" dy="40">by <tspan fill="#c96a1b">2,300.</tspan></tspan>
</text>
</svg>
