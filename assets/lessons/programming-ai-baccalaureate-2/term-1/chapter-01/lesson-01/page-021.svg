<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5804a"/>
      <stop offset="0.55" stop-color="#9c6635"/>
      <stop offset="1" stop-color="#82512a"/>
    </linearGradient>
  </defs>

  <!-- 1) الخلفية الخشبية البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0,235 C300,195 720,305 1080,245" fill="none" stroke="#6d4520" stroke-width="26" opacity="0.17"/>
  <path d="M0,905 C290,865 760,965 1080,915" fill="none" stroke="#6d4520" stroke-width="20" opacity="0.13"/>

  <!-- 2) ظل الورقة ثم الورقة -->
  <rect x="42" y="44" width="1012" height="1282" rx="8" fill="#3a2410" opacity="0.22"/>
  <rect x="34" y="34" width="1012" height="1282" rx="6" fill="#fffdf7"/>

  <!-- 3) خطوط الكراسة الأفقية الباهتة -->
  <g stroke="#cfe0f0" stroke-width="1.6">
    <line x1="78" y1="116"  x2="1002" y2="116"/>
    <line x1="78" y1="156"  x2="1002" y2="156"/>
    <line x1="78" y1="196"  x2="1002" y2="196"/>
    <line x1="78" y1="236"  x2="1002" y2="236"/>
    <line x1="78" y1="276"  x2="1002" y2="276"/>
    <line x1="78" y1="316"  x2="1002" y2="316"/>
    <line x1="78" y1="356"  x2="1002" y2="356"/>
    <line x1="78" y1="396"  x2="1002" y2="396"/>
    <line x1="78" y1="436"  x2="1002" y2="436"/>
    <line x1="78" y1="476"  x2="1002" y2="476"/>
    <line x1="78" y1="516"  x2="1002" y2="516"/>
    <line x1="78" y1="556"  x2="1002" y2="556"/>
    <line x1="78" y1="596"  x2="1002" y2="596"/>
    <line x1="78" y1="636"  x2="1002" y2="636"/>
    <line x1="78" y1="676"  x2="1002" y2="676"/>
    <line x1="78" y1="716"  x2="1002" y2="716"/>
    <line x1="78" y1="756"  x2="1002" y2="756"/>
    <line x1="78" y1="796"  x2="1002" y2="796"/>
    <line x1="78" y1="836"  x2="1002" y2="836"/>
    <line x1="78" y1="876"  x2="1002" y2="876"/>
    <line x1="78" y1="916"  x2="1002" y2="916"/>
    <line x1="78" y1="956"  x2="1002" y2="956"/>
    <line x1="78" y1="996"  x2="1002" y2="996"/>
    <line x1="78" y1="1036" x2="1002" y2="1036"/>
    <line x1="78" y1="1076" x2="1002" y2="1076"/>
    <line x1="78" y1="1116" x2="1002" y2="1116"/>
    <line x1="78" y1="1156" x2="1002" y2="1156"/>
  </g>

  <!-- 4) الإطار الأحمر الخارجي الوحيد -->
  <rect x="67" y="67" width="946" height="1216" rx="6" fill="none" stroke="#c8392b" stroke-width="2.5"/>

  <!-- 5) العنوان العربي -->
  <text x="940" y="116"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42" font-weight="bold" fill="#1a5490">
    <tspan x="940" dy="0">تمرين: التقنيات الناشئة وشبكات التواصل</tspan>
  </text>

  <!-- 6) العنوان الإنجليزي -->
  <text x="120" y="156"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" fill="#152b42">
    <tspan x="250" dy="0">Exercise: Emerging Technologies and SNS</tspan>
  </text>

  <!-- ============ السؤال الأول ============ -->
  <text x="940" y="200"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="bold" fill="#1a5490">
    <tspan x="940" dy="0">اختر جميع التقنيات الناشئة من الاختيارات الآتية:</tspan>
  </text>

  <text x="120" y="236"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#152b42">
    <tspan x="120" dy="0">Choose all the emerging technologies from the</tspan>
    <tspan x="120" dy="30">following options:</tspan>
  </text>

  <!-- دوائر الاختيار الفارغة للسؤال الأول -->
  <g fill="#ffffff" stroke="#3d6f9e" stroke-width="2.2">
    <circle cx="150" cy="307" r="15"/>
    <circle cx="150" cy="347" r="15"/>
    <circle cx="150" cy="387" r="15"/>
    <circle cx="150" cy="427" r="15"/>
    <circle cx="150" cy="467" r="15"/>
    <circle cx="150" cy="507" r="15"/>
  </g>

  <!-- حروف الاختيارات A - F -->
  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1e7a45" direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="182" y="316">A</text>
    <text x="182" y="356">B</text>
    <text x="182" y="396">C</text>
    <text x="182" y="436">D</text>
    <text x="182" y="476">E</text>
    <text x="182" y="516">F</text>
  </g>

  <!-- النص العربي لاختيارات السؤال الأول -->
  <g direction="rtl" unicode-bidi="plaintext" text-anchor="start"
     font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
    <text x="940" y="316">البريد الإلكتروني</text>
    <text x="940" y="356">القيادة الذاتية</text>
    <text x="940" y="396">الحواسيب الشخصية</text>
    <text x="940" y="436">الواقع المعزز</text>
    <text x="940" y="476">الواقع الافتراضي</text>
    <text x="940" y="516">الحوسبة الكمومية</text>
  </g>

  <!-- النص الإنجليزي لاختيارات السؤال الأول -->
  <g direction="ltr" unicode-bidi="plaintext" text-anchor="start"
     font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42">
    <text x="232" y="316">Email</text>
    <text x="232" y="356">Autonomous Driving</text>
    <text x="232" y="396">Personal Computers</text>
    <text x="232" y="436">AR</text>
    <text x="232" y="476">VR</text>
    <text x="232" y="516">Quantum Computing</text>
  </g>

  <!-- ============ السؤال الثاني ============ -->
  <text x="940" y="558"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="bold" fill="#1a5490">
    <tspan x="940" dy="0">اختر العبارة التي تصف شبكات التواصل</tspan>
    <tspan x="940" dy="32">الاجتماعي SNS وصفًا أدق:</tspan>
  </text>

  <text x="120" y="626"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#152b42">
    <tspan x="120" dy="0">Choose the statement that most appropriately</tspan>
    <tspan x="120" dy="28">describes SNS:</tspan>
  </text>

  <!-- دوائر الاختيار الفارغة للسؤال الثاني -->
  <g fill="#ffffff" stroke="#3d6f9e" stroke-width="2.2">
    <circle cx="150" cy="685"  r="16"/>
    <circle cx="150" cy="837"  r="16"/>
    <circle cx="150" cy="930"  r="16"/>
    <circle cx="150" cy="1055" r="16"/>
  </g>

  <!-- حروف الاختيارات A - D -->
  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1e7a45" direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="182" y="694">A</text>
    <text x="182" y="846">B</text>
    <text x="182" y="939">C</text>
    <text x="182" y="1064">D</text>
  </g>

  <!-- الاختيار A -->
  <text x="940" y="694"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#225f9c">
    <tspan x="940" dy="0">خدمة تتيح للمستخدمين التواصل ونشر المعلومات</tspan>
    <tspan x="940" dy="32">ومشاركتها، وتتميز بفاعليتها في نشر المعلومات بسرعة.</tspan>
  </text>

  <text x="232" y="752"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">
    <tspan x="232" dy="0">A service that allows users to connect and post</tspan>
    <tspan x="232" dy="27">and share information, and is highly effective</tspan>
    <tspan x="232" dy="27">at spreading information rapidly.</tspan>
  </text>

  <!-- الاختيار B -->
  <text x="940" y="846"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#225f9c">
    <tspan x="940" dy="0">خدمة لشراء السلع والخدمات وبيعها عبر الإنترنت.</tspan>
  </text>

  <text x="232" y="872"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">
    <tspan x="232" dy="0">A service for buying and selling goods and</tspan>
    <tspan x="232" dy="27">services through the Internet.</tspan>
  </text>

  <!-- الاختيار C -->
  <text x="940" y="939"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#225f9c">
    <tspan x="940" dy="0">أسلوب عمل يؤدي فيه الشخص عمله من المنزل</tspan>
    <tspan x="940" dy="32">أو من أماكن بعيدة باستخدام الإنترنت.</tspan>
  </text>

  <text x="232" y="997"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">
    <tspan x="232" dy="0">A working style in which a person works from</tspan>
    <tspan x="232" dy="27">home or other remote locations using the Internet.</tspan>
  </text>

  <!-- الاختيار D -->
  <text x="940" y="1064"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#225f9c">
    <tspan x="940" dy="0">نظام لدفع قيمة السلع والخدمات بالنقود</tspan>
    <tspan x="940" dy="32">الإلكترونية أو رموز QR دون استخدام النقد.</tspan>
  </text>

  <text x="232" y="1122"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">
    <tspan x="232" dy="0">A system for paying for goods and services using</tspan>
    <tspan x="232" dy="27">electronic money or QR codes without using cash.</tspan>
  </text>

</svg>
