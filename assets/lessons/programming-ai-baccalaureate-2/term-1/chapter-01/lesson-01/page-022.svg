  <rect x="67" y="62" width="946" height="1253" rx="6" fill="none" stroke="#c0392b" stroke-width="3"/>

  <text x="540"
        y="118"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#1b3a63">تأمّل وتحدَّ نفسك</text>

  <text x="540"
        y="162"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        fill="#1f4e79">Reflect and Challenge</text>

  <line x1="392" y1="178" x2="688" y2="178" stroke="#7ba7d7" stroke-width="2"/>

  <rect x="95" y="190" width="890" height="540" rx="18" fill="#eaf2fb" stroke="#7ba7d7" stroke-width="2"/>

  <circle cx="955" cy="226" r="7" fill="#2f6fad"/>

  <text x="940"
        y="236"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1c4f8a">
    <tspan x="940" dy="0">أي مرحلة من مراحل تطور تكنولوجيا المعلومات</tspan>
    <tspan x="940" dy="38">تعتقد أنها ستكون الأكثر أهمية خلال السنوات</tspan>
    <tspan x="940" dy="38">العشر القادمة؟ اذكر سببًا واحدًا.</tspan>
  </text>

  <text x="125"
        y="352"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16324f">
    <tspan x="125" dy="0">Which stage of information technology do you think will</tspan>
    <tspan x="125" dy="34">matter most in the next ten years? Give one reason.</tspan>
  </text>

  <g stroke="#b9cfe4" stroke-width="1.6">
    <line x1="130" y1="428" x2="950" y2="428"/>
    <line x1="130" y1="472" x2="950" y2="472"/>
  </g>

  <circle cx="955" cy="506" r="7" fill="#2f6fad"/>

  <text x="940"
        y="516"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1c4f8a">
    <tspan x="940" dy="0">هل كان توقّعك في بداية الدرس صحيحًا؟</tspan>
    <tspan x="940" dy="38">ما الذي غيّر رأيك؟</tspan>
  </text>

  <text x="125"
        y="594"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16324f">
    <tspan x="125" dy="0">Was your prediction at the start of the lesson correct?</tspan>
    <tspan x="125" dy="34">What changed your mind?</tspan>
  </text>

  <g stroke="#b9cfe4" stroke-width="1.6">
    <line x1="130" y1="670" x2="950" y2="670"/>
    <line x1="130" y1="712" x2="950" y2="712"/>
  </g>

  <rect x="95" y="752" width="890" height="412" rx="18" fill="#fdf1e0" stroke="#e08b33" stroke-width="2"/>

  <text x="940"
        y="800"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#a4560d">
    <tspan x="940" dy="0">اختر تقنية ناشئة واحدة من الدرس:</tspan>
  </text>

  <text x="125"
        y="836"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#a4560d">
    <tspan x="125" dy="0">Choose one emerging technology from the lesson:</tspan>
  </text>

  <rect x="105" y="852" width="204" height="84" rx="12" fill="#fffdf8" stroke="#e0a86a" stroke-width="2"/>
  <rect x="117" y="864" width="16" height="16" rx="3" fill="#ffffff" stroke="#c98a3c" stroke-width="2"/>
  <text x="215"
        y="890"
