      <stop offset="0" stop-color="#b07b45"/>
      <stop offset="0.55" stop-color="#96633399"/>
      <stop offset="1" stop-color="#7c4f28"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefcf5"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
  </defs>

