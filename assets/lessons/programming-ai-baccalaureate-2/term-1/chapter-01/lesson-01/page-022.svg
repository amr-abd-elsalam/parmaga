<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadow -->
<rect x="109" y="568" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>

<!-- Success card -->
<rect x="105" y="562" width="870" height="608" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="578" width="6" height="576" rx="3" fill="#2e7d32"/>

<!-- Icon: pencil beside question 2 -->
<g transform="translate(200 170) rotate(-40)">
  <rect x="-22" y="-7" width="36" height="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-30" y="-7" width="8" height="14" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="14,-7 28,0 14,7" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="23,-2.5 28,0 23,2.5" fill="#22303f"/>
</g>

<!-- Face: thinking beside question 3 -->
<g transform="translate(880 505)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: check badge beside card header -->
<g transform="translate(600 610)">
  <circle cx="0" cy="0" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -10 0 L -3 8 L 11 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Bottom icon row -->
<g transform="translate(400 1222)">
  <polygon points="0,-24 5.9,-8.1 22.8,-7.4 9.5,3.1 14.1,19.4 0,10 -14.1,19.4 -9.5,3.1 -22.8,-7.4 -5.9,-8.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(540 1222)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(680 1222)">
  <line x1="-26" y1="-10" x2="-18" y2="-10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="0" x2="-18" y2="0" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="10" x2="-18" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="-10" x2="26" y2="-10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="0" x2="26" y2="0" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="10" x2="26" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="-26" x2="-10" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="-26" x2="0" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="-26" x2="10" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="18" x2="-10" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="18" x2="0" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="18" x2="10" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#4fc3e8"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">2.</tspan> كم مرة يجب أن <tspan font-weight="bold" fill="#c0392b">نضاعف</tspan> العدد 1</tspan>
  <tspan x="950" dy="40">لنصل إلى هذا الناتج؟</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">2.</tspan> How many <tspan font-weight="bold" fill="#c0392b">doublings</tspan> take 1 up to</tspan>
  <tspan x="120" dy="40">this result?</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">3.</tspan> اقسم عدد السنوات (2022 − 1971 = 51 سنة)</tspan>
  <tspan x="950" dy="40">على <tspan font-weight="bold" fill="#17457f">عدد المضاعفات.</tspan> ماذا تلاحظ؟</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">3.</tspan> Divide the number of years</tspan>
  <tspan x="120" dy="40">(2022 − 1971 = 51 years) by the number</tspan>
  <tspan x="120" dy="40">of <tspan font-weight="bold" fill="#17457f">doublings.</tspan> What do you notice?</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">الحل</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">Solution</tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">1. 114,000,000,000 ÷ 2,300 ≈ 50 مليون ضعف</tspan>
  <tspan x="935" dy="40">تقريبًا.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">1. 114,000,000,000 ÷ 2,300 ≈ about</tspan>
  <tspan x="140" dy="40">50 million times.</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">2. نحو 25 إلى 26 مضاعفة، لأن 2 أس 25</tspan>
  <tspan x="935" dy="40">≈ 33 مليونًا، و2 أس 26 ≈ 67 مليونًا.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">2. About 25 to 26 doublings, because</tspan>
  <tspan x="140" dy="40">2 to the power 25 ≈ 33 million, and</tspan>
  <tspan x="140" dy="40">2 to the power 26 ≈ 67 million.</tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">3. 51 ÷ 25.6 ≈ سنتان.</tspan>
  <tspan x="935" dy="40">لقد اكتشفت قانون مور بنفسك!</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">3. 51 ÷ 25.6 ≈ two years. You have</tspan>
  <tspan x="140" dy="40">discovered Moore's Law yourself!</tspan>
</text>
</svg>
