        font-size="19"
        fill="#1c4f8a">القيادة الذاتية</text>
  <text x="215"
        y="916"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="16"
        fill="#16324f">Autonomous Driving</text>

  <rect x="327" y="852" width="204" height="84" rx="12" fill="#fffdf8" stroke="#e0a86a" stroke-width="2"/>
  <rect x="339" y="864" width="16" height="16" rx="3" fill="#ffffff" stroke="#c98a3c" stroke-width="2"/>
  <text x="437"
        y="890"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="19"
        fill="#1c4f8a">الواقع المعزز</text>
  <text x="437"
        y="916"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="16"
        fill="#16324f">AR</text>

  <rect x="549" y="852" width="204" height="84" rx="12" fill="#fffdf8" stroke="#e0a86a" stroke-width="2"/>
  <rect x="561" y="864" width="16" height="16" rx="3" fill="#ffffff" stroke="#c98a3c" stroke-width="2"/>
  <text x="659"
        y="890"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="19"
        fill="#1c4f8a">الواقع الافتراضي</text>
  <text x="659"
        y="916"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="16"
        fill="#16324f">VR</text>

  <rect x="771" y="852" width="204" height="84" rx="12" fill="#fffdf8" stroke="#e0a86a" stroke-width="2"/>
  <rect x="783" y="864" width="16" height="16" rx="3" fill="#ffffff" stroke="#c98a3c" stroke-width="2"/>
  <text x="881"
        y="890"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="19"
        fill="#1c4f8a">الحوسبة الكمومية</text>
  <text x="881"
        y="916"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="16"
        fill="#16324f">Quantum Computing</text>

  <circle cx="955" cy="958" r="7" fill="#d2801f"/>

  <text x="940"
        y="968"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1c4f8a">
    <tspan x="940" dy="0">اقترح طريقة يمكن أن تساعد بها التقنية المختارة على حل</tspan>
    <tspan x="940" dy="36">مشكلة حقيقية، واذكر خطرًا محتملًا واحدًا.</tspan>
  </text>

  <text x="125"
        y="1040"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#16324f">
    <tspan x="125" dy="0">Suggest one way the chosen technology could help solve</tspan>
    <tspan x="125" dy="32">a real problem, and state one possible risk.</tspan>
  </text>

  <g stroke="#e6c49a" stroke-width="1.6">
    <line x1="130" y1="1108" x2="950" y2="1108"/>
    <line x1="130" y1="1146" x2="950" y2="1146"/>
  </g>

