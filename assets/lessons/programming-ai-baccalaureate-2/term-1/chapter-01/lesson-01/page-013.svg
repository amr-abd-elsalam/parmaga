<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadow -->
<rect x="109" y="568" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info card -->
<rect x="105" y="562" width="870" height="608" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="578" width="6" height="576" rx="3" fill="#2f7fb5"/>

<!-- Title icon: smartphone -->
<g transform="translate(128 78)">
  <rect x="14" y="2" width="28" height="52" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="9" width="20" height="36" rx="2" fill="#4fc3e8"/>
  <rect x="21" y="14" width="14" height="4" rx="2" fill="#ffffff"/>
  <rect x="21" y="22" width="10" height="4" rx="2" fill="#dff1f7"/>
  <circle cx="28" cy="50" r="2" fill="#ffffff"/>
</g>

<!-- Title icon: cloud -->
<g transform="translate(896 78)">
  <path d="M14 44 Q4 44 4 35 Q4 26 14 26 Q16 14 28 14 Q40 14 42 26 Q52 26 52 35 Q52 44 42 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 34 Q20 28 26 28" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Card icon: smartphone -->
<g transform="translate(800 862)">
  <rect x="14" y="2" width="28" height="52" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="9" width="20" height="36" rx="2" fill="#4fc3e8"/>
  <rect x="21" y="14" width="14" height="4" rx="2" fill="#ffffff"/>
  <rect x="21" y="22" width="10" height="4" rx="2" fill="#dff1f7"/>
  <rect x="21" y="30" width="6" height="6" rx="1" fill="#ffd24a"/>
  <rect x="29" y="30" width="6" height="6" rx="1" fill="#a9dcbe"/>
  <circle cx="28" cy="50" r="2" fill="#ffffff"/>
</g>

<!-- Card icon: open book -->
<g transform="translate(870 860)">
  <path d="M32 16 Q20 8 4 12 L4 52 Q20 48 32 56 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M32 16 Q44 8 60 12 L60 52 Q44 48 32 56 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="10" y1="22" x2="26" y2="24" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="26" y2="34" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="54" y2="22" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="54" y2="32" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Card icon: network nodes -->
<g transform="translate(870 1106)">
  <line x1="28" y1="14" x2="12" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="14" x2="44" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="42" x2="44" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="14" r="9" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="12" cy="42" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="44" cy="42" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Lower band icons: smartphone, network nodes, cloud -->
<g transform="translate(424 1192)">
  <rect x="14" y="2" width="28" height="52" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="9" width="20" height="36" rx="2" fill="#4fc3e8"/>
  <rect x="21" y="14" width="14" height="4" rx="2" fill="#ffffff"/>
  <rect x="21" y="22" width="10" height="4" rx="2" fill="#dff1f7"/>
  <circle cx="28" cy="50" r="2" fill="#ffffff"/>
</g>
<g transform="translate(512 1192)">
  <line x1="28" y1="14" x2="12" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="14" x2="44" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="42" x2="44" y2="42" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="14" r="9" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="12" cy="42" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="44" cy="42" r="9" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
</g>
<g transform="translate(600 1190)">
  <path d="M14 44 Q4 44 4 35 Q4 26 14 26 Q16 14 28 14 Q40 14 42 26 Q52 26 52 35 Q52 44 42 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 34 Q20 28 26 28" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="44" cy="16" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text: titles -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">المحطتان 4 و5:</tspan>
  <tspan x="540" dy="48">الجيب ثم السحابة</tspan>
</text>

<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">
  <tspan x="540" dy="0">Stations 4 and 5: The Pocket, Then the Cloud</tspan>
</text>

<!-- Text: intro paragraph -->
<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">في <tspan fill="#c96a1b">العقد الأول من الألفية</tspan> دخل الكمبيوتر جيبك</tspan>
  <tspan x="950" dy="40">في صورة <tspan font-weight="bold" fill="#c0392b">هاتف ذكي،</tspan> فصار الإنترنت معك</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">في كل مكان.</tspan></tspan>
</text>

<text x="120"
      y="434"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In the <tspan fill="#c96a1b">2000s,</tspan> the computer entered your</tspan>
  <tspan x="120" dy="40">pocket as a <tspan font-weight="bold" fill="#c0392b">smartphone,</tspan> so the Internet</tspan>
  <tspan x="120" dy="40">went <tspan font-weight="bold" fill="#17457f">everywhere</tspan> with you.</tspan>
</text>

<!-- Text: Info card header -->
<text x="935"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 4</tspan>
</text>

<text x="140"
      y="634"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 4 TERMS</tspan>
</text>

<!-- Text: term 1 -->
<text x="935"
      y="674"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الهاتف الذكي</tspan> — هاتف محمول يعمل كـ<tspan font-weight="bold" fill="#17457f"> كمبيوتر</tspan></tspan>
  <tspan x="935" dy="40">صغير، فيه نظام تشغيل وتطبيقات وشاشة لمس</tspan>
  <tspan x="935" dy="40">واتصال بالإنترنت.</tspan>
</text>

<text x="140"
      y="794"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">smartphone</tspan> — a mobile phone that works</tspan>
  <tspan x="140" dy="40">as a <tspan font-weight="bold" fill="#17457f">small computer,</tspan> with an operating</tspan>
  <tspan x="140" dy="40">system, apps, a touchscreen, and</tspan>
  <tspan x="140" dy="40">Internet access.</tspan>
</text>

<!-- Text: term 2 -->
<text x="935"
      y="954"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الإنترنت عبر الهاتف المحمول</tspan> — الوصول</tspan>
  <tspan x="935" dy="40">إلى الإنترنت من الهاتف <tspan font-weight="bold" fill="#17457f">في أي مكان</tspan></tspan>
  <tspan x="935" dy="40">عبر شبكات المحمول.</tspan>
</text>

<text x="140"
      y="1074"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">mobile Internet</tspan> — accessing the</tspan>
  <tspan x="140" dy="40">Internet from a phone <tspan font-weight="bold" fill="#17457f">anywhere</tspan> through</tspan>
  <tspan x="140" dy="40">mobile networks.</tspan>
</text>
</svg>
