    <tspan x="120" dy="31">information technology development in the</tspan>
    <tspan x="120" dy="31">correct chronological order.</tspan>
  </text>

  <line x1="115" y1="458" x2="965" y2="458" stroke="#9db8d4" stroke-width="1.6" opacity="0.6"/>

