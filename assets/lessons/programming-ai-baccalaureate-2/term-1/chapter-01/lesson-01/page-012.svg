  <circle cx="544" cy="1186" r="55" fill="#22303f" opacity=".18"/>
  <circle cx="540" cy="1180" r="55" fill="url(#ilGlobe)" stroke="#22303f" stroke-width="2.5"/>
  <path d="M502 1150 Q518 1138 532 1148 Q538 1162 524 1170 Q512 1178 504 1168 Q496 1160 502 1150 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
