  <line x1="485" y1="1180" x2="595" y2="1180" stroke="#dff1f7" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="506,1196 528,1146 574,1160 566,1210 506,1196" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
