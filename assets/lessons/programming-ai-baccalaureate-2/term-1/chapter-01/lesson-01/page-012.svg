<!-- Text: Card 1 -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 3</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 3 TERMS</tspan>
</text>

<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البريد الإلكتروني</tspan> — إرسال الرسائل</tspan>
  <tspan x="935" dy="40">والمرفقات عبر الإنترنت، وهو <tspan font-weight="bold" fill="#17457f">خدمة</tspan></tspan>
  <tspan x="935" dy="40">على الإنترنت <tspan font-weight="bold" fill="#17457f">وليس من الويب.</tspan></tspan>
</text>

<text x="140"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">email</tspan> — sending messages and</tspan>
  <tspan x="140" dy="40">attachments over the Internet;</tspan>
  <tspan x="140" dy="40">it is an Internet <tspan font-weight="bold" fill="#17457f">service,</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">not part of the Web.</tspan></tspan>
</text>

<!-- Text: Card 2 -->
<text x="935"
      y="554"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">هل تعلم؟</tspan>
</text>

<text x="140"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">DID YOU KNOW?</tspan>
</text>

<text x="935"
      y="634"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">اقترح <tspan font-weight="bold" fill="#17457f">Tim Berners-Lee</tspan> الويب</tspan>
  <tspan x="935" dy="40">في <tspan fill="#c96a1b">مارس 1989</tspan> أثناء عمله في CERN،</tspan>
  <tspan x="935" dy="40">وفي <tspan fill="#c96a1b">1991</tspan> أُتيح الويب خارج CERN.</tspan>
</text>

<text x="140"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Tim Berners-Lee</tspan> proposed the Web</tspan>
  <tspan x="140" dy="40">in <tspan fill="#c96a1b">March 1989</tspan> while working at CERN,</tspan>
  <tspan x="140" dy="40">and in <tspan fill="#c96a1b">1991</tspan> the Web was made</tspan>
  <tspan x="140" dy="40">available outside CERN.</tspan>
</text>

<text x="935"
      y="874"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">وفي <tspan fill="#c96a1b">30 أبريل 1993</tspan> أتاحت CERN</tspan>
  <tspan x="935" dy="40">برمجيات الويب للجميع <tspan font-weight="bold" fill="#2e7d32">دون مقابل،</tspan></tspan>
  <tspan x="935" dy="40">فانتشر في التسعينيات.</tspan>
</text>

<text x="140"
      y="994"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">On <tspan fill="#c96a1b">April 30, 1993,</tspan> CERN made</tspan>
  <tspan x="140" dy="40">the Web software <tspan font-weight="bold" fill="#2e7d32">freely available</tspan></tspan>
  <tspan x="140" dy="40">to everyone, so it spread in the 1990s.</tspan>
</text>
</svg>
