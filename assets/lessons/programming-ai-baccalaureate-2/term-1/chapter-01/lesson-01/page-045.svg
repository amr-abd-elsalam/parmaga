<text x="522" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="522" dy="0">تذكّر أن…</tspan>
</text>
<text x="113" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">
  <tspan x="113" dy="0">Remember that…</tspan>
</text>

<!-- Row 1: right cell -->
<text x="962" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">ترتيب المراحل</tspan>
</text>
<text x="558" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">Order of the stages</tspan>
</text>
<!-- Row 1: left cell -->
<text x="522" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">الأوضة ← المكتب ←</tspan>
  <tspan x="522" dy="40">العالم ← الجيب ←</tspan>
  <tspan x="522" dy="40">السحابة</tspan>
</text>
<text x="113" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">Room → Desk → World →</tspan>
  <tspan x="113" dy="40">Pocket → Cloud</tspan>
</text>

<!-- Row 2: right cell -->
<text x="962" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">البريد الإلكتروني</tspan>
  <tspan x="962" dy="40">والحاسب الشخصي</tspan>
</text>
<text x="558" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">Email and personal</tspan>
  <tspan x="558" dy="40">computers</tspan>
</text>
<!-- Row 2: left cell -->
<text x="522" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">ليسا تقنيتين ناشئتين</tspan>
</text>
<text x="113" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">Are not emerging</tspan>
  <tspan x="113" dy="40">technologies</tspan>
</text>

<!-- Row 3: right cell -->
<text x="962" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="962" dy="0">سؤال السحابة (6 درجات)</tspan>
</text>
<text x="558" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="558" dy="0">The cloud question</tspan>
  <tspan x="558" dy="40">(6 marks)</tspan>
</text>
<!-- Row 3: left cell -->
<text x="522" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="522" dy="0">اذكر: البيانات الضخمة،</tspan>
  <tspan x="522" dy="40">والذكاء الاصطناعي،</tspan>
  <tspan x="522" dy="40">وتكنولوجيا المعلومات</tspan>
  <tspan x="522" dy="40">كخدمة</tspan>
</text>
<text x="113" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="113" dy="0">Mention: big data,</tspan>
  <tspan x="113" dy="40">AI, and IT</tspan>
  <tspan x="113" dy="40">as a service</tspan>
</text>
