<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilScreenA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
  <linearGradient id="ilScreenB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#a9dcbe"/>
  </linearGradient>
</defs>

<!-- Card shadows -->
<rect x="109" y="128" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="528" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>

<!-- Success card -->
<rect x="105" y="122" width="870" height="368" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="138" width="6" height="336" rx="3" fill="#2e7d32"/>

<!-- Info card -->
<rect x="105" y="522" width="870" height="608" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="538" width="6" height="576" rx="3" fill="#2f7fb5"/>

<!-- Pyramids icon (Egypt) -->
<g transform="translate(470 130)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="46" cy="12" r="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="4,52 26,14 48,52" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="32,52 43,32 54,52" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <line x1="26" y1="14" x2="30" y2="52" stroke="#c96a1b" stroke-width="2.5"/>
</g>

<!-- Phone with check icon (instant payment) -->
<g transform="translate(866 380)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="8" y="2" width="32" height="52" rx="6" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="12" y="8" width="24" height="38" rx="2" fill="#4fc3e8"/>
  <circle cx="42" cy="40" r="11" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M37 40 L41 44 L48 35" fill="none" stroke="#ffffff" stroke-width="3"/>
</g>

<!-- Wallet icon (electronic money) -->
<g transform="translate(470 530)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="8" y="4" width="30" height="14" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="2" y="12" width="48" height="34" rx="6" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="30" y="22" width="22" height="14" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="38" cy="29" r="3" fill="#22303f"/>
</g>

<!-- QR icon -->
<g transform="translate(866 1062)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="0" y="0" width="52" height="52" rx="6" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="7" y="7" width="13" height="13" fill="#22303f"/>
  <rect x="32" y="7" width="13" height="13" fill="#22303f"/>
  <rect x="7" y="32" width="13" height="13" fill="#22303f"/>
  <rect x="25" y="25" width="6" height="6" fill="#22303f"/>
  <rect x="34" y="30" width="6" height="6" fill="#22303f"/>
  <rect x="39" y="39" width="6" height="6" fill="#22303f"/>
  <rect x="27" y="38" width="6" height="6" fill="#22303f"/>
</g>

<!-- Memory illustration: instant transfer between two phones -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="384" y="1156" width="56" height="90" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="644" y="1156" width="56" height="90" rx="10" fill="#22303f" opacity=".18"/>

  <rect x="380" y="1150" width="56" height="90" rx="10" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="386" y="1160" width="44" height="68" rx="3" fill="url(#ilScreenA)"/>
  <circle cx="408" cy="1186" r="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="394" y="1208" width="28" height="6" rx="3" fill="#2f7fb5"/>

  <rect x="640" y="1150" width="56" height="90" rx="10" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="646" y="1160" width="44" height="68" rx="3" fill="url(#ilScreenB)"/>
  <circle cx="668" cy="1188" r="12" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M662 1188 L667 1193 L675 1183" fill="none" stroke="#ffffff" stroke-width="3"/>

  <path d="M452 1192 Q540 1150 622 1192" fill="none" stroke="#2f7fb5" stroke-width="3"/>
  <polygon points="630,1198 612,1196 622,1182" fill="#2f7fb5" stroke="#2f7fb5" stroke-width="2.5"/>

  <polygon points="548,1184 530,1212 542,1212 534,1238 558,1204 546,1204 554,1184" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

  <circle cx="310" cy="1206" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="310" cy="1206" r="6" fill="#f0c48c"/>
  <circle cx="770" cy="1206" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="770" cy="1206" r="6" fill="#f0c48c"/>
</g>

<!-- Smile face -->
<g transform="translate(200 1198)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Star icon -->
<g transform="translate(842 1170)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text: Success card -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">من مصر</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">FROM EGYPT</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">أطلق <tspan font-weight="bold" fill="#17457f">البنك المركزي المصري</tspan> شبكة المدفوعات</tspan>
  <tspan x="935" dy="40">اللحظية (IPN) في 22 مارس 2022،</tspan>
  <tspan x="935" dy="40">ومن تطبيقاتها <tspan fill="#c96a1b">InstaPay.</tspan></tspan>
</text>

<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The <tspan font-weight="bold" fill="#17457f">Central Bank of Egypt</tspan> launched</tspan>
  <tspan x="140" dy="40">the Instant Payment Network (IPN) on</tspan>
  <tspan x="140" dy="40">March 22, 2022, and <tspan fill="#c96a1b">InstaPay</tspan> is one</tspan>
  <tspan x="140" dy="40">of its apps.</tspan>
</text>

<!-- Text: Info card -->
<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>

<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النقود الإلكترونية</tspan> — قيمة مالية مخزنة</tspan>
  <tspan x="935" dy="40">إلكترونيًا في بطاقة أو تطبيق،</tspan>
  <tspan x="935" dy="40">يُدفع بها بدلًا من النقد.</tspan>
</text>

<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">electronic money</tspan> — money value stored</tspan>
  <tspan x="140" dy="40">electronically on a card or in an app,</tspan>
  <tspan x="140" dy="40">used instead of cash.</tspan>
</text>

<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">رمز QR</tspan> — مربع من نقاط سوداء وبيضاء</tspan>
  <tspan x="935" dy="40">تقرؤه كاميرا الهاتف لتفتح معلومة،</tspan>
  <tspan x="935" dy="40">مثل رابط أو بيانات دفع.</tspan>
</text>

<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">QR code</tspan> — a square of black and white</tspan>
  <tspan x="140" dy="40">dots that a phone camera reads to open</tspan>
  <tspan x="140" dy="40">information, such as a link or payment</tspan>
  <tspan x="140" dy="40">details.</tspan>
</text>
</svg>
