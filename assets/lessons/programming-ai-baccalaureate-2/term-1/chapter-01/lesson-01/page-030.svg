<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilCardD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
  <linearGradient id="ilCardC" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>
  <linearGradient id="ilWallet" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a9dcbe"/>
    <stop offset="1" stop-color="#2e7d32"/>
  </linearGradient>
  <linearGradient id="ilJar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>

<!-- Table shadow and fill -->
<rect x="99" y="118" width="890" height="504" rx="12" fill="#22303f" opacity=".12"/>
<rect x="95" y="112" width="890" height="504" rx="12" fill="#fffdf7"/>

<!-- Table header row background -->
<rect x="95" y="112" width="890" height="108" rx="12" fill="#fdf6d8"/>
<rect x="95" y="166" width="890" height="54" fill="#fdf6d8"/>

<!-- Zebra row -->
<path d="M95 460 H985 V604 Q985 616 973 616 H107 Q95 616 95 604 Z" fill="#fbf6e9"/>

<!-- Table separators -->
<line x1="95" y1="220" x2="985" y2="220" stroke="#c0392b" stroke-width="1.4"/>
<line x1="95" y1="460" x2="985" y2="460" stroke="#c0392b" stroke-width="1.4"/>
<line x1="540" y1="112" x2="540" y2="616" stroke="#c0392b" stroke-width="1.4"/>

<!-- Table frame -->
<rect x="95" y="112" width="890" height="504" rx="12" fill="none" stroke="#c0392b" stroke-width="2"/>

<!-- Drawing shadows -->
<rect x="584" y="706" width="160" height="100" rx="12" fill="#22303f" opacity=".18"/>
<rect x="824" y="716" width="130" height="90" rx="14" fill="#22303f" opacity=".18"/>
<rect x="334" y="706" width="160" height="100" rx="12" fill="#22303f" opacity=".18"/>
<rect x="120" y="820" width="148" height="14" rx="3" fill="#22303f" opacity=".18"/>

<!-- Divider between the two sides -->
<line x1="540" y1="690" x2="540" y2="890" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>

<!-- Debit side: wallet with own money -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="832" y="690" width="70" height="36" rx="4" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <rect x="846" y="680" width="70" height="36" rx="4" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="881" cy="698" r="8" fill="#2e7d32"/>
  <rect x="820" y="710" width="130" height="90" rx="14" fill="url(#ilWallet)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="900" y="735" width="56" height="40" rx="10" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="918" cy="755" r="5" fill="#ffd24a"/>
  <circle cx="850" cy="822" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="850" cy="822" r="6" fill="#f0c48c"/>
  <circle cx="880" cy="826" r="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Debit side: debit card -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="580" y="700" width="160" height="100" rx="12" fill="url(#ilCardD)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="598" y="725" width="26" height="20" rx="3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="708" cy="725" r="9" fill="#ffd24a"/>
  <circle cx="722" cy="725" r="9" fill="#f0c48c" opacity=".85"/>
  <rect x="598" y="768" width="70" height="8" rx="4" fill="#dff1f7"/>
  <rect x="680" y="768" width="40" height="8" rx="4" fill="#dff1f7"/>
</g>

<!-- Debit arrow: wallet to card -->
<line x1="812" y1="750" x2="760" y2="750" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="746,750 762,740 762,760" fill="#c0392b"/>

<!-- Credit side: bank building -->
<g stroke-linecap="round" stroke-linejoin="round">
  <polygon points="112,722 190,676 268,722" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="190" cy="704" r="9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="124" y="722" width="132" height="12" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="136" y="734" width="16" height="80" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="166" y="734" width="16" height="80" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="198" y="734" width="16" height="80" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="228" y="734" width="16" height="80" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="116" y="814" width="148" height="14" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Credit side: credit card -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="330" y="700" width="160" height="100" rx="12" fill="url(#ilCardC)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="348" y="725" width="26" height="20" rx="3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="458" cy="725" r="9" fill="#ffffff"/>
  <circle cx="472" cy="725" r="9" fill="#ffd24a" opacity=".85"/>
  <rect x="348" y="768" width="70" height="8" rx="4" fill="#ffffff"/>
  <rect x="430" y="768" width="40" height="8" rx="4" fill="#ffffff"/>
</g>

<!-- Credit arrow: bank to card -->
<line x1="272" y1="740" x2="316" y2="740" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="328,740 312,730 312,750" fill="#c0392b"/>

<!-- Return arrow: user back to bank -->
<path d="M400 810 Q330 880 272 836" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="266,831 282,833 272,846" fill="#c0392b"/>

<!-- Calendar beside the return arrow -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="440" y="834" width="44" height="40" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="441" y="835" width="42" height="11" fill="#2f7fb5"/>
  <line x1="451" y1="828" x2="451" y2="840" stroke="#22303f" stroke-width="2.5"/>
  <line x1="473" y1="828" x2="473" y2="840" stroke="#22303f" stroke-width="2.5"/>
  <rect x="448" y="852" width="7" height="6" fill="#8fc9f2"/>
  <rect x="459" y="852" width="7" height="6" fill="#8fc9f2"/>
  <rect x="470" y="852" width="7" height="6" fill="#8fc9f2"/>
  <rect x="448" y="862" width="7" height="6" fill="#8fc9f2"/>
  <rect x="459" y="862" width="7" height="6" fill="#c96a1b"/>
</g>

<!-- Lower memory illustration: savings jar and coins -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="474" y="1074" width="140" height="172" rx="30" fill="#22303f" opacity=".18"/>
  <rect x="240" y="1240" width="600" height="10" rx="5" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>

  <rect x="470" y="1068" width="140" height="172" rx="30" fill="url(#ilJar)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="480" y="1046" width="120" height="24" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="520" y="1052" width="40" height="6" rx="3" fill="#22303f"/>
  <rect x="495" y="1100" width="90" height="28" rx="4" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1114" r="7" fill="#2e7d32"/>
  <circle cx="510" cy="1208" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="545" cy="1212" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="580" cy="1206" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="525" cy="1178" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="562" cy="1176" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1146" r="14" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1020" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1020" r="6" fill="#f0c48c"/>

  <ellipse cx="360" cy="1230" rx="34" ry="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="360" cy="1214" rx="34" ry="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="360" cy="1198" rx="34" ry="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="360" cy="1182" rx="34" ry="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="290" cy="1230" rx="30" ry="9" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="290" cy="1215" rx="30" ry="9" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>

  <rect x="684" y="1126" width="56" height="100" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="680" y="1120" width="56" height="100" rx="10" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="686" y="1130" width="44" height="78" rx="3" fill="#4fc3e8"/>
  <circle cx="708" cy="1168" r="13" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M701 1168 L706 1173 L715 1162" fill="none" stroke="#ffffff" stroke-width="3"/>

  <rect x="760" y="1166" width="110" height="70" rx="10" fill="url(#ilCardD)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="774" y="1184" width="20" height="16" rx="3" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="774" y="1214" width="60" height="7" rx="3" fill="#dff1f7"/>
</g>

<!-- Smile face -->
<g transform="translate(180 1150)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Star icon -->
<g transform="translate(872 1036)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text: table header row -->
<text x="960" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">بطاقة الخصم</text>

<text x="560" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">Debit card</text>

<text x="520" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">بطاقة الائتمان</text>

<text x="115" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#152b42">Credit card</text>

<!-- Text: row 1 -->
<text x="960" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="960" dy="0">تسحب من <tspan font-weight="bold" fill="#17457f">رصيدك</tspan> الموجود</tspan>
  <tspan x="960" dy="40">في البنك</tspan>
</text>

<text x="560" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="560" dy="0">Takes money from</tspan>
  <tspan x="560" dy="40">your <tspan font-weight="bold" fill="#17457f">bank balance</tspan></tspan>
</text>

<text x="520" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="520" dy="0">يدفع البنك عنك</tspan>
  <tspan x="520" dy="40"><tspan font-weight="bold" fill="#17457f">وتسدد</tspan> له لاحقًا</tspan>
</text>

<text x="115" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">The bank pays for</tspan>
  <tspan x="115" dy="40">you, and you <tspan font-weight="bold" fill="#17457f">repay</tspan></tspan>
  <tspan x="115" dy="40">it later</tspan>
</text>

<!-- Text: row 2 -->
<text x="960" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">«من جيبك»</text>

<text x="560" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">"From your pocket"</text>

<text x="520" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c"><tspan font-weight="bold" fill="#17457f">«سُلفة»</tspan><tspan> يجب سدادها</tspan></text>

<text x="115" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0"><tspan font-weight="bold" fill="#17457f">"A loan"</tspan> you must</tspan>
  <tspan x="115" dy="40">repay</tspan>
</text>

