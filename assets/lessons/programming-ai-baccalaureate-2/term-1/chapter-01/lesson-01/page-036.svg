<!-- ===== Text ===== -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الواقع المعزز</tspan>
  <tspan x="540" dy="48">والواقع الافتراضي</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Augmented Reality and Virtual Reality</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">&#x200F;AR بتضيف على الواقع… VR بتستبدل الواقع.</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">AR adds to reality… VR replaces reality.</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الواقع المعزز</tspan> (AR) — تقنية تضيف عناصر أو</tspan>
  <tspan x="935" dy="40">معلومات <tspan font-weight="bold" fill="#17457f">رقمية</tspan> فوق مشهد من العالم الحقيقي،</tspan>
  <tspan x="935" dy="40">وأنت ما زلت ترى عالمك.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">AR (Augmented Reality)</tspan> — a technology</tspan>
  <tspan x="140" dy="40">that adds <tspan font-weight="bold" fill="#17457f">digital</tspan> elements or</tspan>
  <tspan x="140" dy="40">information on top of a real-world</tspan>
  <tspan x="140" dy="40">scene, while you still see your world.</tspan>
</text>
</svg>
