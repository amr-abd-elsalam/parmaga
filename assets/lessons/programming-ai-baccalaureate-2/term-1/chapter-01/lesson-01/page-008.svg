<!-- Text: titles -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 2: المكتب —</tspan>
  <tspan x="540" dy="48">الكمبيوتر الشخصي</tspan>
</text>

<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">
  <tspan x="540" dy="0">Station 2: The Desk — The Personal Computer</tspan>
</text>

<!-- Text: intro paragraph -->
<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">في <tspan fill="#c96a1b">السبعينيات والثمانينيات</tspan> صار الكمبيوتر</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">صغيرًا ورخيصًا</tspan> ليوضع على مكتب.</tspan>
</text>

<text x="120"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In the <tspan fill="#c96a1b">1970s and 1980s,</tspan> the computer</tspan>
  <tspan x="120" dy="40">became <tspan font-weight="bold" fill="#17457f">small and cheap</tspan> enough for a desk.</tspan>
</text>

<!-- Text: Info card -->
<text x="935"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 2</tspan>
</text>

<text x="140"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 2 TERMS</tspan>
</text>

<text x="935"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الدائرة المتكاملة</tspan> (الشريحة) — قطعة صغيرة</tspan>
  <tspan x="935" dy="40">من السيليكون تضم عددًا هائلًا</tspan>
  <tspan x="935" dy="40">من <tspan font-weight="bold" fill="#17457f">الترانزستورات</tspan> وتوصيلاتها.</tspan>
</text>

<text x="140"
      y="714"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">integrated circuit</tspan> (chip) — a small</tspan>
  <tspan x="140" dy="40">piece of silicon containing a huge</tspan>
  <tspan x="140" dy="40">number of <tspan font-weight="bold" fill="#17457f">transistors</tspan></tspan>
  <tspan x="140" dy="40">and their connections.</tspan>
</text>

<text x="935"
      y="874"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الكمبيوتر الشخصي (PC)</tspan> — كمبيوتر <tspan font-weight="bold" fill="#17457f">يملكه فرد</tspan></tspan>
  <tspan x="935" dy="40">ويستخدمه وحده، بعد أن كان الكمبيوتر</tspan>
  <tspan x="935" dy="40">ملكًا للجيش والجامعات والشركات الكبرى.</tspan>
</text>

<text x="140"
      y="994"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">personal computer (PC)</tspan> — a computer</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">one person owns</tspan> and uses alone, after</tspan>
  <tspan x="140" dy="40">computers had belonged to armies,</tspan>
  <tspan x="140" dy="40">universities, and large companies.</tspan>
</text>
</svg>
