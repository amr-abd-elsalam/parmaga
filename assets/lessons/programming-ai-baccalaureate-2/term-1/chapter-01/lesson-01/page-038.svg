<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilCoin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#f0c48c"/>
  </linearGradient>
  <radialGradient id="ilSphere" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </radialGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadow and card -->
<rect x="109" y="288" width="870" height="848" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="282" width="870" height="848" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="298" width="6" height="816" rx="3" fill="#2f7fb5"/>

<!-- Title-side face (surprise) -->
<g transform="translate(190 160)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Title-side coin icon -->
<g transform="translate(862 132)">
  <circle cx="28" cy="28" r="24" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="28" r="15" fill="none" stroke="#c96a1b" stroke-width="2.5"/>
  <path d="M 0 14 Q -6 28 0 42" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 56 14 Q 62 28 56 42" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Card header icons: open book and chip -->
<g transform="translate(392 292)">
  <path d="M 2 10 Q 14 4 26 10 L 26 46 Q 14 40 2 46 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 26 10 Q 38 4 50 10 L 50 46 Q 38 40 26 46 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="20" x2="20" y2="18" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="30" x2="20" y2="28" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="44" y2="20" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="44" y2="30" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g transform="translate(560 292)">
  <line x1="18" y1="2" x2="18" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="2" x2="26" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="2" x2="34" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="42" x2="18" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="42" x2="26" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="42" x2="34" y2="50" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="18" x2="10" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="34" x2="10" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="18" x2="50" y2="18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="34" x2="50" y2="34" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="10" y="10" width="32" height="32" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="18" y="18" width="16" height="16" rx="3" fill="#4fc3e8"/>
</g>

<!-- Memory illustration: bit switch, spinning coin, qubit sphere -->
<g>
  <!-- light switch -->
  <rect x="214" y="1162" width="64" height="92" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="210" y="1156" width="64" height="92" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="228" y="1172" width="28" height="60" rx="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="228" y="1172" width="28" height="30" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="242" cy="1164" r="3" fill="#7f95ab"/>
  <circle cx="242" cy="1240" r="3" fill="#7f95ab"/>
  <path d="M 274 1224 Q 300 1242 328 1228" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- bulb -->
  <circle cx="340" cy="1188" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="328" y="1212" width="24" height="20" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="330" y1="1222" x2="350" y2="1222" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="304" y1="1166" x2="296" y2="1158" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="376" y1="1166" x2="384" y2="1158" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="300" y1="1192" x2="290" y2="1192" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="380" y1="1192" x2="390" y2="1192" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <path transform="translate(150 1200)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>

  <!-- spinning coin -->
  <ellipse cx="540" cy="1252" rx="54" ry="7" fill="#22303f" opacity=".18"/>
  <path d="M 462 1158 Q 446 1196 462 1234" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M 618 1158 Q 634 1196 618 1234" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M 486 1168 Q 474 1196 486 1224" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 594 1168 Q 606 1196 594 1224" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="546" cy="1196" rx="28" ry="44" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="540" cy="1196" rx="28" ry="44" fill="url(#ilCoin)" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="540" cy="1196" rx="16" ry="30" fill="none" stroke="#c96a1b" stroke-width="2.5"/>
  <path transform="translate(650 1162)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path transform="translate(432 1236)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>

  <!-- qubit sphere -->
  <circle cx="794" cy="1206" r="48" fill="#22303f" opacity=".18"/>
  <circle cx="790" cy="1200" r="48" fill="url(#ilSphere)" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="790" cy="1200" rx="48" ry="14" fill="none" stroke="#2f7fb5" stroke-width="2.5"/>
  <ellipse cx="790" cy="1200" rx="16" ry="48" fill="none" stroke="#2f7fb5" stroke-width="2.5" opacity=".6"/>
  <circle cx="790" cy="1152" r="5" fill="#17457f"/>
  <circle cx="790" cy="1248" r="5" fill="#c96a1b"/>
  <line x1="790" y1="1200" x2="818" y2="1170" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="826,1162 823,1176 813,1166" fill="#c0392b"/>
  <circle cx="790" cy="1200" r="4" fill="#22303f"/>
  <path transform="translate(890 1170)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <path transform="translate(700 1240)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">الحوسبة الكمومية:</tspan>
  <tspan x="540" dy="48">عملة تدور في الهواء</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">Quantum Computing:</tspan>
  <tspan x="540" dy="36">A Coin Spinning in the Air</tspan>
</text>

<!-- Card header -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Term 1 -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">ميكانيكا الكم</tspan> — فرع من الفيزياء يدرس سلوك</tspan>
  <tspan x="935" dy="40">الأشياء الصغيرة جدًا كالإلكترونات والذرات.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">quantum mechanics</tspan> — a branch of</tspan>
  <tspan x="140" dy="40">physics that studies how very</tspan>
  <tspan x="140" dy="40">small things, such as electrons and</tspan>
  <tspan x="140" dy="40">atoms, behave.</tspan>
</text>

<!-- Term 2 -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البت</tspan> — أصغر وحدة معلومات في الكمبيوتر</tspan>
  <tspan x="935" dy="40">التقليدي، قيمته <tspan fill="#c96a1b">0 أو 1،</tspan> كمفتاح نور.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">bit</tspan> — the smallest unit of information</tspan>
  <tspan x="140" dy="40">in a traditional computer: <tspan fill="#c96a1b">0 or 1,</tspan></tspan>
  <tspan x="140" dy="40">like a light switch.</tspan>
</text>

<!-- Term 3 -->
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الكيوبت</tspan> (Qubit) — وحدة المعلومات في</tspan>
  <tspan x="935" dy="40">الكمبيوتر الكمومي، ويمكن أن يكون في مزيج</tspan>
  <tspan x="935" dy="40">من 0 و1 معًا، لكنه عند القياس</tspan>
  <tspan x="935" dy="40">يعطي <tspan font-weight="bold" fill="#17457f">نتيجة واحدة.</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">qubit</tspan> — the unit of information in a</tspan>
  <tspan x="140" dy="40">quantum computer; it can be in a</tspan>
  <tspan x="140" dy="40">combination of 0 and 1 together, but</tspan>
  <tspan x="140" dy="40">when measured it gives <tspan font-weight="bold" fill="#17457f">one result.</tspan></tspan>
</text>
</svg>
