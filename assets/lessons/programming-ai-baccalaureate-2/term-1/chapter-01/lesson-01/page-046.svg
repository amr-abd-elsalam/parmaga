<line x1="810" y1="1110" x2="824" y2="1124" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>

<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">أنشطة الباحث الصغير</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Young Researcher Activities</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الهدف من هذا الدرس أن <tspan font-weight="bold" fill="#17457f">تبحث وتفكر،</tspan></tspan>
  <tspan x="950" dy="40">لا أن تحفظ فقط. جرّب هذه الأنشطة:</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The goal of this lesson is to <tspan font-weight="bold" fill="#17457f">research</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">think,</tspan> not just memorize.</tspan>
  <tspan x="120" dy="40">Try these activities:</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">1 مقابلة مع العيلة</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">1 Interview your family</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اسأل أحد والديك أو أجدادك:</tspan>
  <tspan x="950" dy="40">كيف كنت تدفع <tspan fill="#c96a1b">الفواتير،</tspan> وتبحث عن <tspan fill="#c96a1b">معلومة،</tspan></tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">وتراسل</tspan> أحدًا عندما كنت في عمري؟</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Ask one of your parents or grandparents:</tspan>
  <tspan x="120" dy="40">How did you pay <tspan fill="#c96a1b">bills,</tspan> look up</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">information,</tspan> and <tspan fill="#c96a1b">message</tspan> someone when</tspan>
  <tspan x="120" dy="40">you were my age?</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">ثم ضع كل إجابة في محطة من <tspan font-weight="bold" fill="#17457f">المحطات الخمس.</tspan></text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Then place each answer in one of</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#17457f">five stations.</tspan></tspan>
</text>
</svg>
