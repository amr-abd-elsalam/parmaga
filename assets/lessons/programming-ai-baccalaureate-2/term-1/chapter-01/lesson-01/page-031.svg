<!-- Page titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">التقنيات الناشئة:</tspan>
  <tspan x="540" dy="48">القيادة الذاتية</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Emerging Technologies: Autonomous Driving</text>

<!-- Info card text -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التقنية الناشئة</tspan> — تقنية جديدة نسبيًا</tspan>
  <tspan x="935" dy="40">ما زالت تتطور ولم تنتشر بالكامل،</tspan>
  <tspan x="935" dy="40">ويُتوقع أن يكون لها <tspan font-weight="bold" fill="#17457f">أثر كبير.</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">emerging technology</tspan> — a relatively</tspan>
  <tspan x="140" dy="40">new technology that is still</tspan>
  <tspan x="140" dy="40">developing, has not fully spread, and</tspan>
  <tspan x="140" dy="40">is expected to have a <tspan font-weight="bold" fill="#17457f">big impact.</tspan></tspan>
</text>

<!-- Warning card text -->
<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لذلك <tspan fill="#c96a1b">البريد الإلكتروني</tspan> <tspan fill="#c96a1b">والحاسب الشخصي</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">ليسا</tspan> تقنيتين ناشئتين،</tspan>
  <tspan x="935" dy="40">فهما منتشران منذ عقود.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">So <tspan fill="#c96a1b">email</tspan> and <tspan fill="#c96a1b">personal computers</tspan> are</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">not</tspan> emerging technologies; they have</tspan>
  <tspan x="140" dy="40">been widespread for decades.</tspan>
</text>
</svg>
