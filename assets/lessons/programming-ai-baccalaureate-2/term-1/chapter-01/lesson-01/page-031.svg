  <rect x="914" y="1098" width="12" height="14" fill="#dff1f7"/>
  <rect x="914" y="1128" width="12" height="14" fill="#dff1f7"/>
  <!-- tree -->
  <rect x="326" y="1128" width="8" height="42" fill="#7d4f28"/>
  <circle cx="330" cy="1114" r="26" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <!-- road -->
  <path d="M 105 1170 L 975 1170 L 975 1222 Q 975 1246 951 1246 L 129 1246 Q 105 1246 105 1222 Z" fill="#7f95ab"/>
