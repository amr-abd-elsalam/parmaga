    <path d="M 0 24 C -6 14 -18 4 -18 -8 C -18 -18 -10 -26 0 -26 C 10 -26 18 -18 18 -8 C 18 4 6 14 0 24 Z" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
