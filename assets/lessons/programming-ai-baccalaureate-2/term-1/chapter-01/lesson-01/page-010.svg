</text>

<!-- Text: caption -->
<text x="950"
      y="1034"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البريد الإلكتروني</tspan> يسير على الطرق،</tspan>
  <tspan x="950" dy="40">لكنه ليس محلًا.</tspan>
</text>

<text x="120"
      y="1114"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Email</tspan> travels on the roads,</tspan>
  <tspan x="120" dy="40">but it is not a shop.</tspan>
</text>
