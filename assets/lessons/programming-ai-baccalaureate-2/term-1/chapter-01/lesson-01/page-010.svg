<!-- Text: titles -->
<text x="540"
      y="116"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="44"
      font-weight="bold"
      fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 3: العالم —</tspan>
  <tspan x="540" dy="48">الإنترنت ليس هو الويب!</tspan>
</text>

<text x="540"
      y="202"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="middle"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="28"
      font-weight="normal"
      fill="#152b42">
  <tspan x="540" dy="0">Station 3: The World —</tspan>
  <tspan x="540" dy="36">The Internet Is Not the Web!</tspan>
</text>

<!-- Text: paragraph -->
<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">في التسعينيات أُتيح <tspan font-weight="bold" fill="#c0392b">الإنترنت</tspan> تجاريًا</tspan>
  <tspan x="950" dy="40">وظهر <tspan font-weight="bold" fill="#c0392b">الويب.</tspan></tspan>
</text>

<text x="120"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In the 1990s, the <tspan font-weight="bold" fill="#c0392b">Internet</tspan> became</tspan>
  <tspan x="120" dy="40">commercial and the <tspan font-weight="bold" fill="#c0392b">Web</tspan> appeared.</tspan>
</text>

<!-- Text: key sentence strip -->
<text x="935"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">الإنترنت = شبكة الطرق والكباري.</tspan>
  <tspan x="935" dy="40">الويب = المحلات اللي على الطريق.</tspan>
</text>

<text x="140"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">The Internet = the network</tspan>
  <tspan x="140" dy="40">of roads and bridges.</tspan>
  <tspan x="140" dy="40">The Web = the shops along the road.</tspan>
</text>

<!-- Text: illustration labels -->
<text x="935"
