<!-- ===== Text ===== -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الواقع الافتراضي</tspan> (VR) — تقنية تضع</tspan>
  <tspan x="935" dy="40">المستخدم داخل <tspan font-weight="bold" fill="#17457f">بيئة رقمية</tspan> كاملة يولّدها</tspan>
  <tspan x="935" dy="40">الكمبيوتر، غالبًا بنظارة تغطي العينين،</tspan>
  <tspan x="935" dy="40">فيختفي العالم الحقيقي.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">VR (Virtual Reality)</tspan> — a technology</tspan>
  <tspan x="140" dy="40">that places the user inside a complete</tspan>
  <tspan x="140" dy="40">computer-generated <tspan font-weight="bold" fill="#17457f">digital world,</tspan></tspan>
  <tspan x="140" dy="40">usually with a headset covering the</tspan>
  <tspan x="140" dy="40">eyes, so the real world disappears.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">حيلة الحفظ:</tspan> AR = Add (يضيف)،</tspan>
  <tspan x="935" dy="40">وVR = Virtual (يستبدل).</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Memory trick:</tspan> AR = Add,</tspan>
  <tspan x="140" dy="40">and VR = Replace.</tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أيهما؟</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">WHICH ONE?</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لعبة على الهاتف تُظهر شخصيات كرتونية</tspan>
  <tspan x="935" dy="40">في شارعك الحقيقي: AR أم VR؟</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A phone game that shows cartoon</tspan>
  <tspan x="140" dy="40">characters on your real street:</tspan>
  <tspan x="140" dy="40">AR or VR?</tspan>
</text>
</svg>
