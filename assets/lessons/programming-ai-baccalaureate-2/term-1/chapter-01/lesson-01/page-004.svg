<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">رحلة الكمبيوتر في خمس محطات</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Computer's Journey in Five Stations</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">احفظ الجملة دي وهتفتكر <tspan font-weight="bold" fill="#17457f">ترتيب المراحل</tspan><tspan> دائمًا:</tspan></text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Memorize this sentence to always</tspan>
  <tspan x="120" dy="40">remember the <tspan font-weight="bold" fill="#17457f">order:</tspan></tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">الكمبيوتر ساب الأوضة، وقعد على المكتب،</tspan>
  <tspan x="935" dy="40">واتوصّل بالعالم، ودخل جيبك، وطار للسحابة.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The computer left the room,</tspan>
  <tspan x="140" dy="40">sat on the desk, connected to the world,</tspan>
  <tspan x="140" dy="40">entered your pocket,</tspan>
  <tspan x="140" dy="40">and flew to the cloud.</tspan>
</text>

<text x="918" y="918" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">الأوضة</text>
<text x="813" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">The room</text>
<text x="743" y="918" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">المكتب</text>
<text x="638" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">The desk</text>
<text x="573" y="918" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">العالم</text>
<text x="460" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">The world</text>
<text x="401" y="918" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">الجيب</text>
<text x="287" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">The pocket</text>
<text x="250" y="918" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">السحابة</text>
<text x="130" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">The cloud</text>

<text x="950" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كل محطة <tspan font-weight="bold" fill="#17457f">أصغر حجمًا</tspan> <tspan font-weight="bold" fill="#17457f">وأكثر اتصالًا</tspan></tspan>
  <tspan x="950" dy="40">من التي قبلها.</tspan>
</text>
<text x="120" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Each station is <tspan font-weight="bold" fill="#17457f">smaller</tspan></tspan>
  <tspan x="120" dy="40">and <tspan font-weight="bold" fill="#17457f">more connected</tspan> than the one before.</tspan>
</text>
</svg>
