  <line x1="548" y1="730" x2="492" y2="698" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="548" y1="730" x2="600" y2="686" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="492" y1="698" x2="498" y2="760" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
