  <circle cx="600" cy="686" r="6" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <rect x="545" y="770" width="6" height="30" fill="#7f95ab"/>
  <ellipse cx="548" cy="804" rx="24" ry="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="548" cy="730" r="40" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M526 706 Q540 698 548 712 Q542 726 528 722 Z" fill="#2f7fb5"/>
  <path d="M556 736 Q572 730 578 746 Q566 762 554 752 Z" fill="#2f7fb5"/>
  <ellipse cx="548" cy="730" rx="18" ry="40" fill="none" stroke="#17457f" stroke-width="2"/>
  <line x1="508" y1="730" x2="588" y2="730" stroke="#17457f" stroke-width="2" stroke-linecap="round"/>
  <rect x="476" y="760" width="44" height="34" rx="4" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <rect x="481" y="765" width="34" height="22" rx="2" fill="#4fc3e8"/>
  <rect x="492" y="794" width="12" height="8" fill="#7f95ab"/>
  <rect x="486" y="802" width="24" height="6" rx="2" fill="#7f95ab"/>

  <!-- Station 4: smartphone in a jeans pocket -->
  <rect x="314" y="724" width="102" height="110" rx="10" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="344" y="700" width="40" height="72" rx="7" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="349" y="708" width="30" height="40" rx="2" fill="#4fc3e8"/>
  <path d="M322 746 Q365 766 408 746 L404 818 Q365 838 326 818 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M332 760 Q365 776 398 760" fill="none" stroke="#f0c48c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <circle cx="326" cy="750" r="3" fill="#ffd24a"/>
  <circle cx="404" cy="750" r="3" fill="#ffd24a"/>

  <!-- Station 5: cloud above a laptop and a phone -->
  <path d="M150 716 Q146 690 172 690 Q178 664 206 668 Q228 654 244 676 Q268 676 266 700 Q266 716 248 716 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="180" y1="720" x2="176" y2="766" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
  <line x1="232" y1="720" x2="240" y2="768" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
  <rect x="156" y="772" width="40" height="26" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="160" y="776" width="32" height="18" rx="2" fill="#4fc3e8"/>
  <polygon points="150,798 202,798 208,806 144,806" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="226" y="776" width="22" height="34" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="230" y="781" width="14" height="22" rx="2" fill="#4fc3e8"/>

  <!-- Arrows in reading order (right to left) -->
  <line x1="794" y1="846" x2="774" y2="846" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="764,846 776,839 776,853" fill="#c0392b"/>
  <line x1="632" y1="846" x2="606" y2="846" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="596,846 608,839 608,853" fill="#c0392b"/>
  <line x1="466" y1="846" x2="442" y2="846" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="432,846 444,839 444,853" fill="#c0392b"/>
  <line x1="306" y1="846" x2="282" y2="846" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="272,846 284,839 284,853" fill="#c0392b"/>
</g>

<!-- Bottom icon group -->
<g>
  <line x1="430" y1="1196" x2="430" y2="1248" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="450" y1="1196" x2="450" y2="1248" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="414" y1="1212" x2="466" y2="1212" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="414" y1="1232" x2="466" y2="1232" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="420" y="1202" width="40" height="40" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="430" y="1212" width="20" height="20" rx="2" fill="#4fc3e8"/>

  <line x1="516" y1="1240" x2="540" y2="1202" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540" y1="1202" x2="564" y2="1236" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="516" y1="1240" x2="564" y2="1236" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="516" cy="1240" r="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1202" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="564" cy="1236" r="8" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>

  <path d="M616 1238 Q604 1222 622 1214 Q626 1198 644 1200 Q660 1194 664 1212 Q676 1214 672 1228 Q670 1238 658 1238 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
