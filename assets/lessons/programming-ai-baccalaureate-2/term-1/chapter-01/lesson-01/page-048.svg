<polygon points="432,1162 445,1155 445,1169" fill="#c0392b"/>
<line x1="297" y1="1162" x2="269" y2="1162" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="257,1162 270,1155 270,1169" fill="#c0392b"/>

<!-- Icon: stopwatch (half filled) -->
<g transform="translate(140 80)">
  <rect x="27" y="4" width="10" height="8" rx="2" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
