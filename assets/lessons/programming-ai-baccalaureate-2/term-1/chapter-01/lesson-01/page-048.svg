  <line x1="32" y1="38" x2="32" y2="22" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="3.5" fill="#22303f"/>
</g>

<!-- Icon: check badge -->
<g transform="translate(876 82)">
  <circle cx="32" cy="32" r="26" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M20 33 L29 42 L45 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Medallion 1: the room (ENIAC) -->
<g transform="translate(890 1162)">
  <circle cx="0" cy="0" r="62" fill="url(#ilMed)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-42" y="-30" width="84" height="56" rx="4" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="-14" y1="-30" x2="-14" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="-30" x2="14" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="-28" cy="-16" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="-28" cy="0" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="0" cy="-16" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="0" cy="0" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="28" cy="-16" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="28" cy="0" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="-36" y="11" width="16" height="8" rx="2" fill="#e8dfd1"/>
  <rect x="-8" y="11" width="16" height="8" rx="2" fill="#e8dfd1"/>
  <rect x="20" y="11" width="16" height="8" rx="2" fill="#e8dfd1"/>
  <line x1="-48" y1="33" x2="48" y2="33" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Medallion 2: the desk (PC) -->
<g transform="translate(715 1162)">
  <circle cx="0" cy="0" r="62" fill="url(#ilMed)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-30" y="-34" width="60" height="40" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-25" y="-29" width="50" height="30" rx="2" fill="#4fc3e8"/>
  <rect x="-5" y="6" width="10" height="10" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-44" y="16" width="88" height="9" rx="3" fill="#b07a45" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-38" y="25" width="6" height="14" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="32" y="25" width="6" height="14" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Medallion 3: the world (Internet) -->
<g transform="translate(540 1162)">
  <circle cx="0" cy="0" r="62" fill="url(#ilMed)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="38" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M-28 -18 Q -14 -30 -4 -20 Q 2 -8 -10 -2 Q -22 2 -28 -18 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M6 6 Q 22 0 28 12 Q 22 28 10 24 Q 2 16 6 6 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="0" cy="0" rx="16" ry="38" fill="none" stroke="#22303f" stroke-width="2.5"/>
  <line x1="-38" y1="0" x2="38" y2="0" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Medallion 4: the pocket (smartphone) -->
<g transform="translate(365 1162)">
  <circle cx="0" cy="0" r="62" fill="url(#ilMed)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-19" y="-38" width="38" height="76" rx="8" fill="#22303f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-14" y="-30" width="28" height="56" rx="3" fill="#4fc3e8"/>
  <circle cx="0" cy="32" r="2.5" fill="#ffffff"/>
  <path d="M26 -26 Q 34 -18 26 -10" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 -32 Q 44 -18 32 -4" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Medallion 5: the cloud -->
<g transform="translate(190 1162)">
  <circle cx="0" cy="0" r="62" fill="url(#ilMed)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="-20" y1="10" x2="-20" y2="24" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="10" x2="0" y2="28" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="10" x2="20" y2="24" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M-34 10 Q -46 10 -44 -4 Q -42 -16 -28 -14 Q -24 -32 -4 -30 Q 12 -40 24 -24 Q 42 -24 42 -6 Q 46 10 30 10 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="-20" cy="30" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <circle cx="0" cy="34" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <circle cx="20" cy="30" r="6" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">الخلاصة في 30 ثانية</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">The Summary in 30 Seconds</text>

<!-- Card header -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">للمراجعة ليلة الامتحان</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">NIGHT-BEFORE-THE-EXAM REVIEW</text>

<!-- Paragraph 1 -->
<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الأوضة:</tspan> ENIAC، صمامات مفرغة،</tspan>
  <tspan x="935" dy="40">أغراض عسكرية وعلمية.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The room:</tspan> ENIAC, vacuum tubes,</tspan>
  <tspan x="140" dy="40">military and scientific use.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">المكتب:</tspan> الحاسب الشخصي،</tspan>
  <tspan x="935" dy="40">والأفراد بدأوا يستخدمونه.</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The desk:</tspan> the PC; individuals</tspan>
  <tspan x="140" dy="40">started using computers.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">العالم:</tspan> إنترنت تجاري،</tspan>
  <tspan x="935" dy="40">وويب، وبريد إلكتروني.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The world:</tspan> the commercial Internet,</tspan>
  <tspan x="140" dy="40">the Web, and email.</tspan>
</text>

<!-- Paragraph 4 -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الجيب:</tspan> هاتف ذكي وإنترنت محمول.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The pocket:</tspan> smartphones</tspan>
  <tspan x="140" dy="40">and mobile Internet.</tspan>
</text>

<!-- Paragraph 5 -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">السحابة:</tspan> بيانات ضخمة،</tspan>
  <tspan x="935" dy="40">وذكاء اصطناعي، وتقنية كخدمة.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">The cloud:</tspan> big data, AI,</tspan>
  <tspan x="140" dy="40">and IT as a service.</tspan>
</text>
</svg>
