<!-- Key sentence strip text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">السحابة = مكالمة لمستشار بعيد.</tspan>
  <tspan x="935" dy="40">الطرفية = رد فعل إيدك لما تلمس حاجة سخنة.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The cloud = a call to a faraway</tspan>
  <tspan x="140" dy="40">advisor. Edge = your hand's reflex</tspan>
  <tspan x="140" dy="40">when you touch something hot.</tspan>
</text>

<!-- Info card header -->
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<!-- Term 1 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الحوسبة الطرفية</tspan> — معالجة البيانات</tspan>
  <tspan x="935" dy="40">قريبًا من مكان إنتاجها، على الجهاز نفسه</tspan>
  <tspan x="935" dy="40">أو بجانبه، بدلًا من إرسالها كلها</tspan>
  <tspan x="935" dy="40">إلى السحابة، لتقليل <tspan font-weight="bold" fill="#17457f">زمن الاستجابة.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">edge computing</tspan> — processing data</tspan>
  <tspan x="140" dy="40">close to where it is produced, on the</tspan>
  <tspan x="140" dy="40">device itself or near it, instead of</tspan>
  <tspan x="140" dy="40">sending all of it to the cloud,</tspan>
  <tspan x="140" dy="40">to reduce <tspan font-weight="bold" fill="#17457f">response time.</tspan></tspan>
</text>

<!-- Term 2 -->
<text x="935" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">زمن الاستجابة</tspan> (Latency) — الوقت بين</tspan>
  <tspan x="935" dy="40">إرسال البيانات ووصول الرد.</tspan>
  <tspan x="935" dy="40">في الألعاب الإلكترونية تسميه <tspan fill="#c96a1b">«البينج»!</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">latency</tspan> — the time between sending</tspan>
  <tspan x="140" dy="40">data and receiving the reply.</tspan>
  <tspan x="140" dy="40">In online games, you call it <tspan fill="#c96a1b">"ping"!</tspan></tspan>
</text>
</svg>
