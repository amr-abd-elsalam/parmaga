<!-- Text: Caption -->
<text x="950"
      y="554"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">لأول مرة، صار للفرد <tspan font-weight="bold" fill="#17457f">كمبيوتر شخصي.</tspan></tspan>
</text>

<text x="120"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">For the first time, an individual had</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">a computer of their own.</tspan></tspan>
</text>

<!-- Text: Outlined box -->
<text x="935"
      y="714"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">فكّر</tspan>
</text>

<text x="140"
      y="754"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">THINK</tspan>
</text>

<text x="935"
      y="794"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">لماذا تعتقد أن <tspan font-weight="bold" fill="#17457f">صِغَر الكمبيوتر ورخصه</tspan></tspan>
  <tspan x="935" dy="40">غيّرا المجتمع أكثر من سرعته؟</tspan>
</text>

<text x="140"
      y="874"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Why do you think the computer</tspan>
  <tspan x="140" dy="40">becoming <tspan font-weight="bold" fill="#17457f">small and cheap</tspan> changed</tspan>
  <tspan x="140" dy="40">society more than its speed did?</tspan>
</text>
