  <text x="540" y="148"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44" font-weight="bold" fill="#16355c">الواقع المعزز والواقع الافتراضي</text>

  <text x="540" y="196"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30" fill="#2f5077">Augmented Reality and Virtual Reality</text>

  <text x="965" y="296"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31" font-weight="bold" fill="#c62828">الواقع المعزز</text>

  <text x="565" y="334"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23" font-weight="bold" fill="#c62828">Augmented Reality – AR</text>

  <text x="965" y="386"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28" fill="#1d5c9e">
    <tspan x="965" dy="0">يضيف معلومات أو عناصر</tspan>
    <tspan x="965" dy="38">رقمية إلى صور العالم</tspan>
    <tspan x="965" dy="38">الحقيقي.</tspan>
  </text>

  <text x="565" y="516"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23" font-weight="bold" fill="#c62828">Augmented Reality – AR</text>

  <text x="565" y="556"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="565" dy="0">Overlays digital information</tspan>
    <tspan x="565" dy="32">or elements on images of</tspan>
    <tspan x="565" dy="32">the real world.</tspan>
  </text>

  <text x="520" y="296"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31" font-weight="bold" fill="#c62828">الواقع الافتراضي</text>

  <text x="112" y="334"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23" font-weight="bold" fill="#c62828">Virtual Reality – VR</text>

  <text x="520" y="386"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28" fill="#1d5c9e">
    <tspan x="520" dy="0">يتيح للمستخدم الانغماس</tspan>
    <tspan x="520" dy="38">في مساحة افتراضية ينشئها</tspan>
    <tspan x="520" dy="38">الحاسوب.</tspan>
  </text>

  <text x="112" y="516"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23" font-weight="bold" fill="#c62828">Virtual Reality – VR</text>

  <text x="112" y="556"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="112" dy="0">Allows users to immerse</tspan>
    <tspan x="112" dy="32">themselves in a virtual space</tspan>
    <tspan x="112" dy="32">generated by a computer.</tspan>
  </text>

  <text x="960" y="912"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28" fill="#1d5c9e">
    <tspan x="960" dy="0">الواقع المعزز يضيف إلى العالم الحقيقي، بينما ينقل</tspan>
    <tspan x="960" dy="38">الواقع الافتراضي المستخدم إلى بيئة افتراضية.</tspan>
  </text>

  <text x="120" y="1010"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23" fill="#152b42">
    <tspan x="120" dy="0">AR adds to the real world, while VR places the</tspan>
    <tspan x="120" dy="32">user inside a virtual environment.</tspan>
  </text>

</svg>
