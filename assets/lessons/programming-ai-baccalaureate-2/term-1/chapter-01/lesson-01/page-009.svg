  <line x1="540" y1="252" x2="540" y2="838" stroke="#c62828" stroke-width="1.8" opacity="0.85"/>
  <line x1="300" y1="222" x2="780" y2="222" stroke="#c62828" stroke-width="2" opacity="0.8"/>

  <g stroke="#1f3b57" fill="none" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <line x1="600" y1="824" x2="928" y2="824" stroke="#a9b7c4" stroke-width="2"/>
    <rect x="646" y="788" width="10" height="36" fill="#a9754a" stroke="#8a5c37" stroke-width="1.5"/>
    <circle cx="651" cy="776" r="24" fill="#cfe3cf" stroke="#7fa88a" stroke-width="2"/>
    <rect x="712" y="656" width="104" height="164" rx="14" fill="#fffdf7"/>
    <rect x="722" y="674" width="84" height="128" fill="#eaf3fb" stroke="#9dbcd6" stroke-width="1.5"/>
