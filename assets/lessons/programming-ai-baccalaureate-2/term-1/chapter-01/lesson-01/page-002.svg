<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98450"/>
      <stop offset="0.55" stop-color="#a06f3f"/>
      <stop offset="1" stop-color="#835730"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf7ea"/>
    </linearGradient>
  </defs>

  <!-- 1. Simple warm background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0,240 C300,190 780,300 1080,235" stroke="#6d4522" stroke-width="16" fill="none" opacity="0.10"/>
  <path d="M0,1120 C320,1075 760,1180 1080,1110" stroke="#6d4522" stroke-width="14" fill="none" opacity="0.09"/>

  <!-- 2. Paper -->
  <rect x="42" y="34" width="1012" height="1298" rx="8" fill="#5b3a1c" opacity="0.22"/>
  <rect x="34" y="26" width="1012" height="1298" rx="8" fill="url(#paperGrad)"/>

  <!-- 3. Pale horizontal notebook lines -->
  <g stroke="#bfd8ec" stroke-width="1.2" opacity="0.85">
    <line x1="80" y1="170" x2="1000" y2="170"/>
    <line x1="80" y1="212" x2="1000" y2="212"/>
    <line x1="80" y1="254" x2="1000" y2="254"/>
    <line x1="80" y1="296" x2="1000" y2="296"/>
    <line x1="80" y1="338" x2="1000" y2="338"/>
    <line x1="80" y1="380" x2="1000" y2="380"/>
    <line x1="80" y1="422" x2="1000" y2="422"/>
    <line x1="80" y1="464" x2="1000" y2="464"/>
    <line x1="80" y1="506" x2="1000" y2="506"/>
    <line x1="80" y1="548" x2="1000" y2="548"/>
    <line x1="80" y1="590" x2="1000" y2="590"/>
    <line x1="80" y1="632" x2="1000" y2="632"/>
    <line x1="80" y1="674" x2="1000" y2="674"/>
    <line x1="80" y1="716" x2="1000" y2="716"/>
    <line x1="80" y1="758" x2="1000" y2="758"/>
    <line x1="80" y1="800" x2="1000" y2="800"/>
    <line x1="80" y1="842" x2="1000" y2="842"/>
    <line x1="80" y1="884" x2="1000" y2="884"/>
    <line x1="80" y1="926" x2="1000" y2="926"/>
    <line x1="80" y1="968" x2="1000" y2="968"/>
    <line x1="80" y1="1010" x2="1000" y2="1010"/>
    <line x1="80" y1="1052" x2="1000" y2="1052"/>
    <line x1="80" y1="1094" x2="1000" y2="1094"/>
    <line x1="80" y1="1136" x2="1000" y2="1136"/>
  </g>

  <!-- 4. Single thin outer red border -->
  <rect x="67" y="62" width="946" height="1238" fill="none" stroke="#c62828" stroke-width="2.6"/>

  <!-- 5. Card background (question box) -->
  <rect x="100" y="984" width="880" height="182" rx="14" fill="#fdf5d4" stroke="#dcc169" stroke-width="2"/>

  <!-- 6. Functional drawing: student and icons -->
  <g stroke="#8fb3cf" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity="0.9">
    <line x1="240" y1="870" x2="320" y2="870"/>
    <line x1="406" y1="870" x2="498" y2="870"/>
    <line x1="582" y1="870" x2="684" y2="870"/>
    <line x1="764" y1="870" x2="836" y2="870"/>
  </g>

  <!-- icon: social networking -->
  <g>
    <rect x="166" y="840" width="68" height="48" rx="11" fill="#eaf3fb" stroke="#2f78b8" stroke-width="2.4"/>
    <polygon points="184,886 184,906 204,886" fill="#eaf3fb" stroke="#2f78b8" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="184" cy="864" r="4" fill="#2f78b8"/>
    <circle cx="200" cy="864" r="4" fill="#2f78b8"/>
    <circle cx="216" cy="864" r="4" fill="#2f78b8"/>
  </g>

  <!-- icon: online learning -->
  <g>
    <polygon points="360,820 388,831 360,842 332,831" fill="#2e8b57" opacity="0.9"/>
    <rect x="326" y="848" width="68" height="42" rx="5" fill="#edf8ef" stroke="#2e8b57" stroke-width="2.4"/>
    <line x1="338" y1="862" x2="382" y2="862" stroke="#2e8b57" stroke-width="2.2"/>
    <line x1="338" y1="874" x2="370" y2="874" stroke="#2e8b57" stroke-width="2.2"/>
    <rect x="316" y="893" width="88" height="8" rx="4" fill="#2e8b57"/>
  </g>

  <!-- student -->
  <g stroke="#14304d" stroke-width="3.2" fill="none" stroke-linecap="round">
    <circle cx="540" cy="846" r="21"/>
    <path d="M531,852 Q540,860 549,852"/>
    <line x1="540" y1="867" x2="540" y2="912"/>
    <path d="M508,886 L540,876 L572,886"/>
    <line x1="540" y1="912" x2="522" y2="942"/>
    <line x1="540" y1="912" x2="558" y2="942"/>
  </g>
  <circle cx="533" cy="841" r="2.6" fill="#14304d"/>
  <circle cx="547" cy="841" r="2.6" fill="#14304d"/>

  <!-- icon: e-commerce -->
  <g>
    <path d="M688,838 L700,838 L707,850" stroke="#cf6a1f" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <polygon points="702,850 764,850 755,882 710,882" fill="#fdeede" stroke="#cf6a1f" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="718" y1="856" x2="722" y2="876" stroke="#cf6a1f" stroke-width="2"/>
    <line x1="740" y1="856" x2="738" y2="876" stroke="#cf6a1f" stroke-width="2"/>
    <circle cx="716" cy="893" r="6" fill="#cf6a1f"/>
    <circle cx="750" cy="893" r="6" fill="#cf6a1f"/>
  </g>

  <!-- icon: electronic payment -->
  <g>
    <rect x="842" y="846" width="78" height="50" rx="8" fill="#f4edfb" stroke="#6a4fb0" stroke-width="2.4"/>
    <rect x="843" y="858" width="76" height="11" fill="#6a4fb0" opacity="0.85"/>
    <rect x="854" y="878" width="28" height="8" rx="3" fill="#6a4fb0" opacity="0.55"/>
    <rect x="890" y="878" width="16" height="8" rx="3" fill="#6a4fb0" opacity="0.35"/>
  </g>

  <!-- title separator -->
  <line x1="272" y1="262" x2="808" y2="262" stroke="#9cbfe0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- 7. Educational text -->
  <text x="540"
        y="164"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#1b4f8a">تطور تكنولوجيا المعلومات والتحول الاجتماعي</text>

  <text x="540"
        y="206"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14304d">
    <tspan x="540" dy="0">Development of Information Technology</tspan>
    <tspan x="540" dy="32">and Social Transformation</tspan>
  </text>

  <text x="950"
        y="296"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1d5fa8">
    <tspan x="950" dy="0">في يوم عادي، يستخدم الطالب تطبيقات التواصل</tspan>
    <tspan x="950" dy="42">الاجتماعي، ويدفع إلكترونيًا، ويتعلم عبر الإنترنت،</tspan>
    <tspan x="950" dy="42">ويشتري من متجر إلكتروني. لم تكن معظم هذه</tspan>
    <tspan x="950" dy="42">الخدمات متاحة قبل عشرين عامًا؛ فقد تطورت</tspan>
    <tspan x="950" dy="42">تكنولوجيا المعلومات على مراحل، وغيّرت في كل</tspan>
    <tspan x="950" dy="42">مرحلة طريقة تواصل المجتمع وعمله وتعلمه ودفعه.</tspan>
  </text>

  <text x="120"
        y="566"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="120" dy="0">On an ordinary day, a student uses social</tspan>
    <tspan x="120" dy="34">networking apps, pays electronically, learns</tspan>
    <tspan x="120" dy="34">online, and buys from an e-commerce store. Most</tspan>
    <tspan x="120" dy="34">of these services were not available twenty</tspan>
    <tspan x="120" dy="34">years ago. Information technology developed</tspan>
    <tspan x="120" dy="34">in stages, and each stage changed how society</tspan>
    <tspan x="120" dy="34">communicates, works, learns, and pays.</tspan>
  </text>

  <text x="944"
        y="1028"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29"
        fill="#1d5fa8">
    <tspan x="944" dy="0">كيف تطورت تكنولوجيا المعلومات عبر مراحلها</tspan>
    <tspan x="944" dy="40">الرئيسية، وكيف غيّرت كل مرحلة المجتمع؟</tspan>
  </text>

  <text x="136"
        y="1108"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="136" dy="0">How has information technology developed through its</tspan>
    <tspan x="136" dy="34">major stages, and how has each stage changed society?</tspan>
  </text>

</svg>
