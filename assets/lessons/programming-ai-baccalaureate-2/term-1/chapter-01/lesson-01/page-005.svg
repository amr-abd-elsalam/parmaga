<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b07a44"/>
      <stop offset="0.55" stop-color="#986434"/>
      <stop offset="1" stop-color="#7d5029"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f8f2e4"/>
    </linearGradient>
  </defs>

  <!-- الخلفية الخشبية البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0,240 C300,205 760,300 1080,250" fill="none" stroke="#6f4622" stroke-width="12" opacity="0.12"/>
  <path d="M0,1010 C340,1070 720,960 1080,1035" fill="none" stroke="#6f4622" stroke-width="14" opacity="0.10"/>

  <!-- ظل بسيط للورقة -->
  <rect x="42" y="34" width="1012" height="1302" rx="8" fill="#4a2d13" opacity="0.22"/>

  <!-- الورقة -->
  <rect x="34" y="24" width="1012" height="1302" rx="8" fill="url(#paperGrad)"/>

  <!-- سطور الدفتر الأفقية الباهتة -->
  <g stroke="#cfe0ee" stroke-width="1.5">
    <line x1="80" y1="110" x2="1000" y2="110"/>
    <line x1="80" y1="154" x2="1000" y2="154"/>
