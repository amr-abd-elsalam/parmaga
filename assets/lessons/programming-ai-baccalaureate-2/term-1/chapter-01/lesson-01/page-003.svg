<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0783f"/>
      <stop offset="0.5" stop-color="#95612f"/>
      <stop offset="1" stop-color="#a86f39"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf3"/>
      <stop offset="1" stop-color="#f7f1e2"/>
    </linearGradient>
  </defs>

  <!-- 1. Simple warm background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0 250 C 300 205, 780 300, 1080 245" fill="none" stroke="#7d4f26" stroke-width="16" opacity="0.16"/>
  <path d="M0 1090 C 340 1145, 760 1035, 1080 1105" fill="none" stroke="#7d4f26" stroke-width="14" opacity="0.14"/>

  <!-- 2. Paper with a simple shadow -->
  <rect x="44" y="40" width="1012" height="1300" rx="8" fill="#3a2413" opacity="0.22"/>
  <rect x="34" y="26" width="1012" height="1300" rx="8" fill="url(#paperTone)"/>

  <!-- 3. Pale horizontal notebook lines -->
  <g stroke="#cfe0f0" stroke-width="1.3">
    <line x1="82" y1="138"  x2="998" y2="138"/>
    <line x1="82" y1="180"  x2="998" y2="180"/>
    <line x1="82" y1="222"  x2="998" y2="222"/>
    <line x1="82" y1="264"  x2="998" y2="264"/>
    <line x1="82" y1="306"  x2="998" y2="306"/>
    <line x1="82" y1="348"  x2="998" y2="348"/>
    <line x1="82" y1="390"  x2="998" y2="390"/>
    <line x1="82" y1="432"  x2="998" y2="432"/>
    <line x1="82" y1="474"  x2="998" y2="474"/>
    <line x1="82" y1="516"  x2="998" y2="516"/>
    <line x1="82" y1="558"  x2="998" y2="558"/>
    <line x1="82" y1="600"  x2="998" y2="600"/>
    <line x1="82" y1="642"  x2="998" y2="642"/>
    <line x1="82" y1="684"  x2="998" y2="684"/>
    <line x1="82" y1="726"  x2="998" y2="726"/>
    <line x1="82" y1="768"  x2="998" y2="768"/>
    <line x1="82" y1="810"  x2="998" y2="810"/>
    <line x1="82" y1="852"  x2="998" y2="852"/>
    <line x1="82" y1="894"  x2="998" y2="894"/>
    <line x1="82" y1="936"  x2="998" y2="936"/>
    <line x1="82" y1="978"  x2="998" y2="978"/>
    <line x1="82" y1="1020" x2="998" y2="1020"/>
    <line x1="82" y1="1062" x2="998" y2="1062"/>
    <line x1="82" y1="1104" x2="998" y2="1104"/>
    <line x1="82" y1="1146" x2="998" y2="1146"/>
  </g>

  <!-- 4. Single thin outer red border -->
  <rect x="67" y="92" width="946" height="1226" fill="none" stroke="#c0392b" stroke-width="2.4"/>

  <!-- 5. Title separator (neutral, non-red) -->
  <line x1="300" y1="266" x2="780" y2="266" stroke="#b0c8dd" stroke-width="2"/>

  <!-- 6. Functional timeline: red spine, arrows, nodes and icons -->
  <g stroke="#c0392b" stroke-width="3.4" fill="none" stroke-linecap="round">
    <line x1="145" y1="306" x2="145" y2="411"/>
    <line x1="145" y1="495" x2="145" y2="672"/>
    <line x1="145" y1="768" x2="145" y2="924"/>
    <line x1="145" y1="1020" x2="145" y2="1066"/>
  </g>
  <g fill="#c0392b">
    <path d="M145 686 L135 664 L155 664 Z"/>
    <path d="M145 938 L135 916 L155 916 Z"/>
    <path d="M145 1080 L135 1058 L155 1058 Z"/>
  </g>
  <g fill="#fffdf7" stroke="#c0392b" stroke-width="3">
    <circle cx="145" cy="453" r="40"/>
    <circle cx="145" cy="726" r="40"/>
    <circle cx="145" cy="978" r="40"/>
  </g>

  <!-- Icon 1: early electronic computer -->
  <g fill="none" stroke="#152b42" stroke-width="2.4" stroke-linecap="round">
    <rect x="124" y="434" width="42" height="30" rx="3"/>
    <circle cx="135" cy="446" r="5.5"/>
    <circle cx="155" cy="446" r="5.5"/>
    <line x1="129" y1="458" x2="161" y2="458"/>
    <line x1="131" y1="464" x2="131" y2="471"/>
    <line x1="159" y1="464" x2="159" y2="471"/>
  </g>

  <!-- Icon 2: personal computer -->
  <g fill="none" stroke="#152b42" stroke-width="2.4" stroke-linecap="round">
    <rect x="125" y="704" width="40" height="28" rx="3"/>
    <line x1="145" y1="732" x2="145" y2="740"/>
    <line x1="133" y1="741" x2="157" y2="741"/>
    <rect x="122" y="746" width="46" height="9" rx="2"/>
  </g>

  <!-- Icon 3: Internet network -->
  <g fill="none" stroke="#152b42" stroke-width="2.4" stroke-linecap="round">
    <circle cx="145" cy="978" r="20"/>
    <ellipse cx="145" cy="978" rx="8.5" ry="20"/>
    <line x1="125" y1="978" x2="165" y2="978"/>
    <line x1="129" y1="967" x2="161" y2="967"/>
    <line x1="129" y1="989" x2="161" y2="989"/>
  </g>

  <!-- 7. Educational text -->

  <!-- Arabic title -->
  <text x="540"
        y="180"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#1d4e89">المراحل الأولى لتكنولوجيا المعلومات</text>

  <!-- English title -->
  <text x="540"
        y="224"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">The Early Stages of Information Technology</text>

  <!-- ================= Stage 1 ================= -->
  <text x="955"
        y="348"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#d2691e">الأربعينيات–الستينيات</text>

  <text x="210"
        y="348"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#d2691e">1940s–60s</text>

  <text x="955"
        y="390"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="955" dy="0">ظهور الحواسيب الإلكترونية المبكرة، مثل ENIAC</tspan>
    <tspan x="955" dy="42">استخدامها أساسًا في الحسابات العسكرية والعلمية</tspan>
  </text>

  <text x="210"
        y="474"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="210" dy="0">Early electronic computers, such as ENIAC</tspan>
    <tspan x="210" dy="42">Mainly used for military</tspan>
    <tspan x="210" dy="42">and scientific computation</tspan>
  </text>

  <!-- ================= Stage 2 ================= -->
  <text x="955"
        y="642"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#d2691e">السبعينيات–الثمانينيات</text>

  <text x="210"
        y="642"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#d2691e">1970s–80s</text>

  <text x="955"
        y="684"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="955" dy="0">انتشار الحواسيب الشخصية PCs</tspan>
    <tspan x="955" dy="42">بداية استخدام الأفراد للحاسوب</tspan>
  </text>

  <text x="210"
        y="768"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="210" dy="0">Spread of personal computers PCs</tspan>
    <tspan x="210" dy="42">Beginning of personal computer use</tspan>
  </text>

  <!-- ================= Stage 3 ================= -->
  <text x="955"
        y="894"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="32"
        font-weight="bold"
        fill="#d2691e">التسعينيات</text>

  <text x="210"
        y="894"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#d2691e">1990s</text>

  <text x="955"
        y="936"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="955" dy="0">الاستخدام التجاري للإنترنت وظهور الويب</tspan>
    <tspan x="955" dy="42">الانتشار العالمي للمعلومات والبريد الإلكتروني</tspan>
  </text>

  <text x="210"
        y="1020"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="210" dy="0">Commercialization of the Internet and the Web</tspan>
    <tspan x="210" dy="42">Global spread of information and email</tspan>
  </text>

</svg>
