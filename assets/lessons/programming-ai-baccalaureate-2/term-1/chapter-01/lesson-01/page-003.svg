<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="328" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="144" y="1106" width="800" height="146" rx="20" fill="#22303f" opacity=".18"/>

<!-- Info card -->
<rect x="105" y="322" width="870" height="288" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="338" width="6" height="256" rx="3" fill="#2f7fb5"/>

<!-- Key sentence strip -->
<rect x="105" y="642" width="870" height="208" rx="10" fill="#fdf6d8"/>
<rect x="961" y="658" width="6" height="176" rx="3" fill="#e0a55e"/>

<!-- Icon: people (social changes) -->
<g transform="translate(136 126)">
  <circle cx="16" cy="12" r="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M2 46 Q2 24 16 24 Q30 24 30 46 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="38" cy="14" r="8" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <path d="M24 48 Q24 26 38 26 Q52 26 52 48 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Icon: light bulb -->
<g transform="translate(214 124)">
  <circle cx="22" cy="20" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 22 Q22 28 28 22" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="14" y="34" width="16" height="10" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Memory illustration: a journey through five stations -->
<g>
  <rect x="140" y="1100" width="800" height="146" rx="20" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>
  <path d="M141 1214 H939 V1226 Q939 1245 920 1245 H160 Q141 1245 141 1226 Z" fill="#a9dcbe"/>
  <line x1="141" y1="1214" x2="939" y2="1214" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="290" cy="1122" rx="30" ry="9" fill="#ffffff"/>
  <ellipse cx="310" cy="1115" rx="18" ry="8" fill="#ffffff"/>
  <ellipse cx="620" cy="1124" rx="34" ry="9" fill="#ffffff"/>
  <ellipse cx="640" cy="1116" rx="20" ry="8" fill="#ffffff"/>
  <line x1="210" y1="1170" x2="870" y2="1170" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <!-- posts -->
  <rect x="207" y="1200" width="6" height="14" fill="#7f95ab"/>
  <rect x="377" y="1200" width="6" height="14" fill="#7f95ab"/>
  <rect x="537" y="1200" width="6" height="14" fill="#7f95ab"/>
  <rect x="697" y="1200" width="6" height="14" fill="#7f95ab"/>
  <rect x="867" y="1200" width="6" height="14" fill="#7f95ab"/>
  <!-- stations -->
  <circle cx="210" cy="1170" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="380" cy="1170" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1170" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="700" cy="1170" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="870" cy="1170" r="30" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <!-- station 1: landline phone -->
  <path d="M196 1184 L200 1168 H220 L224 1184 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M194 1164 Q196 1154 204 1156 H216 Q224 1154 226 1164 L218 1166 Q214 1160 210 1161 Q206 1160 202 1166 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- station 2: desktop computer -->
  <rect x="364" y="1153" width="32" height="22" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="368" y="1157" width="24" height="14" fill="#8fc9f2"/>
  <rect x="376" y="1175" width="8" height="7" fill="#7f95ab"/>
  <rect x="369" y="1182" width="22" height="5" rx="2" fill="#7f95ab"/>
  <!-- station 3: network -->
  <line x1="528" y1="1182" x2="540" y2="1156" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="540" y1="1156" x2="553" y2="1180" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="528" y1="1182" x2="553" y2="1180" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="528" cy="1182" r="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1156" r="6" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="553" cy="1180" r="6" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <!-- station 4: smartphone -->
  <rect x="688" y="1150" width="24" height="40" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="692" y="1156" width="16" height="26" rx="2" fill="#4fc3e8"/>
  <!-- station 5: AI chip -->
  <line x1="862" y1="1150" x2="862" y2="1190" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="878" y1="1150" x2="878" y2="1190" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="850" y1="1162" x2="890" y2="1162" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="850" y1="1178" x2="890" y2="1178" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="856" y="1156" width="28" height="28" rx="4" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <rect x="863" y="1163" width="14" height="14" rx="2" fill="#a9dcbe"/>
  <!-- traveling student -->
  <path d="M287 1210 Q287 1194 295 1194 Q303 1194 303 1210 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="295" cy="1186" r="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M287 1185 Q288 1176 295 1176 Q302 1176 303 1185 Q298 1180 295 1180 Q291 1180 287 1185 Z" fill="#2b211c"/>
  <line x1="291" y1="1210" x2="290" y2="1214" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="299" y1="1210" x2="301" y2="1214" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">كل الحاجات دي اسمها <tspan font-weight="bold" fill="#c0392b">«تغيرات اجتماعية»</tspan></tspan>
  <tspan x="950" dy="40">أحدثتها تكنولوجيا المعلومات.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">All of these are called <tspan font-weight="bold" fill="#c0392b">"social changes"</tspan></tspan>
  <tspan x="120" dy="40">brought about by information technology.</tspan>
</text>

<text x="935" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">تكنولوجيا المعلومات (IT)</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">Information Technology (IT)</text>
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">استخدام الحواسيب والشبكات والبرمجيات</tspan>
  <tspan x="935" dy="40">لجمع <tspan font-weight="bold" fill="#17457f">المعلومات</tspan> وتخزينها ومعالجتها ونقلها.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Using computers, networks, and software</tspan>
  <tspan x="140" dy="40">to collect, store, process, and transmit</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">information.</tspan></tspan>
</text>

<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كل مرحلة جابت تقنية أو خدمة جديدة…</tspan>
  <tspan x="935" dy="40">وغيّرت معاها حياة الناس.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Each stage brought a new technology</tspan>
  <tspan x="140" dy="40">or service… and changed people's</tspan>
  <tspan x="140" dy="40">lives with it.</tspan>
</text>

<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في هذه المذكرة سنسافر معًا عبر <tspan font-weight="bold" fill="#17457f">خمس محطات،</tspan></tspan>
  <tspan x="950" dy="40">ونكتشف في كل محطة ماذا تغيّر في حياة الناس.</tspan>
</text>
<text x="120" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In these notes, we will travel together</tspan>
  <tspan x="120" dy="40">through <tspan font-weight="bold" fill="#17457f">five stations</tspan> and discover what</tspan>
  <tspan x="120" dy="40">changed in people's lives at each one.</tspan>
</text>
</svg>
