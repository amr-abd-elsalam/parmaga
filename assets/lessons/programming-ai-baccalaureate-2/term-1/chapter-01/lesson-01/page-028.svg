<!-- Text: Outlined box -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">صح أم خطأ؟</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">TRUE OR FALSE?</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اشتريت كتابًا من محل في شارعك ودفعت نقدًا.</tspan>
  <tspan x="935" dy="40">هل هذه <tspan font-weight="bold" fill="#17457f">تجارة إلكترونية؟</tspan></tspan>
</text>

<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">You bought a book from a shop</tspan>
  <tspan x="140" dy="40">on your street and paid cash.</tspan>
  <tspan x="140" dy="40">Is this <tspan font-weight="bold" fill="#17457f">e-commerce?</tspan></tspan>
</text>

<!-- Text: Info card -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>

<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الدفع غير النقدي</tspan> — دفع ثمن السلع</tspan>
  <tspan x="935" dy="40">والخدمات دون نقود ورقية أو معدنية،</tspan>
  <tspan x="935" dy="40">مثل البطاقات والنقود الإلكترونية</tspan>
  <tspan x="935" dy="40">وتطبيقات الهاتف ورموز QR.</tspan>
</text>

<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">cashless payment</tspan> — paying for goods</tspan>
  <tspan x="140" dy="40">and services without paper or coin</tspan>
  <tspan x="140" dy="40">money, such as cards, electronic</tspan>
  <tspan x="140" dy="40">money, phone apps, and QR codes.</tspan>
</text>
</svg>
