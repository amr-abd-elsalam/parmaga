<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilCard" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>
  <linearGradient id="ilTerminal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7fb5"/>
    <stop offset="1" stop-color="#17457f"/>
  </linearGradient>
  <linearGradient id="ilCounter" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
</defs>

<!-- Card shadows -->
<rect x="109" y="128" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="448" width="870" height="408" rx="16" fill="#22303f" opacity=".12"/>

<!-- Outlined box -->
<rect x="105" y="122" width="870" height="288" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="256" rx="3" fill="#2f7fb5"/>

<!-- Info card -->
<rect x="105" y="442" width="870" height="408" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="458" width="6" height="376" rx="3" fill="#2f7fb5"/>

<!-- Pencil icon -->
<g transform="translate(770 322)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="8,44 40,12 48,20 16,52" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="8,44 16,52 2,58" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="40,12 46,6 54,14 48,20" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Thinking face -->
<g transform="translate(880 360)" stroke-linecap="round">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3"/>
</g>

<!-- Payment card icon in Info card -->
<g transform="translate(850 720)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="0" y="8" width="56" height="38" rx="6" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="1" y="16" width="54" height="8" fill="#22303f"/>
  <rect x="8" y="30" width="12" height="9" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="30" y="34" width="18" height="4" rx="2" fill="#ffffff"/>
</g>

<!-- Memory illustration: cashless payment at a shop counter -->
<g stroke-linecap="round" stroke-linejoin="round">
  <!-- Shadows -->
  <rect x="304" y="1036" width="100" height="120" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="504" y="936" width="80" height="150" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="694" y="1016" width="110" height="140" rx="8" fill="#22303f" opacity=".18"/>

  <!-- Counter -->
  <rect x="170" y="1164" width="740" height="80" fill="url(#ilCounter)" stroke="#22303f" stroke-width="2.5"/>
  <line x1="420" y1="1172" x2="420" y2="1236" stroke="#7d4f28" stroke-width="2.5"/>
  <line x1="660" y1="1172" x2="660" y2="1236" stroke="#7d4f28" stroke-width="2.5"/>
  <rect x="150" y="1150" width="780" height="14" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>

  <!-- Payment terminal with card -->
  <rect x="318" y="985" width="64" height="44" rx="6" fill="url(#ilCard)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="319" y="995" width="62" height="8" fill="#22303f"/>
  <rect x="328" y="1010" width="12" height="10" rx="2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="300" y="1030" width="100" height="120" rx="12" fill="url(#ilTerminal)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="312" y="1042" width="76" height="36" rx="4" fill="#4fc3e8"/>
  <circle cx="325" cy="1095" r="5" fill="#dff1f7"/>
  <circle cx="350" cy="1095" r="5" fill="#dff1f7"/>
  <circle cx="375" cy="1095" r="5" fill="#dff1f7"/>
  <circle cx="325" cy="1115" r="5" fill="#dff1f7"/>
  <circle cx="350" cy="1115" r="5" fill="#dff1f7"/>
  <circle cx="375" cy="1115" r="5" fill="#dff1f7"/>
  <circle cx="325" cy="1135" r="5" fill="#dff1f7"/>
  <circle cx="350" cy="1135" r="5" fill="#a9dcbe"/>
  <circle cx="375" cy="1135" r="5" fill="#dff1f7"/>

  <!-- Check badge -->
  <circle cx="440" cy="962" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M430 962 L438 970 L452 954" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Phone held in hand -->
  <rect x="500" y="930" width="80" height="150" rx="12" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="507" y="942" width="66" height="120" rx="4" fill="#ffffff"/>
  <rect x="514" y="950" width="18" height="18" fill="#22303f"/>
  <rect x="548" y="950" width="18" height="18" fill="#22303f"/>
  <rect x="514" y="984" width="18" height="18" fill="#22303f"/>
  <rect x="538" y="976" width="6" height="6" fill="#22303f"/>
  <rect x="552" y="984" width="6" height="6" fill="#22303f"/>
  <rect x="540" y="994" width="6" height="6" fill="#22303f"/>
  <rect x="558" y="996" width="6" height="6" fill="#22303f"/>
  <circle cx="540" cy="1035" r="11" fill="#2e7d32"/>
  <path d="M534 1035 L539 1040 L547 1030" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M490 1150 L494 1062 Q496 1046 510 1050 L510 1078 L570 1078 L570 1050 Q584 1046 586 1062 L590 1150 Z" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

  <!-- Contactless waves -->
  <path d="M604 1000 Q616 1015 604 1030" fill="none" stroke="#2f7fb5" stroke-width="3"/>
  <path d="M622 990 Q640 1015 622 1040" fill="none" stroke="#4fc3e8" stroke-width="3"/>
  <path d="M640 980 Q664 1015 640 1050" fill="none" stroke="#8fc9f2" stroke-width="3"/>

  <!-- QR stand -->
  <rect x="690" y="1010" width="110" height="140" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="705" y="1025" width="24" height="24" fill="#22303f"/>
  <rect x="710" y="1030" width="14" height="14" fill="#ffffff"/>
  <rect x="713" y="1033" width="8" height="8" fill="#22303f"/>
  <rect x="761" y="1025" width="24" height="24" fill="#22303f"/>
  <rect x="766" y="1030" width="14" height="14" fill="#ffffff"/>
  <rect x="769" y="1033" width="8" height="8" fill="#22303f"/>
  <rect x="705" y="1081" width="24" height="24" fill="#22303f"/>
  <rect x="710" y="1086" width="14" height="14" fill="#ffffff"/>
  <rect x="713" y="1089" width="8" height="8" fill="#22303f"/>
  <rect x="740" y="1030" width="8" height="8" fill="#22303f"/>
  <rect x="744" y="1052" width="8" height="8" fill="#22303f"/>
  <rect x="761" y="1062" width="8" height="8" fill="#22303f"/>
  <rect x="775" y="1076" width="8" height="8" fill="#22303f"/>
  <rect x="740" y="1086" width="8" height="8" fill="#22303f"/>
  <rect x="758" y="1096" width="8" height="8" fill="#22303f"/>
  <rect x="777" y="1100" width="8" height="8" fill="#22303f"/>
  <rect x="705" y="1120" width="80" height="8" rx="4" fill="#2f7fb5"/>
  <rect x="680" y="1140" width="130" height="10" rx="3" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5"/>

  <!-- Stars -->
  <polygon points="228,972 234.5,989.1 252.7,990 238.5,1001.4 243.3,1019 228,1009 212.7,1019 217.5,1001.4 203.3,990 221.5,989.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="860,952 866.5,969.1 884.7,970 870.5,981.4 875.3,999 860,989 844.7,999 849.5,981.4 835.3,970 853.5,969.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
