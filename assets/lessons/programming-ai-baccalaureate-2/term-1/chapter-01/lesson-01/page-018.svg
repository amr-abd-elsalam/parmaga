<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قانون مور: لعبة طيّ الورقة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Moore's Law: The Paper-Folding Game</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">جرّب الآن:</tspan> هات ورقة واطوِها نصفين،</tspan>
  <tspan x="935" dy="40">ثم نصفين، وهكذا.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Try it now:</tspan> Take a sheet of paper</tspan>
  <tspan x="140" dy="40">and fold it in half, then in half</tspan>
  <tspan x="140" dy="40">again, and so on.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">مع كل طيّة <tspan font-weight="bold" fill="#c0392b">يتضاعف</tspan> سُمك الورقة.</tspan>
  <tspan x="950" dy="40">وبعد <tspan fill="#c96a1b">7 أو 8</tspan> طيات تقريبًا لن تستطيع أن تكمل!</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">With each fold, the paper's thickness</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">doubles.</tspan> After about <tspan fill="#c96a1b">7 or 8</tspan> folds,</tspan>
  <tspan x="120" dy="40">you will not be able to continue!</tspan>
</text>

<text x="935" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">التضاعف سريع جدًا… لكنه يصل إلى حد.</tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Doubling is very fast…</tspan>
  <tspan x="140" dy="40">but it reaches a limit.</tspan>
</text>
</svg>
