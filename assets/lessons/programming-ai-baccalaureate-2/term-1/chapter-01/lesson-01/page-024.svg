<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilPipe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8dfd1"/>
    <stop offset="1" stop-color="#7f95ab"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="128" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="536" width="870" height="410" rx="20" fill="#22303f" opacity=".18"/>
<rect x="109" y="968" width="870" height="208" rx="10" fill="#22303f" opacity=".12"/>

<!-- Info card -->
<rect x="105" y="122" width="870" height="368" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="336" rx="3" fill="#2f7fb5"/>

<!-- Key sentence strip (caption) -->
<rect x="105" y="962" width="870" height="208" rx="10" fill="#fdf6d8"/>
<rect x="961" y="978" width="6" height="176" rx="3" fill="#e0a55e"/>

<!-- Requested illustration: leakage and quantum tunneling -->
<g>
  <rect x="105" y="530" width="870" height="410" rx="20" fill="#dff1f7"/>
  <line x1="640" y1="560" x2="640" y2="840" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 10"/>

  <!-- Thick barrier with bouncing electron -->
  <rect x="259" y="676" width="50" height="160" rx="4" fill="#22303f" opacity=".18"/>
  <rect x="255" y="670" width="50" height="160" rx="4" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="257" y1="710" x2="303" y2="710" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="257" y1="750" x2="303" y2="750" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="257" y1="790" x2="303" y2="790" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="672" x2="280" y2="710" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270" y1="710" x2="270" y2="750" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="290" y1="750" x2="290" y2="790" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="275" y1="790" x2="275" y2="828" stroke="#f0c48c" stroke-width="2.5" stroke-linecap="round"/>

  <line x1="162" y1="656" x2="160" y2="738" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="160" cy="760" r="14" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="155" cy="755" r="4" fill="#ffffff"/>
  <line x1="182" y1="760" x2="240" y2="760" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 240 748 Q 216 698 188 712" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="176,718 188,706 192,720" fill="#c0392b"/>

  <!-- Very thin barrier with electron passing through -->
  <rect x="509" y="676" width="8" height="160" rx="3" fill="#22303f" opacity=".18"/>
  <rect x="505" y="670" width="8" height="160" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="400" cy="760" r="14" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="395" cy="755" r="4" fill="#ffffff"/>
  <line x1="420" y1="760" x2="556" y2="760" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <circle cx="576" cy="760" r="14" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="571" cy="755" r="4" fill="#ffffff"/>
  <line x1="594" y1="760" x2="600" y2="760" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="612,760 600,753 600,767" fill="#c0392b"/>

  <!-- Closed tap that still drips -->
  <rect x="904" y="616" width="40" height="110" rx="6" fill="#22303f" opacity=".18"/>
  <rect x="900" y="610" width="40" height="110" rx="6" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="720" y="640" width="184" height="28" rx="8" fill="url(#ilPipe)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="720" y="660" width="28" height="50" rx="8" fill="url(#ilPipe)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="806" y="618" width="12" height="24" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="780" y="606" width="64" height="14" rx="7" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 734 728 C 740 738 744 744 744 748 A 10 10 0 0 1 724 748 C 724 744 728 738 734 728 Z" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 734 776 C 739 784 742 789 742 792 A 8 8 0 0 1 726 792 C 726 789 729 784 734 776 Z" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="734" cy="826" rx="52" ry="10" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M 708 814 Q 734 806 760 814" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Icon: open book beside card header -->
<g transform="translate(560 148)">
  <path d="M 0 -16 Q -13 -24 -26 -18 L -26 18 Q -13 12 0 20 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 0 -16 Q 13 -24 26 -18 L 26 18 Q 13 12 0 20 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="-20" y1="-8" x2="-6" y2="-6" stroke="#8fc9f2" stroke-width="1.4"/>
  <line x1="-20" y1="0" x2="-6" y2="2" stroke="#8fc9f2" stroke-width="1.4"/>
  <line x1="6" y1="-6" x2="20" y2="-8" stroke="#2f7fb5" stroke-width="1.4"/>
  <line x1="6" y1="2" x2="20" y2="0" stroke="#2f7fb5" stroke-width="1.4"/>
</g>

<!-- Bottom icon row -->
<g transform="translate(420 1222)">
  <line x1="-26" y1="-10" x2="-18" y2="-10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="0" x2="-18" y2="0" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-26" y1="10" x2="-18" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="-10" x2="26" y2="-10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="0" x2="26" y2="0" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="10" x2="26" y2="10" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="-26" x2="-10" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="-26" x2="0" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="-26" x2="10" y2="-18" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="-10" y1="18" x2="-10" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="18" x2="0" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="18" x2="10" y2="26" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#4fc3e8"/>
</g>
<g transform="translate(540 1222)">
  <path d="M 0 -24 C 9 -10 16 0 16 6 A 16 16 0 0 1 -16 6 C -16 0 -9 -10 0 -24 Z" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M -7 4 Q -7 11 0 13" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g transform="translate(660 1222)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النفق الكمومي</tspan> — ظاهرة يعبر فيها الإلكترون</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">حاجزًا رقيقًا جدًا</tspan> ما كان ليعبره</tspan>
  <tspan x="935" dy="40">حسب الفيزياء التقليدية.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">quantum tunneling</tspan> — an effect in</tspan>
  <tspan x="140" dy="40">which an electron passes through a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">very thin barrier</tspan> that classical</tspan>
  <tspan x="140" dy="40">physics says it could not cross.</tspan>
</text>

<text x="215" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="215" dy="0">إلكترون</tspan>
</text>
<text x="125" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="125" dy="0">Electron</tspan>
</text>
<text x="288" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="288" dy="0">حاجز سميك</tspan>
</text>
<text x="135" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="135" dy="0">Thick barrier</tspan>
</text>
<text x="600" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="600" dy="0">حاجز رقيق جدًا</tspan>
</text>
<text x="389" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="389" dy="0">Very thin barrier</tspan>
</text>
<text x="872" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="872" dy="0">تيار التسرب</tspan>
</text>
<text x="693" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="693" dy="0">Leakage current</tspan>
</text>

<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">في الترانزستور الصغير جدًا، تعبر</tspan>
  <tspan x="935" dy="40">الإلكترونات الحاجز الذي يُفترض أن يمنعها.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">In a very small transistor, electrons</tspan>
  <tspan x="140" dy="40">pass through the barrier that is</tspan>
  <tspan x="140" dy="40">supposed to stop them.</tspan>
</text>
</svg>
