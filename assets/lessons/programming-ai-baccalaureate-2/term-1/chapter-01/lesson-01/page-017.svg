<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="128" width="870" height="608" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="768" width="870" height="408" rx="16" fill="#22303f" opacity=".12"/>

<!-- Outlined box -->
<rect x="105" y="122" width="870" height="608" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="138" width="6" height="576" rx="3" fill="#2f7fb5"/>

<!-- Success card -->
<rect x="105" y="762" width="870" height="408" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="778" width="6" height="376" rx="3" fill="#2e7d32"/>

<!-- Outlined box icon: star -->
<g transform="translate(872 448)">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Outlined box face: thinking -->
<g transform="translate(885 690)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Success card icon: check badge -->
<g transform="translate(898 1130)">
  <circle cx="0" cy="0" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -10 1 L -3 9 L 11 -8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Lower band icons: cloud, smile face, smartphone -->
<g transform="translate(424 1190)">
  <path d="M14 44 Q4 44 4 35 Q4 26 14 26 Q16 14 28 14 Q40 14 42 26 Q52 26 52 35 Q52 44 42 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 34 Q20 28 26 28" fill="none" stroke="#8fc9f2" stroke-width="2.5" stroke-linecap="round"/>
</g>
<g transform="translate(540 1218)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>
<g transform="translate(600 1190)">
  <rect x="14" y="2" width="28" height="52" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="9" width="20" height="36" rx="2" fill="#4fc3e8"/>
  <rect x="21" y="14" width="14" height="4" rx="2" fill="#ffffff"/>
  <rect x="21" y="22" width="10" height="4" rx="2" fill="#dff1f7"/>
  <circle cx="28" cy="50" r="2" fill="#ffffff"/>
</g>

<!-- Text: Outlined box header -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">لغز للباحث</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">PUZZLE FOR THE RESEARCHER</tspan>
</text>

<!-- Text: paragraph 1 -->
<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">أطلقت Amazon Web Services خدمتها</tspan>
  <tspan x="935" dy="40">السحابية <tspan font-weight="bold" fill="#17457f">Amazon S3</tspan> في <tspan fill="#c96a1b">14 مارس 2006،</tspan></tspan>
  <tspan x="935" dy="40">وأُعلن أول iPhone في <tspan fill="#c96a1b">9 يناير 2007.</tspan></tspan>
</text>

<text x="140"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Amazon Web Services launched its cloud</tspan>
  <tspan x="140" dy="40">service <tspan font-weight="bold" fill="#17457f">Amazon S3</tspan> on <tspan fill="#c96a1b">March 14, 2006,</tspan></tspan>
  <tspan x="140" dy="40">and the first iPhone was announced</tspan>
  <tspan x="140" dy="40">on <tspan fill="#c96a1b">January 9, 2007.</tspan></tspan>
</text>

<!-- Text: paragraph 2 -->
<text x="935"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">إذن السحابة ظهرت <tspan font-weight="bold" fill="#17457f">قبل الآيفون!</tspan></tspan>
  <tspan x="935" dy="40">فلماذا جاءت بعده في جدول المراحل؟</tspan>
</text>

<text x="140"
      y="594"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">So the cloud appeared</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">before the iPhone!</tspan></tspan>
  <tspan x="140" dy="40">Why does it come after it</tspan>
  <tspan x="140" dy="40">in the table of stages?</tspan>
</text>

<!-- Text: Success card header -->
<text x="935"
      y="794"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#2e7d32">
  <tspan x="935" dy="0">الحل</tspan>
</text>

<text x="140"
      y="834"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#2e7d32">
  <tspan x="140" dy="0">Solution</tspan>
</text>

<!-- Text: solution -->
<text x="935"
      y="874"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">الجدول يرتب المراحل حسب انتشار التقنية</tspan>
  <tspan x="935" dy="40">في حياة الناس، لا حسب لحظة ظهورها.</tspan>
  <tspan x="935" dy="40">والسحابة انتشرت في العقد الثاني</tspan>
  <tspan x="935" dy="40">من الألفية.</tspan>
</text>

<text x="140"
      y="1034"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">The table orders the stages by when</tspan>
  <tspan x="140" dy="40">a technology spread in people's lives,</tspan>
  <tspan x="140" dy="40">not when it first appeared.</tspan>
  <tspan x="140" dy="40">The cloud spread in the 2010s.</tspan>
</text>
</svg>
