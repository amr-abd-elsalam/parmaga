  <circle cx="143" cy="1052" r="19" fill="#ffffff" stroke="#2b5f9c" stroke-width="2.6"/>

  <text x="540" y="112"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40" font-weight="bold" fill="#1b4f8a">تدرّب: صنّف واختر</text>

  <text x="540" y="150"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" fill="#16436e">Try: Classify and Choose</text>

  <text x="373" y="206"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="21" fill="#225f9c">
    <tspan x="373" dy="0">أ: تغيرات في</tspan>
    <tspan x="373" dy="28">الحياة اليومية</tspan>
  </text>
  <text x="121" y="266"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="17" fill="#152b42">
    <tspan x="121" dy="0">A: Changes in</tspan>
    <tspan x="121" dy="26">daily life</tspan>
  </text>

  <text x="666" y="206"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="21" fill="#225f9c">
    <tspan x="666" dy="0">ب: تغيرات في</tspan>
    <tspan x="666" dy="28">الصناعة والاقتصاد</tspan>
  </text>
  <text x="414" y="266"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="17" fill="#152b42">
    <tspan x="414" dy="0">B: Changes in industry</tspan>
    <tspan x="414" dy="26">and the economy</tspan>
  </text>

  <text x="959" y="206"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="21" fill="#225f9c">
    <tspan x="959" dy="0">ج: تغيرات في الرعاية</tspan>
    <tspan x="959" dy="28">الصحية والتعليم</tspan>
  </text>
  <text x="707" y="266"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="17" fill="#152b42">
    <tspan x="707" dy="0">C: Changes in healthcare</tspan>
    <tspan x="707" dy="26">and education</tspan>
  </text>

  <text x="945" y="360"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25" fill="#225f9c">
    <tspan x="945" dy="0">تلقي الدروس من خلال التعلم عبر الإنترنت.</tspan>
  </text>
  <text x="185" y="390"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#152b42">
    <tspan x="185" dy="0">Taking classes through online learning.</tspan>
  </text>

  <text x="945" y="438"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25" fill="#225f9c">
    <tspan x="945" dy="0">دفع ثمن المشتريات باستخدام تطبيق دفع على الهاتف الذكي.</tspan>
  </text>
  <text x="185" y="468"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#152b42">
    <tspan x="185" dy="0">Paying for purchases using a mobile</tspan>
    <tspan x="185" dy="28">payment app on a smartphone.</tspan>
  </text>

  <text x="945" y="544"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25" fill="#225f9c">
    <tspan x="945" dy="0">مشاركة الصور مع الأصدقاء عبر شبكات التواصل الاجتماعي.</tspan>
  </text>
  <text x="185" y="574"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#152b42">
    <tspan x="185" dy="0">Sharing photos with friends on SNS.</tspan>
  </text>

  <text x="945" y="622"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="25" fill="#225f9c">
    <tspan x="945" dy="0">تطبيق شركة لنظام العمل من المنزل.</tspan>
  </text>
  <text x="185" y="652"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21" fill="#152b42">
    <tspan x="185" dy="0">A company introducing a work-from-home system.</tspan>
  </text>

  <text x="945" y="748"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#1b4f8a">
    <tspan x="945" dy="0">أي الاختيارات الآتية لا يصف تقنية ناشئة وصفًا صحيحًا؟</tspan>
  </text>
  <text x="120" y="780"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#16436e">
    <tspan x="120" dy="0">Which option does NOT appropriately describe an emerging technology?</tspan>
  </text>

  <text x="176" y="828"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#2e7d32">A</text>
  <text x="945" y="828"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="23" fill="#225f9c">
    <tspan x="945" dy="0">تستخدم القيادة الذاتية الذكاء الاصطناعي لقيادة مركبة دون تدخل بشري.</tspan>
  </text>
  <text x="215" y="856"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20" fill="#152b42">
    <tspan x="215" dy="0">Autonomous driving uses AI to drive a vehicle</tspan>
    <tspan x="215" dy="26">without human operation.</tspan>
  </text>

  <text x="176" y="914"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#2e7d32">B</text>
  <text x="945" y="914"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="23" fill="#225f9c">
    <tspan x="945" dy="0">يضيف الواقع المعزز معلومات رقمية إلى صور من العالم الحقيقي.</tspan>
  </text>
  <text x="215" y="942"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20" fill="#152b42">
    <tspan x="215" dy="0">AR overlays digital information on real-world images.</tspan>
  </text>

  <text x="176" y="974"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#2e7d32">C</text>
  <text x="945" y="974"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="23" fill="#225f9c">
    <tspan x="945" dy="0">الواقع الافتراضي تقنية تحسن سرعة معالجة الحاسوب تحسينًا كبيرًا.</tspan>
  </text>
  <text x="215" y="1002"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20" fill="#152b42">
    <tspan x="215" dy="0">VR is a technology that dramatically improves</tspan>
    <tspan x="215" dy="26">the processing speed of a computer.</tspan>
  </text>

  <text x="176" y="1060"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#2e7d32">D</text>
  <text x="945" y="1060"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="23" fill="#225f9c">
    <tspan x="945" dy="0">يُتوقع أن تسرّع الحوسبة الكمومية بعض الحسابات</tspan>
    <tspan x="945" dy="28">الصعبة على الحواسيب التقليدية.</tspan>
  </text>
  <text x="215" y="1116"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="20" fill="#152b42">
    <tspan x="215" dy="0">Quantum computing is expected to speed up computations</tspan>
    <tspan x="215" dy="26">that are difficult for traditional computers.</tspan>
  </text>

</svg>
