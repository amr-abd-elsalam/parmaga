<!-- Paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وطوال الرحلة، ظل عدد <tspan font-weight="bold" fill="#17457f">الترانزستورات</tspan> يتضاعف</tspan>
  <tspan x="950" dy="40">كل عامين تقريبًا <tspan font-weight="bold" fill="#c0392b">(قانون مور)،</tspan></tspan>
  <tspan x="950" dy="40">لكن التصغير يقترب الآن من <tspan font-weight="bold" fill="#17457f">حد فيزيائي.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Along the journey, the number of</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">transistors</tspan> kept doubling about every</tspan>
  <tspan x="120" dy="40">two years <tspan font-weight="bold" fill="#c0392b">(Moore's Law),</tspan></tspan>
  <tspan x="120" dy="40">but miniaturization is now approaching</tspan>
  <tspan x="120" dy="40">a <tspan font-weight="bold" fill="#17457f">physical limit.</tspan></tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">5 تغيرات</tspan> في حياتنا: التواصل، والتسوق،</tspan>
  <tspan x="950" dy="40">والعمل، والتعلم، والدفع.</tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">5 changes</tspan> in our lives: communicating,</tspan>
  <tspan x="132" dy="40">shopping, working, learning, and paying.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">4 تقنيات ناشئة:</tspan> القيادة الذاتية،</tspan>
  <tspan x="950" dy="40">وAR، وVR، والحوسبة الكمومية.</tspan>
</text>
<text x="132" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#17457f">4 emerging technologies:</tspan> autonomous</tspan>
  <tspan x="132" dy="40">driving, AR, VR, and quantum computing.</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">كل مرحلة جابت تقنية جديدة…</tspan>
  <tspan x="935" dy="40">وغيّرت معاها حياة الناس.</tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Each stage brought a new technology…</tspan>
  <tspan x="140" dy="40">and changed people's lives with it.</tspan>
</text>
</svg>
