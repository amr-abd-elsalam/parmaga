<!-- Memory illustration: doubling, physical limit, emerging technologies -->
<rect x="105" y="1074" width="870" height="176" rx="20" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>
<line x1="125" y1="1222" x2="955" y2="1222" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

<rect x="150" y="1207" width="36" height="15" rx="3" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="200" y="1192" width="36" height="30" rx="3" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="250" y="1162" width="36" height="60" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="300" y="1102" width="36" height="120" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="140" y1="1090" x2="360" y2="1090" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<path d="M168 1196 Q 240 1170 300 1110" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="306,1102 296,1106 304,1114" fill="#c0392b"/>

<g transform="translate(450 1156)">
  <path d="M70 -20 Q 85 -32 100 -20" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <path d="M62 -30 Q 85 -46 108 -30" fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="85" cy="-8" rx="10" ry="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M0 50 L0 30 Q 2 18 18 16 L40 0 Q 46 -4 58 -4 L110 -4 Q 122 -4 130 6 L148 18 Q 170 20 172 34 L172 50 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M46 16 L58 4 L82 4 L82 16 Z" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M92 4 L114 4 Q 120 4 126 10 L130 16 L92 16 Z" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="164" cy="30" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="36" cy="52" r="14" fill="#22303f"/>
  <circle cx="36" cy="52" r="6" fill="#e8dfd1"/>
  <circle cx="138" cy="52" r="14" fill="#22303f"/>
  <circle cx="138" cy="52" r="6" fill="#e8dfd1"/>
</g>

