    <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#17457f" stroke-width="2.5"/>
    <circle cx="46" cy="0" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  </g>
  <g transform="rotate(-60)">
    <ellipse cx="0" cy="0" rx="46" ry="16" fill="none" stroke="#17457f" stroke-width="2.5"/>
