  <rect x="115" y="576" width="850" height="50" rx="12" fill="#eef5fc" stroke="#7ea8d0" stroke-width="1.6"/>
  <rect x="117" y="582" width="7" height="38" fill="#2e7d4f"/>

  <rect x="115" y="668" width="850" height="50" rx="12" fill="#eef5fc" stroke="#7ea8d0" stroke-width="1.6"/>
