  <!-- 7. النص التعليمي -->
  <text x="540"
        y="124"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#1a4f8a">استكشف مع زميلك</text>

  <text x="540"
        y="166"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif"
        font-size="31"
        fill="#14263d">Explore in Pairs</text>

  <text x="940"
        y="232"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#225f9c">
    <tspan x="940" dy="0">انظر مع زميلك إلى الفترات الزمنية الخمس في مراحل تطور</tspan>
    <tspan x="940" dy="36">تكنولوجيا المعلومات. حددا جهازًا أو خدمة من كل فترة ما زلتما</tspan>
    <tspan x="940" dy="36">تستخدمانها أو تسمعان عنها اليوم. ثم توقّعا المرحلة التي غيّرت</tspan>
    <tspan x="940" dy="36">حياتكما اليومية أكثر من غيرها، وقدّما سببًا واحدًا.</tspan>
  </text>

  <text x="140"
        y="384"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="140" dy="0">With a partner, look at the five time periods in the</tspan>
    <tspan x="140" dy="34">development of information technology. For each period,</tspan>
    <tspan x="140" dy="34">name one device or service from that era that you still</tspan>
    <tspan x="140" dy="34">use or hear about today. Then predict which stage</tspan>
    <tspan x="140" dy="34">changed your daily life the most, and give one reason.</tspan>
  </text>

  <text x="940" y="609" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#1a4f8a">الأربعينيات–الستينيات</text>
  <text x="430" y="609" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7characters"/>
  <text x="430" y="609" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7a97">—</text>
  <text x="140" y="609" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif" font-size="26" fill="#152b42">1940s–60s</text>

  <text x="940" y="701" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#1a4f8a">السبعينيات–الثمانينيات</text>
  <text x="430" y="701" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7a97">—</text>
  <text x="140" y="701" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif" font-size="26" fill="#152b42">1970s–80s</text>

  <text x="940" y="793" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#1a4f8a">التسعينيات</text>
  <text x="430" y="793" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7a97">—</text>
  <text x="140" y="793" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif" font-size="26" fill="#152b42">1990s</text>

  <text x="940" y="885" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#1a4f8a">العقد الأول من الألفية</text>
  <text x="430" y="885" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7a97">—</text>
  <text x="140" y="885" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif" font-size="26" fill="#152b42">2000s</text>

  <text x="940" y="977" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#1a4f8a">من العقد الثاني من الألفية فصاعدًا</text>
  <text x="430" y="977" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#5b7a97">—</text>
  <text x="140" y="977" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="'Segoe Print','Comic Sans MS',Arial,sans-serif" font-size="26" fill="#152b42">2010s onward</text>

</svg>
