  <g stroke="#d1453f" stroke-width="2">
    <line x1="540" y1="630" x2="540" y2="646"/>
    <line x1="540" y1="722" x2="540" y2="738"/>
    <line x1="540" y1="814" x2="540" y2="830"/>
    <line x1="540" y1="906" x2="540" y2="922"/>
  </g>

