<!-- Text: Info card header -->
<text x="935"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#17457f">
  <tspan x="935" dy="0">مصطلحات المحطة 3</tspan>
</text>

<text x="140"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#17457f">
  <tspan x="140" dy="0">STATION 3 TERMS</tspan>
</text>

<!-- Text: term 1 -->
<text x="935"
      y="234"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الإنترنت</tspan> — <tspan font-weight="bold" fill="#17457f">شبكة عالمية</tspan> تربط ملايين</tspan>
  <tspan x="935" dy="40">الشبكات والأجهزة، وتنقل البيانات بينها.</tspan>
</text>

<text x="140"
      y="314"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Internet</tspan> — a <tspan font-weight="bold" fill="#17457f">global network</tspan> that</tspan>
  <tspan x="140" dy="40">links millions of networks and devices</tspan>
  <tspan x="140" dy="40">and carries data between them.</tspan>
</text>

<!-- Text: term 2 -->
<text x="935"
      y="434"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الويب</tspan> (World Wide Web) — <tspan font-weight="bold" fill="#17457f">خدمة</tspan> تعمل فوق</tspan>
  <tspan x="935" dy="40">الإنترنت، من صفحات مرتبطة بروابط</tspan>
  <tspan x="935" dy="40">تفتحها بالمتصفح.</tspan>
</text>

<text x="140"
      y="554"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Web</tspan> (World Wide Web) — a <tspan font-weight="bold" fill="#17457f">service</tspan></tspan>
  <tspan x="140" dy="40">that runs on top of the Internet,</tspan>
  <tspan x="140" dy="40">made of pages linked together</tspan>
  <tspan x="140" dy="40">that you open in a browser.</tspan>
</text>

<!-- Text: term 3 -->
<text x="935"
      y="714"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">إتاحة الإنترنت تجاريًا</tspan> — تحوّله من شبكة</tspan>
  <tspan x="935" dy="40">لجهات محدودة إلى شبكة تستخدمها</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الشركات والبيوت.</tspan></tspan>
</text>

<text x="140"
      y="834"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">commercialization of the Internet</tspan> —</tspan>
  <tspan x="140" dy="40">its change from a network for a few</tspan>
  <tspan x="140" dy="40">organizations into one used by</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">companies and homes.</tspan></tspan>
</text>
</svg>
