    <g transform="translate(452,206)">
      <circle cx="30" cy="32" r="12" fill="#cfe0ea"/>
      <circle cx="4" cy="6" r="5.5" fill="#e8dfd1"/>
      <circle cx="56" cy="6" r="5.5" fill="#e8dfd1"/>
      <circle cx="4" cy="58" r="5.5" fill="#e8dfd1"/>
      <circle cx="56" cy="58" r="5.5" fill="#e8dfd1"/>
      <line x1="10" y1="12" x2="22" y2="24"/>
      <line x1="50" y1="12" x2="38" y2="24"/>
      <line x1="10" y1="52" x2="22" y2="40"/>
      <line x1="50" y1="52" x2="38" y2="40"/>
