      <rect x="6" y="6" width="44" height="30" rx="3" fill="#cfe0ea"/>
      <rect x="22" y="42" width="12" height="12" fill="#e8dfd1"/>
      <line x1="12" y1="56" x2="44" y2="56"/>
      <rect x="8" y="62" width="40" height="8" rx="3" fill="#e8dfd1"/>
