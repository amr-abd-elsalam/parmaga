  </g>

  <!-- 7. bilingual title card -->
  <g filter="url(#fCardShadow)">
    <rect x="105" y="840" width="870" height="310" rx="26" fill="url(#gTitleCard)"/>
  </g>
  <rect x="105" y="840" width="870" height="70" rx="26" fill="#ffffff" opacity="0.06"/>

  <text x="540"
        y="890"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#f2c94c">
    <tspan x="540" dy="0">الدرس 1-1</tspan>
  </text>

  <text x="540"
        y="944"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#ffffff">
    <tspan x="540" dy="0">تطور تكنولوجيا المعلومات</tspan>
    <tspan x="540" dy="52">والتحول الاجتماعي</tspan>
  </text>

  <line x1="280" y1="1020" x2="800" y2="1020" stroke="#cfe2f5" stroke-width="1.5" opacity="0.45"/>
  <line x1="508" y1="1020" x2="572" y2="1020" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round"/>

  <text x="540"
        y="1056"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe UI, Tahoma, Arial, sans-serif"
        font-size="22"
        letter-spacing="1"
        fill="#f2c94c">
    <tspan x="540" dy="0">Lesson 1-1</tspan>
  </text>

