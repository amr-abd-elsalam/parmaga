    <polyline points="368,598 442,588 494,591" fill="none" stroke="#e6b78c" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="320" y="558" width="20" height="18" fill="#dda877"/>
    <circle cx="330" cy="530" r="36" fill="#e6b78c" stroke="#cf9a6d" stroke-width="1.5"/>
