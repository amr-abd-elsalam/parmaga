    <rect x="654" y="378" width="22" height="34" rx="2" fill="#d9b98b"/>
    <rect x="682" y="378" width="22" height="34" rx="2" fill="#c9a473"/>
    <rect x="710" y="378" width="22" height="34" rx="2" fill="#d9b98b"/>
    <circle cx="762" cy="396" r="14" fill="#cf9f6a" opacity="0.85"/>
    <circle cx="800" cy="396" r="14" fill="#c19058" opacity="0.8"/>
    <rect x="840" y="378" width="24" height="34" rx="2" fill="#d9b98b"/>
