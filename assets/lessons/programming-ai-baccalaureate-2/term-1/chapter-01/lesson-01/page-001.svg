    <path d="M758,564 Q800,546 842,564 L854,662 L746,662 Z" fill="#7a8f6a"/>
    <line x1="842" y1="584" x2="856" y2="642" stroke="#dda877" stroke-width="16" stroke-linecap="round"/>
