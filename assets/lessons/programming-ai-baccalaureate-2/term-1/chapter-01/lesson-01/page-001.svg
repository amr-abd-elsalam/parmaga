      <rect x="607" y="564" width="38" height="28" rx="3" fill="#d9e7ef"/>
      <g fill="#9fb0bc">
        <circle cx="614" cy="604" r="3.4"/>
        <circle cx="626" cy="604" r="3.4"/>
        <circle cx="638" cy="604" r="3.4"/>
        <circle cx="614" cy="616" r="3.4"/>
        <circle cx="626" cy="616" r="3.4"/>
        <circle cx="638" cy="616" r="3.4"/>
        <circle cx="614" cy="628" r="3.4"/>
        <circle cx="626" cy="628" r="3.4"/>
        <circle cx="638" cy="628" r="3.4"/>
      </g>
    </g>
