      <circle cx="22" cy="27" r="6.5" fill="#cfe0ea"/>
      <line x1="6" y1="46" x2="24" y2="46"/>
      <line x1="6" y1="54" x2="24" y2="54"/>
      <line x1="40" y1="22" x2="58" y2="22"/>
      <line x1="40" y1="32" x2="58" y2="32"/>
      <line x1="40" y1="42" x2="58" y2="42"/>
      <line x1="40" y1="52" x2="58" y2="52"/>
      <line x1="0" y1="70" x2="64" y2="70"/>
