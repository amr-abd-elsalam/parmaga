  <path d="M0,210 C300,170 760,290 1080,230" fill="none" stroke="#5f3c1c" stroke-width="14" opacity="0.16"/>
  <path d="M0,1090 C340,1150 720,1010 1080,1080" fill="none" stroke="#5f3c1c" stroke-width="16" opacity="0.14"/>

  <!-- 2. paper -->
  <rect x="34" y="30" width="1012" height="1290" rx="7" fill="url(#gPaperSheet)" filter="url(#fPaperShadow)"/>

