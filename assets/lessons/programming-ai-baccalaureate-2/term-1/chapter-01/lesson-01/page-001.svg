    <line x1="52" y1="150" x2="1028" y2="150"/>
    <line x1="52" y1="190" x2="1028" y2="190"/>
    <line x1="52" y1="230" x2="1028" y2="230"/>
    <line x1="52" y1="270" x2="1028" y2="270"/>
    <line x1="52" y1="310" x2="1028" y2="310"/>
    <line x1="52" y1="350" x2="1028" y2="350"/>
    <line x1="52" y1="390" x2="1028" y2="390"/>
    <line x1="52" y1="430" x2="1028" y2="430"/>
    <line x1="52" y1="470" x2="1028" y2="470"/>
    <line x1="52" y1="510" x2="1028" y2="510"/>
    <line x1="52" y1="550" x2="1028" y2="550"/>
    <line x1="52" y1="590" x2="1028" y2="590"/>
    <line x1="52" y1="630" x2="1028" y2="630"/>
    <line x1="52" y1="670" x2="1028" y2="670"/>
    <line x1="52" y1="710" x2="1028" y2="710"/>
    <line x1="52" y1="750" x2="1028" y2="750"/>
    <line x1="52" y1="790" x2="1028" y2="790"/>
    <line x1="52" y1="830" x2="1028" y2="830"/>
    <line x1="52" y1="870" x2="1028" y2="870"/>
    <line x1="52" y1="910" x2="1028" y2="910"/>
    <line x1="52" y1="950" x2="1028" y2="950"/>
    <line x1="52" y1="990" x2="1028" y2="990"/>
    <line x1="52" y1="1030" x2="1028" y2="1030"/>
    <line x1="52" y1="1070" x2="1028" y2="1070"/>
    <line x1="52" y1="1110" x2="1028" y2="1110"/>
