<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="gWoodDesk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9773f"/>
      <stop offset="0.5" stop-color="#8f5f30"/>
      <stop offset="1" stop-color="#754c25"/>
    </linearGradient>
    <linearGradient id="gPaperSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f7f1e3"/>
    </linearGradient>
    <linearGradient id="gTitleCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5288"/>
      <stop offset="1" stop-color="#0e3157"/>
    </linearGradient>
    <filter id="fPaperShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#2b1a08" flood-opacity="0.30"/>
    </filter>
    <filter id="fCardShadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#0b2138" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- 1. simple warm background -->
