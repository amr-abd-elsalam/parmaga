    <rect x="654" y="422" width="26" height="44" rx="2" fill="#c9a473"/>
    <rect x="688" y="422" width="26" height="44" rx="2" fill="#d9b98b"/>
    <circle cx="770" cy="444" r="17" fill="#cf9f6a" opacity="0.8"/>
