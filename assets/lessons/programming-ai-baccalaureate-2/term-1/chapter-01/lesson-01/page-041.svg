<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">أصحاب المصلحة والفجوة الرقمية</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Stakeholders and the Digital Divide</text>

<!-- Opening paragraph -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أي <tspan font-weight="bold" fill="#17457f">تقنية جديدة</tspan> لا تؤثر</tspan>
  <tspan x="950" dy="40">في الجميع بالطريقة نفسها.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#17457f">new technology</tspan> does not affect</tspan>
  <tspan x="120" dy="40">everyone in the same way.</tspan>
</text>

<!-- Card header -->
<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<!-- Term 1 -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">أصحاب المصلحة</tspan> (Stakeholders) —</tspan>
  <tspan x="935" dy="40">كل من يتأثر بقرار أو تقنية،</tspan>
  <tspan x="935" dy="40">مثل <tspan fill="#c96a1b">العميل وصاحب المتجر.</tspan></tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">stakeholders</tspan> — everyone affected</tspan>
  <tspan x="140" dy="40">by a decision or technology, such as</tspan>
  <tspan x="140" dy="40"><tspan fill="#c96a1b">the customer and the shop owner.</tspan></tspan>
</text>

<!-- Term 2 -->
<text x="935" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الفجوة الرقمية</tspan> (Digital Divide) —</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">الفرق</tspan> بين من يستطيع الوصول إلى التقنية</tspan>
  <tspan x="935" dy="40">واستخدامها ومن لا يستطيع.</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">digital divide</tspan> — <tspan font-weight="bold" fill="#17457f">the gap</tspan> between</tspan>
  <tspan x="140" dy="40">people who can access and use</tspan>
  <tspan x="140" dy="40">technology and those who cannot.</tspan>
</text>
</svg>
