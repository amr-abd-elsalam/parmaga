<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الجهة المشغِّلة:</tspan> تستخدمه في مكانه</tspan>
  <tspan x="950" dy="40">الصحيح وتراقبه.</tspan>
</text>
<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Operator:</tspan> uses it in the right place</tspan>
  <tspan x="132" dy="40">and monitors it.</tspan>
</text>
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المستخدم:</tspan> لا يسلّم عقله للآلة</tspan>
  <tspan x="950" dy="40">تسليمًا كاملًا.</tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">User:</tspan> does not hand over their thinking</tspan>
  <tspan x="132" dy="40">to the machine completely.</tspan>
</text>
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">16. المساءلة Accountability</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">16. Accountability</text>
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">تعريف الكتاب: تحديد <tspan font-weight="bold" fill="#17457f">الجهات المسؤولة</tspan></tspan>
  <tspan x="935" dy="40">عن النظام وقراراته وآثاره،</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">وإمكان محاسبتها</tspan> وفق أدوارها.</tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Textbook definition: identifying the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">parties responsible</tspan> for the system,</tspan>
  <tspan x="140" dy="40">its decisions, and its effects, and</tspan>
  <tspan x="140" dy="40">being able to <tspan font-weight="bold" fill="#17457f">hold them answerable</tspan></tspan>
  <tspan x="140" dy="40">according to their roles.</tspan>
</text>
</svg>
