<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بلغتك:</tspan> لما الغلط يحصل، مين يتحاسب؟</tspan>
  <tspan x="950" dy="40">وإزاي المتضرر ياخد حقه؟</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">In your words:</tspan> when a mistake happens,</tspan>
  <tspan x="120" dy="40">who is held answerable, and how does</tspan>
  <tspan x="120" dy="40">the person harmed get justice?</tspan>
</text>
<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">تحذير:</tspan> المساءلة ليست القدرة على شرح</tspan>
  <tspan x="935" dy="40">القرار؛ فشرح القرار وظيفة XAI.</tspan>
  <tspan x="935" dy="40">المساءلة هي <tspan font-weight="bold" fill="#17457f">تحديد من يُحاسَب.</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Warning:</tspan> accountability is not the</tspan>
  <tspan x="140" dy="40">ability to explain a decision; that is</tspan>
  <tspan x="140" dy="40">the job of XAI. Accountability is</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">identifying who is held answerable.</tspan></tspan>
</text>
</svg>
