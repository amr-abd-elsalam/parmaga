<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <radialGradient id="ilGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </radialGradient>
</defs>

<!-- Icon beside the short paragraph: light bulb -->
<g transform="translate(150 352)">
  <circle cx="25" cy="20" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="17" y="35" width="16" height="11" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="0" y1="20" x2="4" y2="20" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="20" x2="50" y2="20" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="0" x2="25" y2="-4" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Thinking face beside the example paragraph -->
<g transform="translate(200 918)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">التعريف الأعمق:</tspan> أساليب توضح <tspan font-weight="bold" fill="#c0392b">العوامل</tspan></tspan>
  <tspan x="950" dy="40">التي أثرت في مخرج معين، <tspan font-weight="bold" fill="#c0392b">ووزن</tspan> كل عامل فيه.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Deeper definition:</tspan> methods that show</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">factors</tspan> behind a specific output</tspan>
  <tspan x="120" dy="40">and the <tspan font-weight="bold" fill="#c0392b">weight</tspan> of each factor.</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الصندوق الأسود</tspan> يعطيك الدرجة فقط،</tspan>
  <tspan x="950" dy="40">وXAI يعطيك <tspan font-weight="bold" fill="#2e7d32">ورقتك مصححة.</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">black box</tspan> gives only the mark;</tspan>
  <tspan x="120" dy="40">XAI gives your <tspan font-weight="bold" fill="#2e7d32">corrected paper.</tspan></tspan>
</text>

<!-- Illustration frame: drawn before the labels inside it -->
<rect x="109" y="552" width="870" height="302" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="546" width="870" height="302" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>

<!-- Illustration: one single drawing group, right to left, absolute coordinates -->
<g id="ilLoanReasons">
  <!-- frame accent -->
  <rect x="961" y="562" width="6" height="270" rx="3" fill="#2f7fb5"/>
  <!-- glow behind the loan card -->
  <circle cx="855" cy="712" r="100" fill="url(#ilGlow)"/>
  <!-- right: loan request card -->
  <rect x="774" y="610" width="170" height="216" rx="12" fill="#22303f" opacity=".18"/>
  <rect x="770" y="604" width="170" height="216" rx="12" fill="#ffffff"/>
  <rect x="770" y="604" width="170" height="40" rx="12" fill="#2f7fb5"/>
  <rect x="770" y="626" width="170" height="18" fill="#2f7fb5"/>
  <rect x="770" y="604" width="170" height="216" rx="12" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="890" cy="708" rx="20" ry="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="890" cy="696" rx="20" ry="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="890" cy="684" rx="20" ry="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="808" cy="680" r="16" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M786 720 Q808 696 830 720 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="790" y1="748" x2="912" y2="748" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="790" y1="770" x2="884" y2="770" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="790" y1="792" x2="866" y2="792" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <!-- red cross badge -->
  <circle cx="916" cy="800" r="24" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="902,792 908,786 930,808 924,814" fill="#ffffff"/>
  <polygon points="924,786 930,792 908,814 902,808" fill="#ffffff"/>
  <!-- sparkles -->
  <circle cx="720" cy="620" r="5" fill="#ffd24a"/>
  <circle cx="694" cy="800" r="4" fill="#8fc9f2"/>
  <!-- arrow pointing left -->
  <line x1="748" y1="712" x2="640" y2="712" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="622,712 642,701 642,723" fill="#c0392b"/>
  <circle cx="650" cy="660" r="4" fill="#f0c48c"/>
  <!-- bar 1: longest, top -->
  <rect x="144" y="614" width="450" height="30" rx="15" fill="#22303f" opacity=".18"/>
  <rect x="140" y="608" width="450" height="30" rx="15" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="140" y="608" width="450" height="30" rx="15" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <!-- bar 2: middle -->
  <rect x="144" y="710" width="450" height="30" rx="15" fill="#22303f" opacity=".18"/>
  <rect x="140" y="704" width="450" height="30" rx="15" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="140" y="704" width="225" height="30" rx="15" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <!-- bar 3: shortest, bottom -->
  <rect x="144" y="806" width="450" height="30" rx="15" fill="#22303f" opacity=".18"/>
  <rect x="140" y="800" width="450" height="30" rx="15" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="140" y="800" width="75" height="30" rx="15" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Illustration labels: written after the drawing -->
<text x="590" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="590" dy="0">الدخل 60%</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="140" dy="0">Income 60%</tspan>
</text>
<text x="590" y="690" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="590" dy="0">ديون سابقة 30%</tspan>
</text>
<text x="140" y="690" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="140" dy="0">Past debts 30%</tspan>
</text>
<text x="590" y="786" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="590" dy="0">مدة العمل 10%</tspan>
</text>
<text x="140" y="786" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="140" dy="0">Time in job 10%</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">مثال:</tspan> رُفض طلب قرض،</tspan>
  <tspan x="950" dy="40">فأوضح XAI الأسباب <tspan fill="#c96a1b">بالنِّسب.</tspan></tspan>
  <tspan x="950" dy="40">الآن نستطيع أن نسأل: هل هذه <tspan font-weight="bold" fill="#17457f">أسباب عادلة؟</tspan></tspan>
</text>
<text x="120" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#17457f">Example:</tspan> a loan application was</tspan>
  <tspan x="120" dy="40">rejected, and XAI showed the reasons</tspan>
  <tspan x="120" dy="40">as <tspan fill="#c96a1b">percentages.</tspan> Now we can ask:</tspan>
  <tspan x="120" dy="40">are these <tspan font-weight="bold" fill="#17457f">fair reasons?</tspan></tspan>
</text>

