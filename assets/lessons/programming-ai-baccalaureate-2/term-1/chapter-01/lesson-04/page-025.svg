<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="36" patternUnits="userSpaceOnUse">
    <line x1="0" y1="35.5" x2="1080" y2="35.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <radialGradient id="ilGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </radialGradient>
  <linearGradient id="ilDarkBox" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17457f"/>
    <stop offset="1" stop-color="#22303f"/>
  </linearGradient>
</defs>

<!-- Warning card: shadow, fill, accent -->
<rect x="109" y="128" width="870" height="260" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="122" width="870" height="260" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="138" width="6" height="228" rx="3" fill="#c96a1b"/>

<!-- Warning card icon: triangle with exclamation mark -->
<g transform="translate(130 130)">
  <polygon points="26,2 50,46 2,46" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23.5" y="16" width="5" height="16" rx="2.5" fill="#22303f"/>
  <circle cx="26" cy="39" r="3" fill="#22303f"/>
</g>

<!-- Info card: shadow, fill, accent -->
<rect x="109" y="524" width="870" height="224" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="518" width="870" height="224" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="534" width="6" height="192" rx="3" fill="#2f7fb5"/>

<!-- Info card icon: open book -->
<g transform="translate(130 526)">
  <path d="M4 6 Q14 2 26 8 L26 40 Q14 34 4 38 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 6 Q38 2 26 8 L26 40 Q38 34 48 38 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="10" y1="16" x2="20" y2="14" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="24" x2="20" y2="22" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="42" y2="16" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="22" x2="42" y2="24" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text -->
<text x="935" y="150" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فخ:</tspan> عبارة «لا مشكلة طالما النتيجة صحيحة»</tspan>
  <tspan x="935" dy="36"><tspan font-weight="bold" fill="#17457f">خاطئة؛</tspan> فنحن لا نستطيع أصلًا التأكد من صحة</tspan>
  <tspan x="935" dy="36">نتيجة لا نعرف كيف تكونت.</tspan>
</text>
<text x="140" y="258" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Trap:</tspan> &quot;There is no problem as long as</tspan>
  <tspan x="140" dy="36">the result is correct&quot; is <tspan font-weight="bold" fill="#17457f">false;</tspan></tspan>
  <tspan x="140" dy="36">we cannot even verify a result if we</tspan>
  <tspan x="140" dy="36">do not know how it was formed.</tspan>
</text>

<text x="950" y="438" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">12. الذكاء الاصطناعي القابل للتفسير (XAI)</tspan>
</text>
<text x="120" y="480" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">12. Explainable AI (XAI)</tspan>
</text>

<text x="935" y="546" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="28" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> تقنية تتيح للبشر <tspan font-weight="bold" fill="#c0392b">فهم سبب</tspan></tspan>
  <tspan x="935" dy="36">اتخاذ الذكاء الاصطناعي حكمًا معينًا.</tspan>
</text>
<text x="140" y="618" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="27" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan> technology that</tspan>
  <tspan x="140" dy="36">makes it possible for humans to</tspan>
  <tspan x="140" dy="36"><tspan font-weight="bold" fill="#c0392b">understand why</tspan> an AI made a</tspan>
  <tspan x="140" dy="36">particular judgment.</tspan>
</text>

