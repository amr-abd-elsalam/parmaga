  <circle cx="16" cy="26" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: warning triangle inside warning card -->
<g transform="translate(130 534)">
  <polygon points="26,4 50,46 2,46" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="23" y="16" width="6" height="16" rx="3" fill="#22303f"/>
