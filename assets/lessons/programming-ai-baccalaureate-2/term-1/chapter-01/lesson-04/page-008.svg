  <rect x="125" y="830" width="830" height="420" rx="24" fill="url(#ilSky)"/>
  <circle cx="190" cy="872" r="13" fill="#ffffff"/>
  <circle cx="210" cy="866" r="17" fill="#ffffff"/>
  <circle cx="232" cy="874" r="11" fill="#ffffff"/>
  <circle cx="850" cy="870" r="12" fill="#ffffff"/>
  <circle cx="870" cy="864" r="16" fill="#ffffff"/>
  <circle cx="890" cy="872" r="11" fill="#ffffff"/>

  <!-- Arch -->
  <path d="M168 1004 Q540 786 912 1004 L884 1010 Q540 818 196 1010 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shield -->
  <g transform="translate(4 6)">
    <path d="M540 838 L592 856 L592 900 Q592 938 540 958 Q488 938 488 900 L488 856 Z" fill="#22303f" opacity=".18"/>
  </g>
  <path d="M540 838 L592 856 L592 900 Q592 938 540 958 Q488 938 488 900 L488 856 Z" fill="url(#ilShield)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M516 900 L534 918 L566 882" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Circle shadows -->
  <circle cx="856" cy="1076" r="58" fill="#22303f" opacity=".18"/>
  <circle cx="652" cy="1076" r="58" fill="#22303f" opacity=".18"/>
  <circle cx="436" cy="1076" r="58" fill="#22303f" opacity=".18"/>
  <circle cx="232" cy="1076" r="58" fill="#22303f" opacity=".18"/>

  <!-- Circles -->
  <circle cx="852" cy="1070" r="58" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="852" cy="1070" r="48" fill="#ffffff"/>
  <circle cx="648" cy="1070" r="58" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="648" cy="1070" r="48" fill="#ffffff"/>
  <circle cx="432" cy="1070" r="58" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="432" cy="1070" r="48" fill="#ffffff"/>
  <circle cx="228" cy="1070" r="58" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="228" cy="1070" r="48" fill="#ffffff"/>

  <!-- Arrows right to left -->
  <path d="M784 1070 L722 1070" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="726,1062 712,1070 726,1078" fill="#c0392b"/>
  <path d="M580 1070 L514 1070" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="518,1062 504,1070 518,1078" fill="#c0392b"/>
  <path d="M364 1070 L302 1070" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="306,1062 292,1070 306,1078" fill="#c0392b"/>

  <!-- Stage 1: pencil with ruler -->
  <g transform="translate(852 1070)">
    <g transform="rotate(-20)">
      <rect x="-36" y="4" width="72" height="18" rx="2" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
      <path d="M-26 4 L-26 12 M-14 4 L-14 10 M-2 4 L-2 12 M10 4 L10 10 M22 4 L22 12" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="rotate(40)">
      <rect x="-6" y="-40" width="12" height="8" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
      <rect x="-6" y="-32" width="12" height="44" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
      <polygon points="-6,12 6,12 0,26" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="-2,20 2,20 0,26" fill="#22303f"/>
    </g>
  </g>

  <!-- Stage 2: stack of data cards -->
  <g transform="translate(648 1070)">
    <rect x="-32" y="-30" width="50" height="34" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-24" y="-20" width="50" height="34" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-16" y="-10" width="50" height="34" rx="4" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
    <path d="M-8 2 L24 2 M-8 12 L14 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stage 3: gear -->
  <g transform="translate(432 1070)">
    <g transform="rotate(0)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(45)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(90)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(135)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(180)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(225)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(270)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(315)"><rect x="-6" y="-33" width="12" height="13" rx="2" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <circle cx="0" cy="0" r="24" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Stage 4: hand pointing at a screen -->
  <g transform="translate(228 1070)">
    <rect x="-40" y="-30" width="46" height="34" rx="4" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
    <path d="M-32 -20 L-8 -20 M-32 -10 L-16 -10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-21" y="4" width="8" height="10" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
    <rect x="-29" y="14" width="24" height="6" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2"/>
    <rect x="6" y="-6" width="20" height="8" rx="4" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
    <rect x="20" y="-10" width="18" height="22" rx="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
    <rect x="36" y="-12" width="8" height="26" rx="3" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  </g>
</g>

<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">2. أخلاقيات الذكاء الاصطناعي AI Ethics</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">2. AI Ethics</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> تطبيق أسئلة <tspan font-weight="bold" fill="#17457f">الأخلاق</tspan></tspan>
  <tspan x="935" dy="40">على كل مراحل النظام: تصميمه، وتدريبه،</tspan>
  <tspan x="935" dy="40">وتشغيله، واستخدامه.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> applying <tspan font-weight="bold" fill="#17457f">ethical</tspan></tspan>
  <tspan x="140" dy="40">questions to every stage of a system:</tspan>
  <tspan x="140" dy="40">design, training, operation, and use.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فخ:</tspan> الآلة ليست «شريرة» ولا «أخلاقية»؛</tspan>
  <tspan x="935" dy="40">فليس لها نية. الأخلاق <tspan font-weight="bold" fill="#17457f">مسؤولية البشر</tspan></tspan>
  <tspan x="935" dy="40">الذين يصنعونها ويستخدمونها.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Trap:</tspan> A machine is not "evil" or</tspan>
  <tspan x="140" dy="40">"ethical"; it has no intention.</tspan>
  <tspan x="140" dy="40">Ethics is the <tspan font-weight="bold" fill="#17457f">responsibility</tspan></tspan>
  <tspan x="140" dy="40">of the people who build and use it.</tspan>
</text>

<!-- Illustration labels -->
<text x="887" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تصميم</text>
<text x="800" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Design</text>
<text x="683" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تدريب</text>
<text x="578" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Training</text>
<text x="467" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">تشغيل</text>
<text x="354" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Operation</text>
<text x="276" y="1194" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">استخدام</text>
<text x="202" y="1234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Use</text>
</svg>
