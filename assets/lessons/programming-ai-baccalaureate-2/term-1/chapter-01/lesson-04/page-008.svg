<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6634"/>
      <stop offset="0.55" stop-color="#835227"/>
      <stop offset="1" stop-color="#6b421e"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodBg)"/>
  <path d="M0 250 C 300 210, 760 300, 1080 240" fill="none" stroke="#5e3a1a" stroke-width="14" opacity="0.18"/>
  <path d="M0 980 C 340 1040, 740 930, 1080 1000" fill="none" stroke="#5e3a1a" stroke-width="12" opacity="0.15"/>

  <rect x="42" y="36" width="1012" height="1304" rx="10" fill="#4a2d13" opacity="0.28"/>
  <rect x="34" y="26" width="1012" height="1304" rx="10" fill="url(#paperFill)"/>

  <g stroke="#bcd7ea" stroke-width="1.2" opacity="0.55">
    <line x1="82" y1="110" x2="998" y2="110"/>
    <line x1="82" y1="146" x2="998" y2="146"/>
    <line x1="82" y1="182" x2="998" y2="182"/>
    <line x1="82" y1="218" x2="998" y2="218"/>
    <line x1="82" y1="254" x2="998" y2="254"/>
    <line x1="82" y1="290" x2="998" y2="290"/>
    <line x1="82" y1="326" x2="998" y2="326"/>
    <line x1="82" y1="362" x2="998" y2="362"/>
    <line x1="82" y1="398" x2="998" y2="398"/>
    <line x1="82" y1="434" x2="998" y2="434"/>
    <line x1="82" y1="470" x2="998" y2="470"/>
    <line x1="82" y1="506" x2="998" y2="506"/>
    <line x1="82" y1="542" x2="998" y2="542"/>
    <line x1="82" y1="578" x2="998" y2="578"/>
    <line x1="82" y1="614" x2="998" y2="614"/>
    <line x1="82" y1="650" x2="998" y2="650"/>
    <line x1="82" y1="686" x2="998" y2="686"/>
    <line x1="82" y1="722" x2="998" y2="722"/>
    <line x1="82" y1="758" x2="998" y2="758"/>
    <line x1="82" y1="794" x2="998" y2="794"/>
    <line x1="82" y1="830" x2="998" y2="830"/>
    <line x1="82" y1="866" x2="998" y2="866"/>
    <line x1="82" y1="902" x2="998" y2="902"/>
    <line x1="82" y1="938" x2="998" y2="938"/>
    <line x1="82" y1="974" x2="998" y2="974"/>
    <line x1="82" y1="1010" x2="998" y2="1010"/>
    <line x1="82" y1="1046" x2="998" y2="1046"/>
    <line x1="82" y1="1082" x2="998" y2="1082"/>
    <line x1="82" y1="1118" x2="998" y2="1118"/>
    <line x1="82" y1="1154" x2="998" y2="1154"/>
  </g>

  <rect x="67" y="62" width="946" height="1246" rx="6" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <text x="540" y="136"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="54"
        font-weight="bold"
        fill="#154a86">توقف وفكّر</text>

  <text x="540" y="182"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#2a5d9f">Pause and Think</text>

  <line x1="400" y1="202" x2="680" y2="202" stroke="#7aa6cf" stroke-width="2"/>

  <rect x="95" y="228" width="890" height="464" rx="14" fill="#fdf6d6" stroke="#d6bf72" stroke-width="2"/>
  <line x1="540" y1="248" x2="540" y2="672" stroke="#dcc98a" stroke-width="1.5"/>

  <text x="976" y="274"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#154a86">الموقف الأول: التعرف على الوجه</text>

  <text x="959" y="320"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="959" dy="0">عند استخدام تقنية التعرف على</tspan>
    <tspan x="959" dy="36">الوجه في الأماكن العامة، قد</tspan>
    <tspan x="959" dy="36">تتحسن السلامة والراحة، لكن قد</tspan>
    <tspan x="959" dy="36">تظهر مخاوف تتعلق بالخصوصية.</tspan>
  </text>

  <circle cx="940" cy="461" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="940" y="470"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#c0392b">؟</text>

  <text x="915" y="470"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#154a86">السؤال:</text>

  <text x="959" y="512"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="959" dy="0">كيف يمكن تحقيق التوازن بين</tspan>
    <tspan x="959" dy="36">الراحة والسلامة وحماية</tspan>
    <tspan x="959" dy="36">الخصوصية؟ وما المبدأ الأخلاقي</tspan>
    <tspan x="959" dy="36">الأكثر ارتباطًا برأيك؟</tspan>
  </text>

  <text x="121" y="274"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#17385c">Situation 1: Face Recognition</text>

  <text x="121" y="318"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="121" dy="0">When face-recognition</tspan>
    <tspan x="121" dy="32">technology is used in public</tspan>
    <tspan x="121" dy="32">spaces, safety and convenience</tspan>
    <tspan x="121" dy="32">may improve, but privacy</tspan>
    <tspan x="121" dy="32">concerns may arise.</tspan>
  </text>

  <circle cx="134" cy="480" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="134" y="488"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#c0392b">?</text>

  <text x="155" y="488"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#17385c">Question:</text>

  <text x="121" y="526"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="121" dy="0">How can convenience and safety</tspan>
    <tspan x="121" dy="32">be balanced with privacy</tspan>
    <tspan x="121" dy="32">protection? Which ethical</tspan>
    <tspan x="121" dy="32">principle is most closely</tspan>
    <tspan x="121" dy="32">related?</tspan>
  </text>

  <rect x="95" y="728" width="890" height="368" rx="14" fill="#fdf6d6" stroke="#d6bf72" stroke-width="2"/>
  <line x1="540" y1="748" x2="540" y2="1076" stroke="#dcc98a" stroke-width="1.5"/>

  <text x="959" y="782"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#154a86">الموقف الثاني: قرار غير مفسّر</text>

  <text x="959" y="832"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="959" dy="0">إذا لم يستطع أحد تفسير سبب رفض</tspan>
    <tspan x="959" dy="36">نظام ذكاء اصطناعي لطلب توظيف</tspan>
    <tspan x="959" dy="36">شخص ما، فهل يُعد ذلك عادلًا؟</tspan>
  </text>

  <circle cx="940" cy="945" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="940" y="954"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#c0392b">؟</text>

  <text x="915" y="954"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#154a86">السؤال:</text>

  <text x="959" y="998"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="959" dy="0">ما مبدأ أخلاقيات الذكاء</tspan>
    <tspan x="959" dy="36">الاصطناعي الغائب؟</tspan>
  </text>

  <text x="121" y="782"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#17385c">
    <tspan x="121" dy="0">Situation 2:</tspan>
    <tspan x="121" dy="32">An Unexplained Decision</tspan>
  </text>

  <text x="121" y="862"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="121" dy="0">If no one can explain why an</tspan>
    <tspan x="121" dy="32">AI system rejected someone&#8217;s</tspan>
    <tspan x="121" dy="32">job application, is that fair?</tspan>
  </text>

  <circle cx="134" cy="968" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="134" y="976"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#c0392b">?</text>

  <text x="155" y="976"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#17385c">Question:</text>

  <text x="121" y="1018"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="121" dy="0">Which principle of AI ethics</tspan>
    <tspan x="121" dy="32">is missing?</tspan>
  </text>

</svg>
