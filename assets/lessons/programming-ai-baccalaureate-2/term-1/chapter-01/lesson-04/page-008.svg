<rect x="961" y="258" width="6" height="216" rx="3" fill="#2f7fb5"/>

<!-- Warning card -->
<rect x="105" y="522" width="870" height="288" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="538" width="6" height="256" rx="3" fill="#c96a1b"/>

<!-- Icon: chip beside English header -->
<g transform="translate(380 176)">
  <path d="M14 0 L14 8 M22 0 L22 8 M30 0 L30 8 M14 36 L14 44 M22 36 L22 44 M30 36 L30 44 M0 14 L8 14 M0 22 L8 22 M0 30 L8 30 M36 14 L44 14 M36 22 L44 22 M36 30 L44 30" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
