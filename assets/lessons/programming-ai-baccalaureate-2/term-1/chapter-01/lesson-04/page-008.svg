<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Card shadows -->
<rect x="109" y="248" width="870" height="248" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="528" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>

<!-- Info card -->
