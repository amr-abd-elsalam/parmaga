<!-- Bullets -->
<circle cx="966" cy="544" r="6" fill="#c0392b"/>
<circle cx="966" cy="744" r="6" fill="#c0392b"/>

<!-- Paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخصوصية</tspan> ليست إخفاء كل شيء؛ تعطي رقمك</tspan>
  <tspan x="950" dy="40">لصديقك، لكنك لا تريده أن يبيعه لشركة</tspan>
  <tspan x="950" dy="40">إعلانات. الخصوصية أن <tspan font-weight="bold" fill="#17457f">تختار أنت.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Privacy</tspan> is not hiding everything; you</tspan>
  <tspan x="120" dy="40">give your number to a friend, but you do</tspan>
  <tspan x="120" dy="40">not want it sold to an ad company.</tspan>
  <tspan x="120" dy="40">Privacy means <tspan font-weight="bold" fill="#17457f">you choose.</tspan></tspan>
</text>

<!-- Header -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">قضيتا الخصوصية في الدرس</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Lesson's Two Privacy Issues</tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المراقبة بالتعرف على الوجه:</tspan> كاميرات في</tspan>
  <tspan x="950" dy="40">الأماكن العامة تتعرف على الأفراد وتتبعهم.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Surveillance through face recognition:</tspan></tspan>
  <tspan x="120" dy="40">cameras in public spaces identify and</tspan>
  <tspan x="120" dy="40">track individuals.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الجمع الجماعي للبيانات:</tspan> كميات ضخمة من</tspan>
  <tspan x="950" dy="40">سلوكك على الإنترنت تُجمع وتُحلَّل.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Mass data collection:</tspan> huge amounts of</tspan>
  <tspan x="120" dy="40">your online behavior are collected and</tspan>
  <tspan x="120" dy="40">analyzed.</tspan>
</text>

