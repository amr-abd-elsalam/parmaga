<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">تحدي النظارة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Glasses Challenge</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل أنك نظام <tspan font-weight="bold" fill="#17457f">ذكاء اصطناعي،</tspan></tspan>
  <tspan x="950" dy="40">ومهمتك أن تتنبأ بالطالب المتفوق.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine you are an <tspan font-weight="bold" fill="#17457f">AI.</tspan></tspan>
  <tspan x="120" dy="40">Your job: predict the top student.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هذه <tspan font-weight="bold" fill="#c0392b">بيانات تدريبك:</tspan> عشرة طلاب</tspan>
  <tspan x="950" dy="40">متفوقين من دفعة سابقة.</tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Here is your <tspan font-weight="bold" fill="#c0392b">training data:</tspan></tspan>
  <tspan x="120" dy="40">ten top students from a previous year.</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">سؤال التحدي</text>
<text x="140" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Challenge Question</text>
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">طالبان جديدان: أحدهما يلبس نظارة والآخر لا.</tspan>
  <tspan x="935" dy="40">مَن سيتفوق في رأيك؟</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Two new students: one wears glasses,</tspan>
  <tspan x="140" dy="40">the other does not.</tspan>
  <tspan x="140" dy="40">Who do you think will excel?</tspan>
</text>
</svg>
