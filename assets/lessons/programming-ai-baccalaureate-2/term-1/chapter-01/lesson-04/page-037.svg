<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">المبادئ الأربعة في الملعب</tspan>
</text>

<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">The Four Principles on the Pitch</tspan>
</text>

<!-- Header row -->
<text x="965" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="965" dy="0">المبدأ</tspan>
</text>
<text x="655" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="655" dy="0">Principle</tspan>
</text>
<text x="615" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="615" dy="0">في المباراة</tspan>
</text>
<text x="115" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">In the match</tspan>
</text>

<!-- Row 1 -->
<text x="965" y="374" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="965" dy="0">العدالة</tspan>
</text>
<text x="655" y="414" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="655" dy="0">Fairness</tspan>
</text>
<text x="615" y="374" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="615" dy="0">الحكم لا ينحاز لأي فريق</tspan>
</text>
<text x="115" y="414" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">The referee</tspan>
  <tspan x="115" dy="40">favors no team</tspan>
</text>

<!-- Row 2 -->
<text x="965" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="965" dy="0">الشفافية</tspan>
</text>
<text x="655" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="655" dy="0">Transparency</tspan>
</text>
<text x="615" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="615" dy="0">الـ VAR يعرض الإعادة</tspan>
  <tspan x="615" dy="40">على الجمهور</tspan>
</text>
<text x="115" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">VAR shows the replay</tspan>
  <tspan x="115" dy="40">to the crowd</tspan>
</text>

<!-- Row 3 -->
<text x="965" y="694" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="965" dy="0">حماية الخصوصية</tspan>
</text>
<text x="655" y="734" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="655" dy="0">Privacy</tspan>
  <tspan x="655" dy="40">protection</tspan>
</text>
<text x="615" y="694" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="615" dy="0">الكاميرات لا تصوّر</tspan>
  <tspan x="615" dy="40">غرف تبديل الملابس</tspan>
</text>
<text x="115" y="774" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Cameras do not film</tspan>
  <tspan x="115" dy="40">changing rooms</tspan>
</text>

<!-- Row 4 -->
<text x="965" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="965" dy="0">المساءلة</tspan>
</text>
<text x="655" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="655" dy="0">Accountability</tspan>
</text>
<text x="615" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="615" dy="0">الاتحاد يحاسب الحكم</tspan>
  <tspan x="615" dy="40">إذا أخطأ</tspan>
</text>
<text x="115" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">The federation holds</tspan>
  <tspan x="115" dy="40">the referee answerable</tspan>
</text>
</svg>
