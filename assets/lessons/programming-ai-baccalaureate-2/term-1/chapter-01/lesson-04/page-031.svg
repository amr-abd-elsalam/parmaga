<!-- Text layer -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">الظلم أن تكون التفرقة بسبب <tspan font-weight="bold" fill="#c0392b">سمة محمية</tspan></tspan>
  <tspan x="950" dy="40">لا علاقة لها بالقرار.</tspan>
</text>

<text x="120"
      y="234"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">Unfairness is treating people differently</tspan>
  <tspan x="120" dy="40">because of a <tspan font-weight="bold" fill="#c0392b">protected attribute</tspan></tspan>
  <tspan x="120" dy="40">that has nothing to do with the decision.</tspan>
</text>

<text x="935"
      y="394"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="935" dy="0">للمتميزين فقط</tspan>
</text>

<text x="140"
      y="434"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="140" dy="0">For Advanced Thinkers</tspan>
</text>

<text x="935"
      y="474"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">هل العدالة أن نعامل الجميع بالطريقة</tspan>
  <tspan x="935" dy="40">نفسها، أم أن نضمن نتائج متقاربة</tspan>
  <tspan x="935" dy="40">بين الفئات؟ العلماء أنفسهم <tspan font-weight="bold" fill="#17457f">يختلفون،</tspan></tspan>
  <tspan x="935" dy="40">ولا يمكن غالبًا تحقيق كل التعريفات معًا.</tspan>
</text>

<text x="140"
      y="634"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Is fairness treating everyone the</tspan>
  <tspan x="140" dy="40">same way, or making sure results are</tspan>
  <tspan x="140" dy="40">similar across groups? Experts</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">disagree,</tspan> and often all definitions</tspan>
  <tspan x="140" dy="40">cannot be met at once.</tspan>
</text>
</svg>
