<text x="120"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">15. Responsibility</tspan>
</text>

<text x="935"
      y="274"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">تعريف الكتاب: <tspan font-weight="bold" fill="#17457f">تحديد أدوار وواجبات</tspan> الأطراف</tspan>
  <tspan x="935" dy="40">المرتبطة بتطوير النظام وتشغيله واستخدامه،</tspan>
  <tspan x="935" dy="40">ولا يوجد توزيع واحد يصلح لكل السياقات.</tspan>
</text>

<text x="140"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Textbook definition: defining the</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">roles and duties</tspan> of those who develop,</tspan>
  <tspan x="140" dy="40">operate, and use the system; no single</tspan>
  <tspan x="140" dy="40">distribution fits all contexts.</tspan>
</text>

<text x="950"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">بلغتك: كل واحد واجبه إيه؟</tspan>
</text>

<text x="120"
      y="634"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In your words: what is each person's duty?</tspan>
</text>

<text x="950"
      y="1074"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المطوّر:</tspan> يختبر النظام ويفحص البيانات.</tspan>
</text>

<text x="132"
      y="1114"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Developer:</tspan> tests the system</tspan>
  <tspan x="132" dy="40">and checks the data.</tspan>
</text>
