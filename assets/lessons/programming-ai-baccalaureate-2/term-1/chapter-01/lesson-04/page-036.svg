  <polygon points="25,1 30.9,16.9 47.8,17.6 34.5,28.1 39.1,44.4 25,35 10.9,44.4 15.5,28.1 2.2,17.6 19.1,16.9" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
