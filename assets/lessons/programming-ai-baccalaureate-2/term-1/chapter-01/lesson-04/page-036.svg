<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">أدوات التذكر</text>

<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Memory Tools</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">ثلاث جمل تحل نصف الامتحان</tspan>
</text>

<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Three Sentences That</tspan>
  <tspan x="120" dy="40">Solve Half the Exam</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">البيانات المتحيزة</tspan> تُنتج قرارات متحيزة.</tspan>
</text>

<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Biased data</tspan> produces biased decisions.</tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#2e7d32">النتيجة الصحيحة</tspan> لا تكفي؛</tspan>
  <tspan x="950" dy="40">لا بد أن نفهم <tspan font-weight="bold" fill="#17457f">كيف جاءت.</tspan></tspan>
</text>

<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">A <tspan font-weight="bold" fill="#2e7d32">correct result</tspan> is not enough;</tspan>
  <tspan x="132" dy="40">we must understand <tspan font-weight="bold" fill="#17457f">how it was reached.</tspan></tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">المسؤولية</tspan> لم تُحدَّد بعد بوضوح،</tspan>
  <tspan x="950" dy="40">وتختلف باختلاف <tspan font-weight="bold" fill="#17457f">الطرف والسياق.</tspan></tspan>
</text>

<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">Responsibility</tspan> is not yet clearly</tspan>
  <tspan x="132" dy="40">defined; it differs by <tspan font-weight="bold" fill="#17457f">party and context.</tspan></tspan>
</text>
</svg>
