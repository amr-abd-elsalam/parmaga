<circle cx="114" cy="864" r="6" fill="#c0392b"/>
<circle cx="966" cy="984" r="6" fill="#c0392b"/>
<circle cx="114" cy="1064" r="6" fill="#c0392b"/>

<!-- Icon: warning triangle beside header -->
<g transform="translate(130 108)">
  <polygon points="22,2 44,42 0,42" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="19" y="13" width="6" height="15" rx="3" fill="#22303f"/>
  <circle cx="22" cy="35" r="3.5" fill="#22303f"/>
</g>

<!-- Thinking face beside paragraph -->
