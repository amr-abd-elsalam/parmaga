  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: four doors of bias -->
<g>
  <rect x="125" y="378" width="830" height="376" rx="24" fill="url(#ilSky)"/>
  <path d="M125 700 L955 700 L955 730 Q955 754 931 754 L149 754 Q125 754 125 730 Z" fill="#e8dfd1"/>
  <circle cx="165" cy="420" r="11" fill="#ffffff"/>
  <circle cx="183" cy="413" r="15" fill="#ffffff"/>
  <circle cx="202" cy="421" r="10" fill="#ffffff"/>
  <circle cx="240" cy="452" r="5" fill="#ffd24a"/>
  <circle cx="160" cy="540" r="5" fill="#ffd24a"/>

  <!-- House shadow -->
  <rect x="274" y="482" width="672" height="224" fill="#22303f" opacity=".18"/>
  <!-- Wall -->
  <rect x="270" y="476" width="672" height="224" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Roof -->
  <polygon points="254,478 606,396 958,478" fill="url(#ilRoof)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="606" cy="446" r="12" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

  <!-- Plaques -->
  <rect x="780" y="482" width="152" height="90" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="614" y="482" width="152" height="90" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="448" y="482" width="152" height="90" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <rect x="282" y="482" width="152" height="90" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>

  <!-- Door 1 (right): data -->
  <rect x="811" y="582" width="90" height="118" rx="8" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="831" y="596" width="50" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <circle cx="884" cy="646" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <!-- Door 2: design -->
  <rect x="645" y="582" width="90" height="118" rx="8" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="665" y="596" width="50" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <circle cx="718" cy="646" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <!-- Door 3: use -->
  <rect x="479" y="582" width="90" height="118" rx="8" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="499" y="596" width="50" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <circle cx="552" cy="646" r="5" fill="#17457f" stroke="#22303f" stroke-width="2"/>
  <!-- Door 4 (left): context -->
  <rect x="313" y="582" width="90" height="118" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="333" y="596" width="50" height="24" rx="4" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <circle cx="386" cy="646" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>

  <!-- Footprints toward the doors -->
  <ellipse cx="262" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="296" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="330" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="364" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="398" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="432" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="466" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="500" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="534" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="568" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="602" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="636" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="670" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="704" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="738" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="772" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="806" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="840" cy="724" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="874" cy="732" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="856" cy="710" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="690" cy="710" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="524" cy="710" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>
  <ellipse cx="358" cy="710" rx="6" ry="3.5" fill="#17457f" opacity=".35"/>

  <!-- Friendly cartoon thief (bottom left, tiptoeing) -->
  <ellipse cx="200" cy="742" rx="44" ry="6" fill="#22303f" opacity=".18"/>
  <g transform="translate(184 700) rotate(20)">
    <rect x="-6" y="0" width="12" height="34" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="translate(208 700) rotate(-30)">
    <rect x="-6" y="0" width="12" height="34" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <ellipse cx="168" cy="735" rx="10" ry="5" fill="#22303f"/>
  <ellipse cx="230" cy="733" rx="10" ry="5" fill="#22303f"/>
  <g transform="translate(176 660) rotate(40)">
    <rect x="-5" y="0" width="10" height="30" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="translate(224 660) rotate(-60)">
    <rect x="-5" y="0" width="10" height="30" rx="5" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <path d="M172 704 Q168 654 200 648 Q232 654 228 704 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M178 664 L222 664 M175 678 L225 678 M174 692 L226 692" fill="none" stroke="#17457f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="157" cy="683" r="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="250" cy="675" r="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="200" cy="624" r="22" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M178 616 Q180 596 200 596 Q220 596 222 616 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="200" cy="594" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <rect x="180" y="616" width="40" height="12" rx="6" fill="#22303f"/>
  <circle cx="192" cy="622" r="3" fill="#ffffff"/>
  <circle cx="208" cy="622" r="3" fill="#ffffff"/>
  <path d="M193 636 Q200 641 207 636" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Bottom icon row -->
<g transform="translate(352 1194)">
  <path d="M16 24 L16 16 A12 12 0 0 1 40 16 L40 24" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="8" y="24" width="40" height="30" rx="5" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="28" cy="37" r="4" fill="#22303f"/>
</g>
<g transform="translate(512 1194)">
  <rect x="14" y="0" width="36" height="46" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="4" y="8" width="36" height="46" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M11 20 L33 20 M11 30 L33 30 M11 40 L25 40" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>
<g transform="translate(672 1194)">
  <path d="M28 2 L50 10 L50 28 Q50 46 28 54 Q6 46 6 28 L6 10 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M18 28 L25 35 L38 21" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">أبواب التحيز الأربعة</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The Four Doors of Bias</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تخيّل <tspan font-weight="bold" fill="#c0392b">التحيز</tspan> لصًا يستطيع دخول</tspan>
  <tspan x="950" dy="40">البيت من <tspan font-weight="bold" fill="#17457f">أربعة أبواب:</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Imagine <tspan font-weight="bold" fill="#c0392b">bias</tspan> as a thief who can enter</tspan>
  <tspan x="120" dy="40">a house through <tspan font-weight="bold" fill="#17457f">four doors:</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="917" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">البيانات</text>
<text x="824" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Data</text>
<text x="740" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">التصميم</text>
<text x="642" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Design</text>
<text x="586" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">الاستخدام</text>
<text x="497" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Use</text>
<text x="400" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">السياق</text>
<text x="304" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Context</text>

<!-- Bullet 1 -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">باب البيانات:</tspan> <tspan font-weight="bold" fill="#17457f">بيانات ناقصة</tspan> عن فئة،</tspan>
  <tspan x="950" dy="40">أو بيانات تحمل ظلمًا قديمًا.</tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The data door:</tspan> <tspan font-weight="bold" fill="#17457f">missing data</tspan> about a</tspan>
  <tspan x="132" dy="40">group, or data that carries past</tspan>
  <tspan x="132" dy="40">unfairness.</tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">باب التصميم:</tspan> متغيرات غير مناسبة،</tspan>
  <tspan x="950" dy="40">أو <tspan font-weight="bold" fill="#17457f">متغير بديل،</tspan> أو تصميم النموذج نفسه.</tspan>
</text>
<text x="132" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The design door:</tspan> unsuitable variables,</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">a proxy variable,</tspan> or the model's</tspan>
  <tspan x="132" dy="40">design itself.</tspan>
</text>
</svg>
