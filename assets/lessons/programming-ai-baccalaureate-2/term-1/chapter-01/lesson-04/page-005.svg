  <text x="952"
        y="174"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#123a63">
    <tspan x="990" dy="0">الذكاء الاصطناعي القابل للتفسير والمسؤولية</tspan>
  </text>

  <text x="486"
        y="216"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#123a63">
    <tspan x="486" dy="0">Explainable AI and Responsibility</tspan>
  </text>

  <text x="952"
        y="678"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="952" dy="0">يساعد الذكاء الاصطناعي القابل للتفسير Explainable AI (XAI)</tspan>
    <tspan x="952" dy="42">البشر على فهم سبب اتخاذ النظام قرارًا معينًا. وعندما تكون</tspan>
    <tspan x="952" dy="42">عملية اتخاذ القرار غامضة، يصعب التحقق من صحة النتيجة.</tspan>
    <tspan x="952" dy="42">كما تظهر مسألة تحديد المسؤول عن القرار الخاطئ، سواء كان</tspan>
    <tspan x="952" dy="42">المطور أو المستخدم أو المشغّل.</tspan>
  </text>

  <text x="118"
        y="888"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="118" dy="0">Explainable AI (XAI) helps humans understand</tspan>
    <tspan x="118" dy="42">why an AI system made a particular decision.</tspan>
    <tspan x="118" dy="42">When the decision-making process is opaque, it</tspan>
    <tspan x="118" dy="42">is difficult to verify whether the result is</tspan>
    <tspan x="118" dy="42">correct. This also raises the question of</tspan>
    <tspan x="118" dy="42">responsibility for an incorrect decision: the</tspan>
    <tspan x="118" dy="42">developer, user, or operator.</tspan>
  </text>

</svg>
