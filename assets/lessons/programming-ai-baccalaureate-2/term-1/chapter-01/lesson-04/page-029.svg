      fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الشفافية</tspan> هي لائحة الامتحان المعلنة</tspan>
  <tspan x="935" dy="40">للجميع، <tspan font-weight="bold" fill="#c0392b">وXAI</tspan> هو تصحيح ورقتك أنت.</tspan>
</text>

<text x="140"
      y="234"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Transparency</tspan> is the exam rules</tspan>
  <tspan x="140" dy="40">announced to everyone; <tspan font-weight="bold" fill="#c0392b">XAI</tspan> is</tspan>
  <tspan x="140" dy="40">the correction of your own paper.</tspan>
</text>

<text x="935"
