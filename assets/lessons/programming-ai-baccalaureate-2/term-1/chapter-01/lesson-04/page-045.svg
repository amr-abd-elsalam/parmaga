<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">ورقة ليلة الامتحان</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Exam-Night Sheet</text>

<!-- Section header -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">فخاخ تتكرر في الأسئلة</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Traps That Keep Coming Back</text>

<!-- Header row -->
<text x="965" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">العبارة</text>
<text x="607" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Statement</text>
<text x="570" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">الحكم</text>
<text x="428" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Verdict</text>
<text x="393" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">السبب</text>
<text x="112" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">Reason</text>

<!-- Row 1 -->
<text x="965" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">سرعة المعالجة</tspan>
  <tspan x="965" dy="40">البطيئة سبب <tspan font-weight="bold" fill="#c0392b">للتحيز</tspan></tspan>
</text>
<text x="607" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="607" dy="0">Slow processing</tspan>
  <tspan x="607" dy="40">causes <tspan font-weight="bold" fill="#c0392b">bias</tspan></tspan>
</text>
<text x="510" y="520" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="510" dy="0">×</tspan>
</text>
<text x="393" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="393" dy="0">السرعة لا علاقة</tspan>
  <tspan x="393" dy="40">لها <tspan font-weight="bold" fill="#17457f">بالعدل</tspan></tspan>
</text>
<text x="112" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">Speed is</tspan>
  <tspan x="112" dy="40">unrelated to</tspan>
  <tspan x="112" dy="40"><tspan font-weight="bold" fill="#17457f">fairness</tspan></tspan>
</text>

<!-- Row 2 -->
<text x="965" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">لا مشكلة في</tspan>
  <tspan x="965" dy="40"><tspan font-weight="bold" fill="#c0392b">الصندوق الأسود</tspan> إذا</tspan>
  <tspan x="965" dy="40">صحت النتيجة</tspan>
</text>
<text x="607" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="607" dy="0">A <tspan font-weight="bold" fill="#c0392b">black box</tspan> is</tspan>
  <tspan x="607" dy="40">fine if the result</tspan>
  <tspan x="607" dy="40">is correct</tspan>
</text>
<text x="510" y="770" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="510" dy="0">×</tspan>
</text>
<text x="393" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="393" dy="0">لا نستطيع</tspan>
  <tspan x="393" dy="40">التحقق منها</tspan>
</text>
<text x="112" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="112" dy="0">We cannot</tspan>
  <tspan x="112" dy="40">verify it</tspan>
</text>
</svg>
