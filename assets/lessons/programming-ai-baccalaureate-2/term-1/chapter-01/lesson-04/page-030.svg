<!-- Text layer -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="950" dy="0">14. العدالة Fairness</tspan>
</text>

<text x="120"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">14. Fairness</tspan>
</text>

<text x="935"
      y="274"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">تعريف الكتاب: <tspan font-weight="bold" fill="#17457f">عدم التمييز ظلمًا</tspan></tspan>
  <tspan x="935" dy="40">ضد أي شخص أو مجموعة بعينها.</tspan>
</text>

<text x="140"
      y="354"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Textbook definition: <tspan font-weight="bold" fill="#17457f">not unjustly</tspan></tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">discriminating</tspan> against any particular</tspan>
  <tspan x="140" dy="40">person or group.</tspan>
</text>

<text x="950"
      y="514"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">كلمة السر <tspan font-weight="bold" fill="#c0392b">«ظلمًا»:</tspan> ليست كل تفرقة ظلمًا.</tspan>
  <tspan x="950" dy="40">المستشفى يقدّم الحالة الأخطر، وهذه تفرقة</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#2e7d32">بمبرر مشروع.</tspan></tspan>
</text>

<text x="120"
      y="634"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">The key word is <tspan font-weight="bold" fill="#c0392b">"unjustly":</tspan> not every</tspan>
  <tspan x="120" dy="40">difference in treatment is unfair.</tspan>
  <tspan x="120" dy="40">A hospital treats the most serious case</tspan>
  <tspan x="120" dy="40">first; that has a <tspan font-weight="bold" fill="#2e7d32">valid reason.</tspan></tspan>
</text>
</svg>
