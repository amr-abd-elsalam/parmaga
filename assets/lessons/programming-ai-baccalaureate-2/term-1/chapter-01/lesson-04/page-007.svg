<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">قاموس المصطلحات</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">The Precise Glossary</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكل مصطلح: <tspan font-weight="bold" fill="#17457f">تعريف دقيق،</tspan> وشرح بلغتك،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">وفخ</tspan> احذر منه.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Each term: a <tspan font-weight="bold" fill="#17457f">precise definition,</tspan></tspan>
  <tspan x="120" dy="40">a simple explanation, and a <tspan font-weight="bold" fill="#c0392b">trap.</tspan></tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">1. الأخلاقيات Ethics</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">1. Ethics</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> <tspan font-weight="bold" fill="#17457f">المبادئ</tspan> التي نحكم بها</tspan>
  <tspan x="935" dy="40">على الفعل: صواب أم خطأ، عادل أم ظالم.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> the <tspan font-weight="bold" fill="#17457f">principles</tspan> we use</tspan>
  <tspan x="140" dy="40">to judge an action: right or wrong,</tspan>
  <tspan x="140" dy="40">fair or unfair.</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">القانون</tspan> يسأل: هل هذا ممنوع؟</tspan>
  <tspan x="950" dy="40">أما <tspan font-weight="bold" fill="#c0392b">الأخلاق</tspan> فتسأل: هل هذا صواب؟</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The <tspan font-weight="bold" fill="#17457f">law</tspan> asks: Is this forbidden?</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">Ethics</tspan> asks: Is this right?</tspan>
</text>
</svg>
