  <rect x="67" y="70" width="946" height="1245" rx="5" fill="none" stroke="#c62828" stroke-width="3"/>

  <text x="965" y="165"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="54"
        font-weight="bold"
        fill="#14365e">
    <tspan x="965" dy="0">التحيز الخوارزمي</tspan>
  </text>

  <text x="655" y="212"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="32"
        fill="#1d4a7a">
    <tspan x="655" dy="0">Algorithmic Bias</tspan>
  </text>

  <g>
    <rect x="132" y="288" width="58" height="100" rx="8" fill="#eef3f8" stroke="#6f8ba6" stroke-width="3"/>
    <circle cx="161" cy="314" r="13" fill="#9fb4c8"/>
    <rect x="142" y="336" width="38" height="7" rx="3" fill="#9fb4c8"/>
    <rect x="146" y="350" width="30" height="7" rx="3" fill="#bccbd9"/>

    <rect x="200" y="258" width="58" height="130" rx="8" fill="#fdeeee" stroke="#c62828" stroke-width="3"/>
    <circle cx="229" cy="286" r="14" fill="#d98a8a"/>
    <rect x="210" y="310" width="38" height="7" rx="3" fill="#d98a8a"/>
    <rect x="214" y="324" width="30" height="7" rx="3" fill="#e6a9a9"/>
    <rect x="210" y="338" width="38" height="7" rx="3" fill="#d98a8a"/>

    <rect x="268" y="318" width="58" height="70" rx="8" fill="#eef3f8" stroke="#6f8ba6" stroke-width="3"/>
    <circle cx="297" cy="342" r="11" fill="#9fb4c8"/>
    <rect x="278" y="360" width="38" height="6" rx="3" fill="#bccbd9"/>

    <line x1="348" y1="328" x2="412" y2="328" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
    <polygon points="412,317 438,328 412,339" fill="#c62828"/>

    <rect x="440" y="268" width="205" height="130" rx="14" fill="#eaf3fb" opacity="0.65" stroke="#2a6099" stroke-width="3"/>
    <polygon points="541,295 579,333 541,371 503,333" fill="#ffffff" opacity="0.8" stroke="#2a6099" stroke-width="3"/>
    <circle cx="470" cy="333" r="7" fill="#2a6099" opacity="0.55"/>
    <circle cx="614" cy="333" r="7" fill="#2a6099" opacity="0.55"/>
    <line x1="477" y1="333" x2="503" y2="333" stroke="#2a6099" stroke-width="3" opacity="0.7"/>
    <line x1="579" y1="333" x2="607" y2="333" stroke="#2a6099" stroke-width="3" opacity="0.7"/>

    <line x1="657" y1="328" x2="719" y2="328" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
    <polygon points="719,317 745,328 719,339" fill="#c62828"/>

    <line x1="840" y1="288" x2="840" y2="392" stroke="#2f4a66" stroke-width="6" stroke-linecap="round"/>
    <rect x="800" y="390" width="80" height="11" rx="5" fill="#2f4a66"/>
    <line x1="753" y1="266" x2="927" y2="310" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
    <line x1="753" y1="266" x2="753" y2="306" stroke="#2f4a66" stroke-width="3"/>
    <path d="M725 306 Q 753 334 781 306" fill="none" stroke="#2f4a66" stroke-width="4"/>
    <line x1="927" y1="310" x2="927" y2="360" stroke="#2f4a66" stroke-width="3"/>
    <path d="M899 360 Q 927 388 955 360" fill="none" stroke="#2f4a66" stroke-width="4"/>
    <circle cx="918" cy="368" r="7" fill="#c62828" opacity="0.85"/>
    <circle cx="936" cy="368" r="7" fill="#c62828" opacity="0.85"/>
  </g>

  <text x="950" y="464"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        fill="#225f9c">
    <tspan x="950" dy="0">التحيز الخوارزمي Algorithmic Bias هو تحيز في أحكام</tspan>
    <tspan x="950" dy="44">نظام الذكاء الاصطناعي. قد ينتج من بيانات تدريب</tspan>
    <tspan x="950" dy="44">متحيزة أو غير كافية، أو من انعكاس أنماط تمييز</tspan>
    <tspan x="950" dy="44">سابقة في البيانات. وقد يدخل التحيز أيضًا من خلال</tspan>
    <tspan x="950" dy="44">طريقة تصميم النظام أو اختيار المتغيرات أو تصميم</tspan>
    <tspan x="950" dy="44">النموذج نفسه.</tspan>
  </text>

  <text x="120" y="724"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="120" dy="0">Algorithmic bias is bias in an AI system’s</tspan>
    <tspan x="120" dy="36">judgments. It may result from biased or</tspan>
    <tspan x="120" dy="36">insufficient training data or from past</tspan>
    <tspan x="120" dy="36">discriminatory patterns reflected in the data.</tspan>
    <tspan x="120" dy="36">Bias can also enter through the system’s</tspan>
    <tspan x="120" dy="36">design, the choice of variables, or the design</tspan>
    <tspan x="120" dy="36">of the model itself.</tspan>
  </text>

  <rect x="105" y="985" width="870" height="183" rx="16" fill="#fdf6d8" stroke="#e0c46a" stroke-width="3"/>

  <text x="940" y="1025"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="940" dy="0">إذا كانت بيانات التدريب متحيزة، فقد يكرر</tspan>
    <tspan x="940" dy="39">نظام الذكاء الاصطناعي هذا التحيز.</tspan>
  </text>

  <text x="140" y="1102"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="140" dy="0">If the training data is biased, an AI system</tspan>
    <tspan x="140" dy="34">can reproduce that bias.</tspan>
  </text>

</svg>
