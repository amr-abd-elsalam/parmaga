    <line x1="88" y1="596" x2="992" y2="596"/>
    <line x1="88" y1="640" x2="992" y2="640"/>
    <line x1="88" y1="684" x2="992" y2="684"/>
    <line x1="88" y1="728" x2="992" y2="728"/>
    <line x1="88" y1="772" x2="992" y2="772"/>
    <line x1="88" y1="816" x2="992" y2="816"/>
    <line x1="88" y1="860" x2="992" y2="860"/>
    <line x1="88" y1="904" x2="992" y2="904"/>
    <line x1="88" y1="948" x2="992" y2="948"/>
    <line x1="88" y1="992" x2="992" y2="992"/>
    <line x1="88" y1="1036" x2="992" y2="1036"/>
    <line x1="88" y1="1080" x2="992" y2="1080"/>
    <line x1="88" y1="1124" x2="992" y2="1124"/>
