  <tspan x="465" dy="40">principle</tspan>
</text>
<text x="425" y="534" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
