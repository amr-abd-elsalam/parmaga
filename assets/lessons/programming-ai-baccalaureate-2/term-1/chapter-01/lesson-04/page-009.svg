<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilScreen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4fc3e8"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Info card shadow and fill -->
<rect x="109" y="288" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="282" width="870" height="288" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="298" width="6" height="256" rx="3" fill="#2f7fb5"/>

<!-- Icon: chip beside header -->
<g transform="translate(130 116)">
  <path d="M14 0 L14 8 M22 0 L22 8 M30 0 L30 8 M14 36 L14 44 M22 36 L22 44 M30 36 L30 44 M0 14 L8 14 M0 22 L8 22 M0 30 L8 30 M36 14 L44 14 M36 22 L44 22 M36 30 L44 30" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="8" y="8" width="28" height="28" rx="4" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="15" y="15" width="14" height="14" rx="2" fill="#4fc3e8" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: tag inside info card -->
<g transform="translate(130 292)">
  <polygon points="4,6 30,6 50,26 30,46 4,46" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="16" cy="26" r="5" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Thinking face beside paragraph -->
<g transform="translate(170 644)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Illustration: AI notices a pattern without understanding it -->
<g>
  <rect x="125" y="830" width="830" height="420" rx="24" fill="url(#ilSky)"/>
  <circle cx="860" cy="872" r="12" fill="#ffffff"/>
  <circle cx="880" cy="866" r="16" fill="#ffffff"/>
  <circle cx="900" cy="874" r="11" fill="#ffffff"/>

  <!-- Desk -->
  <rect x="180" y="1190" width="16" height="52" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="884" y="1190" width="16" height="52" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="145" y="1174" width="790" height="18" rx="6" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>

  <!-- Monitor -->
  <rect x="404" y="906" width="340" height="220" rx="14" fill="#22303f" opacity=".18"/>
  <rect x="550" y="1118" width="40" height="42" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="510" y="1158" width="120" height="16" rx="8" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="400" y="900" width="340" height="220" rx="14" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="418" y="918" width="304" height="176" rx="8" fill="url(#ilScreen)" stroke="#22303f" stroke-width="2"/>

  <!-- Repeating shapes: circle, triangle, circle, triangle -->
  <circle cx="466" cy="1006" r="22" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="536,982 560,1026 512,1026" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="606" cy="1006" r="22" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="676,982 700,1026 652,1026" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Magnifying glass -->
  <g transform="translate(604 1004) rotate(-45)">
    <rect x="-8" y="46" width="16" height="58" rx="6" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <circle cx="604" cy="1004" r="40" fill="#8fc9f2" opacity=".35"/>
  <path d="M556 1004 A48 48 0 1 0 652 1004 A48 48 0 1 0 556 1004 Z M566 1004 A38 38 0 1 0 642 1004 A38 38 0 1 0 566 1004 Z" fill="#2f7fb5" fill-rule="evenodd" stroke="#22303f" stroke-width="2.5"/>

  <!-- Thought bubble with question mark -->
  <circle cx="390" cy="1056" r="6" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <circle cx="372" cy="1032" r="10" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <ellipse cx="260" cy="960" rx="100" ry="72" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <path d="M230 940 A30 30 0 0 1 290 940 Q290 962 268 972 L268 990 L252 990 L252 964 Q274 956 274 940 A14 14 0 0 0 246 940 Z" fill="#17457f" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="260" cy="1008" r="9" fill="#17457f" stroke="#22303f" stroke-width="2"/>

  <!-- Floating pattern hints (right) -->
  <circle cx="800" cy="962" r="14" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>
  <polygon points="850,946 866,976 834,976" fill="#dff1f7" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="900" cy="962" r="14" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>
  <circle cx="820" cy="1050" r="6" fill="#4fc3e8"/>
  <circle cx="850" cy="1050" r="6" fill="#4fc3e8"/>
  <circle cx="880" cy="1050" r="6" fill="#4fc3e8"/>
  <path d="M850 1090 L854 1102 L866 1102 L856 1110 L860 1122 L850 1114 L840 1122 L844 1110 L834 1102 L846 1102 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
</g>

<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">3. الذكاء</tspan>
  <tspan x="950" dy="40">الاصطناعي Artificial Intelligence</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">3. Artificial Intelligence (AI)</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> أنظمة حاسوبية تتعلم</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">أنماطًا</tspan> من البيانات، ثم تستخدمها في التنبؤ</tspan>
  <tspan x="935" dy="40">أو التصنيف أو اتخاذ القرار أو توليد المحتوى.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> computer systems that</tspan>
  <tspan x="140" dy="40">learn <tspan font-weight="bold" fill="#17457f">patterns</tspan> from data, then use</tspan>
  <tspan x="140" dy="40">them to predict, classify, make</tspan>
  <tspan x="140" dy="40">decisions, or generate content.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بلغتك:</tspan> هو تلميذ شاطر جدًا في ملاحظة <tspan font-weight="bold" fill="#17457f">الأنماط،</tspan></tspan>
  <tspan x="950" dy="40">لكنه <tspan font-weight="bold" fill="#17457f">لا يفهم</tspan> معنى ما يلاحظه.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">In your words:</tspan> it is a student who is</tspan>
  <tspan x="120" dy="40">very good at spotting <tspan font-weight="bold" fill="#17457f">patterns,</tspan> but it</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">does not understand</tspan> what they mean.</tspan>
</text>
</svg>
