<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0824f"/>
      <stop offset="0.55" stop-color="#96683d"/>
      <stop offset="1" stop-color="#7c5330"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5f7285"/>
    </marker>
    <marker id="arrowRedDown" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 1. Simple warm background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M 0 240 C 300 190, 780 300, 1080 235" stroke="#6a462a" stroke-width="14" fill="none" opacity="0.13"/>
  <path d="M 0 1130 C 320 1075, 760 1195, 1080 1120" stroke="#6a462a" stroke-width="12" fill="none" opacity="0.11"/>

  <!-- 2. Paper -->
  <rect x="42" y="40" width="1012" height="1290" rx="10" fill="#3d2a18" opacity="0.22"/>
  <rect x="34" y="30" width="1012" height="1290" rx="8" fill="url(#paperTone)"/>

  <!-- 3. Pale horizontal notebook lines -->
  <g stroke="#bcd4ea" stroke-width="1.6" opacity="0.75">
    <line x1="92" y1="326" x2="988" y2="326"/>
    <line x1="92" y1="362" x2="988" y2="362"/>
    <line x1="92" y1="398" x2="988" y2="398"/>
    <line x1="92" y1="434" x2="988" y2="434"/>
    <line x1="92" y1="470" x2="988" y2="470"/>
    <line x1="92" y1="506" x2="988" y2="506"/>
    <line x1="92" y1="542" x2="988" y2="542"/>
    <line x1="92" y1="578" x2="988" y2="578"/>
    <line x1="92" y1="614" x2="988" y2="614"/>
    <line x1="92" y1="650" x2="988" y2="650"/>
    <line x1="92" y1="686" x2="988" y2="686"/>
    <line x1="92" y1="722" x2="988" y2="722"/>
    <line x1="92" y1="758" x2="988" y2="758"/>
    <line x1="92" y1="794" x2="988" y2="794"/>
    <line x1="92" y1="830" x2="988" y2="830"/>
    <line x1="92" y1="866" x2="988" y2="866"/>
    <line x1="92" y1="902" x2="988" y2="902"/>
    <line x1="92" y1="938" x2="988" y2="938"/>
    <line x1="92" y1="974" x2="988" y2="974"/>
    <line x1="92" y1="1010" x2="988" y2="1010"/>
    <line x1="92" y1="1046" x2="988" y2="1046"/>
    <line x1="92" y1="1082" x2="988" y2="1082"/>
    <line x1="92" y1="1118" x2="988" y2="1118"/>
    <line x1="92" y1="1154" x2="988" y2="1154"/>
  </g>

  <!-- 4. Single thin outer red border (no internal vertical margin line) -->
  <rect x="67" y="63" width="946" height="1224" rx="6"
        fill="none" stroke="#c0392b" stroke-width="2.4"/>

  <!-- 5-6. Neutral educational illustration: hiring AI comparing applicant profiles -->
  <g>
    <line x1="540" y1="186" x2="540" y2="174" stroke="#225f9c" stroke-width="3"/>
    <circle cx="540" cy="169" r="4.5" fill="#225f9c"/>
    <rect x="506" y="186" width="68" height="54" rx="10"
          fill="#eaf2fa" stroke="#225f9c" stroke-width="3"/>
    <circle cx="523" cy="207" r="6" fill="#225f9c"/>
    <circle cx="557" cy="207" r="6" fill="#225f9c"/>
    <line x1="524" y1="224" x2="556" y2="224" stroke="#225f9c" stroke-width="3" stroke-linecap="round"/>

    <line x1="502" y1="213" x2="400" y2="213" stroke="#5f7285" stroke-width="3"
          marker-end="url(#arrowSlate)"/>
    <line x1="578" y1="213" x2="680" y2="213" stroke="#5f7285" stroke-width="3"
          marker-end="url(#arrowSlate)"/>

    <g fill="#5b7189">
      <circle cx="220" cy="196" r="11"/>
      <path d="M 201 232 a 19 19 0 0 1 38 0 z"/>
      <circle cx="285" cy="196" r="11"/>
      <path d="M 266 232 a 19 19 0 0 1 38 0 z"/>
      <circle cx="350" cy="196" r="11"/>
      <path d="M 331 232 a 19 19 0 0 1 38 0 z"/>
    </g>
    <g fill="#2e7d54">
      <rect x="195" y="246" width="16" height="9" rx="2"/>
      <rect x="215" y="246" width="16" height="9" rx="2"/>
      <rect x="235" y="246" width="16" height="9" rx="2"/>
      <rect x="260" y="246" width="16" height="9" rx="2"/>
      <rect x="280" y="246" width="16" height="9" rx="2"/>
      <rect x="300" y="246" width="16" height="9" rx="2"/>
      <rect x="325" y="246" width="16" height="9" rx="2"/>
      <rect x="345" y="246" width="16" height="9" rx="2"/>
      <rect x="365" y="246" width="16" height="9" rx="2"/>
    </g>

    <g fill="#5b7189">
      <circle cx="730" cy="196" r="11"/>
      <path d="M 711 232 a 19 19 0 0 1 38 0 z"/>
      <circle cx="795" cy="196" r="11"/>
      <path d="M 776 232 a 19 19 0 0 1 38 0 z"/>
      <circle cx="860" cy="196" r="11"/>
      <path d="M 841 232 a 19 19 0 0 1 38 0 z"/>
    </g>
    <g>
      <rect x="705" y="246" width="16" height="9" rx="2" fill="#c0392b"/>
      <rect x="725" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
      <rect x="745" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
      <rect x="770" y="246" width="16" height="9" rx="2" fill="#c0392b"/>
      <rect x="790" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
      <rect x="810" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
      <rect x="835" y="246" width="16" height="9" rx="2" fill="#c0392b"/>
      <rect x="855" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
      <rect x="875" y="246" width="16" height="9" rx="2" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.6"/>
    </g>
    <line x1="912" y1="236" x2="912" y2="266" stroke="#c0392b" stroke-width="3.4"
          marker-end="url(#arrowRedDown)"/>
  </g>

  <!-- 7. Educational text -->
  <text x="540" y="112"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#1b4f8a">حلّل موقف التوظيف</text>

  <text x="540" y="157"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="31"
        fill="#1b3f66">Analyze the Hiring Situation</text>

  <text x="950" y="326"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">وُجد أن نظامًا للذكاء الاصطناعي مخصصًا للتوظيف</tspan>
    <tspan x="950" dy="36">يمنح المتقدمين من جنس معين تقييمات أقل.</tspan>
  </text>

  <text x="950" y="434"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">باستخدام أفكار التحيز الخوارزمي والمبادئ الأساسية</tspan>
    <tspan x="950" dy="36">لأخلاقيات الذكاء الاصطناعي، وضّح:</tspan>
  </text>

  <text x="938" y="542"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="938" dy="0">.1</tspan>
    <tspan x="938" dy="36">.2</tspan>
    <tspan x="938" dy="36">.3</tspan>
  </text>

  <text x="908" y="542"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="908" dy="0">السبب الأكثر احتمالًا لظهور هذا التحيز.</tspan>
    <tspan x="908" dy="36">مبدأين يمكن أن يساعدا في معالجة المشكلة.</tspan>
    <tspan x="908" dy="36">سبب اختيارك لهذين المبدأين.</tspan>
  </text>

  <text x="120" y="686"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#1b3f66">
    <tspan x="120" dy="0">A hiring AI was found to rate applicants</tspan>
    <tspan x="120" dy="36">of a particular gender lower.</tspan>
  </text>

  <text x="120" y="794"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#1b3f66">
    <tspan x="120" dy="0">Using the ideas of algorithmic bias and the</tspan>
    <tspan x="120" dy="36">basic principles of AI ethics, explain:</tspan>
  </text>

  <text x="120" y="902"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#1b3f66">
    <tspan x="120" dy="0">1. The most likely cause of this bias.</tspan>
    <tspan x="120" dy="36">2. Two principles that could help address the</tspan>
    <tspan x="155" dy="36">problem.</tspan>
    <tspan x="120" dy="36">3. Why you chose those principles.</tspan>
  </text>

  <rect x="110" y="1048" width="860" height="110" rx="14"
        fill="#fdf6d5" stroke="#d9bd63" stroke-width="2"/>

  <text x="930" y="1092"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29"
        fill="#7a5f12">
    <tspan x="930" dy="0">قد توجد أكثر من إجابة منطقية.</tspan>
  </text>

  <text x="140" y="1131"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#7a5f12">
    <tspan x="140" dy="0">There can be more than one reasonable answer.</tspan>
  </text>

</svg>
