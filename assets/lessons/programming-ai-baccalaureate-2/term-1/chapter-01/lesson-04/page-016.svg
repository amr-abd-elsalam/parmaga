<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b07a45"/>
      <stop offset="55%" stop-color="#96602f"/>
      <stop offset="100%" stop-color="#7a4a22"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#fbf6e8"/>
    </linearGradient>
    <pattern id="ruleLines" x="0" y="140" width="940" height="31" patternUnits="userSpaceOnUse">
      <line x1="0" y1="30.5" x2="940" y2="30.5" stroke="#cfe0f2" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0 250 C 300 200, 780 320, 1080 260" stroke="#5f3818" stroke-width="16" fill="none" opacity="0.12"/>
  <path d="M0 980 C 340 1040, 760 900, 1080 970" stroke="#5f3818" stroke-width="14" fill="none" opacity="0.10"/>

  <rect x="44" y="36" width="1012" height="1300" rx="8" fill="#4a2c12" opacity="0.28"/>
  <rect x="34" y="24" width="1012" height="1300" rx="8" fill="url(#paperGrad)"/>

  <rect x="90" y="140" width="900" height="1150" fill="url(#ruleLines)"/>

  <rect x="67" y="56" width="946" height="1260" rx="6" fill="none" stroke="#c8362b" stroke-width="2.4"/>

  <rect x="95" y="228" width="890" height="461" rx="14" fill="#fdf7e1" stroke="#dcc островов" stroke-width="0"/>
  <rect x="95" y="228" width="890" height="461" rx="14" fill="#fdf7e1" stroke="#dfc madre" stroke-width="0"/>
  <rect x="95" y="228" width="890" height="461" rx="14" fill="#fdf7e1" stroke="#dcc677" stroke-width="1.8"/>
  <line x1="552" y1="252" x2="552" y2="665" stroke="#e2cf92" stroke-width="1.6"/>

  <rect x="95" y="713" width="890" height="413" rx="14" fill="#eef4fb" stroke="#a9c6e0" stroke-width="1.8"/>
  <line x1="552" y1="737" x2="552" y2="1102" stroke="#bcd3e8" stroke-width="1.6"/>

  <text x="540" y="132"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40" font-weight="bold" fill="#14508f">طبّق ما تعلمته في سياق جديد</text>

  <text x="540" y="180"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#1c3f63">Apply What You Learned in a New Context</text>

  <text x="958" y="274"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#14508f">سياق جديد: المدرسة</text>

  <text x="958" y="316"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">تريد مدرسة استخدام كاميرات</tspan>
    <tspan x="958" dy="31">التعرف على الوجه عند بوابتها</tspan>
    <tspan x="958" dy="31">لتسجيل الحضور تلقائيًا.</tspan>
  </text>

  <text x="958" y="414"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">1. حدد فائدة عملية واحدة للمدرسة.</tspan>
  </text>

  <text x="958" y="448"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">2. حدد مصدر قلق واحدًا</tspan>
    <tspan x="938" dy="31">يتعلق بالخصوصية.</tspan>
  </text>

  <text x="958" y="515"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">3. إذا أخطأ النظام في تحديد</tspan>
    <tspan x="938" dy="31">هوية طالب، فمن ينبغي أن يتحمل</tspan>
    <tspan x="938" dy="31">المسؤولية: المدرسة أم الشركة</tspan>
    <tspan x="938" dy="31">التي صنعت النظام؟</tspan>
  </text>

  <text x="958" y="644"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">4. اذكر سببًا لإجابتك.</tspan>
  </text>

  <text x="120" y="274"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#123a5e">New Context: School</text>

  <text x="120" y="314"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">A school wants to use</tspan>
    <tspan x="120" dy="29">face-recognition cameras at its</tspan>
    <tspan x="120" dy="29">gate to record attendance</tspan>
    <tspan x="120" dy="29">automatically.</tspan>
  </text>

  <text x="120" y="435"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">1. Identify one practical benefit</tspan>
    <tspan x="140" dy="29">for the school.</tspan>
  </text>

  <text x="120" y="498"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">2. Identify one privacy concern.</tspan>
  </text>

  <text x="120" y="532"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">3. If the system misidentifies a</tspan>
    <tspan x="140" dy="29">student, who should be</tspan>
    <tspan x="140" dy="29">responsible: the school or the</tspan>
    <tspan x="140" dy="29">company that made the AI?</tspan>
  </text>

  <text x="120" y="653"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">4. Give a reason for your answer.</tspan>
  </text>

  <text x="958" y="759"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" font-weight="bold" fill="#14508f">تأمل وتحدَّ نفسك</text>

  <text x="958" y="801"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">• هل غيّر هذا الدرس مقدار ثقتك</tspan>
    <tspan x="938" dy="31">في القرارات التي يتخذها الذكاء</tspan>
    <tspan x="938" dy="31">الاصطناعي بشأنك؟</tspan>
  </text>

  <text x="958" y="899"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">• أي مبدأ من المبادئ الأربعة</tspan>
    <tspan x="938" dy="31">يصعب ضمانه أكثر؟ ولماذا؟</tspan>
  </text>

  <text x="958" y="966"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" fill="#225f9c">
    <tspan x="958" dy="0">• اختر مجالًا يُستخدم فيه</tspan>
    <tspan x="938" dy="31">الذكاء الاصطناعي، مثل التوظيف</tspan>
    <tspan x="938" dy="31">أو التعرف على الوجه أو</tspan>
    <tspan x="938" dy="31">التوصيات، واقترح قاعدة واحدة</tspan>
    <tspan x="938" dy="31">تجعله أكثر جدارة بالثقة.</tspan>
  </text>

  <text x="120" y="759"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#123a5e">Reflect and Challenge</text>

  <text x="120" y="799"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">• Has this lesson changed how</tspan>
    <tspan x="140" dy="29">much you trust an AI decision</tspan>
    <tspan x="140" dy="29">about you?</tspan>
  </text>

  <text x="120" y="891"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">• Which of the four principles is</tspan>
    <tspan x="140" dy="29">hardest to guarantee, and why?</tspan>
  </text>

  <text x="120" y="954"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">
    <tspan x="120" dy="0">• Choose one area where AI is</tspan>
    <tspan x="140" dy="29">used, such as hiring, face</tspan>
    <tspan x="140" dy="29">recognition, or recommendations,</tspan>
    <tspan x="140" dy="29">and suggest one rule that would</tspan>
    <tspan x="140" dy="29">make it more trustworthy.</tspan>
  </text>

</svg>
