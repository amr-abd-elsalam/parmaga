<!-- Text layer -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">6. السمة المحمية Protected Attribute</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">6. Protected Attribute</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> صفة في الإنسان لا يجوز</tspan>
  <tspan x="935" dy="40">أن تكون سببًا <tspan font-weight="bold" fill="#17457f">للتمييز</tspan> ضده، مثل الجنس</tspan>
  <tspan x="935" dy="40">والعرق والدين والعمر والإعاقة.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> a personal trait that</tspan>
  <tspan x="140" dy="40">must not be a reason for</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">discrimination,</tspan> such as gender,</tspan>
  <tspan x="140" dy="40">ethnicity, religion, age, or disability.</tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بلغتك:</tspan> صفات <tspan font-weight="bold" fill="#17457f">لم يخترها</tspan> الإنسان،</tspan>
  <tspan x="950" dy="40">أو لا علاقة لها بكفاءته؛</tspan>
  <tspan x="950" dy="40">فلا يصح أن يُحكم عليه بسببها.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">In your words:</tspan> traits a person</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">did not choose,</tspan> or that have nothing</tspan>
  <tspan x="120" dy="40">to do with ability, so no one should</tspan>
  <tspan x="120" dy="40">be judged by them.</tspan>
</text>
</svg>
