      font-weight="bold"
      fill="#c0392b">The Algorithm Court</text>

<text x="950"
      y="314"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">القضية: <tspan font-weight="bold" fill="#17457f">كاميرا الحضور</tspan> في المدرسة</tspan>
  <tspan x="950" dy="40">سجلت طالبًا <tspan font-weight="bold" fill="#c0392b">«غائبًا»</tspan> ثلاثة أيام وهو حاضر،</tspan>
  <tspan x="950" dy="40">فحُرم من دخول الامتحان.</tspan>
</text>

<text x="120"
      y="434"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">The case: the school&apos;s <tspan font-weight="bold" fill="#17457f">attendance camera</tspan></tspan>
  <tspan x="120" dy="40">marked a student <tspan font-weight="bold" fill="#c0392b">&quot;absent&quot;</tspan> for three days</tspan>
  <tspan x="120" dy="40">while he was present, so he was</tspan>
  <tspan x="120" dy="40">not allowed to sit the exam.</tspan>
</text>
