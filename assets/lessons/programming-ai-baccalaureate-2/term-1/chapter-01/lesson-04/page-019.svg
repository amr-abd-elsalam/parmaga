<!-- Text: Bullet 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التحقق</tspan> <tspan font-weight="bold" fill="#17457f">(واحد مقابل واحد):</tspan> هل أنت صاحب</tspan>
  <tspan x="950" dy="40">هذا الهاتف؟ مثل فتح هاتفك بوجهك.</tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Verification</tspan> <tspan font-weight="bold" fill="#17457f">(one-to-one):</tspan> Are you the</tspan>
  <tspan x="120" dy="40">owner of this phone? Like unlocking your</tspan>
  <tspan x="120" dy="40">phone with your face.</tspan>
</text>

<!-- Text: Bullet 2 -->
<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">التعرف</tspan> <tspan font-weight="bold" fill="#17457f">(واحد مقابل كثيرين):</tspan> من هذا الشخص</tspan>
  <tspan x="950" dy="40">بين آلاف الوجوه؟ مثل كاميرات الشوارع.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Identification</tspan> <tspan font-weight="bold" fill="#17457f">(one-to-many):</tspan> Who is</tspan>
  <tspan x="120" dy="40">this person among thousands of faces?</tspan>
  <tspan x="120" dy="40">Like street cameras.</tspan>
</text>

<!-- Illustration labels -->
<text x="950" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="950" dy="0">التحقق: واحد مقابل واحد</tspan>
</text>
<text x="565" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="565" dy="0">Verification: one-to-one</tspan>
</text>
<text x="515" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="515" dy="0">التعرف: واحد مقابل كثيرين</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="120" dy="0">Identification: one-to-many</tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="994" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">تجمع هذه التقنية قضيتي الدرس:</tspan>
  <tspan x="935" dy="40">قد تكون متحيزة، وقد تهدد الخصوصية.</tspan>
</text>
<text x="140" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">This technology combines the lesson's</tspan>
  <tspan x="140" dy="40">two issues: it can be biased,</tspan>
  <tspan x="140" dy="40">and it can threaten privacy.</tspan>
</text>

