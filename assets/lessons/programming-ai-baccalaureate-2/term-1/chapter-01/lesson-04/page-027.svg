<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4fc3e8"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Info card: shadow, fill, accent -->
<rect x="109" y="248" width="870" height="288" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="242" width="870" height="288" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="258" width="6" height="256" rx="3" fill="#2f7fb5"/>

<!-- Icon: open book (definition) inside card top-left -->
<g transform="translate(128 250)">
  <path d="M24 10 Q14 4 2 6 L2 38 Q14 36 24 42 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 10 Q34 4 46 6 L46 38 Q34 36 24 42 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="8" y1="16" x2="18" y2="18" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="18" y2="26" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="18" x2="40" y2="16" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="26" x2="40" y2="24" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Wink face beside the English paragraph -->
<g transform="translate(880 704)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" stroke="#22303f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M -11 7 Q 0 17 11 7" stroke="#22303f" stroke-width="3" stroke-linecap="round" fill="none"/>
</g>

<!-- Illustration: see-through AI system with an information board -->
<g>
  <rect x="105" y="792" width="870" height="440" rx="24" fill="url(#ilBack)"/>
  <path d="M105 1160 L975 1160 L975 1208 Q975 1232 951 1232 L129 1232 Q105 1232 105 1208 Z" fill="#e8dfd1" opacity=".6"/>
  <ellipse cx="330" cy="1196" rx="170" ry="14" fill="#22303f" opacity=".18"/>
  <ellipse cx="750" cy="1180" rx="200" ry="14" fill="#22303f" opacity=".18"/>

  <!-- Notice board on stand (left) -->
  <polygon points="220,1100 240,1100 212,1192 192,1192" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="420,1100 440,1100 468,1192 448,1192" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="205" y="1146" width="250" height="12" rx="6" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="154" y="836" width="360" height="280" rx="16" fill="#22303f" opacity=".18"/>
  <rect x="150" y="830" width="360" height="280" rx="16" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="166" y="846" width="328" height="248" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="186" y="862" width="288" height="16" rx="8" fill="#2f7fb5"/>
  <line x1="186" y1="957" x2="474" y2="957" stroke="#e8dfd1" stroke-width="2"/>
  <line x1="186" y1="1022" x2="474" y2="1022" stroke="#e8dfd1" stroke-width="2"/>

  <!-- Row 1: check mark -->
  <g transform="translate(215 925)">
    <circle cx="0" cy="0" r="20" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <path d="M -9 0 L -3 7 L 10 -7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="250" y="912" width="210" height="10" rx="5" fill="#a9dcbe"/>
  <rect x="250" y="930" width="150" height="10" rx="5" fill="#a9dcbe"/>

  <!-- Row 2: target -->
  <g transform="translate(215 990)">
    <circle cx="0" cy="0" r="20" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="13" fill="#ffffff"/>
    <circle cx="0" cy="0" r="6" fill="#c96a1b"/>
  </g>
  <rect x="250" y="977" width="210" height="10" rx="5" fill="#f0c48c"/>
  <rect x="250" y="995" width="170" height="10" rx="5" fill="#f0c48c"/>

  <!-- Row 3: stop sign -->
  <g transform="translate(215 1055)">
    <polygon points="19.4,8 8,19.4 -8,19.4 -19.4,8 -19.4,-8 -8,-19.4 8,-19.4 19.4,-8" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-10" y="-3" width="20" height="6" rx="3" fill="#ffffff"/>
  </g>
  <rect x="250" y="1042" width="210" height="10" rx="5" fill="#c0392b" opacity=".35"/>
  <rect x="250" y="1060" width="130" height="10" rx="5" fill="#c0392b" opacity=".35"/>

  <!-- Information flow dots -->
  <circle cx="530" cy="980" r="5" fill="#4fc3e8"/>
  <circle cx="545" cy="980" r="5" fill="#4fc3e8"/>
  <circle cx="560" cy="980" r="5" fill="#4fc3e8"/>

  <!-- Glass AI box (right) -->
  <rect x="569" y="1146" width="370" height="34" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="584" y="856" width="300" height="290" rx="20" fill="#22303f" opacity=".18"/>
  <polygon points="880,850 920,815 920,1105 880,1140" fill="#4fc3e8" opacity=".35" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="580,850 620,815 920,815 880,850" fill="#8fc9f2" opacity=".6" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="580" y="850" width="300" height="290" rx="20" fill="#dff1f7"/>

  <!-- Gear 1 (blue) -->
  <g transform="translate(700 960)">
    <rect x="-8" y="-65" width="16" height="130" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <g transform="rotate(45)"><rect x="-8" y="-65" width="16" height="130" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(90)"><rect x="-8" y="-65" width="16" height="130" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(135)"><rect x="-8" y="-65" width="16" height="130" rx="3" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/></g>
    <circle cx="0" cy="0" r="55" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <!-- Gear 2 (orange) -->
  <g transform="translate(800 1050)">
    <g transform="rotate(22.5)"><rect x="-8" y="-50" width="16" height="100" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(67.5)"><rect x="-8" y="-50" width="16" height="100" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(112.5)"><rect x="-8" y="-50" width="16" height="100" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(157.5)"><rect x="-8" y="-50" width="16" height="100" rx="3" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/></g>
    <circle cx="0" cy="0" r="40" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="13" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <!-- Gear 3 (green) -->
  <g transform="translate(790 900)">
    <rect x="-6" y="-36" width="12" height="72" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <g transform="rotate(45)"><rect x="-6" y="-36" width="12" height="72" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(90)"><rect x="-6" y="-36" width="12" height="72" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/></g>
    <g transform="rotate(135)"><rect x="-6" y="-36" width="12" height="72" rx="3" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/></g>
    <circle cx="0" cy="0" r="28" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="9" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  </g>

  <!-- Front glass -->
  <rect x="580" y="850" width="300" height="290" rx="20" fill="url(#ilGlass)" opacity=".35"/>
  <rect x="598" y="870" width="10" height="120" rx="5" fill="#ffffff" opacity=".6"/>
  <rect x="598" y="1002" width="10" height="30" rx="5" fill="#ffffff" opacity=".6"/>
  <rect x="580" y="850" width="300" height="290" rx="20" fill="none" stroke="#22303f" stroke-width="2.5"/>

  <!-- Plinth -->
  <rect x="565" y="1140" width="370" height="34" rx="8" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="610" cy="1157" r="5" fill="#2e7d32"/>
  <circle cx="630" cy="1157" r="5" fill="#ffd24a"/>
  <circle cx="650" cy="1157" r="5" fill="#4fc3e8"/>
</g>

<!-- Text layer -->
<text x="950"
      y="154"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="32"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="950" dy="0">13. الشفافية Transparency</tspan>
</text>

<text x="120"
      y="194"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="31"
      font-weight="bold"
      fill="#c0392b">
  <tspan x="120" dy="0">13. Transparency</tspan>
</text>

<text x="935"
      y="274"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="935" dy="0">تعريف الكتاب: <tspan font-weight="bold" fill="#17457f">إتاحة معلومات واضحة</tspan></tspan>
  <tspan x="935" dy="40">ومناسبة عن النظام واستخدامه</tspan>
  <tspan x="935" dy="40">وعملية اتخاذ القرار وحدوده.</tspan>
</text>

<text x="140"
      y="394"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="140" dy="0">Textbook definition: <tspan font-weight="bold" fill="#17457f">providing clear</tspan></tspan>
  <tspan x="140" dy="40">and appropriate information about the</tspan>
  <tspan x="140" dy="40">system, its use, its decision-making</tspan>
  <tspan x="140" dy="40">process, and its limits.</tspan>
</text>

<text x="950"
      y="594"
      direction="rtl"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Tahoma, Arial, Segoe UI, sans-serif"
      font-size="30"
      fill="#225f9c">
  <tspan x="950" dy="0">بلغتك: أن يقال لك بوضوح: أنت تتعامل مع</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">ذكاء اصطناعي،</tspan> يُستخدم في كذا، ولا يصلح لكذا.</tspan>
</text>

<text x="120"
      y="674"
      direction="ltr"
      unicode-bidi="plaintext"
      text-anchor="start"
      font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
      font-size="29"
      fill="#152b42">
  <tspan x="120" dy="0">In your words: being told clearly: you</tspan>
  <tspan x="120" dy="40">are dealing with an <tspan font-weight="bold" fill="#17457f">AI,</tspan> it is used for</tspan>
  <tspan x="120" dy="40">this, and it is not suitable for that.</tspan>
</text>
</svg>
