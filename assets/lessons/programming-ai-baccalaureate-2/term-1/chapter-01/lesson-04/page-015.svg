<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#996a3c"/>
      <stop offset="0.55" stop-color="#7d4f28"/>
      <stop offset="1" stop-color="#5f3a1b"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefcf5"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
    <pattern id="ruledLines" patternUnits="userSpaceOnUse" x="0" y="123" width="27" height="27">
      <line x1="0" y1="0.5" x2="27" y2="0.5" stroke="#b8d3e8" stroke-width="1.3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0,170 C 320,110 760,250 1080,180 L1080,232 C 760,300 320,160 0,225 Z" fill="#3f2410" opacity="0.10"/>
  <path d="M0,985 C 300,935 780,1065 1080,1005 L1080,1055 C 780,1115 300,985 0,1040 Z" fill="#3f2410" opacity="0.08"/>

  <rect x="42" y="36" width="1012" height="1304" rx="8" fill="#2b1a0c" opacity="0.20"/>
  <rect x="34" y="26" width="1012" height="1304" rx="8" fill="url(#paperTone)"/>

  <rect x="70" y="123" width="940" height="1160" fill="url(#ruledLines)"/>

  <rect x="67" y="58" width="946" height="1264" rx="7" fill="none" stroke="#c62828" stroke-width="2.6"/>

  <rect x="95" y="176" width="890" height="778" rx="14" fill="#e9f5ec" fill-opacity="0.72" stroke="#8fbf9c" stroke-width="1.6"/>

  <rect x="105" y="184" width="870" height="42" rx="8" fill="#d3ead9" stroke="#86b894" stroke-width="1"/>
  <rect x="105" y="184" width="10" height="42" rx="5" fill="#2f8f56"/>
  <rect x="105" y="504" width="870" height="42" rx="8" fill="#d3ead9" stroke="#86b894" stroke-width="1"/>
  <rect x="105" y="504" width="10" height="42" rx="5" fill="#2f8f56"/>
  <rect x="105" y="747" width="870" height="42" rx="8" fill="#d3ead9" stroke="#86b894" stroke-width="1"/>
  <rect x="105" y="747" width="10" height="42" rx="5" fill="#2f8f56"/>

  <rect x="95" y="976" width="890" height="179" rx="14" fill="#fdf6da" stroke="#d8c274" stroke-width="1.6"/>

  <line x1="540" y1="238" x2="540" y2="478" stroke="#9cc9a8" stroke-width="1" stroke-dasharray="5 7" opacity="0.75"/>
  <line x1="540" y1="558" x2="540" y2="721" stroke="#9cc9a8" stroke-width="1" stroke-dasharray="5 7" opacity="0.75"/>
  <line x1="540" y1="801" x2="540" y2="937" stroke="#9cc9a8" stroke-width="1" stroke-dasharray="5 7" opacity="0.75"/>
  <line x1="540" y1="994" x2="540" y2="1136" stroke="#d3bd70" stroke-width="1" stroke-dasharray="5 7" opacity="0.75"/>

  <text x="540" y="112"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#14406f">فكّر كمهندس — ابحث ثم قرر</text>

  <text x="540" y="152"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="26"
        fill="#1b3a5c">Think as an Engineer — Investigate and Decide</text>

  <text x="132" y="213"
        direction="ltr"
        unicode-bidi="embed"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#14653a">1. استقصِ — Investigate</text>

  <text x="962" y="252"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="24"
        fill="#1e5f9e">
    <tspan x="962" dy="0">ابحث عن حالة موثقة اتُّهم فيها</tspan>
    <tspan x="962" dy="27">نظام ذكاء اصطناعي بإنتاج نتائج</tspan>
    <tspan x="962" dy="27">غير عادلة أو متحيزة. سجّل مصدر</tspan>
    <tspan x="962" dy="27">الحالة، وحدد:</tspan>
    <tspan x="962" dy="27">• الفئة التي تأثرت.</tspan>
    <tspan x="962" dy="27">• البيانات أو طريقة تصميم</tspan>
    <tspan x="944" dy="27">النظام أو استخدامه التي قد</tspan>
    <tspan x="944" dy="27">تكون سببت المشكلة.</tspan>
  </text>

  <text x="118" y="252"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="23"
        fill="#152b42">
    <tspan x="118" dy="0">Find one documented case in</tspan>
    <tspan x="118" dy="27">which an AI system was accused</tspan>
    <tspan x="118" dy="27">of producing unfair or biased</tspan>
    <tspan x="118" dy="27">results. Record the source and</tspan>
    <tspan x="118" dy="27">identify:</tspan>
    <tspan x="118" dy="27">• The group that was affected.</tspan>
    <tspan x="118" dy="27">• The data, system design, or</tspan>
    <tspan x="136" dy="27">use that may have caused the</tspan>
    <tspan x="136" dy="27">problem.</tspan>
  </text>

  <text x="132" y="533"
        direction="ltr"
        unicode-bidi="embed"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#14653a">2. اعتبر المسؤولية — Consider Responsibility</text>

  <text x="962" y="576"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="24"
        fill="#1e5f9e">
    <tspan x="962" dy="0">عندما يتخذ نظام الذكاء</tspan>
    <tspan x="962" dy="27">الاصطناعي قرارًا غير عادل، ناقش</tspan>
    <tspan x="962" dy="27">مسؤولية كل طرف:</tspan>
    <tspan x="962" dy="27">• المطور.</tspan>
    <tspan x="962" dy="27">• الشركة التي تستخدم النظام.</tspan>
    <tspan x="962" dy="27">• المشغّل أو المستخدم.</tspan>
  </text>

  <text x="118" y="576"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="23"
        fill="#152b42">
    <tspan x="118" dy="0">When an AI system makes an</tspan>
    <tspan x="118" dy="27">unfair decision, discuss the</tspan>
    <tspan x="118" dy="27">responsibility of:</tspan>
    <tspan x="118" dy="27">• The developer.</tspan>
    <tspan x="118" dy="27">• The company using the system.</tspan>
    <tspan x="118" dy="27">• The operator or user.</tspan>
  </text>

  <text x="132" y="776"
        direction="ltr"
        unicode-bidi="embed"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#14653a">3. قرر — Decide</text>

  <text x="962" y="819"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="24"
        fill="#1e5f9e">
    <tspan x="962" dy="0">قبل استخدام شركة نظام ذكاء</tspan>
    <tspan x="962" dy="27">اصطناعي للتوظيف، اقترح قاعدة</tspan>
    <tspan x="962" dy="27">واحدة تجعل النظام أكثر عدالة،</tspan>
    <tspan x="962" dy="27">وبررها باستخدام أحد مبادئ</tspan>
    <tspan x="962" dy="27">أخلاقيات الذكاء الاصطناعي.</tspan>
  </text>

  <text x="118" y="819"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="23"
        fill="#152b42">
    <tspan x="118" dy="0">Before a company uses a hiring</tspan>
    <tspan x="118" dy="27">AI, propose one rule that would</tspan>
    <tspan x="118" dy="27">make the system fairer. Justify</tspan>
    <tspan x="118" dy="27">your rule using one principle</tspan>
    <tspan x="118" dy="27">of AI ethics.</tspan>
  </text>

  <text x="955" y="1008"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="23"
        fill="#8a5a12">
    <tspan x="955" dy="0">تلميح: افحص مدى تمثيل البيانات،</tspan>
    <tspan x="955" dy="27">واختبر النتائج على فئات مختلفة،</tspan>
    <tspan x="955" dy="27">وراجع تصميم النظام والسياق الذي</tspan>
    <tspan x="955" dy="27">سيُستخدم فيه.</tspan>
  </text>

  <text x="125" y="1008"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="22"
        fill="#5a3f0c">
    <tspan x="125" dy="0">Hint: Check how representative</tspan>
    <tspan x="125" dy="27">the data is, test results across</tspan>
    <tspan x="125" dy="27">different groups, and review the</tspan>
    <tspan x="125" dy="27">system’s design and intended</tspan>
    <tspan x="125" dy="27">context.</tspan>
  </text>

</svg>
