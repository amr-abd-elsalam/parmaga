<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilShell" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f0c48c"/>
    <stop offset="1" stop-color="#c96a1b"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="528" width="870" height="248" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="812" width="866" height="370" rx="20" fill="#22303f" opacity=".18"/>

<!-- Warning card -->
<rect x="105" y="522" width="870" height="248" rx="16" fill="#fdf1e2" stroke="#f0c48c" stroke-width="2"/>
<rect x="961" y="538" width="6" height="216" rx="3" fill="#c96a1b"/>

<!-- Bullets -->
<circle cx="966" cy="144" r="6" fill="#c0392b"/>
<circle cx="114" cy="224" r="6" fill="#c0392b"/>
<circle cx="966" cy="344" r="6" fill="#c0392b"/>
<circle cx="114" cy="424" r="6" fill="#c0392b"/>

<!-- Chip icon beside the use door -->
<g transform="translate(130 128)">
  <line x1="16" y1="0" x2="16" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="0" x2="28" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="0" x2="40" y2="8" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="16" y2="56" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="48" x2="28" y2="56" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="48" x2="40" y2="56" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="20" x2="8" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="36" x2="8" y2="36" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="20" x2="56" y2="20" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="36" x2="56" y2="36" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="8" y="8" width="40" height="40" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="18" y="18" width="20" height="20" rx="3" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- People icon beside the context door -->
<g transform="translate(130 330)">
  <path d="M4 52 Q18 24 32 52 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M24 52 Q38 24 52 52 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="18" cy="16" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="38" cy="16" r="9" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Warning icon inside the card -->
<g transform="translate(130 536)">
  <polygon points="26,2 52,48 0,48" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="23" y="16" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="26" cy="40" r="3.5" fill="#22303f"/>
</g>

<!-- Illustration: slow speed does not change fairness -->
<g>
  <rect x="105" y="806" width="866" height="370" rx="20" fill="url(#ilSky)"/>
  <path d="M105 1104 H971 V1156 Q971 1176 951 1176 H125 Q105 1176 105 1156 Z" fill="#e8dfd1"/>
  <ellipse cx="160" cy="846" rx="22" ry="12" fill="#ffffff"/>
  <ellipse cx="182" cy="840" rx="18" ry="14" fill="#ffffff"/>
  <ellipse cx="200" cy="848" rx="16" ry="10" fill="#ffffff"/>
  <circle cx="920" cy="852" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

  <!-- Balance scale, perfectly level (left) -->
  <ellipse cx="290" cy="1114" rx="70" ry="7" fill="#22303f" opacity=".18"/>
  <polygon points="230,1110 350,1110 330,1092 250,1092" fill="#7d4f28" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="284" y="884" width="12" height="210" rx="4" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <line x1="186" y1="896" x2="160" y2="980" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="186" y1="896" x2="212" y2="980" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="394" y1="896" x2="368" y2="980" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="394" y1="896" x2="420" y2="980" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="170" y="884" width="240" height="12" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="290" cy="880" r="11" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M150 980 Q186 1012 222 980 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M358 980 Q394 1012 430 980 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Hourglass (right, next to the snail) -->
  <ellipse cx="674" cy="1104" rx="44" ry="6" fill="#22303f" opacity=".18"/>
  <path d="M646 962 L702 962 L682 1023 L702 1084 L646 1084 L666 1023 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="654,980 694,980 674,1018" fill="#ffd24a"/>
  <line x1="674" y1="1018" x2="674" y2="1052" stroke="#ffd24a" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="652,1080 696,1080 674,1052" fill="#ffd24a"/>
  <rect x="636" y="962" width="8" height="122" rx="3" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="704" y="962" width="8" height="122" rx="3" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="628" y="950" width="92" height="12" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="628" y="1084" width="92" height="12" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>

  <!-- Snail (right) -->
  <ellipse cx="850" cy="1106" rx="96" ry="7" fill="#22303f" opacity=".18"/>
  <line x1="766" y1="1046" x2="754" y2="1012" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="780" y1="1046" x2="784" y2="1010" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="754" cy="1010" r="5" fill="#22303f"/>
  <circle cx="784" cy="1008" r="5" fill="#22303f"/>
  <rect x="756" y="1072" width="184" height="28" rx="14" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="772" cy="1062" r="20" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="766" cy="1058" r="3.5" fill="#22303f"/>
  <path d="M762 1068 Q770 1074 778 1068" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="862" cy="1032" r="48" fill="url(#ilShell)" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="866" cy="1034" r="32" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="870" cy="1036" r="17" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="872" cy="1037" r="6" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>

  <!-- Dotted arrow from the snail toward the scale -->
  <g fill="#c0392b">
    <circle cx="740" cy="905" r="3.5"/>
    <circle cx="720" cy="905" r="3.5"/>
    <circle cx="700" cy="905" r="3.5"/>
    <circle cx="680" cy="905" r="3.5"/>
    <circle cx="660" cy="905" r="3.5"/>
    <circle cx="640" cy="905" r="3.5"/>
    <circle cx="620" cy="905" r="3.5"/>
    <circle cx="600" cy="905" r="3.5"/>
    <circle cx="580" cy="905" r="3.5"/>
    <circle cx="560" cy="905" r="3.5"/>
    <circle cx="540" cy="905" r="3.5"/>
    <circle cx="520" cy="905" r="3.5"/>
    <circle cx="500" cy="905" r="3.5"/>
    <circle cx="480" cy="905" r="3.5"/>
  </g>
  <polygon points="452,905 472,894 472,916" fill="#c0392b"/>

  <!-- Large red cross over the arrow -->
  <g transform="translate(600 905) rotate(45)">
    <rect x="-8" y="-46" width="16" height="92" rx="6" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
    <rect x="-46" y="-8" width="92" height="16" rx="6" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  </g>
</g>

<!-- Icon row in the lower free band -->
<g transform="translate(372 1194)">
  <polygon points="28,2 35,20 54,21 39,33 44,52 28,41 12,52 17,33 2,21 21,20" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(512 1194)">
  <circle cx="28" cy="28" r="26" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 29 L25 38 L41 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g transform="translate(652 1194)">
  <circle cx="28" cy="22" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="38" width="16" height="14" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="22" y1="45" x2="34" y2="45" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Text layer -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">باب الاستخدام:</tspan> تشغيل النظام</tspan>
  <tspan x="950" dy="40">في غير ما صُمم له.</tspan>
</text>
<text x="132" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The use door:</tspan> running the system for</tspan>
  <tspan x="132" dy="40">something it was not designed for.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">باب السياق:</tspan> <tspan font-weight="bold" fill="#17457f">تحيزات البشر</tspan> الذين</tspan>
  <tspan x="950" dy="40">يجمعون البيانات ويفسرون النتائج.</tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0"><tspan font-weight="bold" fill="#c0392b">The context door:</tspan> <tspan font-weight="bold" fill="#17457f">biases of the people</tspan></tspan>
  <tspan x="132" dy="40">who collect data and interpret results.</tspan>
</text>

<text x="935" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">فخ الامتحان:</tspan> «سرعة المعالجة البطيئة»</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">ليست سببًا للتحيز؛</tspan></tspan>
  <tspan x="935" dy="40">السرعة تؤثر في الوقت، لا في العدل.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Exam trap:</tspan> "slow processing speed"</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">is not a cause of bias;</tspan></tspan>
  <tspan x="140" dy="40">speed affects time, not fairness.</tspan>
</text>
</svg>
