<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">مناظرة: الأمان أم الخصوصية؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Debate: Safety or Privacy?</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل نركّب كاميرات <tspan font-weight="bold" fill="#c0392b">تعرّف على الوجه</tspan></tspan>
  <tspan x="950" dy="40">في كل شوارع المدينة؟</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Should we install <tspan font-weight="bold" fill="#c0392b">face-recognition</tspan></tspan>
  <tspan x="120" dy="40">cameras on every street in the city?</tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في منتصف المناظرة يتبادل الفريقان الأدوار،</tspan>
  <tspan x="950" dy="40">لتتعلم أن <tspan font-weight="bold" fill="#17457f">تفهم الرأي الآخر،</tspan> لا أن تنتصر فقط.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Halfway through, the teams swap sides,</tspan>
  <tspan x="120" dy="40">so you learn to <tspan font-weight="bold" fill="#17457f">understand the other</tspan></tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">view,</tspan> not only to win.</tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">مثال <tspan font-weight="bold" fill="#2e7d32">لحل وسط:</tspan> الكاميرات في المطارات فقط،</tspan>
  <tspan x="935" dy="40">بموافقة معلنة،</tspan>
  <tspan x="935" dy="40">وتُحذف التسجيلات بعد مدة محددة.</tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A <tspan font-weight="bold" fill="#2e7d32">middle-ground</tspan> example: cameras only</tspan>
  <tspan x="140" dy="40">in airports, with public consent, and</tspan>
  <tspan x="140" dy="40">recordings deleted after a set time.</tspan>
</text>
</svg>
