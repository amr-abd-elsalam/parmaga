      <circle cx="0" cy="-52" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
    </g>
    <g transform="translate(24 640) rotate(40)">
      <rect x="-6" y="-50" width="12" height="54" rx="6" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
      <rect x="-11" y="-88" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
      <circle cx="0" cy="-52" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
    </g>
    <rect x="-15" y="704" width="13" height="60" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <rect x="2" y="704" width="13" height="60" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <ellipse cx="-9" cy="766" rx="11" ry="5" fill="#22303f"/>
    <ellipse cx="9" cy="766" rx="11" ry="5" fill="#22303f"/>
    <path d="M-30 716 Q-32 636 0 628 Q32 636 30 716 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-10 632 Q0 662 10 632" fill="none" stroke="#ffd24a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="660" r="5" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
    <circle cx="0" cy="602" r="22" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
    <path d="M-22 598 Q-20 578 0 578 Q20 578 22 598 Q11 588 0 590 Q-11 588 -22 598 Z" fill="#2b211c" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-7" cy="604" r="2.5" fill="#22303f"/>
    <circle cx="7" cy="604" r="2.5" fill="#22303f"/>
    <path d="M-6 613 Q0 618 6 613" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left referee: every card toward the orange goal -->
  <g transform="translate(332 0)">
    <ellipse cx="0" cy="772" rx="46" ry="7" fill="#22303f" opacity=".18"/>
    <g transform="translate(-24 640) rotate(-40)">
      <rect x="-6" y="-50" width="12" height="54" rx="6" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
      <g transform="translate(0 -56) rotate(-18)">
        <rect x="-11" y="-34" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
      </g>
      <g transform="translate(0 -56) rotate(18)">
        <rect x="-11" y="-34" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
      </g>
      <g transform="translate(0 -56)">
        <rect x="-11" y="-34" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
      </g>
      <circle cx="0" cy="-52" r="7" fill="#d59f6f" stroke="#22303f" stroke-width="2"/>
    </g>
    <g transform="translate(24 640) rotate(-12)">
      <rect x="-6" y="-4" width="12" height="56" rx="6" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
      <circle cx="0" cy="54" r="7" fill="#d59f6f" stroke="#22303f" stroke-width="2"/>
    </g>
    <rect x="-15" y="704" width="13" height="60" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <rect x="2" y="704" width="13" height="60" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
    <ellipse cx="-9" cy="766" rx="11" ry="5" fill="#22303f"/>
    <ellipse cx="9" cy="766" rx="11" ry="5" fill="#22303f"/>
    <path d="M-30 716 Q-32 636 0 628 Q32 636 30 716 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
