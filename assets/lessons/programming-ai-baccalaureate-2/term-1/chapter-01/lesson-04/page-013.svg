<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6537"/>
      <stop offset="0.55" stop-color="#82502a"/>
      <stop offset="1" stop-color="#653d1f"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
    <pattern id="ruledLines" x="0" y="0" width="1080" height="34" patternUnits="userSpaceOnUse">
      <line x1="80" y1="33.5" x2="1000" y2="33.5" stroke="#cfe1f3" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0 250 C 300 200, 780 320, 1080 250" stroke="#4d2d15" stroke-width="16" fill="none" opacity=".10"/>
  <path d="M0 980 C 320 1050, 760 920, 1080 1000" stroke="#4d2d15" stroke-width="14" fill="none" opacity=".09"/>

  <rect x="44" y="40" width="1012" height="1294" rx="10" fill="#2c1a0c" opacity=".22"/>
  <rect x="34" y="28" width="1012" height="1294" rx="10" fill="url(#paperGrad)"/>

  <rect x="80" y="192" width="920" height="968" fill="url(#ruledLines)" opacity=".75"/>

  <rect x="67" y="72" width="946" height="1244" rx="6" fill="none" stroke="#c9372c" stroke-width="2.6"/>

  <text x="540" y="126"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#16406e">أجب عن الأسئلة التالية</text>

  <text x="540" y="166"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        fill="#2a5f8f">Answer the Following Questions</text>

  <line x1="410" y1="180" x2="670" y2="180" stroke="#9fb8d4" stroke-width="2"/>

  <rect x="95" y="200" width="890" height="221" rx="14" fill="#ffffff" opacity=".80"/>
  <rect x="95" y="200" width="890" height="221" rx="14" fill="none" stroke="#b8cbe2" stroke-width="1.8"/>

  <text x="955" y="234"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1f5c9e">
    <tspan x="955" dy="0">1. ما المصطلح الذي يصف التحيز في أحكام نظام الذكاء</tspan>
    <tspan x="955" dy="34">الاصطناعي نتيجة التحيز في بيانات التدريب؟</tspan>
  </text>

  <text x="118" y="306"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#14294a">
    <tspan x="118" dy="0">1. What term describes bias in an AI system’s</tspan>
    <tspan x="118" dy="31">judgments resulting from bias in the training data?</tspan>
  </text>

  <line x1="130" y1="369" x2="950" y2="369" stroke="#9fb8d4" stroke-width="1.6"/>
  <line x1="130" y1="401" x2="950" y2="401" stroke="#9fb8d4" stroke-width="1.6"/>

  <rect x="95" y="435" width="890" height="252" rx="14" fill="#ffffff" opacity=".80"/>
  <rect x="95" y="435" width="890" height="252" rx="14" fill="none" stroke="#b8cbe2" stroke-width="1.8"/>

  <text x="955" y="469"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1f5c9e">
    <tspan x="955" dy="0">2. ما التقنية التي تساعد البشر على فهم سبب اتخاذ نظام</tspan>
    <tspan x="955" dy="34">الذكاء الاصطناعي قرارًا معينًا؟ اذكر اختصارها المكوّن من ثلاثة أحرف.</tspan>
  </text>

  <text x="118" y="541"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#14294a">
    <tspan x="118" dy="0">2. What technology helps humans understand why</tspan>
    <tspan x="118" dy="31">an AI system made a particular decision? Give its</tspan>
    <tspan x="118" dy="31">three-letter abbreviation.</tspan>
  </text>

  <line x1="130" y1="635" x2="950" y2="635" stroke="#9fb8d4" stroke-width="1.6"/>
  <line x1="130" y1="667" x2="950" y2="667" stroke="#9fb8d4" stroke-width="1.6"/>

  <rect x="95" y="701" width="890" height="221" rx="14" fill="#ffffff" opacity=".80"/>
  <rect x="95" y="701" width="890" height="221" rx="14" fill="none" stroke="#b8cbe2" stroke-width="1.8"/>

  <text x="955" y="735"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1f5c9e">
    <tspan x="955" dy="0">3. ما المبدأ الذي يقتضي عدم التمييز ظلمًا ضد</tspan>
    <tspan x="955" dy="34">شخص أو مجموعة بعينها؟</tspan>
  </text>

  <text x="118" y="807"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#14294a">
    <tspan x="118" dy="0">3. Which principle requires not unjustly</tspan>
    <tspan x="118" dy="31">discriminating against any particular person or group?</tspan>
  </text>

  <line x1="130" y1="870" x2="950" y2="870" stroke="#9fb8d4" stroke-width="1.6"/>
  <line x1="130" y1="902" x2="950" y2="902" stroke="#9fb8d4" stroke-width="1.6"/>

  <rect x="95" y="936" width="890" height="221" rx="14" fill="#ffffff" opacity=".80"/>
  <rect x="95" y="936" width="890" height="221" rx="14" fill="none" stroke="#b8cbe2" stroke-width="1.8"/>

  <text x="955" y="970"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1f5c9e">
    <tspan x="955" dy="0">4. ما المبدأ الذي يقتضي التعامل المناسب مع</tspan>
    <tspan x="955" dy="34">المعلومات الشخصية وحماية الخصوصية؟</tspan>
  </text>

  <text x="118" y="1042"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#14294a">
    <tspan x="118" dy="0">4. Which principle requires personal information to be</tspan>
    <tspan x="118" dy="31">handled appropriately and privacy to be protected?</tspan>
  </text>

  <line x1="130" y1="1105" x2="950" y2="1105" stroke="#9fb8d4" stroke-width="1.6"/>
  <line x1="130" y1="1137" x2="950" y2="1137" stroke="#9fb8d4" stroke-width="1.6"/>

</svg>
