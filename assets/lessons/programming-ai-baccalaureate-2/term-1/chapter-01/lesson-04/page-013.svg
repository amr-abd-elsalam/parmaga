  <!-- Red cards above goals: left half, all toward orange -->
  <rect x="155" y="640" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="181" y="640" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="207" y="640" width="22" height="30" rx="3" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>

