<!-- Texts -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الأعمق:</tspan> خطأ <tspan font-weight="bold" fill="#17457f">منهجي</tspan> ومتكرر</tspan>
  <tspan x="935" dy="40">يميل لصالح فئة أو ضدها دون مبرر مشروع.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Deeper definition:</tspan> a <tspan font-weight="bold" fill="#17457f">systematic,</tspan></tspan>
  <tspan x="140" dy="40">repeated error that favors or works</tspan>
  <tspan x="140" dy="40">against a group without a valid reason.</tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">الكلمة الذهبية: «منهجي»</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">The golden word: "systematic"</text>

<!-- Illustration labels -->
<text x="808" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">حكم ضعيف</text>
<text x="653" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Weak referee</text>
<text x="399" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">حكم متحيز</text>
<text x="220" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Biased referee</text>

<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">حكم يخطئ مرة ضد هذا الفريق ومرة ضد ذاك:</tspan>
  <tspan x="950" dy="40">حكم <tspan font-weight="bold" fill="#17457f">ضعيف.</tspan> وحكم يخطئ <tspan font-weight="bold" fill="#17457f">كل مرة</tspan> ضد فريق واحد:</tspan>
  <tspan x="950" dy="40">حكم <tspan font-weight="bold" fill="#c0392b">متحيز.</tspan></tspan>
</text>
<text x="120" y="1074" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A referee who errs once against each team</tspan>
  <tspan x="120" dy="40">is <tspan font-weight="bold" fill="#17457f">weak;</tspan> one who errs <tspan font-weight="bold" fill="#17457f">every time</tspan> against</tspan>
  <tspan x="120" dy="40">the same team is <tspan font-weight="bold" fill="#c0392b">biased.</tspan></tspan>
</text>
</svg>
