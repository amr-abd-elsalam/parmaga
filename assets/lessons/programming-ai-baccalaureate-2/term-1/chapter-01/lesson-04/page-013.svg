    <path d="M20 6 L20 60 M36 6 L36 60 M52 6 L52 60 M68 6 L68 60 M6 22 L78 22 M6 38 L78 38 M6 54 L78 54" fill="none" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
