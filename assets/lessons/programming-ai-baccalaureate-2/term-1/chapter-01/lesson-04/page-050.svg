  <path d="M398 741 L398 732 Q398 719 410 719 Q422 719 422 732 L422 741" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="394" y="739" width="32" height="26" rx="4" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
