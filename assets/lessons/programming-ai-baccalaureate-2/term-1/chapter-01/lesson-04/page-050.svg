  <line x1="410" y1="752" x2="410" y2="758" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Badge 4 (left): person with check -->
  <circle cx="280" cy="860" r="40" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="280" cy="860" r="32" fill="#a9dcbe"/>
