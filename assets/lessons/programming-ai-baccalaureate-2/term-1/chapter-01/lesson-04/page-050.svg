  <path d="M26 12 L37 17 Q36 33 26 40 Z" fill="#2f7fb5"/>
</g>
<g transform="translate(634 1192)">
  <circle cx="26" cy="26" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M15 26 L23 34 L37 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Texts -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">رسالة أخيرة</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">A Final Message</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي</tspan> ليس عدوًا ولا ساحرًا؛</tspan>
  <tspan x="950" dy="40">إنه <tspan font-weight="bold" fill="#17457f">أداة قوية</tspan> تعكس من صنعها ومن درّبها.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">AI</tspan> is neither an enemy nor a magician;</tspan>
  <tspan x="120" dy="40">it is a <tspan font-weight="bold" fill="#17457f">powerful tool</tspan> that reflects</tspan>
  <tspan x="120" dy="40">those who built and trained it.</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">السؤال الحقيقي: هل استخدمناه نحن</tspan>
  <tspan x="935" dy="40">بعدل وشفافية واحترام ومساءلة؟</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">The real question: did we use it</tspan>
  <tspan x="140" dy="40">with fairness, transparency, respect,</tspan>
  <tspan x="140" dy="40">and accountability?</tspan>
</text>

<text x="935" y="1034" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">قد تصبح أنت <tspan font-weight="bold" fill="#c0392b">المطوّر</tspan> يومًا ما؛</tspan>
  <tspan x="935" dy="40">فتذكّر <tspan font-weight="bold" fill="#17457f">الأسئلة الأربعة.</tspan></tspan>
</text>
<text x="140" y="1114" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">One day, you may be the <tspan font-weight="bold" fill="#c0392b">developer;</tspan></tspan>
  <tspan x="140" dy="40">remember the <tspan font-weight="bold" fill="#17457f">four questions.</tspan></tspan>
</text>
</svg>
