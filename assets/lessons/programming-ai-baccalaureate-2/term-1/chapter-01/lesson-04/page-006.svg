<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9743f"/>
      <stop offset="0.5" stop-color="#8f5f31"/>
      <stop offset="1" stop-color="#7a4f27"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
  </defs>

  <!-- 1) الخلفية البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodBg)"/>
  <path d="M0,170 C300,110 780,240 1080,160" fill="none" stroke="#5f3a1a" stroke-width="26" opacity="0.10"/>
  <path d="M0,990 C290,1070 800,900 1080,1015" fill="none" stroke="#5f3a1a" stroke-width="22" opacity="0.08"/>

  <!-- 2) الورقة -->
  <rect x="42" y="45" width="1012" height="1282" rx="8" fill="#3a2311" opacity="0.20"/>
  <rect x="34" y="34" width="1012" height="1282" rx="8" fill="url(#paperTone)"/>

  <!-- 3) سطور الدفتر الزرقاء الباهتة -->
  <g stroke="#cfe1f2" stroke-width="1.2">
    <line x1="85" y1="150" x2="995" y2="150"/>
    <line x1="85" y1="188" x2="995" y2="188"/>
    <line x1="85" y1="226" x2="995" y2="226"/>
    <line x1="85" y1="264" x2="995" y2="264"/>
    <line x1="85" y1="302" x2="995" y2="302"/>
    <line x1="85" y1="340" x2="995" y2="340"/>
    <line x1="85" y1="378" x2="995" y2="378"/>
    <line x1="85" y1="416" x2="995" y2="416"/>
    <line x1="85" y1="454" x2="995" y2="454"/>
    <line x1="85" y1="492" x2="995" y2="492"/>
    <line x1="85" y1="530" x2="995" y2="530"/>
    <line x1="85" y1="568" x2="995" y2="568"/>
    <line x1="85" y1="606" x2="995" y2="606"/>
    <line x1="85" y1="644" x2="995" y2="644"/>
    <line x1="85" y1="682" x2="995" y2="682"/>
    <line x1="85" y1="720" x2="995" y2="720"/>
    <line x1="85" y1="758" x2="995" y2="758"/>
    <line x1="85" y1="796" x2="995" y2="796"/>
    <line x1="85" y1="834" x2="995" y2="834"/>
    <line x1="85" y1="872" x2="995" y2="872"/>
    <line x1="85" y1="910" x2="995" y2="910"/>
    <line x1="85" y1="948" x2="995" y2="948"/>
    <line x1="85" y1="986" x2="995" y2="986"/>
    <line x1="85" y1="1024" x2="995" y2="1024"/>
    <line x1="85" y1="1062" x2="995" y2="1062"/>
    <line x1="85" y1="1100" x2="995" y2="1100"/>
    <line x1="85" y1="1138" x2="995" y2="1138"/>
  </g>

  <!-- 4) الإطار الأحمر الخارجي الوحيد -->
  <rect x="67" y="67" width="946" height="1216" rx="4" fill="none" stroke="#c8392b" stroke-width="2.4"/>

  <!-- 5) خلفيات البطاقات -->
  <rect x="555" y="296" width="420" height="415" rx="14" fill="#fdfbf2" opacity="0.97" stroke="#a9c1d8" stroke-width="1.6"/>
  <rect x="105" y="296" width="420" height="415" rx="14" fill="#fdfbf2" opacity="0.97" stroke="#a9c1d8" stroke-width="1.6"/>
  <rect x="555" y="741" width="420" height="415" rx="14" fill="#fdfbf2" opacity="0.97" stroke="#a9c1d8" stroke-width="1.6"/>
  <rect x="105" y="741" width="420" height="415" rx="14" fill="#fdfbf2" opacity="0.97" stroke="#a9c1d8" stroke-width="1.6"/>

  <!-- إبرازات صفراء خلف أسماء المبادئ -->
  <rect x="839" y="407" width="118" height="42" rx="6" fill="#fbeeb0" opacity="0.85"/>
  <rect x="363" y="407" width="142" height="42" rx="6" fill="#fbeeb0" opacity="0.85"/>
  <rect x="695" y="852" width="262" height="42" rx="6" fill="#fbeeb0" opacity="0.85"/>
  <rect x="365" y="852" width="140" height="42" rx="6" fill="#fbeeb0" opacity="0.85"/>

  <!-- 6) الأيقونات الوظيفية -->
  <!-- ميزان العدالة -->
  <g transform="translate(765,354)" fill="none" stroke="#1f5f9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-24" x2="0" y2="26"/>
    <line x1="-17" y1="26" x2="17" y2="26"/>
    <line x1="-34" y1="-20" x2="34" y2="-20"/>
    <line x1="-34" y1="-20" x2="-34" y2="-9"/>
    <line x1="34" y1="-20" x2="34" y2="-9"/>
    <path d="M-48,-9 L-20,-9 L-34,6 Z"/>
    <path d="M20,-9 L48,-9 L34,6 Z"/>
    <circle cx="0" cy="-26" r="4" fill="#1f5f9e"/>
  </g>
  <!-- عين الشفافية -->
  <g transform="translate(315,354)" fill="none" stroke="#1f5f9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-36,0 Q0,-27 36,0 Q0,27 -36,0 Z"/>
    <circle cx="0" cy="0" r="10.5" fill="#1f5f9e" stroke="none"/>
    <circle cx="4" cy="-4" r="3" fill="#fdfbf2" stroke="none"/>
  </g>
  <!-- درع حماية الخصوصية -->
  <g transform="translate(765,799)" fill="none" stroke="#1f5f9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,-29 L27,-19 L27,2 Q27,22 0,31 Q-27,22 -27,2 L-27,-19 Z"/>
    <circle cx="0" cy="-4" r="5.5" fill="#1f5f9e" stroke="none"/>
    <rect x="-2.6" y="-1" width="5.2" height="12" rx="2" fill="#1f5f9e" stroke="none"/>
  </g>
  <!-- مستند المساءلة بعلامة صح -->
  <g transform="translate(315,799)" fill="none" stroke="#1f5f9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-23" y="-29" width="46" height="54" rx="5"/>
    <line x1="-13" y1="-16" x2="13" y2="-16"/>
    <line x1="-13" y1="-6" x2="13" y2="-6"/>
    <line x1="-13" y1="4" x2="2" y2="4"/>
    <path d="M-11,13 L-3,21 L13,3" stroke="#1f7a4d" stroke-width="3.6"/>
  </g>

  <!-- 7) النصوص التعليمية -->

  <!-- العنوان العربي -->
  <text x="965"
        y="190"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#12355b">
    <tspan x="965" dy="0">المبادئ الأساسية لأخلاقيات الذكاء الاصطناعي</tspan>
  </text>

  <!-- العنوان الإنجليزي -->
  <text x="540"
        y="236"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#12355b">
    <tspan x="540" dy="0">Basic Principles of AI Ethics</tspan>
  </text>

  <!-- البطاقة 1: العدالة -->
  <text x="949" y="438" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#12355b">
    <tspan x="949" dy="0">العدالة</tspan>
  </text>
  <text x="581" y="480" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="24" fill="#12355b">
    <tspan x="581" dy="0">— Fairness</tspan>
  </text>
  <text x="949" y="528" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="25" fill="#225f9c">
    <tspan x="949" dy="0">عدم التمييز ظلمًا ضد شخص</tspan>
    <tspan x="949" dy="34">أو مجموعة بعينها.</tspan>
  </text>
  <text x="581" y="608" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="21" fill="#152b42">
    <tspan x="581" dy="0">Not unjustly discriminating</tspan>
    <tspan x="581" dy="30">against any particular</tspan>
    <tspan x="581" dy="30">person or group.</tspan>
  </text>

  <!-- البطاقة 2: الشفافية -->
  <text x="499" y="438" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#12355b">
    <tspan x="499" dy="0">الشفافية</tspan>
  </text>
  <text x="131" y="480" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="24" fill="#12355b">
    <tspan x="131" dy="0">— Transparency</tspan>
  </text>
  <text x="499" y="528" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="25" fill="#225f9c">
    <tspan x="499" dy="0">إتاحة معلومات واضحة عن</tspan>
    <tspan x="499" dy="34">النظام وعملية اتخاذ القرار.</tspan>
  </text>
  <text x="131" y="608" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="21" fill="#152b42">
    <tspan x="131" dy="0">Clearly showing information</tspan>
    <tspan x="131" dy="30">about the system and its</tspan>
    <tspan x="131" dy="30">decision-making process.</tspan>
  </text>

  <!-- البطاقة 3: حماية الخصوصية -->
  <text x="949" y="883" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#12355b">
    <tspan x="949" dy="0">حماية الخصوصية</tspan>
  </text>
  <text x="581" y="925" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="24" fill="#12355b">
    <tspan x="581" dy="0">— Privacy Protection</tspan>
  </text>
  <text x="949" y="973" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="25" fill="#225f9c">
    <tspan x="949" dy="0">التعامل المناسب مع المعلومات</tspan>
    <tspan x="949" dy="34">الشخصية وحماية الخصوصية.</tspan>
  </text>
  <text x="581" y="1053" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="21" fill="#152b42">
    <tspan x="581" dy="0">Handling personal</tspan>
    <tspan x="581" dy="30">information appropriately</tspan>
    <tspan x="581" dy="30">and protecting privacy.</tspan>
  </text>

  <!-- البطاقة 4: المساءلة -->
  <text x="499" y="883" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#12355b">
    <tspan x="499" dy="0">المساءلة</tspan>
  </text>
  <text x="131" y="925" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="24" fill="#12355b">
    <tspan x="131" dy="0">— Accountability</tspan>
  </text>
  <text x="499" y="973" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="25" fill="#225f9c">
    <tspan x="499" dy="0">تحديد الجهات المسؤولة عن</tspan>
    <tspan x="499" dy="34">قرارات النظام وآثاره.</tspan>
  </text>
  <text x="131" y="1053" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="21" fill="#152b42">
    <tspan x="131" dy="0">Identifying who is</tspan>
    <tspan x="131" dy="30">answerable for the system’s</tspan>
    <tspan x="131" dy="30">decisions and effects.</tspan>
  </text>

</svg>
