<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilPanel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#dff1f7"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="154" y="628" width="780" height="238" rx="24" fill="#22303f" opacity=".18"/>
<rect x="109" y="888" width="870" height="168" rx="16" fill="#22303f" opacity=".12"/>

<!-- Success card -->
<rect x="105" y="882" width="870" height="168" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="898" width="6" height="136" rx="3" fill="#2e7d32"/>

<!-- Bullets -->
<circle cx="966" cy="144" r="6" fill="#c0392b"/>
<circle cx="114" cy="184" r="6" fill="#c0392b"/>
<circle cx="966" cy="264" r="6" fill="#c0392b"/>
<circle cx="114" cy="304" r="6" fill="#c0392b"/>
<circle cx="966" cy="384" r="6" fill="#c0392b"/>
<circle cx="114" cy="424" r="6" fill="#c0392b"/>
<circle cx="966" cy="504" r="6" fill="#c0392b"/>
<circle cx="114" cy="544" r="6" fill="#c0392b"/>

<!-- Main illustration: four principle badges, right to left -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="150" y="622" width="780" height="238" rx="24" fill="url(#ilPanel)" stroke="#8fc9f2"/>

  <!-- Badge shadows -->
  <circle cx="814" cy="788" r="62" fill="#22303f" opacity=".18" stroke="none"/>
  <circle cx="634" cy="788" r="62" fill="#22303f" opacity=".18" stroke="none"/>
  <circle cx="454" cy="788" r="62" fill="#22303f" opacity=".18" stroke="none"/>
  <circle cx="274" cy="788" r="62" fill="#22303f" opacity=".18" stroke="none"/>

  <!-- Badge 1 (right): balance scale -->
  <g transform="translate(810 782)">
    <circle cx="0" cy="0" r="62" fill="#2f7fb5"/>
    <circle cx="0" cy="0" r="48" fill="#ffffff"/>
    <rect x="-3" y="-30" width="6" height="52" rx="2" fill="#2f7fb5"/>
    <rect x="-34" y="-32" width="68" height="6" rx="3" fill="#2f7fb5"/>
    <path d="M-29 -27 L-38 0 M-29 -27 L-20 0 M29 -27 L20 0 M29 -27 L38 0" fill="none"/>
    <path d="M-42 0 Q-29 14 -16 0 Z" fill="#ffd24a"/>
    <path d="M16 0 Q29 14 42 0 Z" fill="#ffd24a"/>
    <rect x="-16" y="22" width="32" height="7" rx="3" fill="#2f7fb5"/>
  </g>

  <!-- Badge 2: open eye -->
  <g transform="translate(630 782)">
    <circle cx="0" cy="0" r="62" fill="#2e7d32"/>
    <circle cx="0" cy="0" r="48" fill="#ffffff"/>
    <path d="M-36 0 Q0 -32 36 0 Q0 32 -36 0 Z" fill="#dff1f7"/>
    <circle cx="0" cy="0" r="14" fill="#2e7d32"/>
    <circle cx="0" cy="0" r="5" fill="#22303f" stroke="none"/>
  </g>

  <!-- Badge 3: closed padlock -->
  <g transform="translate(450 782)">
    <circle cx="0" cy="0" r="62" fill="#c96a1b"/>
    <circle cx="0" cy="0" r="48" fill="#ffffff"/>
    <path d="M-18 -2 L-18 -16 Q-18 -34 0 -34 Q18 -34 18 -16 L18 -2 L10 -2 L10 -16 Q10 -26 0 -26 Q-10 -26 -10 -16 L-10 -2 Z" fill="#7f95ab"/>
    <rect x="-24" y="-4" width="48" height="38" rx="6" fill="#f0c48c"/>
    <circle cx="0" cy="10" r="5" fill="#22303f" stroke="none"/>
    <rect x="-2" y="12" width="4" height="12" rx="2" fill="#22303f" stroke="none"/>
  </g>

  <!-- Badge 4 (left): person with check mark -->
  <g transform="translate(270 782)">
    <circle cx="0" cy="0" r="62" fill="#ffd24a"/>
    <circle cx="0" cy="0" r="48" fill="#ffffff"/>
    <path d="M-30 34 Q-30 4 -6 4 Q18 4 18 34 Z" fill="#2f7fb5"/>
    <circle cx="-6" cy="-14" r="13" fill="#e8b98d"/>
    <path d="M-19 -16 Q-19 -30 -6 -30 Q7 -30 7 -16 Q0 -23 -6 -23 Q-12 -23 -19 -16 Z" fill="#2b211c"/>
    <circle cx="22" cy="-18" r="13" fill="#2e7d32"/>
    <path d="M16 -18 L20 -13 L28 -23" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Speech bubbles with question marks -->
  <g transform="translate(810 666)">
    <polygon points="-8,20 0,38 10,20" fill="#dff1f7"/>
    <rect x="-30" y="-22" width="60" height="44" rx="14" fill="#dff1f7"/>
    <g transform="scale(1.3)">
      <path d="M -6 -5 Q -6 -11 0 -11 Q 7 -11 7 -5 Q 7 -1 1 2 L 1 5" fill="none" stroke="#2f7fb5" stroke-width="3"/>
      <circle cx="1" cy="10" r="2.2" fill="#2f7fb5" stroke="none"/>
    </g>
  </g>
  <g transform="translate(630 666)">
    <polygon points="-8,20 0,38 10,20" fill="#a9dcbe"/>
    <rect x="-30" y="-22" width="60" height="44" rx="14" fill="#a9dcbe"/>
    <g transform="scale(1.3)">
      <path d="M -6 -5 Q -6 -11 0 -11 Q 7 -11 7 -5 Q 7 -1 1 2 L 1 5" fill="none" stroke="#2e7d32" stroke-width="3"/>
      <circle cx="1" cy="10" r="2.2" fill="#2e7d32" stroke="none"/>
    </g>
  </g>
  <g transform="translate(450 666)">
    <polygon points="-8,20 0,38 10,20" fill="#f0c48c"/>
    <rect x="-30" y="-22" width="60" height="44" rx="14" fill="#f0c48c"/>
    <g transform="scale(1.3)">
      <path d="M -6 -5 Q -6 -11 0 -11 Q 7 -11 7 -5 Q 7 -1 1 2 L 1 5" fill="none" stroke="#c96a1b" stroke-width="3"/>
      <circle cx="1" cy="10" r="2.2" fill="#c96a1b" stroke="none"/>
    </g>
  </g>
  <g transform="translate(270 666)">
    <polygon points="-8,20 0,38 10,20" fill="#ffd24a"/>
    <rect x="-30" y="-22" width="60" height="44" rx="14" fill="#ffd24a"/>
    <g transform="scale(1.3)">
      <path d="M -6 -5 Q -6 -11 0 -11 Q 7 -11 7 -5 Q 7 -1 1 2 L 1 5" fill="none" stroke="#17457f" stroke-width="3"/>
      <circle cx="1" cy="10" r="2.2" fill="#17457f" stroke="none"/>
    </g>
  </g>
</g>

<!-- Icon: balance scale (fairness) -->
<g transform="translate(890 182)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="20" y="8" width="4" height="28" rx="2" fill="#2f7fb5"/>
  <rect x="6" y="6" width="32" height="5" rx="2" fill="#2f7fb5"/>
  <path d="M9 10 L4 24 M9 10 L14 24 M35 10 L30 24 M35 10 L40 24" fill="none"/>
  <path d="M2 24 Q9 32 16 24 Z" fill="#ffd24a"/>
  <path d="M28 24 Q35 32 42 24 Z" fill="#ffd24a"/>
  <rect x="12" y="36" width="20" height="5" rx="2" fill="#2f7fb5"/>
</g>

<!-- Icon: eye (transparency) -->
<g transform="translate(890 302)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 22 Q22 4 42 22 Q22 40 2 22 Z" fill="#ffffff"/>
  <circle cx="22" cy="22" r="8" fill="#2e7d32"/>
  <circle cx="22" cy="22" r="3" fill="#22303f" stroke="none"/>
</g>

<!-- Icon: padlock (privacy) -->
<g transform="translate(890 422)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 20 L12 13 Q12 3 22 3 Q32 3 32 13 L32 20 L27 20 L27 13 Q27 8 22 8 Q17 8 17 13 L17 20 Z" fill="#7f95ab"/>
  <rect x="8" y="18" width="28" height="24" rx="5" fill="#c96a1b"/>
  <circle cx="22" cy="29" r="3.5" fill="#22303f" stroke="none"/>
</g>

<!-- Icon: person with check (accountability) -->
<g transform="translate(890 542)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M2 42 Q2 24 16 24 Q30 24 30 42 Z" fill="#2f7fb5"/>
  <circle cx="16" cy="12" r="8" fill="#e8b98d"/>
  <circle cx="34" cy="14" r="9" fill="#2e7d32"/>
  <path d="M29 14 L33 18 L39 10" fill="none" stroke="#ffffff"/>
</g>

<!-- Wink face inside the success card (tip) -->
<g transform="translate(880 1006)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Memory illustration: exam paper, pencil, magnifying glass -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(474 1172) rotate(-4)">
    <rect x="-80" y="-72" width="160" height="144" rx="10" fill="#22303f" opacity=".18" stroke="none"/>
  </g>
  <g transform="translate(470 1166) rotate(-4)">
    <rect x="-80" y="-72" width="160" height="144" rx="10" fill="#ffffff"/>
    <circle cx="-52" cy="-44" r="9" fill="#2f7fb5"/>
    <circle cx="-52" cy="-14" r="9" fill="#2e7d32"/>
    <circle cx="-52" cy="16" r="9" fill="#c96a1b"/>
    <circle cx="-52" cy="46" r="9" fill="#ffd24a"/>
    <path d="M-32 -44 L58 -44 M-32 -14 L50 -14 M-32 16 L58 16 M-32 46 L44 46" fill="none" stroke="#7f95ab"/>
  </g>
  <g transform="translate(590 1110) scale(2)">
    <polygon points="8,30 30,8 38,16 16,38" fill="#ffd24a"/>
    <polygon points="8,30 16,38 4,42" fill="#f0c48c"/>
    <polygon points="30,8 34,4 42,12 38,16" fill="#c0392b"/>
  </g>
  <g transform="translate(300 1150)">
    <polygon points="22,22 30,14 60,44 52,52" fill="#17457f"/>
    <circle cx="0" cy="0" r="34" fill="#dff1f7"/>
    <path d="M-18 -10 Q-12 -22 0 -22" fill="none" stroke="#ffffff"/>
  </g>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يظلم أحدًا؟ ← <tspan font-weight="bold" fill="#c0392b">العدالة</tspan></tspan>
</text>
<text x="132" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Is it unfair to anyone?</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Fairness</tspan></tspan>
</text>

<text x="950" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل نفهم لماذا قرر؟ ← <tspan font-weight="bold" fill="#c0392b">الشفافية</tspan></tspan>
</text>
<text x="132" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Do we understand why it decided?</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Transparency</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يحترم أسرارنا؟ ← <tspan font-weight="bold" fill="#c0392b">حماية الخصوصية</tspan></tspan>
</text>
<text x="132" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Does it respect our secrets?</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Privacy protection</tspan></tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">من سيُحاسَب إذا أخطأ؟ ← <tspan font-weight="bold" fill="#c0392b">المساءلة</tspan></tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Who answers if it is wrong?</tspan>
  <tspan x="132" dy="40">→ <tspan font-weight="bold" fill="#c0392b">Accountability</tspan></tspan>
</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">اسأل نفسك في الامتحان:</tspan>
  <tspan x="935" dy="40">الموقف ده بيجاوب على <tspan font-weight="bold" fill="#17457f">أنهي سؤال؟</tspan></tspan>
</text>
<text x="140" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">In the exam, ask: <tspan font-weight="bold" fill="#17457f">which question</tspan></tspan>
  <tspan x="140" dy="40">does this situation answer?</tspan>
</text>
</svg>
