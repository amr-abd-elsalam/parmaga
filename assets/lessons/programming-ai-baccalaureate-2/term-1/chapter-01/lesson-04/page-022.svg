<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17457f"/>
    <stop offset="1" stop-color="#2f7fb5"/>
  </linearGradient>
  <linearGradient id="ilCloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#8fc9f2"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Outlined box (shadow, box, accent as one group) -->
<g>
  <rect x="109" y="128" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
  <rect x="105" y="122" width="870" height="368" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
  <rect x="961" y="138" width="6" height="336" rx="3" fill="#2f7fb5"/>
</g>

<!-- Outlined box: header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">هل تعلم؟</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Did You Know?</tspan>
</text>

<!-- Surprise face inside the box (drawn after text) -->
<g transform="translate(880 414)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Outlined box: paragraph -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">التطبيق قد يعرف أنك تسهر بعد منتصف</tspan>
  <tspan x="935" dy="40">الليل، ونوع الفيديو الذي توقفت عنده.</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">لم تخبر أحدًا،</tspan> لكن <tspan font-weight="bold" fill="#c0392b">بياناتك أخبرته.</tspan></tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">An app may know that you stay up</tspan>
  <tspan x="140" dy="40">after midnight and which video made</tspan>
  <tspan x="140" dy="40">you stop scrolling. <tspan font-weight="bold" fill="#17457f">You told no one,</tspan></tspan>
  <tspan x="140" dy="40">but <tspan font-weight="bold" fill="#c0392b">your data did.</tspan></tspan>
</text>

<!-- Header 10 -->
<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">10. حماية الخصوصية Privacy Protection</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">10. Privacy Protection</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">الخصوصية</tspan> هي <tspan font-weight="bold" fill="#17457f">الحق نفسه،</tspan> وحماية الخصوصية هي</tspan>
  <tspan x="950" dy="40">المبدأ والإجراءات التي تحفظ هذا الحق.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Privacy</tspan> is <tspan font-weight="bold" fill="#17457f">the right itself;</tspan> privacy</tspan>
  <tspan x="120" dy="40">protection is the principle and the</tspan>
  <tspan x="120" dy="40">actions that keep that right safe.</tspan>
</text>

