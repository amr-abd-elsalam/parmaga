<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="0.55" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#5f3717"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#faf4e6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0 250 C 300 210, 780 300, 1080 245" stroke="#3f2410" stroke-width="16" fill="none" opacity="0.10"/>
  <path d="M0 1080 C 340 1130, 760 1030, 1080 1090" stroke="#3f2410" stroke-width="14" fill="none" opacity="0.09"/>

  <rect x="44" y="40" width="1012" height="1294" rx="10" fill="#2a1708" opacity="0.20"/>
  <rect x="34" y="28" width="1012" height="1294" rx="10" fill="url(#paperTone)"/>

  <g stroke="#cfe0f0" stroke-width="1.4" opacity="0.95">
    <line x1="82" y1="120" x2="998" y2="120"/>
    <line x1="82" y1="160" x2="998" y2="160"/>
    <line x1="82" y1="200" x2="998" y2="200"/>
    <line x1="82" y1="240" x2="998" y2="240"/>
    <line x1="82" y1="280" x2="998" y2="280"/>
    <line x1="82" y1="320" x2="998" y2="320"/>
    <line x1="82" y1="360" x2="998" y2="360"/>
    <line x1="82" y1="400" x2="998" y2="400"/>
    <line x1="82" y1="440" x2="998" y2="440"/>
    <line x1="82" y1="480" x2="998" y2="480"/>
    <line x1="82" y1="520" x2="998" y2="520"/>
    <line x1="82" y1="560" x2="998" y2="560"/>
    <line x1="82" y1="600" x2="998" y2="600"/>
    <line x1="82" y1="640" x2="998" y2="640"/>
    <line x1="82" y1="680" x2="998" y2="680"/>
    <line x1="82" y1="720" x2="998" y2="720"/>
    <line x1="82" y1="760" x2="998" y2="760"/>
    <line x1="82" y1="800" x2="998" y2="800"/>
    <line x1="82" y1="840" x2="998" y2="840"/>
    <line x1="82" y1="880" x2="998" y2="880"/>
    <line x1="82" y1="920" x2="998" y2="920"/>
    <line x1="82" y1="960" x2="998" y2="960"/>
    <line x1="82" y1="1000" x2="998" y2="1000"/>
    <line x1="82" y1="1040" x2="998" y2="1040"/>
    <line x1="82" y1="1080" x2="998" y2="1080"/>
    <line x1="82" y1="1120" x2="998" y2="1120"/>
    <line x1="82" y1="1160" x2="998" y2="1160"/>
  </g>

  <rect x="67" y="60" width="946" height="1250" rx="6" fill="none" stroke="#c0392b" stroke-width="3"/>

  <rect x="84" y="440" width="282" height="534" rx="12" fill="#f6fbff" stroke="#86b0d8" stroke-width="2"/>

  <line x1="115" y1="204" x2="965" y2="204" stroke="#9dc0de" stroke-width="2" opacity="0.85"/>

  <g>
    <rect x="918" y="344" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <rect x="918" y="552" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <rect x="918" y="760" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <rect x="918" y="968" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  </g>

  <text x="965"
        y="128"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#13406b">
    <tspan x="965" dy="0">مثال محلول — صِل المبدأ بالوصف</tspan>
  </text>

  <text x="115"
        y="176"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        fill="#1d4f7c">
    <tspan x="115" dy="0">Worked Example — Match the Principle</tspan>
  </text>

  <text x="965"
        y="244"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="965" dy="0">صِل كل وصف بالمبدأ الأنسب من مبادئ أخلاقيات الذكاء الاصطناعي:</tspan>
  </text>

  <text x="115"
        y="282"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="115" dy="0">Match each description with the most appropriate</tspan>
    <tspan x="115" dy="32">principle of AI ethics:</tspan>
  </text>

  <text x="346"
        y="372"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#225f9c">
    <tspan x="346" dy="0">الاختيارات:</tspan>
  </text>

  <text x="106"
        y="410"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="106" dy="0">Choices:</tspan>
  </text>

  <text x="346"
        y="496"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f86">
    <tspan x="346" dy="0">1. العدالة</tspan>
  </text>

  <text x="106"
        y="532"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#157a49">
    <tspan x="106" dy="0">Fairness</tspan>
  </text>

  <text x="346"
        y="620"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f86">
    <tspan x="346" dy="0">2. الشفافية</tspan>
  </text>

  <text x="106"
        y="656"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#157a49">
    <tspan x="106" dy="0">Transparency</tspan>
  </text>

  <text x="346"
        y="744"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f86">
    <tspan x="346" dy="0">3. حماية الخصوصية</tspan>
  </text>

  <text x="106"
        y="780"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#157a49">
    <tspan x="106" dy="0">Privacy</tspan>
    <tspan x="106" dy="32">Protection</tspan>
  </text>

  <text x="346"
        y="900"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1a4f86">
    <tspan x="346" dy="0">4. المساءلة</tspan>
  </text>

  <text x="106"
        y="936"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#157a49">
    <tspan x="106" dy="0">Accountability</tspan>
  </text>

  <text x="896"
        y="372"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#225f9c">
    <tspan x="896" dy="0">أ. عدم التمييز ظلمًا ضد شخص أو</tspan>
    <tspan x="896" dy="38">مجموعة بعينها.</tspan>
  </text>

  <text x="386"
        y="444"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="386" dy="0">A. Not unjustly discriminating</tspan>
    <tspan x="386" dy="33">against any particular person or</tspan>
    <tspan x="386" dy="33">group.</tspan>
  </text>

  <text x="896"
        y="580"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#225f9c">
    <tspan x="896" dy="0">ب. إظهار عملية اتخاذ القرار</tspan>
    <tspan x="896" dy="38">ومعلومات النظام بوضوح.</tspan>
  </text>

  <text x="386"
        y="652"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="386" dy="0">B. Clearly showing the</tspan>
    <tspan x="386" dy="33">decision-making process and</tspan>
    <tspan x="386" dy="33">information about the system.</tspan>
  </text>

  <text x="896"
        y="788"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#225f9c">
    <tspan x="896" dy="0">ج. التعامل المناسب مع المعلومات</tspan>
    <tspan x="896" dy="38">الشخصية وحماية الخصوصية.</tspan>
  </text>

  <text x="386"
        y="860"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="386" dy="0">C. Handling personal information</tspan>
    <tspan x="386" dy="33">appropriately and protecting</tspan>
    <tspan x="386" dy="33">privacy.</tspan>
  </text>

  <text x="896"
        y="996"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#225f9c">
    <tspan x="896" dy="0">د. تحديد من يتحمل المسؤولية عن</tspan>
    <tspan x="896" dy="38">قرارات نظام الذكاء الاصطناعي.</tspan>
  </text>

  <text x="386"
        y="1068"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="386" dy="0">D. Identifying who is answerable</tspan>
    <tspan x="386" dy="33">for an AI system’s decisions.</tspan>
  </text>

</svg>
