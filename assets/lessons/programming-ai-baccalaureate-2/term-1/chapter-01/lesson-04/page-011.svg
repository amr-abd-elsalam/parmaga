<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Outlined box shadow and fill -->
<rect x="109" y="808" width="870" height="368" rx="16" fill="#22303f" opacity=".12"/>
<rect x="105" y="802" width="870" height="368" rx="16" fill="#fffdf7" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="818" width="6" height="336" rx="3" fill="#2f7fb5"/>

<!-- Icon: light bulb beside paragraph -->
<g transform="translate(752 328)">
  <circle cx="24" cy="18" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="16" y="32" width="16" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M19 18 L24 24 L29 18" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Surprise face beside paragraph -->
<g transform="translate(880 350)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Illustration: balanced data vs unbalanced data -->
<g>
  <rect x="125" y="420" width="830" height="366" rx="24" fill="url(#ilSky)"/>
  <circle cx="180" cy="460" r="11" fill="#ffffff"/>
  <circle cx="198" cy="454" r="15" fill="#ffffff"/>
  <circle cx="218" cy="462" r="10" fill="#ffffff"/>
  <circle cx="870" cy="458" r="11" fill="#ffffff"/>
  <circle cx="888" cy="452" r="15" fill="#ffffff"/>
  <circle cx="908" cy="460" r="10" fill="#ffffff"/>
  <circle cx="170" cy="720" r="5" fill="#ffd24a"/>
  <circle cx="910" cy="720" r="5" fill="#ffd24a"/>

  <!-- Chart shadows -->
  <circle cx="724" cy="586" r="120" fill="#22303f" opacity=".18"/>
  <circle cx="364" cy="586" r="120" fill="#22303f" opacity=".18"/>

  <!-- Right chart: four nearly equal slices -->
  <path d="M720 580 L720 460 A120 120 0 0 1 839.9 584.2 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M720 580 L839.9 584.2 A120 120 0 0 1 715.8 699.9 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M720 580 L715.8 699.9 A120 120 0 0 1 600 580 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M720 580 L600 580 A120 120 0 0 1 720 460 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left chart: almost one color with one thin slice -->
  <path d="M360 580 L391.1 464.1 A120 120 0 1 1 360 460 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M360 580 L360 460 A120 120 0 0 1 391.1 464.1 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Divider dots -->
  <circle cx="540" cy="556" r="6" fill="#8fc9f2"/>
  <circle cx="540" cy="580" r="6" fill="#8fc9f2"/>
  <circle cx="540" cy="604" r="6" fill="#8fc9f2"/>

  <!-- Green check below right chart -->
  <circle cx="724" cy="748" r="24" fill="#22303f" opacity=".18"/>
  <circle cx="720" cy="742" r="24" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M708 742 L717 751 L733 733" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Red cross below left chart -->
  <circle cx="364" cy="748" r="24" fill="#22303f" opacity=".18"/>
  <circle cx="360" cy="742" r="24" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M350 732 L370 752 M370 732 L350 752" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: pencil inside outlined box -->
<g transform="translate(600 832) rotate(45)">
  <rect x="-6" y="-22" width="12" height="8" rx="2" fill="#c0392b" stroke="#22303f" stroke-width="2.5"/>
  <rect x="-6" y="-14" width="12" height="28" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="-6,14 6,14 0,26" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="-2,21 2,21 0,26" fill="#22303f"/>
</g>

<!-- Bottom icon row -->
<g transform="translate(352 1194)">
  <rect x="14" y="0" width="36" height="46" rx="3" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="4" y="8" width="36" height="46" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M11 20 L33 20 M11 30 L33 30 M11 40 L25 40" fill="none" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>
<g transform="translate(512 1194)">
  <polygon points="28,2 34.5,19.1 52.7,20 38.5,31.4 43.3,49 28,39 12.7,49 17.5,31.4 3.3,20 21.5,19.1" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>
<g transform="translate(672 1194)">
  <path d="M28 10 L8 46 M28 10 L48 46 M8 46 L48 46" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="10" r="9" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="8" cy="46" r="9" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="48" cy="46" r="9" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">البيانات الممثِّلة Representative Data</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Representative Data</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بيانات تضم <tspan font-weight="bold" fill="#17457f">كل الفئات</tspan> التي سيتعامل معها</tspan>
  <tspan x="950" dy="40">النظام، <tspan font-weight="bold" fill="#2e7d32">بنسب معقولة.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Data that includes <tspan font-weight="bold" fill="#17457f">all the groups</tspan></tspan>
  <tspan x="120" dy="40">the system will deal with,</tspan>
  <tspan x="120" dy="40">in <tspan font-weight="bold" fill="#2e7d32">reasonable proportions.</tspan></tspan>
</text>

<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">جرّب بنفسك</text>
<text x="140" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Try It Yourself</text>

<text x="935" y="914" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">طالب ذاكر من امتحانات <tspan font-weight="bold" fill="#17457f">مدرس واحد فقط.</tspan></tspan>
  <tspan x="935" dy="40">ماذا سيحدث له أمام أسلوب مدرس آخر؟</tspan>
  <tspan x="935" dy="40">وما علاقة ذلك <tspan font-weight="bold" fill="#c0392b">ببيانات التدريب؟</tspan></tspan>
</text>
<text x="140" y="1034" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">A student studied <tspan font-weight="bold" fill="#17457f">only one teacher's</tspan></tspan>
  <tspan x="140" dy="40">past exams. What happens when another</tspan>
  <tspan x="140" dy="40">teacher writes the test? How is this</tspan>
  <tspan x="140" dy="40">like <tspan font-weight="bold" fill="#c0392b">training data?</tspan></tspan>
</text>
</svg>
