<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWoodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ab7341"/>
      <stop offset="0.55" stop-color="#8f5c31"/>
      <stop offset="1" stop-color="#784a26"/>
    </linearGradient>
    <linearGradient id="paperToneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fbf6e8"/>
    </linearGradient>
    <pattern id="ruledLinesPat" width="12" height="38" patternUnits="userSpaceOnUse">
      <line x1="0" y1="37.4" x2="12" y2="37.4" stroke="#c8dcee" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWoodGrad)"/>
  <path d="M0,290 C 300,244 780,352 1080,296" fill="none" stroke="#6d4222" stroke-width="16" opacity="0.16"/>
  <path d="M0,985 C 320,1046 760,912 1080,972" fill="none" stroke="#6d4222" stroke-width="14" opacity="0.13"/>

  <rect x="46" y="42" width="1012" height="1294" rx="8" fill="#432a13" opacity="0.26"/>
  <rect x="34" y="28" width="1012" height="1294" rx="8" fill="url(#paperToneGrad)"/>

  <rect x="80" y="86" width="920" height="1220" fill="url(#ruledLinesPat)"/>

  <rect x="67" y="62" width="946" height="1256" rx="5" fill="none" stroke="#cf3a30" stroke-width="2.6"/>

  <rect x="95" y="208" width="890" height="318" rx="12" fill="#e9f6ee" stroke="#8fc7a5" stroke-width="2"/>
  <rect x="95" y="548" width="890" height="346" rx="12" fill="#e9f6ee" stroke="#8fc7a5" stroke-width="2"/>
  <rect x="95" y="916" width="890" height="244" rx="12" fill="#e9f6ee" stroke="#8fc7a5" stroke-width="2"/>

  <line x1="255" y1="959" x2="336" y2="959" stroke="#c0392b" stroke-width="3.2"/>
  <polygon points="334,950 354,959 334,968" fill="#c0392b"/>

  <line x1="255" y1="1007" x2="336" y2="1007" stroke="#c0392b" stroke-width="3.2"/>
  <polygon points="334,998 354,1007 334,1016" fill="#c0392b"/>

  <line x1="255" y1="1055" x2="336" y2="1055" stroke="#c0392b" stroke-width="3.2"/>
  <polygon points="334,1046 354,1055 334,1064" fill="#c0392b"/>

  <line x1="255" y1="1103" x2="336" y2="1103" stroke="#c0392b" stroke-width="3.2"/>
  <polygon points="334,1094 354,1103 334,1112" fill="#c0392b"/>

  <text x="540" y="130"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46"
        font-weight="bold"
        fill="#1f4e79">حل المثال</text>

  <text x="540" y="178"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30"
        fill="#14365c">Worked Example Solution</text>

  <text x="955" y="252"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="31"
        font-weight="bold"
        fill="#1f4e79">حل الصواب والخطأ</text>

  <text x="955" y="296"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1b7a44">أ: صواب — تصف العبارة صورة من صور التحيز الخوارزمي.</text>

  <text x="955" y="334"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#c0392b">
    <tspan x="955" dy="0">ب: خطأ — عندما تكون عملية اتخاذ القرار غامضة،</tspan>
    <tspan x="925" dy="38">يصعب التحقق من صحة النتيجة.</tspan>
  </text>

  <text x="955" y="410"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1b7a44">ج: صواب — هذا وصف صحيح للذكاء الاصطناعي القابل للتفسير.</text>

  <text x="955" y="448"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#c0392b">
    <tspan x="955" dy="0">د: خطأ — قد تختلف المسؤولية باختلاف دور المطور</tspan>
    <tspan x="925" dy="38">أو المستخدم أو المشغّل.</tspan>
  </text>

  <text x="125" y="594"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        font-weight="bold"
        fill="#14365c">True or False Solution</text>

  <text x="125" y="638"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#1b7a44">
    <tspan x="125" dy="0">A: True — The statement describes a form of</tspan>
    <tspan x="165" dy="36">algorithmic bias.</tspan>
  </text>

  <text x="125" y="710"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#c0392b">
    <tspan x="125" dy="0">B: False — When the decision-making process is</tspan>
    <tspan x="165" dy="36">opaque, it is difficult to verify the result.</tspan>
  </text>

  <text x="125" y="782"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#1b7a44">C: True — This correctly describes Explainable AI.</text>

  <text x="125" y="818"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#c0392b">
    <tspan x="125" dy="0">D: False — Responsibility may differ depending</tspan>
    <tspan x="165" dy="36">on the developer, user, or operator.</tspan>
  </text>

  <text x="170" y="968"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#14365c">أ</text>
  <text x="182" y="968"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14365c">/ A</text>
  <text x="570" y="968"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1b7a44">العدالة</text>
  <text x="595" y="968"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#1b7a44">Fairness</text>

  <text x="170" y="1016"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#14365c">ب</text>
  <text x="182" y="1016"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14365c">/ B</text>
  <text x="570" y="1016"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1b7a44">الشفافية</text>
  <text x="595" y="1016"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#1b7a44">Transparency</text>

  <text x="170" y="1064"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#14365c">ج</text>
  <text x="182" y="1064"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#14365c">/ C</text>
  <text x="570" y="1064"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#1b7a44">حماية الخصوصية</text>
  <text x="595" y="1064"
