  <path d="M170 590 L170 676" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230 590 L230 676" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="500" r="30" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M170 496 C170 464, 230 464, 230 496 C222 482, 178 482, 170 496 Z" fill="#2b211c"/>
  <circle cx="190" cy="503" r="3.5" fill="#22303f"/>
  <circle cx="210" cy="503" r="3.5" fill="#22303f"/>
  <path d="M191 515 Q200 521 209 515" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
