  <path d="M610 1186 L690 1186 Q650 1216 610 1186 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- face check with magnifier -->
  <path d="M756 1136 L756 1116 L776 1116 M824 1116 L844 1116 L844 1136 M756 1184 L756 1204 L776 1204 M844 1184 L844 1204 L824 1204" fill="none" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="1160" r="34" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M766 1156 C766 1118, 834 1118, 834 1156 C822 1140, 778 1140, 766 1156 Z" fill="#2b211c"/>
  <circle cx="788" cy="1164" r="3.5" fill="#22303f"/>
