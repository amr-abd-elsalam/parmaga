<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">3. القبض الخطأ في ديترويت</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">3. The Wrongful Arrest in Detroit</tspan>
</text>
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في 2020، قُبض على روبرت ويليامز <tspan font-weight="bold" fill="#c0392b">خطأً</tspan></tspan>
  <tspan x="950" dy="40">في ديترويت بسبب <tspan font-weight="bold" fill="#17457f">نظام للتعرف على الوجه.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In 2020, Robert Williams was</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">wrongly</tspan> arrested in Detroit because</tspan>
  <tspan x="120" dy="40">of a <tspan font-weight="bold" fill="#17457f">face-recognition system.</tspan></tspan>
</text>
<text x="935" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="935" dy="0">فكّر</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="140" dy="0">Think</tspan>
</text>
<text x="935" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">من <tspan font-weight="bold" fill="#17457f">يُحاسَب</tspan> هنا: الشركة المطوّرة،</tspan>
  <tspan x="935" dy="40">أم الشرطة التي اعتمدت على النظام دون تحقق؟</tspan>
</text>
<text x="140" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Who should be <tspan font-weight="bold" fill="#17457f">held answerable</tspan> here:</tspan>
  <tspan x="140" dy="40">the company that built it,</tspan>
  <tspan x="140" dy="40">or the police who relied on it</tspan>
  <tspan x="140" dy="40">without checking?</tspan>
</text>
</svg>
