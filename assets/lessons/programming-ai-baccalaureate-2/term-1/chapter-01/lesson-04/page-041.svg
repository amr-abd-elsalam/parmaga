  <polygon points="888,1214 894,1208 922,1236 916,1242" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="870" cy="1196" r="26" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
