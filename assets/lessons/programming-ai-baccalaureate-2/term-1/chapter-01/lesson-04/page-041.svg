  <rect x="532" y="1110" width="16" height="118" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <rect x="490" y="1226" width="100" height="14" rx="7" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
  <rect x="420" y="1116" width="240" height="10" rx="5" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1104" r="10" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M430 1126 L400 1186 M430 1126 L460 1186 M650 1126 L620 1186 M650 1126 L680 1186" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
