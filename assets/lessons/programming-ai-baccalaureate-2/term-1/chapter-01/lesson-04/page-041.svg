<!-- Icon: warning triangle beside the paragraph -->
<g transform="translate(830 300)">
  <polygon points="28,2 54,52 2,52" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="25" y="16" width="6" height="22" rx="3" fill="#22303f"/>
  <circle cx="28" cy="45" r="3.5" fill="#22303f"/>
</g>

<!-- Emotion face: thinking -->
<g transform="translate(540 760)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: pencil -->
<g transform="translate(600 736)">
  <polygon points="8,34 34,8 44,18 18,44" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="34,8 40,2 50,12 44,18" fill="#c0392b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="8,34 18,44 2,50" fill="#e8dfd1" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="2,50 4,44 8,48" fill="#22303f"/>
</g>

<!-- Memory illustration: camera, balance scale, face check (no text) -->
<g>
  <!-- shadows -->
  <rect x="234" y="1122" width="100" height="44" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="494" y="1232" width="100" height="14" rx="7" fill="#22303f" opacity=".18"/>
  <circle cx="874" cy="1202" r="26" fill="#22303f" opacity=".18"/>
  <!-- security camera -->
  <rect x="190" y="1110" width="14" height="60" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="204" y="1132" width="30" height="10" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <rect x="230" y="1116" width="100" height="44" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="250" cy="1130" r="5" fill="#c0392b"/>
  <circle cx="330" cy="1138" r="16" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="330" cy="1138" r="7" fill="#4fc3e8"/>
