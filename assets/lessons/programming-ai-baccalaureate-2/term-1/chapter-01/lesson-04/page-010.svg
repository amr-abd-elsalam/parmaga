    <polygon points="12,-26 10,-40 2,-30" fill="#22303f" stroke="#22303f" stroke-width="1.25" stroke-linejoin="round"/>
    <circle cx="0" cy="-18" r="14" fill="#22303f" stroke="#22303f" stroke-width="1.25"/>
    <circle cx="-5" cy="-20" r="2.5" fill="#ffd24a"/>
    <circle cx="5" cy="-20" r="2.5" fill="#ffd24a"/>
    <path d="M-3 -12 Q0 -10 3 -12" fill="none" stroke="#8fc9f2" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Large question mark (middle) -->
  <g transform="translate(544 1046) scale(2)">
    <path d="M-30 -40 A30 30 0 0 1 30 -40 Q30 -18 8 -8 L8 10 L-8 10 L-8 -16 Q14 -24 14 -40 A14 14 0 0 0 -14 -40 Z" fill="#22303f" opacity=".18"/>
    <circle cx="0" cy="28" r="9" fill="#22303f" opacity=".18"/>
  </g>
  <g transform="translate(540 1040) scale(2)">
    <path d="M-30 -40 A30 30 0 0 1 30 -40 Q30 -18 8 -8 L8 10 L-8 10 L-8 -16 Q14 -24 14 -40 A14 14 0 0 0 -14 -40 Z" fill="#c96a1b" stroke="#22303f" stroke-width="1.25" stroke-linejoin="round"/>
    <circle cx="0" cy="28" r="9" fill="#c96a1b" stroke="#22303f" stroke-width="1.25"/>
  </g>

  <!-- Thought bubble with three white cats -->
  <circle cx="796" cy="1062" r="5" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <circle cx="782" cy="1042" r="8" fill="#dff1f7" stroke="#22303f" stroke-width="2"/>
  <ellipse cx="760" cy="960" rx="130" ry="62" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <g transform="translate(690 972)">
    <path d="M16 24 Q34 22 28 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="10" rx="18" ry="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <polygon points="-12,-26 -10,-40 -2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="12,-26 10,-40 2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-18" r="14" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="-5" cy="-20" r="2.5" fill="#22303f"/>
    <circle cx="5" cy="-20" r="2.5" fill="#22303f"/>
  </g>
  <g transform="translate(760 972)">
    <path d="M16 24 Q34 22 28 0" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="10" rx="18" ry="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <polygon points="-12,-26 -10,-40 -2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="12,-26 10,-40 2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-18" r="14" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="-5" cy="-20" r="2.5" fill="#22303f"/>
    <circle cx="5" cy="-20" r="2.5" fill="#22303f"/>
  </g>
  <g transform="translate(830 972)">
    <path d="M16 24 Q30 22 26 4" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="10" rx="18" ry="22" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <polygon points="-12,-26 -10,-40 -2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="12,-26 10,-40 2,-30" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-18" r="14" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="-5" cy="-20" r="2.5" fill="#22303f"/>
    <circle cx="5" cy="-20" r="2.5" fill="#22303f"/>
  </g>

  <!-- Child (right) -->
  <ellipse cx="814" cy="1216" rx="52" ry="7" fill="#22303f" opacity=".18"/>
  <rect x="796" y="1172" width="13" height="40" rx="5" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
