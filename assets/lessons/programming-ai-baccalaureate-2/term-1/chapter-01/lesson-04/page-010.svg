  <rect x="125" y="870" width="830" height="380" rx="24" fill="url(#ilSky)"/>
  <path d="M125 1200 L955 1200 L955 1226 Q955 1250 931 1250 L149 1250 Q125 1250 125 1226 Z" fill="#e8dfd1"/>
  <path d="M180 912 L184 924 L196 924 L186 932 L190 944 L180 936 L170 944 L174 932 L164 924 L176 924 Z" fill="#ffd24a" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="240" cy="930" r="5" fill="#ffd24a"/>
