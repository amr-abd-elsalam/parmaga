<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9713f"/>
      <stop offset="0.55" stop-color="#8d5931"/>
      <stop offset="1" stop-color="#794824"/>
    </linearGradient>
    <linearGradient id="paperTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf5e8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#deskWood)"/>
  <path d="M0 260 C 300 218, 770 306, 1080 258" fill="none" stroke="#67391a" stroke-width="11" opacity="0.15"/>
  <path d="M0 1110 C 330 1150, 750 1058, 1080 1104" fill="none" stroke="#67391a" stroke-width="13" opacity="0.12"/>

  <rect x="44" y="40" width="1012" height="1294" rx="10" fill="#3a2110" opacity="0.24"/>
  <rect x="34" y="28" width="1012" height="1294" rx="8" fill="url(#paperTone)"/>

  <g stroke="#bcd6ea" stroke-width="1.6" opacity="0.75">
    <line x1="95" y1="200" x2="985" y2="200"/>
    <line x1="95" y1="236" x2="985" y2="236"/>
    <line x1="95" y1="272" x2="985" y2="272"/>
    <line x1="95" y1="308" x2="985" y2="308"/>
    <line x1="95" y1="344" x2="985" y2="344"/>
    <line x1="95" y1="380" x2="985" y2="380"/>
    <line x1="95" y1="416" x2="985" y2="416"/>
    <line x1="95" y1="452" x2="985" y2="452"/>
    <line x1="95" y1="488" x2="985" y2="488"/>
    <line x1="95" y1="524" x2="985" y2="524"/>
    <line x1="95" y1="560" x2="985" y2="560"/>
    <line x1="95" y1="596" x2="985" y2="596"/>
    <line x1="95" y1="632" x2="985" y2="632"/>
    <line x1="95" y1="668" x2="985" y2="668"/>
    <line x1="95" y1="704" x2="985" y2="704"/>
    <line x1="95" y1="740" x2="985" y2="740"/>
    <line x1="95" y1="776" x2="985" y2="776"/>
    <line x1="95" y1="812" x2="985" y2="812"/>
    <line x1="95" y1="848" x2="985" y2="848"/>
    <line x1="95" y1="884" x2="985" y2="884"/>
    <line x1="95" y1="920" x2="985" y2="920"/>
    <line x1="95" y1="956" x2="985" y2="956"/>
    <line x1="95" y1="992" x2="985" y2="992"/>
    <line x1="95" y1="1028" x2="985" y2="1028"/>
    <line x1="95" y1="1064" x2="985" y2="1064"/>
    <line x1="95" y1="1100" x2="985" y2="1100"/>
    <line x1="95" y1="1136" x2="985" y2="1136"/>
  </g>

  <rect x="67" y="62" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <g fill="#ffffff" fill-opacity="0.92" stroke="#c0392b" stroke-width="2.4">
    <circle cx="928" cy="298" r="20"/>
    <circle cx="928" cy="370" r="20"/>
    <circle cx="928" cy="442" r="20"/>
    <circle cx="928" cy="550" r="20"/>
    <circle cx="152" cy="730" r="20"/>
    <circle cx="152" cy="802" r="20"/>
    <circle cx="152" cy="910" r="20"/>
    <circle cx="152" cy="1018" r="20"/>
  </g>

  <text x="540" y="130"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="40" font-weight="bold" fill="#123a5e">مثال محلول — صواب أم خطأ؟</text>

  <text x="540" y="174"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#2b5480">Worked Example — True or False?</text>

  <text x="950" y="236"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30" font-weight="bold" fill="#1a4f86">ضع علامة صواب أو خطأ أمام كل عبارة:</text>

  <text x="886" y="308"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#1d5b9a">
    <tspan x="886" dy="0">أ. التحيز الخوارزمي هو تحيز في أحكام نظام الذكاء</tspan>
    <tspan x="886" dy="36">الاصطناعي قد ينتج من التحيز في بيانات التدريب.</tspan>
  </text>

  <text x="886" y="380"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#1d5b9a">
    <tspan x="886" dy="0">ب. لا توجد مشكلة عندما تكون عملية اتخاذ القرار في</tspan>
    <tspan x="886" dy="36">نظام الذكاء الاصطناعي غامضة، ما دام الناتج صحيحًا.</tspan>
  </text>

  <text x="886" y="452"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#1d5b9a">ج. يساعد الذكاء الاصطناعي القابل للتفسير</text>

  <text x="886" y="488"
        direction="ltr" unicode-bidi="plaintext" text-anchor="end"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28" fill="#1d5b9a">Explainable AI (XAI)</text>

  <text x="886" y="524"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#1d5b9a">البشر على فهم أسباب قرارات النظام.</text>

  <text x="886" y="560"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#1d5b9a">
    <tspan x="886" dy="0">د. عندما يتخذ نظام الذكاء الاصطناعي قرارًا خاطئًا،</tspan>
    <tspan x="886" dy="36">يكون الشخص المسؤول عنه محددًا بوضوح دائمًا.</tspan>
  </text>

  <text x="132" y="668"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#14395c">Mark each statement True or False:</text>

  <text x="192" y="740"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#152b42">
    <tspan x="192" dy="0">A. Algorithmic bias is bias in AI judgments</tspan>
    <tspan x="192" dy="36">that may result from bias in the training data.</tspan>
  </text>

  <text x="192" y="812"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#152b42">
    <tspan x="192" dy="0">B. There is no problem when an AI system’s</tspan>
    <tspan x="192" dy="36">decision-making process is opaque, as long</tspan>
    <tspan x="192" dy="36">as the result is correct.</tspan>
  </text>

  <text x="192" y="920"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#152b42">
    <tspan x="192" dy="0">C. Explainable AI (XAI) helps humans</tspan>
    <tspan x="192" dy="36">understand the reasons for an AI</tspan>
    <tspan x="192" dy="36">system’s decisions.</tspan>
  </text>

  <text x="192" y="1028"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#152b42">
    <tspan x="192" dy="0">D. When an AI system makes an incorrect</tspan>
    <tspan x="192" dy="36">decision, the responsible person is always</tspan>
    <tspan x="192" dy="36">clearly determined.</tspan>
  </text>

</svg>
