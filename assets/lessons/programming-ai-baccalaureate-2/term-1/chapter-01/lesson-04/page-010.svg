<!-- Texts -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">4. بيانات التدريب Training Data</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">4. Training Data</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> <tspan font-weight="bold" fill="#17457f">الأمثلة</tspan> التي يتعلم منها</tspan>
  <tspan x="935" dy="40">نظام الذكاء الاصطناعي أنماطه قبل استخدامه؛</tspan>
  <tspan x="935" dy="40">وكلما قلّ تمثيلها للواقع</tspan>
  <tspan x="935" dy="40">زاد احتمال <tspan font-weight="bold" fill="#17457f">تحيّز</tspan> مخرجاته.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> the <tspan font-weight="bold" fill="#17457f">examples</tspan> from which</tspan>
  <tspan x="140" dy="40">an AI system learns its patterns</tspan>
  <tspan x="140" dy="40">before it is used; the less they</tspan>
  <tspan x="140" dy="40">represent reality, the more likely</tspan>
  <tspan x="140" dy="40">its outputs are to be <tspan font-weight="bold" fill="#17457f">biased.</tspan></tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مثال:</tspan> طفل لم يرَ في حياته إلا قططًا <tspan fill="#c96a1b">بيضاء،</tspan></tspan>
  <tspan x="950" dy="40">فإذا رأى قطة <tspan fill="#c96a1b">سوداء</tspan> قال: هذه ليست قطة!</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Example:</tspan> a child who has only ever seen</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">white</tspan> cats sees a <tspan fill="#c96a1b">black</tspan> cat and says:</tspan>
  <tspan x="120" dy="40">That is not a cat!</tspan>
</text>
</svg>
