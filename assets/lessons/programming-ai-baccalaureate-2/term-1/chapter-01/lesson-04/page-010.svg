  <!-- Dark cat (left) -->
  <ellipse cx="290" cy="1210" rx="70" ry="8" fill="#22303f" opacity=".18"/>
  <g transform="translate(280 1140) scale(2)">
    <path d="M16 24 Q36 22 30 0" fill="none" stroke="#22303f" stroke-width="5" stroke-linecap="round"/>
