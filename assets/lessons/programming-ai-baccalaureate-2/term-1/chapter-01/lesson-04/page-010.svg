  <path d="M780 1182 Q778 1124 811 1118 Q844 1124 842 1182 Z" fill="url(#ilTunic)" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M811 1122 L811 1178" fill="none" stroke="#8fc9f2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="782" cy="1176" r="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="840" cy="1176" r="6" fill="#e8b98d" stroke="#22303f" stroke-width="2"/>
  <circle cx="811" cy="1094" r="22" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M789 1090 Q791 1070 811 1070 Q831 1070 833 1090 Q822 1080 811 1082 Q800 1080 789 1090 Z" fill="#2b211c" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="802" cy="1096" r="3" fill="#22303f"/>
  <circle cx="816" cy="1096" r="3" fill="#22303f"/>
  <circle cx="809" cy="1107" r="3" fill="#22303f"/>
