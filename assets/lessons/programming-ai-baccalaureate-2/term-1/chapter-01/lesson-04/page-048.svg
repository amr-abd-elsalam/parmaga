<text x="433" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="433" dy="0">Words in the question</tspan>
</text>
<text x="397" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="397" dy="0">المبدأ</tspan>
</text>
<text x="113" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="113" dy="0">Principle</tspan>
</text>

<!-- Row 1 -->
<text x="965" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">الإفصاح، سهل الفهم،</tspan>
  <tspan x="965" dy="40">توضيح العملية</tspan>
</text>
<text x="433" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="433" dy="0">Disclosing,</tspan>
  <tspan x="433" dy="40">easy to understand,</tspan>
  <tspan x="433" dy="40">showing the process</tspan>
</text>
<text x="397" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="397" dy="0">الشفافية</tspan>
</text>
<text x="113" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="113" dy="0">Transparency</tspan>
</text>

<!-- Row 2 -->
<text x="965" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">البيانات الشخصية،</tspan>
  <tspan x="965" dy="40">الغرض الأصلي، الموافقة</tspan>
</text>
<text x="433" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="433" dy="0">Personal data,</tspan>
  <tspan x="433" dy="40">original purpose, consent</tspan>
</text>
<text x="397" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="397" dy="0">حماية الخصوصية</tspan>
</text>
<text x="113" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="113" dy="0">Privacy</tspan>
  <tspan x="113" dy="40">protection</tspan>
</text>

<!-- Row 3 -->
<text x="965" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">يُحاسَب، يتحمل النتيجة،</tspan>
  <tspan x="965" dy="40">عندما يتبين الخطأ</tspan>
</text>
<text x="433" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="433" dy="0">Answerable,</tspan>
  <tspan x="433" dy="40">bears the result,</tspan>
  <tspan x="433" dy="40">when it turns out wrong</tspan>
</text>
<text x="397" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#2e7d32">
  <tspan x="397" dy="0">المساءلة</tspan>
</text>
<text x="113" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#2e7d32">
  <tspan x="113" dy="0">Accountability</tspan>
</text>

