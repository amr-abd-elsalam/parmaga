<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">9. الخصوصية Privacy</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">9. Privacy</tspan>
</text>

<!-- Card paragraph 1 -->
<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">تعريف الكتاب:</tspan> التعامل المناسب مع</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">البيانات الشخصية</tspan> وحمايتها.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Textbook definition:</tspan></tspan>
  <tspan x="140" dy="40">appropriate handling and protection</tspan>
  <tspan x="140" dy="40">of <tspan font-weight="bold" fill="#c0392b">personal data.</tspan></tspan>
</text>

<!-- Card paragraph 2 -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#17457f">التعريف الأعمق:</tspan> حقك في أن <tspan font-weight="bold" fill="#c0392b">تتحكم</tspan> في</tspan>
  <tspan x="935" dy="40">معلوماتك: من يعرفها، وماذا يعرف منها،</tspan>
  <tspan x="935" dy="40">ولأي غرض يستخدمها.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#17457f">Deeper definition:</tspan> your right to</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#c0392b">control</tspan> your information:</tspan>
  <tspan x="140" dy="40">who knows it, what they know, and for</tspan>
  <tspan x="140" dy="40">what purpose they use it.</tspan>
</text>

