  <rect x="67" y="62" width="946" height="1256" rx="6" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <rect x="95" y="164" width="890" height="94" rx="14" fill="#fdf5d0" stroke="#d9c26a" stroke-width="2"/>

  <rect x="690" y="390" width="260" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>
  <rect x="690" y="520" width="260" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>
  <rect x="690" y="616" width="260" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>

  <rect x="118" y="796" width="250" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>
  <rect x="118" y="921" width="250" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>
  <rect x="340" y="1054" width="250" height="42" rx="8" fill="#fdf3c4" stroke="#d8bf6a" stroke-width="2"/>

  <text x="540"
        y="106"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#1b4f8a">اقرأ الفقرة وأكمل الفراغات</text>

  <text x="540"
        y="146"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="28"
        fill="#2a6099">Read and Complete the Passage</text>

  <text x="950"
        y="202"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="27"
        fill="#6b5a1e">أكمل الفراغات من المصطلحات التي تعلمتها في الدرس.</text>

  <text x="125"
        y="240"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="26"
        fill="#6b5a1e">Complete the blanks using the terms learned in the lesson.</text>

  <text x="950"
        y="296"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">مع انتشار أنظمة الذكاء الاصطناعي، برزت قضايا أخلاقية متعددة.</tspan>
    <tspan x="950" dy="38">عندما يؤدي التحيز في بيانات التدريب إلى تحيز في أحكام نظام</tspan>
    <tspan x="950" dy="38">الذكاء الاصطناعي، تظهر مشكلة</tspan>
  </text>

  <text x="820"
        y="420"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="29"
        fill="#4a4327">(1) __________.</text>

  <text x="950"
        y="466"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">ولمعالجة مشكلة «الصندوق الأسود»، حيث لا يكون سبب اتخاذ</tspan>
    <tspan x="950" dy="38">القرار واضحًا، يجري تطوير تقنية تسمى</tspan>
  </text>

  <text x="820"
        y="550"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="29"
        fill="#4a4327">(2) __________</text>

  <text x="670"
        y="550"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">لمساعدة البشر على فهم أسباب القرار.</text>

  <text x="950"
        y="598"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">وعندما يصدر نظام الذكاء الاصطناعي حكمًا خاطئًا، تبرز مسألة</text>

  <text x="820"
        y="646"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="29"
        fill="#4a4327">(3) __________</text>

  <text x="670"
        y="646"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">لتحديد من يتحمل نتائج هذا القرار.</text>

  <text x="118"
        y="714"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="118" dy="0">As AI systems spread, various ethical issues arise.</tspan>
    <tspan x="118" dy="33">When bias in the training data leads to bias in an AI</tspan>
    <tspan x="118" dy="33">system’s judgments, the problem of</tspan>
  </text>

  <text x="243"
        y="825"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#4a4327">(1) __________</text>

  <text x="386"
        y="825"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">appears.</text>

  <text x="118"
        y="872"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="118" dy="0">To address the “black-box” problem, where the reason</tspan>
    <tspan x="118" dy="33">for a decision is unclear, a technology called</tspan>
  </text>

  <text x="243"
        y="950"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#4a4327">(2) __________</text>

  <text x="386"
        y="950"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">is being developed to help humans</text>

  <text x="118"
        y="996"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">understand the reasons for the decision.</text>

  <text x="118"
        y="1038"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">When an AI system produces an incorrect judgment,</text>

  <text x="118"
        y="1084"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">the issue of</text>

  <text x="465"
        y="1084"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#4a4327">(3) __________</text>

  <text x="118"
        y="1130"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">arises to determine who is answerable for the result.</text>

</svg>
