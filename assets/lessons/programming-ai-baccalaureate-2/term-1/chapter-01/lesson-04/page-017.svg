<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="ilWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fc9f2"/>
    <stop offset="1" stop-color="#2f7fb5"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<!-- Shadows -->
<rect x="109" y="248" width="870" height="328" rx="16" fill="#22303f" opacity=".12"/>
<rect x="109" y="956" width="866" height="300" rx="20" fill="#22303f" opacity=".18"/>

<!-- Info card -->
<rect x="105" y="242" width="870" height="328" rx="16" fill="#eaf2fb" stroke="#9db9d6" stroke-width="2"/>
<rect x="961" y="258" width="6" height="296" rx="3" fill="#2f7fb5"/>

<!-- Tag icon beside the English header -->
<g transform="translate(902 182)">
  <path d="M2 8 Q2 2 8 2 L24 2 L42 20 Q44 22 42 24 L24 42 Q22 44 20 42 L2 24 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="12" cy="12" r="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Open book icon in the card corner -->
<g transform="translate(127 254)">
  <path d="M28 8 Q16 2 2 6 L2 42 Q16 38 28 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 8 Q40 2 54 6 L54 42 Q40 38 28 44 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="8" y1="16" x2="22" y2="18" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="26" x2="22" y2="28" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="18" x2="48" y2="16" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="28" x2="48" y2="26" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Surprise face beside the example paragraph -->
<g transform="translate(175 650)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Document stack icon beside the English example -->
<g transform="translate(880 800)">
  <rect x="12" y="0" width="40" height="50" rx="4" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <rect x="2" y="8" width="40" height="50" rx="4" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <line x1="10" y1="22" x2="34" y2="22" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="34" y2="32" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="42" x2="28" y2="42" stroke="#2f7fb5" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Illustration: a removed attribute returns through another CV field -->
<g>
  <rect x="105" y="950" width="866" height="300" rx="20" fill="url(#ilSky)"/>
  <path d="M105 1212 H971 V1230 Q971 1250 951 1250 H125 Q105 1250 105 1230 Z" fill="#e8dfd1"/>
  <ellipse cx="800" cy="1000" rx="24" ry="13" fill="#ffffff"/>
  <ellipse cx="824" cy="993" rx="20" ry="15" fill="#ffffff"/>
  <ellipse cx="846" cy="1002" rx="18" ry="11" fill="#ffffff"/>
  <circle cx="920" cy="992" r="18" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="380" cy="990" rx="20" ry="11" fill="#ffffff"/>
  <ellipse cx="398" cy="984" rx="16" ry="12" fill="#ffffff"/>

  <!-- Back door on the left -->
  <rect x="154" y="1066" width="126" height="146" fill="#22303f" opacity=".18"/>
  <rect x="150" y="1060" width="126" height="150" fill="url(#ilWall)" stroke="#22303f" stroke-width="2.5"/>
  <rect x="142" y="1050" width="142" height="14" rx="4" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <rect x="190" y="1100" width="60" height="110" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="190,1100 168,1108 168,1206 190,1210" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="174" cy="1158" r="3.5" fill="#ffd24a"/>
  <!-- Same person symbol appearing again -->
  <circle cx="220" cy="1144" r="10" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M202 1180 Q220 1152 238 1180 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- CV sheet in the center -->
  <rect x="444" y="986" width="200" height="235" rx="8" fill="#22303f" opacity=".18"/>
  <rect x="440" y="980" width="200" height="235" rx="8" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <rect x="460" y="998" width="90" height="12" rx="4" fill="#c96a1b"/>
  <rect x="460" y="1018" width="140" height="6" rx="3" fill="#8fc9f2"/>
  <!-- Top line with person symbol, crossed out -->
  <circle cx="468" cy="1040" r="5" fill="#c96a1b" stroke="#22303f" stroke-width="2"/>
  <path d="M459 1054 Q468 1042 477 1054 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <rect x="486" y="1042" width="130" height="8" rx="4" fill="#2f7fb5"/>
  <line x1="452" y1="1046" x2="628" y2="1046" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <!-- Ordinary lines -->
  <rect x="460" y="1072" width="156" height="6" rx="3" fill="#8fc9f2"/>
  <rect x="460" y="1094" width="130" height="6" rx="3" fill="#8fc9f2"/>
  <rect x="460" y="1116" width="146" height="6" rx="3" fill="#8fc9f2"/>
  <!-- Highlighted lower line -->
  <rect x="452" y="1138" width="176" height="24" rx="6" fill="#ffd24a"/>
  <rect x="462" y="1147" width="150" height="6" rx="3" fill="#2f7fb5"/>
  <rect x="460" y="1180" width="150" height="6" rx="3" fill="#8fc9f2"/>
  <rect x="460" y="1198" width="110" height="6" rx="3" fill="#8fc9f2"/>

  <!-- Dotted arrow around the back of the sheet to the back door -->
  <g fill="#c0392b">
    <circle cx="650" cy="1150" r="3.5"/>
    <circle cx="666" cy="1150" r="3.5"/>
    <circle cx="682" cy="1150" r="3.5"/>
    <circle cx="698" cy="1152" r="3.5"/>
    <circle cx="709" cy="1162" r="3.5"/>
    <circle cx="712" cy="1178" r="3.5"/>
    <circle cx="712" cy="1194" r="3.5"/>
    <circle cx="712" cy="1210" r="3.5"/>
    <circle cx="706" cy="1224" r="3.5"/>
    <circle cx="692" cy="1232" r="3.5"/>
    <circle cx="676" cy="1232" r="3.5"/>
    <circle cx="660" cy="1232" r="3.5"/>
    <circle cx="644" cy="1232" r="3.5"/>
    <circle cx="628" cy="1232" r="3.5"/>
    <circle cx="612" cy="1232" r="3.5"/>
    <circle cx="596" cy="1232" r="3.5"/>
    <circle cx="580" cy="1232" r="3.5"/>
    <circle cx="564" cy="1232" r="3.5"/>
    <circle cx="548" cy="1232" r="3.5"/>
    <circle cx="532" cy="1232" r="3.5"/>
    <circle cx="516" cy="1232" r="3.5"/>
    <circle cx="500" cy="1232" r="3.5"/>
    <circle cx="484" cy="1232" r="3.5"/>
    <circle cx="468" cy="1232" r="3.5"/>
    <circle cx="452" cy="1232" r="3.5"/>
    <circle cx="436" cy="1232" r="3.5"/>
    <circle cx="420" cy="1232" r="3.5"/>
    <circle cx="404" cy="1232" r="3.5"/>
    <circle cx="388" cy="1232" r="3.5"/>
    <circle cx="372" cy="1232" r="3.5"/>
    <circle cx="356" cy="1232" r="3.5"/>
    <circle cx="340" cy="1232" r="3.5"/>
    <circle cx="326" cy="1228" r="3.5"/>
    <circle cx="316" cy="1216" r="3.5"/>
    <circle cx="312" cy="1200" r="3.5"/>
    <circle cx="312" cy="1184" r="3.5"/>
    <circle cx="310" cy="1168" r="3.5"/>
  </g>
  <polygon points="286,1150 304,1140 304,1160" fill="#c0392b"/>
</g>

<!-- Text layer -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">7. المتغير البديل Proxy Variable</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">7. Proxy Variable</tspan>
</text>

<text x="935" y="274" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> متغير يبدو محايدًا،</tspan>
  <tspan x="935" dy="40">لكنه يرتبط بقوة <tspan font-weight="bold" fill="#17457f">بسمة محمية،</tspan> فيتسرب</tspan>
  <tspan x="935" dy="40">التمييز من خلاله حتى لو حذفنا السمة نفسها.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> a variable that looks</tspan>
  <tspan x="140" dy="40">neutral but is strongly linked to a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">protected attribute,</tspan> so</tspan>
  <tspan x="140" dy="40">discrimination leaks through it even if</tspan>
  <tspan x="140" dy="40">the attribute itself is removed.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">مثال:</tspan> حذفنا خانة <tspan fill="#c96a1b">«الجنس»</tspan> من السيرة</tspan>
  <tspan x="950" dy="40">الذاتية، لكن النظام عرفه من اسم المدرسة</tspan>
  <tspan x="950" dy="40">أو النادي؛ فعاد التمييز من <tspan font-weight="bold" fill="#17457f">الباب الخلفي.</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Example:</tspan> we removed the <tspan fill="#c96a1b">"gender"</tspan> field</tspan>
  <tspan x="120" dy="40">from the CV, but the system guessed it</tspan>
  <tspan x="120" dy="40">from the school or club name, so</tspan>
  <tspan x="120" dy="40">discrimination came back</tspan>
  <tspan x="120" dy="40">through the <tspan font-weight="bold" fill="#17457f">back door.</tspan></tspan>
</text>
</svg>
