<!-- Icon: AI chip -->
<g transform="translate(118 840)">
  <path d="M18 2 L18 8 M26 2 L26 8 M34 2 L34 8 M18 44 L18 50 M26 44 L26 50 M34 44 L34 50 M2 18 L8 18 M2 26 L8 26 M2 34 L8 34 M44 18 L50 18 M44 26 L50 26 M44 34 L50 34" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
