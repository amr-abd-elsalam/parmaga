<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">الدرس: هنا اجتمع <tspan font-weight="bold" fill="#17457f">باب البيانات</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">والمتغير البديل</tspan> معًا.</tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">The lesson: the <tspan font-weight="bold" fill="#17457f">data door</tspan> and</tspan>
  <tspan x="140" dy="40">a <tspan font-weight="bold" fill="#17457f">proxy variable</tspan> worked together here.</tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">2. دراسة «Gender Shades»</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">2. The &quot;Gender Shades&quot; Study</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في 2018، اختبر باحثون من MIT أنظمة تجارية</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">لتحليل الوجوه.</tspan></tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In 2018, researchers at MIT tested</tspan>
  <tspan x="120" dy="40">commercial <tspan font-weight="bold" fill="#17457f">face-analysis systems.</tspan></tspan>
</text>

<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وصل الخطأ مع النساء ذوات البشرة الداكنة</tspan>
  <tspan x="950" dy="40">إلى نحو <tspan fill="#c96a1b">35%،</tspan> بينما كان أقل من <tspan fill="#c96a1b">1%</tspan> مع الرجال</tspan>
  <tspan x="950" dy="40">ذوي البشرة الفاتحة.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The error rate reached about <tspan fill="#c96a1b">35%</tspan> for</tspan>
  <tspan x="120" dy="40">darker-skinned women but was under <tspan fill="#c96a1b">1%</tspan></tspan>
  <tspan x="120" dy="40">for lighter-skinned men.</tspan>
</text>

<text x="910" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="910" dy="0">نساء ذوات بشرة داكنة:</tspan>
  <tspan x="910" dy="40">نحو <tspan fill="#c96a1b">35%</tspan></tspan>
</text>
<text x="600" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="600" dy="0">Darker-skinned women:</tspan>
  <tspan x="600" dy="40">about <tspan fill="#c96a1b">35%</tspan></tspan>
</text>
<text x="450" y="1074" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="450" dy="0">رجال ذوو بشرة فاتحة:</tspan>
  <tspan x="450" dy="40">أقل من <tspan fill="#c96a1b">1%</tspan></tspan>
</text>
<text x="175" y="1154" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">
  <tspan x="175" dy="0">Lighter-skinned men:</tspan>
  <tspan x="175" dy="40">under <tspan fill="#c96a1b">1%</tspan></tspan>
</text>
</svg>
