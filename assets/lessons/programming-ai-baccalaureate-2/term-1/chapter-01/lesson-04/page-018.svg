  <rect x="446" y="982" width="20" height="14" rx="4" fill="#8fc9f2"/>
  <rect x="472" y="982" width="40" height="14" rx="4" fill="#4fc3e8"/>
  <rect x="410" y="1013" width="18" height="14" rx="4" fill="#8fc9f2"/>
  <rect x="434" y="1013" width="40" height="14" rx="4" fill="#4fc3e8"/>
  <rect x="480" y="1013" width="32" height="14" rx="4" fill="#8fc9f2"/>
  <rect x="410" y="1044" width="44" height="14" rx="4" fill="#4fc3e8"/>
  <rect x="460" y="1044" width="18" height="14" rx="4" fill="#8fc9f2"/>
  <rect x="484" y="1044" width="28" height="14" rx="4" fill="#4fc3e8"/>

  <!-- Arrow 3 -->
  <line x1="386" y1="1020" x2="356" y2="1020" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="342,1020 356,1012 356,1028" fill="#c0392b"/>

  <!-- Stage 4: three stored cards, middle one matched -->
  <rect x="134" y="922" width="170" height="60" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="134" y="996" width="170" height="60" rx="10" fill="#22303f" opacity=".18"/>
  <rect x="134" y="1070" width="170" height="60" rx="10" fill="#22303f" opacity=".18"/>

  <rect x="130" y="916" width="170" height="60" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="162" cy="940" r="9" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>
  <path d="M148 964 Q162 948 176 964 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <rect x="190" y="936" width="80" height="7" rx="3" fill="#2f7fb5"/>
  <rect x="190" y="952" width="56" height="7" rx="3" fill="#8fc9f2"/>

  <rect x="130" y="990" width="170" height="60" rx="10" fill="#a9dcbe" stroke="#2e7d32" stroke-width="2.5"/>
  <circle cx="162" cy="1014" r="9" fill="#ffffff" stroke="#22303f" stroke-width="2"/>
  <path d="M148 1038 Q162 1022 176 1038 Z" fill="#ffffff" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <rect x="190" y="1010" width="72" height="7" rx="3" fill="#2e7d32"/>
  <rect x="190" y="1026" width="50" height="7" rx="3" fill="#ffffff"/>
  <circle cx="300" cy="1020" r="16" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M292 1020 L298 1026 L309 1013" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="130" y="1064" width="170" height="60" rx="10" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="162" cy="1088" r="9" fill="#8fc9f2" stroke="#22303f" stroke-width="2"/>
  <path d="M148 1112 Q162 1096 176 1112 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2" stroke-linejoin="round"/>
  <rect x="190" y="1084" width="80" height="7" rx="3" fill="#2f7fb5"/>
  <rect x="190" y="1100" width="56" height="7" rx="3" fill="#8fc9f2"/>
</g>

<!-- Check badge icon in the success card corner -->
<g transform="translate(127 134)">
  <circle cx="28" cy="28" r="26" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
  <path d="M16 29 L25 38 L41 20" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Smile face in the success card -->
<g transform="translate(890 280)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Face scan icon beside the header -->
<g transform="translate(900 418)">
  <g fill="none" stroke="#2f7fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12 V2 H12"/>
    <path d="M32 2 H42 V12"/>
    <path d="M2 32 V42 H12"/>
    <path d="M42 32 V42 H32"/>
  </g>
