  <ellipse cx="660" cy="1020" rx="58" ry="74" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <g fill="none" stroke="#2f7fb5" stroke-width="1.4" stroke-linejoin="round">
