    <line x1="72" y1="400" x2="1008" y2="400"/>
    <line x1="72" y1="434" x2="1008" y2="434"/>
    <line x1="72" y1="468" x2="1008" y2="468"/>
    <line x1="72" y1="502" x2="1008" y2="502"/>
    <line x1="72" y1="536" x2="1008" y2="536"/>
    <line x1="72" y1="570" x2="1008" y2="570"/>
    <line x1="72" y1="604" x2="1008" y2="604"/>
    <line x1="72" y1="638" x2="1008" y2="638"/>
    <line x1="72" y1="672" x2="1008" y2="672"/>
    <line x1="72" y1="706" x2="1008" y2="706"/>
    <line x1="72" y1="740" x2="1008" y2="740"/>
    <line x1="72" y1="774" x2="1008" y2="774"/>
    <line x1="72" y1="808" x2="1008" y2="808"/>
    <line x1="72" y1="842" x2="1008" y2="842"/>
    <line x1="72" y1="876" x2="1008" y2="876"/>
    <line x1="72" y1="910" x2="1008" y2="910"/>
    <line x1="72" y1="944" x2="1008" y2="944"/>
    <line x1="72" y1="978" x2="1008" y2="978"/>
    <line x1="72" y1="1012" x2="1008" y2="1012"/>
    <line x1="72" y1="1046" x2="1008" y2="1046"/>
    <line x1="72" y1="1080" x2="1008" y2="1080"/>
    <line x1="72" y1="1114" x2="1008" y2="1114"/>
    <line x1="72" y1="1148" x2="1008" y2="1148"/>
    <line x1="72" y1="1182" x2="1008" y2="1182"/>
    <line x1="72" y1="1216" x2="1008" y2="1216"/>
    <line x1="72" y1="1250" x2="1008" y2="1250"/>
    <line x1="72" y1="1284" x2="1008" y2="1284"/>
  </g>

  <rect x="67" y="66" width="946" height="1248" rx="4" fill="none" stroke="#c0392b" stroke-width="3"/>

  <line x1="320" y1="158" x2="760" y2="158" stroke="#8fb3d9" stroke-width="2"/>

  <rect x="105" y="166" width="870" height="142" rx="10" fill="#fdf6d9" fill-opacity="0.92" stroke="#ddc987" stroke-width="1.6"/>

  <rect x="896" y="320" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="896" y="418" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="896" y="545" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
  <rect x="896" y="643" width="54" height="54" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>

  <line x1="150" y1="786" x2="930" y2="786" stroke="#8fb3d9" stroke-width="2"/>

  <text x="540" y="106" direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="36" font-weight="bold" fill="#14477f">مراجعة مبادئ أخلاقيات الذكاء الاصطناعي</text>

  <text x="540" y="142" direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="24" fill="#1f5f9e">Review the Principles of AI Ethics</text>

  <text x="950" y="204" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#1c5a96">أ. العدالة Fairness</text>
  <text x="470" y="204" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#1c5a96">ب. الشفافية Transparency</text>
  <text x="950" y="237" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#1c5a96">ج. حماية الخصوصية Privacy Protection</text>
  <text x="470" y="237" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="24" fill="#1c5a96">د. المساءلة Accountability</text>

  <text x="125" y="270" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="20" fill="#16324f">A. Fairness</text>
  <text x="470" y="270" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="20" fill="#16324f">B. Transparency</text>
  <text x="125" y="295" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="20" fill="#16324f">C. Privacy Protection</text>
  <text x="470" y="295" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="20" fill="#16324f">D. Accountability</text>

  <text x="876" y="356" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="23" fill="#1c5a96">1. ضمان تقييم نظام التوظيف للمتقدمين بعدالة بغض النظر عن الجنس.</text>
  <text x="125" y="386" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">1. Ensuring that a hiring AI evaluates applicants</tspan>
    <tspan x="152" dy="24">fairly regardless of gender.</tspan>
  </text>

  <text x="876" y="454" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="23" fill="#1c5a96">
    <tspan x="876" dy="0">2. توضيح عملية اتخاذ القرار في نظام الذكاء الاصطناعي</tspan>
    <tspan x="876" dy="29">للمستخدمين بطريقة سهلة الفهم.</tspan>
  </text>
  <text x="125" y="513" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">2. Explaining the AI system’s decision-making process</tspan>
    <tspan x="152" dy="24">to users in an easy-to-understand way.</tspan>
  </text>

  <text x="876" y="581" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="23" fill="#1c5a96">3. عدم استخدام البيانات الشخصية المجمعة لأغراض غير الغرض الأصلي منها.</text>
  <text x="125" y="611" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">3. Not using collected personal data for purposes</tspan>
    <tspan x="152" dy="24">other than those originally intended.</tspan>
  </text>

  <text x="876" y="679" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="23" fill="#1c5a96">
    <tspan x="876" dy="0">4. تحديد من يتحمل المسؤولية عندما تكون نتيجة</tspan>
    <tspan x="876" dy="29">تشخيص نظام الذكاء الاصطناعي خاطئة.</tspan>
  </text>
  <text x="125" y="738" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">4. Being answerable when an AI system’s diagnostic</tspan>
    <tspan x="152" dy="24">result is wrong.</tspan>
  </text>

  <text x="950" y="816" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="23" font-weight="bold" fill="#14477f">
    <tspan x="950" dy="0">أي العبارات الآتية تصف القضايا الأخلاقية المرتبطة</tspan>
    <tspan x="950" dy="30">بالذكاء الاصطناعي وصفًا أدق؟</tspan>
  </text>
  <text x="125" y="876" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">Which statement most accurately describes</tspan>
    <tspan x="125" dy="24">ethical issues associated with AI?</tspan>
  </text>

  <text x="950" y="934" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="21" fill="#1c5a96">
    <tspan x="950" dy="0">أ. لا توجد قضايا أخلاقية مرتبطة بالذكاء الاصطناعي.</tspan>
    <tspan x="950" dy="28">ب. يحدث التحيز الخوارزمي بسبب سرعة معالجة الذكاء الاصطناعي.</tspan>
    <tspan x="950" dy="28">ج. قد يؤدي التحيز في بيانات التدريب إلى تحيز تمييزي في أحكام نظام الذكاء الاصطناعي.</tspan>
    <tspan x="950" dy="28">د. لا توجد مشكلة عندما تكون عملية اتخاذ القرار غامضة.</tspan>
  </text>

  <text x="125" y="1052" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="19" fill="#16324f">
    <tspan x="125" dy="0">A. There are no ethical issues associated with AI.</tspan>
    <tspan x="125" dy="24">B. Algorithmic bias is caused by the AI system’s processing speed.</tspan>
    <tspan x="125" dy="24">C. Bias in training data can cause discriminatory</tspan>
    <tspan x="152" dy="24">bias in an AI system’s judgments.</tspan>
    <tspan x="125" dy="24">D. There is no problem when the decision-making process is opaque.</tspan>
  </text>

</svg>
