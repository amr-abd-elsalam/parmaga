  <circle cx="26" cy="20" r="2" fill="#22303f"/>
  <path d="M17 26 Q22 30 27 26" fill="none" stroke="#22303f" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Open book icon in the info card corner -->
<g transform="translate(127 494)">
  <path d="M28 8 Q16 2 2 6 L2 42 Q16 38 28 44 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M28 8 Q40 2 54 6 L54 42 Q40 38 28 44 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="8" y1="16" x2="22" y2="18" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="8" y1="26" x2="22" y2="28" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="18" x2="48" y2="16" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="28" x2="48" y2="26" stroke="#2f7fb5" stroke-width="2" stroke-linecap="round"/>
</g>

<!-- Lock icon in the info card -->
<g transform="translate(880 680)">
  <path d="M12 24 V16 Q12 4 24 4 Q36 4 36 16 V24" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="4" y="22" width="40" height="30" rx="6" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="24" cy="35" r="4" fill="#22303f"/>
  <rect x="22" y="36" width="4" height="8" rx="2" fill="#22303f"/>
</g>

<!-- Text layer -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">لذلك <tspan font-weight="bold" fill="#17457f">لا يكفي</tspan> حذف السمة المحمية؛</tspan>
  <tspan x="935" dy="40">يجب أن نختبر نتائج النظام على <tspan font-weight="bold" fill="#2e7d32">كل فئة.</tspan></tspan>
</text>
<text x="140" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">So removing the protected attribute</tspan>
  <tspan x="140" dy="40">is <tspan font-weight="bold" fill="#17457f">not enough;</tspan> we must test the</tspan>
  <tspan x="140" dy="40">system's results for <tspan font-weight="bold" fill="#2e7d32">every group.</tspan></tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">8. التعرف على الوجه Face Recognition</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">8. Face Recognition</tspan>
</text>

<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعريف الدقيق:</tspan> تقنية تحلل ملامح الوجه</tspan>
  <tspan x="935" dy="40">في صورة أو فيديو، وتحولها إلى</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">بصمة رقمية،</tspan> ثم تقارنها ببصمات مخزنة.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Definition:</tspan> a technology that</tspan>
  <tspan x="140" dy="40">analyzes facial features in an image</tspan>
  <tspan x="140" dy="40">or video, turns them into a</tspan>
  <tspan x="140" dy="40"><tspan font-weight="bold" fill="#17457f">digital faceprint,</tspan> and compares it</tspan>
  <tspan x="140" dy="40">with stored ones.</tspan>
</text>
</svg>
