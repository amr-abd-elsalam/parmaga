<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ac7442"/>
      <stop offset="0.5" stop-color="#8f5a2f"/>
      <stop offset="1" stop-color="#77471f"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fbf6e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0,210 C280,170 720,300 1080,235" fill="none" stroke="#5d3617" stroke-width="30" opacity="0.10"/>
  <path d="M0,1090 C320,1150 760,1020 1080,1095" fill="none" stroke="#5d3617" stroke-width="24" opacity="0.09"/>

  <rect x="44" y="42" width="1012" height="1290" rx="6" fill="#3a2210" opacity="0.18"/>
  <rect x="34" y="30" width="1012" height="1290" rx="5" fill="url(#paperGrad)"/>

  <g stroke="#d9e7f5" stroke-width="1.6">
    <line x1="72" y1="196" x2="1008" y2="196"/>
    <line x1="72" y1="230" x2="1008" y2="230"/>
