<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">من الواقع</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Real Cases</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">1. أداة التوظيف التي تعلّمت الظلم</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">1. The Hiring Tool That</tspan>
  <tspan x="120" dy="40">Learned Unfairness</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">في <tspan fill="#c96a1b">2018،</tspan> نشرت وكالة رويترز أن أمازون أوقفت</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">أداة تجريبية</tspan> لفرز السير الذاتية.</tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">In <tspan fill="#c96a1b">2018,</tspan> Reuters reported that</tspan>
  <tspan x="120" dy="40">Amazon had stopped an <tspan font-weight="bold" fill="#17457f">experimental tool</tspan></tspan>
  <tspan x="120" dy="40">for sorting CVs.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تعلّمت الأداة من سير ذاتية <tspan fill="#c96a1b">لعشر سنوات،</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">أغلب أصحابها رجال،</tspan> فصارت تخفض تقييم السير</tspan>
  <tspan x="950" dy="40">التي تحتوي كلمة <tspan font-weight="bold" fill="#c0392b">«women's».</tspan></tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The tool learned from <tspan fill="#c96a1b">ten years</tspan> of CVs,</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">mostly from men,</tspan> so it lowered the rating</tspan>
  <tspan x="120" dy="40">of CVs containing the word <tspan font-weight="bold" fill="#c0392b">"women's".</tspan></tspan>
</text>
</svg>
