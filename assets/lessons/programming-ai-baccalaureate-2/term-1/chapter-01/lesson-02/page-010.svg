  <text x="161" y="282" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="32" fill="#152b42">— A:</text>
  <text x="253" y="284" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe UI Symbol, DejaVu Sans, Arial, sans-serif" font-size="34" fill="#1d7a34">✓</text>

  <text x="368" y="282" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
