<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البيانات</tspan> <tspan font-weight="bold" fill="#c0392b">Data</tspan> — الأمثلة التي يتعلم منها</tspan>
  <tspan x="935" dy="40">النموذج: <tspan fill="#c96a1b">صور ونصوص وأرقام.</tspan></tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Data</tspan> — the examples a model learns</tspan>
  <tspan x="140" dy="40">from: <tspan fill="#c96a1b">images, text, and numbers.</tspan></tspan>
</text>

<text x="935" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">بيانات التدريب</tspan> <tspan font-weight="bold" fill="#c0392b">Training Data</tspan> — الجزء</tspan>
  <tspan x="935" dy="40">من البيانات الذي <tspan font-weight="bold" fill="#17457f">نعلّم</tspan> به النموذج.</tspan>
</text>
<text x="140" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Training data</tspan> — the part of the data</tspan>
  <tspan x="140" dy="40">we use to <tspan font-weight="bold" fill="#17457f">teach</tspan> the model.</tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">القاعدة الذهبية:</tspan>
  <tspan x="935" dy="40">جودة النموذج من جودة بياناته.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Golden rule:</tspan>
  <tspan x="140" dy="40">a model is only as good as its data.</tspan>
</text>
</svg>
