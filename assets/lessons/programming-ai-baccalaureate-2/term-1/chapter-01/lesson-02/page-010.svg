  <text x="384" y="282" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="32" fill="#152b42">— B:</text>
  <text x="476" y="284" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe UI Symbol, DejaVu Sans, Arial, sans-serif" font-size="34" fill="#c0392b">✗</text>

  <text x="591" y="282" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" fill="#1d5c9a">ج</text>
  <text x="607" y="282" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="32" fill="#152b42">— C:</text>
  <text x="699" y="284" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe UI Symbol, DejaVu Sans, Arial, sans-serif" font-size="34" fill="#1d7a34">✓</text>

  <text x="814" y="282" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" fill="#1d5c9a">د</text>
  <text x="830" y="282" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="32" fill="#152b42">— D:</text>
  <text x="922" y="284" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe UI Symbol, DejaVu Sans, Arial, sans-serif" font-size="34" fill="#c0392b">✗</text>

  <rect x="105" y="336" width="870" height="200" rx="14" fill="#e8f6ea" stroke="#86c194" stroke-width="2"/>

  <text x="945" y="378"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="945" dy="0">التعلم العميق نوع متقدم من التعلم الآلي،</tspan>
    <tspan x="945" dy="40">وليس تقنية منفصلة عنه تمامًا.</tspan>
  </text>

  <text x="130" y="464"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="130" dy="0">Deep learning is an advanced type of machine</tspan>
    <tspan x="130" dy="36">learning, not a completely separate technology.</tspan>
  </text>

  <rect x="105" y="566" width="870" height="234" rx="14" fill="#e8f6ea" stroke="#86c194" stroke-width="2"/>

  <text x="945" y="604"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="945" dy="0">الذكاء الاصطناعي مجال واسع، والتعلم الآلي إحدى</tspan>
    <tspan x="945" dy="40">التقنيات التي تقع داخله؛ لذلك لا يحملان المعنى نفسه.</tspan>
  </text>

  <text x="130" y="688"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="130" dy="0">AI is a broad field, and machine learning is one</tspan>
    <tspan x="130" dy="36">of the technologies within it; therefore, they do</tspan>
    <tspan x="130" dy="36">not have the same meaning.</tspan>
  </text>

  <text x="141" y="866" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#1d5c9a">أ</text>
  <text x="157" y="866" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="30" fill="#1d7a34">— a:</text>
  <text x="590" y="866" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="29" fill="#225f9c">التعلم الآلي</text>
  <text x="610" y="866" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Machine Learning — A</text>

  <text x="141" y="926" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#1d5c9a">ب</text>
  <text x="157" y="926" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="30" fill="#1d7a34">— b:</text>
  <text x="590" y="926" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="29" fill="#225f9c">التعلم العميق</text>
  <text x="610" y="926" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Deep Learning — B</text>

  <text x="141" y="986" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#1d5c9a">ج</text>
  <text x="157" y="986" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="30" fill="#1d7a34">— c:</text>
  <text x="590" y="986" direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="29" fill="#225f9c">الذكاء الاصطناعي التوليدي</text>
  <text x="610" y="986" direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Generative AI — C</text>

</svg>
