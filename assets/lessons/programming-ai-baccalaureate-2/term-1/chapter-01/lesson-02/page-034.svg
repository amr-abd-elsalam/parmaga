<!-- Text: paragraph 1 -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">نظام التوصية</tspan> Recommender System:</tspan>
  <tspan x="950" dy="40">يقترح منتجات أو فيديوهات بناءً على سلوكك</tspan>
  <tspan x="950" dy="40">السابق وسلوك من يشبهونك.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Recommender system:</tspan> suggests products</tspan>
  <tspan x="120" dy="40">or videos based on your past behavior</tspan>
  <tspan x="120" dy="40">and that of people like you.</tspan>
</text>

<!-- Text: paragraph 2 -->
<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">القيادة الذاتية</tspan> Autonomous Driving:</tspan>
  <tspan x="950" dy="40">سيارات تحلّل بالتعلم العميق صور الكاميرات</tspan>
  <tspan x="950" dy="40">والحساسات، فتتعرف على الطريق والمشاة</tspan>
  <tspan x="950" dy="40">وتتخذ قرارات القيادة.</tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0"><tspan font-weight="bold" fill="#c0392b">Autonomous driving:</tspan> cars that use deep</tspan>
  <tspan x="120" dy="40">learning to analyze camera and sensor</tspan>
  <tspan x="120" dy="40">images, recognize the road and</tspan>
  <tspan x="120" dy="40">pedestrians, and make driving decisions.</tspan>
</text>
</svg>
