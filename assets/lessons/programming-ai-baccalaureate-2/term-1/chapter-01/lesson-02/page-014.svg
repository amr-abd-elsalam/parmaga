<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 2: الشبكة العصبية…</tspan>
  <tspan x="540" dy="48">تاخد رأي مين؟</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">Stop 2: The Neural Network…</tspan>
  <tspan x="540" dy="36">Whose Opinion Counts?</tspan>
</text>

<!-- Paragraph -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أنت محتار: هل تذهب إلى السينما؟</tspan>
  <tspan x="950" dy="40">تسأل <tspan font-weight="bold" fill="#17457f">ثلاثة أصحاب:</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Cinema today or not?</tspan>
  <tspan x="120" dy="40">You ask <tspan font-weight="bold" fill="#17457f">three friends:</tspan></tspan>
</text>

<!-- Bullet 1 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صاحبك الجاد ذوقه مضبوط،</tspan>
  <tspan x="950" dy="40">فرأيه يفرق معك <tspan font-weight="bold" fill="#17457f">جدًا.</tspan></tspan>
</text>
<text x="132" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Your serious friend has great taste,</tspan>
  <tspan x="132" dy="40">so his opinion matters <tspan font-weight="bold" fill="#17457f">a lot.</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صاحبك المرِح رأيه يفرق <tspan font-weight="bold" fill="#17457f">قليلًا.</tspan></tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Your funny friend's opinion</tspan>
  <tspan x="132" dy="40">matters <tspan font-weight="bold" fill="#17457f">a little.</tspan></tspan>
</text>

<!-- Bullet 3 -->
<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">صاحبك الذي يقول «لا» دائمًا،</tspan>
  <tspan x="950" dy="40">رأيه <tspan font-weight="bold" fill="#17457f">لا يكاد يفرق.</tspan></tspan>
</text>
<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Your friend who always says "no"</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#17457f">hardly matters.</tspan></tspan>
</text>
</svg>
