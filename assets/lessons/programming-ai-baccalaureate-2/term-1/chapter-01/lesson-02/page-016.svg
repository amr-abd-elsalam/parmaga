  <rect x="330" y="1105" width="300" height="12" rx="6" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="630" cy="1111" r="14" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

