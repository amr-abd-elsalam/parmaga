<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M 250 1160 A 40 40 0 1 1 210 1120" fill="none" stroke="#2f7fb5" stroke-width="2.5"/>
  <polygon points="210,1110 226,1120 210,1130" fill="#2f7fb5"/>
  <circle cx="210" cy="1160" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>

