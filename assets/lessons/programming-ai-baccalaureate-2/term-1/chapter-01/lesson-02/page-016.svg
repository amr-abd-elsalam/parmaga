  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3"/>
</g>

<!-- Icon: star -->
<g transform="translate(140 166)" stroke-linejoin="round">
  <polygon points="22,2 27.3,14.7 41,15.8 30.6,24.8 33.8,38.2 22,31 10.2,38.2 13.4,24.8 3,15.8 16.7,14.7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: light bulb in strip -->
<g transform="translate(870 522)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="22" cy="16" r="13" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="16" y="28" width="12" height="9" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <line x1="2" y1="16" x2="5" y2="16" stroke="#22303f" stroke-width="2.5"/>
  <line x1="39" y1="16" x2="42" y2="16" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Paragraph -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ذهبت بناءً على رأي صاحبك المرِح،</tspan>
  <tspan x="950" dy="40">وكان الفيلم مملًا؟</tspan>
  <tspan x="950" dy="40">في المرة القادمة <tspan font-weight="bold" fill="#17457f">ستقلل أهمية رأيه.</tspan></tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">You went because of your funny friend,</tspan>
  <tspan x="120" dy="40">and the movie was boring?</tspan>
  <tspan x="120" dy="40">Next time, you will give</tspan>
  <tspan x="120" dy="40">his opinion <tspan font-weight="bold" fill="#17457f">less weight.</tspan></tspan>
</text>

<!-- Key sentence strip text -->
<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">هذا هو التدريب: تعديل الأوزان بعد كل خطأ.</tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">This is training: adjusting</tspan>
  <tspan x="140" dy="40">the weights after every mistake.</tspan>
</text>
</svg>
