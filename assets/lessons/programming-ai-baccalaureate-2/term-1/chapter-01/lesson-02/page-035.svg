</g>

<!-- Gear (outer box) -->
<g transform="translate(540 756)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(0)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(45)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(90)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(135)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(180)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(225)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(270)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <g transform="rotate(315)"><rect x="-5" y="-25" width="10" height="12" rx="2" fill="#2f7fb5"/></g>
  <circle cx="0" cy="0" r="17" fill="#2f7fb5"/>
  <circle cx="0" cy="0" r="6" fill="#ffffff"/>
</g>

<!-- Open book (second box) -->
<g transform="translate(540 844)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M -36 -14 L -36 22 C -24 18 -10 18 0 24 C 10 18 24 18 36 22 L 36 -14 Z" fill="#4fc3e8"/>
  <path d="M 0 -16 C -10 -22 -24 -22 -32 -18 L -32 18 C -24 14 -10 14 0 20 Z" fill="#ffffff"/>
  <path d="M 0 -16 C 10 -22 24 -22 32 -18 L 32 18 C 24 14 10 14 0 20 Z" fill="#ffffff"/>
  <line x1="-26" y1="-10" x2="-8" y2="-9" stroke="#7f95ab" fill="none"/>
  <line x1="-26" y1="0" x2="-8" y2="1" stroke="#7f95ab" fill="none"/>
  <line x1="8" y1="-9" x2="26" y2="-10" stroke="#7f95ab" fill="none"/>
  <line x1="8" y1="1" x2="26" y2="0" stroke="#7f95ab" fill="none"/>
</g>

<!-- Stack of layered sheets (third box) -->
<g transform="translate(540 932)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="-26,8 34,8 26,20 -34,20" fill="#17457f"/>
  <polygon points="-26,-4 34,-4 26,8 -34,8" fill="#2f7fb5"/>
  <polygon points="-26,-16 34,-16 26,-4 -34,-4" fill="#8fc9f2"/>
</g>

<!-- Glowing pen (innermost box) -->
<g transform="translate(540 1028)">
  <circle cx="0" cy="0" r="30" fill="#ffd24a" opacity=".6"/>
  <g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="-40" y1="-14" x2="-34" y2="-12" fill="none"/>
    <line x1="40" y1="-14" x2="34" y2="-12" fill="none"/>
    <line x1="0" y1="-38" x2="0" y2="-33" fill="none"/>
    <g transform="rotate(-40)">
      <rect x="-6" y="-26" width="12" height="36" rx="3" fill="#c96a1b"/>
      <polygon points="-6,10 6,10 0,24" fill="#ffffff"/>
      <circle cx="0" cy="19" r="2" fill="#22303f"/>
    </g>
  </g>
</g>

<!-- Bottom icon row: chip, star, check badge -->
<g transform="translate(392 1177)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="20" y1="4" x2="20" y2="12" fill="none"/>
  <line x1="28" y1="4" x2="28" y2="12" fill="none"/>
  <line x1="36" y1="4" x2="36" y2="12" fill="none"/>
  <line x1="20" y1="44" x2="20" y2="52" fill="none"/>
  <line x1="28" y1="44" x2="28" y2="52" fill="none"/>
  <line x1="36" y1="44" x2="36" y2="52" fill="none"/>
  <line x1="4" y1="20" x2="12" y2="20" fill="none"/>
  <line x1="4" y1="28" x2="12" y2="28" fill="none"/>
  <line x1="4" y1="36" x2="12" y2="36" fill="none"/>
  <line x1="44" y1="20" x2="52" y2="20" fill="none"/>
  <line x1="44" y1="28" x2="52" y2="28" fill="none"/>
  <line x1="44" y1="36" x2="52" y2="36" fill="none"/>
  <rect x="12" y="12" width="32" height="32" rx="4" fill="#17457f"/>
