        y="904"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="555" dy="0">DL</tspan>
  </text>

  <text x="744"
