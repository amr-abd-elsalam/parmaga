  <line x1="140" y1="810" x2="140" y2="1050" stroke="#c0392b" stroke-width="2"/>
  <polygon points="132,1050 148,1050 140,1068" fill="#c0392b"/>

  <!-- 7. النصوص التعليمية -->

  <!-- العنوان العربي أعلى اليمين -->
  <text x="965"
        y="160"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="36"
        font-weight="bold"
        fill="#1f5fa8">
    <tspan x="965" dy="0">العلاقة بين تقنيات الذكاء الاصطناعي</tspan>
  </text>

  <!-- العنوان الإنجليزي أعلى اليسار -->
  <text x="115"
        y="200"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="28"
        fill="#152b42">
    <tspan x="115" dy="0">The Relationship Between AI Technologies</tspan>
  </text>

  <!-- الشرح العربي داخل البطاقة اليمنى -->
  <text x="956"
        y="266"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="956" dy="0">ليست كل أمثلة الذكاء الاصطناعي</tspan>
    <tspan x="956" dy="34">من النوع نفسه. في النموذج</tspan>
    <tspan x="956" dy="34">التعليمي المبسط، الذكاء</tspan>
    <tspan x="956" dy="34">الاصطناعي هو المجال الأوسع،</tspan>
    <tspan x="956" dy="34">ويقع داخله التعلم الآلي، ثم</tspan>
    <tspan x="956" dy="34">التعلم العميق داخل التعلم</tspan>
    <tspan x="956" dy="34">الآلي. وتعتمد غالبية أنظمة</tspan>
    <tspan x="956" dy="34">الذكاء الاصطناعي التوليدي</tspan>
    <tspan x="956" dy="34">الحالية على التعلم العميق.</tspan>
    <tspan x="956" dy="34">تمثل هذه العلاقة مستويات</tspan>
    <tspan x="956" dy="34">متزايدة من التخصص، وليست</tspan>
    <tspan x="956" dy="34">احتواءً صارمًا في كل حالة.</tspan>
  </text>

  <!-- الشرح الإنجليزي داخل البطاقة اليسرى -->
  <text x="124"
        y="260"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="23"
        fill="#152b42">
    <tspan x="124" dy="0">Not all examples of AI are</tspan>
    <tspan x="124" dy="32">the same type. In this</tspan>
    <tspan x="124" dy="32">simplified educational model,</tspan>
    <tspan x="124" dy="32">AI is the broadest field.</tspan>
    <tspan x="124" dy="32">Machine learning sits within</tspan>
    <tspan x="124" dy="32">AI, and deep learning sits</tspan>
    <tspan x="124" dy="32">within machine learning. Most</tspan>
    <tspan x="124" dy="32">current generative AI systems</tspan>
    <tspan x="124" dy="32">are built on deep learning.</tspan>
    <tspan x="124" dy="32">This relationship shows</tspan>
    <tspan x="124" dy="32">increasing specialization</tspan>
    <tspan x="124" dy="32">rather than strict containment</tspan>
    <tspan x="124" dy="32">in every case.</tspan>
  </text>

  <!-- البطاقة الصفراء -->
  <text x="752"
        y="716"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#8a5a12">
    <tspan x="752" dy="0">نموذج تعليمي مبسط</tspan>
  </text>
  <text x="328"
        y="746"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="21"
        fill="#7a4f0d">
    <tspan x="328" dy="0">Simplified educational model</tspan>
  </text>

  <!-- تسميات المخطط: عربي RTL وإنجليزي LTR في عناصر منفصلة -->
