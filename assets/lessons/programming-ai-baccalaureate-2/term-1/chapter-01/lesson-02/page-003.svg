<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<defs>
  <radialGradient id="ilGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd24a"/>
    <stop offset="1" stop-color="#17457f"/>
  </radialGradient>
</defs>

<!-- Illustration shadow -->
<rect x="209" y="990" width="670" height="262" rx="40" fill="#22303f" opacity=".18"/>

<!-- Illustration: four nested shapes -->
<g stroke-linecap="round" stroke-linejoin="round">
  <rect x="205" y="984" width="670" height="262" rx="40" fill="#dff1f7" stroke="#22303f" stroke-width="2.5"/>
  <rect x="285" y="1014" width="510" height="202" rx="34" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <rect x="365" y="1044" width="350" height="142" rx="28" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
  <rect x="445" y="1074" width="190" height="82" rx="22" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="540" cy="1115" r="34" fill="url(#ilGlow)" opacity=".6"/>

  <!-- Dotted line from the inner star outward through all four borders -->
  <circle cx="575" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="605" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="635" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="665" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="695" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="725" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="755" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="785" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="815" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="845" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="875" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="905" cy="1115" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="917,1107 933,1115 917,1123" fill="#22303f" stroke="#22303f" stroke-width="2.5"/>

  <!-- Bright star in the innermost shape -->
  <g transform="translate(540 1115) scale(1.6)">
    <polygon points="0,-14 3.53,-4.85 13.31,-4.33 5.71,1.85 8.23,11.33 0,6 -8.23,11.33 -5.71,1.85 -13.31,-4.33 -3.53,-4.85" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <!-- Small stars only in the outer areas -->
  <g transform="translate(835 1030)">
    <polygon points="0,-14 3.53,-4.85 13.31,-4.33 5.71,1.85 8.23,11.33 0,6 -8.23,11.33 -5.71,1.85 -13.31,-4.33 -3.53,-4.85" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="translate(325 1080)">
    <polygon points="0,-14 3.53,-4.85 13.31,-4.33 5.71,1.85 8.23,11.33 0,6 -8.23,11.33 -5.71,1.85 -13.31,-4.33 -3.53,-4.85" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
  </g>
  <g transform="translate(675 1160)">
    <polygon points="0,-14 3.53,-4.85 13.31,-4.33 5.71,1.85 8.23,11.33 0,6 -8.23,11.33 -5.71,1.85 -13.31,-4.33 -3.53,-4.85" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
  </g>
</g>

<!-- Bullets -->
<circle cx="966" cy="144" r="6" fill="#c0392b"/>
<circle cx="114" cy="184" r="6" fill="#c0392b"/>
<circle cx="966" cy="224" r="6" fill="#c0392b"/>
<circle cx="114" cy="264" r="6" fill="#c0392b"/>
<circle cx="966" cy="344" r="6" fill="#c0392b"/>
<circle cx="114" cy="384" r="6" fill="#c0392b"/>
<circle cx="966" cy="464" r="6" fill="#c0392b"/>
<circle cx="114" cy="544" r="6" fill="#c0392b"/>

<!-- Icons and face -->
<g transform="translate(880 262) scale(0.8)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="10" y="26" width="36" height="26" fill="#dff1f7"/>
  <polygon points="28,6 4,26 52,26" fill="#17457f"/>
  <rect x="23" y="36" width="10" height="16" fill="#c96a1b"/>
</g>
<g transform="translate(760 552)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M28 14 Q 16 6 4 10 L 4 48 Q 16 44 28 52 Z" fill="#dff1f7"/>
  <path d="M28 14 Q 40 6 52 10 L 52 48 Q 40 44 28 52 Z" fill="#8fc9f2"/>
  <line x1="28" y1="14" x2="28" y2="52"/>
</g>
<g transform="translate(870 552)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="20" y1="4" x2="20" y2="12"/>
  <line x1="28" y1="4" x2="28" y2="12"/>
  <line x1="36" y1="4" x2="36" y2="12"/>
  <line x1="20" y1="44" x2="20" y2="52"/>
  <line x1="28" y1="44" x2="28" y2="52"/>
  <line x1="36" y1="44" x2="36" y2="52"/>
  <line x1="4" y1="20" x2="12" y2="20"/>
  <line x1="4" y1="36" x2="12" y2="36"/>
  <line x1="44" y1="20" x2="52" y2="20"/>
  <line x1="44" y1="36" x2="52" y2="36"/>
  <rect x="12" y="12" width="32" height="32" rx="5" fill="#2f7fb5"/>
  <rect x="21" y="21" width="14" height="14" rx="2" fill="#4fc3e8"/>
</g>
<g transform="translate(780 712)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="28" cy="22" r="16" fill="#ffd24a"/>
  <rect x="21" y="36" width="14" height="12" rx="3" fill="#7f95ab"/>
  <line x1="28" y1="0" x2="28" y2="2"/>
  <line x1="6" y1="22" x2="8" y2="22"/>
  <line x1="48" y1="22" x2="50" y2="22"/>
</g>
<g transform="translate(905 740)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="0" cy="10" r="5" fill="#22303f"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">البيت هو <tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي:</tspan> المجال الأوسع.</tspan>
</text>
<text x="132" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">The house is <tspan font-weight="bold" fill="#c0392b">AI:</tspan> the broadest field.</tspan>
</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">داخل البيت أوضة اسمها <tspan font-weight="bold" fill="#c0392b">التعلّم الآلي.</tspan></tspan>
</text>
<text x="132" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Inside the house is a room:</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#c0392b">machine learning.</tspan></tspan>
</text>

<text x="950" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">داخل الأوضة دولاب اسمه <tspan font-weight="bold" fill="#c0392b">التعلم العميق.</tspan></tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Inside the room is a closet:</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#c0392b">deep learning.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">داخل الدولاب درج اسمه</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي التوليدي.</tspan></tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Inside the closet is a drawer:</tspan>
  <tspan x="132" dy="40"><tspan font-weight="bold" fill="#c0392b">generative AI.</tspan></tspan>
</text>

<text x="950" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لو أنت في <tspan font-weight="bold" fill="#17457f">الدرج،</tspan> فأنت في <tspan font-weight="bold" fill="#17457f">البيت</tspan> أكيد.</tspan>
</text>
<text x="120" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">If you are in the <tspan font-weight="bold" fill="#17457f">drawer,</tspan></tspan>
  <tspan x="120" dy="40">you are surely in the <tspan font-weight="bold" fill="#17457f">house.</tspan></tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكن <tspan font-weight="bold" fill="#17457f">ليس كل</tspan> من في البيت في الدرج؛</tspan>
  <tspan x="950" dy="40">فليس كل ذكاء اصطناعي <tspan font-weight="bold" fill="#c0392b">توليديًا.</tspan></tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But <tspan font-weight="bold" fill="#17457f">not everyone</tspan> in the house is</tspan>
  <tspan x="120" dy="40">in the drawer; not all AI is <tspan font-weight="bold" fill="#c0392b">generative.</tspan></tspan>
</text>
</svg>
