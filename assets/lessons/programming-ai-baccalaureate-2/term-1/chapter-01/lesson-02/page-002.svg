  <rect x="67" y="64" width="946" height="1252" rx="6" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <rect x="100" y="602" width="880" height="306" rx="18" fill="#fdf2c9" opacity="0.5" stroke="#e6d190" stroke-width="1.6"/>

  <line x1="580" y1="556" x2="580" y2="590" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round"/>
  <polygon points="572,586 588,586 580,600" fill="#c0392b"/>

  <line x1="120" y1="248" x2="352" y2="248" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <line x1="756" y1="188" x2="960" y2="188" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

  <g fill="#fff8ec" stroke="#d97b2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="145" y="965" width="130" height="88" rx="8"/>
    <path d="M145 973 L210 1019 L275 973" fill="none"/>

    <path d="M395 985 a25 25 0 0 1 50 0" fill="none"/>
    <rect x="370" y="985" width="100" height="80" rx="8"/>

    <rect x="565" y="945" width="100" height="56" rx="16"/>
    <path d="M585 1001 L580 1019 L603 1001" fill="none"/>
    <rect x="605" y="1005" width="100" height="56" rx="16"/>
    <path d="M685 1061 L690 1079 L667 1061" fill="none"/>

    <rect x="800" y="965" width="130" height="90" rx="8"/>
    <path d="M818 996 L838 1010 L818 1024" fill="none"/>
    <line x1="852" y1="1012" x2="898" y2="1012"/>
    <line x1="910" y1="994" x2="910" y2="1028"/>
  </g>

  <text x="960"
        y="168"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="42"
        font-weight="bold"
        fill="#1f5f9e">كيف يعمل الذكاء الاصطناعي؟</text>

  <text x="120"
        y="232"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#152b42">How AI Works</text>

  <text x="120"
        y="300"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="120" dy="0">When you use your phone, AI</tspan>
    <tspan x="120" dy="40">often works in the background:</tspan>
    <tspan x="120" dy="40">a spam filter sorts unwanted</tspan>
    <tspan x="120" dy="40">email, a store recommends</tspan>
    <tspan x="120" dy="40">products, a translation app</tspan>
    <tspan x="120" dy="40">changes one language into</tspan>
    <tspan x="120" dy="40">another, and ChatGPT generates</tspan>
    <tspan x="120" dy="40">text from a prompt.</tspan>
  </text>

  <text x="120"
        y="640"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="120" dy="0">Artificial Intelligence (AI)</tspan>
    <tspan x="120" dy="40">is a general term for</tspan>
    <tspan x="120" dy="40">technologies that perform</tspan>
    <tspan x="120" dy="40">behaviors associated with</tspan>
    <tspan x="120" dy="40">human intelligence, such as</tspan>
    <tspan x="120" dy="40">learning, reasoning, and</tspan>
    <tspan x="120" dy="40">judgment.</tspan>
  </text>

  <text x="960"
        y="300"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="960" dy="0">عندما تستخدم هاتفك، يعمل</tspan>
    <tspan x="960" dy="40">الذكاء الاصطناعي غالبًا في</tspan>
    <tspan x="960" dy="40">الخلفية: يفرز مرشح البريد</tspan>
    <tspan x="960" dy="40">الرسائل المزعجة، ويوصي</tspan>
    <tspan x="960" dy="40">متجر بمنتجات، ويترجم تطبيق</tspan>
    <tspan x="960" dy="40">بين اللغات، ويولّد ChatGPT</tspan>
    <tspan x="960" dy="40">نصًا من طلب.</tspan>
  </text>

  <text x="960"
        y="640"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="960" dy="0">الذكاء الاصطناعي</tspan>
  </text>

  <text x="650"
        y="680"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#152b42">Artificial Intelligence (AI)</text>

  <text x="960"
        y="720"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27"
        fill="#225f9c">
    <tspan x="960" dy="0">مصطلح عام لتقنيات تنفذ على</tspan>
    <tspan x="960" dy="40">الحاسوب سلوكيات مرتبطة</tspan>
    <tspan x="960" dy="40">بالذكاء البشري، مثل التعلم</tspan>
    <tspan x="960" dy="40">والاستدلال والحكم.</tspan>
  </text>

</svg>
