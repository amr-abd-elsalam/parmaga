    <line x1="92" y1="540" x2="988" y2="540"/>
    <line x1="92" y1="580" x2="988" y2="580"/>
    <line x1="92" y1="620" x2="988" y2="620"/>
    <line x1="92" y1="660" x2="988" y2="660"/>
    <line x1="92" y1="700" x2="988" y2="700"/>
    <line x1="92" y1="740" x2="988" y2="740"/>
    <line x1="92" y1="780" x2="988" y2="780"/>
    <line x1="92" y1="820" x2="988" y2="820"/>
    <line x1="92" y1="860" x2="988" y2="860"/>
    <line x1="92" y1="900" x2="988" y2="900"/>
    <line x1="92" y1="940" x2="988" y2="940"/>
    <line x1="92" y1="980" x2="988" y2="980"/>
    <line x1="92" y1="1020" x2="988" y2="1020"/>
    <line x1="92" y1="1060" x2="988" y2="1060"/>
    <line x1="92" y1="1100" x2="988" y2="1100"/>
    <line x1="92" y1="1140" x2="988" y2="1140"/>
