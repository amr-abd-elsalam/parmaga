  <text x="960"
        y="132"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="44"
        font-weight="bold"
        fill="#1a4a80">
    <tspan x="960" dy="0">التعلم العميق والشبكات العصبية</tspan>
  </text>

  <text x="118"
        y="204"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="34"
        fill="#14314f">
    <tspan x="118" dy="0">Deep Learning and Neural Networks</tspan>
  </text>

  <text x="960"
        y="276"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1f5f9e">
    <tspan x="960" dy="0">التعلم العميق Deep Learning (DL) تقنية متقدمة</tspan>
    <tspan x="960" dy="36">ضمن التعلم الآلي، تستخدم الشبكات العصبية لتعلم</tspan>
    <tspan x="960" dy="36">أنماط معقدة من بيانات واسعة النطاق. والشبكة</tspan>
    <tspan x="960" dy="36">العصبية الاصطناعية Artificial Neural Network (ANN)</tspan>
    <tspan x="960" dy="36">نموذج حاسوبي مستوحى بصورة مبسطة من ترابط</tspan>
    <tspan x="960" dy="36">الخلايا العصبية، ويتكون من وحدات مترابطة تتعلم</tspan>
    <tspan x="960" dy="36">من البيانات وتدعم إصدار أحكام معقدة.</tspan>
  </text>

  <text x="118"
        y="564"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="29"
        fill="#152b42">
    <tspan x="118" dy="0">Deep Learning (DL) is an advanced technology</tspan>
    <tspan x="118" dy="36">within machine learning that uses neural</tspan>
    <tspan x="118" dy="36">networks to learn complex patterns from</tspan>
    <tspan x="118" dy="36">large-scale data. An Artificial Neural</tspan>
    <tspan x="118" dy="36">Network (ANN) is a computational model</tspan>
    <tspan x="118" dy="36">inspired by a simplified view of connected</tspan>
    <tspan x="118" dy="36">nerve cells. It consists of connected units</tspan>
    <tspan x="118" dy="36">that learn from data and support complex</tspan>
    <tspan x="118" dy="36">judgments.</tspan>
  </text>

  <text x="540"
        y="1116"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a4a80">
    <tspan x="540" dy="0">شبكة عصبية مبسطة</tspan>
  </text>

  <text x="540"
        y="1152"
