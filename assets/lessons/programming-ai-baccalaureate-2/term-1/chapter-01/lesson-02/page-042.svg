<!-- Icon: open book (title left) -->
<g transform="translate(128 92)">
  <path d="M30 8 C 22 2, 10 2, 2 6 L 2 40 C 10 36, 22 36, 30 42 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M30 8 C 38 2, 50 2, 58 6 L 58 40 C 50 36, 38 36, 30 42 Z" fill="#dff1f7" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M9 15 L 24 15 M9 23 L 24 23 M36 15 L 51 15 M36 23 L 51 23" fill="none" stroke="#7f95ab" stroke-width="2" stroke-linecap="round"/>
</g>

