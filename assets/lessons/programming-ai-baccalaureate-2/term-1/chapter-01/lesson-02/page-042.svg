  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: light bulb (inside strip) -->
<g transform="translate(150 694)">
  <path d="M0 14 L-6 11 M44 14 L50 11" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="20" r="16" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <path d="M17 22 L22 27 L27 22" fill="none" stroke="#c96a1b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="34" width="14" height="12" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">فكّر أبعد من الكتاب</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Think Beyond the Book</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الكتاب يضع <tspan font-weight="bold" fill="#c0392b">التوليدي</tspan> داخل <tspan font-weight="bold" fill="#17457f">التعلم العميق،</tspan></tspan>
  <tspan x="950" dy="40">وهذا هو ترتيب الامتحان.</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The book puts <tspan font-weight="bold" fill="#c0392b">generative AI</tspan> inside</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">deep learning;</tspan> that is the exam order.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لكن <tspan font-weight="bold" fill="#17457f">الحقيقة العلمية</tspan> أدق:</tspan>
  <tspan x="950" dy="40">معظم أنظمة التوليد الحديثة مبنية على</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">التعلم العميق،</tspan> وليست كلها.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">But <tspan font-weight="bold" fill="#17457f">science</tspan> is more precise:</tspan>
  <tspan x="120" dy="40">most modern generative systems use</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">deep learning,</tspan> not all.</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">النماذج التعليمية تبسيط مفيد للواقع،</tspan>
  <tspan x="935" dy="40">وليست صورة كاملة له.</tspan>
</text>
<text x="140" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Teaching models are useful</tspan>
  <tspan x="140" dy="40">simplifications of reality,</tspan>
  <tspan x="140" dy="40">not a complete picture of it.</tspan>
</text>
</svg>
