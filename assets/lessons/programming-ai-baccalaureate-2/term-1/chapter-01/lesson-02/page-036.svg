<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">2. أسئلة الحسم في التصنيف</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">2. Deciding questions for classifying</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">اسأل نفسك <tspan font-weight="bold" fill="#17457f">بالترتيب:</tspan></text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">Ask yourself <tspan font-weight="bold" fill="#17457f">in order:</tspan></text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل ينشئ النظام <tspan font-weight="bold" fill="#17457f">شيئًا جديدًا؟</tspan></tspan>
  <tspan x="950" dy="40">إذن هو <tspan font-weight="bold" fill="#c0392b">توليدي.</tspan></tspan>
</text>
<text x="132" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Does the system create <tspan font-weight="bold" fill="#17457f">something new?</tspan></tspan>
  <tspan x="132" dy="40">Then it is <tspan font-weight="bold" fill="#c0392b">generative AI.</tspan></tspan>
</text>

<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل يتعامل مع <tspan font-weight="bold" fill="#17457f">صور</tspan> أو <tspan font-weight="bold" fill="#17457f">صوت</tspan> معقّد؟</tspan>
  <tspan x="950" dy="40">إذن هو <tspan font-weight="bold" fill="#c0392b">تعلّم عميق.</tspan></tspan>
</text>
<text x="132" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Does it handle complex <tspan font-weight="bold" fill="#17457f">images</tspan> or <tspan font-weight="bold" fill="#17457f">sound?</tspan></tspan>
  <tspan x="132" dy="40">Then it is <tspan font-weight="bold" fill="#c0392b">deep learning.</tspan></tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هل <tspan font-weight="bold" fill="#17457f">يصنّف</tspan> أو <tspan font-weight="bold" fill="#17457f">يقترح</tspan> بناءً على بيانات؟</tspan>
  <tspan x="950" dy="40">إذن هو <tspan font-weight="bold" fill="#c0392b">تعلّم آلي.</tspan></tspan>
</text>
<text x="132" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="132" dy="0">Does it <tspan font-weight="bold" fill="#17457f">classify</tspan> or <tspan font-weight="bold" fill="#17457f">suggest</tspan></tspan>
  <tspan x="132" dy="40">based on data?</tspan>
  <tspan x="132" dy="40">Then it is <tspan font-weight="bold" fill="#c0392b">machine learning.</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="900" y="876" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">توليدي</text>
<text x="560" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Generative AI</text>
<text x="900" y="1021" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">تعلّم عميق</text>
<text x="560" y="1059" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Deep learning</text>
<text x="900" y="1166" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">تعلّم آلي</text>
<text x="560" y="1204" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Machine learning</text>
</svg>
