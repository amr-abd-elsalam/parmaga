<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">والآن: كيف <tspan font-weight="bold" fill="#17457f">تعلّمت</tspan> أنت التفريق بينهما</tspan>
  <tspan x="950" dy="40">وأنت صغير؟ هل كتب لك أحد <tspan font-weight="bold" fill="#c0392b">قواعد؟</tspan></tspan>
</text>
<text x="120" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Now: how did you <tspan font-weight="bold" fill="#17457f">learn</tspan> to tell</tspan>
  <tspan x="120" dy="40">them apart as a child?</tspan>
  <tspan x="120" dy="40">Did anyone write <tspan font-weight="bold" fill="#c0392b">rules</tspan> for you?</tspan>
</text>

<text x="950" y="394" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">لا، لقد رأيت قططًا وكلابًا <tspan font-weight="bold" fill="#17457f">كثيرة،</tspan></tspan>
  <tspan x="950" dy="40">فتعلّمت الفرق <tspan font-weight="bold" fill="#2e7d32">بنفسك.</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">No. You saw <tspan font-weight="bold" fill="#17457f">many</tspan> cats and dogs,</tspan>
  <tspan x="120" dy="40">and learned the difference <tspan font-weight="bold" fill="#2e7d32">yourself.</tspan></tspan>
</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">البرمجة التقليدية: نكتب القواعد بأيدينا.</tspan>
  <tspan x="935" dy="40">التعلّم الآلي: نعطي الكمبيوتر أمثلة كثيرة</tspan>
  <tspan x="935" dy="40">فيستخرج الأنماط بنفسه.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">Traditional programming:</tspan>
  <tspan x="140" dy="40">we write the rules by hand.</tspan>
  <tspan x="140" dy="40">Machine learning: we give the computer</tspan>
  <tspan x="140" dy="40">many examples, and it finds</tspan>
  <tspan x="140" dy="40">the patterns itself.</tspan>
</text>
</svg>
