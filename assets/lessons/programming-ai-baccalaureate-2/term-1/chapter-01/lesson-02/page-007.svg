<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8834c"/>
      <stop offset="0.55" stop-color="#a06f3c"/>
      <stop offset="1" stop-color="#8a5c2f"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fbf7ea"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodBg)"/>
  <path d="M0 250 C 300 210, 760 300, 1080 240" fill="none" stroke="#6f4823" stroke-width="16" opacity=".12"/>
  <path d="M0 1080 C 340 1130, 720 1020, 1080 1070" fill="none" stroke="#6f4823" stroke-width="14" opacity=".10"/>

  <rect x="42" y="30" width="1012" height="1300" rx="6" fill="#5c3a1c" opacity=".22"/>
  <rect x="34" y="20" width="1012" height="1300" rx="5" fill="url(#paperFill)"/>

  <g stroke="#cfe0f2" stroke-width="1.6">
    <line x1="80" y1="120" x2="1000" y2="120"/>
    <line x1="80" y1="162" x2="1000" y2="162"/>
    <line x1="80" y1="204" x2="1000" y2="204"/>
    <line x1="80" y1="246" x2="1000" y2="246"/>
    <line x1="80" y1="288" x2="1000" y2="288"/>
    <line x1="80" y1="330" x2="1000" y2="330"/>
    <line x1="80" y1="372" x2="1000" y2="372"/>
    <line x1="80" y1="414" x2="1000" y2="414"/>
    <line x1="80" y1="456" x2="1000" y2="456"/>
    <line x1="80" y1="498" x2="1000" y2="498"/>
    <line x1="80" y1="540" x2="1000" y2="540"/>
    <line x1="80" y1="582" x2="1000" y2="582"/>
    <line x1="80" y1="624" x2="1000" y2="624"/>
    <line x1="80" y1="666" x2="1000" y2="666"/>
    <line x1="80" y1="708" x2="1000" y2="708"/>
    <line x1="80" y1="750" x2="1000" y2="750"/>
    <line x1="80" y1="792" x2="1000" y2="792"/>
    <line x1="80" y1="834" x2="1000" y2="834"/>
    <line x1="80" y1="876" x2="1000" y2="876"/>
    <line x1="80" y1="918" x2="1000" y2="918"/>
    <line x1="80" y1="960" x2="1000" y2="960"/>
    <line x1="80" y1="1002" x2="1000" y2="1002"/>
    <line x1="80" y1="1044" x2="1000" y2="1044"/>
    <line x1="80" y1="1086" x2="1000" y2="1086"/>
    <line x1="80" y1="1128" x2="1000" y2="1128"/>
    <line x1="80" y1="1170" x2="1000" y2="1170"/>
  </g>

  <rect x="67" y="60" width="946" height="1230" fill="none" stroke="#c0392b" stroke-width="3"/>

  <rect x="105" y="222" width="870" height="186" rx="14" fill="#fdf6d6" stroke="#e0c469" stroke-width="2"/>
  <rect x="105" y="436" width="870" height="440" rx="14" fill="#e9f2fc" stroke="#93b9de" stroke-width="2"/>

  <rect x="95" y="906" width="890" height="84" fill="#fdf1ef"/>
  <g stroke="#c0392b" stroke-width="1.8" fill="none">
    <rect x="95" y="906" width="890" height="255"/>
    <line x1="95" y1="990" x2="985" y2="990"/>
    <line x1="95" y1="1047" x2="985" y2="1047"/>
    <line x1="95" y1="1104" x2="985" y2="1104"/>
    <line x1="675" y1="906" x2="675" y2="1161"/>
    <line x1="385" y1="906" x2="385" y2="1161"/>
  </g>

  <text x="540" y="150"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="46" font-weight="bold" fill="#14406f">استكشف مع زميلك</text>

  <text x="540" y="196"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="30" fill="#152b42">Explore — In Pairs</text>

  <text x="948" y="274"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#225f9c">
    <tspan x="948" dy="0">ما الذكاء الاصطناعي؟ وما العلاقة بين التعلم الآلي</tspan>
    <tspan x="948" dy="42">والتعلم العميق والذكاء الاصطناعي التوليدي؟</tspan>
  </text>

  <text x="132" y="358"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26" fill="#152b42">
    <tspan x="132" dy="0">What is AI, and how are machine learning,</tspan>
    <tspan x="132" dy="32">deep learning, and generative AI related?</tspan>
  </text>

  <text x="948" y="488"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="29" fill="#225f9c">
    <tspan x="948" dy="0">بالتعاون مع زميلك، اذكرا ثلاث مهام ينفذها الهاتف</tspan>
    <tspan x="948" dy="42">أو الحاسوب وتبدو كأنها تحتاج إلى «ذكاء»، مثل فرز</tspan>
    <tspan x="948" dy="42">الرسائل المزعجة أو التوصية بمقطع فيديو أو ترجمة نص.</tspan>
    <tspan x="948" dy="42">ثم حددا: هل يتبع الحاسوب قواعد ثابتة، أم يتعلم من</tspan>
    <tspan x="948" dy="42">الأمثلة؟ اذكرا سببًا واحدًا.</tspan>
  </text>

  <text x="132" y="706"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27" fill="#152b42">
    <tspan x="132" dy="0">With a partner, list three tasks a phone or computer</tspan>
    <tspan x="132" dy="35">performs that seem to require “intelligence,” such as</tspan>
    <tspan x="132" dy="35">sorting spam, recommending a video, or translating text.</tspan>
    <tspan x="132" dy="35">Then decide: does the computer follow fixed rules, or</tspan>
    <tspan x="132" dy="35">does it learn from examples? Give one reason.</tspan>
  </text>

  <text x="830" y="944"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" font-weight="bold" fill="#14406f">المهمة</text>
  <text x="830" y="974"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Task</text>

  <text x="530" y="944"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" font-weight="bold" fill="#14406f">قواعد ثابتة</text>
  <text x="530" y="974"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Fixed Rules</text>

  <text x="240" y="944"
        direction="rtl" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" font-weight="bold" fill="#14406f">تعلم من الأمثلة</text>
  <text x="240" y="974"
        direction="ltr" unicode-bidi="plaintext" text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="22" fill="#152b42">Learns from Examples</text>

</svg>
