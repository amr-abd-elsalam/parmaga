<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 4: الذكاء الاصطناعي</tspan>
  <tspan x="540" dy="48">التوليدي… الكيبورد العملاق</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Stop 4: Generative AI… The Giant Keyboard</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">جرّب الآن: اكتب في هاتفك <tspan fill="#c96a1b">«أنا ذاهب إلى»</tspan></tspan>
  <tspan x="950" dy="40">ولاحظ الكلمة التي يقترحها <tspan font-weight="bold" fill="#c0392b">الكيبورد.</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Try it now: type <tspan fill="#c96a1b">"I am going to"</tspan></tspan>
  <tspan x="120" dy="40">on your phone and notice the word</tspan>
  <tspan x="120" dy="40">the <tspan font-weight="bold" fill="#c0392b">keyboard</tspan> suggests.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">نماذج مثل <tspan font-weight="bold" fill="#17457f">ChatGPT</tspan> تفعل الشيء</tspan>
  <tspan x="950" dy="40">نفسه بقدرة أكبر بكثير.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Models like <tspan font-weight="bold" fill="#17457f">ChatGPT</tspan> do the same thing</tspan>
  <tspan x="120" dy="40">with far more power.</tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تعلّمت من كمّ هائل من النصوص</tspan>
  <tspan x="950" dy="40">ما <tspan font-weight="bold" fill="#17457f">الكلمة الأرجح</tspan> بعد الكلمات السابقة،</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">فتولّد نصًا جديدًا</tspan> كلمة بعد كلمة.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">They learned from huge amounts of text</tspan>
  <tspan x="120" dy="40">which word <tspan font-weight="bold" fill="#17457f">most likely</tspan> comes next,</tspan>
  <tspan x="120" dy="40">so they <tspan font-weight="bold" fill="#c0392b">generate new text</tspan> word by word.</tspan>
</text>
</svg>
