<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<!-- Term 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي الضيق</tspan> Narrow AI —</tspan>
  <tspan x="935" dy="40">نظام مصمَّم <tspan font-weight="bold" fill="#17457f">لمهمة محددة</tspan> أو مجموعة محدودة</tspan>
  <tspan x="935" dy="40">من المهام، وهو ما نستخدمه اليوم.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Narrow AI</tspan> — a system designed</tspan>
  <tspan x="140" dy="40">for a <tspan font-weight="bold" fill="#17457f">specific task</tspan> or a limited set</tspan>
  <tspan x="140" dy="40">of tasks; it is what we use today.</tspan>
</text>

<!-- Term 2 -->
<text x="935" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الذكاء الاصطناعي</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">العام</tspan> Artificial General Intelligence (AGI)</tspan>
  <tspan x="935" dy="40">— <tspan font-weight="bold" fill="#17457f">فكرة نظرية</tspan> لنظام يؤدي أي مهمة فكرية</tspan>
  <tspan x="935" dy="40">يؤديها الإنسان، <tspan font-weight="bold" fill="#17457f">ولم يتحقق</tspan> حتى الآن.</tspan>
</text>
<text x="140" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Artificial general intelligence (AGI)</tspan></tspan>
  <tspan x="140" dy="40">— a <tspan font-weight="bold" fill="#17457f">theoretical system</tspan> that could do</tspan>
  <tspan x="140" dy="40">any intellectual task a human can;</tspan>
  <tspan x="140" dy="40">it has <tspan font-weight="bold" fill="#17457f">not been achieved</tspan> yet.</tspan>
</text>
</svg>
