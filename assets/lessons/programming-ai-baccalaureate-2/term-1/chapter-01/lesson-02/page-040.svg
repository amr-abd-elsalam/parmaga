<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>

<!-- Illustration shadow -->
<rect x="129" y="986" width="830" height="266" rx="28" fill="#22303f" opacity=".18"/>

<!-- Side icon 1: AI chip -->
<g transform="translate(895 280)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="20" y1="4" x2="20" y2="12" fill="none"/>
  <line x1="28" y1="4" x2="28" y2="12" fill="none"/>
  <line x1="36" y1="4" x2="36" y2="12" fill="none"/>
  <line x1="20" y1="44" x2="20" y2="52" fill="none"/>
  <line x1="28" y1="44" x2="28" y2="52" fill="none"/>
  <line x1="36" y1="44" x2="36" y2="52" fill="none"/>
  <line x1="4" y1="20" x2="12" y2="20" fill="none"/>
  <line x1="4" y1="28" x2="12" y2="28" fill="none"/>
  <line x1="4" y1="36" x2="12" y2="36" fill="none"/>
  <line x1="44" y1="20" x2="52" y2="20" fill="none"/>
  <line x1="44" y1="28" x2="52" y2="28" fill="none"/>
  <line x1="44" y1="36" x2="52" y2="36" fill="none"/>
  <rect x="12" y="12" width="32" height="32" rx="4" fill="#17457f"/>
  <rect x="21" y="21" width="14" height="14" rx="2" fill="#4fc3e8"/>
</g>

<!-- Side icon 2: document stack (data) -->
<g transform="translate(895 560)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="16" y="2" width="34" height="42" rx="4" fill="#f0c48c"/>
  <rect x="10" y="8" width="34" height="42" rx="4" fill="#8fc9f2"/>
  <rect x="4" y="14" width="34" height="40" rx="4" fill="#ffffff"/>
  <line x1="11" y1="26" x2="31" y2="26" fill="none"/>
  <line x1="11" y1="34" x2="31" y2="34" fill="none"/>
  <line x1="11" y1="42" x2="25" y2="42" fill="none"/>
</g>

<!-- Illustration: staircase answer -->
<rect x="125" y="980" width="830" height="266" rx="28" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>

<!-- Clouds -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
  <ellipse cx="620" cy="1016" rx="40" ry="15"/>
  <ellipse cx="240" cy="1030" rx="44" ry="16"/>
</g>

<!-- Ground -->
<rect x="150" y="1236" width="780" height="6" rx="3" fill="#2e7d32"/>

<!-- Steps rising from right to left -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="700" y="1181" width="200" height="55" fill="#2f7fb5"/>
  <rect x="700" y="1181" width="200" height="10" fill="#8fc9f2"/>
  <rect x="500" y="1126" width="200" height="110" fill="#c96a1b"/>
  <rect x="500" y="1126" width="200" height="10" fill="#f0c48c"/>
  <rect x="300" y="1071" width="200" height="165" fill="#2e7d32"/>
  <rect x="300" y="1071" width="200" height="10" fill="#a9dcbe"/>
</g>

<!-- Sign posts and boards -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="797" y="1152" width="6" height="29" rx="2" fill="#7f95ab"/>
  <rect x="760" y="1104" width="80" height="48" rx="6" fill="#ffffff"/>
  <rect x="597" y="1097" width="6" height="29" rx="2" fill="#7f95ab"/>
  <rect x="560" y="1049" width="80" height="48" rx="6" fill="#ffffff"/>
  <rect x="397" y="1042" width="6" height="29" rx="2" fill="#7f95ab"/>
  <rect x="360" y="994" width="80" height="48" rx="6" fill="#ffffff"/>
</g>

<!-- Step 1 sign: two speech bubbles -->
<g transform="translate(800 1128)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="-26,6 -18,6 -28,14" fill="#8fc9f2"/>
  <rect x="-32" y="-14" width="28" height="20" rx="6" fill="#8fc9f2"/>
  <polygon points="18,6 26,6 28,14" fill="#ffd24a"/>
  <rect x="4" y="-14" width="28" height="20" rx="6" fill="#ffd24a"/>
</g>

<!-- Step 2 sign: envelope -->
<g transform="translate(600 1073)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-24" y="-15" width="48" height="30" rx="4" fill="#f0c48c"/>
  <path d="M -24 -15 L 0 4 L 24 -15" fill="none"/>
</g>

<!-- Step 3 sign: person at a crossing -->
<g transform="translate(400 1018)" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-30" y="10" width="60" height="9" fill="#7f95ab"/>
  <rect x="-24" y="10" width="7" height="9" fill="#ffffff"/>
  <rect x="-10" y="10" width="7" height="9" fill="#ffffff"/>
  <rect x="4" y="10" width="7" height="9" fill="#ffffff"/>
  <rect x="18" y="10" width="7" height="9" fill="#ffffff"/>
  <g stroke="#22303f" stroke-width="2.5">
    <line x1="-2" y1="4" x2="-6" y2="12" fill="none"/>
    <line x1="2" y1="4" x2="6" y2="12" fill="none"/>
    <rect x="-5" y="-10" width="10" height="15" rx="3" fill="#2f7fb5"/>
    <circle cx="0" cy="-15" r="5" fill="#d59f6f"/>
  </g>
</g>

<!-- Pencil resting at the top of the stairs -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="304" y="1058" width="8" height="11" rx="2" fill="#c0392b"/>
  <rect x="312" y="1058" width="36" height="11" fill="#ffd24a"/>
  <polygon points="348,1058 348,1069 362,1063.5" fill="#e8dfd1"/>
</g>

<!-- Star and smiling face -->
<g transform="translate(860 996)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.47,19.1 52.7,19.97 38.46,31.4 43.28,49.03 28,39 12.72,49.03 17.54,31.4 3.27,19.97 21.53,19.1" fill="#ffd24a"/>
</g>
<g transform="translate(210 1170)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">الذكاء الاصطناعي هو المجال الأوسع،</tspan>
  <tspan x="950" dy="40">ويضم الأنظمة التي تؤدي مهام تحتاج إلى ذكاء،</tspan>
  <tspan x="950" dy="40">مثل الترجمة.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">AI is the broadest field; it includes</tspan>
  <tspan x="120" dy="40">systems that perform tasks that need</tspan>
  <tspan x="120" dy="40">intelligence, such as translation.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">بداخله التعلّم الآلي، الذي يتعلم الأنماط</tspan>
  <tspan x="950" dy="40">من البيانات بدلًا من القواعد المكتوبة،</tspan>
  <tspan x="950" dy="40">مثل مرشح الرسائل المزعجة.</tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Inside it is machine learning, which</tspan>
  <tspan x="120" dy="40">learns patterns from data instead of</tspan>
  <tspan x="120" dy="40">written rules, such as a spam filter.</tspan>
</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وبداخل التعلّم الآلي التعلم العميق،</tspan>
  <tspan x="950" dy="40">الذي يستخدم شبكات عصبية متعددة الطبقات،</tspan>
  <tspan x="950" dy="40">مثل التعرف على المشاة في القيادة الذاتية.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Inside machine learning is deep learning,</tspan>
  <tspan x="120" dy="40">which uses multi-layer neural networks,</tspan>
  <tspan x="120" dy="40">such as recognizing pedestrians in</tspan>
  <tspan x="120" dy="40">autonomous driving.</tspan>
</text>
</svg>
