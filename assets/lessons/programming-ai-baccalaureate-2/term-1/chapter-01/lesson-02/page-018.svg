  <circle cx="46" cy="40" r="8" fill="#4fc3e8" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: warning triangle inside warning card -->
<g transform="translate(860 700)" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,4 54,50 2,50" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="25" y="18" width="6" height="18" rx="3" fill="#22303f"/>
  <circle cx="28" cy="43" r="3.5" fill="#22303f"/>
</g>

<!-- Illustration panel -->
