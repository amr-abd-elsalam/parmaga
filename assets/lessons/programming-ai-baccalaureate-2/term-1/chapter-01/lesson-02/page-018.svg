<rect x="961" y="658" width="6" height="96" rx="3" fill="#c96a1b"/>

<!-- Icon: open book beside header -->
<g transform="translate(370 150)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M26 7 Q 15 0 2 3 L 2 31 Q 15 28 26 34 Z" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
  <path d="M26 7 Q 37 0 50 3 L 50 31 Q 37 28 26 34 Z" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
