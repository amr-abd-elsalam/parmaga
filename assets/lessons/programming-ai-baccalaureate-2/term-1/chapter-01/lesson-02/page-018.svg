<!-- Info card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">مصطلحات أساسية</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">KEY TERMS</tspan>
</text>

<!-- Info card term -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الشبكة العصبية</tspan></tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#c0392b">الاصطناعية Artificial Neural Network (ANN)</tspan></tspan>
  <tspan x="935" dy="40">— نموذج حاسوبي مستوحى بصورة مبسطة من ترابط</tspan>
  <tspan x="935" dy="40">الخلايا العصبية، من وحدات متصلة في طبقات</tspan>
  <tspan x="935" dy="40">تتغير أوزانها أثناء التدريب.</tspan>
</text>
<text x="140" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Artificial neural network (ANN)</tspan> —</tspan>
  <tspan x="140" dy="40">a computer model loosely inspired by</tspan>
  <tspan x="140" dy="40">connected nerve cells, made of units</tspan>
  <tspan x="140" dy="40">connected in layers whose weights</tspan>
  <tspan x="140" dy="40">change during training.</tspan>
</text>

<!-- Warning card text -->
<text x="935" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">انتبه:</tspan> مستوحاة من الدماغ، وليست نسخة منه.</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Note:</tspan> it is inspired by the brain;</tspan>
  <tspan x="140" dy="40">it is not a copy of it.</tspan>
</text>
</svg>
