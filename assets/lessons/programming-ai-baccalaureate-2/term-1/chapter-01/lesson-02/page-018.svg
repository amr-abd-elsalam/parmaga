  <line x1="32" y1="21" x2="44" y2="19" stroke="#7f95ab" stroke-width="2.5"/>
</g>

<!-- Icon: connected nodes inside info card -->
<g transform="translate(860 470)" stroke-linecap="round" stroke-linejoin="round">
