  <tspan x="965" dy="0">التعلّم الآلي</tspan>
  <tspan x="965" dy="40">التقليدي</tspan>
</text>
<text x="560" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="560" dy="0">Traditional</tspan>
  <tspan x="560" dy="40">machine learning</tspan>
</text>
<text x="520" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#c0392b">
  <tspan x="520" dy="0">الذكاء الاصطناعي</tspan>
  <tspan x="520" dy="40">التوليدي</tspan>
</text>
<text x="115" y="234" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#152b42">
  <tspan x="115" dy="0">Generative AI</tspan>
</text>

<!-- Table text: row 1 -->
<text x="965" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="965" dy="0">يحكم ويصنّف</tspan>
</text>
<text x="560" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="560" dy="0">Judges and classifies</tspan>
</text>
<text x="520" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="520" dy="0">يُنشئ محتوى جديدًا</tspan>
</text>
<text x="115" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="115" dy="0">Creates new content</tspan>
</text>

<!-- Table text: row 2 -->
<text x="965" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="965" dy="0">«هل هذه الرسالة مزعجة؟»</tspan>
</text>
<text x="560" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="560" dy="0">"Is this message</tspan>
  <tspan x="560" dy="40">spam?"</tspan>
</text>
<text x="520" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#c96a1b">
  <tspan x="520" dy="0">«اكتب لي رسالة» أو</tspan>
  <tspan x="520" dy="40">«ارسم لي صورة»</tspan>
</text>
<text x="115" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#c96a1b">
  <tspan x="115" dy="0">"Write me a message"</tspan>
  <tspan x="115" dy="40">or "Draw me</tspan>
  <tspan x="115" dy="40">a picture"</tspan>
</text>
