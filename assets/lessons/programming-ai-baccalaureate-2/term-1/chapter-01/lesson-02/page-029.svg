<!-- Card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">
  <tspan x="935" dy="0">الحل: تحقّق دائمًا</tspan>
</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">
  <tspan x="140" dy="0">The fix: always verify</tspan>
</text>

<!-- Bullet 1 -->
<text x="930" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="930" dy="0">راجع المعلومة في <tspan font-weight="bold" fill="#2e7d32">مصدر موثوق.</tspan></tspan>
</text>
<text x="150" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="150" dy="0">Check the information</tspan>
  <tspan x="150" dy="40">in a <tspan font-weight="bold" fill="#2e7d32">reliable source.</tspan></tspan>
</text>

<!-- Bullet 2 -->
<text x="930" y="354" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="930" dy="0">اطلب المصدر، ثم <tspan font-weight="bold" fill="#17457f">افتحه بنفسك.</tspan></tspan>
</text>
<text x="150" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="150" dy="0">Ask for the source,</tspan>
  <tspan x="150" dy="40">then <tspan font-weight="bold" fill="#17457f">open it yourself.</tspan></tspan>
</text>

<!-- Bullet 3 -->
<text x="930" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#17457f">لا تنسخ</tspan> الناتج كما هو أبدًا.</tspan>
</text>
<text x="150" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="150" dy="0"><tspan font-weight="bold" fill="#17457f">Never copy</tspan> the output as it is.</tspan>
</text>

<!-- Key sentence -->
<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">
  <tspan x="935" dy="0">بيتكلم بثقة… بس مش لازم يكون صح.</tspan>
</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">
  <tspan x="140" dy="0">It speaks confidently…</tspan>
  <tspan x="140" dy="40">but it is not always right.</tspan>
</text>
</svg>
