<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">دورك الآن: فكّر وتواصل</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Your Turn: Think and Communicate</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تحدّي الـ30 ثانية</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The 30-second challenge</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اشرح لزميلك الفرق بين <tspan font-weight="bold" fill="#17457f">التعلّم الآلي</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">والتوليدي</tspan> في 30 ثانية،</tspan>
  <tspan x="950" dy="40">دون استخدام أي مصطلح تقني.</tspan>
</text>
<text x="120" y="434" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Explain the difference between</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">machine learning</tspan> and <tspan font-weight="bold" fill="#17457f">generative AI</tspan></tspan>
  <tspan x="120" dy="40">to a classmate in 30 seconds,</tspan>
  <tspan x="120" dy="40">without using any technical term.</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">اشرحها كأنك تشرح <tspan font-weight="bold" fill="#17457f">لجدّتك!</tspan></tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Explain it as if to your <tspan font-weight="bold" fill="#17457f">grandmother!</tspan></tspan>
</text>

<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ثم يخبرك زميلك: <tspan font-weight="bold" fill="#2e7d32">هل فهم شرحك؟</tspan></tspan>
</text>
<text x="120" y="794" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Then your classmate tells you:</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">did they understand?</tspan></tspan>
</text>
</svg>
