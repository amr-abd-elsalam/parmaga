<!-- Header -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">
  <tspan x="950" dy="0">لماذا يحدث ذلك؟</tspan>
</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">
  <tspan x="120" dy="0">Why does it happen?</tspan>
</text>

<!-- Paragraph 1 -->
<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">النموذج التوليدي</tspan> مصمَّم ليُنتج كلامًا محتملًا</tspan>
  <tspan x="950" dy="40">لغويًا، لا ليتحقق من أنه <tspan font-weight="bold" fill="#17457f">صحيح واقعيًا.</tspan></tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">generative model</tspan> is designed to</tspan>
  <tspan x="120" dy="40">produce text that is likely in language,</tspan>
  <tspan x="120" dy="40">not to check that it is <tspan font-weight="bold" fill="#17457f">true in fact.</tspan></tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">لذلك قد <tspan font-weight="bold" fill="#17457f">يخترع</tspan> معلومة أو تاريخًا</tspan>
  <tspan x="950" dy="40">أو حتى <tspan font-weight="bold" fill="#17457f">مرجعًا غير موجود.</tspan></tspan>
</text>
<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">So it may <tspan font-weight="bold" fill="#17457f">invent</tspan> a fact, a date,</tspan>
  <tspan x="120" dy="40">or even <tspan font-weight="bold" fill="#17457f">a source that does not exist.</tspan></tspan>
</text>
</svg>
