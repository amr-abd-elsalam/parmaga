  <text x="960" y="158"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="52"
        font-weight="bold"
        fill="#16457c">
    <tspan x="960" dy="0">التعلم الآلي</tspan>
  </text>

  <text x="118" y="156"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="45"
        font-weight="bold"
        fill="#12293f">
    <tspan x="118" dy="0">Machine Learning</tspan>
  </text>

  <text x="950" y="280"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">التعلم الآلي</tspan>
  </text>

  <text x="950" y="319"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="end"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="29"
        fill="#225f9c">Machine Learning (ML)</text>

  <text x="950" y="358"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="30"
        fill="#225f9c">
    <tspan x="950" dy="0">إحدى تقنيات التعلم التي تجعل</tspan>
    <tspan x="950" dy="39">الذكاء الاصطناعي يعمل. يتعلم</tspan>
    <tspan x="950" dy="39">الأنماط من البيانات ليقدم</tspan>
    <tspan x="950" dy="39">تنبؤات أو أحكامًا، بدلًا من</tspan>
    <tspan x="950" dy="39">برمجة كل قرار على هيئة قاعدة</tspan>
    <tspan x="950" dy="39">ثابتة. من أمثلته اكتشاف</tspan>
    <tspan x="950" dy="39">الرسائل المزعجة والتوصية</tspan>
    <tspan x="950" dy="39">بالمنتجات اعتمادًا على</tspan>
    <tspan x="950" dy="39">بيانات المستخدم.</tspan>
  </text>

  <text x="118" y="278"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="118" dy="0">Machine Learning (ML)</tspan>
    <tspan x="118" dy="33">is one of the learning</tspan>
    <tspan x="118" dy="33">technologies that makes</tspan>
    <tspan x="118" dy="33">AI work. It learns</tspan>
    <tspan x="118" dy="33">patterns from data to</tspan>
    <tspan x="118" dy="33">make predictions or</tspan>
    <tspan x="118" dy="33">judgments instead of</tspan>
    <tspan x="118" dy="33">programming every</tspan>
    <tspan x="118" dy="33">decision as a fixed</tspan>
    <tspan x="118" dy="33">rule. Examples include</tspan>
    <tspan x="118" dy="33">detecting spam messages</tspan>
    <tspan x="118" dy="33">and recommending</tspan>
    <tspan x="118" dy="33">products based on user</tspan>
    <tspan x="118" dy="33">data.</tspan>
  </text>

  <text x="540" y="790"
