<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الفئات المتداخلة</tspan> <tspan font-weight="bold" fill="#c0392b">Nested Categories</tspan> —</tspan>
  <tspan x="935" dy="40">فئات توجد <tspan font-weight="bold" fill="#17457f">إحداها داخل الأخرى،</tspan> مثل البيت</tspan>
  <tspan x="935" dy="40">والأوضة والدولاب والدرج.</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Nested categories</tspan> — categories that</tspan>
  <tspan x="140" dy="40">sit <tspan font-weight="bold" fill="#17457f">one inside another,</tspan> like the</tspan>
  <tspan x="140" dy="40">house, room, closet, and drawer.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وهذه هي <tspan font-weight="bold" fill="#17457f">الفكرة</tspan> التي سيطلبها منك</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">سؤال الست درجات.</tspan></tspan>
</text>
<text x="120" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">This is the <tspan font-weight="bold" fill="#17457f">idea</tspan> the <tspan font-weight="bold" fill="#17457f">6-mark question</tspan></tspan>
  <tspan x="120" dy="40">will ask you to use.</tspan>
</text>
</svg>
