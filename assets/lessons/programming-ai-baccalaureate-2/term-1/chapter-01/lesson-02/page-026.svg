<!-- Text: info card header -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<!-- Text: paragraph 1 -->
<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النموذج اللغوي الكبير</tspan> Large Language Model</tspan>
  <tspan x="935" dy="40">(LLM) — نموذج توليدي دُرِّب على نصوص هائلة،</tspan>
  <tspan x="935" dy="40">ويولّد النص <tspan font-weight="bold" fill="#17457f">بالتنبؤ بالكلمة التالية،</tspan></tspan>
  <tspan x="935" dy="40">وعليه بُني ChatGPT.</tspan>
</text>
<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Large language model (LLM)</tspan> —</tspan>
  <tspan x="140" dy="40">a generative model trained on huge</tspan>
  <tspan x="140" dy="40">amounts of text that generates text</tspan>
  <tspan x="140" dy="40">by <tspan font-weight="bold" fill="#17457f">predicting the next word;</tspan> ChatGPT</tspan>
  <tspan x="140" dy="40">is built on one.</tspan>
</text>

<!-- Text: paragraph 2 -->
<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الطلب</tspan> Prompt — التعليمات التي تكتبها</tspan>
  <tspan x="935" dy="40">للنظام التوليدي؛ كلما كان <tspan font-weight="bold" fill="#17457f">أوضح،</tspan></tspan>
  <tspan x="935" dy="40">كانت <tspan font-weight="bold" fill="#2e7d32">النتيجة أفضل.</tspan></tspan>
</text>
<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Prompt</tspan> — the instructions you write</tspan>
  <tspan x="140" dy="40">to a generative system; the <tspan font-weight="bold" fill="#17457f">clearer</tspan></tspan>
  <tspan x="140" dy="40">it is, <tspan font-weight="bold" fill="#2e7d32">the better the result.</tspan></tspan>
</text>
</svg>
