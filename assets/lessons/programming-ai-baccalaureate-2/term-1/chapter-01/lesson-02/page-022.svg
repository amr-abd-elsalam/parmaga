<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>

<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعلم العميق Deep Learning</tspan> — أسلوب من</tspan>
  <tspan x="935" dy="40">التعلّم الآلي يستخدم شبكات عصبية</tspan>
  <tspan x="935" dy="40"><tspan font-weight="bold" fill="#17457f">بطبقات مخفية</tspan> كثيرة، ويحتاج غالبًا إلى</tspan>
  <tspan x="935" dy="40">بيانات كثيرة وقدرة حاسوبية كبيرة.</tspan>
</text>

<text x="140" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Deep learning</tspan> — a type of machine</tspan>
  <tspan x="140" dy="40">learning that uses neural networks</tspan>
  <tspan x="140" dy="40">with <tspan font-weight="bold" fill="#17457f">many hidden layers;</tspan></tspan>
  <tspan x="140" dy="40">it usually needs a lot of data and</tspan>
  <tspan x="140" dy="40">computing power.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التمثيل Representation</tspan> — طريقة وصف</tspan>
  <tspan x="935" dy="40">النموذج للبيانات داخليًا <tspan font-weight="bold" fill="#17457f">بالأرقام:</tspan></tspan>
  <tspan x="935" dy="40">خطوط، ثم أشكال، ثم ملامح.</tspan>
</text>

<text x="140" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Representation</tspan> — how a model</tspan>
  <tspan x="140" dy="40">describes data inside itself</tspan>
  <tspan x="140" dy="40">using <tspan font-weight="bold" fill="#17457f">numbers:</tspan> lines, then shapes,</tspan>
  <tspan x="140" dy="40">then features.</tspan>
</text>
</svg>
