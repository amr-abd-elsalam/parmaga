<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">
<defs>
  <linearGradient id="pmDesk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07a45"/>
    <stop offset="1" stop-color="#7d4f28"/>
  </linearGradient>
  <pattern id="pmRules" x="0" y="120" width="1080" height="40" patternUnits="userSpaceOnUse">
    <line x1="0" y1="39.5" x2="1080" y2="39.5" stroke="#cfe0f0" stroke-width="1.4"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1080" height="1350" fill="url(#pmDesk)"/>
<path d="M0 420 C 300 380, 700 470, 1080 410" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<path d="M0 980 C 350 940, 720 1030, 1080 960" fill="none" stroke="#3a2411" stroke-width="3" opacity=".12"/>
<rect x="40" y="38" width="1012" height="1290" fill="#3a2411" opacity=".18"/>
<rect x="34" y="30" width="1012" height="1290" fill="#fffdf7"/>
<rect x="67" y="120" width="946" height="1152" fill="url(#pmRules)"/>
<rect x="67" y="64" width="946" height="1222" fill="none" stroke="#c0392b" stroke-width="2.4"/>

<defs>
  <linearGradient id="ilSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dff1f7"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
</defs>

<!-- Shadows -->
<rect x="109" y="608" width="870" height="208" rx="16" fill="#22303f" opacity=".12"/>
<rect x="129" y="862" width="830" height="390" rx="28" fill="#22303f" opacity=".18"/>

<!-- Success card -->
<rect x="105" y="602" width="870" height="208" rx="16" fill="#e9f7ee" stroke="#a9dcbe" stroke-width="2"/>
<rect x="961" y="618" width="6" height="176" rx="3" fill="#2e7d32"/>

<!-- Side icon: AI chip -->
<g transform="translate(860 300)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <line x1="20" y1="4" x2="20" y2="12" fill="none"/>
  <line x1="28" y1="4" x2="28" y2="12" fill="none"/>
  <line x1="36" y1="4" x2="36" y2="12" fill="none"/>
  <line x1="20" y1="44" x2="20" y2="52" fill="none"/>
  <line x1="28" y1="44" x2="28" y2="52" fill="none"/>
  <line x1="36" y1="44" x2="36" y2="52" fill="none"/>
  <line x1="4" y1="20" x2="12" y2="20" fill="none"/>
  <line x1="4" y1="28" x2="12" y2="28" fill="none"/>
  <line x1="4" y1="36" x2="12" y2="36" fill="none"/>
  <line x1="44" y1="20" x2="52" y2="20" fill="none"/>
  <line x1="44" y1="28" x2="52" y2="28" fill="none"/>
  <line x1="44" y1="36" x2="52" y2="36" fill="none"/>
  <rect x="12" y="12" width="32" height="32" rx="4" fill="#17457f"/>
  <rect x="21" y="21" width="14" height="14" rx="2" fill="#4fc3e8"/>
</g>

<!-- Side icon: star -->
<g transform="translate(870 528)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <polygon points="28,2 34.47,19.1 52.7,19.97 38.46,31.4 43.28,49.03 28,39 12.72,49.03 17.54,31.4 3.27,19.97 21.53,19.1" fill="#ffd24a"/>
</g>

<!-- Wink face inside the tip card -->
<g transform="translate(180 640)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3"/>
</g>

<!-- Illustration frame -->
<rect x="125" y="856" width="830" height="390" rx="28" fill="url(#ilSky)" stroke="#22303f" stroke-width="2.5"/>

<!-- Sun and cloud -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="885" cy="922" r="28" fill="#ffd24a"/>
  <ellipse cx="420" cy="914" rx="44" ry="16" fill="#ffffff"/>
  <circle cx="408" cy="902" r="14" fill="#ffffff"/>
</g>

<!-- Ground -->
<rect x="150" y="1226" width="780" height="6" rx="3" fill="#2e7d32"/>

<!-- Top of the staircase -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="370" y="1146" width="110" height="80" fill="#c96a1b"/>
  <rect x="370" y="1146" width="110" height="10" fill="#f0c48c"/>
  <rect x="150" y="1066" width="220" height="160" fill="#2e7d32"/>
  <rect x="150" y="1066" width="220" height="10" fill="#a9dcbe"/>
  <rect x="257" y="1030" width="6" height="36" rx="2" fill="#7f95ab"/>
  <rect x="210" y="966" width="100" height="64" rx="8" fill="#ffffff"/>
</g>

<!-- Glowing pen sign -->
<g transform="translate(260 998)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" opacity=".6"/>
  <g transform="rotate(-40)" stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-5" y="-22" width="10" height="30" rx="3" fill="#2f7fb5"/>
    <polygon points="-5,8 5,8 0,19" fill="#ffffff"/>
    <circle cx="0" cy="15" r="1.5" fill="#22303f"/>
  </g>
</g>

<!-- Completed answer sheet -->
<rect x="544" y="906" width="220" height="300" rx="8" fill="#22303f" opacity=".18"/>
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="540" y="900" width="220" height="300" rx="8" fill="#ffffff"/>
  <line x1="570" y1="945" x2="730" y2="945" stroke="#7f95ab" fill="none"/>
  <line x1="570" y1="980" x2="730" y2="980" stroke="#7f95ab" fill="none"/>
  <line x1="570" y1="1015" x2="730" y2="1015" stroke="#7f95ab" fill="none"/>
  <line x1="570" y1="1050" x2="690" y2="1050" stroke="#7f95ab" fill="none"/>
  <polygon points="585,1130 605,1112 635,1140 715,1072 735,1092 635,1180" fill="#2e7d32"/>
</g>

<!-- Trophy -->
<g stroke="#22303f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M800 1062 C 776 1062, 776 1100, 806 1100" fill="none"/>
  <path d="M880 1062 C 904 1062, 904 1100, 874 1100" fill="none"/>
  <path d="M800 1050 L880 1050 L872 1110 C 868 1130, 812 1130, 808 1110 Z" fill="#ffd24a"/>
  <rect x="832" y="1126" width="16" height="30" fill="#c96a1b"/>
  <rect x="810" y="1156" width="60" height="18" rx="4" fill="#c96a1b"/>
  <rect x="800" y="1174" width="80" height="20" rx="4" fill="#17457f"/>
  <path d="M900 1000 L904 1010 L914 1014 L904 1018 L900 1028 L896 1018 L886 1014 L896 1010 Z" fill="#ffd24a"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وأغلب أنظمة الذكاء الاصطناعي التوليدي</tspan>
  <tspan x="950" dy="40">مبنية على التعلم العميق لإنشاء محتوى جديد،</tspan>
  <tspan x="950" dy="40">مثل ChatGPT.</tspan>
</text>
<text x="120" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Most generative AI systems are built on</tspan>
  <tspan x="120" dy="40">deep learning to create new content,</tspan>
  <tspan x="120" dy="40">such as ChatGPT.</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">فهي فئات متداخلة، كل واحدة أكثر تخصصًا</tspan>
  <tspan x="950" dy="40">من التي قبلها.</tspan>
</text>
<text x="120" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So they are nested categories, each more</tspan>
  <tspan x="120" dy="40">specialized than the one before.</tspan>
</text>

<text x="935" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#2e7d32">نصيحة:</tspan> لكل فئة جملة فيها تعريف ومثال،</tspan>
  <tspan x="935" dy="40">واختم بجملة «فئات متداخلة».</tspan>
</text>
<text x="140" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#2e7d32">Tip:</tspan> give each category one sentence</tspan>
  <tspan x="140" dy="40">with a definition and an example,</tspan>
  <tspan x="140" dy="40">and end with "nested categories."</tspan>
</text>
</svg>
