<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">الخوارزمية</tspan> <tspan font-weight="bold" fill="#c0392b">Algorithm</tspan> — خطوات مرتبة</tspan>
  <tspan x="935" dy="40">لحل مشكلة، مثل <tspan fill="#c96a1b">وصفة</tspan> الطبخ.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Algorithm</tspan> — ordered steps to solve</tspan>
  <tspan x="140" dy="40">a problem, like a <tspan fill="#c96a1b">recipe.</tspan></tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البرمجة الصريحة</tspan> <tspan font-weight="bold" fill="#c0392b">Explicit Programming</tspan> —</tspan>
  <tspan x="935" dy="40">يكتب المبرمج كل قاعدة بنفسه:</tspan>
  <tspan x="935" dy="40">«إذا حدث كذا، فافعل كذا».</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Explicit programming</tspan> —</tspan>
  <tspan x="140" dy="40">the programmer writes every rule:</tspan>
  <tspan x="140" dy="40">"If this happens, then do that."</tspan>
</text>

<text x="935" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التعلّم الآلي</tspan> <tspan font-weight="bold" fill="#c0392b">Machine Learning</tspan> —</tspan>
  <tspan x="935" dy="40">فرع من الذكاء الاصطناعي يتعلم <tspan font-weight="bold" fill="#17457f">الأنماط</tspan></tspan>
  <tspan x="935" dy="40">من البيانات بدلًا من برمجة كل قاعدة.</tspan>
</text>
<text x="140" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Machine learning</tspan> — a branch of AI</tspan>
  <tspan x="140" dy="40">that learns <tspan font-weight="bold" fill="#17457f">patterns</tspan> from data</tspan>
  <tspan x="140" dy="40">instead of programming every rule.</tspan>
</text>
</svg>
