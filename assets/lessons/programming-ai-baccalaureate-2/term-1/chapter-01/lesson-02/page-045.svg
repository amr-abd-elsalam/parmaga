<!-- Student -->
<rect x="480" y="1186" width="20" height="22" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<rect x="506" y="1186" width="20" height="22" fill="#17457f" stroke="#22303f" stroke-width="2.5"/>
<ellipse cx="486" cy="1210" rx="14" ry="6" fill="#22303f"/>
<ellipse cx="516" cy="1210" rx="14" ry="6" fill="#22303f"/>
