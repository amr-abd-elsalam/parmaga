<circle cx="535" cy="1182" r="7" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
<rect x="474" y="1118" width="58" height="72" rx="22" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5"/>
<rect x="494" y="1110" width="14" height="12" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
<polygon points="492,1120 501,1132 510,1120" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="502" cy="1092" r="26" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
<path d="M476 1090 C 474 1062, 498 1056, 512 1060 C 526 1064, 532 1078, 528 1094 C 520 1080, 500 1074, 480 1092 Z" fill="#2b211c"/>
<circle cx="521" cy="1096" r="5" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
<circle cx="488" cy="1092" r="3.5" fill="#22303f"/>
<circle cx="502" cy="1092" r="3.5" fill="#22303f"/>
<path d="M486 1103 Q 495 1111 504 1103" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
<polygon points="482,1124 428,1078 420,1090 476,1142" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

<!-- Folded slip with tiny house doodle -->
<rect x="362" y="1060" width="56" height="36" rx="3" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
<line x1="378" y1="1060" x2="378" y2="1096" stroke="#7f95ab" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="390,1078 400,1067 410,1078" fill="none" stroke="#c96a1b" stroke-width="2.5" stroke-linejoin="round"/>
