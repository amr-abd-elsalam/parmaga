<circle cx="422" cy="1084" r="9" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>

<!-- Bulletin board -->
<rect x="600" y="1070" width="90" height="70" rx="6" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
<rect x="612" y="1082" width="28" height="20" fill="#ffffff" stroke="#22303f" stroke-width="2.5"/>
<rect x="650" y="1092" width="28" height="36" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5"/>
<circle cx="626" cy="1082" r="3" fill="#c0392b"/>
<circle cx="664" cy="1092" r="3" fill="#c0392b"/>

<!-- Window -->
<rect x="720" y="1060" width="120" height="90" rx="6" fill="#8fc9f2" stroke="#22303f" stroke-width="2.5"/>
<circle cx="812" cy="1084" r="10" fill="#ffd24a"/>
<path d="M780 1060 L780 1150 M720 1105 L840 1105" fill="none" stroke="#22303f" stroke-width="2.5" stroke-linecap="round"/>

<!-- Student desk -->
<rect x="742" y="1180" width="8" height="25" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="840" y="1180" width="8" height="25" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="730" y="1168" width="130" height="12" rx="4" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>

<!-- Plant -->
<path d="M900 1170 C 880 1150, 878 1125, 888 1110 C 902 1128, 904 1150, 900 1170 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M900 1170 C 916 1148, 926 1130, 922 1112 C 906 1124, 898 1146, 900 1170 Z" fill="#a9dcbe" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="880,1170 920,1170 914,1205 886,1205" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>

<rect x="125" y="1030" width="830" height="220" rx="22" fill="none" stroke="#22303f" stroke-width="2.5"/>

<!-- Icon: ticket (header line) -->
<g transform="translate(128 104)">
  <path d="M0 6 L56 6 L56 18 A6 6 0 0 0 56 30 L56 42 L0 42 L0 30 A6 6 0 0 0 0 18 Z" fill="#f0c48c" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="42" y1="10" x2="42" y2="38" stroke="#c96a1b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
  <circle cx="20" cy="24" r="7" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Face: wink (beside paragraph) -->
<g transform="translate(880 354)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M 5 -6 L 13 -6" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M -11 7 Q 0 17 11 7" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: check badge (inside card) -->
<g transform="translate(868 704)">
  <circle cx="24" cy="24" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M14 25 L21 32 L35 17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Icon: star (inside card) -->
<g transform="translate(894 970)">
  <polygon points="0,-24 6,-8.2 22.8,-7.4 9.7,3.1 14.1,19.4 0,10.2 -14.1,19.4 -9.7,3.1 -22.8,-7.4 -6,-8.2" fill="#ffd24a" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">تذكرة الخروج</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Exit ticket</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">قبل أن تغادر، اكتب على ورقة صغيرة</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">جملة واحدة</tspan> وأكمل <tspan font-weight="bold" fill="#c0392b">التشبيه</tspan> بأسلوبك:</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Before you leave, write <tspan font-weight="bold" fill="#17457f">one sentence</tspan></tspan>
  <tspan x="120" dy="40">on a small slip and finish the</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">comparison</tspan> in your own words:</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#17457f">«الذكاء الاصطناعي بيت، و...»</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="bold" fill="#17457f">&quot;AI is a house, and...&quot;</text>

<text x="935" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#2e7d32">ما تخرج به من هذا الدرس</text>
<text x="140" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#2e7d32">What you take from this lesson</text>

<text x="930" y="674" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#17457f">صورة واضحة:</tspan> البيت والأوضة والدولاب والدرج.</tspan>
</text>
<text x="150" y="714" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0"><tspan font-weight="bold" fill="#17457f">A clear picture:</tspan> the house, the room,</tspan>
  <tspan x="150" dy="40">the closet, and the drawer.</tspan>
</text>

<text x="930" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#17457f">فعل واحد</tspan> يميز كل مصطلح.</tspan>
</text>
<text x="150" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0"><tspan font-weight="bold" fill="#17457f">One verb</tspan> that marks each term.</tspan>
</text>

<text x="930" y="874" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="930" dy="0"><tspan font-weight="bold" fill="#c0392b">الهلوسة:</tspan> كلام واثق،</tspan>
  <tspan x="930" dy="40">لكنه ليس صحيحًا دائمًا.</tspan>
</text>
<text x="150" y="954" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="150" dy="0"><tspan font-weight="bold" fill="#c0392b">Hallucination:</tspan> confident words</tspan>
  <tspan x="150" dy="40">that are not always right.</tspan>
</text>
</svg>
