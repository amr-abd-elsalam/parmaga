<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 6: الذكاء الاصطناعي</tspan>
  <tspan x="540" dy="48">الضيق… الشيف المتخصص</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Stop 6: Narrow AI… The Specialist Chef</text>

<!-- Paragraph 1 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan fill="#c96a1b">شيف البيتزا</tspan> العالمي، لو طلبت منه</tspan>
  <tspan x="950" dy="40">أن يصلح سيارتك، هل سيعرف؟</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">A world-famous <tspan fill="#c96a1b">pizza chef</tspan>: if you ask</tspan>
  <tspan x="120" dy="40">him to fix your car, will he know how?</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">هكذا معظم أنظمة <tspan font-weight="bold" fill="#17457f">الذكاء الاصطناعي</tspan> اليوم:</tspan>
  <tspan x="950" dy="40">النظام الذي يلعب <tspan fill="#c96a1b">الشطرنج</tspan> كبطل العالم</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">لا يستطيع</tspan> أن يترجم جملة.</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Most <tspan font-weight="bold" fill="#17457f">AI systems</tspan> today are like this:</tspan>
  <tspan x="120" dy="40">a system that plays <tspan fill="#c96a1b">chess</tspan></tspan>
  <tspan x="120" dy="40">like a world champion</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">cannot</tspan> translate a sentence.</tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وصورة الأفلام <tspan font-weight="bold" fill="#17457f">غير صحيحة:</tspan> لا يوجد حتى الآن</tspan>
  <tspan x="950" dy="40">ذكاء اصطناعي <tspan font-weight="bold" fill="#c0392b">«عام»</tspan> يفهم كل شيء مثل الإنسان.</tspan>
</text>
<text x="120" y="914" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">The movie picture is <tspan font-weight="bold" fill="#17457f">not true:</tspan></tspan>
  <tspan x="120" dy="40">there is still no <tspan font-weight="bold" fill="#c0392b">"general"</tspan> AI</tspan>
  <tspan x="120" dy="40">that understands everything like a human.</tspan>
</text>
</svg>
