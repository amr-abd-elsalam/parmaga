  <circle cx="46" cy="44" r="9" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
</g>

<!-- Icon: AI chip (beside short paragraph) -->
<g transform="translate(130 458)" stroke-linecap="round" stroke-linejoin="round">
  <line x1="20" y1="4" x2="20" y2="12" stroke="#22303f" stroke-width="2.5"/>
  <line x1="36" y1="4" x2="36" y2="12" stroke="#22303f" stroke-width="2.5"/>
