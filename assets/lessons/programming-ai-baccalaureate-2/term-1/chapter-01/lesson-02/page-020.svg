  <circle cx="210" cy="1118" r="30" fill="#f0c48c" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="199" cy="1112" rx="5" ry="6" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
  <ellipse cx="199" cy="1112" rx="1.5" ry="4" fill="#22303f"/>
  <ellipse cx="221" cy="1112" rx="5" ry="6" fill="#a9dcbe" stroke="#22303f" stroke-width="2"/>
