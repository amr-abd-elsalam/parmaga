<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 3: التعلم العميق…</tspan>
  <tspan x="540" dy="48">خط إنتاج في مصنع</tspan>
</text>

<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Stop 3: Deep Learning… A Factory Line</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">الشبكة <tspan font-weight="bold" fill="#c0392b">«العميقة»</tspan> فيها <tspan font-weight="bold" fill="#17457f">طبقات مخفية</tspan> كثيرة،</tspan>
  <tspan x="950" dy="40">وكل طبقة تفهم أكثر مما قبلها.</tspan>
</text>

<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">A <tspan font-weight="bold" fill="#c0392b">"deep"</tspan> network has many <tspan font-weight="bold" fill="#17457f">hidden layers;</tspan></tspan>
  <tspan x="120" dy="40">each one understands more than the last.</tspan>
</text>

<text x="950" y="514" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">تابع <tspan fill="#c96a1b">صورة قطة</tspan><tspan> وهي تدخل الشبكة:</tspan></text>

<text x="120" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Follow a <tspan fill="#c96a1b">cat photo</tspan> as it</tspan>
  <tspan x="120" dy="40">enters the network:</tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">الطبقة الأولى تلاحظ خطوطًا وحوافّ.</text>

<text x="132" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">The first layer notices lines and edges.</text>

<text x="950" y="714" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">الطبقة التالية تجمع الخطوط في أشكال.</text>

<text x="132" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0">The next layer combines</tspan>
  <tspan x="132" dy="40">lines into shapes.</tspan>
</text>

<text x="950" y="834" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">التي بعدها ترى عيونًا وآذانًا وشوارب.</text>

<text x="132" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="132" dy="0">The one after sees eyes,</tspan>
  <tspan x="132" dy="40">ears, and whiskers.</tspan>
</text>

<text x="950" y="954" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">الطبقة الأخيرة تقرر: <tspan font-weight="bold" fill="#2e7d32">«قطة».</tspan></text>

<text x="132" y="994" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">The last layer decides: <tspan font-weight="bold" fill="#2e7d32">"cat".</tspan></text>
</svg>
