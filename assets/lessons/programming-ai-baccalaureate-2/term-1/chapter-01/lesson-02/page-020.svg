  <path d="M245 1082 L 250 1088 L 260 1076" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="186" cy="1168" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="202" cy="1168" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="218" cy="1168" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
  <circle cx="234" cy="1168" r="4" fill="#ffd24a" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: light bulb (top-left) -->
<g transform="translate(130 112)" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="28" cy="22" r="17" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <rect x="20" y="37" width="16" height="13" rx="3" fill="#7f95ab" stroke="#22303f" stroke-width="2.5"/>
  <path d="M22 22 Q 28 14 34 22" fill="none" stroke="#22303f" stroke-width="2"/>
</g>

<!-- Icon: network nodes (top-right) -->
<g transform="translate(890 112)" stroke-linecap="round" stroke-linejoin="round">
  <line x1="28" y1="12" x2="10" y2="44" stroke="#22303f" stroke-width="2.5"/>
  <line x1="28" y1="12" x2="46" y2="44" stroke="#22303f" stroke-width="2.5"/>
