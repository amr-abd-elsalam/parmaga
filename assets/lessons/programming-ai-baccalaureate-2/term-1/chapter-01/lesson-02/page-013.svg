<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التنبؤ</tspan> <tspan font-weight="bold" fill="#c0392b">Prediction</tspan> — توقّع قيمة أو نتيجة،</tspan>
  <tspan x="935" dy="40">مثل <tspan fill="#c96a1b">سعر شقة</tspan> أو طقس الغد.</tspan>
</text>
<text x="140" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Prediction</tspan> — estimating a value</tspan>
  <tspan x="140" dy="40">or result, like an <tspan fill="#c96a1b">apartment price</tspan></tspan>
  <tspan x="140" dy="40">or tomorrow's weather.</tspan>
</text>

<text x="935" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">التصنيف</tspan> <tspan font-weight="bold" fill="#c0392b">Classification</tspan> — وضع الشيء</tspan>
  <tspan x="935" dy="40">في <tspan font-weight="bold" fill="#17457f">فئة محددة:</tspan> «مزعجة» أو «سليمة»،</tspan>
  <tspan x="935" dy="40">«قطة» أو «كلب».</tspan>
</text>
<text x="140" y="554" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Classification</tspan> — putting something</tspan>
  <tspan x="140" dy="40">into a <tspan font-weight="bold" fill="#17457f">fixed category:</tspan> "spam" or</tspan>
  <tspan x="140" dy="40">"not spam", "cat" or "dog".</tspan>
</text>

<text x="905" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">تنبؤ</text>
<text x="625" y="792" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Prediction</text>
<text x="455" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">تصنيف</text>
<text x="175" y="792" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Classification</text>
