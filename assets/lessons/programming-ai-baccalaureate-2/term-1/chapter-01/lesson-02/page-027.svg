<!-- Titles -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 5: الهلوسة…</tspan>
  <tspan x="540" dy="48">الطالب الذي يؤلّف في الامتحان</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">
  <tspan x="540" dy="0">Stop 5: Hallucination…</tspan>
  <tspan x="540" dy="36">The Student Who Makes Things Up</tspan>
</text>

<!-- Paragraph 1 -->
<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">كلنا نعرف الطالب الذي لا يعرف الإجابة، لكنه</tspan>
  <tspan x="950" dy="40">يكتب صفحة كاملة <tspan font-weight="bold" fill="#17457f">بثقة</tspan> وبخط جميل وكلام مرتب…</tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">We all know the student who doesn't know</tspan>
  <tspan x="120" dy="40">the answer, but writes a full page</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">confidently,</tspan> in neat handwriting and</tspan>
  <tspan x="120" dy="40">well-ordered sentences…</tspan>
</text>

<!-- Paragraph 2 -->
<text x="950" y="594" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">ثم يقرأ المصحح، فيجد الكلام كله <tspan font-weight="bold" fill="#17457f">خطأ!</tspan></tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">Then the teacher reads it and finds</tspan>
  <tspan x="120" dy="40">it is all <tspan font-weight="bold" fill="#17457f">wrong!</tspan></tspan>
</text>

<!-- Paragraph 3 -->
<text x="950" y="754" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" font-weight="normal" fill="#225f9c">
  <tspan x="950" dy="0">هذه هي <tspan font-weight="bold" fill="#c0392b">الهلوسة:</tspan> كلام يبدو <tspan font-weight="bold" fill="#17457f">مقنعًا وواثقًا،</tspan></tspan>
  <tspan x="950" dy="40">لكنه خاطئ أو مختلق.</tspan>
</text>
<text x="120" y="834" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" font-weight="normal" fill="#152b42">
  <tspan x="120" dy="0">This is <tspan font-weight="bold" fill="#c0392b">hallucination:</tspan> text that sounds</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">convincing and confident,</tspan></tspan>
  <tspan x="120" dy="40">but is wrong or made up.</tspan>
</text>
</svg>
