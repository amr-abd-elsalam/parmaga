<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">
  <tspan x="540" dy="0">المحطة 1:</tspan>
  <tspan x="540" dy="48">كيف يعرف الكمبيوتر القطة؟</tspan>
</text>
<text x="540" y="202" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" fill="#152b42">Stop 1: How Does a Computer Know a Cat?</text>

<text x="950" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">تحدٍّ: اكتب <tspan font-weight="bold" fill="#c0392b">قواعد</tspan> تجعل الكمبيوتر يفرّق</tspan>
  <tspan x="950" dy="40">بين صورة <tspan fill="#c96a1b">قطة</tspan> وصورة <tspan fill="#c96a1b">كلب.</tspan></tspan>
</text>
<text x="120" y="394" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Challenge: Write <tspan font-weight="bold" fill="#c0392b">rules</tspan> that</tspan>
  <tspan x="120" dy="40">help a computer tell a <tspan fill="#c96a1b">cat</tspan> photo</tspan>
  <tspan x="120" dy="40">from a <tspan fill="#c96a1b">dog</tspan> photo.</tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">أربع أرجل وذيل وأذنان؟</tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#17457f">الكلب أيضًا</tspan> عنده أربع أرجل وذيل وأذنان!</tspan>
</text>
<text x="120" y="634" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Four legs, a tail, and ears?</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">A dog also</tspan> has four legs,</tspan>
  <tspan x="120" dy="40">a tail, and ears!</tspan>
</text>

<text x="950" y="794" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">وكلما أضفت <tspan font-weight="bold" fill="#17457f">قاعدة،</tspan> ظهر <tspan font-weight="bold" fill="#c0392b">استثناء:</tspan></tspan>
  <tspan x="950" dy="40">قطة بلا ذيل، أو كلب صغير يشبه القطة.</tspan>
</text>
<text x="120" y="874" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Every new <tspan font-weight="bold" fill="#17457f">rule</tspan> meets an <tspan font-weight="bold" fill="#c0392b">exception:</tspan></tspan>
  <tspan x="120" dy="40">a cat without a tail, or a small dog</tspan>
  <tspan x="120" dy="40">that looks like a cat.</tspan>
</text>

<text x="638" y="1132" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">أربع أرجل</text>
<text x="318" y="1132" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Four legs</text>
<text x="638" y="1180" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">ذيل</text>
<text x="318" y="1180" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Tail</text>
<text x="638" y="1228" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">أذنان</text>
<text x="318" y="1228" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Ears</text>
</svg>
