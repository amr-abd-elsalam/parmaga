        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#1a4f8a">الذكاء الاصطناعي التوليدي</text>

  <text x="118" y="140"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#13293f">Generative AI</text>

  <text x="955" y="250"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="28"
        fill="#225f9c">الذكاء الاصطناعي التوليدي</text>

  <text x="630" y="292"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="25"
        fill="#225f9c">Generative AI (GenAI)</text>

  <text x="955" y="334"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, 'Segoe UI', sans-serif"
        font-size="28"
        fill="#225f9c">
    <tspan x="955" dy="0">تقنية تستخدم التعلم العميق</tspan>
    <tspan x="955" dy="42">لإنشاء بيانات جديدة، مثل</tspan>
    <tspan x="955" dy="42">النصوص والصور والصوت والبرامج.</tspan>
    <tspan x="955" dy="42">تعتمد المخرجات الجديدة على</tspan>
    <tspan x="955" dy="42">الأنماط التي تعلمها النظام</tspan>
    <tspan x="955" dy="42">من بيانات التدريب.</tspan>
    <tspan x="955" dy="42">من أمثلته ChatGPT وأنظمة</tspan>
    <tspan x="955" dy="42">توليد الصور.</tspan>
  </text>

  <text x="115" y="250"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="'Segoe Print', 'Comic Sans MS', Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="115" dy="0">Generative AI (GenAI) is</tspan>
    <tspan x="115" dy="36">a technology that uses</tspan>
    <tspan x="115" dy="36">deep learning to generate</tspan>
    <tspan x="115" dy="36">new data, such as text,</tspan>
    <tspan x="115" dy="36">images, audio, and</tspan>
    <tspan x="115" dy="36">programs. Its new outputs</tspan>
    <tspan x="115" dy="36">are based on patterns the</tspan>
    <tspan x="115" dy="36">system learned from</tspan>
    <tspan x="115" dy="36">training data. Examples</tspan>
    <tspan x="115" dy="36">include ChatGPT and</tspan>
    <tspan x="115" dy="36">image-generation systems.</tspan>
  </text>

