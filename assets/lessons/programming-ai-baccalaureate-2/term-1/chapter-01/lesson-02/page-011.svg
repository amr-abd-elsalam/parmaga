<!-- Text -->
<text x="935" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#17457f">مصطلحات أساسية</text>
<text x="140" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#17457f">KEY TERMS</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">البيانات المصنفة</tspan> <tspan font-weight="bold" fill="#c0392b">Labeled Data</tspan> — أمثلة</tspan>
  <tspan x="935" dy="40">معها <tspan font-weight="bold" fill="#2e7d32">الإجابة الصحيحة،</tspan> مثل صورة</tspan>
  <tspan x="935" dy="40">مكتوب عليها «ورقة مصابة».</tspan>
</text>
<text x="140" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Labeled data</tspan> — examples that come</tspan>
  <tspan x="140" dy="40">with the <tspan font-weight="bold" fill="#2e7d32">correct answer,</tspan> like a photo</tspan>
  <tspan x="140" dy="40">marked "diseased leaf".</tspan>
</text>

<text x="935" y="474" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0"><tspan font-weight="bold" fill="#c0392b">النمط</tspan> <tspan font-weight="bold" fill="#c0392b">Pattern</tspan> — انتظام <tspan font-weight="bold" fill="#17457f">يتكرر</tspan></tspan>
  <tspan x="935" dy="40">في البيانات، مثل روابط غريبة وعبارات</tspan>
  <tspan x="935" dy="40">استعجال في الرسائل المزعجة.</tspan>
</text>
<text x="140" y="594" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0"><tspan font-weight="bold" fill="#c0392b">Pattern</tspan> — something that <tspan font-weight="bold" fill="#17457f">repeats</tspan></tspan>
  <tspan x="140" dy="40">in data, like strange links</tspan>
  <tspan x="140" dy="40">and urgent words in spam messages.</tspan>
</text>

<text x="905" y="788" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#225f9c">ورقة سليمة</text>
<text x="640" y="828" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#152b42">Healthy leaf</text>
