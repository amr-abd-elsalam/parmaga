  <text x="955" y="212"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" font-weight="bold" fill="#1b4f8a">أولًا: أجب عن الأسئلة —</text>

  <text x="130" y="212"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#152b42">Answer the Questions</text>

  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#1e7d45"
     direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="938" y="260">(1</text>
    <text x="938" y="360">(2</text>
    <text x="938" y="460">(3</text>
    <text x="938" y="560">(4</text>
  </g>

  <g font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="27" fill="#1b4f8a"
     direction="rtl" unicode-bidi="plaintext" text-anchor="start">
    <text x="926" y="260">ما هو الذكاء الاصطناعي؟</text>
    <text x="926" y="360">ما هو تعلّم الآلة؟</text>
    <text x="926" y="460">ما هو التعلّم العميق؟</text>
    <text x="926" y="560">ما هو الذكاء الاصطناعي التوليدي؟</text>
  </g>

  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="25" fill="#152b42"
     direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="150" y="290">What is Artificial Intelligence?</text>
    <text x="150" y="390">What is Machine Learning?</text>
    <text x="150" y="490">What is Deep Learning?</text>
    <text x="150" y="590">What is Generative AI?</text>
  </g>

  <text x="955" y="676"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26" font-weight="bold" fill="#1b4f8a">ثانيًا: اختر الإجابة الصحيحة —</text>

  <text x="130" y="676"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#152b42">Choose the Correct Answer</text>

  <text x="938" y="722"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#1e7d45">(1</text>

  <text x="926" y="722"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#1b4f8a">ما العلاقة الصحيحة بين هذه المفاهيم؟</text>

  <text x="150" y="752"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">What is the correct relationship between them?</text>

  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42"
     direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="175" y="788">A. AI &gt; Deep Learning &gt; Machine Learning &gt; Generative AI</text>
    <text x="175" y="818">B. Machine Learning &gt; AI &gt; Generative AI &gt; Deep Learning</text>
    <text x="175" y="848">C. AI &gt; Machine Learning &gt; Deep Learning &gt; Generative AI</text>
    <text x="175" y="878">D. Generative AI &gt; Deep Learning &gt; Machine Learning &gt; AI</text>
  </g>

  <text x="938" y="918"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25" fill="#1e7d45">(2</text>

  <text x="926" y="918"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="27" fill="#1b4f8a">أيٌّ مما يلي مثال على الذكاء الاصطناعي التوليدي؟</text>

  <text x="150" y="948"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24" fill="#152b42">Which of the following is an example of Generative AI?</text>

  <g font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="23" fill="#152b42"
     direction="ltr" unicode-bidi="plaintext" text-anchor="start">
    <text x="175" y="984">A. ChatGPT</text>
    <text x="560" y="984">B. Image-generation AI</text>
    <text x="175" y="1014">C. Spam filter</text>
    <text x="560" y="1014">D. Audio-generation AI</text>
  </g>

  <text x="955" y="1082"
        direction="rtl" unicode-bidi="plaintext" text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="24" font-weight="bold" fill="#1b4f8a">مفتاح الإجابة</text>

  <text x="130" y="1082"
        direction="ltr" unicode-bidi="plaintext" text-anchor="start"
