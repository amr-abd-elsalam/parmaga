  <polygon points="-12,32 0,50 12,32" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-10" y="22" width="20" height="12" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="30" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -30 -4 C -32 -30, -10 -38, 6 -36 C 24 -34, 32 -20, 30 -4 C 20 -18, -8 -22, -30 -4 Z" fill="#2b211c"/>
  <circle cx="-4" cy="2" r="3.5" fill="#22303f"/>
  <circle cx="12" cy="2" r="3.5" fill="#22303f"/>
  <path d="M -3 14 Q 5 21 13 14" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Left team: student B (girl, speaking with raised hand) -->
<g transform="translate(310 950)">
  <rect x="-40" y="30" width="80" height="90" rx="30" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -34 4 Q -40 40 -30 44 L 30 44 Q 40 40 34 4 Z" fill="#17457f" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
