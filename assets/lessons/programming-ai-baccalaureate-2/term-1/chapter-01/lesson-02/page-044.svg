  <ellipse cx="2" cy="4" rx="22" ry="25" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-4" cy="0" r="3.5" fill="#22303f"/>
  <circle cx="11" cy="0" r="3.5" fill="#22303f"/>
  <ellipse cx="4" cy="14" rx="6" ry="5" fill="#22303f"/>
  <g transform="rotate(25 36 48)">
    <rect x="28" y="-4" width="16" height="56" rx="8" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
    <circle cx="36" cy="-8" r="9" fill="#d59f6f" stroke="#22303f" stroke-width="2.5"/>
  </g>
</g>

<!-- Right team: student C (girl) -->
<g transform="translate(770 950)">
  <rect x="-40" y="30" width="80" height="90" rx="30" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -34 4 Q -40 40 -30 44 L 30 44 Q 40 40 34 4 Z" fill="#c96a1b" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="0" cy="-2" r="34" fill="#c96a1b" stroke="#22303f" stroke-width="2.5"/>
  <ellipse cx="-2" cy="4" rx="22" ry="25" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-11" cy="0" r="3.5" fill="#22303f"/>
  <circle cx="4" cy="0" r="3.5" fill="#22303f"/>
  <path d="M -12 12 Q -4 20 4 12" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Right team: student D (boy) -->
<g transform="translate(880 950)">
  <rect x="-40" y="30" width="80" height="90" rx="30" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <polygon points="-12,32 0,50 12,32" fill="#ffffff" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="-10" y="22" width="20" height="12" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="0" cy="0" r="30" fill="#b57e50" stroke="#22303f" stroke-width="2.5"/>
  <path d="M -30 -4 C -32 -20, -24 -34, -6 -36 C 10 -38, 32 -30, 30 -4 C 8 -22, -20 -18, -30 -4 Z" fill="#2b211c"/>
  <circle cx="-12" cy="2" r="3.5" fill="#22303f"/>
  <circle cx="4" cy="2" r="3.5" fill="#22303f"/>
  <path d="M -13 14 Q -5 21 3 14" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Team desks -->
<rect x="145" y="1040" width="220" height="140" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
<rect x="140" y="1032" width="230" height="14" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="175" y="1070" width="160" height="10" rx="5" fill="#2f7fb5"/>
<rect x="715" y="1040" width="220" height="140" fill="#b07a45" stroke="#22303f" stroke-width="2.5"/>
<rect x="710" y="1032" width="230" height="14" rx="4" fill="#7d4f28" stroke="#22303f" stroke-width="2.5"/>
<rect x="745" y="1070" width="160" height="10" rx="5" fill="#2e7d32"/>

<rect x="125" y="800" width="830" height="420" rx="22" fill="none" stroke="#22303f" stroke-width="2.5"/>

<!-- Icon: two figures (header line) -->
<g transform="translate(130 100)">
  <circle cx="32" cy="12" r="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M20 42 Q 20 24 32 24 Q 44 24 44 42 Z" fill="#2e7d32" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="14" cy="10" r="8" fill="#e8b98d" stroke="#22303f" stroke-width="2.5"/>
  <path d="M2 40 Q 2 22 14 22 Q 26 22 26 40 Z" fill="#2f7fb5" stroke="#22303f" stroke-width="2.5" stroke-linejoin="round"/>
</g>

<!-- Face: thinking (beside English paragraph 1) -->
<g transform="translate(880 440)">
  <circle cx="0" cy="0" r="26" fill="#ffd24a" stroke="#22303f" stroke-width="2.5"/>
  <circle cx="-9" cy="-6" r="3.5" fill="#22303f"/>
  <circle cx="9" cy="-6" r="3.5" fill="#22303f"/>
  <path d="M -8 11 L 8 9" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
  <path d="M 4 -14 L 14 -17" fill="none" stroke="#22303f" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Icon: check badge (beside English paragraph 2) -->
<g transform="translate(850 708)">
  <circle cx="24" cy="24" r="22" fill="#2e7d32" stroke="#22303f" stroke-width="2.5"/>
  <path d="M14 25 L21 32 L35 17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">محكمة الذكاء الاصطناعي</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The AI court</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">فريق يدافع عن السماح <tspan font-weight="bold" fill="#c0392b">بالذكاء الاصطناعي</tspan></tspan>
  <tspan x="950" dy="40"><tspan font-weight="bold" fill="#c0392b">التوليدي</tspan> في الواجبات، وفريق يعارض،</tspan>
  <tspan x="950" dy="40">ولكل فريق <tspan fill="#c96a1b">دقيقتان.</tspan></tspan>
</text>
<text x="120" y="354" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">One team argues for allowing</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#c0392b">generative AI</tspan> in homework,</tspan>
  <tspan x="120" dy="40">the other argues against;</tspan>
  <tspan x="120" dy="40">each team has <tspan fill="#c96a1b">two minutes.</tspan></tspan>
</text>

<text x="950" y="554" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">ثم يتفق الفصل على <tspan font-weight="bold" fill="#17457f">قاعدة واحدة،</tspan> مثل:</tspan>
  <tspan x="950" dy="40">«مسموح بشرط <tspan font-weight="bold" fill="#2e7d32">التحقق</tspan> من المصادر</tspan>
  <tspan x="950" dy="40">وذكر الأداة».</tspan>
</text>
<text x="120" y="674" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">Then the class agrees on <tspan font-weight="bold" fill="#17457f">one rule,</tspan></tspan>
  <tspan x="120" dy="40">like: &quot;Allowed, as long as you <tspan font-weight="bold" fill="#2e7d32">check</tspan></tspan>
  <tspan x="120" dy="40">the sources and name the tool.&quot;</tspan>
</text>
</svg>
