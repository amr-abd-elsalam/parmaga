<!-- Text -->
<text x="540" y="116" direction="rtl" unicode-bidi="plaintext" text-anchor="middle" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="44" font-weight="bold" fill="#1a4f8a">نموذج إجابة سؤال الست درجات</text>
<text x="540" y="154" direction="ltr" unicode-bidi="plaintext" text-anchor="middle" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="28" font-weight="normal" fill="#152b42">Model Answer: The 6-Mark Question</text>

<text x="935" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">السؤال</text>
<text x="140" y="274" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">The question</text>

<text x="935" y="314" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="935" dy="0">حلّل العلاقة بين الذكاء الاصطناعي</tspan>
  <tspan x="935" dy="40">والتعلّم الآلي والتعلم العميق</tspan>
  <tspan x="935" dy="40">والذكاء الاصطناعي التوليدي، مستخدمًا</tspan>
  <tspan x="935" dy="40">فكرة <tspan font-weight="bold" fill="#17457f">الفئات المتداخلة،</tspan></tspan>
  <tspan x="935" dy="40">ومثالًا على كل منها. <tspan fill="#c96a1b">[6 درجات]</tspan></tspan>
</text>
<text x="140" y="514" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="140" dy="0">Analyze the relationship between AI,</tspan>
  <tspan x="140" dy="40">machine learning, deep learning, and</tspan>
  <tspan x="140" dy="40">generative AI, using the idea</tspan>
  <tspan x="140" dy="40">of <tspan font-weight="bold" fill="#17457f">nested categories</tspan> and one example</tspan>
  <tspan x="140" dy="40">of each. <tspan fill="#c96a1b">[6 marks]</tspan></tspan>
</text>

<!-- Illustration labels -->
<text x="950" y="846" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">الترجمة</text>
<text x="570" y="880" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Translation</text>
<text x="950" y="946" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">مرشح الرسائل المزعجة</text>
<text x="570" y="980" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Spam filter</text>
<text x="950" y="1046" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">التعرف على المشاة</text>
<text x="570" y="1080" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Pedestrian recognition</text>
<text x="950" y="1146" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="26" fill="#3d5a76">توليد النصوص</text>
<text x="570" y="1180" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="26" fill="#3d5a76">Text generation</text>
