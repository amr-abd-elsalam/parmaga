  <line x1="80" y1="678" x2="1000" y2="678" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="716" x2="1000" y2="716" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="754" x2="1000" y2="754" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="792" x2="1000" y2="792" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="830" x2="1000" y2="830" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="868" x2="1000" y2="868" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="906" x2="1000" y2="906" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="944" x2="1000" y2="944" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="982" x2="1000" y2="982" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1020" x2="1000" y2="1020" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1058" x2="1000" y2="1058" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1096" x2="1000" y2="1096" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1134" x2="1000" y2="1134" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1172" x2="1000" y2="1172" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1210" x2="1000" y2="1210" stroke="#cfe0ef" stroke-width="1.2"/>
  <line x1="80" y1="1248" x2="1000" y2="1248" stroke="#cfe0ef" stroke-width="1.2"/>

  <rect x="67" y="58" width="946" height="1252" fill="none" stroke="#c0392b" stroke-width="2.2"/>

  <rect x="88" y="160" width="904" height="778" rx="16" fill="#eff8f0" opacity="0.96" stroke="#6fae83" stroke-width="2"/>

  <line x1="124" y1="376" x2="950" y2="376" stroke="#a9c6dd" stroke-width="1.8"/>

  <line x1="124" y1="554" x2="936" y2="554" stroke="#4f9d6b" stroke-width="1.8"/>
  <circle cx="948" cy="554" r="6" fill="#4f9d6b"/>
  <line x1="124" y1="590" x2="936" y2="590" stroke="#c0392b" stroke-width="1.8"/>
  <circle cx="948" cy="590" r="6" fill="#c0392b"/>

  <rect x="118" y="784" width="838" height="138" rx="12" fill="#ffffff" opacity="0.86" stroke="#2e8b57" stroke-width="2"/>
  <line x1="140" y1="824" x2="934" y2="824" stroke="#8ec3a4" stroke-width="1.6"/>
  <line x1="176" y1="862" x2="934" y2="862" stroke="#8ec3a4" stroke-width="1.6"/>
  <line x1="176" y1="900" x2="934" y2="900" stroke="#8ec3a4" stroke-width="1.6"/>

  <rect x="95" y="956" width="890" height="208" rx="14" fill="#fdf6d8" stroke="#d3ba55" stroke-width="2"/>

  <text x="540" y="98"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="38"
        font-weight="bold"
        fill="#0d4a86">فكّر كمهندس: ابحث ثم قرر</text>

  <text x="540" y="138"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">Think as an Engineer — Investigate and Decide</text>

  <text x="955" y="200"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#0d4a86">1. ابحث</text>

  <text x="118" y="200"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#14405f">— Investigate</text>

  <text x="955" y="240"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5f9e">
    <tspan x="955" dy="0">ابحث عن حالة موثقة واحدة لهلوسة الذكاء الاصطناعي</tspan>
    <tspan x="955" dy="36">التوليدي، وسجّل مصدرها.</tspan>
  </text>

  <text x="118" y="310"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="118" dy="0">Find one documented case of generative AI</tspan>
    <tspan x="118" dy="30">hallucination, and record its source.</tspan>
  </text>

  <text x="955" y="414"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#0d4a86">2. قيّم الأمر</text>

  <text x="118" y="414"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#14405f">— Weigh It Up</text>

  <text x="955" y="454"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5f9e">
    <tspan x="955" dy="0">اكتب فائدة واحدة وخطرًا واحدًا للطالب وللمعلم.</tspan>
  </text>

  <text x="118" y="488"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="118" dy="0">Write one benefit and one risk</tspan>
    <tspan x="118" dy="30">for the student and the teacher.</tspan>
  </text>

  <text x="955" y="628"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        font-weight="bold"
        fill="#1f7a45">3. اتخذ قرارًا</text>

  <text x="118" y="628"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f7a45">— Decide</text>

  <text x="955" y="668"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="30"
        fill="#1a5f9e">
    <tspan x="955" dy="0">قرّر هل يُسمح باستخدام الذكاء الاصطناعي التوليدي في</tspan>
    <tspan x="955" dy="36">الواجبات المنزلية، وأوصِ بقاعدة واحدة مع سببين.</tspan>
  </text>

  <text x="118" y="738"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="26"
        fill="#152b42">
    <tspan x="118" dy="0">Decide whether generative AI should be allowed in</tspan>
    <tspan x="118" dy="30">homework, and recommend one rule with two reasons.</tspan>
  </text>

  <text x="136" y="856"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#1f7a45">1.</text>

  <text x="136" y="894"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="24"
        fill="#1f7a45">2.</text>

  <text x="953" y="998"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="26"
        fill="#1a5f9e">
    <tspan x="953" dy="0">من الفوائد المحتملة السرعة، ومن المخاطر احتمال الحصول على</tspan>
    <tspan x="953" dy="34">معلومات خاطئة أو غير مدعومة؛ لذلك يجب التحقق من المخرجات ومصادرها.</tspan>
  </text>

  <text x="127" y="1070"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="25"
        fill="#152b42">
    <tspan x="127" dy="0">One possible benefit is speed, and one risk is receiving</tspan>
    <tspan x="127" dy="30">incorrect or unsupported information; therefore, outputs</tspan>
    <tspan x="127" dy="30">and sources must be checked.</tspan>
  </text>

</svg>
