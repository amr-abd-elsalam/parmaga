  <path d="M0 250 C 300 200, 780 320, 1080 260" stroke="#5e3c1a" stroke-width="16" fill="none" opacity="0.07"/>
  <path d="M0 1080 C 320 1140, 760 1010, 1080 1090" stroke="#5e3c1a" stroke-width="14" fill="none" opacity="0.06"/>

  <rect x="42" y="34" width="1012" height="1302" rx="8" fill="#3a2411" opacity="0.20"/>
  <rect x="34" y="24" width="1012" height="1302" rx="8" fill="url(#paperGrad)"/>

