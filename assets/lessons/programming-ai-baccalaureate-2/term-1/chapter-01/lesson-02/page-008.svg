<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1350"
     viewBox="0 0 1080 1350"
     preserveAspectRatio="xMidYMid meet"
     style="width:100%;height:auto;max-width:1080px;display:block;margin:0 auto;">

  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a6836"/>
      <stop offset="50%" stop-color="#82552a"/>
      <stop offset="100%" stop-color="#6a4522"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#faf5e8"/>
    </linearGradient>
  </defs>

  <!-- 1) الخلفية الخشبية البسيطة -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#woodGrad)"/>
  <path d="M0 250 C 260 210, 640 300, 1080 240" stroke="#5c3a1c" stroke-width="16" fill="none" opacity="0.14"/>
  <path d="M0 1080 C 300 1130, 700 1030, 1080 1090" stroke="#5c3a1c" stroke-width="14" fill="none" opacity="0.12"/>

  <!-- 2) ظل الورقة ثم الورقة -->
  <rect x="42" y="40" width="1012" height="1290" rx="8" fill="#3a2412" opacity="0.28"/>
  <rect x="34" y="30" width="1012" height="1290" rx="8" fill="url(#paperGrad)"/>

  <!-- 3) سطور الكراسة الزرقاء الباهتة -->
  <g stroke="#cfe0f0" stroke-width="1.6">
    <line x1="70" y1="110"  x2="1010" y2="110"/>
    <line x1="70" y1="150"  x2="1010" y2="150"/>
    <line x1="70" y1="190"  x2="1010" y2="190"/>
    <line x1="70" y1="230"  x2="1010" y2="230"/>
    <line x1="70" y1="270"  x2="1010" y2="270"/>
    <line x1="70" y1="310"  x2="1010" y2="310"/>
    <line x1="70" y1="350"  x2="1010" y2="350"/>
    <line x1="70" y1="390"  x2="1010" y2="390"/>
    <line x1="70" y1="430"  x2="1010" y2="430"/>
    <line x1="70" y1="470"  x2="1010" y2="470"/>
    <line x1="70" y1="510"  x2="1010" y2="510"/>
    <line x1="70" y1="550"  x2="1010" y2="550"/>
    <line x1="70" y1="590"  x2="1010" y2="590"/>
    <line x1="70" y1="630"  x2="1010" y2="630"/>
    <line x1="70" y1="670"  x2="1010" y2="670"/>
    <line x1="70" y1="710"  x2="1010" y2="710"/>
    <line x1="70" y1="750"  x2="1010" y2="750"/>
    <line x1="70" y1="790"  x2="1010" y2="790"/>
    <line x1="70" y1="830"  x2="1010" y2="830"/>
    <line x1="70" y1="870"  x2="1010" y2="870"/>
    <line x1="70" y1="910"  x2="1010" y2="910"/>
    <line x1="70" y1="950"  x2="1010" y2="950"/>
    <line x1="70" y1="990"  x2="1010" y2="990"/>
    <line x1="70" y1="1030" x2="1010" y2="1030"/>
    <line x1="70" y1="1070" x2="1010" y2="1070"/>
    <line x1="70" y1="1110" x2="1010" y2="1110"/>
    <line x1="70" y1="1150" x2="1010" y2="1150"/>
  </g>

  <!-- 4) الحد الأحمر الخارجي الوحيد -->
  <rect x="67" y="66" width="946" height="1110" fill="none" stroke="#c62828" stroke-width="2.4"/>

  <!-- 5) خلفيات صناديق النشاط ذات الحدود الخضراء -->
  <rect x="96" y="212" width="888" height="471" rx="14" fill="#fdfbf3" stroke="#2e8b57" stroke-width="3"/>
  <rect x="96" y="711" width="888" height="436" rx="14" fill="#fdfbf3" stroke="#2e8b57" stroke-width="3"/>

  <!-- 6) أسطر الإجابة الفارغة -->
  <g stroke="#a9bed4" stroke-width="1.6">
    <line x1="130" y1="579"  x2="950" y2="579"/>
    <line x1="130" y1="619"  x2="950" y2="619"/>
    <line x1="130" y1="659"  x2="950" y2="659"/>
    <line x1="130" y1="1043" x2="950" y2="1043"/>
    <line x1="130" y1="1083" x2="950" y2="1083"/>
    <line x1="130" y1="1123" x2="950" y2="1123"/>
  </g>

  <!-- 7) النصوص التعليمية -->

  <!-- العنوان العربي -->
  <text x="540"
        y="132"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="54"
        font-weight="bold"
        fill="#1a4f8a">توقف وفكّر</text>

  <!-- العنوان الإنجليزي -->
  <text x="540"
        y="180"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="middle"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="34"
        fill="#152b42">Pause and Think</text>

  <!-- الصندوق الأول: الفقرة العربية -->
  <text x="952"
        y="256"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1c5fa8">
    <tspan x="952" dy="0">تُعد مرشحات الرسائل المزعجة وأنظمة التوصية</tspan>
    <tspan x="952" dy="37">بالمنتجات مثالين على التعلم الآلي، لكنهما يؤديان</tspan>
    <tspan x="952" dy="37">مهمتين مختلفتين. من منظور طريقة عمل الذكاء</tspan>
    <tspan x="952" dy="37">الاصطناعي، وضّح شيئًا واحدًا مشتركًا بين التطبيقين.</tspan>
  </text>

  <!-- الصندوق الأول: الفقرة الإنجليزية -->
  <text x="128"
        y="409"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="128" dy="0">Spam filters and product recommendation systems</tspan>
    <tspan x="128" dy="33">are both examples of machine learning, but they</tspan>
    <tspan x="128" dy="33">perform different tasks. From the perspective of</tspan>
    <tspan x="128" dy="33">how AI works, explain one thing these two</tspan>
    <tspan x="128" dy="33">applications have in common.</tspan>
  </text>

  <!-- الصندوق الثاني: الفقرة العربية -->
  <text x="952"
        y="753"
        direction="rtl"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Tahoma, Arial, Segoe UI, sans-serif"
        font-size="28"
        fill="#1c5fa8">
    <tspan x="952" dy="0">يحتاج التعلم العميق عادةً إلى بيانات كثيرة</tspan>
    <tspan x="952" dy="37">ليتعلم الأنماط المعقدة. لماذا قد يواجه نظام</tspan>
    <tspan x="952" dy="37">ذكاء اصطناعي صعوبة في التعامل مع شيء نادرًا</tspan>
    <tspan x="952" dy="37">ما ظهر في بيانات التدريب<tspan fill="#c62828">؟</tspan></tspan>
  </text>

  <!-- الصندوق الثاني: الفقرة الإنجليزية -->
  <text x="128"
        y="906"
        direction="ltr"
        unicode-bidi="plaintext"
        text-anchor="start"
        font-family="Segoe Print, Comic Sans MS, Arial, sans-serif"
        font-size="27"
        fill="#152b42">
    <tspan x="128" dy="0">Deep learning usually needs large amounts of</tspan>
    <tspan x="128" dy="33">data to learn complex patterns. Why might an</tspan>
    <tspan x="128" dy="33">AI system struggle with something that has</tspan>
    <tspan x="128" dy="33">rarely appeared in its training data<tspan fill="#c62828">?</tspan></tspan>
  </text>

</svg>
