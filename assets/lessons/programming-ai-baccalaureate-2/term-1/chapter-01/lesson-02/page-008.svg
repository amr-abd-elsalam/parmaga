<!-- Text -->
<text x="950" y="154" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#c0392b">مثال: مرشح الرسائل المزعجة</text>
<text x="120" y="194" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="31" font-weight="bold" fill="#c0392b">Example: The spam filter</text>

<text x="950" y="234" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#17457f">بالقواعد:</tspan> «إذا وُجدت عبارة</tspan>
  <tspan x="950" dy="40"><tspan fill="#c96a1b">"مبروك كسبت"</tspan> فالرسالة مزعجة».</tspan>
</text>
<text x="120" y="314" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">With <tspan font-weight="bold" fill="#17457f">rules:</tspan> "If the message contains</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">'Congrats, you won',</tspan> it is spam."</tspan>
</text>

<text x="950" y="434" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0">فيكتب المحتال <tspan fill="#c96a1b">«مبرووك كسـبت»،</tspan> <tspan font-weight="bold" fill="#17457f">وتمرّ رسالته!</tspan></tspan>
</text>
<text x="120" y="474" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">So the scammer writes</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">"Congratss, you wonn",</tspan> and the message</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#17457f">gets through!</tspan></tspan>
</text>

<text x="950" y="634" direction="rtl" unicode-bidi="plaintext" text-anchor="start" font-family="Tahoma, Arial, Segoe UI, sans-serif" font-size="30" fill="#225f9c">
  <tspan x="950" dy="0"><tspan font-weight="bold" fill="#c0392b">بالتعلّم:</tspan> نعطي النموذج آلاف الرسائل</tspan>
  <tspan x="950" dy="40">المصنّفة <tspan fill="#c96a1b">«مزعجة» و«سليمة»،</tspan></tspan>
  <tspan x="950" dy="40">فيلتقط <tspan font-weight="bold" fill="#2e7d32">أنماطًا</tspan> لم نكن لنكتبها بأيدينا.</tspan>
</text>
<text x="120" y="754" direction="ltr" unicode-bidi="plaintext" text-anchor="start" font-family="Segoe Print, Comic Sans MS, Arial, sans-serif" font-size="29" fill="#152b42">
  <tspan x="120" dy="0">With <tspan font-weight="bold" fill="#c0392b">learning:</tspan> we give the model</tspan>
  <tspan x="120" dy="40">thousands of messages labeled</tspan>
  <tspan x="120" dy="40"><tspan fill="#c96a1b">"spam" or "not spam",</tspan> and it picks up</tspan>
  <tspan x="120" dy="40"><tspan font-weight="bold" fill="#2e7d32">patterns</tspan> we could never write by hand.</tspan>
</text>
</svg>
