<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>الصفحة غير موجودة | Parmaga</title>

  <meta name="robots" content="noindex">

  <link rel="canonical" href="https://parmaga.com/">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Tahoma, sans-serif;
      line-height: 1.7;
      text-align: center;
    }

    main {
      width: min(100%, 620px);
      padding: 32px 24px;
      border: 1px solid #333333;
      border-radius: 16px;
      background: #111111;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.3;
    }

    p {
      margin: 0 0 24px;
      color: #d6d6d6;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 1px solid #737373;
      border-radius: 10px;
      background: #171717;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:first-child {
      border-color: #ffffff;
      background: #ffffff;
      color: #050505;
    }

    a:hover,
    a:focus-visible {
      border-color: #ffffff;
    }

    a:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير موجود، ويمكنك العودة إلى الموقع أو الوصول إلى أماكن التواجد.</p>
    <nav class="links" aria-label="روابط الرجوع">
      <a href="https://parmaga.com/">الصفحة الرئيسية</a>
      <a href="https://parmaga.com/#centers">أماكن التواجد</a>
    </nav>
  </main>
</body>
</html>
